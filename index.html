219,"q","ابن القيم","","« وههنا أمرٌ عجيبٌ يحصل لمن تفقَّه قلبه في معاني الأسماء والصِّفات، وفي معاني القرآن، وخالط بشاشة الإيمان بها قلبه، بحيث يرى لكُلِّ اسمٍ وصفةٍ موضعًا من صلاته، ومحلًّا منها. فإنَّه إذا انتصب قائمًا بين يَدَي الرَّب رحمه الله شاهد بقلبه قيُّومِيَّته، وإذا قال: الله أكبر شاهد كبرياءه »","وقال ابن القيم رحمه الله:","","",["كتاب الصلاة (344)."],[86],0],[220,"q","ابن القيم","","« وإذا قال: \"سبحانك اللَّهم وبحمدك، وتبارك اسمك، وتعالى جدُّك، ولا إله غيرك\" شاهد بقلبه ربًّا منزَّهًا عن كُلِّ عيبٍ، سالمًا من كُلِّ نقصٍ، محمودًا بكلِّ حمد. فحَمْدُه يتضمَّنُ وصْفه بكُلِّ كمالٍ، وذلك يستلزم براءَتَه من كُلِّ نقصٍ، تبارك اسمه. و \"تعالى جده\" أي: ارتفعت عظمتُه، وجلَّت فوق كُلِّ عظمةٍ، وعلا شأنُه على كلِّ شأنٍ، وقَهَر سلطانُه على كُلِّ سلطانٍ. فتعالى جدُّه أن يكون معه شريكٌ في ملكه وربوبيته، أو في إلهيَّته، أو في أفعاله، أو في صفاته، كما قال مؤمنو الجنِّ: الآية: الجن: 3 »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (344-345)."],[88],0],[221,"q","ابن القيم","","« فإذا قال: (أعوذ بالله من الشيطان الرجيم) فقد آوى إلى ركنه الشَّديد، واعتصم بحولِهِ وقوَّتِه من عدوِّه، الذي يريد أنْ يقطعه عن ربِّه، ويباعده عن قُرْبِه، ليكون أسوأ حالًا. فإذا قال: الآية: الفاتحة: 1 وقف هنيهةً يسيرةً ينتظر جواب ربِّه له، بقوله: «حمدني عبدي». فإذا قال: … انتظر الجواب بقوله: «أثْنى علَيَّ عبدي». فإذا قال: … انتظر جوابه: «يمجِّدُني عبدي». فيا لذَّة قلبه، وقُرَّة عينه، وسرور نفسه بقول ربِّه: «عَبْدِي» ثلاث مرَّاتٍ. فو الله لولا ما على القلوب من دخان الشَّهوات، وغيم النُّفُوس لاسْتُطِيرت فرحًا وسرورًا بقول ربِّها وفاطرها ومعبودها: «حمدني عبدي» و«أثنى عليَّ عبدي». و «مجدَّني عبدي» ثم يكون لقلبه مجالٌ في شهود هذه الأسماء الثلاثة، التي هي أصول الأسماء الحُسْنى، وهي: (الله) و (الرَّب) و (الرَّحمن). فشاهَدَ قلبُه من ذكر اسم (الله) رحمه الله: إلهًا معبودًا موحَّدًا مخوفًا، لا يستحقُّ العبادة غيره، ولا تنبغي إلَّا له، قد عَنَت له الوجوه، وخضعت له الموجودات، وخشعت له الأصوات، الآية: الإسراء: 44 الآية: الروم: 26. وكذلك خَلَق السَّموات والأرض وما بينهما، وخلق الجنَّ والأنس، والطَّير والوحش، والجنَّة والنَّار، وكذلك أرْسَل الرسل، وأنزل الكتب، وشرع الشَّرائع، وألزم العباد الأمر والنَّهي. وشاهد من ذكر اسمه …: قيُّومًا قام بنفسه، وقام به كل شيءٍ، فهو قائمٌ على كلِّ نفسٍ بخيرها وشرِّها، قد استوى على عرشه، وتفرَّد بتدبير ملكه. ثم يشهد عند ذكر اسم … رحمه الله: ربًّا محسنًا إلى خلقه بأنواع الإحسان متحبِّبًا إليهم بصُنُوف النعم، وسع كلَّ شيءٍ رحمة وعلمًا، وأوسع كلَّ مخلوقٍ نعمةً وفضلًا فوَسِعَت رحمتُه كلَّ شيءٍ، وسَعَت نعمتُه إلى كلِّ حيٍّ. فبَلَغَت رحمتُهُ حيث بلغ علمُه، فاستوى على عرشه برحمته، وخلق خلقه برحمته وأنزل كتبه برحمته، وأرسل رسله برحمته، وشرع شرائعه برحمته، وخلق الجنَّة برحمته والنَّار أيضًا برحمته، فإنَّها سوطه الذي يسوق به عباده المؤمنين إلى جنَّته، ويطهِّر بها أدران الموحِّدين من أهل معصيته، وسجنه الذي يسجن فيه أعداءه من خليقته. فإذا قال: … فهنا شهد المجد الذي لا يليق بسوى الملك الحقِّ المبين فيشهد ملكًا قاهرًا، قد دانت له الخليقة، وعَنَت له الوجوه، وذلَّت لعظمته الجبابرة وخضع لعِزَّته كلُّ عزيزٍ فيشهد بقلبه: مَلِيكًا على عَرشِ السَّماء مُهَيْمِنًا … لِعِزَّته تَعْنُو الوُجُوهُ وتسْجُدُ فإذا قال: … ففيهما سِرُّ الخلق والأمر، والدُّنيا والآخرة، وهي متضمنِّة لأّجّلِّ الغايات، وأفضل الوسائل. فأجلُّ الغايات عبوديَّتُه، وأفضل الوسائل إعانته، فلا معبود يستحقُّ العبادة إلَّا هو، ولا معين على عبادته غيره، فعبادته أعلى الغايات، وإعانته أجلُّ الوسائل. وقد أنزل الله عز وجل مئة كتابٍ وأربعة كتبٍ، جمع معانيها في أربعة كتبٍ، وهي التَّوراة والإنجيل والقرآن والزَّبور، وجمع معانيها في القرآن، وجمع معانيه في المفصَّل، وجمع معانيه في الفاتحة، وجمع معانيها في: …. وقد اشتملت هذه الكلمة على نَوْعَي التَّوحيد، وهما توحيد الرُّبُوبية، وتوحيد الإلهية وتضمَّنَت التعبُّد باسم (الرَّبِّ) واسم (الله) فهو يُعْبد بألوهيَّته، ويُستَعان بربوبيَّته، ويهدي إلى الصِّراط المستقيم برحمته. فكان أول السُّورة ذكر اسمه (الله) و (الرَّبِّ) و (الرَّحمن) مطابقًا لأَجَلِّ المطالبِ، من عبادته وإعانته وهدايته، وهو المتفرِّد بإعطاء ذلك كلِّه، لا يعين على عبادته سواه، ولا يهدي سواه. ثم يشهد الدَّاعي بقوله: … شدَّة فاقته وضرورته إلى هذه المسألة، التي ليس هو إلى شيٍء أشدّ فاقةً وحاجةً منه إليها البتَّة؛ فإنَّه محتاجٌ إليه في كُلِّ نَفَسٍ وطرفة عينٍ. وهذا المطلوب من هذا الدُّعاء لا يتمُّ إلَّا بالهداية إلى الطريق الموصل إليه سبحانه، والهداية فيه، وهي هداية التَّفصيل، وخلق القدرة على الفعل، وإرادته وتكوينه وتوفيقه لإيقاعه له على الوجه المرضيِّ المحبوب للرَّبِّ رحمه الله، وحفظه عليه من مفسداته حال فعله وبعد فعله. ولمَّا كان العبد مفتقرًا في كل حالٍ إلى هذه الهداية، في جميع ما يأتيه ويذَرُهُ، من أمورٍ قد أتاها على غير الهداية، فهو يحتاج إلى التوبة منها. وأمورٍ هُدِي إلى أصلها دون تفصيلها، أو هُدِي إليها من وجهٍ دون وجهٍ، فهو يحتاج إلى تمام الهداية فيها، ليزداد هُدًى. وأمورٍ هو يحتاج إلى أن يَحْصُل له من الهداية فيها بالمستقبل مثل ما حصل له في الماضي. وأمورٍ هو خالٍ عن اعتقادٍ فيها، فهو يحتاج إلى الهداية فيها، وأمورٍ لم يفعلها، فهو يحتاج إلى فعلها على وجه الهداية، وأمورٍ قد هُدِي إلى الاعتقاد الحقِّ والعمل الصَّواب فيها، فهو محتاجٌ إلى الثَّبات عليها. إلى غير ذلك من أنواع الهدايات التي فَرَضَ الله سبحانه عليه أنْ يسأله هذه الهداية في أفضل أحواله مرَّاتٍ متعدّدةً في اليوم واللَّيلة. ثم بيَّن أنَّ أهل هذه الهداية هم المختصّون بنعمته، دون … وهم الذين عرفوا الحق ولم يتَّبعُوه، ودون … وهم الذين عبدوا الله بغير علمٍ، فالطَّائفتان اشتركتا في القول على الله في خلقه، وأمره، وأسمائه وصفاته بغير علمٍ. فسبيل المُنْعَمِ عليه مغايرٌ لسبُل أهل الباطل كلِّها علمًا وعملًا. فلمَّا فرغ من هذا الثَّناء والدُّعاء والتَّوحيد شرع له أنْ يطبع على ذلك بطابعٍ من التَّأمين، يكون كالخاتم له، وافق فيه ملائكة السَّماء »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة لابن القيم (345-355)."],[89],0],[222,"h","النبي ﷺ","عائشة أم المؤمنين","«ما حَسَدتْكم اليَهودُ على شَيءٍ ما حَسَدتْكم على السَّلامِ والتأمينِ»","عن عائشة رضي الله عنها، قالت: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح الجامع (5613) وحسنه الوادعي في الصحيح المسند مما ليس في الصحيحين (1586)",["أخرجه ابن ماجه (856) واللفظ له، وأحمد (25029) بنحوه مطولاً، وصححه الألباني في صحيح الجامع (5613) وحسنه الوادعي في الصحيح المسند مما ليس في الصحيحين (1586)."],[90],0],[223,"q","النووي","","« يستحب لكل قارئ كان في الصلاة أو في غيرها إذا فرغ من الفاتحة أن يقول: (آمين). والأحاديث في ذلك كثيرة مشهورة، وقد قدمنا في الفصل قبله أنه يستحب أن يفصل بين آخر الفاتحة و(آمين) بسكتة لطيفة, ومعناه: اللهم استجب، وقيل: كذلك فليكن، وقيل: افعل، وقيل: معناه: لا يقدر على هذا أحد سواك، وقيل: معناه: لا تخيب رجاءنا، وقيل: معناه: اللهم آمنا بخير، وقال أبو بكر الوراق: هو قوة للدعاء واستنزال للرحمة »","قال النووي رحمه الله:","","",["تهذيب الأسماء واللغات (3/ 12). وفي تفسير السمرقندي - بحر العلوم (1/ 19) نسبه إلى مقاتل من قوله."],[90],0],[224,"q","العلماء","","« ويستحب التأمين في الصلاة للإمام والمنفرد، ويجهر الإمام والمنفرد بلفظ (آمين) في الصلاة الجهرية. واختلفوا في جهر المأموم: والصحيح: أنه يجهر, ويكون تأمين المأموم مع تأمين الإمام، لا قبله ولا بعده؛ لقول النبي ﷺ في الصحيح: «إذا قال الإمام: (ولا الضالين) فقولوا: (آمين) فمن وافق تأمينه تأمين الملائكة غفر الله له ما تقدم من ذنبه» »","قال العلماء:","","",["رواه البخاري (4475) ومسلم (410)."],[90],0],[225,"h","النبي ﷺ","النووي","«إذا أمن الإمام فأمنوا»","قال النووي رحمه الله: « وأما قوله رحمه الله في الصحيح:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (111) ومسلم (410)."],[90],0],[226,"q","النووي","","« وأما قوله رحمه الله في الصحيح: «إذا أمن الإمام فأمنوا». فمعناه: إذا أراد التأمين. قال أصحابنا: وليس في الصلاة موضع يستحب أن يقترن قول المأموم بقول الإمام إلا في قوله (آمين) وأما في الأقوال الباقية فيتأخر قول المأموم »","قال النووي رحمه الله:","","",["التبيان في آداب حملة القرآن (ص/ 110- 112)."],[90],0],[227,"q","ابن القيم","","« وهذا التَّأمين من زِينة الصلاة، كرفع اليَدين الذي هو زينة الصلاة، واتباع للسُّنَّة، وتعظيم أمر الله، وعبوديَّة لليَديْن وشعار الانتقال من ركنٍ إلى ركنٍ »","وقال ابن القيم رحمه الله:","","",["كتاب الصلاة (345-355)."],[90],0],[228,"q","ابن كثير","","« لما ذكر تعالى أن القرآن بصائرُ للناس وهدى ورحمةٌ، أمر تعالى بالإنصات عند تلاوته؛ إعظامًا له واحترامًا، لا كما كان يعتمده كفار قريش المشركون في قولهم: الآية: فصلت: 26 ولكن يتأكد ذلك في الصلاة المكتوبة إذا جهر الإمام بالقراءة »","قال ابن كثير رحمه الله:","","",["تفسير ابن كثير (3/ 536) [فصلت: ٢٠٤]."],[91,92],0],[229,"h","النبي ﷺ","أبو هريرة","«إنما جعل الإمام ليؤتم به، فإذا كبر فكبروا، وإذا قرأ فأنصتوا، وإذا قال سمع الله لمن حمده فقولوا: اللهم ربنا لك الحمد»","عن أبي هريرة رضي الله عنه، قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح النسائي (921)",["رواه النسائي (921) وابن ماجه (846) وأحمد (9438). وصححه الألباني في صحيح النسائي (921)."],[91,92],0],[230,"q","ابن القيم","","« ثم يأخذ في مناجاة ربِّه بكلامه، واستماعه من الإمام بالإنصات، وحضور القلب وشهوده »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (355).","كتاب الصلاة (ص/ 355)."],[91,92],0],[231,"h","النبي ﷺ","","«اجعلوها في ركوعكم»","فأفضل ما يقول الرَّاكع على الإطلاق: (سبحان ربي العظيم) فإنَّ الله سبحانه أمر العِبَاد بذلك، وعيَّن المبلِّغَ عنه، السَّفِير بينه وبين عباده هذا المحلَّ لهذا الذِّكر، لمَّا نزلت: الآية: الواقعة: 74 قال:","حسن","حسنه شعيب الأرناؤوط في تخريج سنن أبي داود (869)",["أخرجه أبو داود (869)، وابن ماجه (887)، وأحمد (17414). وحسنه شعيب الأرناؤوط في تخريج سنن أبي داود (869). وقال الشوكاني في فتح القدير (٥/ ٦١٠): لا مطعن في إسناده. من حديث عقبة بن عامر."],[93],0],[232,"a","","","«أمَّا الرُّكُوع فعظِّمُوا فيه الرَّبَّ»","وبالجملة؛ فَسِرُّ الرُّكُوع تعظيمُ الرَّبِّ رحمه الله بالقلب والقالب والقول، ولهذا قال النَّبيُّ ﷺ:","","",["كتاب الصلاة (356-357). والحديث رواه مسلم (479)."],[93],0],[233,"h","النبي ﷺ","","«خَشَعَ لَكَ سَمْعِي وَبَصَرِي وَمُخِّي وَعِظَامِي وَعَصَبِي وَمَا اسْتَقَلَّتْ بِهِ قَدَمَيَّ»","ولهذا كان النبي ﷺ يقول في ركوعه:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (771) وأبو دود (760) والترمذي (3421)."],[93],0],[234,"q","ابن رجب","","« ومن ذلك: الركوع، وهو ذلٌّ بظاهر الجسد، ولهذا كانت العرب تأنف منه ولا تفعله، حتى بايع بعضهم النبي ﷺ على أنْ لا يخر إلا قائمًا يعني: أن يسجد من غير ركوع, كذا فسره الإمام أحمد رحمه الله والمحققون من العلماء, وقال الله تعالى: الآية: المرسلات: 48 وتمام الخضوع في الركوع: أن يخضع القلب لله ويذل له، فيتم بذلك خضوع العبد بباطنه وظاهره لله عز وجل. ولهذا كان النبي ﷺ يقول في ركوعه: «خَشَعَ لَكَ سَمْعِي وَبَصَرِي وَمُخِّي وَعِظَامِي وَعَصَبِي وَمَا اسْتَقَلَّتْ بِهِ قَدَمَيَّ». إشارة إلى أن خشوعه في ركوعه قد حصل بجميع جوارحه ومن أعظمها القلب الذي هو ملك الأعضاء والجوارح، فإذا خشع خشعت الجوارح، والأعضاء كلها تبعًا لخشوعه »","وقال ابن رجب رحمه الله:","","",["تفسير ابن رجب (2/ 23) [سورة المؤمنون: 2]."],[93],0],[235,"q","ابن القيم","","« ثم يرفع رأسه عائدًا إلى أكمل هيئاته، وجعل شعار هذا الركن حمد الله والَّثناء عليه وتمجيده. فافتتح هذا الشِّعار بقول المصلي: \"سمِعَ اللهُ لمَنْ حَمِدَه\" أي: سَمِعَ سَمْعَ قبولٍ وإجابةٍ. ثم شفَع بقوله: \"ربَّنا ولك الحمد، مِلءَ السَّموات والأرض، ومِلءَ ما بينهما، ومِلءَ ما شِئتَ من شيءٍ بعد\", ولا يهمل أمر هذه الواو في قوله: \"ربَّنا ولك الحمد\" فإنَّه قد نُدِب الأمر بها في الصحيحين؛ وهي تجعل الكلام في تقدير جملتين قائمتين بأنفسهِما، فإنَّ قوله: \"ربَّنا\" متضمِّنٌ في المعنى: أنت الرَّبُّ والملك القيُّوم، الذي بيديه أزِمَّة الأمور، وإليه مرجعها، فعطف على هذا المعنى المفهوم من قوله: \"ربَّنا\" قولَه: \"ولك الحمد\" فتضمَّن ذلك معنى قول الموحِّد: \"له الملك وله الحمد\", ثمَّ أخبر عن شأن هذا الحمد، وعظمته قدرًا وصفةً، فقال: \"مِلءَ السَّموات وِملءَ الأرض، ومِلءَ ما بينهما، ومِلءَ ما شئتَ من شيءٍ بعد\"؛ أي: قدر ملءِ العالمِ العلوي والسُّفلي، والفضاء الذي بينهما, فهذا الحمد قد ملأ الخلق الموجود، وهو يملأ ما يخلقه الرَّبُّ رحمه الله بعد ذلك ممَّا يشاؤه. فاشتمل هذا الرُّكن على أفضل الأذكار، وأنفع الدُّعاء، من حمده، وتمجيده، والثَّناء عليه، والاعتراف له بالعبوديَّة والتَّوحيد، والتنصُّل إليه من الذُّنوب والخطايا, فهو ذِكْرٌ مقصودٌ في ركنٍ مقصودٍ، ليس بدون الركوع والسُّجود »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (357-361)."],[94],0],[236,"q","ابن القيم","","« ثمَّ يكبِّر ويخرُّ لله ساجدًا، غير رافعٍ يديه؛ لأنَّ اليدين تنحطَّان للسُّجود كما ينحطُّ الوجه، فهما تنحطَّان لعبوديتهما، فأغْنَى ذلك عن رفعهما، ولذلك لم يُشْرَع رفعُهُما عند رفع الرَّأس من السُّجود، لأنَّهما يُرفعان معه كما يُوضعان معه. وشُرِع السُّجود على أكمل الهيئات وأبلغِها في العبوديَّة، وأعمِّها لسائر الأعضاء، بحيث يأخذ كلُّ جزءٍ من البَدَن بحظِّه من العبوديَّة. والسُّجُود سِرُّ الصلاة، وركنها الأعظم، وخاتمة الركعة، وما قبله من الأركان كالمقدِّمات له، فهو شِبْهُ طواف الزِّيارة في الحجِّ، فإنَّه مقصود الحج، ومحلُّ الدُّخول على الله وزيارته، وما قبله كالمقدِّمات له، ولهذا أقرب ما يكون العبد من ربِّه وهو ساجدٌ. وأفضل أحواله: حالٌ يكون فيها أقرب إلى الله، ولهذا كان الدُّعاء في هذا المحلِّ أقرب إلى الإجابة ... فأُمِر بالسُّجود خضوعًا لعظمة ربِّه وفاطره، وخشوعًا له، وتذلُّلًا بين يديه، وانكسارًا له. فيكون هذا الخشوع والخضوع والتذلُّل رادًّا له إلى حكم العبوديَّة، ويتدارك به ما حصل له من الهفوة والغفلة، والإعراض الذي خرج به عن أصله، فَيَتَمَثَّل له حقيقة التراب الذي خلق منه؛ وهو يضع أشرف شيٍء منه وأعلاه، وهو الوجه، وقد صار أعلاه أسفله، خضوعًا بين يَدَي ربِّه الأعلى وخشوعًا له، وتذلُّلًا لعظمته، واستكانةً لعِزَّته. وهذا غاية خشوع الظاهر »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (361-367)."],[95],0],[237,"h","النبي ﷺ","","«أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ»","ولهذا كان جزاء المؤمن إذا فعل ذلك أن يُقَرِّبه الله إليه فإن:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (482) وأبو داود (875).","رواه مسلم (482)."],[95,49],0],[238,"q","ابن رجب","","« ومن ذلك: السجود، وهو أعظم ما يظهر فيه ذل العبد لربه عز وجل؛ حيث جعل العبد أشرف ما له من الأعضاء وأعزها عليه وأعلاها حقيقة، أوضع ما يمكنه، فيضعه في التراب متعفرًا، ويتبع ذلك انكسار القلب وتواضعه وخشوعه لله عز وجل. ولهذا كان جزاء المؤمن إذا فعل ذلك أن يُقَرِّبه الله إليه فإن: «أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ» كما صح عن النبي ﷺ, وقال الله تعالى: الآية: العلق: 19. والسجود أيضًا مما كان يأنف منه المشركون المستكبرون عن عبادة الله عز وجل, وكان بعضهم يقول: أكره أن أسجد فتعلوني إستي, وكان بعضهم يأخذ كفًّا من حصى فيرفعه إلى جبهته، ويكتفي بذلك عن السجود. وإبليس إنما طرده الله لما استكبر عن السجود لمن أمره الله بالسجود له؛ ولهذا يبكي إذا سجد المؤمن، ويقول: «أُمِرَ ابنُ آدم بالسجود ففعل فله الجنة، وأمرت بالسجود فعصيتُ فلي النار» »","وقال ابن رجب رحمه الله:","","",["تفسير ابن رجب (2/ 24) [سورة المؤمنون: 2]. والحديث رواه مسلم (81)."],[95],0],[239,"q","ابن القيم","","« ثم لمَّا شُرِعَ السُّجود بوصف التِّكرار لم يكن بُدٌ من الفصلِ بين السَّجدتين، ففَصَل بينهما بركنٍ مقصودٍ، شَرَع فيه من الدُّعاء ما يليق به ويناسبه، وهو سؤال العبد المغفرة والرحمة والهداية والعافية والرزق، فإنَّ هذه تتضمَّن جلب خير الدُّنيا والآخرة، ودفعَ شَرِّ الدُّنيا والآخرة, فالرَّحمة تحصِّل الخير، والمغفرة تقي الشَّرَّ، والهداية توصل إلى هذا وهذا، والرزق إعطاء ما به قِوَام البَدَن من الطَّعام والشَّراب، وما به قوام الرُّوح والقلب من العلم والإيمان. وجُعِل جلوس الفصْل محلًّا لهذا الدُّعاء لما تقدَّمه من حمد الله والثَّناء عليه والخضوع له، فكان هذا وسيلة للدَّاعي، ومقدِّمة بين يَدَي حاجته. فهذا الرُّكن مقصودٌ، والدعاء فيه مقصودٌ، فهو ركنٌ وُضِع للرَّغبة، وطلب العفو والمغفرة والرَّحمة، فإنَّ العبد لمَّا أتى بالقيام والحمد والثَّناء والمجد، ثم أتى بالخضوع وتنزيه الرَّبِّ وتعظيمه، ثم عاد إلى الحمد والثَّناء، ثم كمَّل ذلك بغاية التذلُّل والخضوع والاستكانة بقي سؤال حاجته، واعتذارُه، وتنصُّلُه، فشَرَع له أنْ يتمثَّل في الخدمة، فيقعد فعل العبد الذَّليل جاثيًا على ركبَتَيه، كهيئة المقلي نفسه بين يَدَي سيِّده، راغبًا، راهبًا، معتذرًا إليه، مستعديًا إليه على نفسه الأمَّارة بالسُّوء. ثمَّ شَرَع له تكرار هذه العبوديَّة مرَّةً بعد مرَّةٍ إلى إتمام الأربع. كما شَرَع له تكرير الذِّكر مرَّةً بعد مرَّةٍ، لأنَّه أبلغ في حصول المقصود، وأدْعى إلى الاستكانة والخضوع »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (367-369)."],[96],0],[240,"h","النبي ﷺ","","«سبحان ذي الملكوت والجبروت والكبرياء والعظمة»","فلهذا شُرع للعبد في ركوعه أن يقول: (سبحان ربي العظيم) وفي سجوده: (سبحان ربي الأعلى) وكان النبي ﷺ أحيانًا يقول في سجوده:","صحيح","صححه الوادعي في الصحيح المسند مما ليس في الصحيحين (1031)، من حديث عوف بن مالك الأشجعي [unknown symbol]",["رواه أبو داود (873) والنسائي (1049). وصححه الوادعي في الصحيح المسند مما ليس في الصحيحين (1031)، من حديث عوف بن مالك الأشجعي رحمه الله."],[97],0],[241,"q","ابن رجب","","« ومن تمام خشوع العبد لله عز وجل وتواضعه له في ركوعه وسجوده: أنه إذا ذل لربه بالركوع والسجود وصف ربه حينئذ بصفات العز والكبرياء والعظمة والعلو؛ فكأنه يقول: الذل والتواضع وصفي، والعلو والعظمة والكبرياء وصفك. فلهذا شُرع للعبد في ركوعه أن يقول: (سبحان ربي العظيم) وفي سجوده: (سبحان ربي الأعلى) وكان النبي ﷺ أحيانًا يقول في سجوده: «سبحان ذي الملكوت والجبروت والكبرياء والعظمة» »","قال ابن رجب رحمه الله:","","",["تفسير ابن رجب (2/ 25) [سورة المؤمنون: 2]."],[97],0],[242,"q","ابن القيم","","« فلمَّا أكمل ركوع الصَّلاة، وسجودها، وقراءتها، وتسبيحها، وتكبيرها، شُرِعَ له أنْ يجلس في آخر صلاته جلسة المتخشِّع المتذلِّل المستكين، جاثيًا على ركبتيه. ويأتي في هذه الجلسة بأكمل التَّحيَّات وأفضلها، عوضًا عن تحيَّة المخلوق للمخلوق إذا واجَهَه أو دخل عليه؛ فإنَّ النَّاس يحيُّون ملوكهم وأكابرهم بأنواع التحيَّات التي يتَحبَّبُون بها إلى قلوبهم, فبعضهم يقول: أنعم صباحًا, وبعضهم يقول: لك البقاء والنِّعمة, وبعضهم يقول: أطال الله بقاءك, وبعضهم يقول: تعيش ألف عام, وبعضهم يسجد للملوك, وبعضهم يسلِّم. فتحيَّاتهم بينهم تتضمَّن ما يحبُّه المُحَيَّا من الأقوال والأفعال, والمشركون يحيُّون أصنامهم. قال الحسن: كان أهل الجاهليَّة يتمسَّحُون بأصنامهم، ويقولون: لك الحياة الدَّائمة فلمَّا جاء الإسلام أُمِرُوا أن يجعلوا لله أطيب تلك التَّحيَّات وأزكاها وأفضلها »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (370)."],[98],0],[243,"q","ابن القيم","","« فـ (التحيَّات) هي تحيَّةٌ من العبد للحيِّ الذي لا يموت, وهو سبحانه أولى بتلك التحيّات من كُلِّ ما سواه، فإنَّها تتضمَّن الحياة والبقاء والدَّوام، ولا يستحقُّ أحدٌ هذه التحيَّات إلَّا الحيُّ الباقي الذي لا يموت، ولا يزول ملكُه, وكذلك قوله: (والصَّلوات) فإنَّه لا يستحق أحدٌ الصَّلاة إلا الله عز وجل، والصَّلاة لغيره من أعظم الكفر والشِّرك به. وكذلك قوله: (والطَّيِّبات) هي صفةٌ لموصوفٍ محذوفٍ، أي: الطَّيِّبات من الكلمات والأفعال والصِّفات والأسماء لله وحده. فهو طيِّبٌ، وكلامه طيِّبٌ، وأفعاله طيِّبةٌ، وصفاته أطيب شيءٍ، وأسماؤه أطيب الأسماء، واسمه (الطَّيِّب)، ولا يصدر عنه إلَّا طيِّبٌ، ولا يصعد إليه إلَّا طيِّبٌ، ولا يقرب منه إلَّا طيِّبٌ، فكلُّه طيِّبٌ. والآية: فاطر: 10 وفعله طيِّبٌ، والعمل الطيِّب يعرج إليه. فالطيِّبات كلُّها له، ومضافةٌ إليه، وصادرةٌ عنه، ومنتهيةٌ إليه, قال النبيُّ ﷺ: «إنَّ الله طيَّبٌ لا يقبل إلَّا طيَّبًا» »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (370 -373). والحديث رواه مسلم (1015) من حديث أبي هريرة رضي الله عنه."],[99],0],[244,"q","ابن القيم","","« ثمَّ خُتِمَتْ هذه التحيَّة بالشَّهادتين اللَّتَيْن هما مفتاح الإسلام، فشرع أنْ يكون خاتمة الصلاة. فدخل فيها بالتَّكبير والتَّحميد والثَّناء والتَّمجيد، وتوحيد الرُّبوبيَّة والإلهيَّة، وختمها بشهادة أنْ لا إله إلَّا الله وأنَّ محمَّدًا عبده ورسوله. وشُرِعَت هذه التَّحيَّة في وسط الصَّلاة إذا زادت على ركعتين، تشبيهًا لها بجلسة الفصل بين السَّجدتين، فيها بين الرَّكعتين الأُوليَيْن والأُخْرَيَيْن كالجلوس بين السَّجدتين. وفيها مع الفصل راحة للمصلِّي، لاستقباله الرَّكعتين الأٌخْرَيَيْن بنشاطٍ وقوةٍ، بخلاف ما إذا وَالَى بين الركعات؛ ولهذا كان الأفضل في النَّفل مثنى مثنى، وإنْ تطوَّع بأربع جلس في وسطهنَّ »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (373-374)."],[99],0],[245,"q","ابن القيم","","« وجعِلَت كلمات التِّحيَّات في آخر الصَّلاة بمنزلة خطبة الحاجة أمامها، فإنَّ المصلِّي إذا فرغ من صلاته جلس جلسة الرَّاغب الرَّاهب، يستعطي من ربِّه ما لا غنى به عنه، فشُرِع له أمام استعطائه كلمات التَّحيَّات، مقدمةً بين يدَيْ سؤاله، ثُمَّ يُتْبِعها بالصَّلاة على من نالت أُمَّته هذه النِّعمة على يده وبسفارته. فكأنَّ المصلِّي توسَّل إلى الله سبحانه بعبوديَّته، ثم بالثَّناء عليه، والشَّهادة له بالوحدانيَّة، ولرسوله بالرِّسالة، ثم بالصَّلاة على رسوله ﷺ، ثُمَّ قيل له: تخيَّر من الدُّعاء أحبَّه إليك. فذاك الحقُّ الذي عليك، وهذا الحقُّ الذي لك. وشُرِعت الصَّلاة على آله مع الصَّلاة عليه تكميلًا لقُرَّة عينه، بإكرام آله والصَّلاة عليهم. وأنْ يصلِّي عليه وعلى آله كما صلَّى على أبيه إبراهيم وآله. والأنبياء كلُّهم بعد إبراهيم من آله، ولذلك كان المطلوب لرسول الله ﷺ صلاةً مثل الصَّلاة على إبراهيم، وعلى جميع الأنبياء بعده، وآله المؤمنين، فلهذا كانت هذه الصَّلاة أكمل ما يصلَّى على رسول الله ﷺ بها وأفضل. فإذا أتى بها المصلِّي أُمِر أنْ يستعيذ بالله من مجامع الشَّرِّ كلِّه »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (374)."],[100],0],[246,"h","النبي ﷺ","","«جوف اللَّيل، وأدبار الصَّلاة المكتوبة»","نفع للدَّاعي, وسِرُّ ذلك: أنَّ المصلِّي قبل سلامه في محلِّ المناجاة والقُرْبة بين يَدَي ربِّه، فسؤاله في هذه الحال أقرب إلى الإجابة من سؤاله بعد انصرافه من بين يدَي ربِّه, وقد سُئِل النَّبيُّ ﷺ: أيُّ الدُّعاء أسمع؟ فقال:","حسن","حسنه الألباني في صحيح الترمذي (3499)",["رواه الترمذي (3499) والنسائي في الكبرى (9936) عن أبي أمامة الباهلي رضي الله عنه، وحسنه الألباني في صحيح الترمذي (3499)."],[101],0],[247,"h","النبي ﷺ","","«تسبِّحُون الله، وتحمدونَه وتكبرونَه دُبُر كل صلاةٍ ثلاثًا وثلاثين»","وقد يُرَاد بدُبُرِها ما بعد انقضائها، بقرينةٍ تدلُّ عليه، كقوله:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (595)."],[101],0],[248,"q","ابن القيم","","« فإذا أتى بها المصلِّي أُمِر أنْ يستعيذ بالله من مجامع الشَّرِّ كلِّه، فإنَّ الشر إمَّا عذاب الآخرة، وإمَّا سببه, فليس الشرُّ إلا العذاب وأسبابه. والعذاب نوعان: عذابٌ في البَرْزَخ، وعذابٌ في الآخرة. وأسبابه الفتنة؛ وهي نوعان: كُبرى، وصُغرى. فالكُبْرى: فتنة الدَّجال وفتنة الممات, والصُّغرى: فتنة الحياة التي يمكن تداركها بالتَّوبة، بخلاف فتنة الممات وفتنة الدَّجَّال، فإنَّ المفتون بهما لا يَتَدَاركهما. ثُمَّ شُرِعَ له من الدُّعاء ما يختاره من مصالح دنياه وآخرته. والدُّعاء في هذا المحلِّ قبل السَّلام أفضل من الدُّعاء بعد السَّلام وأنفع للدَّاعي, وسِرُّ ذلك: أنَّ المصلِّي قبل سلامه في محلِّ المناجاة والقُرْبة بين يَدَي ربِّه، فسؤاله في هذه الحال أقرب إلى الإجابة من سؤاله بعد انصرافه من بين يدَي ربِّه, وقد سُئِل النَّبيُّ ﷺ: أيُّ الدُّعاء أسمع؟ فقال: «جوف اللَّيل، وأدبار الصَّلاة المكتوبة», ودُبُر الصَّلاة جزؤها الأخير، كدُبُر الحيوان، ودُبُر الحائط. وقد يُرَاد بدُبُرِها ما بعد انقضائها، بقرينةٍ تدلُّ عليه، كقوله: «تسبِّحُون الله، وتحمدونَه وتكبرونَه دُبُر كل صلاةٍ ثلاثًا وثلاثين», فهنا دُبُرُها بعد الفراغ منها, وهذا نظير انقضاء الأجل فإنَّه يُرَاد به آخر المدَّة ولمَّا يفرغ، ويُرَاد به فراغها وانتهاؤها »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (376-379)."],[101],0],[249,"q","ابن القيم","","« ثُمَّ خُتِمَتْ بالتَّسليم وجُعِل تحليلًا لها، يخرج به المصلِّي منها كما يخرج بتحليل الحجِّ منه، وجُعِل هذا التَّحليل دعاء الإمام لمن وراءه بالسَّلامة التي هي أصل الخير وأساسه، فشُرِع لمن وراءه أنْ يتحلَّل بمثل ما تحلَّل به الإمام, وفي ذلك دعاءٌ له وللمصلِّين معه بالسَّلام، ثُم شُرِعَ ذلك لكلِّ مصلٍّ وإن كان منفردًا, فلا أحسن من هذا التَّحليل للصَّلاة، كما أنه لا أحسن من كون التَّكبير تحريمًا لها. فتحريمها تكبير الرَّبِّ تعالى، الجامع لإثبات كلِّ كمالٍ له، وتنزيهه عن كلِّ نقصٍ وعيبٍ، وإفراده وتخصيصه بذلك، وتعظيمه وإجلاله. فالتَّكبير يتضمَّن تفاصيل أفعال الصَّلاة، وأقوالها، وهيئاتها، فالصَّلاة من أوِّلها إلى آخرها تفصيلٌ لمضمون (الله أكبر) فلا أحسن من هذا التَّحريم المتضمِّن للإخلاص والتَّوحيد، ومن هذا التَّحليل المتضمِّن للإحسان إلى إخوانه المؤمنين، فافتُتِحَت بالإخلاص، وخُتِمَت بالإحسان »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ 379 -380)."],[102],0],[250,"q","ابن القيم","","« ويستحيل حصول الخشوع مع العَجَلة والنَّقر قطعاً، بل لا يحصل الخشوع قطُّ إلا مع الطُّمأنينة، وكلما زاد طمأنينةً ازداد خشوعاً، وكلَّما قَلَّ خشوعُه اشتدَّت عَجَلَتُه حتى تصير حركة بدنِه بمنزلة العَبَث، الذي لا يصحبُهُ خشوعٌ ولا إقبالٌ على العبوديَّة، ولا معرفة حقيقة العبوديَّة »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ ٣٣٩)."],[103,104],0],[251,"q","ابن القيم","","« قال المكمّلُون للصَّلاة: فصلاةٌ وُضِعَت على هذا النَّحو وهذا التَّرتيب، لا يمكن أن يحصل ما ذكرناه من مقاصدها التي هي جزءٌ يسيرٌ من قدرها وحقيقتها إلَّا مع الإكمال والإتمام والتمهُّل الذي كان رسول الله ﷺ يفعله, ومحالٌ حصول ما ذكرناه مع النَّقر والتَّخفيف، الذي يرجع إلى شهوة الإمام والمأمومين. ومن أراد أن يصلِّي هذه الصَّلاة الخاصَّة فلا بُد له من مزيد تطويلٍ، وأمَّا الصَّلاة الحرجية فلا تتوقَّف على ذلك »","وقال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ 380-381)."],[103],0],[252,"h","النبي ﷺ","أبو هريرة","«إذا قمت إلى الصلاة فكبر، ثم اقرأ ما تيسر معك من القرآن، ثم اركع حتى تطمئن راكعًا، ثم ارفع حتى تعتدل قائمًا، ثم اسجد حتى تطمئن ساجدًا، ثم ارفع حتى تطمئن جالسًا، ثم اسجد حتى تطمئن ساجدًا، ثم افعل ذلك في صلاتك كلها»","المسجد، فدخل رجل فصلى، ثم جاء فسلم على النبي ﷺ، فرد النبي ﷺ رحمه الله، فقال: «ارجع فصل، فإنك لم تصل», فصلى ثم جاء فسلم على النبي ﷺ، فقال: «ارجع فصل فإنك لم تصل», ثلاثًا، فقال: والذي بعثك بالحق، فما أحسن غيره فعلمني, قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (793) ومسلم (397)."],[105],0],[253,"q","ابن حجر","","« واستُدل بهذا الحديث على وجوب الطمأنينة في أركان الصلاة، وبه قال الجمهور، واشتهر عن الحنفية أن الطمأنينة سنة »","قال ابن حجر رحمه الله:","","",["فتح الباري لابن حجر (2/ 279) حديث رقم (793)."],[105],0],[254,"q","ابن القيم","","« فيه دليلٌ على وجوب الطُّمأنينة، وأنَّ مَنْ تَرَكَها لم يفعل ما أُمِرَ به، فيبقى مُطَالَباً بالأمر. وتأمَّل أمره بالطُّمأنينة في الركوع والاعتدال في الرَّفع منه، فإنه لا يكفي مجرَّد الطُّمأنينة في ركن الرفع حتى يعتدل قائمًا؛ فيجمع بين الطُّمأنينة والاعتدال. وقال في الرَّفع من السُّجود: «ثم ارفع حتى تطمئنَّ جالِسًا» وفي لفظٍ: «حتى تعتدل جالساً» فلم يكتف بمجرَّد الرَّفع كحدِّ السيف حتى تحصل الطُّمأنينة والاعتدال, ففيه أمرٌ بالرَّفع والطُّمأنينة فيه، والاعتدال »","وقال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ 270- 273)."],[105],0],[255,"h","النبي ﷺ","","«فإذا فعلت ذلك فقد تمَّت صلاتُك، وإنْ انتقصت منه شيئاً انتقصت من صلاتك»","وعند الترمذي من حديث رفاعة بن رافع بنحوه، وفي آخره:","صحيح","صححه الألباني في صحيح الترمذي (302)",["سنن الترمذي (302) وصححه الألباني في صحيح الترمذي (302)."],[105],0],[256,"q","ابن القيم","","« فكان هذا أهون عليهم من الأول، أنه من انتقص من ذلك شيئاً انتقص من صلاته، ولم تذهب كلُّها »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (276)."],[105],0],[257,"n","عبد الله بن عمر","","وكان الصحابة رضي الله عنهم يأمرون من أسرع في صلاته بإعادتها؛ فعن حرملة مولى أسامة بن زيد: أنه بينا هو جالس مع ابن عمر إذ دخل الحجاج بن أم أيمن، فصلى صلاة لم يتم ركوعها، ولا سجودها, فدعاه ابن عمر وقال: أتحسب أنك قد صليت؟ إنك لم تصل، فعُد لصلاتك. فلمَّا ولَّى قال ابن عمر: من هذا؟ فقلت: الحجاج بن أم أيمن، فقال: لو رآه رسول الله ﷺ لأحبه","","","",["سير أعلام النبلاء (2/ 226)."],[105],0],[258,"q","ابن القيم","","« فلن تكاد تجد ذكر الصلاة في موضعٍ من التَّنزيل إلاّ مقروناً بإقامتها، فالمصلُّون في الناس قليلٌ ومقيمو الصَّلَاة منهم أقل القليل؛ كما قال عمر رضي الله عنه: الحاجُّ قليلٌ والرَّكب كثير »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ ٣٤٢)."],[106],0],[259,"q","ابن القيم","","« فأمرنا بإقامتها وهو الإتيان بها قائمةً، تامَّة القيام والركوع والسجود والأذكار وقد علَّقَ الله سبحانه الفلاح بخشوع المصلى في صلاته، فمن فاته خشوع الصلاة لم يكن من أهل الفلاح، ويستحيل حصول الخشوع مع العَجَلة والنَّقر قطعاً، بل لا يحصل الخشوع قطُّ إلا مع الطُّمأنينة »","وقال ابن القيم أيضًا:","","",["المصدر السابق (ص/ ٣٣٩)."],[106],0],[260,"h","النبي ﷺ","عمار بن ياسر","«إنَّ طولَ صلاةِ الرجل وقِصَرَ خطبته مئنَّةٌ من فقهِهِ، فأطيلوا الصَّلاة واقْصُروا الخطبة»","عن عمَّار بن ياسر رضي الله عنه قال: قال رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (869)."],[107],0],[261,"h","النبي ﷺ","عبد الله ابن أبي أوفى","قال ابن القيم رحمه الله: « وقد حكم النَّبيُّ ﷺ أنَّ طول صلاة الرجل من فِقْهِه، وهذا الحكم أولى من الحُكْمِ له بقلَّة الفقه، فحُكْمُ رسول الله ﷺ هو الحُكْمُ الحق، وما خالفه فهو الحكم الباطل الجائر, فروى مسلمٌ ... وذكر حديث عمار, قال: وعند سُرَّاق الصلاة أنَّ العجلة فيها من علامات الفقه، فكلَّما سَرَق ركوعها وسجودها وأركانها كان ذلك علامة فضيلته وفقهه, وفي (صحيح بن حبان) و (سنن النسائي) عن عبد الله ابن أبي أوفى رحمه الله قال: كان رسول الله يُكْثِرُ الذِّكْرَ، ويُقِلُّ اللَّغوَ، ويطيل الصَّلاة، ويقصر الخطبة، ولا يأنفُ يمشي مع الأرملة والمسكين، فيقضى له الحاجة","لته وفقهه, وفي (صحيح بن حبان) و (سنن النسائي) عن عبد الله ابن أبي أوفى رحمه الله قال: كان رسول الله يُكْثِرُ الذِّكْرَ، ويُقِلُّ اللَّغوَ، ويطيل الصَّلاة، ويقصر الخطبة، ولا يأنفُ يمشي مع الأرملة والمسكين، فيقضى له الحاجة","صحيح","صححه الألباني في صحيح النسائي (1414) وحسنه الوادعي في الصحيح المسند مما ليس في الصحيحين (548)",["صحيح ابن حبان رقم (1129). وسنن النسائي رقم (1414). وصححه الألباني في صحيح النسائي (1414) وحسنه الوادعي في الصحيح المسند مما ليس في الصحيحين (548)."],[107],0],[262,"q","ابن القيم","","« وقد حكم النَّبيُّ ﷺ أنَّ طول صلاة الرجل من فِقْهِه، وهذا الحكم أولى من الحُكْمِ له بقلَّة الفقه، فحُكْمُ رسول الله ﷺ هو الحُكْمُ الحق، وما خالفه فهو الحكم الباطل الجائر, فروى مسلمٌ ... وذكر حديث عمار, قال: وعند سُرَّاق الصلاة أنَّ العجلة فيها من علامات الفقه، فكلَّما سَرَق ركوعها وسجودها وأركانها كان ذلك علامة فضيلته وفقهه, وفي (صحيح بن حبان) و (سنن النسائي) عن عبد الله ابن أبي أوفى رحمه الله قال: كان رسول الله يُكْثِرُ الذِّكْرَ، ويُقِلُّ اللَّغوَ، ويطيل الصَّلاة، ويقصر الخطبة، ولا يأنفُ يمشي مع الأرملة والمسكين، فيقضى له الحاجة. فهذا فعلُه، وذاك قولُه في مثل صلاة الجمعة التي يجتمع لها الناس، وكان يقرأ فيها بسورة الجمعة والمنافقين كاملتين, ولم يقتصر على الثلاث آيات في آخرهما في جمعةٍ واحدةٍ أصلًا, فعطَّل كثيرٌ من الناس سُنَّته، فاقتصر على آخرهما، ولم يقرأ بهما كاملتين أصلًا »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ 383- 385)."],[107],0],[263,"a","عبيد بن أبي الجعد","","« سمعوا أنَّ سلمان بالمسجد، فأتوه يثوبون إليه حتى اجتمع نحو من ألف، فقام فافتتح سورة يوسف، فجعلوا يتصدعون ويذهبون، حتى بقي نحو مئة, فغضب، وقال: الزخرف يريدون؟ آية من سورة كذا وآية من سورة كذا »","وعن عبيد بن أبي الجعد، عن رجلٍ أشجعي قال:","","",["سير أعلام النبلاء (1/ 551)."],[107],0],[264,"h","النبي ﷺ","عبد الرحمن بن شبل","عن عبد الرحمن بن شبل رضي الله عنه، قال: نهى رسول الله ﷺ عن نقرةِ الغُرابِ، وافتراش السبع، وأن يُوطِّنَ الرجلُ المكانَ في المسجد كما يُوطِّنُ البعيرُ","عن عبد الرحمن بن شبل رضي الله عنه، قال: نهى رسول الله ﷺ عن نقرةِ الغُرابِ، وافتراش السبع، وأن يُوطِّنَ الرجلُ المكانَ في المسجد كما يُوطِّنُ البعيرُ","حسن","حسنه الألباني في صحيح الجامع (6982)",["رواه أبو داود (862) والنسائي (1112) وابن ماجه (1429) وحسنه الألباني في صحيح الجامع (6982)."],[108,104],0],[265,"q","السندي","","« قوله «عن نقر الغراب» هو تخفيف السجود بحيث لا يمكث فيه إلا قدر وضع الغراب منقاره فيما يريد أكله »","قال السندي رحمه الله:","","",["حاشية السندي على النسائي (2/ 214) حديث رقم (1112)."],[108],0],[266,"h","النبي ﷺ","العلاء بن عبد الرحمن","«تلك صلاةُ المنافق، يجلسُ يرقُبُ الشمسَ حتى إذا كانت بين قرني الشيطان قام فنقرها أربعًا لا يذكرُ الله فيها إلا قليلًا»","ك رضي الله عنه، في داره بالبصرة حين انصرف من الظهر، وداره بجنب المسجد, فلما دخلنا عليه قال: أصليتم العصر؟ فقلنا له: إنما انصرفنا الساعةَ من الظُّهر, قال: فصلوا العصر, فقمنا فصلينا. فلما انصرفنا قال سمعت رسول الله ﷺ يقول:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (622)."],[108],0],[267,"q","النووي","","« قوله رحمه الله «فنقرها أربعًا لا يذكر الله فيها إلا قليلًا» تصريح بذمِّ من صلى مُسرعاً بحيث لا يكمل الخشوع والطمأنينة والأذكار، والمراد بالنقر: سرعة الحركات كنقر الطائر »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (5/ 124) حديث رقم (622)."],[108],0],[268,"q","ابن القيم","","« فهذه سِتُّ صفاتٍ من علامات النفاق؛ الكَسَل عند القيام إليها، ومُراءاة الناس في فعلها، وتأخيرها، ونقرها، وقلَّة ذكرِ الله فيها، والتَّخلُّف عن جماعتها »","وقال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ 284)."],[108],0],[269,"h","النبي ﷺ","أبو هريرة","«لا ينظر الله إلى صلاة رجل لا يقيم صلبه بين ركوعه وسجوده»","عن أبي هريرة رضي الله عنه، قال: قال رسول الله ﷺ:","حسن","حسنه شعيب الأرناؤوط في تخريج المسند (10799)",["رواه أحمد (10799) وحسنه شعيب الأرناؤوط في تخريج المسند (10799)."],[109],0],[270,"h","النبي ﷺ","أبو مسعود البدري","«لا تجزئ صلاةُ الرجلِ حتى يقيمَ ظهره في الركوع والسجود»","وعن أبي مسعود البدري رضي الله عنه، قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح الجامع (7224)",["رواه أبو داود (855) والنسائي (1111) وابن ماجه (870) والترمذي (265) وصححه الألباني في صحيح الجامع (7224)."],[109],0],[271,"q","ابن القيم","","« وهذا نصٌّ صريحٌ في أنَّ الرَّفع من الرُّكوع، وبين السجدتين، والاعتدال فيه، والطمأنينة فيه، ركنٌ لا تصحُّ الصلاة إلا به »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ 280)."],[109],0],[272,"a","زيد بن وهب","","« رأى حذيفةُ رضي الله عنه، رجلًا لا يتمُّ الركوعَ والسجودَ، قال: ما صليتَ، ولو مُتَّ مُتَّ على غير الفطرة التي فطرَ الله محمدًا ﷺ »","وعن زيد بن وهب رحمه الله، قال:","","",["رواه البخاري (791)."],[109,104],0],[273,"q","السندي","","« وقوله: (على غير فطرة) قيل: الفطرة الملة, وأراد توبيخه على سوء صنيعه ليرتدع عنه, وقيل: أراد بها الصلاة؛ لكونها أكبر أعمال الإيمان »","قال السندي رحمه الله:","","",["حاشية السندي على النسائي (3/ 59) حديث رقم (1312)."],[109],0],[274,"s","مالك بن أنس","","« وكان يُقال: في كلِّ شيءٍ وفاءٌ وتطفيفٌ؛ فإذا توعَّدَ الله سبحانه بالويل للمطفِّفين في الأموال، فما الظنُّ بالمطفِّفِين في الصلاة! »","وقال مالك بن أنس رضي الله عنه:","","",["كتاب الصلاة لابن القيم (ص/ 287)."],[109],0],[275,"h","النبي ﷺ","أبو قتادة","«لا يقيم صلبه في الركوع والسجود»","عن أبي قتادة رضي الله عنه قال: قال رسول الله ﷺ: «أسوأُ الناس سَرِقةً الذي يسرق من صلاته», قالوا: يا رسول الله، وكيف يسرق من صلاته؟ قال: «لا يتم ركوعها ولا سجودها» أو قال:","صحيح","صححه الألباني في صحيح الجامع (986)",["أخرجه أحمد (22642) والدارمي (1367) وصححه الألباني في صحيح الجامع (986)."],[110],0],[276,"q","ابن القيم","","« فصرَّح بأنَّه أسوأ حالاً من سارق الأموال، ولا ريب أنَّ لص الدِّين شرٌّ من لِصِّ الدنيا »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ 287)."],[110],0],[277,"a","الزهري","","« دخلت على أنس بن مالك رضي الله عنه، بدمشق وهو يبكي، فقلت: ما يبكيك؟ فقال: لا أعرف شيئًا مما أدركت إلا هذه الصلاة، وهذه الصلاة قد ضيعت »","وعن الزهري رحمه الله، قال:","","",["رواه البخاري (530)."],[110,111],0],[278,"h","النبي ﷺ","أنس بن مالك","« ما صليت خلف أحد أوجزَ صلاةً من صلاة رسول الله ﷺ في تمامٍ, كانت صلاةُ رسول الله ﷺ متقاربةً، وكانت صلاةُ أبي بكر متقاربةً, فلما كان عمر بن الخطاب مَدَّ في صلاة الفجر, وكان رسول الله ﷺ إذا قال: «سمع الله لمن حمده» قام حتى نقول: قد أوهم, ثم يسجد ويقعد بين السجدتين حتى نقول: قد أوهم »","عن أنس رضي الله عنه، قال:","صحيح","في الصحيحين أو أحدهما",["أخرجه مسلم (473)."],[112],0],[279,"h","النبي ﷺ","سعيد بن جبير","« سمعت أنس بن مالك رضي الله عنه، يقول: ما صليت وراء أحد بعد رسول الله ﷺ أشبَهَ صلاةً برسولِ الله ﷺ من هذا الفتى، يعني: عمرَ بنَ عبد العزيز، قال: فحزَرْنَا في ركوعه عشرَ تسبيحاتٍ، وفي سُجُوده عشرَ تسبيحاتٍ »","وعن سعيد بن جبير رحمه الله، قال:","حسن","حسنه ابن حجر كما في نتائج الأفكار (2/ 67)",["رواه أبو داود (888) والنسائي (1135) وحسنه ابن حجر كما في نتائج الأفكار (2/ 67)."],[112],0],[280,"q","العظيم آبادي","","« قوله: (عشر تسبيحات) قيل: فيه حجة لمن قال: إن كمال التسبيح عشر تسبيحات. والأصح أن المنفرد يزيد في التسبيح ما أراد، وكلما زاد كان أولى، والأحاديث الصحيحة في تطويله رحمه الله ناطقة بهذا، وكذلك الإمام إذا كان المؤتَمُّون لا يتأذون بالتطويل »","قال العظيم آبادي رحمه الله:","","",["عون المعبود (3/ 101) حديث رقم (888)."],[112],0],[281,"q","ابن القيم","","« مسألة! مقدار صلاة النبي ﷺ من أجلِّ المسائل وأهمِّها، وحاجة الناس إلى معرفتها أعظم من حاجتهم إلى الطعام والشراب، وقد ضيَّعها الناس من عهد أنس بن مالك ... والإيجاز هو الذي كان يفعله النبي ﷺ، لا الإيجاز الذي يظنُّه من لم يقف على مِقْدار صلاته، فإنَّ الإيجاز أمرٌ نسبيٌّ إضافيٌّ، راجِعٌ إلى السُّنَّة، لا إلى شهوة الإمام ومَنْ خلفه. فلمَّا كان يقرأ في الفجر بالسِّتين إلى المئة كان هذا إيجازاً بالنِّسبة إلى ست مئة آيةٍ إلى ألفٍ. ولمَّا قرأ في المغرب بالأعراف كان هذا الإيجاز بالنسبة إلى البقرة »","وقال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ 289-291)."],[112],0],[282,"a","","","« كان أنسٌ يصنع شيئًا لم أركم تصنعونه، كان إذا رفع رأسه من الركوع قام حتى يقول القائل قد نسي، وبين السجدتين حتى يقول القائل قد نسي »","قال ثابت:","","",["رواه البخاري (821) ومسلم (472)."],[113],0],[283,"s","البراء بن عازب","","« رمقت الصلاة مع محمد ﷺ؛ فوجدت قيامَه، فركعتَه، فاعتدالَه بعد ركوعه، فسجدتَه، فجلستَه بين السجدتين، فسجدته، فجلسته ما بين التسليم والانصراف، قريبًا من السواء »","وعن البراء بن عازب رضي الله عنه، قال:","","",["رواه مسلم (471)."],[113],0],[284,"q","ابن القيم","","« وليس مراده أنَّهما بقدر ركوعه وسجوده، وإلَّا ناقض السِّياقَ الثَّاني، وإنما المراد أنَّ طولَهُما كان مناسباً لطول الرُّكوع والسُّجود والاعتدالين، بحيث لا يظهر التَّفاوت الشَّديد في طول هذا وقِصَرِ هذا، كما يفعله كثيرٌ ممَّن لا علم عنده بالسُّنَّة، يُطيل القيام جدَّاً، ويخفِّف الركوع والسجود، وكثيراً ما يفعلون هذا في صلاة التراويح ... فأحاديث أنس بن مالك رضي الله عنه تدلُّ على أنَّ النبي ﷺ كان يطيل الركوع والسجود والاعتدالين، زيادةً على ما يفعله أكثر الأئمة. بل كلُّهم إلا النَّادر »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ 294- 299)."],[113],0],[285,"h","النبي ﷺ","أبو العالية","«أعطوا كل سورة حظها من الركوع والسجود»","عن أبي العالية، قال: حدثني من سمع النبي ﷺ يقول:","صحيح","صححه الوادعي في الصحيح المسند مما ليس في الصحيحين (1522)",["رواه أحمد (20590) وصححه الوادعي في الصحيح المسند مما ليس في الصحيحين (1522)."],[114],0],[286,"n","","","« والصحابة رضي الله عنهم أنكروا على من كان يبالغ في تطويل القيام، وعلى من كان يخفف الأركان، ولا سيما ركنَي الاعتدال، وعلى من كان لا يتم التكبير، وعلى من كان يؤخر الصلاة إلى آخر وقتها، وعلى من كان يتخلف عن جماعتها، وأخبروا عن صلاة رسول الله التي ما زال يصليها حتى مات، ولم يذكر أحد منهم أصلاً أنه نقص من صلاته في آخر حياته ولا أن تلك الصلاة التي كان يصليها منسوخة، بل استمر خلفاؤه الراشدون على منهاجه في الصلاة كما استمروا على منهاجه في غيرها؛ فصلى الصديق صلاة الصبح فقرأ فيها بالبقرة كلها فلما انصرف منها قالوا: يا خليفة رسول الله، كادت الشمس تطلع, قال: لو طلعت لم تجدنا غافلين. وكان عمر يصلي الصبح بالنحل ويونس وهود ويوسف ونحوها من السور »","","","",["المصنف - ابن أبي شيبة (3/ 279) رقم (3583).","كتاب الصلاة (ص/ 312)."],[114,114],0],[287,"h","النبي ﷺ","أبو قتادة","« كان النبي ﷺ يقرأ في الركعتين الأوليين من صلاة الظهر بفاتحة الكتاب وسورتين، يطوِّلُ في الأولى، ويقصرُ في الثانية، ويُسمعُ الآية أحيانا، وكان يقرأ في العصر بفاتحة الكتاب وسورتين، وكان يطول في الأولى، وكان يطول في الركعة الأولى، من صلاة الصبح ويقصر في الثانية »","عن أبي قتادة رضي الله عنه، قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (759) ومسلم (451)."],[115],0],[288,"q","ابن حجر","","« قوله: (يطول في الأولى ويقصر في الثانية) قال الشيخ تقي الدين: كان السبب في ذلك أن النشاط في الأولى يكون أكثر فناسب التخفيف في الثانية حذراً من الملل. انتهى. وروى عبد الرزاق عن معمر عن يحيى في آخر هذا الحديث: (فظننا أنه يريد بذلك أن يدرك الناس الركعة) وعن عطاء قال: إني لأحب أن يطول الإمام الركعة الأولى من كل صلاة حتى يكثر الناس »","قال ابن حجر رحمه الله:","","",["فتح الباري (2/ 244) حديث رقم (759)."],[115],0],[289,"a","الشعبي","","« الأولى من الصلوات أطول في القراءة »","وعن الشعبي رحمه الله، قال:","","",["أخرجه عبد الرزاق في المصنف (2674) وابن أبي شيبة (2758)."],[115],0],[290,"a","قتادة","","« لابدَّ للرجل المسلم من ست سور يتعلمهن للصلاة، سورتين لصلاة الصبح، وسورتين لصلاة المغرب، وسورتين لصلاة العشاء »","عن قتادة رحمه الله، أَنَّ عمر رضي الله عنه، قال:","","",["أخرجه عبد الرزاق في المصنف (2750)."],[116],0],[291,"h","النبي ﷺ","أبو برزة الأسلمي","« كان رسول الله ﷺ يقرأ في الفجر ما بين الستينَ إلى المائةِ آيةً »","عن أبي برزة الأسلمي رضي الله عنه، قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (461) والبخاري (541)."],[117],0],[292,"h","النبي ﷺ","","« وكان يقرأ في الركعتين، أو إحداهما، ما بين الستين إلى المائة »","وعند البخاري بلفظ:","صحيح","في الصحيحين أو أحدهما",["صحيح البخاري (771)."],[117],0],[293,"a","","","« صليت خلف أبي بكر الفجر، فاستفتح البقرة فقرأها في ركعتين، فقام عمر حين فرغ قال: يغفر الله لك، لقد كادت الشمس تطلع قبل أن تسلم قال: لو طلعت لألفتنا غير غافلين »","وعن أنس بن مالك رضي الله عنه، قال:","","",["أخرجه عبد الرزاق في المصنف (2711)."],[117],0],[294,"a","","","« أن أبا بكر الصديق رضي الله عنه، صلى الصبح فقرأ فيها سورة البقرة، في الركعتين كلتيهما »","وعن هشام بن عروة، عن أبيه:","","",["موطأ مالك (33) والسنن الكبرى للبيهقي (4016)."],[117],0],[295,"a","سليمان بن عتيق","","« أن عمر بن الخطاب رضي الله عنه، قرأ في الصبح سورة آل عمران »","عن سليمان بن عتيق رحمه الله:","","",["أخرجه عبد الرزاق في المصنف (2718)."],[117],0],[296,"s","عبد الله بن عامر بن ربيعة","","« ما حفظت سورة يوسف، وسورة الحج إلا من عمر رضي الله عنه، من كثرة ما كان يقرؤهما في صلاة الفجر، فقال: كان يقرؤهما قراءة بطيئة »","عن عبد الله بن عامر بن ربيعة رضي الله عنه، قال:","","",["أخرجه عبد الرزاق في المصنف (2715) ومالك في الموطأ (219) بنحوه."],[117],0],[297,"a","حصين بن سبرة","","« أن عمر رضي الله عنه، قرأ في الفجر بيوسف، ثم قرأ في الثانية بالنجم، فسجد، فقام، فقرأ إذا زلزلت »","عن عبد الله بن عامر بن ربيعة رضي الله عنه، قال: « ما حفظت سورة يوسف، وسورة الحج إلا من عمر رضي الله عنه، من كثرة ما كان يقرؤهما في صلاة الفجر، فقال: كان يقرؤهما قراءة بطيئة ». وعن حصين بن سبرة:","","",["أخرجه عبد الرزاق في المصنف (2724)."],[117],0],[298,"a","القاسم بن محمد","","« ما أخذت سورة يوسف إلا من قراءة عثمان بن عفان إياها في الصبح، من كثرة ما كان يرددها لنا »","وعن القاسم بن محمد، أن الفُرافِصَةَ بنِ عميرٍ الحنفي قال:","","",["أخرجه مالك في الموطأ (222)."],[117],0],[299,"h","النبي ﷺ","","« فما أتت عليه إلا رابعةٌ حتى أصيب، قال: إني لقائمٌ ما بيني وبينه إلا عبدُ الله بن عباس غداةَ أُصيبَ، وكان إذا مرَّ بين الصَّفَّين قال: استووا، حتى إذا لم ير فيهن خللًا تقدَّم فكبَّر، وربما قرأ سورة يوسفَ أو النحلَ أو نحوَ ذلك في الركعة الأولى حتى يجتمع الناس، فما هو إلا أن كبر فسمعته يقول: قتلني أو أكلني الكلب، حين طعنه، فطار العِلجُ بسكينٍ ذاتِ طرَفينِ، لا يمرُّ على أحد يمينًا ولا شمالًا إلا طعنه، حتى طعن ثلاثة عشر رجلًا، مات منهم سبعةٌ، فلما رأى ذلك رجل من المسلمين طرح عليه بُرْنُسًا، فلما ظن العلج أنه مأخوذٌ نحرَ نفْسَه، وتناول عمرُ يدَ عبدِ الرحمن بن عوف فقدَّمه، فمَنْ يلي عمرَ فقد رأى الذي أرى، وأما نواحي المسجد فإنهم لا يدرون، غير أنهم قد فقدوا صوت عمر، وهم يقولون: سبحان الله سبحان الله، فصلى بهم عبد الرحمن صلاة خفيفة.... إلخ »","قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (3700)."],[117],0],[300,"a","سعيد بن جبير","","« أنه أَمَّهُم في الفجر، فقرأ بني إسرائيلَ في ركعتين »","عن عمرو بن يعلى رحمه الله، عن سعيد بن جبير رحمه الله:","","",["أخرجه عبد الرزاق في المصنف (2714)."],[117],0],[301,"h","النبي ﷺ","خثيم ابن عراك","« أنَّ أبا هريرة رضي الله عنه، قدِمَ المدينة في رهطٍ من قومه، والنبي ﷺ بخيبر، وقد استخلف سِباعَ بنَ عُرْفُطةَ على المدينة، قال: فانتهيتُ إليه وهو يقرأ في صلاة الصبح في الركعة الأولى بـ: الآية: مريم: 1 وفي الثانية: الآية: المطففين: 1 قال: فقلت لنفسي: ويلٌ لفلانٍ إذا اكتالَ اكتالَ بالوافي، وإذا كال كالَ بالناقص. قال: فلما صلى زودنا شيئًا حتى أتينا خيبر، وقد افتتح النبي ﷺ خيبر، قال: فكلَّمَ المسلمين فأشركُونا في سهامهِم »","عن خثيم ابن عراك، عن أبيه رحمه الله:","صحيح","صححه شعيب الأرناؤوط في تخريج المسند (8552)",["رواه أحمد (8552) واللفظ له، وابن خزيمة (1039) وصححه شعيب الأرناؤوط في تخريج المسند (8552)."],[117],0],[302,"h","النبي ﷺ","عبد الله بن السائب","« صلى لنا النبي ﷺ الصبحَ بمكة فاستفتح سورة المؤمنين، حتى جاء ذكر موسى وهارون - أو ذكر عيسى, محمد بن عباد يشك، أو اختلفوا عليه - أخذَتِ النبيَّ ﷺ سَعْلَةٌ فركع, وعبد الله بن السائب حاضر ذلك, وفي حديث عبد الرزاق: فحذف فركع »","عن عبد الله بن السائب رضي الله عنه، قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (455)."],[117],0],[303,"h","النبي ﷺ","شبيب بن أبي روح","« صلى رسول الله ﷺ الفجر فقرأ فيهما بالروم، فالتبس عليه في القراءة، فلما صلى قال: «ما بال رجال يحضرون معنا الصلاة بغير طُهُور! أولئك الذين يَلْبِسُون علينا صلاتَنا، من شهِدَ معنا الصلاة فليُحسِن الطُّهُور»»","عن شبيب بن أبي روح، عن رجل من أصحاب النبي ﷺ قال:","حسن","حسنه شعيب الأرناؤوط في تخريج المسند (23072)",["رواه أحمد (23072) والنسائي (947). وحسنه شعيب الأرناؤوط في تخريج المسند (23072)."],[117],0],[304,"h","النبي ﷺ","سالم بن عبد الله","« إن كان رسول الله ﷺ ليأمُرُنا بالتخفيف، وإن كان ليؤمُّنا بالصافات، قال يزيد: في الصبح »","عن سالم بن عبد الله، عن أبيه قال:","صحيح","صححه أحمد شاكر في تحقيق المسند (7/ 16)",["رواه أحمد (4989) والنسائي (826) وصححه أحمد شاكر في تحقيق المسند (7/ 16)."],[117],0],[305,"s","أبو برزة","","« أن النبي ﷺ قرأ في الصبح بـ الآية: الفتح: 1 »","عن أبي برزة رضي الله عنه:","","",["أخرجه عبد الرزاق في المصنف (2732)."],[117],0],[306,"a","صالح بن كيسان","","« أنه سمع ابن عمر قرأ في المغرب: الآية: الفتح: 1»","وعن صالح بن كيسان:","","",["أخرجه عبد الرزاق في المصنف (2696)."],[117],0],[307,"s","عمر بن الخطاب","","« أنه كتب إلى أبي موسى رضي الله عنه: أنْ صلِّ الظهر إذا زاغت الشمس، والعصر والشمس بيضاء نقية، قبل أن يدخلها صفرة، والمغرب إذا غربت الشمس، وأخر العشاء ما لم تنم, وصل الصبح، والنجوم بادية مشتبكة، واقرأ فيها بسورتين طويلتين من المفصل »","عن عمر بن الخطاب رضي الله عنه:","","",["أخرجه مالك في الموطأ (7)."],[117],0],[308,"h","النبي ﷺ","قطبة بن مالك","« أنه صلى مع النبيِّ ﷺ الصُّبْحَ، فقرأ في أوّلِ ركــعةٍ الآية: ق: 10 وربمــا قال: الآية: ق: 1 »","عن قطبة بن مالك رضي الله عنه:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (457)."],[117],0],[309,"h","النبي ﷺ","جابر بن سمرة","« كان رسول الله ﷺ يصلي الصلوات كنحوٍ من صلاتكم التي تصلون اليوم، ولكنه كان يخفف، كانت صلاتُه أخفَّ من صلاتكم، وكان يقرأ في الفجر الواقعةَ ونحوَهَا من السور »","عن جابـر بـن سمـرة، رضي الله عنه، قال:","صحيح","صححه الألباني في أصل صفة الصلاة (2/ 430)",["رواه أحمد (20995) وعبد الرزاق في المصنف (2720) وصححه الألباني في أصل صفة الصلاة (2/ 430)."],[117],0],[310,"a","ربيعة بن عبد الله بن الهدير","","« كان عمر رضي الله عنه، يقرأ بالحديد وأشباهها »","عن ربيعة بن عبد الله بن الهَدير رحمه الله، قال:","","",["أخرجه عبد الرزاق في المصنف (2722)."],[117],0],[311,"h","النبي ﷺ","أبو هريرة","« أن النبي ﷺ كان يقرأ في صلاة الفجر، يوم الجمعة: الآية: السجدة: 1-2 السجدة والآية: الإنسان: 1 وأن النبي ﷺ كان يقرأ، في صلاة الجمعة، سورة الجمعة والمنافقين»","عن أبي هريرة رضي الله عنه، قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (891) ومسلم (880).","رواه مسلم (879)."],[118,119],0],[312,"a","بلفظ","","« وقيل: إن الحكمة في هاتين السورتين الإشارة إلى ما فيهما من ذكر خلق آدم وأحوال يوم القيامة، لأن ذلك كان وسيقع يوم الجمعة, ذكره ابن دحية في العلم المشهور وقرره تقريرًا حسنًا »","قراءة هاتين السورتين في هذه الصلاة من هذا اليوم لما تشعر الصيغة به من مواظبته رحمه الله على ذلك أو إكثاره منه، بل ورد من حديث ابن مسعود التصريح بمداومته رحمه الله على ذلك، أخرجه الطبراني ولفظه (يديم ذلك) ...» إلى أن قال:","","",["فتح الباري (2/ 379) حديث رقم (891)."],[118],0],[313,"h","النبي ﷺ","أبو سعيد الخدري","« كانت صلاة الظهر تُقام، فينطلقُ أحدُنا إلى البقيعِ فيقضي حاجتَه، ثم يأتي أهلَه فيتوضأُ، ثم يرجعُ إلى المسجد ورسول الله ﷺ في الركعة الأولى »","عن أبي سعيد الخدري رضي الله عنه، قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (454)."],[120],0],[314,"h","النبي ﷺ","أبو سعيد الخدري","« كنا نَحْزِرُ قيام رسول الله ﷺ في الظهر والعصر، فحزرنا قيامه في الركعتين الأوليين من الظهر قدر قراءة: الآية: السجدة: 1-2 وحزرنا قيامه في الأخريين قدر النصف من ذلك، وحزرنا قيامه في الركعتين الأوليين من العصر على قدر قيامه في الأخريين من الظهر وفي الأخريين من العصر على النصف من ذلك »","وعن أبي سعيـد الخـدري رضي الله عنه قَالَ:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (452)."],[120],0],[315,"q","ابن القيم","","« وقد احتجَّ به من استحبَّ قراءة السورة بعد الفاتحة في الأخريين، وهو ظاهر الدلالة لو لم يجيء حديث أبي قتادة المتفق على صحته أنه كان يقرأ في الأوليين بفاتحة الكتاب وسورتين، وفي الأخريين بفاتحة الكتاب. فذكر السورتين في الركعتين الأوليين واقتصاره على الفاتحة في الأخريين يدل على اختصاص كل ركعتين بما ذكر من قراءتهما. وحديث سعد يحتمل لما قال أبو قتادة، ولما قال أبو سعيد، وحديث أبي سعيد ليس صريحاً في قراءة السورة في الأخريين فإنما هو حَزْرٌ وتخمين »","قال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ 309)."],[120],0],[316,"h","النبي ﷺ","مروان بن الحكم","«يقرأ بطولى الطوليين؟»","عن مروان بن الحكم قال: قال لي زيد بن ثابت: ما لك تقرأ في المغرب بقصار، وقد سمعت النبي ﷺ","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (764)."],[121],0],[317,"n","مروان بن الحكم","","عن مروان بن الحكم قال: قال لي زيد بن ثابت: ما لك تقرأ في المغرب بقصار، وقد سمعت النبي ﷺ «يقرأ بطولى الطوليين؟», والمراد: الأعراف؛ لأنها أطول السورتين الطويلتين وهما الأنعام والأعراف, بدليل رواية: قلت: ما طولى الطوليين؟ قال: الأعراف، والآخر الأنعام, وسألت أنا ابن أبي مليكة فقال لي من قبل نفسه: المائدة والأعراف الطوليين","","صحيح","صححه الألباني في صحيح أبي دواد (812)",["سنن أبي داود (812) وصححه الألباني في صحيح أبي دواد (812)."],[121],0],[318,"h","النبي ﷺ","عائشة أم المؤمنين","« أن رسول الله صلى الله عليه وعلى آله وسلم قرأ في صلاة المغرب بسورة الأعراف فرقها في ركعتين »","وعن عائشة رضي الله عنها:","صحيح","صححه الألباني في صحيح النسائي (990) والوادعي في الصحيح المسند مما ليس في الصحيحين (955)",["رواه النسائي (991) وصححه الألباني في صحيح النسائي (990) والوادعي في الصحيح المسند مما ليس في الصحيحين (955)."],[121],0],[319,"q","ابن حجر","","« فحصل الاتفاق على تفسير الطولى بالأعراف، وفي تفسير الأخرى ثلاثة أقوال: المحفوظ منها الأنعام ... وقال ابن المنير: تسمية الأعراف والأنعام بالطوليين إنما هو لعرف فيهما لا أنهما أطول من غيرهما، والله أعلم. واستُدِلَّ بهذين الحديثين على امتداد وقت المغرب، وعلى استحباب القراءة فيها بغير قصار المفصل »","وقال ابن حجر رحمه الله:","","",["فتح الباري (2/ 247) حديث رقم (764)."],[121],0],[320,"h","النبي ﷺ","النعمان بن بشير","« كان رسول الله ﷺ يقرأ، في العيدين وفي الجمعة بِـ الآية: الأعلى: 1 وَالآية: الغاشية: 1، قال: وإذا اجتمع العيد والجمعة، في يوم واحد، يقرأ بهما أيضًا في الصلاتين »","عن النعمان بن بشير رضي الله عنه، قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (878)."],[119],0],[321,"q","النووي","","« قوله: كان رسولُ الله ﷺ يقرأ في العيدين وفي الجمعة بـ الآية: الأعلى: 1 وَالآية: الغاشية: 1 فيه استحباب القراءة فيهما بهما، وفي الحديث الآخر القراءة في العيد بـ … و…, وكلاهما صحيح، فكان رحمه الله في وقت يقرأ في الجمعة: … و… وفي وقت: … وَ… وفي وقت يقرأ في العيد: … و… وفي وقت: … وَ… »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (6/ 167) حديث رقم (878)."],[119],0],[322,"h","النبي ﷺ","","« استخلف مروانُ أبا هريرة على المدينة، وخرج إلى مكة, فصلى لنا أبو هريرة الجمعة، فقرأ بعد سورة الجمعة في الركعة الآخرة: …, قال: فأدركت أبا هريرة حين انصرف، فقلت له: إنك قرأت بسورتين، كان علي بن أبي طالب يقرأ بهما بالكوفة. فقال أبو هريرة رضي الله عنه: إني سمعت رسول الله ﷺ يقرأ بهما يوم الجمعة »","وعَن بن أبي رافع قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (877)."],[119],0],[323,"a","ابن وهب","","« رأيتُ الثوريَّ رحمه الله، في الحرم بعد المغرب صلَّى ثم سجد سجدة، فلم يرفع حتى نودي بالعشاء »","قال ابن وهب رحمه الله:","","",["سير أعلام النبلاء (7/ 266)."],[122],0],[324,"a","علي بن الفضيل","","« رأيت الثوري ساجدًا، فطفتُ سبعة أسابيع قبل أن يرفع رأسه »","وقال علي بن الفضيل رحمه الله:","","",["حلية الأولياء (7/ 57)."],[122],0],[325,"a","الأعمش","","« كان إبراهيم التيمي رحمه الله، إذا سجد كأنه جِذْمُ حائط ينزل على ظهره العصافير »","وقال الأعمش رحمه الله:","","",["سير أعلام النبلاء (5/ 61)."],[122,104],0],[326,"a","أحمد بن منيع","","« سمعت أبا قطن يقول: ما رأيت شعبة ركع قط إلا ظننت أنه نسي، ولا قعد بين السجدتين إلا ظننت أنه نسي »","وقال أحمد بن منيع رحمه الله:","","",["صفة الصفوة (2/ 207)."],[122,104],0],[327,"a","عبدان الأهوازي","","« كنا لا نصلي خلف هُدبة بن خالد من طول صلاته، يسبح في الركوع والسجود نيفًا وثلاثين تسبيحه, وكان من أشبه خلق الله بهشام بن عمار لحيته ووجهه وكل شيء، حتى في صلاته »","وقال عبدان الأهوازي رحمه الله:","","",["تاريخ دمشق لابن عساكر (74/ 34)."],[122],0],[328,"a","أبو بكر بن عياش","","« رأيت حبيب بن أبي ثابت ساجدًا، فلو رأيته قلت: ميت - يعني: من طول السجود »","وقال أبو بكر بن عياش رحمه الله:","","",["حلية الأولياء (5/ 61)."],[122],0],[329,"a","أبو العالية","","« كنت أرحل إلى الرجل مسيرة أيام لأسمع منه، فَأَتَفَقَّدُ صلاتَه، فإن وجدتُّه يحسنها أقمتُ عليه، وإنْ أجده يضيعها رحلت ولم أسمعْ منه، وقلتُ: هو لِمَا سِوَاهَا أَضْيَعُ »","عن أبي العالية قال:","","",["سير أعلام النبلاء (4/ 209)."],[123],0],[330,"n","","","ج: الطمأنينة في الركوع وفي القيام بعد الرفع منه وفي السجود وفي الجلوس بين السجدتين من فرائض الصلاة، فمن لم يطمئن في ركن من هذه الأركان فصلاته باطلة، ولا تصح صلاة من اقتدى به، ويجب على من علم منه ذلك أن يرشده وينصح له، فإن انتصح فالحمد لله، وإلا وجب ترك الصلاة وراءه ورفع أمره إلى الجهة المسئولة حيث أمكن، حتى تعزله عن الإمامة وتضع غيره ممن يحسن الصلاة, وبالله التوفيق، وصلى الله على نبينا محمد، وآله وصحبه وسلم","","","",["فتاوى اللجنة الدائمة للبحوث العلمية والإفتاء. الرئيس/ عبد العزيز بن عبد الله بن باز (٧/٩٠)."],[124],0],[331,"h","النبي ﷺ","أبو هريرة","«قال اللهُ تعالى: قسمتُ الصلاةَ بيني وبين عبدي نصفينِ ولعبدي ما سألَ...»","هذا السبب الثامن من أهم أسباب الخشوع في الصلاة، قال الله تعالى: الآية: ص: 29، ويتعين التدبر في سورة الفاتحة للحديث الوارد عن أبي هريرة رضي الله عنه، عن النبي ﷺ قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (395)."],[87],0],[332,"q","العلماء","","« والمراد قسمتها من جهة المعنى؛ لأن نصفها الأول تحميد لله تعالى، وتمجيدٌ وثناءٌ عليه، وتفويضٌ إليه، والنصف الثاني سؤالٌ وطلبٌ وتضرعٌ وافتقار »","قال العلماء:","","",["المنهاج شرح صحيح مسلم بن الحجاج (4/ 103) حديث رقم (395)."],[87],0],[333,"a","الحسن البصري","","« إن من كان قبلكم رأوا القرآن رسائل من ربهم، فكانوا يتدبرونها بالليل، وينفذونها في النهار »","وقال الحسن البصري رحمه الله:","","",["التبيان في آداب حملة القرآن (صـ/ 54). الباب الخامس: في آداب حامل القرآن."],[87,125],0],[334,"a","عمرو بن مرة","","« أكرهُ أن أَمُرّ بمثَلٍ في القرآن فلا أعرفه؛ لأن الله يقول: الآية: العنكبوت: 43 »","وقال عمرو بن مرة رحمه الله:","","",["حلية الأولياء (5/ 95)."],[87],0],[335,"a","وهيب بن الورد","","« نظرنا في هذا الحديث، فلم نجد شيئًا أرقَّ لهذه القلوب، ولا أشدَّ استجلابًا للحق، من قراءة القرآن لِمَنْ تَدَّبَّرَهُ »","وعن وهيب بن الورد رحمه الله، قال:","","",["المصدر السابق (8/ 142).","حلية الأولياء، (8/ 142)."],[87,126],0],[336,"a","قتادة","","« أي: سأمنعهم فَهْمَ كتابي. وقاله سفيان بن عيينة »","قال قتادة:","","",["تفسير القرطبي - الجامع لأحكام القرآن (7/ 283) [سورة الأعراف: 146]."],[87],0],[337,"q","ابن القيم","","« الرب تعالى يدعو عباده في القرآن الى معرفته من طريقين: أحدهما: النّظر فِي مفعولاته. وَالثَّانِي: التفكر فِي آيَاته وتدبّرها، فَتلك آيَاته المشهودة، وهذه آيَاته المسموعة المعقولة. فالنوع الأوّل: كقولِه: الآية: البقرة: 164 وقوله: الآية: آل عمران: 190 وهو كثير في القُرآن. والثَّانِي: كقولِه: الآية: النساء: 82 وقوله: الآية: المؤمنون: 68 وقوله: الآية: ص: 29 وهو كثيرٌ أيضًا. فأمّا المفعولات فإنَّها دالّة على الأفعال، والأفعال دالّة على الصِّفَات، فإن المفعول يدل على فاعلٍ فعلَه، وذلك يستَلزم وجوده وقدرته ومشيئته وعلمه؛ لِاسْتِحَالَة صُدُور الْفِعل الِاختِيَاريّ من معدُوم، أو موجُود لَا قدرَة لَهُ وَلَا حَيَاة وَلَا علم وَلَا إِرَادَة، ثمَّ مَا فِي المفعولات من التخصيصات المتنوعة دالّ على إِرَادَة الْفَاعِل، وَأَن فعله لَيْسَ بالطبع بِحَيْثُ يكون وَاحِدًا غير متكرر، وَمَا فِيهَا من الْمصَالح وَالْحكم والغايات المحمودة دَال على حكمته تَعَالَى، وَمَا فِيهَا من النَّفْع وَالْإِحْسَان وَالْخَيْر دَال على رَحمته، وَمَا فِيهَا من الْبَطْش والانتقام والعقوبة دَال على غَضَبه، وَمَا فِيهَا من الْإِكْرَام والتقريب والعناية دَال على محبّته، وَمَا فِيهَا من الإهانة والإبعاد والخذلان دَال على بغضه ومقته، وَمَا فِيهَا من ابْتِدَاء الشَّيْء فِي غَايَة النَّقْص والضعف ثمَّ سوقه إِلَى تَمَامه ونهايته دَال على وُقُوع الْمعَاد، وَمَا فِيهَا من أَحْوَال النَّبَات وَالْحَيَوَان وَتصرف الْمِيَاه دَلِيل على إِمْكَان الْمعَاد، وَمَا فِيهَا من ظُهُور آثَار الرَّحْمَة وَالنعْمَة على خلقه دَلِيل على صحّة النبوّات، وَمَا فِيهَا من الكمالات الَّتِي لَو عدمتها كَانَت نَاقِصَة دَلِيل على أَن معطي تِلْكَ الكمالات أَحَق بهَا. فمفعولاته من أدل شَيْء على صِفَاته، وَصدق مَا أخْبرت بِهِ رسله عَنهُ؛ فالمصنوعات شاهدة، تصدق الْآيَات المسموعات، منبّهة على الِاسْتِدْلَال بِالْآيَاتِ المصنوعات، قَالَ تَعَالَى: الآية: فصلت: 53 أَي: أَن الْقُرْآن حق، فَأخْبر أنّه لَا بُد من أَن يُرِيهم من آيَاته المشهودة مَا يبيّن لَهُم أَن آيَاته المتلوّة حق، ثمَّ أخبر بكفاية شَهَادَته على صِحَة خَبره بِمَا أَقَامَ من الدَّلَائِل والبراهين على صدق رَسُوله. فآياته شاهدة بصدقه وَهُوَ شَاهد بِصدق رَسُوله بآياته، وَهُوَ الشَّاهِد والمشهود لَهُ، وَهُوَ الدَّلِيل والمدلول عَلَيْهِ »","فالجواب: قال ابن القيم رحمه الله:","","",["الفوائد (ص/ ٢٨)."],[127],0],[338,"q","الآجري","","« ألا ترون رحمَكُمُ اللهُ إلى مولاكم الكريم كيف يحثُّ خلقه على أن يتدبروا كلامه، ومن تدبَّر كلامه، عرَف الربَّ رحمه الله، وعرف عظيم سلطانه وقدرته، وعرف عظيم تَفَضُّله على المؤمنين، وعرف ما عليه من فَرْضِ عبادته، فألزم نفسه الواجب؛ فحذر مما حذَّره مولاه الكريم، ورغب فيما رَغَّبه فيه، ومن كانت هذه صفته عند تلاوته للقرآن وعند استماعه من غيره ، كان القرآن له شفاء؛ فاستغنى بلا مال ، وعز بلا عشيرة ، وأنس بما يستوحش منه غيره ، وكان هَمُّهُ عند التلاوة للسورة إذا افتتحها متى أَتَّعِظُ بما أتلو؟ ولم يكن مراده متى أختم السورة؟ وإنما مُرَادُهُ متى أَعْقِلُ عن الله الخطاب؟ »","وقال الآجري رحمه الله:","","",["أخلاق أهل القرآن (ص/ 36 – 37)."],[127],0],[339,"q","ابن القيم","","« وليس حظُّ القلب العامر بمحبَّة الله وخشيته والرَّغبة فيه وإجلاله وتعظيمه من الصَّلاة كحظِّ القلب الخالي الخراب من ذلك؛ فإذا وقف الاثنان بين يدي الله في الصلاة، وقف هذا بقلبٍ مُخْبتٍ له، خاشعٍ له، قريبٍ منه، سليمٍ من معارضات السُّوء، قد امتلأت أرجاؤه بالهيبة، وسَطَع فيه نور الإيمان، وكشف عنه حجاب النَّفس، ودخان الشَّهوات، فيرتع في رياض معاني القرآن، وخالط قلبَه بشاشةُ الإيمان بحقائق الأسماء والصِّفات، وعلوِّها، وجلالها، وكمالها الأعظم، وتفرُّد الرَّب سبحانه بنعوت جلاله وصفات كماله، فاجتمع همُّه على الله، وقَرَّت عينه به، وأحسَّ بِقُرْبِهِ من الله قربًا لا نظير له، ففرَّغ قلبه له، وأقبل عليه بكلِّيَّتِه. وهذا الإقبال منه بين إقبالين من ربِّه، فإنَّه سبحانه أقبل عليه أوَّلًا، فانجذب قلبه إليه بإقباله، فلمَّا أقبل على ربِّه حظي منه بإقبالٍ آخر أتمَّ من الإقبال الأوَّل »","وقال ابن القيم رحمه الله:","","",["كتاب الصلاة (ص/ 343)."],[127],0],[340,"h","النبي ﷺ","أبو هريرة","«إذا نودي للصلاة، أدبر الشيطان وله ضُراطٌ، حتى لا يسمعَ التأذينَ، فإذا قضى النداء أقبل، حتى إذا ثُوِّب بالصلاة أدبر، حتى إذا قضى التثويب أقبل، حتى يخطِرَ بين المرء ونفسِه، يقول: اذكر كذا، اذكر كذا، لما لم يكن يذكر، حتى يظل الرجل لا يدري كم صلى»","فعن أبي هريرة رضي الله عنه: أن رسول الله ﷺ قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (608) ومسلم (389)."],[128],0],[341,"q","الباجي","","« المعنى أنه يحول بين المرء وبين ما يريده من إقباله على صلاته وإخلاصه فيها »","لا يسمعَ التأذينَ، فإذا قضى النداء أقبل، حتى إذا ثُوِّب بالصلاة أدبر، حتى إذا قضى التثويب أقبل، حتى يخطِرَ بين المرء ونفسِه، يقول: اذكر كذا، اذكر كذا، لما لم يكن يذكر، حتى يظل الرجل لا يدري كم صلى». قال الباجي رحمه الله:","","",["فتح الباري بشرح صحيح البخاري (2/ 86) حديث رقم (608)."],[128],0],[342,"q","ابن القيم","","« والعبدُ إذا قام في الصلاة غار الشيطان منه، فإنه قد قام في أعظم مقام، وأقربِه، وأغيظِه للشيطان، وأشدِّه عليه، فهو يحرص ويجتهد أنْ لا يقيمه فيه، بل لا يزال به يَعِدُه ويُمَنِّيه ويُنْسِيه، ويجلب عليه بخيله ورَجِلِه حتى يُهوِّن عليه شأن الصلاة، فيتهاون بها، فيتركها. فإن عجز عن ذلك منه، وعصاه العبد، وقام في ذلك المقام، أقبل عدو الله تعالى حتى يخطر بينه وبين نفسه، ويَحُول بينه وبين قلبه، فيذكِّره في الصلاة ما لم يذكر قبل دخوله فيها، حتى ربما كان قد نسي الشيء والحاجة، وأيِس منها، فيُذَكِّره إياها في الصلاة؛ ليشغل قلبه بها، ويأخذه عن الله عز وجل، فيقوم فيها بلا قلب، فلا ينال من إقبال الله تعالى وكرامته وقربه ما يناله المقبلُ على ربه عز وجل، الحاضرُ بقلبه في صلاته، فينصرف من صلاته مثل ما دخل فيها، بخطاياه وذنوبه وأثقاله، لم تَخِفَّ عنه بالصلاة! فإن الصلاة إنما تُكَفِّرُ سيئات من أدَّى حقها، وأكمل خشوعها، ووقف بين يدي الله تعالى بقلبه وقالبه »","وقال ابن القيم رحمه الله:","","",["الوابل الصيب (ص/ 43-48)."],[128],0],[343,"h","النبي ﷺ","أبو العلاء","عن أبي العلاء رحمه الله أن عثمان بن أبي العاص رضي الله عنه أتى النبي ﷺ، فقال: يا رسول الله، إنَّ الشيطانَ قد حال بيني وبين صلاتي وقراءتي؛ يَلْبِسُها عليَّ! فقال رسول الله ﷺ: «ذاك شيطان يقال له خَنْزَبٌ، فإذا أحسستَه فتعوّذ بالله منه، واتفل على يسارك ثلاثًا». قال: ففعلت ذلك، فأذهبه الله عني","، فقال: يا رسول الله، إنَّ الشيطانَ قد حال بيني وبين صلاتي وقراءتي؛ يَلْبِسُها عليَّ! فقال رسول الله ﷺ: «ذاك شيطان يقال له خَنْزَبٌ، فإذا أحسستَه فتعوّذ بالله منه، واتفل على يسارك ثلاثًا». قال: ففعلت ذلك، فأذهبه الله عني","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (2203)."],[129],0],[344,"q","النووي","","« وفي هذا الحديث استحباب التعوذ من الشيطان عند وسوسته مع التفل عن اليسار ثلاثًا، ومعنى \"يلبسها\" أي: يخلطها، ويشككني فيها، - وهو بفتح أوله وكسر ثالثه - ومعنى \"حال بيني وبينها\" أي: نكدني فيها، ومنعني لذتها، والفراغ للخشوع فيها »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (14/ 190) حديث رقم (2203)."],[129],0],[345,"n","اللجنة الدائمة","","ج: يشغل المصلي نفسه بتدبر معاني آيات القرآن الكريم التي يتلوها، ويتذكر عظمة الله في ركوعه، وسجوده، وفي سائر أحواله في الصلاة، وأنه واقف بين يدي ربه يناجيه، مخلصا له الدين، فيلتزم الأدب مع من يناجيه، ويتقرب إليه؛ رجاء أن يتقبل منه ويستجيب له فيقربه إلى نفسه، وخوفًا منه أن يعرض عنه فيرد عليه عبادته، بهذا ونحوه من أحكام الخشوع والضراعة لله يكبت الشيطان، ولا يجد له سبيلًا إلى مداخلتك والوسوسة لك، وتنسد مسالكه إليك، وبالله التوفيق وصلى الله على نبينا محمد، وآله وصحبه وسلم","","","",["اللجنة الدائمة للبحوث العلمية والإفتاء. الرئيس/ عبد العزيز بن عبد الله بن باز. (٧/ ١٦٤)."],[129],0],[346,"q","ابن عثيمين","","« فإن الشيطان إذا دخل للإنسان في الصلاة أشغل قلبه؛ فقال له: اذكر كذا اذكر كذا في يوم كذا، فإذا أحس به الإنسان فليتفل عن يساره ثلاث مرات، يقول: أعوذ بالله من الشيطان الرجيم، وهذا الدواء أخبرنا به رسول الله صلى الله عليه وعلى آله وسلم، ومتى فعل الإنسان بصدق وإيمان أذهب الله عنه ما يجده من الوسوسة في صلاته، هذا هو سبب الهواجس في الصلاة، وهذا هو الدواء منه »","وقال ابن عثيمين رحمه الله:","","",["سلسلة فتاوى نور على الدرب « الشريط رقم [360]."],[129],0],[347,"q","ابن عثيمين","","« نعم. كيف لا يجوز له ذلك! والنبي صلى الله عليه وعلى آله وسلم هو الذي أرشده إلى هذا، يعني أن الإنسان إذا كان يحدِّثُ نفسَه في الصلاةِ كثيراً فإنَّ دواءه ما وصفه النبي صلى الله عليه وعلى آله وسلم؛ أن يتفلَ عن يساره ثلاث مرات، وأن يستعيذَ بالله من الشيطان الرجيم، قال الصحابي الذي روى هذا الحديث: ففعلت ذلك فأذهب الله عني ما أجد، وهذا شهادة وتطبيق شهادة بأنه انتفع، وتطبيق بأنه عمل، ولكن قد يقول قائل: إذا كان الإنسان مع الجماعة فكيف يتفل عن يساره؟ فالجواب: إن كان آخر واحد على اليسار أمكنه أن يتفل عن يساره في غير مسجد، وإلا فليتفل عن يساره في ثوبه في غترته، في منديل، فإن لم يتيسر هذا كفى أن يلتفت عن يساره ويقول: أعوذ بالله من الشيطان الرجيم »","فأجاب الشيخ:","","",["سلسلة فتاوى نور على الدرب « الشريط رقم [354]."],[130],0],[348,"h","النبي ﷺ","عبد الله بن مسعود","«إن في الصلاة شُغلًا»","عن عبد الله بن مسعود رضي الله عنه، قال: كنا نسلم على النبي ﷺ وهو يصلي فيرد علينا، فلما رجعنا من عند النجاشي سلمنا عليه فلم يرد علينا، فقلنا: يا رسول الله، إنا كنا نسلم عليك فترد علينا؟ قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (3875) ومسلم (538)."],[131],0],[349,"q","النووي","","« قوله: «إن في الصلاة شغلًا» معناه: إنَّ المصلي وظيفتُه أن يشتغل بصلاته فيتدبر ما يقوله، ولا يعرج على غيرها، فلا يرد سلامًا ولا غيره »","قال النووي رحمه الله:","","",["شرح صحيح مسلم (5/ 27) حديث رقم (538)."],[131],0],[350,"q","ابن حجر","","« قوله: «إن في الصلاة شُغلًا» في رواية أحمد، عن ابن فضيل: «لشغلًا» بزيادة اللام للتأكيد، والتنكير فيه للتنويع، أي: بقراءة القرآن والذكر والدعاء، أو للتعظيم؛ أي: شُغلًا وأيّ شغل، لأنها مناجاة مع الله تستدعي الاستغراق بخدمته، فلا يصلح فيها الاشتغال بغيره »","وقال ابن حجر رحمه الله:","","",["فتح الباري لابن حجر (3/ 73) حديث رقم (1199)."],[131],0],[351,"a","الحسن البصري","","« إذا قمت إلى الصلاة فقم قانتًا كما أمرك الله، وإياك والسهوَ والالتفاتَ؛ أنْ ينظرَ الله إليك وتنظرَ إلى غيره، تسألُ الله الجنةَ وتعوذُ به من النار وقلبُك ساهٍ لا تدري ما تقولُ بلسانك »","وقال الحسن البصري رحمه الله:","","",["تعظيم قدر الصلاة - محمد بن نصر المروزي (1/ 189)."],[131],0],[352,"q","ابن العربي","","« صليت المغرب ليلة ما بين باب الأخضر، وباب حطة من البيت المقدس، ومعنا شيخنا أبو عبد الله محمد بن عبد الرحمن المغربي الزاهد، فلما سلَّمنا تمارى رجلان كانا عن يمين أبي عبد الله المغربي؛ وجعل أحدهما يقول للآخر: أسأتَ صلاتك، ونقرتَ نقر الغراب. والآخر يقول له: كذبت؛ بل أحسنتُ وأجملتُ. فقال المعترض لأبي عبد الله الزاهد: ألم يكن إلى جانبك؛ فكيف رأيته يصلي؟ قال أبو عبد الله: لا علم لي به، كنت مشتغلًا بنفسي وصلاتي عن الناس وصلاتهم. فخجل الرجل وأعجب الحاضرون بالقول »","وقال ابن العربي المالكي رحمه الله:","","",["أحكام القرآن لابن العربي (3/ 313)."],[131],0],[353,"s","علي بن أبي طالب","","« هو أنْ لا يلتفت يمينًا ولا شمالًا »","قال عليّ بن أبي طالب رضي الله عنه، في تفسير قوله تعالى: الآية: المؤمنون: 1-2:","","",["تفسير البغوي (3/ 357) [سورة المؤمنون: 2]."],[132],0],[354,"q","","","« هـو أنْ لا ترفع بصرك عن موضع سجودك »","وقــال ابـن سيريـن رحمه الله:","","",["تفسير الثعلبي - الكشف والبيان عن تفسير القرآن (18/ 433) [المؤمنون: 2]."],[132],0],[355,"a","سعيد بن جبير","","« هو أنْ لا يعرف من على يمينه ولا من على يساره، ولا يلتفت من الخشوع لله عز وجل »","وقال سعيد بن جبير رحمه الله:","","",["تفسير البغوي (3/ 357) [سورة المؤمنون: 2]."],[132],0],[356,"a","","","« غضُّ البصر، وخفض الجناح، ولين القلب، وهو: الحزن والخوف »","وسُئل الأوزاعي رحمه الله، عن الخشوع في الصلاة، فقال:","","",["سير أعلام النبلاء (7/ 116)."],[132,133],0],[357,"q","ابن تيمية","","« \"فكان بصره لا يجاوز موضع سجوده\" فهذا مما جاءت به الشريعة تكميلًا للفطرة؛ لأن الداعي السائل الذي يؤمر بالخشوع - وهو الذل والسكون - لا يناسب حاله أن ينظر إلى ناحية من يدعوه ويسأله، بل يناسب حاله الإطراق وغض بصره أمامه »","وقال ابن تيمية رحمه الله:","","",["مجموع الفتاوى (6/ 577)."],[132,133],0],[358,"q","ابن القيم","","« ولم يكن من هديه رحمه الله تغميضُ عينيه في الصلاة، وقد تقدم أنه كان في التشهد يُومئ ببصره إلى أصبعه في الدعاء، ولا يُجَاوِزُ بَصَرُهُ إشارتَه »","قال ابن القيم رحمه الله:","","",["زاد المعاد (1/ 204)."],[134],0],[359,"n","اللجنة الدائمة","","وبالله التوفيق، وصلى الله على نبينا محمد، وآله وصحبه وسلم","","","",["اللجنة الدائمة للبحوث العلمية والإفتاء. الرئيس/ عبد العزيز بن عبد الله بن باز. (٧/ ٢٤).","اللجنة الدائمة للبحوث العلمية والإفتاء؛ الرئيس/ عبد العزيز بن عبد الله بن باز - المجموعة الثانية (5/ 383).","اللجنة الدائمة للبحوث العلمية والإفتاء؛ الرئيس/ عبد العزيز بن عبد الله بن باز- المجموعة الثانية (7/ 194).","اللجنة الدائمة للبحوث العلمية والإفتاء. الرئيس/ عبد العزيز بن عبد الله بن باز. (٧/ ٢٥).","اللجنة الدائمة للبحوث العلمية والإفتاء؛ الرئيس/ عبد العزيز بن باز. المجموعة الثانية، (5/ 403)."],[134,135,136,137,138],0],[360,"q","ابن عثيمين","","« أما إذا طرأ ما يوجب التغميض فلا بأس، مثل: أن يدخل في الصلاة ثم حصل أمامه صبيان يلعبون، أو لاحظ شيئاً يشغله عن الصلاة، فهنا لا بأس أن يغمض، وإذا أغمض عينيه بدون سبب ورأى من نفسه أنه يخشع فهذا من وحي الشيطان؛ لأن تغميض العين في الصلاة مكروه، فإنه قيل: إنه فعل المجوس عند عبادتهم النيران. فتغميض العين فيه تفصيل: إذا كان لأمرٍ حدث فتخشى أن تتبعه بصرك فتنشغل عن صلاتك فهنا غمض العينين، وأما أن تغمض عينيك من أجل الخشوع فهذا خطأ »","الجواب:","","",["المصدر: سلسلة اللقاء الشهري [40]."],[134],0],[361,"h","النبي ﷺ","أبو ذر","« قام النبي ﷺ بآية حتى أصبح يرددها، والآية: الآية: المائدة: 118 »","عن أبي ذر رضي الله عنه قال:","حسن","حسنه الألباني في صحيح ابن ماجه (1118)",["رواه ابن ماجه (1350) والنسائي (1010) وحسنه الألباني في صحيح ابن ماجه (1118)."],[139],0],[362,"a","القاسم بن محمد","","« كنت إذا غدوت أبدأ ببيت عائشة رضي الله عنها فأسلم عليها, فغدوت يومًا فإذا هي قائمة تسبح وتقرأ: الآية: الطور: 27, وتدعو وتبكي, وترددها! فقمت حتى مللتُ القيام فذهبت إلى السوق لحاجتي, ثم رجعت فإذا هي قائمة كما هي تصلي وتبكي رحمه الله والقاسم هو ابن أخيها محمد بن أبي بكر رضي الله عنه »","وعن القاسم بن محمد قال:","","",["صفة الصفوة (2/229)."],[139,140],0],[363,"a","مسروق","","« قال لي رجل من أهل مكة: هذا مقام أخيك تميم الداري، لقد رأيته ذات ليلة حتى أصبح، أو قرب أن يصبح؛ يقرأ آية من كتاب الله ويركع ويسجد ويبكي: الآية: الجاثية: 21 الآية كلها »","وعن مسروق قال:","","",["السنن الكبرى - النسائي (10/ 400) حديث رقم (11833)."],[139],0],[364,"a","","","« قرأت البارحة القرآن في ركعة، فقال: لكني أعرف رجلًا لم يزل البارحة يقرأ: الآية: التكاثر: 1 إلى الصبح، ما قدر أن يجاوزها؛ يعني: نفسه »","وقال رجل لابن المبارك رحمه الله:","","",["أخرجه الدينوري في المجالسة وجواهر العلم (4/ 67) رقم (1232)."],[139],0],[365,"a","إبراهيم بن الأشعث","","« كثيرًا ما رأيت الفضيل بن عياض رحمه الله، يردد من أول الليل إلى آخره هذه الآية: الآية: الجاثية: 21 ونظيرها، ثم يقول: ليت شعري! من أي الفريقين أنت؟ وكانت هذه الآية تسمى مَبْكاةَ العابدين؛ لأنها محكمة »","وقال إبراهيم بن الأشعث رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (16/ 166) [الجاثية: 21]."],[139,141],0],[366,"a","","","« صليت مع أبي حنيفة في مسجده عشاء الآخرة، وخرج الناس، ولم يعلم أني في المسجد، وأردت أن أسأله مسألة من حيث لا يراني أحد، قال: فقام فقرأ، وقد افتتح الصلاة، حتى بلغ إلى هذه الآية الآية: الطور: 27، فأقمت في المسجد أنتظر فراغه، فلم يزل يرددها حتى أَذَّن المؤذن لصلاة الفجر »","وقال زائدة رحمه الله:","","",["تاريخ بغداد (15/488)."],[139],0],[367,"a","بشير مولى الربيع بن خثيم","","« بِتُّ عند الربيع بن خُثَيم ذات ليلة فقام يصلي فمر بهذه الآية: الآية: الجاثية: 21، فمكث ليلَهُ حتى أصبح لم يَعْدُها ببكاءٍ شديدٍ »","وعن بشير مولى الربيع بن خثيم قال:","","",["تفسير القرطبي - الجامع لأحكام القرآن (16/ 166) [الجاثية: 21]."],[139],0],[368,"a","يحيى بن عبد الرحمن","","« سمعت سعيد بن جبير يردد هذه الآية حتى أصبح: الآية: يس: 59 »","وعن يحيى بن عبد الرحمن قال:","","",["موسوعة ابن أبي الدنيا (1/257)."],[139],0],[369,"a","القاسم بن أيوب","","« سمعت سعيد بن جبير رحمه الله، يردد هذه الآية في الصلاة بضعًا وعشرين مرة: الآية: البقرة: 281 »","وعن القاسم بن أيوب رحمه الله، قال:","","",["الزهد للإمام أحمد (614)."],[139],0],[370,"a","محمد بن عوف الحمصي","","« رأيتُ أحمد بن أبي الحواري عندنا بأنطَرْسُوس - بلد من سواحل بحر الشام - فلمَّا صلَّى العَتَمَةَ قام يُصلي؛ فاستفتح بـ … إلى … قال: فطُفتُ الحائط كلَّهُ، ثم رجعتُ، فإذا هو لا يجاوزُها ثم نمتُ، ومررت في السَّحَر، وهو يقرأ: … فلم يزل يُرَدِّدُها إلى الصبح »","وقال محمد بن عوف الحِمْصِيُّ رحمه الله:","","",["سير أعلام النبلاء (12/ 88)."],[139],0],[371,"n","","","وقد استمع له بعض أصحابه ليلة وهو يقرأ، فوصل إلى قوله تعالى: الآية: المؤمنون: 101، فما زال يكررها إلى طلوع الفجر","","","",["طبقات الشافعية الكبرى للسبكي (9/ 211)."],[139],0],[372,"n","","","وكان الضحاك رحمه الله إذا تلا قوله تعالى: الآية: الزمر: 16 رددها إلى السحر","","","",["التبيان في آداب حملة القرآن للنووي (ص/ 78)."],[139],0],[373,"n","نسير أبي طعمة مولى الربيع بن خثيم","","وعن نُسير أبي طعمة مولى الربيع بن خثيم، أنّ الربيع بات يتلو آية من القرآن مَرّ عليها ما يتلو غيرها حتى أصبح: الآية: الجاثية: 21","","","",["الطبقات الكبير لابن سعد (8/ 307)."],[139],0],[374,"q","ابن عثيمين","","« وأما تكرار الآية فإن من السنة في النافلة خاصة أن يكرر الإنسان الآية التي يرى أن في تكرارها خشوعاً في قلبه؛ لأن النبي- صلى الله عليه وعلى آله وسلم - صلى صلاة الليل ومر بهذه الآية: الآية: المائدة: 118 وجعل يرددها إلى الصباح وهو في صلاته رحمه الله...أما في الفريضة فإن عند أهل العلم رحمهم الله. قاعدة: أن ما ثبت في النفل ثبت في الفرض، بناءً على هذه القاعدة التي دلت عليها أيضاً السنة نقول: حتى في الفريضة إذا مررت بآية يكون في تكرارها خشوع فكرر؛ لكن يمنعني من هذا أن الواصفين لصلاة النبي -صلى الله عليه وعلى آله وسلم- الفريضة لم يكونوا يقولون ذلك عنه، فلهذا نقول: في الفريضة جائز، في النافلة سنة »","قال ابن عثيمين رحمه الله:","","",["سلسلة اللقاء الشهري « اللقاء الشهري [49]."],[142],0],[375,"h","النبي ﷺ","البياضي","«إن المصلي يناجي ربه عز وجل، فلينظر ما يناجِيه، ولا يجهر بعضكم على بعض بالقرآن»","عن الْبَيَاضِيِّ رضي الله عنه، أن رسول الله ﷺ خرج على الناس وهم يصلون، وقد علت أصواتهم بالقراءة، فقال:","صحيح","صححه الألباني في صحيح الجامع (752)",["موطأ مالك (213) ومسند أحمد (19022) وصححه الألباني في صحيح الجامع (752)."],[143,136],0],[376,"h","النبي ﷺ","أنس بن مالك","«إذا كان أحدكم في الصلاة فإنه يناجي ربه، فلا يبزقن بين يديه ولا عن يمينه، ولكن عن شماله تحت قدمه»","وعن أنس بن مالك رضي الله عنه قال: قال رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (1214) ومسلم (551) واللفظ له."],[143],0],[377,"q","النووي","","« قوله رحمه الله: «فإنه يناجي ربه» إشارة إلى إخلاص القلب وحضوره وتفريغه لذكر الله تعالى وتمجيده وتلاوة كتابه وتدبره »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (5/ 41) حديث رقم (551)."],[143],0],[378,"h","النبي ﷺ","","«قال الله تعالى: قسمت الصلاة بيني وبين عبدي نصفين، ولعبدي ما سأل، فإذا قال العبد: …، قال الله تعالى: حمدني عبدي، وإذا قال: …، قال الله تعالى: أثنى علي عبدي، وإذا قال: …، قال: مجدني عبدي، وقال مرة: فوض إلي عبدي، فإذا قال: …، قال: هذا بيني وبين عبدي ولعبدي ما سأل، فإذا قال: …، قال: هذا لعبدي ولعبدي ما سأل»"," المصلي لربه: حديث أبي هريرة رضي الله عنه، عن النبي ﷺ قال: «من صلى صلاة لم يقرأ فيها بأم القرآن فهي خِداجٌ» - ثلاثًا - غيرُ تمام. فقيل لأبي هريرة: إنا نكون وراء الإمام!! فقال: اقرأ بها في نفسك فإني سمعت رسول الله ﷺ يقول:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (395) ومالك في الموطأ (224)."],[143],0],[379,"q","الباجي","","« فذكر النبي ﷺ ما يقوله الباري تعالى عند قراءة العبد كل آية منها، وأَعلمَ العبدَ أنَّ ربَّه يسمع قراءته، وحمده، وثناءه عليه، وتمجيده إياه، ودعاءه ورغبته إليه؛ حضًّا للعبد على الخشوع عند قراءة هذه السورة التي تختص بها هذه المعاني التي لا نعلم اجتماعها في سورة من السور »","قال أبو الوليد الباجي رحمه الله:","","",["المنتقى شرح موطأ مالك (1/ 158) حديث رقم (224)."],[143],0],[380,"a","","","« يا موسى! إذا ذكرتني فاذكرني وأنت تنتفض أعضاؤك، وكن عند ذكري خاشعاً مطمئناً، وإذا ذكرتني فاجعل لسانك من وراء قلبك، وإذا قمت بين يدي فقم قيام العبد الذليل، وناجني بقلب وجل ولسان صادق »","وقد رُوي أن الله سبحانه أوحى إلى موسى عليه السلام:","","",["إحياء علوم الدين (1/ 163)."],[143],1],[381,"n","","","ولقد كان السلف يفقهون هذا المعنى ويعملون به، حتى إنَّ أحدهم لا يأبهُ لِما يجري حولَهُ إذا كان في الصلاة؛ فهذا أبو عبد الله النباجي صَلَّى يومًا بأهلِ طَرَسُوس، فَصِيحَ بالنفير، فلم يخفف الصلاة، فلما فرغوا قالوا: أنت جاسوس, قال: ولم؟ قالوا: صيح بالجهاد وأنت في الصلاة فلم تخفف! قال: ما حسبت أن أحدًا يكون في الصلاة فيقع في سمعه غير ما يخاطبه به الله عز وجل","","","",["صفة الصفوة (4/ 279)."],[143],0],[382,"h","النبي ﷺ","النبي صلى الله عليه وآله وسلم","وقال ابن عثيمين رحمه الله: « أكثر معين على الخشوع في الصلاة أن يشعر الإنسان إذا وقف يصلي أنه يناجي الله عز وجل ويخاطبه، وأن الله عز وجل يرد عليه هذه المناجاة، كما ثبت في الصحيح من حديث أبي هريرة رضي الله عنه، عن النبي صلى الله عليه وآله وسلم أنه قال: قال الله تعالى: «قسمت الصلاة بيني وبين عبدي نصفين...» الحديث","ه يناجي الله عز وجل ويخاطبه، وأن الله عز وجل يرد عليه هذه المناجاة، كما ثبت في الصحيح من حديث أبي هريرة رضي الله عنه، عن النبي صلى الله عليه وآله وسلم أنه قال: قال الله تعالى: «قسمت الصلاة بيني وبين عبدي نصفين...» الحديث","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (395) ومالك في الموطأ (224)."],[143],0],[383,"q","ابن عثيمين","","« أكثر معين على الخشوع في الصلاة أن يشعر الإنسان إذا وقف يصلي أنه يناجي الله عز وجل ويخاطبه، وأن الله عز وجل يرد عليه هذه المناجاة، كما ثبت في الصحيح من حديث أبي هريرة رضي الله عنه، عن النبي صلى الله عليه وآله وسلم أنه قال: قال الله تعالى: «قسمت الصلاة بيني وبين عبدي نصفين...» الحديث , فإذا شعر الإنسان بهذا الشعور، فلا بد أن يستحضر ما يقوله ويفعله في صلاته؛ لأنه بين يدي الله عز وجل، الذي يعلم ما في قلبه ويعلم ما توسوس به نفسه »","وقال ابن عثيمين رحمه الله:","","",["سلسلة فتاوى نور على الدرب « الشريط رقم [246]."],[143],0],[384,"a","","","« وأَحضِرْ قلبك ما أنت فيه، وفرِّغه من الوسواس، وانظُرْ بين يدي من تقوم، ومن تناجي، واستح أن تناجي مولاك بقلبٍ غافل، وصدرٍ مشحون بوساوس الدنيا وخبائث الشهوات. واعلم أنه تعالى مطَّلع على سريرتك وناظر إلى قلبك، فإنما يتقبل الله من صلاتك بقدر خشوعك وخضوعك وتواضعك وتضرعك، واعبده في صلاتك كأنك تراه؛ فإن لم تكن تراه فإنه يراك. فإن لم يحضر قلبك ولم تسكن جوارحك لقصور معرفتك بجلال الله تعالى، فقدِّر أن رجلًا صالحًا من وجوه أهل بيتك ينظر إليك ليعلم كيف صلاتك، فعند ذلك يحضر قلبك وتسكن جوارحك، ثم ارجع إلى نفسك وقل: يا نفس السوء الا تستحين من خالقك ومولاك، إذ قدَّرت اطَّلاع عبدٍ ذليل من عباده عليك، وليس بيده ضرك ولا نفعك، خشعت جوارحك وحسنت صلاتك، ثم إنك تعلمين أنه مطلع عليك، ولا تخشعين لعظمته، أهو - تعالى - عندك أقل من عباده؟! فما أشد طغيانك وجهلكّ وما أعظم عداوتك لنفسك. وعالج قلبك بهذه الحيل فعسى أن يحضر معك في صلاتك؛ فإنه ليس لك من صلاتك إلا ما عقلت منها، وأما ما أتيت مع الغفلة والسهو فهو إلى الاستغفار والتكفير أحوج »","قال رحمه الله:","","",["بداية الهداية (ص/ 44ــ 45)."],[144],0],[385,"a","أبو عبد الله البراثي","","« ومن لم يعرف ثواب الأعمال ثقلت عليه الأعمال في جميع الأحوال »","قال أبو عبد الله البراثي رحمه الله:","","",["المجالسة وجواهر العلم (6/ 80)."],[72],0],[386,"n","","","وتقدم ذكر أدلة ثواب الخاشعين في أول هذا الفصل","","","",["الفصل الثاني: المبحث الثاني: الترغيب في تحقيق الخشوع (ص/ 16)."],[72],0],[387,"h","النبي ﷺ","","«فإن هو قام فصلى، فحمد الله وأثنى عليه، ومجده بالذي هو له أهل، وفرغ قلبه لله، إلا انصرف من خطيئته كهيئته يوم ولدته أمه»","وتقدم ذكر أدلة ثواب الخاشعين في أول هذا الفصل, ومنها: حديث عمرو بن عبسة السلمي رضي الله عنه، وفيه:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (832)."],[72],0],[388,"h","النبي ﷺ","","«ما من مسلم يتوضأ فيحسن وضوءه. ثم يقوم فيصلي ركعتين، مقبل عليهما بقلبه ووجهه، إلا وجبت له الجنة»","وحديث عقبة بن عامر رضي الله عنه وفيه:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (234)."],[72],0],[389,"h","النبي ﷺ","الرسول","«لا صلاة بحضرة طعام، ولا وهو يدافع الأخبثان»","ثالثاً: أن يعتقد كثرة الثواب بالخشوع، فهذه من الأسباب أن الإنسان يستحضر ذلك، ولهذا قال الرسول ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (560)، من حديث عائشة رضي الله عنها."],[72],0],[390,"q","ابن عثيمين","","« فمن أكبر العون على الخشوع: أولاً: أن يعتقد الإنسان أنه واقف بين يدي الله. ثانياً: أن يعتقد أن الخشوع من كمال الصلاة، وأن الإنسان ربما ينصرف من صلاته، وما كتب له منها إلا نصفها أو ربعها أو عشرها. ثالثاً: أن يعتقد كثرة الثواب بالخشوع، فهذه من الأسباب أن الإنسان يستحضر ذلك، ولهذا قال الرسول ﷺ: «لا صلاة بحضرة طعام، ولا وهو يدافع الأخبثان», لماذا؟ لأن قلبه مشغول »","وقال ابن عثيمين رحمه الله:","","",["سلسلة لقاءات الباب المفتوح« لقاء الباب المفتوح [37]."],[72],0],[391,"q","الطبري","","« أي: والذين هم في صلاتهم متَذلِّلون لله بإدامة ما ألزمهم من فرضه وعبادته، وإذا تذَلَّل لله فيها العبدُ رُؤيت ذِلَّــةُ خضوعه في سكون أطرافه وشغله بفرضه وتركه ما أُمر بتركه فيها »","قال الطبري رحمه الله، في تفسير قوله تعالى: الآية: المؤمنون: 1-2:","","",["تفسير الطبري - جامع البيان (19/ 9) [المؤمنون: 2]."],[49],0],[392,"q","الماوردي","","« قوله تعالى: … فيه وجهان: أحدهما: اسجد أنت يا محمد مصلياً، واقترب أنت يا أبا جهل من النار، قاله زيد بن أسلم. الثاني: اسجد أنت يا محمد في صلاتك لتقرب من ربك، فإن أقرب ما يكون العبد إلى الله تعالى إذا سجد له »","قال الماوردي رحمه الله:","","",["تفسير الماوردي - النكت والعيون (6/ 309) [العلق: ١٩]."],[49],0],[393,"q","ابن عطية","","« قوله: … أي: لِربِّك، … ليه بسجودك وبالطاعة والأعمال الصالحة »","وقال ابن عطية رحمه الله:","","",["تفسير ابن عطية - المحرر الوجيز في تفسير الكتاب العزيز (5/ 503) [العلق: ١٩]."],[49],0],[394,"p","","","وقال القرطبي رحمه الله: « قوله تعالى: … أي: صل لله … أي: تقرب إلى الله جل ثناؤه بالطاعة والعبادة، وقيل: المعنى: إذا سجدت فاقترب من الله بالدعاء، روى عطاء عن أبي هريرة رضي الله عنه، قال: قال رسول الله ﷺ: «أقرب ما يكون العبد من ربه، وأحبه إليه، جبهته في الأرض ساجدًا لله». قال علماؤنا: وإنما كان ذلك لأنها نهاية العبودية والذلة، ولله غاية العزة، وله العزة التي لا مقدار لها، فكلما بعدت من صفته، قربت من جنته، ودنوت من جواره في داره. ولقد أحسن من قال: وَإِذَا تَذَلَّلَتِ الرِّقَابُ تَوَاضُعًا … مِنَّا إِلَيْكَ فَعِزُّهَا فِي ذُلِّهَا »","","","",["تفسير القرطبي - الجامع لأحكام القرآن (14/ 329) [العلق: ١٩]."],[49],0],[395,"q","ابن الملك","","« يعني: أقرب حالات العبد من ربه حال كونه ساجدًا، وهذا لأن حالة السجود تدل على غاية تذلل واعتراف بعبودية نفسه وربوبية ربه، فكان مظنة الإجابة، فأمر رحمه الله بإكثار الدعاء بقوله: \"فأكثروا\" فيه \"الدعاء\" »","قال ابن الملك رحمه الله:","","",["شرح المصابيح لابن الملك (2/ 16)."],[49],0],[396,"q","ابن عثيمين","","« وكل ما يشغل القلب لا تُصلِّ مع وجوده، حتى لو فرض أن حولك أناساً، وضجيجًا؛ كلامٌ يشغلك عن الصلاة، فلا تصل، وأخر الصلاة حتى يزول هذا الضجيج، أو اذهب إلى مكان آخر ليس فيه ضجيج، وذلك أن المقصود من الصلاة، وأن لب الصلاة وروح الصلاة هو: الطمأنينة، والخشوع، وحضور القلب، وليست الصلاة مجرد حركات يقوم بها الإنسان؛ قياماً، وركوعاً، وسجوداً، وقعوداً، أهم شيء أن يكون القلب مصلياً قبل أن يكون البدن مصلياً؛ ولهذا نهي عن الصلاة بحضرة الطعام، وعن الصلاة مع مدافعة الأخبثين، وكذلك كل ما يشغل الإنسان، لا يُصلِّ في حال اشتغاله »","قال ابن عثيمين رحمه الله:","","",["سلسلة لقاءات الباب المفتوح «لقاء الباب المفتوح» [63]."],[145],0],[397,"h","النبي ﷺ","جابر بن سمرة","«ما لي أراكم رافعي أيديكم كأنها أذناب خيل شمس!! اسكنوا في الصلاة»","عن جابر بن سمرة رضي الله عنه، قال: خرج علينا رسول الله ﷺ فقال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (430)."],[146,85],0],[398,"q","النووي","","« قوله رحمه الله: «ما لي أراكم رافعي أيديكم كأنها أذناب خيل شمس» هو بإسكان الميم وضمها، وهي التي لا تستقر بل تضطرب وتتحرك بأذنابها وأرجلها، والمراد بالرفع المنهي عنه هنا: رفعهم أيديهم عند السلام مشيرين إلى السلام من الجانبين كما صرح به في الرواية الثانية »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (4/ 153) حديث رقم (430)."],[146],0],[399,"a","عطاء بن أبي رباح","","« الخشوع: هو أنْ لا تعبث بشيء من جسدك في الصلاة »","وقال عطاء ابن أبي رباح رحمه الله:","","",["تفسير البغوي (3/ 358) [المؤمنون: 2]."],[146,85],0],[400,"a","عمرو بن دينار","","« هو السكون وحسن الهيئة »","وقال عمرو بن دينار رحمه الله:","","",["التفسير البسيط (15/ 521)."],[146],0],[401,"a","طاووس","","« ما رأيت مصليًا مثل ابن عمر، أشدَّ استقبالًا للقبلة بوجهه وكفيه وقدميه »","وقال طاووس رحمه الله:","","",["حلية الأولياء (1/ 304)."],[146],0],[402,"a","غيلان بن جرير","","« كان مسلم بن يسار إذا صلى كأنه ثوب مُلْقًى، من قِلَّةِ الْتِفَاتِهِ »","وقال غيلان بن جرير رحمه الله:","","",["الزهد لأبي حاتم (ص60)."],[146],0],[403,"a","أحمد بن سنان","","« رأيتُ وكيعًا إذا قام إلى الصلاة ليس يتحرك منه شيءٌ، لا يزول، ولا يميل على رِجْل دون الأخرى »","وقال أحمد بن سنان رحمه الله:","","",["سير أعلام النبلاء (9/ 157)."],[146,147,85],0],[404,"a","","","« لو خشع قلبُ هذا لخشعَتْ جوارحُه »","ورأى سعيد بن المسيب رحمه الله رجلًا يعبث بلحيته في صلاته فقال:","ضعيف","لم يصح",["رواه ابن المبارك في كتاب الزهد (1188). وقد رُوي مرفوعًا، ولم يصح."],[146,85],0],[405,"a","مجاهد","","« وكانت العلماء إذا قام أحدهم إلى الصلاة؛ هاب الرحمن عز وجل أن يشذ نظره، أو يلتفت، أو يقلب الحصى، أو يعبث بشيء، أو يحدث نفسه بشيء من الدنيا إلا ناسيًا ما دام في الصلاة »","وقال مجاهد بن جبر رحمه الله:","","",["حلية الأولياء (3/ 282)."],[146,85],0],[406,"h","ا
