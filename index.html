لنبي ﷺ","سهل بن أبي حثمة","«إِذا صلى أحدُكم إلى سُترةٍ فليدْنُ منها، لا يقطعِ الشيطانُ عليه صلاتَه»","عن سهل بن أبي حثمة، يبلغ به النبي ﷺ قال:","صحيح","صححه الألباني في صحيح أبي داود (695)",["رواه أبو داود (695) والنسائي (748). وصححه الألباني في صحيح أبي داود (695)."],[148],0],[407,"a","","","« قلت: فانظر إلى متابعة السنة، وما يترتب عليها من الفوائد الجمة »","ثم قال:","","",["مرقاة المفاتيح شرح مشكاة المصابيح (2/ 646)."],[148],0],[408,"q","القرطبي","","« فإذا أخذت في قراءته فاستعذ بالله من أن يعرض لك الشيطان فيصدك عن تَدَبُّرِهِ والعمل بما فيه، وليس يريد استعذ بعد القراءة، بل هو كقولك: إذا أكلت فقل: بسم الله، أي: إذا أردت أن تأكل »","قال القرطبي عند تفسيره لهذه الآية:","","",["تفسير القرطبي - الجامع لأحكام القرآن (10/ 174) [النحل 98].","تفسير القرطبي - الجامع لأحكام القرآن (10/ 174) [سورة النحل: 98]."],[149,150],0],[409,"n","أبو سعيد الخدر ي","","وعن أبي سعيد الخدر يِّ رحمه الله، قال: كان رسول الله ﷺ إذا قام من الليل كبر ثم يقول: «سبحانك اللهم وبحمدك، وتبارك اسمك، وتعالى جَدُّك، ولا إله غيرُك». ثم يقول: «لا إله إلا الله». ثلاثًا. ثم يقول: «الله أكبرُ كبيرًا» ثلاثًا، «أعوذ بالله السميعِ العليمِ من الشيطانِ الرجيم، من همزِهِ ونفخِه ونفثهِ». ثم يقرأُ","","صحيح","صححه الألباني في صحيح أبي داود (775)",["رواه أبو داود (775) والترمذي (242) وصححه الألباني في صحيح أبي داود (775)."],[149],0],[410,"q","المباركفوري","","« قوله: «من همزه» بدل اشتمال أي: وسوسته. «ونفخه» أي: كبره المؤدي إلى كفره. «ونفثه» أي: سحره »","قال المباركفوري رحمه الله:","","",["تحفة الأحوذي بشرح جامع الترمذي (2/ 43) حديث رقم (242)."],[149],0],[411,"h","النبي ﷺ","عبد الله بن مسعود","« وهمزُه: المُوتةُ، ونفثُه: الشِّعرُ، ونفخهُ: الكبرياءُ- المُوتَة: شبه الجنون »","وعن عبد الله بن مسعود رضي الله عنه، عن النبي ﷺ: أنه كان يتعوذ من الشيطان، من همزه ونفثه ونفخه. قال:","حسن لغيره","حسنه ابن حجر كما في نتائج الأفكار (1/ 415) وصححه لغيره شعيب الأرناؤوط في تخريج المسند (3828)",["رواه أحمد (3828) وابن ماجه (808) وحسنه ابن حجر كما في نتائج الأفكار (1/ 415) وصححه لغيره شعيب الأرناؤوط في تخريج المسند (3828)."],[149],0],[412,"q","القرطبي","","« قوله تعالى: … أي: على ترسُّل في التلاوة وترتيل، قاله مجاهد، وابن عباس، وابن جريج. فيعطي القارئ القراءة حقها مِنْ ترتيلها وتحسينها وتطييبها بالصوت الحسن ما أمكن، من غير تلحين ولا تطريبٍ مؤدٍّ إلى تغيير لفظ القرآن بزيادة أو نقصان فإن ذلك حرام »","قال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (10/ 339) [الإسراء 106].","تفسير القرطبي - الجامع لأحكام القرآن (10/ 339) [الإسراء: 106]."],[151,152],0],[413,"h","النبي ﷺ","حفصة","« ما رأيت رسول الله ﷺ صلى في سبحته قاعدًا حتى كان قبلَ وفاته بعام، فكان يصلي في سبحته قاعدًا، وَكَانَ يَقْرَأُ بِالسُّورَةِ، فَيُرَتِّلُهَا حَتَّى تَكُونَ أَطْوَلَ مِنْ أَطْوَلَ مِنْهَا »","وعن حفصة رضي الله عنها، أنها قالت:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (733)."],[151],0],[414,"h","النبي ﷺ","قتادة","« سُئِلَ أنسٌ رضي الله عنه: كيف كانت قراءة النبي ﷺ ؟ فقال: كانت مَدًّا، ثم قرأ: «بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ»، يمد ببسم الله، ويمد بالرحمن، ويمد بالرحيم »","وعن قتادة رحمه الله قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (5046)."],[151],0],[415,"q","العظيم آبادي","","« \"كان يمدُّ مدًّا\" المراد أنه كان يمدّ ما كان في كلامه من حروف المد واللين بالقدر المعروف وبالشرط المعلوم عند أرباب الوقوف»","قال العظيم آبادي رحمه الله:","","",["عون المعبود شرح سنن أبي داود (4/ 238) حديث رقم (1465)."],[151],0],[416,"q","ابن كثير","","« المطلوب شرعاً؛ إنَّما هو التَّحسين بالصَّوت، الباعث على تدبُّر القرآن وتفهُّمه، والخشوع والخضوع، والانقياد للطَّاعة »","وقال ابن كثير رحمه الله:","","",["مقدمة التفسير، فضائل القرآن (ص/ 195)."],[151],0],[417,"q","","","« العمل لا يُقبل حتى يكونَ خالصًا صوابًا، فالخالص إذا كان الله، والصواب إذا كان على السنة »","قال الفضيل بن عياض رحمه الله: « قوله: … أي: أخلصُه وأصوبُه ». وقال رحمه الله:","","",["تفسير البغوي (5/ 124) [الملك: ٢]."],[153],0],[418,"q","الشوكاني","","« أي: وإن تطيعوه فيما أمركم به ونهاكم عنه؛ تهتدوا إلى الحق وترشدوا إلى الخير وتفوزوا بالأجر »","قال الشوكاني رحمه الله في تفسير قوله: …:","","",["فتح القدير (4/ 55) [النور: ٥٤]."],[154],0],[419,"h","النبي ﷺ","عبد الله بن الشخير","« أتيت النبي ﷺ وهو يصلي، ولجوفه أزيز كأزيز المِرجَل, يعني: يبكي »","عن عبد الله بن الشخير رضي الله عنه قال:","صحيح","صححه الألباني في صحيح النسائي (1213)",["رواه النسائي (1214) وأبو داود (904) وأحمد (16312) وصححه الألباني في صحيح النسائي (1213)."],[155],0],[420,"q","الشوكاني","","« في الحديث دليل على أن البكاء لا يبطل الصلاة سواء ظهر منه حرفان أم لا، وقد قيل: إن كان البكاء من خشية الله لم يبطل، وهذا الحديث يدل عليه »","قال الشوكاني رحمه الله:","","",["نيل الأوطار (2/ 375)."],[155],0],[421,"h","النبي ﷺ","علي بن أبي طالب","« ما كان فينا فارس يوم بدر غيرُ المقداد, ولقد رأيتنا وما فينا إلا نائم, إلا رسول الله ﷺ تحت شجرة يصلي, ويبكي, حتى أصبح »","وعن عليٍّ رضي الله عنه قال:","صحيح","صححه الألباني في صحيح الترغيب (٥٤٥)",["رواه ابنُ حبان في صحيحه (2257) وأحمد (1023) وصححه الألباني في صحيح الترغيب (٥٤٥).","رواه أحمد (1023) وصححه الألباني في صحيح الترغيب والترهيب (545)."],[155,156],0],[422,"h","النبي ﷺ","عبد الله بن عمرو بن العاص","«عُرِضَت عليَّ الجنة، حتى لو مددت يدي تناولت من قطوفها، وعرضت عليَّ النار، فجعلت أنفخ خشية أن يغشاكم حرُّها، ورأيت فيها سارق بدنتي رسول الله ﷺ، ورأيت فيها أخا بني دعدع سارق الحجيج، فإذا فطن له قال: هذا عمل المحجن، ورأيت فيها امرأة طويلة سوداء تعذب في هرة ربطتها، فلم تطعمها ولم تسقها، ولم تدعها تأكل من خشاش الأرض حتى ماتت، وإن الشمس والقمر لا ينكسفان لموت أحد ولا لحياته، ولكنهما آيتان من آيات الله، فإذا انكسفت إحداهما - أو قال: فعل أحدهما شيئًا من ذلك - فاسعوا إلى ذكر الله عز وجل»"," الله ﷺ، فصلى رسول الله ﷺ، فأطال القيام، ثم ركع فأطال الركوع، ثم رفع فأطال - قال شعبة: وأحسبه قال في السجود نحو ذلك - وجعل يبكي في سجوده، وينفخ ويقول: «رب لم تعدني هذا وأنا أستغفرك، لم تعدني هذا وأنا فيهم». فلما صلى قال:","صحيح","صححه الألباني في صحيح النسائي (1495)",["رواه النسائي (1496) وأحمد (6483). وصححه الألباني في صحيح النسائي (1495)."],[155],0],[423,"a","عطاء بن أبي رباح","","« دخلت أنا وعبيدُ بنُ عمير على عائشة رضي الله عنها، فقالت لعبيد بن عمير: قد آن لك أن تزورنا؟ فقال: أقول: يا أمه، كما قال الأول: زُرْ غِبًّا تزدَدْ حُبًّا. قال فقالت: دعونا من رطانتكم هذه. قال بن عمير: أخبرينا بأعجبِ شيء رأيتِهِ من رسول الله ﷺ. قال: فسكتت، ثم قالت: لما كان ليلة من الليالي قال «يا عائشةُ ذريني أتعبَّدُ اللَّيلةَ لربِّي» قلت: والله إني لأحب قربك وأحب ما سرَّك. قالت: فقام فتطهر، ثم قام يصلي، قالت: فلم يزل يبكي حتى بلَّ حِجرَهُ، قالت: ثم بكى، فلم يزل يبكي حتى بلَّ لحيتَه، قالت: ثم بكى فلم يزل يبكي حتى بلَّ الأرض، فجاء بلال يؤذنه بالصلاة، فلما رآه يبكي قال: يا رسول الله لِمَ تبكي وقد غفر الله لك ما تقدم وما تأخر؟ قال: «أفلا أكون عبدًا شكورًا، لقد نزلت عليَّ الليلة آيةٌ، ويلٌ لمن قرأها ولم يتفكَّر فيها: الآية: آل عمران: 190» »","وعن عطاءٍ قال:","صحيح","صححه الوادعي في الصحيح المسند مما ليس في الصحيحين (1627)",["رواه ابن حبان في صحيحه (620)، وصححه الوادعي في الصحيح المسند مما ليس في الصحيحين (1627)."],[155],0],[424,"h","النبي ﷺ","عائشة أم المؤمنين","«إنكن صواحب يوسف، مروا أبا بكر فليصل بالناس»","نها قالت: لمَّا مرض رسول الله ﷺ مرضه الذي مات فيه، فحضرت الصلاة، فَأُذِّنَ، فقال: «مروا أبا بكر فليصل بالناس», فقيل له: إن أبا بكر رجل أسيف، إذا قام في مقامك لم يستطع أن يصلي بالناس، وأعاد فأعادوا له، فأعاد الثالثة فقال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (664) ومسلم (418). (أسيف) أي: سريع البكاء والحزن. وقيل: هو الرقيق."],[157],0],[425,"h","النبي ﷺ","عائشة أم المؤمنين","« لم أعقل أبويَّ قطُّ إلا وهما يدينان الدين، ولم يمرَّ علينا يومٌ إلا يأتينا فيه رسول الله ﷺ طرَفي النهار، بكرةً وعشيةً، فلما ابتُلي المسلمون خرج أبو بكر مهاجرًا نحو أرض الحبشة، حتى إذا بلغ بَرْكَ الْغِمَادِ لقيه ابن الدَّغِنَةِ، وهو سيد الْقَارَةِ، فقال: أين تريد يا أبا بكر؟ فقال أبو بكر: أخرجني قومي، فأريد أن أسيحَ في الأرض، وأعبدَ ربي. قال ابنُ الدَّغِنَةِ: فإن مثلك يا أبا بكر لا يَخرُج ولا يُخرَج، إنك تكسِب المعدومَ، وتصلُ الرحم، وتحمل الكَلَّ، وتَقري الضيفَ، وتُعين على نوائب الحق، فأنا لك جارٌ، ارجع، واعبد ربك ببلدك، فرجع، وارتحل معه ابن الدَّغِنَةِ، فطاف ابن الدَّغِنَةِ عشيةً في أشراف قريش، فقال لهم: إن أبا بكر لا يَخْرُجُ مِثْلُهُ، وَلَا يُخْرَجُ، أتخرجون رجلا يكسب المعدوم، ويصل الرحم، ويحمل الكل، ويقري الضيف، ويعين على نوائب الحق؟ فلم تُكَذِّبْ قُرَيْشٌ بجوار ابن الدغنة، وقالوا لابن الدغنة: مر أبا بكر فليعبد ربه في داره، فليصل فيها وليقرأ ما شاء، ولا يُؤْذِينَا بذلك ولا يستعلنْ به، فإنا نخشى أن يفتن نساءنا وأبناءنا. فقال ذلك ابن الدغنة لأبي بكر، فلبث أبو بكر بذلك يعبد ربه في داره، ولا يستعلن بصلاته، ولا يقرأ في غير داره، ثم بدا لأبي بكر، فابتنى مسجدًا بِفِنَاءِ داره، وكان يصلي فيه، ويقرأ القرآن، فينقذفُ عليه نساء المشركين وأبناؤهم، وهم يعجبون منه وينظرون إليه، وكان أبو بكر رجلا بَكَّاءً، لا يملك عينيه إذا قرأ القرآن، وأفزع ذلك أشراف قريش من المشركين، فأرسلوا إلى ابن الدغنة فقدم عليهم، فقالوا: إنا كنا أجرنا أبا بكر بجوارك، على أن يعبد ربه في داره، فقد جاوز ذلك، فابتنى مسجدا بفِناءِ داره، فأعلن بالصلاة والقراءة فيه، وإنا قد خشينا أن يفتن نساءنا وأبناءنا، فانْهَهُ، فإن أحب أن يقتصر على أن يعبد ربه في داره فعل، وإن أبى إلا أن يعلن بذلك، فسله أن يردَّ إليك ذمتك، فإنا قد كرهنا أن نُخفرَك، ولسنا مُقِرِّينَ لأبي بكر الاستعلان. قالت عائشة: فأتى ابن الدغنة إلى أبي بكر فقال: قد علمتَ الذي عاقدتُ لك عليه، فإما أن تقتصر على ذلك، وإما أن تَرْجِعَ إِلَيَّ ذِمَّتِي، فإني لا أحب أن تسمع العرب أني أُخْفِرْتُ في رجل عقدت له. فقال أبو بكر: فإني أرد إليك جوارك، وأرضى بجوار الله عز وجل، والنبي ﷺ يومئذ بمكة، فقال النبي ﷺ للمسلمين: «إِنِّي أُرِيتُ دَارَ هِجْرَتِكُمْ ذَاتَ نَخْلٍ بَيْنَ لَابَتَيْنِ» وهما الحرَّتان، فهاجر من هاجر قبل المدينة، ورجع عامّةُ من كان هاجر بأرض الحبشة إلى المدينة، وتجهَّز أبو بكر قِبلَ المدينة، فقال له رسول الله ﷺ: «عَلَى رِسْلِكَ؛ فَإِنِّي أَرْجُو أَنْ يُؤْذَنَ لِي». فقال أبو بكر: وهل ترجو ذلك بأبي أنت؟ قال: «نعم». فحَبَسَ أبو بكر نفسه على رسول الله ﷺ ليصحبَه، وعلَفَ راحلتين كانتا عنده ورق السمر، وهو الخبَطُ، أربعةَ أشهر »","وعن عائشة رضي الله عنها، زوج النبي ﷺ، قالت:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (3905)."],[157],0],[426,"s","عبد الله بن عمر","","« رأيتُ عمر بن الخطاب البكَّاء، وهو يصلي، حتى سمعت خنينه، من وراء ثلاثة صفوف »","عن عبد الله بن عمر رضي الله عنهما قال:","","",["الرقة والبكاء لابن أبي الدنيا (٤١٦)."],[158],0],[427,"a","علقمة بن وقاص","","« صليت خلف عمر بن الخطاب، فقرأ سورة يوسف، فكان إذا أتى على ذكر يوسف، سمعتُ نشيجه من وراء الصفوف »","وعن علقمة بن وقاص قال:","","",["المصدر السابق (٤١٧)."],[158],0],[428,"a","عبد الله بن شداد","","« سمعت نشيج عمر، وإني لفي الصف خلفه في صلاة، وهو يقرأ سورة يوسف حتى انتهى إلى الآية: يوسف: 86 »","وعن عبد الله بن شداد، قال:","","",[""],[158],0],[429,"q","النووي","","« فيدل على تكريره منه، وفي رواية: أنه بكى حتى سُمِعَ بكاؤه من وراء الصفوف »","قال النووي رحمه الله:","","",["التبيان في آداب حملة القرآن للنووي (ص: 96)."],[158],0],[430,"a","الحسن البصري","","« قرأ عمر بن الخطاب رضي الله عنه: الآية: الطور: 7-8 فرَبا منها رَبْوَةً عِيدَ منها عشرين يومًا »","وعن الحسن البصري رحمه الله، قال:","","",["فضائل القرآن للقاسم بن سلام (ص/ 137)."],[158,159],0],[431,"a","عبيد بن عمير","","« صلى بنا عمر صلاة الفجر فقرأ سورة يوسف حتى إذا بلغ: الآية: يوسف: 84، بكى حتى انقطع فركع »","وقال عبيد بن عمير رحمه الله:","","",["شرح صحيح البخاري لابن بطال (10/ 281)."],[158],0],[432,"s","عبد الله بن عمر","","« هو عثمان بن عفان رضي الله عنه »","عن ابن عمر رضي الله عنهما، أنه قال في قوله تعالى: الآية: الزمر: 9، قال:","","",["البداية والنهاية (٧/ ٣٨١).","المصنف - ابن أبي شيبة (18/ 43) حديث رقم (34209)."],[160,160],0],[433,"a","محمد بن سيرين","","« قالت امرأة عثمان رضي الله عنه حين أطافوا به يريدون قتله: إن تقتلوه أو تتركوه فإنه كان يحيي الليل كله في ركعة يجمع فيها القرآن »","وعن محمد بن سيرين رحمه الله قال:","","",["رواه الطبراني في الكبير (1/ 87) رقم (130)."],[160],0],[434,"n","سليمان بن يسار","","وعن سليمان بن يسار رحمه الله، أن عثمان بن عفان رضي الله عنه، قام بعد العشاء فقرأ القرآن كله في ركعة، لم يصل قبلها ولا بعدها","","","",["رواه ابن المبارك في الزهد (ص452) رقم (1275)."],[160],0],[435,"q","ابن تيمية","","« وقراءة القرآن في ركعة ثابت عن عثمان رضي الله عنه »","وقال شيخ الإسلام ابن تيمية رحمه الله:","","",["منهاج السنة النبوية (4/ 32)."],[160],0],[436,"q","ابن كثير","","« وقد رُوي هذا من غير وجه أنه صلى بالقرآن العظيم في ركعة واحدة عند الحجر الأسود، أيام الحج. وقد كان هذا من دأبه، رحمه الله »","قال ابن كثير رحمه الله:","","",["البداية والنهاية (٧/ ٣٨١)."],[160],1],[437,"p","","","ضحوا بأشمط عنوان السجود به … يقطع الليل تسبيحًا وقرآنًا","","","",["المصدر السابق."],[160],0],[438,"h","النبي ﷺ","","«من توضأ نحو وضوئي هذا ثم صلى ركعتين لا يحدث فيهما نفسه، غفر له ما تقدم من ذنبه»","وهذا يدل على خشوعه رحمه الله، فإن الصلاة ثقيلة إلا على الخاشعين؛ ولهذا كان يحدِّث بقول النبي ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (159) ومسلم (226)."],[160],0],[439,"q","النووي","","« وأما قوله رحمه الله: «لا يحدث فيهما نفسه»، فالمراد لا يحدِّث بشيء من أمور الدنيا وما لا يتعلق بالصلاة، ولو عرض له حديث فأعرض عنه بمجرد عروضه عفي عن ذلك، وحصلت له هذه الفضيلة - إن شاء الله تعالى -؛ لأن هذا ليس من فعله، وقد عفي لهذه الأمة عن الخواطر التي تعرض ولا تستقر »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (3/ 108) حديث رقم (226)."],[160],0],[440,"n","","","كان عليٌّ رضي الله عنه إذا أذَّن المؤذن وحضر وقت الصلاة تزلزل وتلوّن، فقيل له: ما لك؟ فيقول: جاء وقت أمانة عرضها اللَّه على السماوات والأرض فأبين أن يحملنها، وأشفقن منها، وحملها الإنسان","","","",["شرح سنن أبي داود لابن رسلان (19/ 123)."],[161],0],[441,"n","","","والقاسم هو ابن أخيها محمد بن أبي بكر رضي الله عنه","","","",["صفة الصفوة (2/229)."],[162],0],[442,"s","عائشة أم المؤمنين","","« في الصلاة؟ فقال: في الصلاة »","وعن مسروق، عن عائشة رضي الله عنها، أنها مرت بهذه الآية: الآية: الطور: 27 فقالت: « اللهم من علينا، وقنا عذاب السموم، إنك أنت البر الرحيم ». فقيل للأعمش:","","",["مصنف ابن أبي شيبة (2/ 25) رقم (6036). وشُعب الإيمان للبيهقي (2092)."],[162],0],[443,"h","النبي ﷺ","جابر بن عبد الله","« خرجنا مع رسول الله ﷺ - يعني في غزوة ذات الرقاع-، فأصاب رجل امرأة رجل من المشركين، فحلف أنْ لا أنتهي حتى أُهريق دمًا في أصحاب محمد، فخرج يتبع أثر النبي ﷺ، فنزل النبي ﷺ منزلًا فقال: «مَنْ رَجُلٌ يَكْلَؤُنَا؟». فانتدب رجل من المهاجرين ورجل من الأنصار، فقال: «كُونَا بِفَمِ الشِّعْبِ». قال: فلما خرج الرجلان إلى فم الشعب اضطجع المهاجري، وقام الأنصاري يصلي، وأتى الرجل، فلما رأى شخصه عرف أنه ربيئة للقوم، فرماه بسهم فوضعه فيه، فنزعه، حتى رماه بثلاثة أسهم، ثم ركع وسجد، ثم انتبه صاحبه، فلما عرف أنهم قد َنذِرُوا به هرب، فلما رأى المهاجري ما بالأنصاري من الدماء قال: سبحان الله ألا أَنبَهتَنِي أوَّلَ ما رَمَى؟ قال: كنت في سورة أَقرَؤُها فلم أُحِبَّ أن أَقْطَعَها »","عن جابر بن عبد الله رضي الله عنه، قال:","حسن","حسنه الألباني في صحيح أبي داود (198) وشعيب الأرناؤوط في تخريج المسند (14704)",["رواه أبو داود (198) وأحمد (14865) وحسنه الألباني في صحيح أبي داود (198) وشعيب الأرناؤوط في تخريج المسند (14704)."],[163],0],[444,"a","","","« يغفر الله لك، ألا كنت آذنتني أول ما رماك؟ قال: فقال: كنت في سورة من القرآن قد افتتحتها أصلي بها، فكرهت أن أقطعها، وَايْمُ اللَّهِ، لولا أن أضيع ثغرًا أمرني رسول الله ﷺ بحفظه، لَقَطَعَ نَفْسِي قبل أن أقطعها »","وعند أحمد زيادة: فقال له أخوه المهاجري:","","",["المسند (14865)."],[163],0],[445,"a","عمرو بن دينار","","« كان ابن الزبير رضي الله عنهما، يصلي في الحِجْر، والمنجنيق يصُبُّ تُوبَهُ، فما يلتفت، يعني لمَّا حاصروه - التُّوب: حَجَرُ المنجنيق »","عن عمرو بن دينار رحمه الله، قال:","","",["سير أعلام النبلاء (3/ 369)."],[164],0],[446,"a","","","« أنها دخلت على ابن الزبير بيته، فإذا هو يصلي، فسقطت حيَّةٌ على ابنه هاشم، فصاحوا: الحية، الحية! ثم رموها، فما قطع صلاته »","وعن عمر بن قيس، عن أمه:","","",["تاريخ الإسلام للذهبي (5/ 439)."],[164],0],[447,"a","مجاهد","","« كان ابن الزبير رضي الله عنهما، إذا قام إلى الصلاة كأنه عود, وحدَّث أن أبا بكر رضي الله عنه كان كذلك »","وعن مجاهد رحمه الله، قال:","","",["سير أعلام النبلاء (3/ 368)."],[164],0],[448,"n","يحيى بن وثاب","","عن يحيى بن وثاب رحمه الله، أن ابن الزبير كان يسجد حتى تنزل العصافير على ظهره، ولا تَحْسبُه إلا جِذْمَ حائط","","","",["الزهد للإمام أحمد بن حنبل (ص/ 164) رقم (1114)."],[164],0],[449,"a","ثابت البناني","","« كنت أمرُّ بابن الزبير رضي الله عنهما، وهو خلف المقام يصلي كأنه خشبة منصوبةٌ لا تتحرك »","وقال ثابت البناني رحمه الله:","","",["سير أعلام النبلاء (3/ 369)."],[164],0],[450,"n","","","فقطعوا رجله من فوق الأكلة من المكان الحي؛ احتياطًا أنْ لا يبقى منها شيء، وهو قائم يصلي، فما تضوَّر ولا اختلج","","","",["البداية والنهاية (9/101) و (وفيات الأعيان) لابن خلكان (2/418)."],[165],0],[451,"a","يزيد بن الكميت","","« كان أبو حنيفة رحمه الله شديد الخوف من الله تعالى، فقرأ بنا عليُّ بن الحسن ليلةً في العشاء الآخرة: الآية: الزلزلة: 1، وأبو حنيفة خلفه، فلما قضى الصلاة، وخرج الناس، نظرت إليه وهو جالس يتفكر ويتنفس، فقلت: أقوم لا يشتغل بي، فلما خرجت تركت القنديل ولم يكن فيه إلا زيتٌ قليل، فجئت وقد طلع الفجر وهو قائم يصلي، وقد أخذ بلحية نفسه وهو يقول: يا مَن يجزي بمثقال ذرةٍ خيرًا خيرًا، ويا من يجزي بمثقال ذرةٍ شرًّا شرًّا، أجِرِ النعمانَ عبدَك من النار ومما يقرب منها من سوء وأدخله في سعة رحمتك. قال: فأذَّنتُ والقنديل يزهر وهو قائم، فلما دخلت قال: تريد أن تأخذ القنديل؟ قلت: قد أُذِّنَ لصلاة الغداة. قال اكتم عليَّ ما رأيت. وركع ركعتين، ثم جلس حتى أقيمت الصلاة، وصلى معنا الغداة على وضوء أول الليل »","قال يزيد بن الكميت رحمه الله:","","",["سير أعلام النبلاء (2/ 1198)."],[166],0],[452,"n","","","وقد ردد أبو حنيفة ليلةً كاملة قوله تعالى: الآية: القمر: 46 »","","","",["الأخبار العليات (2/1193)."],[166],0],[453,"a","مقاتل بن حيان","","« صليت خلف عمر بن عبد العزيز فقرأ: الآية: الصافات: 24 فجعل يكررها، لا يستطيع أن يجاوزها »","عن مقاتل بن حيان رحمه الله، قال:","","",["الرقة والبكاء لابن أبي الدنيا رقم (٤٢٦)، وسيرة عمر بن عبد العزيز لابن الجوزي [ص/ ١٥٧]."],[167],0],[454,"a","محمد بن أبي الحارث الثقفي","","« رأيتُ عمر بن عبد العزيز رفع رأسه من السجود، فقعد بين السجدتين مقدار عشرين آية، ثم سجد، فلما رفع رأسه، نظرتُ إلى الدموع سائلة على خدَّيْه، قال أبو عمرو: قلت لمحمد: أفي التطوع كان ذلك؟ قال: نعم بمكة »","وعن محمد بن أبي الحارث الثقفي رحمه الله قال:","","",["تاريخ دمشق لابن عساكر (52/ 245)."],[167],0],[455,"a","علي بن شبيب","","« حدثنا أصحابنا الحجيون قالوا: لما رفع عمر بن عبد العزيز رأسه من السجود خلف المقام، نظروا إلى موضع سجوده مبتلًا من دموع عينيه »","وعن علي بن شبيب رحمه الله، قال:","","",["سيرة عمر بن عبد العزيز لابن الجوزي (ص/ ١٥٨)."],[167],0],[456,"a","معتمر بن سليمان التيمي","","« صلى بنا أَبي، فقرأ سورة [ق] في صلاة الفجر، فلما انتهى إلى هذه الآية الآية: ق: 19، غلبته عَبْرَتُه، فلم يستطع أن يجوز، فركع »","عن معتمر بن سليمان التيمي رحمه الله، قال:","","",["الرقة والبكاء لابن أبي الدنيا (٨٥)."],[168],0],[457,"a","بكر بن منير","","« كان محمد بن إسماعيل البخاري يصلي ذات ليلة، فلسعه الزنبور سبع عشرة مرة، فلما قضى الصلاة، قال: انظروا أيش آذاني! »","عن بكر بن منير رحمه الله، قال:","","",["سير أعلام النبلاء (12/ 441)."],[169],0],[458,"a","محمد بن أبي حاتم الوراق","","« دُعي محمد بن إسماعيل إلى بستان بعض أصحابه، فلما حضرت صلاة الظهر صلى بالقوم، ثم قام للتطوع، فأطال القيام، فلما فرغ من صلاته رفع ذيل قميصه. فقال لبعض من معه: انظر هل ترى تحت قميصي شيئًا؟ فإذا زنبورٌ قد أبره في ستة عشر أو سبعة عشر موضعًا، وقد تورَّم من ذلك جسده، وكان آثار الزنبور في جسده ظاهرة. فقال له بعضهم: كيف لم تخرج من الصلاة في أول ما أبرك؟ فقال: كنت في سورة فأحببتُ أن أتمها »","وقال محمد بن أبي حاتم الوراق رحمه الله:","","",["تاريخ بغداد ت بشار (2/ 331)."],[169],0],[459,"a","محمد بن يعقوب بن الأخرم","","« ما رأيت أحسن صلاة من محمد بن نصر، كان الذباب يقع على أذنه فيسيل الدم ولا يذبُّه عن نفسه، ولقد كنا نتعجب من حسن صلاته وخشوعه وهيئته للصلاة! كان يضع ذقنه على صدره، فينتصب كأنه خشبة منصوبة »","قال محمد بن يعقوب بن الأخرم رحمه الله:","","",["شعب الإيمان (3/ 152) رقم (3175)."],[170],0],[460,"a","أبو بكر الصبغي","","« أدركتُ إمامين لم أرزق السماع منهما: أبو حاتم الرازي، ومحمد بن نصر المروزي، فأما ابنُ نصر فما رأيتُ أحسن صلاةً منه، لقد بلغني أن زنبورًا قعد على جبهته فسال الدم ولم يتحرك! »","وقال أبو بكر الصبغي رحمه الله:","","",["سير أعلام النبلاء (14/ 36)."],[170],0],[461,"q","الذهبي","","« وهل يراد من العلم إلا ما انتهى إليه الفضيل رحمة الله عليه؟ »","ثم قال الذهبي رحمه الله:","","",["سير أعلام النبلاء (8/448)."],[171],0],[462,"s","عبد الله بن مسعود","","« ليس العلمُ بكثرة الرواية، إنما العلمُ الخشية »","ثم قال الذهبي رحمه الله: « وهل يراد من العلم إلا ما انتهى إليه الفضيل رحمة الله عليه؟ », وهذا كما قال ابن مسعود رضي الله عنه:","","",["أخرجه بن حبان في روضة العقلاء رقم (69) صـ (61)."],[171],0],[463,"s","عبد الله بن مسعود","","« كفى بخشية اللَّه علمًا، وكفى بالاغترار به جهلًا »","وقال عبد اللَّه بن مسعود رضي الله عنه:","","",["المصنف - ابن أبي شيبة (19/ 331)."],[171],0],[464,"a","مجاهد والشعبي","","« إنما العالم من يخشى الله »","وقال مجاهد والشعبي:","","",["تفسير ابن عطية - المحرر الوجيز في تفسير الكتاب العزيز (4/ 437) [سورة فاطر: ٢٨]."],[171],0],[465,"a","قادم الديلمي","","« أخذ فضيل بن عياض بيدي فقال لي: ابك على فضيل أيام الدنيا، فإني رأيت منك ودًّا، رفع رأسه مرة من سجوده في مسجد الكوفة، فإذا الحصى مبتلٌّ، قال: ثم بكى للرحيل حتى رحمته »","وعن قادم الديلمي رحمه الله ، قال:","","",["الرقة والبكاء (١٣٥)."],[171],0],[466,"a","سفيان بن عيينة","","« ما رأيت أحداً أخْوف من الفضيل وابنه »","وعن سفيان بن عيينة رحمه الله قال:","","",["صفة الصفوة (1/ 433)."],[171],0],[467,"q","الذهبي","","« وكان عليٌّ قانتًا لله، خاشعًا، وجلًا، ربانيًا، كبير الشأن »","قال الذهبي رحمه الله:","","",["سير أعلام النبلاء (8/ 443)."],[172],0],[468,"a","إبراهيم بن بشار","","« الآية التي مات فيها عليّ بن الفضيل في الأنعام الآية: الأنعام: 27, مع هذا الوضع مات, وكنت فيمن صلى عليه رحمه الله »","وعن براهيم بن بشار رحمه الله قال:","","",["تاريخ بغداد (5/ 454).","شعب الإيمان (2/ 303)."],[172,173],0],[469,"q","الخطيب","","« مات قبل أبيه بمدة من آية سمعها تقرأ، فغشي عليه، وتوفي في الحال »","وقال الخطيب رحمه الله:","","",["سير أعلام النبلاء (8/ 443)."],[172],0],[470,"n","عبد الرحمن بن عفان","","رواها: ابن أبي الدنيا، عن عبد الرحمن بن عفان، وزاد: وبقي فضيل لا يجاوز الآية، ثم صلى بنا صلاة خائف، وقال: فما أفاق إلى نصف من الليل","","","",["سير أعلام النبلاء (8/443)."],[172],0],[471,"a","الفضيل بن عياض","","« بكى ابني علي، فقلت: يا علي ما يبكيك؟ قال: يا أبه! أخاف ألاّ تجمعنا القيامة »","وعن فضيل بن عياض رحمه الله، قال:","","",["صفة الصفوة (1/ 433)."],[172],0],[472,"a","محمد بن الحسن","","« كان علي بن الفضيل يصلّي حتى يزحف إلى فراشه ثم يلتفت إلى أبيه فيقول: يا أبه! سبَقني العابدون »","وعن محمد بن الحسن قال:","","",["المصدر السابق."],[172],0],[473,"a","الحسن البصري","","« إذا أذَّن المؤذِّن لم تبعد دابَّةُ بَرٍّ ولا بحر إلا أصغت واستمعت، قال: ثم بكى الحسن بكاء شديداً »","عن الحسن البصري رحمه الله، قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٤٢)."],[174],0],[474,"a","قادم الديلمي","","« كنا عند فضيل بن عياض وهو في المسجد، فأذَّن المؤذن، فبكى حتى بلَّ الحصى، ثم قال: أُشَبِّهُهُ بالنداء. ثم بكى »","وعن قادم الديلمي رحمه الله، قال:","","",["المصدر السابق (١٤٧)."],[174],0],[475,"a","الحارث بن سعيد","","« كان أبو عمران الجوني رحمه الله إذا سمع الأذان، تغيَّر لونه، وفاضت عيناه »","وعن الحارث بن سعيد رحمه الله، قال:","","",["صفة الصفوة (٣/٢٦٥)."],[174],0],[476,"a","سفيان بن عيينة","","« كان منصور بن صَفيَّة رحمه الله يبكي في وقت كل صلاة، فكانوا يرون أنه يذكُر الموتَ والقيامة عند الصلوات »","وعن سفيان بن عيينة رحمه الله، قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٤١)."],[174],0],[477,"a","سفيان بن عيينة","","« كان أبو خالد المؤذن رحمه الله إذا أذَّن بكى، وربما صرخ الصرخة في إثر الأذان، فقال له بعض أولياء الأمر: ما الذي يغشاك عند النداء؟ فبكى ثم قال: إنني لأشبهه بالقيامة. ثم غُشي عليه، قال سفيان: وسمعته يقول: لولا ما أؤمل من الفَرج والراحة بعد الأذان، لظننت أن نفسي ستخرج فَرَقاً من الموت! قال سفيان: وذكروا عنه أنه كان يقول إذا فرغ من أذانه: انقطعت الرغائب دونك، وكلَّت الألسن إلا عن ذكرك، وذهلت عقول أوليائك عن غيرك شوقًا واشتياقًا، فأعطِ القوم إلهي أمنيتهم، وأجب دعوتهم، وتفضَّل علينا وعليهم بجودك يا كريم. أو قال نحواً من هذا »","وعن سفيان بن عيينة رحمه الله، قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٤٥ - ١٤٦)."],[174],0],[478,"a","عبد الوهاب الحارثي","","« كان أبو بكر النهشلي رحمه الله إذا سمع النداء، تغيَّر لونه، وأرسل عينيه فبكى، قال: وحدثني رجل، من بني ... أنه قال سألته عن ذلك، فقال: أشبِّهه بالصريخ يوم العَرْض. قال: ثم غُشي عليه»","وعن عبد الوهاب الحارثي رحمه الله، قال:","","",["المصدر السابق (١٤٣ -٢٤٤)."],[174],0],[479,"a","عبد الرحمن بن حفص القرشي","","« كان علي بن الحسين بن علي بن أبي طالب رضي الله عنه إذا توضأ اصفَرَّ، فيقول له أهله: ما هذا الذي يعتادك عند الوضوء؟ فيقول: تدرون بين يدي من أريد أن أقوم؟! »","عن عبد الرحمن بن حفص القرشي رحمه الله، قال:","","",["المجالسة وجواهر العلم (3/ 154)."],[175],0],[480,"a","أحمد بن إسحاق الحضرمي","","« حدثني شيخ من أهل واسط يكنى أبا سعيد، وكان جارًا لمنصور بن زاذان قال: رأيت منصورًا توضأ فلما فرغ دمَعَتْ عيناه، ثم جعل يبكي حتى ارتفع صوته، فقلت: رحمك الله ما شأنك؟! قال: وأي شيء أعظم من شأني؟ إني أريد أن أقوم بين يدي من لا تأخذه سِنة ولا نوم »","وعن أحمد بن إسحاق الحضرمي رحمه الله، قال:","","",["صفة الصفوة لابن الجوزي (٣/١٢)."],[175],0],[481,"a","نعيم بن مورع بن توبة التميمي","","« كان عطاء السليمي رحمه الله إذا فرغ من طُهوره ارتعد وانتفض، وبكى بكاءً شديدًا، فقيل له في ذلك، فقال: إني أريد أن أتقدَّم على أمرٍ عظيم، إني أريد أن أقوم بين يدي الله »","وعن نعيم بن مورِّع بن توبة التميمي رحمه الله قال:","","",["حلية الأولياء (٦/٢١٨)."],[175],0],[482,"a","محمد بن عبد الله الزراد","","« صليت إلى جنب رياح القيسي رحمه الله، فكنت أسمع وقع دموعه على البواري مثل الوكف: طق طق »","عن محمد بن عبد الله الزرَّاد رحمه الله قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٣١)."],[176],0],[483,"s","عبيد الله بن عمر","","« أتيت صاحباً لي يقال له عمران بن مسلم، فأراني موضعين مبتلِّين في مسجده، أحدهما بحذاء الآخر، فقلت: ما هذا؟ قال: هذا والله من دموع ضيغم - ضيغم بن مالك الراسبي- البارحة بين المغرب والعشاء وهو راكع »","وعن عبيد الله بن عمر رضي الله عنهما، قال:","","",["صفة الصفوة (٣/٣٥٧)."],[176],0],[484,"s","أفلح مولى محمد بن علي","","« خرجت مع محمد بن علي حاجًا؛ فلما دخل المسجد نظر إلى البيت فبكى حتى علا صوته، فقلت: بأبي أنت وأمي! إن الناس ينظرون إليك، فلو رفقت بصوتك قليلًا! قال: ويحك يا أفلح! ولم لا أبكي؟ لعل الله أن ينظر إليَّ منه برحمةٍ فأفوز بها عنده غدًا. قال: ثم طاف بالبيت، ثم جاء حتى ركع عند المقام، فرفع رأسه من سجوده، فإذا موضع سجوده مبتلٌّ من دموع عينيه »","وعن أفلح مولى محمد بن علي قال:","","",["صفة الصفوة (١١٠/٢)."],[176],0],[485,"a","محمد بن جعفر بن يحيى","","« رأيت خالداً الزيات رحمه الله قد رفع رأسه من سجدة ... فنظرت إلى الحصى مبتلة من دموع عينيه »","عن محمد بن جعفر بن يحيى رحمه الله، قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٢٩)."],[176],0],[486,"q","ابن كثير","","« وهذا الأمر مستلزمٌ ترك الكلام في الصلاة، لمنافاته إياها، ولهذا لما امتنع النبي ﷺ من الرد على ابن مسعود حين سلم عليه، وهو في الصلاة، اعتذر إليه بذلك، وقال: «إن في الصلاة لشغلًا» »","قال تعالى: الآية: البقرة: 238 قال ابن كثير رحمه الله:","","",["تفسير ابن كثير (1/ 654) [البقرة: ٢٣٨]. والحديث رواه البخاري (3875) ومسلم (538)."],[177],0],[487,"h","النبي ﷺ","معاوية بن الحكم السلمي","« بينا أنا أصلي مع رسول الله ﷺ إذ عطس رجل من القوم. فقلت: يرحمك الله! فرماني القوم بأبصارهم، فقلت: واثكل أُمِّياهْ! ما شأنكم؟ تنظرون إلي، فجعلوا يضربون بأيديهم على أفخاذهم، فلما رأيتهم يصمتونني، لكني سكت، فلما صلى رسول الله ﷺ، فبأبي هو وأمي! ما رأيت معلمًا قبله ولا بعده أحسن تعليمًا منه، فوالله! ما كهرني ولا ضربني ولا شتمني، قال: «إن هذه الصلاة لا يصلح فيها شيء من كلام الناس، إنما هو التسبيح والتكبير وقراءة القرآن», أو كما قال رسول الله ﷺ »","وعن معاوية بن الحكم السلمي رضي الله عنه قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (537)."],[177],0],[488,"q","النووي","","« فيه تحريم الكلام في الصلاة، سواء كان لحاجة أو غيرها، وسواء كان لمصلحة الصلاة أو غيرها، فإن احتاج إلى تنبيه أو إذن لداخل ونحوه سبَّح إن كان رجلًا، وصفَّقت إن كانت امرأة، هذا مذهبنا ومذهب مالك وأبي حنيفة رحمه الله والجمهور من السلف والخلف ... وهذا في كلام العامد العالم، أما الناسي فلا تبطل صلاته بالكلام القليل عندنا، وبه قال مالك وأحمد والجمهور »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (5/ 21) حديث رقم (537)."],[177],0],[489,"n","اللجنة الدائمة","","ج: تَبطُلُ الصلاة بالقهقهة، ولا تبطل بمجرد الابتسام، ولا يبطل الوضوء بالقهقهة، سواء حصلت أثناء الصلاة أم خارجها لعدم الدليل الصحيح على بطلانه بذلك. وبالله التوفيق، وصلى الله على نبينا محمد، وآله وصحبه وسلم","","","",["اللجنة الدائمة للبحوث العلمية والإفتاء الرئيس/ عبد العزيز بن عبد الله بن باز. (٧/ ٩٤)."],[178],0],[490,"n","","","ج: الضحك في الصلاة لا يجوز، سواء علم أن الضحك يبطل الصلاة أم لا، وهو يبطلها إجماعًا. وبالله التوفيق، وصلى الله على نبينا محمد، وآله وصحبه وسلم","","","",["المصدر السابق."],[178],0],[491,"h","النبي ﷺ","أنس بن مالك","«أَمِيطِي عَنَّا قِرَامَكِ هَذَا، فَإِنَّهُ لَا تَزَالُ تَصَاوِيرُهُ تَعْرِضُ فِي صَلَاتِي»","عن أنس رضي الله عنه، قال: كان قرام لعائشة، سترت به جانب بيتها، فقال النبي ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (374)."],[179],0],[492,"q","ابن حجر","","« «قِرَام» بكسر القاف وتخفيف الراء: ستر رقيق من صوف ذو ألوان، قوله: «أميطي» أي: أزيلي وزنًا ومعنى، «تَعرِض» بفتح أوله وكسر الراء؛ أي: تلوح »","قال ابن حجر رحمه الله:","","",["فتح الباري بشرح صحيح البخاري (1/ 484) حديث رقم (374)."],[179],0],[493,"h","النبي ﷺ","صفية بنت شيبة أم منصور","« أخبرتني امرأة من بني سليم ولدت عامة أهل دارنا، قالت: أرسل رسول الله ﷺ إلى عثمان بن طلحة رحمه الله، قال: «إني كنت رأيت قرني الكبش حين دخلت البيت فنسيت أن آمرك أن تُخَمِّرَهُمَا فَخَمِّرْهُمَا؛ فإنه لا ينبغي أن يكون في البيت شيء يشغل المصلي»، قال سفيان: لم يزل قرنا الكبش في البيت حتى احترق البيت، فاحترقا »","وعن صفية بنت شيبة أم منصور قالت:","صحيح","صححه الألباني في صحيح الجامع (2504)",["رواه أحمد (23221) وأبو داود (2030) وصححه الألباني في صحيح الجامع (2504)."],[179],0],[494,"q","العظيم آبادي","","« قوله: «أن تخمر القرنين»: أي: تغطي قرني الكبش الذي فدى الله تعالى به إسماعيل عليه السلام عن أعين الناس، كذا في فتح الودود، وعثمان هذا هو ابن طلحة القرشي العبدري الحَجَبَي رحمه الله - بفتح الحاء المهملة وبعدها جيم مفتوحة وباء موحدة - منسوبة إلى حِجابة بيت الله الحرام شرفه الله تعالى، وهم جماعة بني عبد الدار إليهم حِجابة الكعبة ومفتاحها، نسب كذلك غير واحد »","قال العظيم آبادي رحمه الله:","","",["عون المعبود شرح سنن أبي داود (6/ 7) حديث رقم (2030)."],[179],0],[495,"h","النبي ﷺ","","«اذْهَبُوا بِخَمِيصَتِي هَذِهِ إِلَى أَبِي جَهْمٍ، وَأْتُونِي بِأَنْبِجَانِيَّةِ أَبِي جَهْمٍ، فَإِنَّهَا أَلْهَتْنِي آنِفًا عَنْ صَلاَتِي»","هي التي فيها نقوش أو ألوان، أو أن تكون ضيقة أو واسعة أكثر من الحاجة، مما يجعل المصلي منشغلًا بها، فيفوته الخشوع؛ ولذلك ورد حديث عائشة رضي الله عنها، أن النبي صلى في خميصة لها أعلام، فنظر إلى أعلامها نظرة، فلما انصرف قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (373) ومسلم (556). والخميصة: كساء مربع من صوف أو غيره به خطوط أو نقوش. والكساء الأنبجاني: كساء من الصوف له أهداب ولا رسم فيه."],[180],0],[496,"q","النووي","","« قال أصحابنا: يستحب له النظر إلى موضع سجوده، ولا يتجاوزه. وقال بعضهم: يكره تغميض عينيه، وعندي لا يكره إلا أن يخاف ضررًا »","لصلاة وتدبر ما ذكرناه، ومنع النظر من الامتداد إلى ما يشغل وإزالة ما يخاف اشتغال القلب به، وكراهية تزويق محراب المسجد وحائطه ونقشه وغير ذلك من الشاغلات، لأن النبي ﷺ جعل العلة في إزالة الخميصة هذا المعنى...» ثم قال النووي:","","",["شرح صحيح مسلم (5/ 44) حديث رقم (556)."],[180],0],[497,"q","ابن دقيق العيد","","« فيه مبادرة الرسول إلى مصالح الصلاة، ونفي ما لعله يخدش فيها، وأما بعثه بالخميصة إلى أبي جهم فلا يلزم منه أن يستعملها في الصلاة. ومثله قوله في حلة عطارد حيث بعث بها إلى عمر: «إني لم أبعث بها إليك لتلبسها», ويحتمل أن يكون ذلك من جنس قوله: «كل فإني أناجي من لا تناجي», ويستنبط منه كراهية كلِّ ما يشغل عن الصلاة من الأصباغ والنقوش ونحوها »","وقال ابن دقيق العيد رحمه الله:","","",["فتح الباري (1/ 483) عند شرح حديث رقم (373)."],[180],0],[498,"q","الطيبي","","« فيه إيذان بأن للصور والأشياء الظاهرة تأثيرًا في القلوب الطاهرة والنفوس الزكية، يعني فضلًا عمن دونها »","وقال الطيبي رحمه الله:","","",["فتح الباري (1/ 483) عند شرح حديث رقم (373)."],[180],0],[499,"h","النبي ﷺ","أنس بن مالك","«إذا نعَس أحدُكم وهو يُصلِّي فلِينصرِفْ فلْينَمْ؛ حتى يعلمَ ما يقولُ»","عن أنس بن مالك رضي الله عنه أن النبي ﷺ قال:","صحيح","صححه الألباني في صحيح الجامع (811)",["أخرجه أحمد (12469) والنسائي (443) وصححه الألباني في صحيح الجامع (811)."],[181],0],[500,"h","النبي ﷺ","عائشة أم المؤمنين","«إذا نعس أحدكم وهو يصلي فليرقدْ حتى يذهبَ عنه النوم، فإن أحدكم إذا صلى وهو ناعسٌ لا يدري لعله يستغفرُ فيسبُّ نفسَهُ»","وعن عائشة رضي الله عنها، أن رسول الله ﷺ قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (212) ومسلم (786)."],[181],0],[501,"q","النووي","","« وفيه الحث على الإقبال على الصلاة بخشوع وفراغ قلب ونشاط، وفيه أمر الناعس بالنوم أو نحوه مما يذهب عنه النعاس، وهذا عام في صلاة الفرض والنفل في الليل والنهار، وهذا مذهبنا والجمهور، لكن لا يخرج فريضة عن وقتها، قال القاضي: وحمله مالك وجماعة على نفل الليل؛ لأنه محل النوم غالبًا »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (6/ 74) حديث رقم (786)."],[181],0],[502,"s","عبد الله بن مسعود","","« النعاس في القتال أَمَنَةٌ من الله، والنعاس في الصلاة من الشيطان »","وقال ابن مسعود رضي الله عنه:","","",["أخرجه عبد الرزاق (4219) ومسدّد- كما في المطالب العالية (3562) - والطبري (6/ 163)."],[181],0],[503,"q","ابن القيم","","« وأنزل الله عليهم النعاس أمنةً منه في غزاة بدر وأحد، والنعاس في الحرب وعند الخوف دليل على الأمن، وهو من الله، وفي الصلاة ومجالس الذكر والعِلم من الشيطان »","وقال ابن القيم رحمه الله:","","",["زاد المعاد (3/ 158)."],[181],0],[504,"h","النبي ﷺ","","«إذا سمعتم الإقامة فامشوا إلى الصلاة، وعليكم بالسكينة والوقار، ولا تُسرعوا، فما أدركتم فصلُّوا، وما فاتكم فَأَتِمُّوا»","فإن ذلك يجعله يدخل في الصلاة وقد حفزه النفس، فلا يخشع الخشوع المطلوب أو الكامل؛ ولذلك ورد النهي عن الجري عند الذهاب إلى الصلاة، كما في حديث أبي هريرة رضي الله عنه، عن النبي ﷺ قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (636) ومسلم (602)."],[182],0],[505,"s","أبو الدرداء","","« من فِقْهِ المرء إقبالُه على حاجته حتى يُقبلَ على صلاته وقلبُه فارغٌ »","وقال أبو الدرداء رضي الله عنه:","","",["صحيح البخاري (1/ 129)، كتاب الأذان."],[135],0],[506,"h","النبي ﷺ","عائشة أم المؤمنين","«إذا وضع العشاء، وأقيمت الصلاة، فابدءوا بالعشاء»","وعن عائشةَ رحمه الله، عن النبي ﷺ أنه قال:","صحيح","في الصحيحين أو أحدهما",["صحيح البخاري (671)."],[135],0],[507,"h","النبي ﷺ","","«إذا قُرِّبَ العشاء وحضرت الصلاة فابدؤوا به قبل أن تصلوا صلاة المغرب، ولا تَعْجَلوا عن عشائكم»","*و*عن أنس بن مالك رضي الله عنه، أن رسول الله ﷺ قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (557) والبخاري (672)."],[135],0],[508,"q","النووي","","« في هذه الأحاديث كراهة الصلاة بحضرة الطعام الذي يريد أكله؛ لما فيه من اشتغال القلب به، وذهاب كمال الخشوع، وكراهتها مع مدافعة الأخبثين، وهما: البول والغائط، ويلحق بهذا ما كان في معناه مما يشغل القلب ويذهب كمال الخشوع، وهذه الكراهة عند جمهور أصحابنا وغيرهم إذا صلى كذلك وفي الوقت سعة، فإذا ضاق بحيث لو أكل أو تطهر خرج وقت الصلاة صلى على حاله محافظة على حرمة الوقت، ولا يجوز تأخيرها. وحكى أبو سعد المتولي من أصحابنا وجهًا لبعض أصحابنا أنه لا يصلي بحاله، بل يأكل ويتوضأ وإن خرج الوقت؛ لأن مقصود الصلاة الخشوع فلا يفوته، وإذا صلى على حاله وفي الوقت سعة فقد ارتكب المكروه، وصلاته صحيحة عندنا وعند الجمهور، لكن يستحب إعادتها ولا يجب، ونقل القاضي عياض عن أهل الظاهر: أنها باطلة. وقوله رحمه الله: «ولا يعجلن حتى يفرغ منه» دليل على أنه يأكل حاجته من الأكل بكماله، وهذا هو الصواب، وأما ما تأوله بعض أصحابنا على أنه يأكل لقمًا يكسر بها شدة الجوع فليس بصحيح، وهذا الحديث صريح في إبطاله »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (5/ 46) حديث رقم (557)."],[135],0],[509,"h","النبي ﷺ","عائشة أم المؤمنين","«لا صلاةَ بحضرة الطَّعامِ»","وعن عائشة رضي الله عنها قالت: سمعت رسول الله ﷺ يقول:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (560) وأبو داود (89)."],[135],0],[510,"q","العظيم آبادي","","« قوله: «لا صلاة بحضرة الطعام»، أي: عند حضور طعامٍ تتوق نفسه إليه، أي: لا تقام الصلاة في موضع حضر فيه الطعام، وهو يريد أكله، وهو عام للنفل والفرض والجائع وغيره، وفيه دليل صريح على كراهة الصلاة بحضرة الطعام الذي يريد أكله في الحال؛ لاشتغال القلب به...، وأما الصلاة بحضرة الطعام ففيه مذاهب: منهم من ذهب إلى وجوب تقديم الأكل على الصلاة، ومنهم من قال إنه مندوب، ومن قيد ذلك بالحاجة ومن لم يقيد »","قال العظيم آبادي رحمه الله:","","",["عون المعبود شرح سنن أبي داود (1/ 112) حديث رقم (89)."],[135],0],[511,"h","النبي ﷺ","أبو سعيد الخدري","«في الصلاة»","عن أبي سعيد الخدري رحمه الله، قال: اعتكف رسول الله ﷺ في المسجد، فسمعهم يجهرون بالقراءة، فكشف السِّترَ، وقال: «ألا إن كلكم مُناجٍ ربه، فلا يؤذينَّ بعضُكم بعضًا، ولا يرفعْ بعضكم على بعض في القراءة» أو قال:","صحيح","صححه الألباني في صحيح الجامع (2639)",["رواه أبو داود (1332) وأحمد (11896) وصححه الألباني في صحيح الجامع (2639). وقال الوادعي في الصحيح المسند مما ليس في الصحيحين (٤١٩): صحيح على شرط الشيخين."],[136],0],[512,"q","الباجي","","« قوله: إنَّ رسول الله ﷺ خرج على الناس وهم يصلون وقد علت أصواتهم بالقراء، ظاهره أنَّ صلاتهم كانت نافلة، لمعان: أحدها: أنها لو كانت فريضة لأمهم فيها النبي ﷺ. والثاني: علو أصواتهم وقراءة جميعهم، ولو كانت فريضة لرفع صوته الإمام وحده؛ لأن المعهود أنهم كانوا يصلون الفريضة بصلاة النبي ﷺ أو بصلاة إمام، وقد بين في حديث حماد بن زيد أن ذلك كان في رمضان؛ لأن النبي ﷺ لم يكن جمعهم على إمام في نوافل رمضان. وإذا كان رفع الصوت بقراءة القرآن ممنوعًا حينئذ لأَذى المصلين فبأن يُمنع رفع الصوت بالحديث وغيره أولى وأحرى لما ذكرناه؛ ولأن في ذلك استخفافًا بالمساجد واطِّراحًا لتوقيرها وتنزيهها الواجب وإفرادها لما بنيت له من ذكر الله تعالى، قال الله العظيم: الآية: الحج: 40 »","قال أبو الوليد الباجي رحمه الله:","","",["المنتقى شرح موطأ مالك (1/ 150) حديث رقم (213)."],[136],0],[513,"h","النبي ﷺ","صلاته بكلام ولا غيره","«في الصلاة»"," حتى إن القارئ للقرآن لا يرفع صوته بالقراءة حتى لا يشغل من يصلي بجانبه، ففي الحديث عن أبي سعيد رضي الله عنه قال: قال النبي ﷺ: «ألا إن كلكم مُناجٍ ربه، فلا يؤذينَّ بعضُكم بعضًا، ولا يرفعْ بعضكم على بعض في القراءة» أو قال:","صحيح","صححه الألباني في صحيح الجامع (2639)",["رواه أبو داود (1332) وأحمد (11896) وصححه الألباني في صحيح الجامع (2639).."],[136],0],[514,"h","النبي ﷺ","أبو ذر","«لا يزال الله عز وجل مقبلًا على العبد وهو في صلاته ما لم يلتفت، فإذا التفت انصرف عنه»","عن أبي ذَرٍّ رضي الله عنه قال: قال رسول الله ﷺ:","صحيح لغيره","صححه لغيره شعيب الأرناؤوط في تخريج سنن أبي داود (909)",["رواه أبو داود (909) والنسائي (1195) والدارمي (1463) وأحمد (21508). وحسنة الألباني أخيراً في صحيح سنن أبي داود (٤/ ٦٥-٦٦). وصححه لغيره شعيب الأرناؤوط في تخريج سنن أبي داود (909)."],[183],0],[515,"h","النبي ﷺ","عائشة أم المؤمنين","«هو اختلاس، يختلسه الشيطان من صلاة العبد»","وعن عائشة رضي الله عنها، قالت: سألت رسول الله ﷺ عن الالتفات في الصلاة؟ فقال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (751)."],[183],0],[516,"q","ابن حجر","","« قوله: «هو اختلاس» أي: اختطاف بسرعة، ووقع في النهاية: وقيل: المختلس الذي يخطف من غير غلبة ويهرب ولو مع معاينة المالك له، والناهب يأخذ بقوة، والسارق يأخذ في خفية. وقال ابن بزيزة رحمه الله: أضيف إلى الشيطان؛ لأن فيه انقطاعًا من ملاحظة التوجه إلى الحق سبحانه »","قال ابن حجر رحمه الله:","","",["فتح الباري بشرح صحيح البخاري (2/ 235) حديث رقم (751)."],[183],0],[517,"q","الطيبي","","« سمي اختلاسًا تصويرًا لقبح تلك الفعلة بالمختلس؛ لأن المصلي يقبل عليه الرب عز وجل، والشيطان مرتصد له ينتظر فوات ذلك عليه، فإذا التفت اغتنم الشيطان الفرصة فسلبه تلك الحالة...وكأن المصنف أشار إلى أن علة كراهة الالتفات في الصلاة كونه يؤثر في الخشوع كما وقع في قصة الخميصة »","وقال الطيبي رحمه الله:","","",["المصدر السابق."],[183],0],[518,"h","النبي ﷺ","الحارث الأشعري","«وإن صلى وصام، فادعوا بدعوى الله الذي سماكم المسلمين المؤمنين، عباد الله»","مركم بخمس الله أمرني بهن؛ السمع والطاعة والجهاد والهجرة والجماعة، فإنه من فارق الجماعة قيد شبر فقد خلع ربقة الإسلام من عنقه إلا أن يرجع، ومن ادعى دعوى الجاهلية فإنه من جثا جهنم». فقال رجل: يا رسول الله وإن صلى وصام؟ قال:","صحيح","صححه الوادعي في الصحيح المسند مما ليس في الصحيحين (٢٨٥)",["رواه الترمذي (2863) وأحمد (17800) وصححه الوادعي في الصحيح المسند مما ليس في الصحيحين (٢٨٥)."],[183],0],[519,"s","أبو هريرة","","« إذا صلى أحدكم فلا يلتفت، فإنه يناجي ربه، إنَّ ربه أمامه، وإنه يناجيه فلا يلتفت »","وقال أبو هريرة رضي الله عنه:","","",["مصنف عبد الرزاق (2/ 257) رقم (3270)."],[183],0],[520,"a","عطاء بن أبي رباح","","« وبلغنا أن الرب عز وجل يقول: يا ابن آدم، إلى من تلتفت؟ أنا خير لك ممن تلتفت إليه »","وقال عطاء ابن أبي رباح رحمه الله:","","",["فتح الباري لابن رجب (4/400)."],[183],0],[521,"q","ابن القيم","","« الالتفاتُ المنهيُّ عنه في الصلاة قسمان: أحدهما: التفات القلب عن الله عز وجل إلى غير الله تعالى. الثاني: التفات البصر. وكلاهما منهيٌّ عنه. ولا يزال الله مقبلًا على عبده ما دام العبد مقبلًا على صلاته، فإذا التفت بقلبه أو بصره، أعرض الله تعالى عنه ... وفي أثر آخر: يقول الله تعالى: «إلى خيرٍ مني؟! إلى خيرٍ مني؟!», ومَثَلُ من يلتفت في صلاته ببصره أو بقلبه؛ مثل رجل قد استدعاه السلطان، فأوقفه بين يديه، وأقبل يناديه ويخاطبه، وهو في خلال ذلك يلتفت عن السلطان يمينًا وشمالًا، أو قد انصرف قلبه عن السلطان فلا يَفْهَمُ ما يخاطبه به! لأن قلبه ليس حاضرًا معه، فما ظن هذا الرّجل أن يَفْعلَ به السلطان؟! أفليس أقل المراتب في حقه أن ينصرف من بين يديه ممقوتًا مُبْعَدًا قد سقط من عينيه؟! فهذا المصلي لا يستوي والحاضرُ القلبِ المقبل على الله تعالى في صلاته، الذي قد أشعر قلبَه عظمةَ من هو واقف بين يديه فامتلأ قلبه من هيبته، وذَلَّتْ عنقه له، واسْتَحْيَى من ربه تعالى أن يقبل على غيره، أو يلتفت عنه. وبين صلاتيهما كما قال حسان عطية رحمه الله: إن الرجلين ليكونان في الصلاة الواحدة وإن ما بينهما في الفضل كما بين السماء والأرض. وذلك أنَّ أحدهما مقبل على الله عز وجل، والآخر ساهٍ غافل. فإذا أقبل العبد على مخلوق مثله، وبينه حجاب، لم يكن إقبالًا ولا تقريبًا، فما الظن بالخالق عز وجل؟! وإذا أقبل على الخالق عز وجل، وبينه وبينه حجاب الشهوات والوساوس، والنفس مشغوفةٌ بها، مَلأى منها، فكيف يكون ذلك إقبالًا وقد أَلْهَتْهُ الوساوس والأفكار، وذهبت به كلَّ مَذْهب؟! »","قال ابن القيم رحمه الله:","","",["الوابل الصيب (ص/ 43-45)."],[184],0],[522,"q","ابن رجب","","« ومن ذلك: إقباله على الله عز وجل ، وعدم التفاته إلى غيره وهو نوعان: أحدهما: عدم التفات قلبه إلى غير من هو مناجٍ له، وتفريغ القلب للرب رحمه الله. والثاني: عدم الالتفات بالبصر يمينًا وشمالًا، وقصر النظر على موضع السجود وهو من لوازم الخشوع للقلب وعدم التفاته، ولهذا رأى بعض السلف مصليًا يعبث في صلاته فقال: لو خشع قلب هذا لخشعت جوارحه »","وقال ابن رجب رحمه الله:","","",["تفسير ابن رجب (2/ 21) [سورة المؤمنون: 2]."],[184],0],[523,"h","النبي ﷺ","جابر بن سمرة","«لينتهين أقوام يرفعون أبصارهم إلى السماء في الصلاة أو لا ترجع إليهم»","عن جابر بن سمرة رضي الله عنه قال: قال رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (428) وأبو داود (912)."],[185],0],[524,"q","النووي","","« فيه النهي الأكيد والوعيد الشديد في ذلك، وقد نُقل الإجماع في النهي عن ذلك »","قال النووي رحمه الله، في قوله رحمه الله: «لينتهين أقوام يرفعون أبصارهم إلى السماء في الصلاة أو لا ترجع إليهم»، وفي رواية: «أو لتخطفن أبصارهم»:","","",["المنهاج شرح صحيح مسلم بن الحجاج (4/ 152) حديث رقم (428)."],[185],0],[525,"q","الطيبي","","« \"أو\" هاهنا للتخيير تهديدًا، أي: ليكونن أحد الأمرين كقوله تعالى: الآية: الأعراف: 88 »","وقال الطيبي رحمه الله:","","",["عون المعبود شرح سنن أبي داود (3/ 127) حديث رقم (912)."],[185],0],[526,"h","النبي ﷺ","أنس بن مالك","«لينتهن عن ذلك، أو لتخطفن أبصارهم»","وعن أنس بن مالك رضي الله عنه، قال: قال النبي ﷺ: «ما بال أقوام يرفعون أبصارهم إلى السماء في صلاتهم؟» فاشتد قوله في ذلك، حتى قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (750)."],[185],0],[527,"q","العظيم آبادي","","« قوله رحمه الله: «أو لتحفظن» بضم الفوقية وفتح الفاء على البناء للمفعول أي: لتسلبن. قال في النيل: لا يخلو الحال من أحد الأمرين: إما الانتهاء عنه، وإما العمى، وهو وعيد عظيم وتهديد شديد، وإطلاقه يقتضي بأنه لا فرق بين أن يكون عند الدعاء أو عند غيره، إذا كان ذلك في الصلاة كما وقع به التقييد. والعلة في ذلك أنه إذا رفع بصره إلى السماء خرج عن سمت القبلة وأعرض عنها وعن هيئة الصلاة »","قال العظيم آبادي رحمه الله:","","",["عون المعبود شرح سنن أبي داود (3/ 128) حديث رقم (913)."],[185],0],[528,"s","أبو هريرة","","« كان أصحاب رسول الله ﷺ يرفعون أبصارهم إلى السماء في الصلاة فلما نزل: الآية: المؤمنون: 2 رموا بأبصارهم إلى مواضع السجود »","وعن أبي هريرة رضي الله عنه، قال:","","",["تفسير البغوي (3/ 358) [المؤمنون: 2]."],[185],0],[529,"q","العظيم آبادي","","« والظاهر أن رفع البصر حال الصلاة حرام لأن العقوبة بالعمى لا تكون إلا عن محرم. والمشهور عند الشافعية أنه مكروه، وبالغ ابن حزم فقال: تبطل الصلاة به »","قال العظيم آبادي رحمه الله:","","",["عون المعبود شرح سنن أبي داود (3/ 128) حديث رقم (913)."],[186],0],[530,"h","النبي ﷺ","أنس بن مالك","«لينتهن عن ذلك، أو لتخطفن أبصارهم»","ج: نهى رسول الله ﷺ عن رفع البصر إلى السماء في الصلاة وتوعد عليه، ففي صحيح البخاري وغيره عن أنس بن مالك رضي الله عنه، قال: قال النبي ﷺ: «ما بال أقوام يرفعون أبصارهم إلى السماء في صلاتهم؟» فاشتد قوله في ذلك، حتى قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (750)."],[186],0],[531,"n","اللجنة الدائمة","","فهذا وعيد شديد يدل على التحريم ولكنه لا يبطل الصلاة. وبالله التوفيق، وصلى الله على نبينا، محمد وآله وصحبه وسلم","","","",["اللجنة الدائمة للبحوث العلمية والإفتاء. الرئيس/ عبد العزيز بن عبد الله بن باز (7/ 22)."],[186],0],[532,"h","النبي ﷺ","أبو ذر","«إذا قام أحدكم في الصلاة فلا يمسح الحصى، فإن الرحمة تواجهه»","عن أبي ذر رضي الله عنه قال: قال رسول الله ﷺ:","حسن","حسنه شعيب  الأرناؤوط في تخريج صحيح ابن حبان (2273) وصححه ابن باز كما في مجموع فتاوى ابن باز (١١/ ٢٦٥)",["رواه النسائي (1191) وأبو داود (945) والترمذي (379) وابن ماجه (1027) وحسنه شعيب  الأرناؤوط في تخريج صحيح ابن حبان (2273) وصححه ابن باز كما في مجموع فتاوى ابن باز (١١/ ٢٦٥)."],[147],0],[533,"h","النبي ﷺ","معيقيب","« ذكر النبي ﷺ المسح في المسجد - يعني الحصى - قال: إن كنت لا بد فاعلًا فواحدةً »","وعن مُعَيْقِيبٍ رضي الله عنه قَال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (546) والبخاري (1207)."],[147],0],[534,"q","ابن حجر","","« والذي يظهر أن علة كراهيته المحافظة على الخشوع، أو لئلا يكثر العمل في الصلاة »","قال ابن حجر رحمه الله:","","",["فتح الباري (3/ 79)."],[147],0],[535,"a","","","« وكره السلف مسح الجبهة في الصلاة وقبل الانصراف، يعني: من المسجد مما يتعلق بها من تراب ونحوه »","قال القاضي:","","",["المنهاج شرح صحيح مسلم بن الحجاج (5/ 37) حديث رقم (546)."],[147],0],[536,"q","ابن عثيمين","","« الحركة في الصلاة تنقسم إلى خمسة أقسام: 1- حركة واجبة؛ وهي التي يتوقف عليها فعل واجب في الصلاة، كما لو كان الإنسان يصلي إلى غير قبلة مثلاً فجاءه من أخبره بأن القبلة عن يمينه أو شماله، فوجب عليه أن يتحرك إلى القبلة، ومن ذلك ما فعله أهل مسجد قباء حين أتاهم هاتف في صلاة الصبح فأخبرهم بأن القبلة قد حولت من بيت المقدس إلى الكعبة، فاستداروا إلى الكعبة وكانت وجوههم إلى الشام، هذه الحركة الواجبة. 2- حركة مستحبة؛ وهي ما يتوقف عليها فعل مستحب في الصلاة، كما لو تحرك إلى سد فرجة في الصف، سواء كانت الفرجة أمامه أو عن يمينه أو عن يساره، فإنه يقرب من جعله، ويتقدم إلى الصف الذي أمامه لسد الفرجة، فهذه مستحبة. 3- المباحـــة؛ وهي الحـركـة اليسيـرة إذا كانت للحاجة مثل ما فعل النبي ﷺ حين صلى بأصحابه وهو يحمل أمامة بنت زينب بنت رسول الله ﷺ وأبوها أبو العاصي بن ربيع، فإنه كان رحمه الله يصلي وهو حامل هذه البنت، فإذا قام حملها، وإذا سجد أو ركع وضعها بالأرض، فهذا مباح، ومنه أيضاً - من القسم المباح - إذا كثرت الحركة لكن للضرورة كما في قوله تعالى: الآية: البقرة: 239 يعني فصلوا ولو أنكم تمشون على أرجلكم أو راكبين. 4- الحركة المحرمة؛ وهي الحركة الكثيرة التي تبطل بها الصلاة بدون ضرورة، فإذا تحرك الإنسان حركة كثيرة بحيث تنافي الصلاة لكثرتها وبدون ضرورة فإن صلاته تبطل، فإنها محرمة وتبطل الصلاة. 5- الحركة المكروهة؛ وهي الحركة الكثيرة بغير حاجة، وهذه توجد كثيراً في المصلين، تجدهم يتحركون حركة كثيرة بدون حاجة؛ هذا يصلح ثوبه، وهذا ينظر إلى ساعته، وهذا يخرج قلمه، وهذا يعبث في أنفه أو في لحيته، وما أشبه ذلك من الحركات التي تشاهد كثيراً، فهذه المكروهة، وإذا كثرت وتوالت أبطلت الصلاة وصارت محرمة، فعلى المرء المسلم المصلي أن يستحضر أنه واقف بين يدي الله عز وجل، فيكون في قبله من الهيبة والخشوع ما يظهر على جوارحه »","قال ابن عثيمين رحمه الله:","","",["سلسلة فتاوى نور على الدرب- الشريط رقم [32]."],[187],0],[537,"h","النبي ﷺ","عبد الله بن الأرقم","« أنه خرج حاجًّا أو معتمرًا، ومعه الناس وهو يؤمُّهم، فلما كان ذات يومٍ أقام الصلاة، صلاةَ الصبح، ثم قال: لِيتقدمْ أحدُكُم، وذهب الخلاءَ، فإني سمعت رسول الله ﷺ يقول: إذا أراد أحدكم أن يذهب الخلاءَ وقامت الصلاةُ فليبدأْ بالخلاءِ »","عن عبد الله بن الأرقم رضي الله عنه:","صحيح","صححه الألباني في صحيح أبي داود (88)",["رواه أبو داود (88) والترمذي (142) والنسائي (852) وابن ماجه (616) وصححه الألباني في صحيح أبي داود (88)."],[188],0],[538,"h","النبي ﷺ","عائشة أم المؤمنين","«لا صلاة بحضرة طعام، ولا هو يدافعه الأخبثان»","وعن عائشة رضي الله عنها قالت: سمعت رسول الله ﷺ يقول:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (560) وأبو داود (89)."],[188,189],0],[539,"q","العظيم آبادي","","« قوله: «ولا» يصلي. «وهو» المصلي. «يدافعه» المصلي. «الأخبثان» فاعل يدافع وهو البول والغائط، أي: لا صلاة حاصلة للمصلي حالة يدافعه الأخبثان وهو يدافعهما؛ لاشتغال القلب به وذهاب الخشوع، ويلحق به كل ما هو في معناه مما يشغل القلب ويذهب كمال الخشوع »","قال العظيم آبادي رحمه الله:","","",["عون المعبود شرح سنن أبي داود (1/ 112) حديث رقم (89)."],[188],0],[540,"h","النبي ﷺ","أبو أمامة الباهلي","وعن أبي أمامة رضي الله عنه أن رسول الله ﷺ نهى أن يصلي الرجل وهو حاقن","وعن أبي أمامة رضي الله عنه أن رسول الله ﷺ نهى أن يصلي الرجل وهو حاقن","صحيح","صححه الألباني في صحيح الجامع (6832)",["رواه ابن ماجه (617) وأحمد (22255) وصححه الألباني في صحيح الجامع (6832)."],[188],0],[541,"n","ابن عثيمين","","عصى النبي صلى الله عليه وعلى آله وسلم، بل قد ذهب بعض العلماء إلى أنه لا صلاة له في هذه الحال. وعليه أن يتخلى، أي: أن يبول أو يتغوط، ثم إن وجد الماء وقدر على استعماله بلا ضرر، نقول: نعم، إن وجد الماء وقدر على استعماله بلا ضرر فليفعل، وإن لم يجد الماء أو كان يخاف الضرر باستعماله فالأمر واسع ولله الحمد، فليتيمم. وصلاته بتيمم بدون مدافعة البول أو الغائط خير من صلاته بوضوء يكون فيه مدافعاً للبول والغائط، وليستحضر إذا دعته نفسه إلى الصلاة وهو يدافع الأخبثين، ليستحضر قول النبي صلى الله عليه وعلى آله وسلم: «لا صلاة بحضرة طعام ولا وهو يدافع الأخبثان». فإذا استحضر هذا فإنه لن يذهب يصلي وهو يدافع الأخبثين","","","",["سلسلة فتاوى نور على الدرب « الشريط رقم [332]."],[189],0],[542,"h","النبي ﷺ","","«لا صلاة بحضرة طعام»","فأجاب رحمه الله: إي نعم، مدافعة الريح إذا كانت تضيق عليك كمدافعة البول والغائط؛ فلا تصل مع وجوده...لأن العلة هي إشغال القلب عن الصلاة، والدليل على هذا أن الرسول ﷺ قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (560) وأبو داود (89)."],[190],0],[543,"n","","","فأجاب رحمه الله: إي نعم، مدافعة الريح إذا كانت تضيق عليك كمدافعة البول والغائط؛ فلا تصل مع وجوده...لأن العلة هي إشغال القلب عن الصلاة، والدليل على هذا أن الرسول ﷺ قال: «لا صلاة بحضرة طعام»، وحضرة الطعام ليس مدافعة أخبثين، لكنه يشغل القلب، وكل ما يشغل القلب لا تُصلِّ مع وجوده، ولهذا نهي عن الصلاة بحضرة الطعام، وعن الصلاة مع مدافعة الأخبثين، وكذلك كل ما يشغل الإنسان، لا يُصلِّ في حال اشتغاله","","","",["سلسلة لقاءات الباب المفتوح « لقاء الباب المفتوح [63]."],[190],0],[544,"h","النبي ﷺ","","«لا ضرر ولا ضرار»","إلا إذا كانت المدافعة شديدة، فإن القول بأن صلاته لا تصح قول وجيه جداً؛ لأنه لا يتمكن في هذه الحال من استحضار ما يقول وما يفعل، ولأن ذلك قد يسبب عليه ضرراً بدنياً وقد نهي عن إلحاق الضرر بالبدن، وقد روي عن النبي ﷺ أنه قال:","حسن","حسنه النووي في بستان العارفين (35)",["رواه أحمد في المسند (2865) ومالك في الموطأ (31) والبيهقي في السنن (11718) وحسنه النووي في بستان العارفين (35)."],[137],1],[545,"n","ابن عثيمين","","وأما كونه يخشى من فوات صلاة الجماعة فإنه لا حرج عليه لو فاتته صلاة الجماعة في هذه الحال، فإذا ذهب وقضى حاجته وتوضأ فإنه لو فاتته الجماعة لا إثم عليه ولا حرج","","","",["سلسلة فتاوى نور على الدرب « الشريط رقم [126]"],[137],0],[546,"h","النبي ﷺ","","«لا صلاة بحضرة الطعام ولا وهو يدافعه الأخبثان»","ج: لا يجوز للمصلي أن يدخل في الصلاة وهو يدافع الغائط أو البول؛ لقول النبي ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (560) وأبو داود (89)."],[137],0],[547,"q","القرطبي","","« اختلف الناس في الخشوع: هل هو من فرائض الصلاة أو من فضائلها ومكملاتها؟ على قولين، والصحيح الأول، ومحله القلب... »","وقال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (12/ 104) [سورة المؤمنون: 2]."],[69],0],[548,"q","ابن تيمية","","« ويدلُّ على وجوب الخشوع فيها أيضًا قوله تعالى: الآية: المؤمنون: 1-11 أخبر سبحانه أن هؤلاء هم الذين يرثون فردوس الجنة، وذلك يقتضي أنْ لا يرثها غيرهم، وقد دل هذا على وجوب هذه الخصال، إذ لو كان فيها ما هو مستحب لكانت جنة الفردوس تُورَثُ بدونها؛ لأن الجنة تُنال بفعل الواجبات دون المستحبات، ولهذا لم يذكر في هذه الخصال إلا ما هو واجب »","وقال ابن تيمية رحمه الله:","","",["مجموع الفتاوى (22/554)."],[69],0],[549,"q","الشوكاني","","« وقد اختلف الناس في الخشوع هل هو من فرائض الصلاة أو من فضائلها؟ على قولين: قيل: الصحيح الأول، وقيل: الثاني. وادعى عبد الواحد بن زيد إجماع العلماء على أنه ليس للعبد إلا ما عقل من صلاته، حكاه النيسابوري في تفسيره؛ قال: ومما يدل على صحة هذا القول قوله تعالى: الآية: النساء: 82 والتدبر لا يتصور بدون الوقوف على المعنى. وكذا قوله: الآية: طه: 14 والغفلة تضاد الذكر، ولهذا قال: الآية: الأعراف: 205 وقوله: الآية: النساء: 43 نهيٌ للسكران، والمستغرق في هموم الدنيا بمنزلته »","وقال الشوكاني رحمه الله:","","",["فتح القدير (3/ 561) [سورة المؤمنون: 2]."],[69],0],[550,"a","عبد الرحمن بن سليمان","","« سألت الأوزاعي عن أدنى ما يتعلّق المتعلّق وينجيه من هذا الويل؟ فأطرق هُنية، ثم قال: يقرؤهنّ وهو يعقلهنّ »","قال عبد الرحمن بن سليمان رحمه الله:","","",["أخرجه ابن أبي الدنيا في (التفكر) كما ذكر السيوطي في (الدر المنثور) (2/409)."],[138],0],[551,"q","ابن القيم","","« والقَبول ثلاثة أنواع: الأول: قَبول رِضًا ومَحبّة واعتداد ومُباهاة، وثَناء على العامل به بين الملأ الأعلى. الثاني: قَبول جَزاء وثَواب، وإن لم يَقع مَوقع الأوّل. الثالث: قبول إسقاط للعقاب فقط، وإن لم يترتب عليه ثواب وجزاء، كقبول صلاة من لم يُحْضِر قَلبَه في شيءٍ منها، فإنه ليس له من صلاته إلا ما عَقل منها، فإنها تُسقط الفرض، ولا يُثاب عليها »","قال ابن القيم رحمه الله:","","",["المنار المنيف في الصحيح والضعيف - ط عطاءات العلم (1/ 14)."],[191],0],[552,"q","ابن عثيمين","","« أما هل تصح الصلاة مع الوسواس؟ فإذا كان الإنسان يدافعه، فإنه لا يضره فصلاته صحيحة، وإن استرسل معه فإن أكثر أهل العلم يقولون: إن صلاته صحيحة، وبعض العلماء يقول: إذا غلب على أكثر الصلاة فصلاته باطلة. والصواب: أن الصلاة صحيحة لكنها ناقصة بقدر ما حصل من الوساوس التي حصلت لهذا المصلي »","وقال ابن عثيمين رحمه الله:","","",["سلسلة فتاوى نور على الدرب « الشريط رقم [360]."],[191],0],[553,"h","النبي ﷺ","","«إن العبد ليصلي الصلاة، ولم يكتب له إلا نصفها، أو ثلثها، أو ربعها، حتى بلغ عشرها»","وفي المسند مرفوعًا:","حسن","حسنه الألباني في صحيح أبي داود (796)",["رواه أبو داود (796) وحسنه الألباني في صحيح أبي داود (796)."],[192],0],[554,"h","النبي ﷺ","","«إن الله لا يستجيب الدعاء من قلب غافل»","قالوا: وفي الترمذي وغيره، مرفوعًا إلى النبي ﷺ","حسن","حسنه الألباني في صحيح الجامع (245)",["أخرجه الترمذي (3479) واللفظ له، والبزار (10061) وحسنه الألباني في صحيح الجامع (245)."],[192],0],[555,"h","النبي ﷺ","","«إذا أذن المؤذن أدبر الشيطان، وله ضراط حتى لا يسمع التأذين، فإذا قضي التأذين أقبل، فإذا ثوب بالصلاة أدبر، فإذا قضي التثويب أقبل حتى يخطر بين المرء وبين نفسه، فيذكره ما لم يكن يذكر، ويقول: اذكر كذا، اذكر كذا، لما لم يكن يذكر، حتى يظل الرجل لا يدري كم صلى، فإذا وجد ذلك أحدكم فليسجد سجدتين وهو جالس»","قال أصحاب القول الآخر: قد ثبت عن النبي ﷺ في الصحيح أنه قال","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (1222)."],[192],0],[556,"h","النبي ﷺ","","«لكل سهو سجدتان»","ترغيمًا للشيطان في وسوسته للعبد، وكونه حال بينه وبين الحضور في الصلاة، ولهذا سماهما النبي ﷺ «المرغمتين»، وأمر من سها بهما، ولم يُفَصل في سهوه الذي صدر عنه موجب السجود بين القليل والكثير، والغالب والمغلوب، وقال رحمه الله:","حسن لغيره","حسنه لغيره شعيب الأرناؤوط في تخريج سنن أبي داود (1038)",["أخرجه أبو داود (1038) وحسنه لغيره شعيب الأرناؤوط في تخريج سنن أبي داود (1038). عن ثوبان رضي الله عنه."],[192],0],[557,"q","ابن القيم","","« وهذا القول الثاني أرجح القولين، والله أعلم »","ثم قال ابن القيم رحمه الله:","","",["مدارج السالكين (2/471)."],[192],0],[558,"n","ابن عثيمين","","الجواب: التباكي المصطنع -كما يفعله بعض الناس- غير مشروع، وأما البكاء الذي يأتي من خشوع القلب واستحضاره لعظمة الرب والخوف منه، فإن هذا مشروع، وإذا ظهر منه صوت بغير اختياره وبغير تكلف منه فلا حرج، لكن التباكي المصطنع هذا أمر لا يُشرع ولا ينبغي، بل الذي ينبغي أن يتأمل الإنسان كلام الله عز وجل، فإذا تأمله بصدق ومعرفة للمعنى فإن قلبه يلين ويخشع ويبكي عند ذكر العذاب خوفاً منه، وعند ذكر الثواب طمعاً فيه، وعند ذكر الرب تعظيماً له، وعند ذكر الرسول ﷺ وسيرته محبة له وشوقاً إليه","","","",["المصدر: سلسلة اللقاء الشهري « اللقاء الشهري [5]."],[193],0],[559,"q","ابن رجب","","« فمما يظهر فيه الخشوع والذل والانكسار من أفعال الصلاة: وضع اليدين إحداهما على الأخرى في حال القيام، وقد رُوي عن الإمام أحمد رحمه الله أنه سئل عن المراد بذلك؟ فقال: هو ذل بين يدي عزيز، قال علي بن محمد المصري الواعظ رحمه الله: ما سمعت في العلم بأحسن من هذا »","قال ابن رجب رحمه الله:","","",["تفسير ابن رجب (2/ 20) [سورة المؤمنون: 2]."],[194],1],[560,"h","النبي ﷺ","أبو حازم","« كان الناس يؤمرون أن يضع الرجل اليد اليمنى على ذراعه اليسرى في الصلاة. قال أبو حازم رحمه الله: لا أعلمه إلا ينمي ذلك إلى النبي ﷺ قال إسماعيل عليه السلام: يُنْمَى ذَلِكَ، وَلَمْ يَقُلْ يَنْمِي »","عن أبي حازم رحمه الله، عن سهل بن سعد رضي الله عنه قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (740)."],[195],0],[561,"q","ابن حجر","","« قوله: (كان الناس يؤمرون) هذا حكمه الرفع؛ لأنه محمول على أن الآمر لهم بذلك هو النبي ﷺ. قال العلماء: الحكمة في هذه الهيئة أنه صفة السائل الذليل، وهو أمنع من العبث وأقرب إلى الخشوع، وكأن البخاري لحظ ذلك فعقَّبه بباب الخشوع. ومن اللطائف قول بعضهم: القلب موضع النية، والعادة أن من احترز على حفظ شيء جعل يديه عليه. قال ابن عبد البر: لم يأت عن النبي ﷺ فيه خلاف، وهو قول الجمهور من الصحابة والتابعين، وهو الذي ذكره مالك في الموطأ، ولم يحك ابن المنذر وغيره عن مالك غيره »","قال ابن حجر رحمه الله:","","",["فتح الباري بشرح صحيح البخاري (2/ 224) حديث رقم (740)."],[195],0],[562,"h","النبي ﷺ","عبد الله بن مسعود","« رآني النبي ﷺ وقد وضعت شمالي على يميني في الصلاة، فأخذ بيميني فوضعها على شمالي »","وعن ابن مسعود رضي الله عنه قال:","حسن","حسنه الألباني في صحيح النسائي (887)",["رواه النسائي (٨٨٨) وأبو داود (755) وابن ماجه (811) وحسنه الألباني في صحيح النسائي (887)."],[195],0],[563,"h","النبي ﷺ","قبيصة بن هلب","« كان رسول الله ﷺ يؤمنا، فيأخذ شماله بيمينه »","عن قبيصة بن هُلب، عن أبيه رحمه الله، قال:","صحيح لغيره","صححه لغيره شعيب الأرناؤوط في تخريج المسند (21975)",["سنن الترمذي (252) وابن ماجه (809) وصححه لغيره شعيب الأرناؤوط في تخريج المسند (21975)."],[196],0],[564,"q","الترمذي","","« والعمل على هذا عند أهل العلم من أصحاب النبي ﷺ، والتابعين، ومن بعدهم، يرون أن يضع الرجل يمينه على شماله في الصلاة، ورأى بعضهم: أن يضعهما فوق السرة، ورأى بعضهم: أن يضعهما تحت السرة، وكل ذلك واسع عندهم. واسمُ هُلب: يزيد بن قُنافة الطائي »","قال الترمذي رحمه الله:","","",["سنن الترمذي (252)."],[196],0],[565,"n","اللجنة الدائمة","","ج: من السنة وضع كف اليمنى على كف اليسرى والرسغ والساعد فوق الصدر أثناء القراءة في القيام، وفي القيام أيضا بعد الرفع من الركوع إلى أن يخر ساجدًا وهذا هدي رسول الله ﷺ وسنته العملية. وبالله التوفيق، وصلى الله على نبينا محمد، وآله وصحبه وسلم","","","",["فتاوى اللجنة الدائمة للبحوث العلمية والإفتاء. الرئيس/ ابن باز. المجموعة الأولى (6/ 371)."],[196],0],[566,"n","ابن باز","","فأجاب: في حال القيام يضعهما على صدره، هذا هو الأفضل لصحة الأحاديث في ذلك قبل الركوع وبعده، أما في حال الركوع فيضعهما على ركبتيه، وفي حال السجود يضعهما على الأرض حيال منكبيه أو حيال أذنيه، وأما في حال الجلوس بين السجدتين فيضعهما على فخذيه أو ركبتيه، وهكذا في حال التشهد الأول والأخير، ولكنه في حال التشهد يضع كفه اليمنى على فخذه اليمنى ويقبض الخنصر والبنصر ويحلق الإبهام مع الوسطى، ويشير بالسبابة حتى يسلم إشارة إلى وحدانية الله سبحانه، ويحركها عند الدعاء وفي بعض الأحيان يقبض الأصابع كلها - أعني: أصابع كفه اليمنى - ويشير بالسبابة لأن كلتا الصفتين قد ثبتت عن النبي ﷺ. والله ولي التوفيق","","","",["الدرر الثرية من الفتاوى البازية (ص/ 172)."],[197],0],[567,"a","محمد بن سيرين","","« الخشوع، هو أنْ لا ترفع بصرك عن موضع سجودك »","قال الإمام محمد ابن سيرين رحمه الله:","","",["تفسير الثعلبي - الكشف والبيان عن تفسير القرآن (18/ 433) [المؤمنون: 2]."],[133],0],[568,"q","ابن القيم","","« والناس في الصلاة على مراتب خمسة: أحدها: مرتبة الظالم لنفسه، المُفَرِّط؛ وهو الذي انتقص من وضوئها ومواقيتها وحدودها وأركانها. الثاني: من يحافظ على مواقيتها وحدودها وأركانها الظاهرة ووضوئها، لكن قد ضيع مجاهدة نفسه في الوسوسة، فذهب مع الوساوس والأفكار. الثالث: من حافظ على حدودها وأركانها، وجاهد نفسه في دفع الوساوس والأفكار، فهو مشغول بمجاهدة عدوه؛ لئلا يسرق صلاته، فهو في صلاةٍ وجهاد. الرابع: من إذا قام إلى الصلاة أكمل حقوقها وأركانها وحدودها، واستغرق قلبه مراعاة حدودها وحقوقها؛ لئلا يُضَيِّع شيئًا منها، بل همُّه كله مصروف إلى إقامتها كما ينبغي وإكمالها وإتمامها، قد استغرق قلبَه شأن الصلاة وعبودية ربه عز وجل فيها. الخامس: من إذا قام إلى الصلاة قام إليها كذلك، ولكنْ مع هذا قد أخذ قلبه ووضعه بين يدي ربه عز وجل، ناظرًا بقبله إليه مراقبًا له، ممتلئًا من محبته وعظمته، كأنه يراه ويشاهده، وقد اضمحلَّتْ تلك الوساوس والخطرات، وارتفعت حُجُبُها بينه وبين ربه، فهذا بينه وبين غيره في الصلاة أفضل وأعظم مما بين السماء والأرض، وهذا في صلاته مشغول بربه قرير العين به. فالقسم الأول معاقَبٌ، والثاني محاسَبٌ، والثالث مكَفَّرٌ عنه، والرابع مثابٌ، والخامس مُقَرَّبٌ من ربه؛ لأن له نصيبًا ممن جُعِلَتْ قرة عينه في الصلاة، فمن قَرَّتْ عينه بصلاته في الدنيا قَرَّتْ عينه بقربه من ربه في الآخرة، وقرت عينه - أيضًا - به في الدنيا، ومن قَرَّتْ عينه بالله قَرَّتْ به كل عين، ومن لم تَقَرَّ عينه بالله تعالى تقطَّعَتْ نفسه على الدنيا حسرات. وقد روي أن العبد إذا قام يصلي قال الله: «ارفعوا الحُجُبَ بيني وبين عبدي، فإذا التفت قال: أرخوها». وقد فُسِّر هذا الالتفات بالتفات القلب عن الله إلى غيره، فإذا التفت إلى غيره أرخى الحجاب بينه وبين العبد، فدخل الشيطان، وعَرَضَ عليه أمور الدنيا، وأراه إياها في صورة المرآة، وإذا أقبل بقلبه على الله، ولم يلتفت، لم يقدر الشيطان على أن يتوسط بين الله تعالى وبين ذلك القلب؛ وإنما يدخل الشيطان إذا وَقَعَ الحجابُ؛ فإن فرَّ إلى الله تعالى وأحضر قلبه فَرَّ الشيطانُ، فإن التفت حضر الشيطان، فهو هكذا شأنه وشأن عدوه في الصلاة »","قال ابن القيم رحمه الله:","","",["الوابل الصيب (ص/ 24)."],[66],1],[569,"q","النووي","","« فإذا شرع في القراءة فليكن شأنه الخشوع والتدبر عند القراءة، والدلائل عليه أكثر من أن تحصر، وأشهر وأظهر من أن تذكر، فهو المقصود المطلوب، وبه تنشرح الصدور وتستنير القلوب، قال الله تعالى: الآية: النساء: 82 وقال تعالى: الآية: ص: 29. والأحاديث فيه كثيرة، وأقاويل السلف فيه مشهورة. وقد بات جماعة من السلف يتلون آيه واحدة، يتدبرونها ويرددونها إلى الصباح. وقد صعق جماعة من السلف عند القراءة. ومات جماعات حال القراءة »","قال النووي رحمه الله:","","",["التبيان في آداب حملة القرآن (ص/ 76)."],[198],0],[570,"q","ابن القيم","","« الشهقة التي تعرض عند سماع القرآن أو غيره لها أسبابٌ: أحدها: أن يَلُوح له عند السماع درجةٌ ليست له، فيرتاح إليها، فتَحدُث له الشهقةُ؛ فهذه شهقة شوق. وثانيها: أن يَلُوح له ذنبٌ ارتكبه، فيشهَق خوفًا وحزنًا على نفسه، وهذه شهقة خشية. وثالثها: أن يلوح له نقصٌ فيه لا يَقدِرُ على دفعه عنه، فيُحدِث له ذلك حزنًا، فيشهَق شهقة حزن. ورابعها: أن يلوح له كمال محبوبه، ويرى الطريق إليه مسدودةً عنه، فيُحدِث ذلك شهقَة أسفٍ وحزنٍ. وخامسها: أن يكون قد توارى عنه محبوبُهُ، واشتغل بغيره، فذكَّره السماعُ محبوبَه، فلاح له جماله، ورأى الباب مفتوحًا والطريق ظاهرةً، فشهق فرحًا وسرورًا بما لاح له. وبكل حالٍ فسبب الشهقة قوةُ الوارد وضعف المحل عن الاحتمال، والقوة أن يعمل ذلك الوارد عمله داخلًا ولا يظهر عليه، وذلك أقوى له وأدوم؛ فإنه إذا أظهره ضعُفَ أثره وأوشك انقطاعه. هذا حكم الشهقة من الصادق؛ فإن الشاهق إما صادقٌ وإما سارقٌ وإما منافقٌ »","قال ابن القيم رحمه الله:","","",["الفوائد (ص/ ٢٨٦- 287)."],[199],0],[571,"s","عبد الله بن عباس","","« فضَمِنَ الله لمن تَبِعَ القرآن أنْ لا يضل في الدنيا ولا يشقى في الآخرة »","قال ابن عباس رضي الله عنهما:","","",["الرعاية لتجويد القراءة وتحقيق التلاوة (ص/ 60)."],[200],0],[572,"s","خباب بن الأرت","","« تقرَّب إلى الله ما استطعت، واعلم أنك لن تتقرب إليه بشيء هو أحبُّ إليه من كلامه »","وقال خَبَّاب بن الأرت رضي الله عنه لرجل:","","",["جامع العلوم والحكم (2/ 342)."],[200],0],[573,"a","","","« أقسم لكم، لا يؤمن عبدٌ بهذا القرآن إلا صدع قلبه »","وكان مالك بن دينار رحمه الله، يقرأ هذه الآية ثم يقول:","","",["الزهد للإمام أحمد (ص/ 258)."],[5],0],[574,"a","أبو عمران الجوني","","« والله لقد صرف إلينا ربنا في هذا القرآن ما لو صرفه إلى الجبال لحتَّها وجباها »","وقال أبو عمران الجوني رحمه الله:","","",["الذل والانكسار للعزيز الجبار- ابن رجب- (ص/ 298)."],[5],0],[575,"s","أسماء بنت أبي بكر","","« قلت لها: كيف كان أصحاب رسول الله ﷺ يفعلون إذا قُرئ عليهم القرآن؟ قالت: كانوا كما نعتهم الله, تدمع أعينهم, وتقشعر جلودهم, قال: فإن ناسًا إذا قُرئ عليهم القرآن خرَّ أحدُهم مغشيًّا عليه, قالت: أعوذ بالله من الشيطان الرجيم »","عن عبد الله بن عروة بن الزبير رضي الله عنه، عن جدته أسماء بنت أبي بكر رضي الله عنها، قال:","","",["الزهد والرقائق - ابن المبارك - ت الأعظمي (ص359).","الزهد والرقائق - ابن المبارك (ص/ 359)."],[201,202],0],[576,"s","عبد الله بن مسعود","","« إن أحسن الحديث كتاب الله، وأحسن الهدي هدي محمد ﷺ، وشر الأمور محدثاتها، و: الآية: الأنعام: 134 »","وقال عَبْدُ اللَّهِ بن مسعود رضي الله عنه:","","",["رواه البخاري (7277)."],[201],0],[577,"h","النبي ﷺ","مصعب بن سعد","« نزل القرآن على رسول الله ﷺ قال: فتلا عليهم زمانًا، فقالوا: يا رسول الله لو قصصت علينا؛ فأنزل الله عز وجل الآية: يوسف: 1-3، فقالوا: يا رسول الله لو حدثتنا فأنزل الله عز وجل: الآية: الزمر: 23 كل ذلك يؤمَرُون بالقرآن أو يؤدَّبُون بالقرآن، قال خلاد: وزادني فيه قالوا: يا رسول الله لو ذكرتنا فأنزل الله عز وجل الآية: الحديد: 16 »","عن مصعب بن سعد، عن أبيه رحمه الله، قال:","صحيح","صححه الألباني في صحيح الموارد (1462)",["مسند البزار, البحر الزخار (3/352) رقم (1153). وصححه الألباني في صحيح الموارد (1462)."],[201],0],[578,"q","البغوي","","« والاقشعرار تَغيُّرٌ في جلد الإنسان عند الوَجَل والخوف، وقيل: المراد من الجلود القلوب أي قلوب الذين يخشون ربهم، …، أي: لذكر الله، أي: إذا ذُكِرَتْ آيات العذاب اقشعرَّت جلود الخائفين لله، وإذا ذُكرَت آيات الرحمة لانت وسكنت قلوبهم، كما قال الله تعالى: الآية: الرعد: 28. وحقيقةُ المعنى: أنَّ قلوبَهم تَقْشَعِرّ من الخوف وتلين عند الرجاء »","قال البغوي رحمه الله:","","",["تفسير البغوي (4/ 85) [الزمر: 23]."],[201],0],[579,"q","القرطبي","","« قوله: …؛ أي: يشبه بعضه بعضًا في الحسن والحكمة، ويصدِّقُ بعضه بعضًا، ليس فيه تناقض ولا اختلاف. وقال قتادة: يشبه بعضه بعضا في الآي والحروف. وقيل: يشبه كتب الله المنزلة على أنبيائه، لِما يتضمنه من أمر ونهي وترغيب وترهيب وإن كان أعم وأعجز. ثم وصفه فقال: … تُثَنَّى فيه القصص والمواعظ والأحكام وثُنِّي للتلاوة فلا يُمَلُّ. … تضطرب وتتحرك بالخوف مما فيه من الوعيد. … أي: عند آية الرحمة. وقيل: إلى العمل بكتاب الله والتصديق به. وقيل: … يعني الإسلام »","وقال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (15/ 249) [الزمر: 23]."],[201],0],[580,"q","ابن كثير","","« أي: إذا سمعوا كلام الله المتضمن حججه ودلائله وبراهينه، سجدوا لربهم خضوعًا واستكانة، وحمدًا وشكرًا على ما هم فيه من النعم العظيمة »","قال ابن كثير رحمه الله:","","",["تفسير ابن كثير (5/ 242) [مريم: 58]."],[203],0],[581,"q","السعدي","","« أي: خضعوا لآيات الله، وخشعوا لها، وأثَّرت في قلوبهم من الإيمان والرغبة والرهبة، ما أوجب لهم البكاء والإنابة، والسجود لربهم، ولم يكونوا من الذين إذا سمعوا آيات الله خرّوا عليها صمًّا وعُميانًا »","وقال السعدي رحمه الله:","","",["تفسير السعدي (2/ 669) [مريم: 58]."],[203],0],[582,"q","القرطبي","","« هذه مبالغةٌ في صفتِهم ومدحٌ لهم، وحُقَّ لكل من توسَّم بالعلم وحصل منه شيئًا أن يجري إلى هذه المرتبة، فيخشع عند استماع القرآن، ويتواضع، ويذِل »","قال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (10/ 341) [الإسراء: 109]."],[203,10],0],[583,"q","الشوكاني","","« قوله: الآية: الإسراء: 107، أي: أن العلماء الذين قرءوا الكتب السابقة قبل إنزال القرآن، وعرفوا حقيقة الوحي وأمارات النبوة كزيد ابن عمرو بن نفيل وورقة بن نوفل وعبد الله بن سلام …؛ أي: القرآن …؛ أي: يسقطون على وجوههم ساجدين لله سبحانه، وإنما قيد الخرور، وهو السقوط بكونه …؛ أي: عليها؛ لأن الذقن، وهو مجتمع اللحيين، أول ما يحاذي الأرض؛ وكرَّر ذكر الخرور للأذقان؛ لاختلاف السبب، فإن الأول لتعظيم الله سبحانه وتنزيهه، والثاني للبكاء بتأثير مواعظ القرآن في قلوبهم ومزيد خشوعهم، ولهذا قال: …؛ أي: سماعُ القرآن، أو القرآنُ بسماعِهم له … أي: لينَ قلب، ورُطوبةَ عين »","وقال الشوكاني رحمه الله:","","",["فتح القدير للشوكاني (3/ 313) [الإسراء: 109]."],[203],0],[584,"q","النسفي","","« وصفهم برقة القلوب وأنهم يبكون عند استماع القرآن؛ كما روي عن النجاشي أنه قال لجعفر بن أبي طالب رحمه الله حين اجتمع في مجلسه المهاجرون إلى الحبشة والمشركون وهم يقرأونه عليهم: هل في كتابكم ذكر مريم؟ قال جعفر رحمه الله: فيه سورة تنسب إلى مريم، فقرأها إلى قوله: الآية: مريم: 34، وقرأ سورة طه إلى قوله: الآية: طه: 9؛ فبكى النجاشي، وكذلك فعل قومُه الذين وفدوا على رسول الله ﷺ، وهم سبعون رجلاً حين قرأ عليهم سورة الآية: يس: 1؛ فبكوا، … تمتلئ من الدمع حتى تفيض؛ لأن الفيض أن يمتلئ الإناء أو غيره حتى يطلع ما فيه من جوانبه، فوضع الفيض الذي هو من الامتلاء موضع الامتلاء، أو قصدت المبالغة في وصفهم بالبكاء، فجعلت أعينهم كأنها تفيض بأنفسها؛ أي: تسيل من أجل البكاء، و(من) في … لابتداء الغاية، على أن فيض الدمع ابتدأ ونشأ من معرفة الحق وكان من أجله، ومن في … لتبيين الموصول الذي هو ما عرفوا، أو للتبعيض على أنهم عرفوا بعض الحق فأبكاهم، فكيف إذا عرفوا كله، وقرءوا القرآن وأحاطوا بالسنَة؟! »","قال النسفي رحمه الله:","","",["تفسير النسفي - مدارك التنزيل وحقائق التأويل (1/ 469) [المائدة: 83]."],[203],1],[585,"a","قتادة","","« هذا نعتُ أولياء الله، نعتهم الله بأن تقشعر جلودهم وتطمئن قلوبهم بذكر الله، ولم ينعتهم بذهاب عقولهم والغشيان عليهم، إنما ذلك في أهل البدع، وهو من الشيطان »","قال قتادة رحمه الله:","","",["تفسير البغوي (4/ 86) [الزمر: 23]."],[203,202],0],[586,"q","الماوردي","","« فيه ثلاثة أوجه: أحدها: أنها تقشعر من وعيده وتلين من وعده، قاله السدي. الثاني: أنها تقشعر من الخوف وتلين من الرجاء، قاله ابن عيسى. الثالث: تقشعر الجلود لإعظامه، وتلين عند تلاوته »","وقال الماوردي رحمه الله في قوله تعالى: الآية: الزمر: 23:","","",["تفسير الماوردي - النكت والعيون (5/ 123) [الزمر: 23]."],[203],0],[587,"q","الشوكاني","","« الوجل: الخوف والفزع، والمراد: أن حصول الخوف من الله، والفزع منه عند ذكره هو شأن المؤمنين الكاملي الإيمان، المخلصين لله، فالحصر باعتبار كمال الإيمان لا باعتبار أصل الإيمان »","قال الشوكاني رحمه الله:","","",["فتح القدير (5/ 123) [الأنفال: 2]."],[203],0],[588,"n","عامر بن عبد الله بن الزبير","","وعن عامر بن عبد الله بن الزبير، أن أباه أخبره أنه لم يكن بين إسلامهم، وبين أن نزلت هذه الآية، يعاتبهم الله بها، إلا أربعُ سنين","","حسن لغيره","حسنه لغيره شعيب الأرناؤوط في تخريج مشكل الآثار (3/ 195)",["رواه ابن ماجه (4192). وحسنه لغيره شعيب الأرناؤوط في تخريج مشكل الآثار (3/ 195)."],[3],0],[589,"q","البغوي","","« والمعنى: أن الله عز وجل ينهى المؤمنين أن يكونوا في صحبة القرآن كاليهود والنصارى الذين قست قلوبهم لمَّا طال عليهم الدهر »","وقال البغوي رحمه الله:","","",["تفسير البغوي (8/ 37). [سورة الحديد: 16]."],[3],0],[590,"q","ابن رجب","","« وقد وبَّخ الله من لا يخشع قلبه لسماع كلامه وتدبره، وقد سمع كثير من الصالحين هذه الآية تُتلى، فأثَّرتْ فيهم آثارًا متعددة، فمنهم من مات عند ذلك؛ لانصداع قلبه بها، ومنهم من تاب عند ذلك، وخرج عما كان فيه »","وقال ابن رجب رحمه الله:","","",["الذل والانكسار للعزيز الجبار- لابن رجب (ص/ 298)."],[3],0],[591,"a","الحسن البصري","","« يا ابن آدم، إذا وسوس لك الشيطان بخطيئة أو حدثتك بها نفسك، فاذكر عند ذلك ما حملك الله من كتابه مما لو حملته الجبال الرواسي لخشعت وتصدعت! أما سمعته يقول: الآية: الحديد: 16 فإنما ضرب لك الأمثال لتتفكر فيها، وتعتبر بها، وتزدجر عن معاصي الله عز وجل، وأنت يا ابن آدم أحق أن تخشع لذكر الله وما حملك من كتابه وآتاك من حكمه، لأنَّ عليك الحساب ولك الجنة أو النار »","ورُوي عن الحسن رحمه الله، أنه قال:","","",["تفسير ابن رجب (2/ 16) [المؤمنون: 2]."],[3],1],[592,"q","القرطبي","","« وقيل: إنه خطاب للأمة، وأن الله تعالى لو أنذر بهذا القرآن الجبال لتصدعت من خشية الله. والإنسان أقل قوة وأكثر ثباتًا، فهو يقوم بحقه إن أطاع، ويقدر على رده إن عصى، لأنه موعود بالثواب ومزجور بالعقاب »","وقال القرطبي:","","",["تفسير القرطبي - الجامع لأحكام القرآن (18/ 45) [الحشر: 21]."],[3],0],[593,"q","الآجري","","« والقليل من الدرس للقرآن مع الفكر فيه وتدبُّره، أحبُّ إليَّ من قراءة الكثير من القرآن بغير تدبر ولا تفكر فيه، وظاهر القرآن يدل على ذلك، والسنة، وأقوال أئمة المسلمين »","قال الآجري رحمه الله:","","",["أخلاق أهل القرآن [ص/ 169]."],[204],0],[594,"q","ابن القيم","","« لو علم النَّاس ما في قراءة القرآن بالتدبر، لاشتغلوا بها عن كل ما سواها، فقراءة آيَة بتفكر وتَفَهُّم خير من قراءة ختمة بغير تدبر وتَفَهُّم، وأنفع للقلب، وأدعى إلى حصول الإيمان وذوق حلاوة القرآن ... فقراءة القرآن بالتفكر هي أصل صلاح القلب ... ولهذا أنزل الله القرآن؛ ليُتَدَبَّر ويُتَفكَّر فيه، ويُعمَلَ به، لا لمجرد الإعراض عنه »","وقال ابن القيم رحمه الله:","","",["مفتاح دار السعادة (1/ 187)."],[204],0],[595,"q","ابن رجب","","« ومن أعظم ما يُتَقَرَّب به إلى الله تعالى من النوافل كثرة تلاوة القرآن، وسماعه بتفكُّر وتدبر وتَفَهُّم »","وقال الحافظ ابن رجب رحمه الله:","","",["جامع العلوم والحكم (2/ 342)."],[204],0],[596,"q","البغوي","","« قوله تعالى: …؛ يعني: أفلا يتفكرون في القرآن، والتدبر: هو النظر في آخر الأمر، ودبر كل شيء: آخره »","قال البغوي رحمه الله:","","",["تفسير البغوي [النساء: 82]."],[205],0],[597,"q","ابن القيم","","« وأمَّا (التأمُّل في القرآن) فهو تحديق ناظر القلب إلى معانيه وجمعُ الفكر على تدبُّره وتعقُّله، وهو المقصود بإنزاله »","وقال ابن القيم رحمه الله:","","",["مدراج السالكين (2/ 83)."],[205],0],[598,"q","السعدي","","« يأمر تعالى بتدبر كتابه، وهو التأمل في معانيه، وتحديق الفكر فيه، وفي مبادئه وعواقبه، ولوازم ذلك، فإنَّ تدبُّرَ كتاب الله مفتاح للعلوم والمعارف، وبه يستنتج كل خير، وتستخرج منه جميع العلوم »","وقال السعدي رحمه الله:","","",["تفسير السعدي (2/ 222) [النساء: 82]."],[205],0],[599,"s","عبد الله بن عباس","","« أفلا يتدبرون القرآن؛ فيتفكرون فيه، فيرون تصديق بعضه لبعض، وما فيه من المواعظ والذكر والأمر والنهي، وأن أحدًا من الخلائق لا يقدر عليه »","قال ابن عباس رضي الله عنهما:","","",["معاني القرآن للزجاج (2/ 82)."],[206],0],[600,"q","القرطبي","","« ودلت هذه الآية، وقوله تعالى: الآية: محمد: 24 على وجوب التدبر في القرآن؛ ليعرف معناه »","وقال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (5/ 290) [النساء: 82]."],[206],0],[601,"q","ابن كثير","","« يقول تعالى آمرًا عباده بتدبر القرآن، وناهيًا لهم عن الإعراض عنه، وعن تفهُّم معانيه المحكمة وألفاظه البليغة، ومخبرًا لهم أنه لا اختلاف فيه ولا اضطراب، ولا تضادّ ولا تعارض؛ لأنه الآية: فصلت: 42 فهو حق من حق؛ ولهذا قال تعالى: الآية: محمد: 24 ثم قال: … أي: لو كان مفتعلًا مختَلقًا، كما يقوله من يقوله من جهلة المشركين والمنافقين في بواطنهم، …؛ أي: اضطرابًا وتضادًّا كثيرًا؛ أي: وهذا سالم من الاختلاف، فهو من عند الله، كما قال تعالى مخبرًا عن الراسخين في العلم حيث قالوا: الآية: آل عمران: 7؛ أي: محكمه ومتشابهه حق؛ فلهذا ردوا المتشابه إلى المحكم فاهتدوا، والذين في قلوبهم زيغ ردوا المحكم إلى المتشابه فغووا؛ ولهذا مدح تعالى الراسخين وذم الزائغين »","وقال ابن كثير رحمه الله:","","",["تفسير ابن كثير (2/ 364) [النساء: 82]."],[206],0],[602,"a","قتادة","","« إذاً والله يجدون في القرآن زاجرًا عن معصية الله، لو تدبره القوم فعقلوه، ولكنهم أخذوا بالمتشابه فهلكوا عند ذلك »","عن قتادة رحمه الله، قال:","","",["تفسير الطبري - جامع البيان (22/ 179) [المؤمنون: 68]."],[206],0],[603,"n","","","وقوله تعالى: الآية: المؤمنون: 68 »","","","",["أضواء البيان [سورة ص: 29]."],[207],0],[604,"q","الشوكاني","","« والاستفهام في قوله: … للإنكار والمعنى: أفلا يتفهمونه فيعلمون بما اشتمل عليه من المواعظ الزاجرة، والحجج الظاهرة، والبراهين القاطعة التي تكفي من له فهم وعقل، وتزجره عن الكفر بالله والإشراك به والعمل بمعاصيه … (أم) هي المنقطعة، أي: بل أعلى قلوب أقفالها فهم لا يفهمون ولا يعقلون »","وقال الشوكاني رحمه الله:","","",["فتح القدير (5/ 46) [سورة محمد: 24]."],[207],0],[605,"q","السعدي","","« وكلما ازداد العبد تأمُّلًا فيه ازداد علمًا وعملًا وبصيرة، لذلك أمر الله بذلك وحث عليه وأخبر أنه [هو] المقصود بإنزال القرآن، كما قال تعالى: الآية: ص: 29 »","وقال السعدي رحمه الله:","","",["تفسير السعدي (1/ 222) [سورة النساء: 82]."],[207],0],[606,"a","السلمي","","« سمعت الإمام أبا عثمان المغربي عز وجل، يقول: ليكن تدبُّرك في الخلق تدبُّرَ عبرة، وتدبُّرك في نفسك تدبُّرَ موعظةٍ، وتدبرك في القران تدبر حقيقة, قال الله تعالى: … جرَّأكَ به على تلاوته، ولولا ذلك لكلَّتِ الأَلسُنُ عن تلاوته »","وقال السُّلمي رحمه الله:","","",["سير أعلام النبلاء (16/320)."],[207],0],[607,"q","ابن القيم","","« وبالجملة فلا شيْء أنفع للقلب من قراءَة القرآن بالتدبر والتَّفَكُّر؛ فَإنَّه جَامعٌ لجميع منازل السائرين، وأحوال العاملين، ومقامات العارفين، وهو الذي يُورث المحبة والشوق، وَالخوف والرجاء، والإنابة والتوكل، والرِّضَا والتفويض وَالشكر وَالصبر، وَسَائِر الأحوال الَّتِي بها حَيَاة القلب وكماله. وكذلك يزْجر عَن جميع الصِّفات والأفعال المذمومة، والتي بها فساد القلب وهلاكه »","قال ابن القيم رحمه الله:","","",["مفتاح دار السعادة (1/ 187)."],[208],0],[608,"q","ابن باديس","","« وأما حظ التجربة؛ فوالله الذي لا إله إلّا هو، ما رأيت- وأنا ذو النفس الملأى بالذنوب والعيوب- أعظم إِلَانةً للقلب واستدرارًا للدمع، وإحضارًا للخشية، وأبعث على التوبة؛ من تلاوة القرآن وسماع القرآن »","وقال ابن باديس رحمه الله:","","",["تفسير ابن باديس [ص/ 39].","تفسير ابن باديس (ص/ 39)."],[208,126],0],[609,"q","السعدي","","« فإن تدبر كتاب الله مفتاح للعلوم والمعارف، وبه يستنتج كل خير وتستخرج منه جميع العلوم، وبه يزداد الإيمان في القلب وترسخ شجرته. فإنه يعرِّف بالرب المعبود، وما له من صفات الكمال، وما ينزه عنه من سمات النقص، ويعرِّف الطريق الموصلة إليه وصفة أهلها، وما لهم عند القدوم عليه، ويعرِّف العدو الذي هو العدو على الحقيقة، والطريق الموصلة إلى العذاب، وصفة أهلها، وما لهم عند وجود أسباب العقاب. وكلما ازداد العبد تأمُّلًا فيه ازداد علمًا وعملًا وبصيرة، لذلك أمر الله بذلك وحث عليه وأخبر أنه [هو] المقصود بإنزال القرآن، كما قال تعالى: الآية: ص: 29، وقال تعالى: الآية: محمد: 24. ومن فوائد التدبر لكتاب الله: أنه بذلك يصل العبد إلى درجة اليقين والعلم بأنه كلام الله؛ لأنه يراه يصدق بعضه بعضًا، ويوافق بعضه بعضًا, فترى الحكم والقصة والإخبارات تعاد في القرآن في عدة مواضع، كلها متوافقة متصادقة، لا ينقض بعضها بعضًا، فبذلك يعلم كمال القرآن وأنه من عند من أحاط علمه بجميع الأمور الآية: النساء: 82؛ أي: فلما كان من عند الله لم يكن فيه اختلاف أصلًا »","وقال السعديُّ رحمه الله:","","",["تفسير السعدي (1/ 222) [النساء: ٨٢]."],[208],0],[610,"p","","","فَتدبَّرِ القُرآنَ إن رُمتَ الهُدى … فالعِلمُ تحتَ تَدبُّر القُرآنِ","","","",["نونية ابن القيم الكافية الشافية (المتن/ 55) رقم البيت (736)."],[208],0],[611,"h","النبي ﷺ","عمر بن الخطاب","«إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى، فمن كانت هجرته إلى دنيا يصيبها، أو إلى امرأة ينكحها، فهجرته إلى ما هاجر إليه»","والأعمال إنما تكون صحيحة مقبولة بصلاح نية العامل؛ فعن عمر بن الخطاب رضي الله عنه قال: سمعت رسول الله ﷺ يقول:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (1)."],[209],0],[612,"h","النبي ﷺ","عبد الله بن عمر","«من طلب العلم ليماريَ به السفهاء أو ليُباهيَ به العلماء أو ليصرفَ وجوهَ الناسِ إليه فهو في النار»","عن ابن عمر رضي الله عنهما عن النبي ﷺ قال:","حسن","حسنه الألباني في صحيح الجامع (6382)",["رواه ابن ماجه (253) وحسنه الألباني في صحيح الجامع (6382). ورواه الترمذي بنحوه (2654) من حديث كعب بن مالك رحمه الله."],[210],0],[613,"q","السندي","","« قوله «ليماري به السفهاء» أي: يجادل به ضعاف العقول، وقوله «أو ليباهي به» أي: يفاخر، وقوله: «أو ليصرف وجوه الناس إليه» أي: ينوي به تحصيل المال والجاه وصرف وجوه الناس العوام إليه وجعلهم كالخدم له، أو جعلهم ناظرين إذا تكلم متعجبين من كلامه إذا تكلم مجتمعين حوله إذا جلس، وقوله «فهو في النار» معناه: أنه يستحقها بلا دوام، ثم فضل الله واسع فإن شاء عفا بلا دخول »","قال السندي رحمه الله:","","",["حاشية السندي على ابن ماجه (1/ 111) حديث رقم (253)."],[210],0],[614,"h","النبي ﷺ","جابر بن عبد الله","«لا تعلَّموا العِلمَ لتُباهوا بِهِ العُلماءَ، ولا لتُماروا بِهِ السُّفَهاءَ، ولا تخيَّروا بِهِ المَجالسَ، فمن فعلَ ذلِكَ فالنَّارُ النَّارُ»","وعن جابر بن عبد الله رضي الله عنه قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح ابن ماجه (208)",["رواه ابن ماجه (254) وابن حبان في صحيحه (77) وصححه الألباني في صحيح ابن ماجه (208)."],[210],0],[615,"h","النبي ﷺ","جابر بن عبد الله","«ولا لِتَجْتَرِئوا به المجالسَ، فمن فعل ذلك فالنارُ النارُ»","وعن جابر بن عبد الله رضي الله عنه قال: قال رسول الله ﷺ: «لا تعلَّموا العِلمَ لتُباهوا بِهِ العُلماءَ، ولا لتُماروا بِهِ السُّفَهاءَ، ولا تخيَّروا بِهِ المَجالسَ، فمن فعلَ ذلِكَ فالنَّارُ النَّارُ». وفي لفظ","صحيح","صححه الألباني في صحيح الجامع (7370)",["صححه الألباني في صحيح الجامع (7370)."],[210],0],[616,"q","السندي","","« قوله: «لا تعلَّموا» أي: لا تتعلموا - بالتاءين - فحذفت إحداهما، وقوله: «ولا تخيَّروا بِهِ المَجالسَ» أي: لا تختاروا به خيار المجالس وصدورها، وقوله: «فالنَّارُ» أي: فله النار أو فيستحق النار »","قال السندي رحمه الله:","","",["حاشية السندي على ابن ماجه، حديث رقم (254)."],[210],0],[617,"s","معاوية","","« قد فُعل بهؤلاء هذا فكيف بمن بقي من الناس؟ ثم بكى معاوية بكاءً شديدًا حتى ظننا أنه هالك، وقلنا قد جاءنا هذا الرجل بشر، ثم أفاق معاوية ومسح عن وجهه، وقال: صدق الله ورسوله: الآية: هود: 15-16 »","قال أبو عثمان: وحدثني العلاء بن أبي حكيم، أنه كان سيّافًا لمعاوية فدخل عليه رجل، فأخبره بهذا عن أبي هريرة، فقال معاوية:","صحيح","صححه الألباني في صحيح الموارد (2119) وأصله في مسلم (1905)",["رواه الترمذي (2382) وصححه الألباني في صحيح الموارد (2119) وأصله في مسلم (1905)."],[210],0],[618,"q","النووي","","« في الحديث دليل على تغليط تحريم الرياء وشدة عقوبته، وعلى الحث على وجوب الإخلاص في الأعمال، كما قال الله تعالى: الآية: البينة: 5 وفيه: أن العمومات الواردة في فضل الجهاد إنما هي لمن أراد الله تعالى بذلك مخلصًا، وكذلك الثناء على العلماء وعلى المنفقين في وجوه الخيرات، كله محمول على من فعل ذلك لله تعالى مخلصا »","قال النووي رحمه الله:","","",["شرح مسلم (13/ 51) حديث رقم (1905)."],[210],0],[619,"h","النبي ﷺ","أبو سعيد الخدري","«المنافق كافر به، والفاجر يتأكل به، والمؤمن يؤمن به»","له ﷺ يقول: «يكون خلف من بعد ستين سنة، أضاعوا الصلاة، واتبعوا الشهوات، فسوف يلقون غيًّا، ثم يكون خلف يقرؤون القرآن، لا يعدو تراقيهم، ويقرأ القرآن ثلاثة: مؤمن، ومنافق، وفاجر»، قال بشير: فقلت للوليد: ما هؤلاء الثلاثة؟ فقال:","حسن","حسنه شعيب الأرناؤوط في تخريج المسند (11340)",["رواه أحمد (11340) وحسنه شعيب الأرناؤوط في تخريج المسند (11340)."],[211],0],[620,"h","النبي ﷺ","جابر","«اقرءوا فكلٌّ حسن وسيجيء أقوام يقيمونه كما يقام القدح يتعجلونه ولا يتأجلونه»","وعن جابر رضي الله عنه قال: خرج علينا رسول الله ﷺ ونحن نقرأ القرآن وفينا الأعرابي والأعجمي، فقال:","صحيح","صححه الوادعي في الصحيح المسند من دلائل النبوة (588)",["رواه أبو داود (830) وأحمد (14855) وصححه الوادعي في الصحيح المسند من دلائل النبوة (588)."],[211],0],[621,"q","الطيبي","","« وفي الحديث رفع الحرج وبناء الأمر على المساهلة في الظاهر، وتحري الحسبة والإخلاص في العمل، والتفكر في معاني القرآن، والغوص في عجائب أمره »","قال الطيبي رحمه الله:","","",["شرح المشكاة للطيبي الكاشف عن حقائق السنن (5/ 1691)."],[211],0
