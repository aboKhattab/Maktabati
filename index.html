إرادي, وموت طبيعي, فمن أمات نفسه موتًا إراديًا كان موته الطبيعي حياة له\", ومعنى هذا: أن الموت الإرادي: هو قمع الشهوات المردية, وإخماد نيرانها المحرقة, وتسكين هوائجها المتلفة, فحينئذ يتفرغ القلب والروح للتفكر فيما فيه كمال العبد, ومعرفته والاشتغال به, ويرى حينئذ أن إيثار الظل الزائل عن قريب على العيش اللذيذ الدائم أخسر الخسران. فأما إذا كانت الشهوات وافدة, واللذات مؤثرة, والعوائد غالبة, والطبيعة حاكمة, فالقلب حينئذ: إما أن يكون أسيرًا ذليلًا, أو مهزومًا مخرجًا عن وطنه ومستقره الذي لا قرار له إلا فيه, أو قتيلًا ميتًا, وما لجرح به إيلام, وأحسن أحواله: أن يكون في حربٍ يُدالُ له فيها مرة, ويُدالُ عليه مرة, فإذا مات العبد موته الطبيعي, كانت بعده حياة روحه بتلك العلوم النافعة, والأعمال الصالحة, والأحوال الفاضلة التي حصلت له بإماتة نفسه, فتكون حياته ههنا على حسب موته الإرادي في هذه الدار, وهذا موضع لا يفهمه إلا ألبَّاءُ الناس وعقلاؤهم, ولا يعمل بمقتضاه إلا أهل الهمم العلية, والنفوس الزكية الأبية »","قال ابن القيم رحمه الله:","","",["مدارج السالكين (٤/ ١١٥٨)."],[340],0],[1161,"h","النبي ﷺ","","«العجَلةُ من الشَّيطانِ والتَّأنِّي من اللهِ تعالَى»","ومن أبوابه: العَجَلَة, وترك التثبّت, وقد قال النبي صلى الله عليه وآله وسلم:","حسن","حسنه الألباني في صحيح الجامع (3011)",["أخرجه الخرائطي في مكارم الأخلاق (686) والبيهقي في السنن الكبرى (20270) وحسنه الألباني في صحيح الجامع (3011)."],[341],0],[1162,"q","ابن قدامة","","« اعلم أنَّ القلبَ بأصل فطرته قابلٌ للهُدى, وبما وُضع فيه من الشهوة والهوى, مائلٌ عن ذلك, والتطاردُ فيه بين جندي الملائكة والشياطين دائمٌ, إلى أن ينفتح القلبُ لأحدهما, فيتمكّن, ويستوطن, ويكون اجتيازُ الثاني اختلاسًا كما قال تعالى: الآية: الناس: 4, وهو الذي إذا ذكر الله خنس, وإذا وقعت الغفلة انبسط, ولا يطرد جند الشياطين من القلب إلا ذكرُ الله تعالى, فإنه لا قرار له مع الذكر. واعلم: أن مثل القلب كمثل حِصْن, والشيطان عدو يريد أن يدخل الحِصْن, ويملكه ويستولى عليه, ولا يمكن حفظُ الحِصْن إلا بحراسة أبوابه, ولا يقدر على حراسة أبوابه من لا يعرفُها, ولا يتوصل إلى دفع الشيطان إلا بمعرفة مداخله. ومداخلُ الشيطان وأبوابُه؛ صفاتُ العبد, وهي كثيرةٌ, إلا أنا نشير إلى الأبواب العظيمة الجارية مجرى الدُّرُوب التي لا تضيق عن كثرة جنود الشيطان. فمن أبوابه العظيمة: الحَسَد, والحِرْص, فمتى كان العبد حريصًا على شيء, أعماه حرصُه وأصمَّه, وغطَّى نورَ بصيرته التي يعرف بها مداخلَ الشيطان. وكذلك إذا كان حسودًا, فيجد الشيطان حينئذ الفرصة, فيحسن عند الحريص كل ما يوصله إلى شهوته, وإن كان منكرًا أو فاحشًا. ومن أبوابه العظيمة: الغضبُ, والشهوةُ, والحِدَّةُ؛ فإنَّ الغضبَ غولُ العقلِ, وإذا ضَعُفَ جُنْدُ العقل هجم حينئذ الشيطانُ فلعب بالإنسان. وقد رُويَ أنَّ إبليس يقول: إذا كان العبد حديدًا, قلَّبناه كما يُقلِّب الصبيان الكُرَة. ومن أبوابه: حبُّ التزيين في المنزل والثياب والأثاث, فلا يزال يدعو إلى عمارة الدار وتزيين سُقُوفها وحيطانها, والتزيّن بالثياب, والأثاث, فيخسر الإنسانُ طولَ عُمُره في ذلك. ومن أبوابه: الشِّبَع, فإنه يُقَوي الشهوة, ويشغل الطاعة. ومنها: الطمع في الناس, فإنَّ مَنْ طمِع في شخص, بالغ بالثناء عليه بما ليس فيه, وداهنه, ولم يأمره بالمعروف, ولم ينهه عن المنكر. ومن أبوابه: العَجَلَة, وترك التثبّت, وقد قال النبي صلى الله عليه وآله وسلم: «العجَلةُ من الشَّيطانِ والتَّأنِّي من اللهِ تعالَى». ومن أبوابه: حبّ المال, ومتى تمكَّن من القلب أفسدَه, وحمله على طلب المال من غير وجهه, وأخرجه إلى البخل, وخوَّفه الفقر, فمنع الحقوقَ اللازمة. ومن أبوابه: حمل العوام على التعصب في المذاهب, دون العمل بمقتضاها. ومن أبوابه أيضًا: حمل العوامِّ على التفكير في ذات الله تعالى, وصفاته, وفى أمور لا تبلغها عقولهم حتى يُشكِّكهم في أصل الدين. ومن أبوابه: سوء الظنِّ بالمسلمين, فإنَّ مَنْ حكم على مسلم بسوء ظنه, احتقره وأطلق فيه لسانَه, ورأى نفسَه خيرًا منه, وإنما يترشّح سوءُ الظن بخبث الظانِّ؛ لأن المؤمنَ يطلب المعاذير للمؤمن, والمنافق يبحث عن عيوبه. وينبغي للإنسان أن يحترز عن مواقف التُّهم؛ لئلا يُساءَ به الظنّ, فهذا طَرَفٌ من ذكر مداخل الشيطان, وعلاج هذه الآفات سدُّ المداخل بتطهير القلب من الصفات المذمومة, وسيأتي الكلام عن هذه الصفات, إن شاء الله تعالى مفصلًا. إذا قُلعت من القلب أصولُ هذه الصفات, بقيَ للشيطان بالقلب خَطَراتٌ واجتيازاتٌ من غير استقرار, فيمنعه من ذلك ذكر الله تعالى, وعمارة القلب بالتقوى »","في مختصر منهاج القاصدين:","","",["مختصر منهاج القاصدين (ص/ 193- 195). وقد أوردته بتمامه لأهميته وعظيم الانتفاع به لمن تأمله."],[341],1],[1163,"q","ابن القيم","","« فأمَّا طبُّ القلوب, فمسلَّمٌ إلى الرُّسل صلوات الله عليهم وسلامه, ولا سبيل إلى حصوله إلا من جهتهم وعلى أيديهم, فإنَّ صلاح القلوب أن تكون عارفةً بربِّها وفاطرها وبأسمائه وصفاته وأفعاله وأحكامه, وأن تكون مُؤْثِرةً لمرضاته ومحابِّه, متجنِّبةً لمناهيه ومساخطه؛ ولا صحَّة لها ولا حياة البتَّة إلا بذلك, ولا سبيل إلى تلقِّيه إلا من جهة الرُّسل. وما يُظَنُّ من حصول صحَّة القلب بدون اتِّباعهم فغلطٌ ممَّن يظنُّ ذلك, وإنَّما ذلك حياة نفسه البهيميَّة الشَّهوانيَّة وصحَّتها وقوَّتها؛ وحياةُ قلبه وصحَّتُه وقوَّتُه عن ذلك بمعزلٍ, ومن لم يميِّز بين هذا وهذا, فليبكِ على حياة قلبه فإنَّه من الأموات, وعلى نوره فإنَّه منغمسٌ في بحار الظُّلمات »","قال ابن القيم رحمه الله:","","",["زاد المعاد (٤/ ٧)."],[342],0],[1164,"a","","","« فعلاج مرض القلب أهمُّ من علاج مرض الأبدان, ولا ينجو إلا من أتى الله بقلب سليم, وله دواءان: أحدهما: ملازمة ذكر الموت, وطول التأمل فيه, مع الاعتبار بخاتمة الملوك, وأرباب الدنيا أنهم كيف جمعوا كثيرًا, وبنَوا قصورًا, وفرحوا بالدنيا بطَرًا وغرورًا, فصارت قصورهم قبورًا, وأصبح جمعهم هباءً منثورًا: الآية: الأحزاب: 38, الآية: السجدة: 26 فقصورهم, وأملاكهم, ومساكنهم, صوامت ناطقة, تشهد بلسان حالها على غرور عُمّالها, فانظر الآن في جميعهم: الآية: مريم: 98. الدواء الثاني: تدبر كتاب الله تعالى, ففيه شفاءٌ ورحمةٌ للعالمين, وقد أصبح أكثرُ الناس أمواتًا عن كتاب الله تعالى, وإن كانوا أحياء في معايشهم, وبُكْمًا عن كتاب الله تعالى وإن كانوا يتلونه بألسنتهم, وصٌمًّا عن سماعه وإن كانوا يسمعونه بآذانهم, وعُميًا عن عجائبه وإن كانوا ينظرون إليه في صحائفهم ومصاحفهم, نائمين عن أسراره, وإن كانوا يشرحونه في تفاسيرهم, فاحذرْ أن تكون منهم, وتدبَّرْ أمرك, وأمرَ من لم يتدّبر كيف يقوم ويُحشر! وانظر في أمرك وأمر من لم ينظر في أمر نفسه, كيف خاب عند الموت وخسر! واتّعِظ بآية واحدة من كتاب الله, ففيه مقنع وبلاغ لكل ذي بصيرة, قال الله تعالى: الآية: المنافقون: 9 إلى آخرها! »","","","",["المختار من طبقات الشافعية الكبرى (ص/ 122-123)."],[343],0],[1165,"q","ابن القيم","","« القلب يَمرضُ كما يمرض البدنُ, وشفاؤهُ في التوبة والحِمْية, ويَصْدَأ كما تَصْدأ المرآةُ, وجلاؤهُ بالذكر, ويَعْرَى كما يَعْرَى الجسمُ, وزينتُهُ التَّقوى, ويجوعُ ويظمأ كما يجوع البدن, وطعامه وشرابه المعرفةُ والمحبة, والتوكل, والإنابة, والخدمةُ »","وقال ابن القيم رحمه الله:","","",["الفوائــد (ص/ 143)."],[343],0],[1166,"a","إبراهيم الخواص","","« دواء القلب خمسة أشياء: قراءة القرآن بالتدبُّر, وخلاء البطن, وقيام الليل, والتضرع عند السحر, ومجالسة الصالحين »","وقال إبراهيم الخواص رحمه الله:","","",["التبيان في آداب حملة القرآن(ص/٧٧)."],[343],0],[1167,"p","","","دواءُ قلبك خمسٌ عند قسوته … فادْأبْ عليها تفُزْ بالخيرِ والظَّفَرِ … خلاءُ بطن وقرآنٌ تَدَبَّرَهُ … كذا تضرُّعُ باكٍ ساعة السَّحَرِ … ثم التَّهَجُّد جنحَ الليل أوسطَه … وأنْ تُجالسَ أهلَ الخيرِ والخبَر","","","",["الضوء اللامع لأهل القرن التاسع (1/ 286)."],[343],0],[1168,"q","ابن القيم","","« وليس لشفاء القلوب دواءٌ قطُّ أنفعُ من القرآن, فإنه شفاؤها التامُّ الكاملُ الذي لا يُغادِرُ فيها سقَمًا إلا أبْرأَه, ويحفظُ عليها صحَّتَها المُطْلقةَ, ويَحْمِيهَا الحمية التامَّةَ من كلِّ مُؤْذٍ ومُضِرٍّ »","قال ابن القيم رحمه الله:","","",["زاد المعاد (4/ 80)."],[344],0],[1169,"h","النبي ﷺ","أبو موسى الأشعري","«إنَّ مَثَلَ ما بعثني اللهُ به رحمه الله من الهُدى والعِلمِ كمثلِ غيثٍ أصاب أرضًا, فكانت منه طائفةٌ طيبةٌ قبلت الماءَ فأنبتتِ الكَلَأ والعُشْبَ الكثيرَ, وكان منها أجادبُ أمسكتِ الماءَ, فنفعَ اللهُ بها الناسَ, فشرِبُوا منها وسقَوا ورَعَوا, وأصاب طائفةً منها أخرى, إنما هي قِيعانٌ لا تُمسكُ ماءً ولا تُنبتُ كَلًأ. فذلك مثَلُ من فقُهَ في دينِ الله, ونفَعَهُ بما بَعَثَني اللهُ به, فعلِمَ وعلَّمَ, ومثَلُ منْ لم يرفعْ بذلك رَأسًا, ولم يقبلْ هُدى اللهِ الذي أرسلتُ به»","عن أبي موسى الأشعري رضي الله عنه, عن النبي ﷺ قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (79) ومسلم (2282) واللفظ له."],[345],0],[1170,"q","النووي","","« ومعناه: «أن الأرض ثلاثة أنواع», وكذلك الناس؛ فالنوع الأول من الأرض: ينتفع بالمطر فيحيا بعد أن كان ميتًا, وينبت الكلأ, فتنتفع بها الناس والدواب والزرع وغيرها, وكذا النوع الأول من الناس؛ يبلغه الهدى والعلم فيحفظه فيحيا قلبه, ويعمل به, ويعلمه غيره فينتفع وينفع. والنوع الثاني من الأرض: ما لا تقبل الانتفاع في نفسها, لكن فيها فائدة, وهي إمساك الماء لغيرها, فينتفع بها الناس والدواب, وكذا النوع الثاني من الناس؛ لهم قلوب حافظة, لكن ليست لهم أفهام ثاقبة, ولا رسوخ لهم في العقل يستنبطون به المعاني والأحكام, وليس عندهم اجتهاد في الطاعة والعمل به, فهم يحفظونه حتى يأتي طالب محتاج متعطش لما عندهم من العلم, أهل للنفع والانتفاع, فيأخذه منهم فينتفع به, فهؤلاء نفعوا بما بلغهم. والنوع الثالث من الأرض: السباخ التي لا تنبت ونحوها, فهي لا تنتفع بالماء, ولا تمسكه لينتفع بها غيرها, وكذا النوع الثالث من الناس؛ ليست لهم قلوب حافظة, ولا أفهام واعية, فإذا سمعوا العلم لا ينتفعون به, ولا يحفظونه لنفع غيرهم, وفي هذا الحديث أنواع من العلم: منها ضرب الأمثال, ومنها فضل العلم والتعليم, وشدة الحث عليهما, وذم الإعراض عن العلم, والله أعلم »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (15/ 47) حديث رقم (2282)."],[345],0],[1171,"q","ابن القيم","","« المرتبة الخامسة - أي: من مراتب الحياة: الحياة التي أشار إليها المصنف, وهي (حياة العلم من موت الجهل) فإن الجهل موت لأصحابه, كما قيل: وفي الجهل قبل الموت موتٌ لأهلِهِ … وأجسامُهم قبل القبورِ قبورُ … وأرواحُهُم في وَحْشة من جسومهمْ … فليس لهم حتى النشورِ نشورُ فإن الجاهل ميت القلب والروح, وإنْ كان حي البدن فجسده قبر يمشي به على وجه الأرض, قال الله تعالى: الآية: الأنعام: 122, وقال تعالى: الآية: يس: 69-70, وقال تعالى: الآية: الروم: 52, وقال تعالى: الآية: فاطر: 22, وشبَّههم في موت قلوبهم بأهل القبور, فإنهم قد ماتت أرواحهم, وصارت أجسامهم قبورًا لها, فكما أنه لا يسمع أصحاب القبور كذلك لا يسمع هؤلاء. وإذا كانت الحياة هي الحس والحركة وملزومهما؛ فهذه القلوب لمَّا لم تحس بالعلم والإيمان, ولم تتحرك له: كانت ميتة حقيقة, وليس هذا تشبيهًا لموتها بموت البدن, بل ذلك موت القلب والروح »","وقال ابن القيم رحمه الله:","","",["مدارج السالكين (٤/ ١١٥٦ - ١١٥٧)."],[345],0],[1172,"a","","","« يا بُني جالِسِ العُلماءَ, وزاحمْهُمْ برُكبتيكَ, فإنَّ الله يُحيي القُلوبَ بنورِ الحِكمةِ, كما يحيي اللهُ الأرضَ الميتةَ بوابلِ السماءِ »","وعن مالك أنه بلغه أن لقمان الحكيم أوصى ابنه فقال:","","",["موطأ مالك (1)."],[345],0],[1173,"s","معاذ بن جبل","","« تعلموا العلم, فإن تعلُّمَه لله خشية, وطلبه عبادة, ومذاكرته تسبيح, والبحث عنه جهاد, وتعليمه لمن لا يعلمه صدقة, وَبَذْلَه لأهله قُرْبَة؛ لأنه مَعالمُ الحلال والحرام, ومنارُ سُبل أهل الجنة . وهو الأنيسُ في الوَحشة, والصاحبُ في الغربة, والمحدث في الخلوة, والدليل على السراء والضراء, والسلاح على الأعداء, والزين عند الأخِلَّاء. يرفع الله به أقوامًا؛ فيجعلُهم في الخيرِ قادةً, يُقتدى بهم, وأئمةً في الخلق تُقْــتَــصُّ آثارُهم, ويُنْتَهَى إلى رأيهم, ترغب الملائكة في خُلَّتَهم, وبأجنحتِها تمسَحُهم, يستغفر لهم كلُّ رطْب ويابسٍ, وحيتانُ البحر وَهَوَامُّه, وسباعُ البر وأنعامُه؛ لأنَّ العلمَ حياةُ القلوب من الجهل, ونورُ الأبصار من الظُّــلَم, وقوةُ الأبدانِ من الضَّعف, يبلغُ العبدُ بالعلم منازلَ الأخيار, ومُجالسةَ المُلوك, والدرجاتِ العُلى في الدنيا والآخرة, التفكرُ فيه يعدلُ الصيام, ومدارستُه تعدل القيامَ, به يُطاعُ الله عز وجل, وبه يُعبدُ الله عز وجل, وبه تُوصلُ الأرحام, وبه يُعرفُ الحلالُ من الحرام. وهو إمامُ العمل, والعملُ تابع له, يُلْهَمُه السُّعداءُ, ويُحْرَمه الأشقياء »","وقال معاذ بن جبل رضي الله عنه:","","",["أخلاق العلماء للآجري (ص/ 34) وقوت القلوب لأبي طالب المكي (1/ 233). وقالابن القيم: وقد روي مرفوعًا إلى النبي ﷺ، والوقف أصح - المدارج (4/ 1157)."],[345],0],[1174,"q","ابن القيم","","« \"لأن العلم حياة القلوب من الجهل\" فالقلب ميت وحياته بالعلم والإيمان »","قال ابن القيم بعد قول معاذ رضي الله عنه: والمقصود: قوله:","","",["مدارج السالكين (٤/ 1157)."],[345],0],[1175,"q","ابن القيم","","« ومن فوائد الذكر؛ أنه قوت القلب والروح, فإذا فقده العبد صار بمنزلة الجسم إذا حيل بينه وبين قوته. قال: وحضرت شيخ الاسلام ابن تيمية مرة صلى الفجر ثم جلس يذكر الله تعالى إلى قريب من انتصاف النهار, ثم التفت إلي وقال: هذه غدوتي, ولو لم أتغد الغداء سقطت قوتي, أو كلاماً قريباً من هذا. وقال لي مرة: لا أترك الذكر إلا بنية إجمام نفسي وإراحتها لأستعد بتلك الراحة لذكر آخر. أو كلاماً هذا معناه »","قال ابن القيم رحمه الله:","","",["الوابل الصيب (ص/ ٩٦)."],[346],0],[1176,"s","عبد الله بن عباس","","« شهادة أن لا إله إلا الله »","عن ابن عباس رضي الله عنهما, في قوله: الآية: الشعراء: 87-89 قال:","","",["تفسير ابن أبي حاتم (8/ 2783) [الشعراء: ٨٩]."],[347],0],[1177,"a","مجاهد","","« ليس فيه شكّ في الحقّ »","وعن مجاهد رحمه الله, في قوله: … قال:","","",["تفسير الطبري - جامع البيان (19/ 366) [الشعراء: ٨٩]."],[347],0],[1178,"a","عوف","","« قلت لمحمد بن سيرين: ما القلب السليم؟ قال: يعلم بأن الله حق, وأن الساعة قائمة, وأن الله يبعث من في القبور »","وعن عوف رحمه الله, قال:","","",["تفسير ابن أبي حاتم (8/ 2783) [الشعراء: ٨٩]."],[347],0],[1179,"a","ابن أبي الحواري","","« قلت لسفيان رحمه الله: بلغني في قول الله عز وجل: … الذي يلقي ربه وليس فيه أحد غيره. فبكى وقال: ما سمعتُ منذ ثلاثين سنة أحسن من هذا التفسير »","وقال ابن أبي الحواري رحمه الله:","","",["العقد الفريد (3/ 126)."],[347],0],[1180,"q","الطبري","","« والذي عَنيَ به من سلامة القلبِ في هذا الموضِعِ: هو سلامةُ القلب من الشكِّ في توحيد الله, والبعثِ بعد الممات »","وقال الطبري رحمه الله:","","",["تفسير الطبري - جامع البيان (17/ 595) [الشعراء: ٨٩]."],[347],0],[1181,"q","ابن العربي","","« والذي عندي أنه لا يكون القلبُ سليمًا إذا كان حقودًا حسودًا, مُعجبًا مُتكبرًا, وقد شرط النبي ﷺ, في الإيمان أن يحب لأخيه ما يحب لنفسه. والله الموفق برحمته »","وقال ابن العربي عز وجل:","","",["أحكام القرآن لابن العربي (3/ 459) [الشعراء: ٨٩]."],[347],0],[1182,"q","الرازي","","« أما السليم ففي ثلاثة أوجه: الأول: وهو الأصح, أنَّ المراد منه سلامة القلب عن الجهل والأخلاق الرذيلة, وذلك لأنه كما أن صحة البدن وسلامته عبارة عن حصول ما ينبغي من المزاج والتركيب والاتصال, ومرضه عبارة عن زوال أحد تلك الأمور فكذلك سلامة القلب عبارة عن حصول ما ينبغي له؛ وهو العلم والخلق الفاضل, ومرضه عبارة عن زوال أحدهما. فقوله: … أن يكون خاليًا عن العقائد الفاسدة والميل إلى شهوات الدنيا ولذاتها. فإن قيل: فظاهر هذه الآية يقتضي أنَّ من سلم قلبه كان ناجيًا وأنه لا حاجة فيه إلى سلامة اللسان واليد؟ جوابه: أن القلب مؤثر, واللسان والجوارح تبع, فلو كان القلب سليمًا لكانا سليمين لا محالة, وحيث لم يسلما ثبت عدم سلامة القلب. التأويل الثاني: أن السليم هو اللديغ من خشية الله تعالى. التأويل الثالث: أن السليم هو الذي سلم وأسلم وسالم واستسلم, والله أعلم »","وقال الرازي رحمه الله:","","",["تفسير الرازي - مفاتيح الغيب أو التفسير الكبير (24/ 517) [الشعراء: ٨٩]."],[347],0],[1183,"q","ابن القيم","","« القلب السليم هو الذي سلم من الشرك, والغِل, والحقد, والحسد, والشحّ, والكبر, وحب الدنيا والرياسة, فسلِمَ من كـلِّ آفة تُبعده من الله, وسلمَ من كلّ شبهة تُعارضُ خبَرَهُ, ومن كل شهوةٍ تعارض أمره, وسلم من كل إرادة تُـزاحم مراده, وسلم من كل قاطع يقطعُ عن الله. فهذا القلبُ السليمُ في جنةٍ مُعَجَّلَةٍ في الدنيا, وفي جنةٍ في البرزخ, وفي الجنةِ يوم المعاد »","وقال ابن القيم رحمه الله:","","",["الداء والـدواء (ص/ 282)."],[347],0],[1184,"q","الشوكاني","","« واختُلف في معنى القَلبِ السَّليمِ؛ فقيل: السليمُ من الشرك, فأما الذُّنوبُ فليس يسلمُ منها أحد, قاله أكثر المفسرين. وقال سعيد بن المسيب: القلب السليمُ: الصحيحُ, وهو قلبُ المؤمن, لأن قلبَ الكافرِ والمنافقِ مريضٌ, وقيل: هو القلب الخالي عن البدعة المطمئن إلى السنة, وقيل: السالم من آفةِ المال, والبنين. وقال الضحاك: السليم: الخالص. وقال الجنيد: السليم في اللغة: اللديغ, فمعناه: أنه قلب كاللديغ من خوف الله تعالى. وهذا تحريف وتعكيسٌ لمعنى القرآن »","وقال الشوكاني رحمه الله:","","",["فتح القدير للشوكاني (4/ 124) [الشعراء: ٨٩]."],[347],0]]};
const KINDS = {h:"حديث مرفوع",s:"أثر صحابي",a:"أثر عن السلف",q:"قول عالم",n:"نقل",p:"شعر"};
const PATHS = DATA.paths;
const cards = DATA.cards.map(r => ({id:r[0],k:r[1],s:r[2],n:r[3],t:r[4],i:r[5],g:r[6],h:r[7],src:r[8],loc:r[9],rw:r[10]}));

// تطبيع عربي: يتجاهل التشكيل والتطويل ويوحّد الهمزات والتاء والألف
const DIAC = /[ً-ٰٟـۖ-ۭ]/g;
function norm(s){
  return (s||"").replace(DIAC,"").replace(/[إأآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
    .replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[^ء-ي0-9\s]/g," ").replace(/\s+/g," ").trim();
}
function gradeKey(g){ if(!g) return ""; if(g.startsWith("ضعيف")) return "daif"; if(g.startsWith("حسن")) return "hasan"; return "sahih"; }
cards.forEach(c => {
  c.gk = gradeKey(c.g);
  c.idx = norm([c.t, c.s, c.n, c.i, c.src.join(" ")].join(" "));
  c.ch = c.loc.length ? PATHS[c.loc[0]][0] || "" : "";
});

// رابط إبراز يسمح بالتشكيل بين الحروف
const VAR = {"ا":"[اإأآٱ]","ه":"[هة]","ي":"[يىئ]","و":"[وؤ]"};
function hlRegex(tokens){
  const parts = tokens.filter(t => t.length > 1).map(t =>
    [...t].map(ch => (VAR[ch] || ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")) + "[\\u064B-\\u065F\\u0670\\u0640]*").join(""));
  return parts.length ? new RegExp("(" + parts.join("|") + ")", "g") : null;
}
function esc(s){ return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function hl(s, re){ const e = esc(s); return re ? e.replace(re, "<mark>$1</mark>") : e; }

// حالة
const $ = id => document.getElementById(id);
const state = {q:"", kind:"", grade:"", speaker:"", chapter:"", shown:30, open:new Set()};
let flagged = new Set();
try { flagged = new Set(JSON.parse(localStorage.getItem("flags") || "[]")); } catch(e) {}
function saveFlags(){ try { localStorage.setItem("flags", JSON.stringify([...flagged])); } catch(e) {} updateFlags(); }

// بناء الفلاتر
const kc = {}; cards.forEach(c => kc[c.k] = (kc[c.k]||0) + 1);
$("kinds").innerHTML = `<button class="chip" data-k="" aria-pressed="true">الكل<span class="n">${cards.length}</span></button>` +
  Object.keys(KINDS).filter(k => kc[k]).map(k => `<button class="chip" data-k="${k}" aria-pressed="false">${KINDS[k]}<span class="n">${kc[k]}</span></button>`).join("");
const sc = {}; cards.forEach(c => { if(c.s && c.k !== "h") sc[c.s] = (sc[c.s]||0) + 1; });
$("speaker").innerHTML += Object.entries(sc).filter(([,n]) => n >= 2).sort((a,b) => b[1]-a[1])
  .map(([s,n]) => `<option value="${esc(s)}">${esc(s)} (${n})</option>`).join("");
const chs = [...new Set(cards.map(c => c.ch).filter(Boolean))];
$("chapter").innerHTML += chs.map(c => `<option value="${esc(c)}">${esc(c.split(":")[0])}: ${esc((c.split(":")[1]||"").trim())}</option>`).join("");

function filtered(){
  const toks = norm(state.q).split(" ").filter(Boolean);
  return cards.filter(c =>
    (!state.kind || c.k === state.kind) &&
    (!state.grade || c.gk === state.grade) &&
    (!state.speaker || c.s === state.speaker) &&
    (!state.chapter || c.ch === state.chapter) &&
    toks.every(t => c.idx.includes(t)));
}

function cardHTML(c, re){
  const open = state.open.has(c.id);
  const who = c.k === "h" ? (c.n ? `عن ${esc(c.n)}` : "") : esc(c.s);
  const badge = c.g ? `<span class="badge b-${c.gk}">${esc(c.g)}</span>` : "";
  const rw = c.rw ? `<span class="badge b-note">بصيغة «رُوي»</span>` : "";
  const locs = c.loc.map(i => { const p = PATHS[i]; return `<li>${esc(p[p.length-1] || "")}<br><span>${esc(p.slice(0,-1).join(" ← "))}</span></li>`; }).join("");
  return `<article class="card ${c.gk ? "g-"+c.gk : ""}" data-id="${c.id}">
    <div class="head"><span class="kind">${KINDS[c.k]}</span>${who ? `<span class="who">· ${hl(who.replace(/&amp;/g,"&"), re)}</span>` : ""}${badge}${rw}</div>
    <p class="text ${open ? "" : "clip"}">${hl(c.t, re)}</p>
    ${open ? `<div class="more">
      ${c.i ? `<div><h4>السياق في الكتاب</h4><p class="intro">${hl(c.i, re)}</p></div>` : ""}
      <div><h4>التخريج والمصدر</h4>${c.src.map(s => `<p>${hl(s, re)}</p>`).join("")}</div>
      <div><h4>${c.loc.length > 1 ? `ورد في ${c.loc.length} مواضع` : "الموضع في الكتاب"}</h4><ul class="loc">${locs}</ul></div>
    </div>` : ""}
    <div class="actions">
      <button class="btn" data-act="toggle">${open ? "إخفاء التفاصيل" : "التخريج والموضع"}</button>
      <button class="btn primary" data-act="copy">نسخ مع التخريج</button>
      <button class="btn ${flagged.has(c.id) ? "flagged" : ""}" data-act="flag" aria-pressed="${flagged.has(c.id)}">${flagged.has(c.id) ? "مُعلَّمة للمراجعة" : "فيها خطأ"}</button>
    </div>
  </article>`;
}

let current = [];
function render(){
  current = filtered();
  const re = hlRegex(norm(state.q).split(" ").filter(Boolean));
  $("count").textContent = current.length === cards.length ? `${cards.length} نصًّا` : `${current.length} نتيجة من ${cards.length}`;
  $("list").innerHTML = current.length ? current.slice(0, state.shown).map(c => cardHTML(c, re)).join("")
    : `<div class="empty">لا نتائج. جرّب كلمة أقصر أو أزل أحد الفلاتر.</div>`;
  $("loadmore").hidden = current.length <= state.shown;
  $("clear").hidden = !state.q;
}
function updateFlags(){ const b = $("flags"); b.hidden = !flagged.size; b.textContent = `نسخ أرقام المُعلَّمة (${flagged.size})`; }

let tmr;
$("q").addEventListener("input", e => { clearTimeout(tmr); tmr = setTimeout(() => { state.q = e.target.value; state.shown = 30; render(); }, 120); });
$("clear").onclick = () => { $("q").value = ""; state.q = ""; render(); $("q").focus(); };
$("kinds").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  state.kind = b.dataset.k; state.shown = 30;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
["grade","speaker","chapter"].forEach(id => $(id).addEventListener("change", e => { state[id] = e.target.value; state.shown = 30; render(); }));
$("reset").onclick = () => { Object.assign(state, {q:"",kind:"",grade:"",speaker:"",chapter:"",shown:30}); $("q").value=""; ["grade","speaker","chapter"].forEach(id => $(id).value = ""); document.querySelectorAll(".chip").forEach((x,i) => x.setAttribute("aria-pressed", i===0)); render(); };
$("loadmore").onclick = () => { state.shown += 30; render(); };

function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
async function copy(txt){
  try { await navigator.clipboard.writeText(txt); toast("نُسخ"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("نُسخ"); }catch(_){ toast("تعذّر النسخ، حدّد النص يدويًّا"); } ta.remove(); }
}
function citation(c){
  const lead = c.k === "h" ? (c.n ? `عن ${c.n}، عن النبي ﷺ:` : "قال النبي ﷺ:") : (c.s ? `قال ${c.s}:` : "");
  return `${lead} ${c.t}\n\n(${c.src.join(" ")})`.trim();
}
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const id = +b.closest(".card").dataset.id; const c = cards.find(x => x.id === id);
  if(b.dataset.act === "toggle"){ state.open.has(id) ? state.open.delete(id) : state.open.add(id); render(); }
  if(b.dataset.act === "copy") copy(citation(c));
  if(b.dataset.act === "flag"){ flagged.has(id) ? flagged.delete(id) : flagged.add(id); saveFlags(); render(); }
});
$("flags").onclick = () => copy("بطاقات فيها خطأ: " + [...flagged].sort((a,b)=>a-b).join("، "));
updateFlags();
render();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))}</script>
</body></html>
