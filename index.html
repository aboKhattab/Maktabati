تحنُّ متى عليها يسجدونا قال: فجعلتُ أردِّدُها عليه, فبكى, حتى قلت: الآن تخرج نفسُه »","وعن أبي جعفر الضرير, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٢٢)."],[297],0],[1016,"a","أبو عمرو بن مطر","","« حضرتُ مجلس أبي عثمان الحيري الزاهد, فخرج, وقعد على موضعه الذي كان يقعد؛ للتذكير, فسكت حتى طال سكوته فناداه رجل كان يُعرف بأبي العباس: ترى أن تقول في سكوتك شيئًا فأنشأ يقول: وغيرُ تقيٍّ يأمرُ الناسَ بالتُّقى … طبيبٌ يُداويْ, والطبيبُ مريضُ قال: فارتفعت الأصوات بالبكاء والضجيج »","وقال أبو عمرو بنُ مطر رحمه الله:","","",["شعب الإيمان للبيهقي (5/465) رقم (7303)."],[297],0],[1017,"a","ابن السماك","","« وعظ عمرُ بنُ ذر فجعل فتىً من بني تميمٍ يصرُخُ ويتغيّرُ لونُه, ولا أرى له دمعةً تسيلُ, ثم سقط مغشِيًّا عليه, ثم رأيتُه في مجلسِ ابنِ ذرٍّ يبكي حتى أقولَ: الآن تخرُجُ نفْسُه, فذكرت ذلك لعمر بن ذر فقال: ابن أخي! إنَّ العقلَ إذا طاش فُقِدتِ الحُرقةُ, وقَلُصَتِ الدَّمعةُ, وإذا ثبَتَ العقلُ فهِمَ صاحبُهُ الموعظةَ فأحرَقَتْه واللهِ, وحزِنَ وبكى »","وعن ابن السماك رحمه الله, قال:","","",["الهم والحزن لابن أبي الدنيا (ص/ 72) رقم (102) وحلية الأولياء (5/ 112)."],[297],0],[1018,"a","بكر بن عبد الله المزني","","« أن أبا موسى الأشعري رضي الله عنه, خطب الناس بالبصرة, فذكر في خطبته النار, فبكى حتى سقطت دموعه على المنبر, قال: وبكى الناس يومئذ بكاءً شديداً »","عن بكر بن عبد الله المزني:","","",["رواه ابن أبي الدنيا في الرقة والبكاء رقم (١٠٣)."],[298],0],[1019,"s","عبد الله بن عمرو","","« لو أن رجلًا, من أهل النار أخرج إلى الدنيا, لمات أهل الدنيا من وحشة منظره, ومن ريحه, قال: ثم بكى عبد الله بكاءً شديداً »","وعن أبي قَبِيل حُيي بن هانئ المَعَافري, عن عبد الله بن عمرو, قال:","","",["المصدر السابق (١٠٤)."],[298],0],[1020,"a","عبد الله بن رجاء الغداني","","« حدثني أبو زيد, شيخ بمكة قال: رأيت عمر بن عبد العزيز يبكي على المنبر, ما يستطيع أن يتكلم من شدة البكاء »","وعن عبد الله بن رجاء الغُدَّاني, قال:","","",["سيرة عمر بن عبد العزيز لابن الجوزي (صـ 158)."],[298],0],[1021,"a","الجارود","","« هِيهْ, فقد أكثرتِ وأبكيتِ أميرَ المؤمنين. فقال له عمر رضي الله عنه وعنها: أَوَما تعرفُ هذه؟ هذه خولةُ بنتُ حكيم امرأةُ عبادة بن الصامت رضي الله عنه, التي سمع الله قولها من سمائه, فعُمرُ واللهِ أجدرُ أن يَسمعَ لها »","فقال الجارود:","","",["تاريخ المدينة لابن شبة (2/ 394) ومختصر منهاج القاصدين (ص/ 171)."],[299],0],[1022,"s","الوليد أبو عثمان","","« فأخبرني عقبة بن مسلم أن شُفيًّا, هو الذي دخل على معاوية فأخبره بهذا. قال أبو عثمان: وحدثني العلاء بن أبي حكيم, أنه كان سيّافًا لمعاوية فدخل عليه رجل, فأخبره بهذا عن أبي هريرة, فقال معاوية: قد فُعل بهؤلاء هذا فكيف بمن بقي من الناس؟ ثم بكى معاوية بكاءً شديدًا حتى ظننا أنه هالك, وقلنا قد جاءنا هذا الرجل بشر, ثم أفاق معاوية ومسح عن وجهه, وقال: صدق الله ورسوله: الآية: هود: 15-16 »","وقال الوليد أبو عثمان:","صحيح","صححه الألباني في صحيح الموارد (2119) وأصله في مسلم (1905)",["رواه الترمذي (2382) وصححه الألباني في صحيح الموارد (2119) وأصله في مسلم (1905)."],[300],0],[1023,"a","رياح بن عبيدة الباهلي","","« كنت قاعداً عند عمر بن عبد العزيز, فجاء أعرابي فقال: يا أمير المؤمنين, جاءت بي الحاجة, وانتهيتُ الغايةَ, واللهُ سائلك عني يوم القيامة, قال: ويحك! أَعِدْ عليَّ, فأعاد عليه, فنكَّس عمر رأسه, وأرسل دموعه, حتى ابتلَّت الأرض! ثم رفع رأسه فقال: ويحك! كم أنتم؟ قال: أنا وثلاث بنات لي, ففرض له على ثلاثمائة, وفرض لبناته على مائة, وأعطاه مائة درهم, وقال له: هذه المائة أعطيتك من مالي, ليس من أموال المسلمين, اذهب فاستنفقها حتى تخرج أعطيات المسلمين فتأخذ معهم »","عن رياح بن عبيدة الباهلي, قال:","","",["الرقة والبكاء لابن أبي الدنيا (ص/ 112) رقم (124)."],[301],0],[1024,"a","عبيدة بن حسان السنجاري","","« يا أمير المؤمنين! اذكر بمقامي هذا مقامًا لا يَشْغَلُ اللهَ عنك فيه كثرةُ من يُخاصمُ من الخلائق يوم تلقاه بلا ثقةٍ من العمل, ولا براءةٍ من الذنب. فبكى عمر بكاءً شديدًا, ثم قال: ويحك! اردُدْ عليَّ كلامك هذا, فجعل يردِّدُه, وعمر يبكي وينتحب, ثم قال: حاجتك؟ قال: إنَّ عامل أذربيجان عدا علي, فأخذ مني اثني عشر ألفَ درهمٍ, فجعلها في بيت مال المسلمين, فقال عمر: اكتبوا له الساعة إلى عاملها حتى يَرُدَّ عليه »","وعن عبيدةَ بنِ حسان السِّنجاري, أن رجلًا من أهل أَذْرِبيجان أتى عمرَ بن عبد العزيز, فقام بين يديه فقال:","","",["الرقة والبكاء لابن أبي الدنيا (١٢٥) والمجالسة وجواهر العلم (8/ 314) باختصار."],[301],0],[1025,"a","زيد بن العباس","","« لما حَجَّ هارونُ الرشيدُ قيل له: يا أمير المؤمنين, قد حج شَيْبَانُ العام, قال: اطلبوه لي, فطلبوه فأتوه به, فقال له: يا شيبانُ عِظني, قال: يا أمير المؤمنين, أنا رجلٌ ألْكَنُ لا أُفصحُ بالعربيةِ, فجِئْني بمن يفهمُ كلامي حتى أُكلِّمَهُ. فأُتي برجل يفهم كلامه, فقال له بالنبطية: قل له: يا أمير المؤمنين, إنَّ الذي يُخوِّفُك قبل أن تبلغَ المأمن, أنصح لك من الذي يُؤَمِّنك قبل أن تبلغ الخوف. فقال: قل له: أي شيء تفسير هذا؟ قال: قل له: الذي يقول لك: يا هذا, اتقِّ الله عزوجل فإنك رجل من هذه الأمة, استرعاك الله عليها, وقلدك أمورها وأنت مسئولٌ عنها, فاعدِلْ في الرعيَّةِ, واقسم بالسويّة, وانفر في السَّرِيَّةِ, واتقِّ الله في نفسك؛ هذا الذي يخوفك, فإذا بلغت المأمنَ أمنت, هو أنصح لك ممن يقول: أنتم أهلُ بيتٍ مغفورٌ لكم, وأنتم قرابة نبيّكم وفي شفاعته, فلا يزال يؤمِّنك حتى إذا بلغت الخوف عطبت, قال: فبكى هارون حتى رحمه من حوله, ثم قال: زدني, قال: حسبُك! ثم خرج »","عن زيد بن العباس رحمه الله, قال:","","",["صفة الصفوة (2/ 491) ومختصر منهاج القاصدين (ص/ ١٧٩)."],[302],0],[1026,"h","النبي ﷺ","عطية بن بسر","«أَيُّمَا وَالٍ بَاتَ غَاشًّا لِرَعِيَّتِهِ حَرَّمَ اللهُ عَلَيْهِ الْجَنَّةَ»","قلت: أن تسمعه ولا تعمل به, قال: فصاح بي الربيع, وأهوى بيده إلى السيف, فانتهره المنصور وقال: هذا مجلس مثوبة لا عقوبة, فطابت نفسي, وانبسطتُ في الكلام. يا أمير المؤمنين, حدثني مكحول عن عطية بن بسر قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح الترغيب (2207)",["أخرجه الطبراني، وصححه الألباني في صحيح الترغيب (2207)."],[303],0],[1027,"h","النبي ﷺ","","«لَقَابُ قَوْسِ أَحَدِكُمْ فِي الْجَنَّةِ خَيْرٌ مِنَ الدُّنْيَا وَمَا فِيهَا»","يا أمير المؤمنين, رضِّ نفسك لنفسك, وخذْ لها الأمان من ربك, وارغب في جنة عرضها السماوات والأرض, التي يقول فيها رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["أخرجه البخاري (2796) ومسلم (1880) من حديث أنس رضي الله عنه."],[303],0],[1028,"h","النبي ﷺ","جابر","«مَا مِنْ وَالٍ يَلِي مِنْ أُمُورِ النَّاسِ شَيْئًا إِلَّا أُتِيَ بِهِ يَوْمَ الْقِيَامَةِ, فَيُوقَفُ عَلَى جِسْرٍ مِنْ نَارٍ, فَيَنْتَفِضُ بِهِ الْجِسْرُ انْتِفَاضًا يُزِيلُ كُلَّ عُضْوٍ مِنْهُ عَنْ مَوْضِعِهِ, ثُمَّ يُعَادُ فَيحَاسَبُ, فَإِنْ كَانَ مُحْسِنًا نَجَا بِإِحْسَانِهِ, وَإِنْ كَانَ مُسِيئًا انْخَرَقَ بِهِ ذَلِكَ الْجِسْرُ, فَهَوَى بِهِ فِي النَّارِ سَبْعِينَ خَرِيفًا»","بن الخطاب استعمل من الأنصار رجلًا على الصدقة, فرآه بعد أيام مقيمًا, فقال له: ما منعك من الخروج إلى عملك؟ أما علمتَ أنَّ لك مثلَ أجرِ المجاهدين في سبيل الله؟ قال: لا, قال عمر: وكيف ذاك؟ قال: لأنه بلغني أن رسول الله ﷺ قال:","ضعيف","ضعفه الألباني في السلسلة الضعيفة (2269)",["أخرجه البيهقي في شعب الإيمان (7383) وضعفه الألباني في السلسلة الضعيفة (2269)."],[303],0],[1029,"a","الأوزاعي","","« بعث إليَّ أبو جعفر أميرُ المؤمنين وأنا بالساحل, فأتيته فلما وصلتُ إليه, وسلمت عليه بالخلافة, رد عليَّ واستجلسني, ثم, قال: ما الذي أبطأ بك عنا يا أوزاعي؟ قلت: وما الذي تريد يا أمير المؤمنين؟ قال: أريد الأخذ عنكم, والاقتباس منكم, قلت: يا أمير المؤمنين! انظر, ولا تجهل شيئًا مما أقول لك, قال: وكيف أجهله وأنا أسألك عنه, وقد وجهت فيه إليك وأقدمتك له؟ قلت: أن تسمعه ولا تعمل به, قال: فصاح بي الربيع, وأهوى بيده إلى السيف, فانتهره المنصور وقال: هذا مجلس مثوبة لا عقوبة, فطابت نفسي, وانبسطتُ في الكلام. يا أمير المؤمنين, حدثني مكحول عن عطية بن بسر قال: قال رسول الله ﷺ: «أَيُّمَا وَالٍ بَاتَ غَاشًّا لِرَعِيَّتِهِ حَرَّمَ اللهُ عَلَيْهِ الْجَنَّةَ». يا أمير المؤمنين, قد كنتَ في شغل شاغلٍ من خاصَّة نفسك عن عامة الناس الذين أصبحت تملكهم أحمرهم وأسودهم ومسلمهم وكافرهم, فكل له عليك نصيبه من العدل, فكيف إذا اتبعك منهم وراءهم فئام ليس منهم أحد إلا وهو يشكو بليةً أدخلتها عليه أو ظلامة سقتها إليه؟ يا أمير المؤمنين, حدثني مكحول عن زياد بن جارية, عن حبيب بن مسلمة أن رسول الله ﷺ دعا إلى القصاص من نفسه في خدشةٍ خدَش أعرابيًا لم يتعمَّدْها, فأتاه جبريل, قال: يا محمد, إن الله لم يبعثك جبَّارًا ولا مستكبرًا, فدعا النبيُّ ﷺ الأعرابيَّ فقال: اقتص مني فقال الأعرابي: قد أحللتك بأبي أنت وأمي ما كنتُ لأفعل ذلك أبدًا ولو أتت على نفسي, فدعا له بخير. يا أمير المؤمنين, رضِّ نفسك لنفسك, وخذْ لها الأمان من ربك, وارغب في جنة عرضها السماوات والأرض, التي يقول فيها رسول الله ﷺ: «لَقَابُ قَوْسِ أَحَدِكُمْ فِي الْجَنَّةِ خَيْرٌ مِنَ الدُّنْيَا وَمَا فِيهَا». يا أمير المؤمنين, إن المُلك لو بقي لِمَن قبلك لم يصِلْ إليك, وكذلك لا يبقى لك كما لم يبق لغيرك. يا أمير المؤمنين, تدري ما جاء في تأويل هذه الآية عن جدك: الآية: الكهف: 49 قال: الصغيرة: التبسم, والكبيرة: الضحك, فكيف بما عملته الأيدي وحدَّثته الألسُن. يا أمير المؤمنين, بلغني عن عمر بن الخطاب رضي الله تعالى عنه أنه قال: لو ماتت سخلة على شاطئ الفرات ضيعة لخفت أن أُسألَ عنها, فكيف بمن حُرم عدلَك وهو على بساطك؟ يا أمير المؤمنين, أتدري ما جاء في تأويل هذه الآية عن جدك: الآية: ص: 26, قال: يا داود, إذا قعد الخصمان بين يديك فكان لك في أحدهما هوى فلا تُمَنِّينَّ في نفسك أن يكون له الحق فيَفلَجُ على صاحبه فأمحوك من نبوتي ثم لا تكون خليفتي ولا كرامة, يا داود إنما جعلت رسلي إلى عبادي ِرعاءً كِرعاءِ الإبل؛ لِعلمِهم بالرِّعاية ورفقِهم بالسياسة؛ لِيجْبُرُوا الكسير ويَدُلُّوا الهزيلَ على الكلأِ والماءِ. يا أميرَ المؤمنين, إنك قد بُليتَ بأمرٍ عظيمٍ لو عُرض على السماوات والأرض والجبالِ لأبينَ أن يَحمِلْنَه وأشفقْنَ منه. يا أمير المؤمنين, حدثني يزيد بن مزيد, عن جابر, عن عبد الرحمن بن أبي عمرة الأنصاري: أن عمر بن الخطاب استعمل من الأنصار رجلًا على الصدقة, فرآه بعد أيام مقيمًا, فقال له: ما منعك من الخروج إلى عملك؟ أما علمتَ أنَّ لك مثلَ أجرِ المجاهدين في سبيل الله؟ قال: لا, قال عمر: وكيف ذاك؟ قال: لأنه بلغني أن رسول الله ﷺ قال: «مَا مِنْ وَالٍ يَلِي مِنْ أُمُورِ النَّاسِ شَيْئًا إِلَّا أُتِيَ بِهِ يَوْمَ الْقِيَامَةِ, فَيُوقَفُ عَلَى جِسْرٍ مِنْ نَارٍ, فَيَنْتَفِضُ بِهِ الْجِسْرُ انْتِفَاضًا يُزِيلُ كُلَّ عُضْوٍ مِنْهُ عَنْ مَوْضِعِهِ, ثُمَّ يُعَادُ فَيحَاسَبُ, فَإِنْ كَانَ مُحْسِنًا نَجَا بِإِحْسَانِهِ, وَإِنْ كَانَ مُسِيئًا انْخَرَقَ بِهِ ذَلِكَ الْجِسْرُ, فَهَوَى بِهِ فِي النَّارِ سَبْعِينَ خَرِيفًا», فقال له عمر: ممن سمعت هذا؟ قال: من أبي ذر وسلمان, فأرسل إليهما عمر فسألهما فقالا: نعم, سمعناه من رسول الله ﷺ. فقال عمر: واعمراه من يتولاها بما فيها, فقال أبو ذر: من سَلَتَ الله أنفه, وألصق خده بالأرض. فأخذ أبو جعفر المنديل, فوضعه على وجهه, فبكى, وانتحب حتى أبكاني! فقلت: يا أمير المؤمنين, قد سأل جدك العباس النبي ﷺ إمارة على مكة والطائف فقال له: «يَا عَبَّاسُ, يَا عَمَّ النَّبِيِّ, نَفْسٌ تُحْيِيهَا خَيْرٌ مِنْ إِمَارَةٍ لَا تُحْصِيهَا», هي نصيحةٌ منه لعمه, وشفقةٌ منه عليه؛ لأنه لا يغني عنه من الله شيئًا, أوحى الله تعالى إليه: الآية: الشعراء: 214, فقال: «يَا عَبَّاسُ, يَا صَفِيَّةُ عَمَّةَ النَّبِيِّ, إِنِّي لَسْتُ أُغْنِي عَنْكُمْ مِنَ اللهِ شَيْئًا, إِلَّا لِي عَمَلِي وَلَكُمْ عَمَلُكُمْ». وقد قال عمر رضي الله تعالى عنه: لا يقيم أمر الناس إلا حصيفُ العقل أريبُ العُقدةِ, لا يُطَّلعُ منه على عَورةٍ, ولا يحنو على حَويَّةٍ, ولا تأخذه في الله لومةُ لائم. يا أمير المؤمنين, إنَّ أشدَّ الشدةِ القيامُ لله بحقه, وإن أكرمَ الكرمِ عند الله التقوى, إنه من طلب العزَّ بطاعة الله رفعه الله, ومن طلبه بمعصية الله أذله الله ووضعه, هذه نصيحتي, والسلام عليك. ثم نهضت, فقال لي: إلى أين؟ فقلت: إلى البلد والوطن بإذن أمير المؤمنين - إن شاء الله -, فقال: قد أذنتُ, وشكرتُ لك نصيحتك, وقبلتها بقبولٍ, والله الموفِّقُ للخير والمُعينُ عليه, وبه أستعين, وعليه أتوكل, وهو حسبي ونعم الوكيل, فلا تُخَلِّني من مُطالعتِك إياي بمثلِها, فإنك المقبولُ غيرُ المُتَّهمِ في النصيحة. قلت: أفعل - إن شاء الله -, قال محمد بن مصعب فأَمَرَ له بمال يستعينُ به على خروجه فلم يَقبلْه, وقال: أنا في غنى عنه, وما كنت لأَبيعَ نصيحتي بِعَرّضٍ من الدنيا كلِّها, وعرف المنصورُ مذهبَه؛ فلم يجِدْ عليه في ردِّه »","عن الأوزاعي رحمه الله, قال:","","",["حلية الأولياء (٦/١٣٦) ومختصر منهاج القاصدين (ص/ ١٧٦) مع اختصار يسير لبعض الجُمل."],[303],0],[1030,"q","ابن قدامة","","« ما حاجتُك يا أبا محمد؟ وكان عنده أشرافُ الناس يتحدثون, فسكتوا, فذكَّره عطاءُ بأرزاق أهل الحرمين وعطيَّاتهم, فقال: نعم, يا غلام, اكتب لأهل المدينةِ وأهلِ مكةَ بعطاء أرزاقهم. ثم قال: يا أبا محمد, هل من حاجة غيرها؟ فقال: نعم, فذكَّره بأهل الحجاز, وأهل نجد, وأهل الثّغور, ففعل مثل ذلك, حتى ذكره بأهل الذمَّة أن لا يُكلَّفوا مالا يطيقون, فأجابه إلى ذلك, ثم قال له في آخر ذلك: هل من حاجة غيرها؟ قال: نعم, يا أمير المؤمنين, اتّق الله في نفسك, فإنك خُلقتَ وحدك, وتموتُ وحدك, وتُحشرُ وحدك, وتحاسبُ وحدك, لا واللهِ, ما معك ممن ترى أحدٌ. قال: فأكب هشام يبكي, وقام عطاءُ, فلما كان عند الباب إذا رجل قد تبعه بكيس ما ندرى ما فيه, أدراهمُ أم دنانير؟ وقال: إن أمير المؤمنين قد أمر لك بهذا, فقال: الآية: الشعراء: 109, ثم خرج, ولا والله, ما شرب عندهم حسوةَ ماءٍ فما فوقها »","دخل عطاءُ بنُ أبى رباح على هشام, فرحَّب به وقال:","","",["مختصر منهاج القاصدين (ص/ 174) وأخرجه بنحوه الخطيب في المتفق والمفترق (2/ 1062) رقم (654)."],[304],0],[1031,"n","الضحاك بن موسى","","عن الضحاك بن موسى رحمه الله, قال: « مرَّ سليمانُ بنُ عبد الملك بالمدينة وهو يريد مكة, فأقام بها أيامًا, فقال: هل بالمدينة أحدٌ أدرك أحدًا من أصحاب النبي ﷺ؟ فقالوا له: أبو حازم","","","",["هو سلمة بن دينار، توفي سنة 140هـ ، وترجمته في التهذيب (4/ 143)."],[305],0],[1032,"a","الضحاك بن موسى","","« مرَّ سليمانُ بنُ عبد الملك بالمدينة وهو يريد مكة, فأقام بها أيامًا, فقال: هل بالمدينة أحدٌ أدرك أحدًا من أصحاب النبي ﷺ؟ فقالوا له: أبو حازم, فأرسَلَ إليه, فلمَّا دخل عليه, قال له: يا أبا حازمٍ ما هذا الجفاءُ؟ قال أبو حازمٍ: يا أمير المؤمنين, وأي جفاء رأيت مني؟ قال: أتاني وجوه أهل المدينة ولم تأتني. قال: يا أمير المؤمنين, أُعيذُك بالله أن تقول ما لم يكُنْ, ما عرفتني قبل هذا اليوم, ولا أنا رأيتك, قال: فالتفت سليمان إلى محمد بن شهاب الزهري, فقال: أصاب الشيخ وأخطأتُ, قال سليمان: يا أبا حازم! ما لنا نكره الموت؟ قال: لأنكم أخربتم الآخرة, وعمَّرتم الدنيا, فكرهتم أن تنتقلوا من العمران إلى الخراب. قال: أصبت يا أبا حازم, فكيف القدومُ غدًا على الله؟ قال: أما المحسنُ, فكالغائب يَقْدَم على أهله, وأما المسيءُ, فكالآبق يَقْدَمُ على مولاه, فبكى سليمان وقال: ليت شعري ما لنا عند الله؟ قال: اعرِضْ عمَلَك على كتاب الله. قال: وأيُّ مكانٍ أَجِدُهُ؟ قال: في قوله تعالى: الآية: الانفطار: 13-14, قال سليمان: فأين رحمةُ الله يا أبا حازم؟ قال أبو حازمٍ: رحمةُ الله قريبٌ من المحسنين. قال له سليمان: يا أبا حازم, فأيُّ عباد الله أكرم؟ قال: أُولو المروءة والنُّهى. قال له سليمان: يا أبا حازم! فأيُّ الأعمال أفضل؟ قال أبو حازم: أداءُ الفرائض مع اجتناب المحارم, قال سليمان: فأيُّ الدعاءِ أسمعُ؟ قال أبو حازم: دعاءُ المُحسَنِ إليه للمُحسِن. قال: فأي الصدقة أفضل؟ قال: للسائل البائس, وجُهْدُ المُقِلِّ ليس فيها مّنٌّ ولا أذىً. قال: فأي القول أعدل؟ قال: قولُ الحق عند من تخافُهُ أو ترجوه, قال: فأي المؤمنين أَكْيَسُ؟ قال: رجلٌ عمِلَ بطاعة الله ودلَّ الناس عليها, قال: فأيُّ المؤمنين أحمقُ؟ قال: رجلٌ انْحَطَّ في هوى أخيه وهو ظالمٌ, فباعَ آخرتَه بدنيا غيره. قال له سليمان: أصبتَ, فما تقول فيما نحن فيه؟ قال: يا أمير المؤمنين, أو تعفيني؟ قال له سليمان: لا, ولكن نصيحة تلقيها إلي, قال: يا أمير المؤمنين, إن آباءك قهروا الناس بالسيف, وأخذوا هذا المُلك عُنوة على غير مشورةٍ من المسلمين, ولا رضًا لهم حتى قتلوا منهم مَقتلةً عظيمة, فقد ارتحلوا عنها, فلو شعرتَ ما قالوه, وما قيل لهم؟ فقال له رجل من جلسائه: بئس ما قلت يا أبا حازم, قال أبو حازم: كذبت, إن الله أخذ ميثاق العلماء ليبيننه للناس ولا يكتمونه, قال له سليمان: فكيف لنا أن نصلح؟ قال: تدعون الصَّلَف, وتَمَسَّكون بالمُروءة, وتَقسِمون بالسَّويَّة, قال له سليمان: كيف لنا بالمأخذ به؟ قال أبو حازم: تأخذه من حِلِّهِ, وتضعه في أهله, قال له سليمان: هل لك يا أبا حازم أن تصحبَنا, فتُصيبَ منا ونُصيبَ منك؟ قال: أعوذ بالله, قال له سليمان: ولم ذاك؟ قال: أخشى أن أركن إليكم شيئًا قليلًا, فيُذيقَني اللهُ ضِعفَ الحياة, وضِعفَ الممات. قال له سليمان: ارفع إلينا حوائجك؟ قال: تُنْجِيني من النار, وتُدخِلَني الجنة, قال سليمان: ليس ذاك إليَّ. قال أبو حازم: فما لي إليك حاجةٌ غيرها, قال: فادعُ لي. قال أبو حازم: اللهم إن كان سليمانُ وليَّك, فيَسِّرْهُ لخيرِ الدنيا والآخرة, وإن كان عدُوَّك, فخُذْ بناصيته إلى ما تحبُّ وترضى. قال له سليمان: قطُّ. قال أبو حازم: قد أوجزتُ وأكثرتُ إن كنتَ من أهله, وإن لم تكنْ من أهله فما ينفعُني أن أرمي عن قوسٍ ليس لها وتَرٌ؟ قال له سليمان: أوصني, قال: سأوصيك وأوجز: عَظِّمْ ربَّك ونَزِّهْهُ, أنْ يراك حيثُ نهاك, أو يَفقِدَك حيثُ أمرك. فلما خرج من عنده, بعث إليه بمائة دينار, وكتب إليه: أنْ أنفِقْها ولك عندي مثلُها كثيرٌ, قال: فردَّها عليه, وكتب إليه: يا أمير المؤمنين, أُعيذك بالله أن يكون سؤالُك إيايَ هَزْلًا, أو ردي عليك بَذْلًا, وما أرضاها لك, فكيف أرضاها لنفسي؟ »","عن الضحاك بن موسى رحمه الله, قال:","","",["سنن الدارمي (1/ 499) رقم (673) واللفظ له. والمجالسة للدينوري (8/ 149) رقم (3456)، وحلية الأولياء (3/ 234)."],[305],0],[1033,"a","علقمة بن مرثد","","« لما وليَ عمرُ بنُ هُبيرةَ العراقَ أرسل إلى الحسنِ وإلى الشعبيِّ, فأمر لهما ببيت, وكانا فيه شهرًا أو نحوه, ثم إنَّ الخصيَّ غدا عليهما ذاتَ يومٍ فقال: إنَّ الأمير داخلٌ عليكما, فجاء عمرُ يتوكأُ على عصًا له, فسلَّم ثم جلس معظِّمًا لهما, فقال: إن أمير المؤمنين يزيدَ بنَ عبد الملك يَنْفُذُ كُتُبًا أعرفُ أنَّ في إنفاذِها الهَلَكةَ, فإن أطعتُه عصيتُ الله, وإن عصيتُه أطعتُ الله عز وجل, فهل تَرَيَا لي في متابعتي إياه فَرَجًا؟ فقال الحسنُ: يا أبا عمروٍ! أجِبِ الأميرَ, فتكلم الشعبيُّ فانحطَّ في حبلِ ابنِ هُبيرة, فقال: ما تقول أنت يا أبا سعيد؟ فقال: أيُّها الأمير, قد قال الشعبيُّ ما قد سمعت, قال: ما تقوله أنت يا أبا سعيد؟ فقال: أقول: يا عمر بن هبيرة! يُوشِكُ أن ينزِل بك ملَكٌ من ملائكةِ الله تعالى فظٌّ غليظٌ لا يعصي اللهَ ما أمره, فيُخرِجُك من سَعَةِ قصرِك إلى ضيق قبرِك, يا عمرُ بنَ هبيرةَ, إن تتَّقِ الله يَعصِمْك مِن يزيدَ بنِ عبد الملك, ولا يَعصِمُك يزيدُ بنُ عبد الملك من الله عز وجل, يا عمرُ بنَ هبيرةَ, لا تأمَنْ أنْ ينظرَ اللهُ إليكَ على أقبحِ ما تعملُ في طاعة يزيدَ بنِ عبدِ الملك نظْرةَ مَقْتٍ فيغلقَ فيها باب المغفرة دونك, يا عمر بن هبيرة, لقد أدركتُ ناسًا من صدْرِ هذه الأمةِ كانوا والله على الدنيا وهي مُقبلةٌ أشدَّ إدبارًا من إقبالِكم عليها وهي مدبرةٌ, يا عمرُ بنَ هبيرةَ, إني أُخَوِّفُك مقامًا خوَّفكَهُ الله تعالى فقال: الآية: إبراهيم: 14, يا عمرُ بنَ هبيرةَ, إنْ تكُ مع الله تعالى في طاعته كفاك بائقةَ يزيدَ بنِ عبدِ الملك, وإنْ تكُ مع يزيدَ بنِ عبدِ الملك على معاصي اللهِ وكَلَكَ الله إليه. قال: فبكى عمرُ وقام بعَبْرِتِه, فلما كان من الغدِ أرسلَ إليهما بإذنِهِما وجوائِزهِما وكَثَّرَ منه ما لِلحسَنِ, وكان في جائزته للشعبيّ بعضُ الإقتار, فخرج الشعبيُّ إلى المسجدِ, فقال: يا أيها الناسُ! من استطاع منكم أن يُؤثِرَ الله تعالى على خلقِه فليفعلْ, فوالذي نفسي بيده ما علِم الحسنُ منه شيئًا فجهلتُه, ولكنْ أردتُ وجهَ ابنِ هُبيرةَ فأقصاني الله منه »","عن علقمة بن مَرْثَد, قال:","","",["حلية الأولياء (٢/١٤٩)، والتذكرة الحمدونية (1/ 162)، تهذيب الكمال في أسماء الرجال (6/ 113)."],[306],0],[1034,"a","عقيبة بن فضالة","","« دخلت على سعيد بن دَعْلَجٍ, وبين يديه رجل يُضربُ, فقلت: أصلح الله الأمير! أُكلِّمكَ بشيءٍ, ثم شأنُكَ وما تُريدُ. قال: فأَمر به, فأَمْسَك عنه, فقال: هاتِ كلامك, قال: فهبتُه, والله, ورهبتُ منه رهبةً شديدة. ثم قلت: إنه بلغني -أصلح الله الأمير- أنَّ العبادَ يومَ القيامة تُرْعَدُ فرائصهم في الموقف خوفاً من شرِّ ما يأتي به المنادي للحساب, وإن المتكبِّرين يومئذ لتحتَ أقدامِ الخلائق, قال: فبكى, فاشتدَّ بكاؤه, فأمر بالرجل, فأُطلق, قال: فكنتُ إذا دخلتُ عليه بعد ذلك قرَّبني, وأكرمني, قال: وقال لي يومًا وقد دخلتُ عليه: ويحك يا عُقيبة! ما ذكرتُ حديثك إلا أبكاني! قال: ثم بكى »","عن عُقَيبة بنِ فضالة, قال:","","",["الرقة والبكاء لابن أبي الدنيا (ص/ 110) رقم (١٢٠)، والأهوال لابن أبي الدنيا (ص98) رقم (132)."],[307],0],[1035,"a","شعيب بن صفوان","","« كان آخِر خطبة خطَب بها عمر بن عبد العزيز رحمه الله أنْ حمد الله, وأثنى عليه, ثم قال: أما بعد, فإنكم لم تُخلَقوا عبثًا, ولن تُتركوا سدًى, وإن لكم معادًا ينزِلُ الله للحكم فيكم والفصلِ بينكم, فخابَ وخسِرَ مَن خرَج مِن رحمة الله وحُرم جنة عرضها السموات والأرض, ألم تعلموا أنه لا يأمنُ غدًا إلا مَن حَذِرَ اليوم وخاف, وباع نافدًا بباقٍ, وقليلاً بكثيرٍ, وخوفًا بأمان, ألا ترون أنكم في أَسْلابِ الهالكين, وسنكونُ مِن بعدكم للباقين كذلك, حتى نُردَّ إلى خير الوارثين, ثم إنكم في كل يوم تُشيِّعون غاديًا ورائحًا إلى الله قد قضى نحبه حتى تُغيِّبوه في صدع مِن الأرض في بطن صدع غير موسَّد ولا ممهَّد, قد فارق الأحباب, وباشرَ التراب, وواجه الحساب؛ فهو مُرتَهَنٌ بعمَلِه, غنيٌّ عما ترك, فقيرٌ إلى ما قدَّم, فاتقوا الله قبلَ انقضاءِ مواقيتِه, ونزولِ الموتِ بكم, أما إني أقولُ هذا وما أعلمُ أنَّ عند أحدٍ من الذنوب أكثر مما عندي, فأستغفر الله وأتوب إليه. ثم رَفَع طرف ردائه على وجهِه فبكى, وأبكى مَن حوله »","عن شعيب بن صفوان, عن رجل مِن آل سعيد بن العاص قال:","","",["عيون الأخبار لابن قتيبة (2/ 268)، والمجالسة وجواهر العلم (3/ 343)."],[308],0],[1036,"a","عباد بن منصور","","« كونوا كرجل قال لابنه وهو يعظه: يا بني! أوصيك أنْ لا تصليَ صلاةً إلا ظننتَ أنك لا تصلي بعدها غيرها حتى تموت, وتعالَ بُنيَّ حتى نعملَ عملَ رجلين كأنهما قد أُوقِفا على النار ثم سألا الكَرَّة »","عن عباد بن منصور, قال: سمعت عدي بن أرطاة يخطبنا على منبر المدائن, فجعل يعظنا حتى بكى وأبكى, فقال:","","",["الرقة والبكاء لابن أبي الدنيا (ص/ 98) رقم (١٠٥)."],[309],0],[1037,"a","أبو بكر الهذلي","","« رأيت الحجَّاجَ يخطب على المنبر, فسمعته يقول: يا أيها الناس! إنكم غداً موقوفون بين يدي الله, ومسئولون, فليتَّقِ الله امرؤٌ, ولينظر ما يَعُدُّ لذلك الموقف؛ فإنه موقف يخسر فيه المبطلون, وتَذْهَلُ فيه العقول, ويرجعُ الأمرُ فيه إلى الله؛ لتُجْزى كلُّ نفس بما كسبت, إن الله سريع الحساب, بادروا آجالكم بأعمالكم, قبل أن تُخترموا دون آمالكم, ثم نَحَبَ وهو على المنبر, فرأيت دموعه تنحدر على لحيته »","عن أبي بكر الهذلي, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٠٩)."],[310],0],[1038,"a","أبو سعد البقال العبسي الكوفي","","« سمعتُ الحجاج يخطبُ يومًا وهو على المنبر, يقول: يا ابن آدم, بينما أنت في دارك وقرارك, إذ تَسَوَّرَ عليك عبدٌ يُدعى ملَكَ الموت, فوضع يده من جسدك موضعاً, فذَلَّ له, فاختلس روحك, فأخذه, فذهب به, ثم قام إليك أهلُكَ, فغسلوك وكفنوك, ثم حملوك إلى قبرك فدفنوك, ثم رجعوا, فاختصم فيك حبيباكَ: حبيبك من أهلك, وحبيبكَ من مالك! فاتق الله؛ فإنك اليوم تأْكُلُ, وغداً تُؤْكَلُ. قال أبو سعد: ثم نعر نعرةً - أي: صاح وصوَّتَ بخيشومه -, فظننتُ أنه الموتُ به, ثم نظرتُ إلى عينيه تسكبان, حتى نظرتُ إليه يتلقى دموعه بعمامته, ثم ينزل, فيَفتُل, قال: وصعد المنبر, فاستسقى, وقد استسقى قبلُ, قال: فلما كان في ذلك اليوم استسقى, فلا والله, ما نزل عن المنبر حتى مُطر, فاستقبل القِبلة وصلى, وسقط رداؤه, قال: وبكى لمَّا أُجيب, ثم أقبل بوجهه فقال: أيها الناس, إن العبد يسأل ربَّه الحاجة, وطلبُها إليه, ومِنْ أَمْرِ ربِّه أن يُجيبَه فيها, فيُطَوِّلُ الله عليه؛ ليكون إذا أعطاها إيَّاهُ أشدَّ لِشُكْرِه, وإني أقسمتُ عليكم بالله لَمَا صُمتم شكراً ثلاثاً, ثم خَرَج »","وعن أبي سعد البقال العبسي الكوفي, قال:","","",["الرقة والبكاء لابن أبي الدنيا (ص/ 103) رقم (١١١)."],[310],0],[1039,"h","النبي ﷺ","أنس بن مالك","«إنَّ العينَ تدمعُ, والقلبَ يحزنُ, ولا نقولُ إلا ما يَرضَى ربُّنا, وإنا بفراقك يا إبراهيمُ لمحزونون»","م فقبَّلَه وشمَّه, ثم دخلنا عليه بعد ذلك, وإبراهيم يجودُ بنفسه, فجعلت عينا رسول الله ﷺ تذرفان, فقال له عبدُ الرحمن بنُ عوف رضي الله عنه: وأنت يا رسول الله؟ فقال: يا ابنَ عوفٍ, إنها رحمةٌ, ثم أتبعها بأخرى, فقال رحمه الله:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (1303) ومسلم (2315)."],[256],0],[1040,"q","النووي","","« فدمعت عينا رسول الله ﷺ إلى آخره, فيه جواز البكاء على المريض والحزن, وأن ذلك لا يخالف الرضا بالقدر, بل هي رحمة جعلها الله في قلوب عباده, وإنما المذموم الندب والنياحة, والويل والثبور, ونحو ذلك من القول الباطل, ولهذا قال رحمه الله: «ولا نقول إلا ما يرضي ربنا» »","قال النووي رحمه الله: قوله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (15/ 75) حديث رقم (2315)."],[256],0],[1041,"h","النبي ﷺ","أسامة بن زيد","«هذه رحمةٌ جعلَها الله في قلوب عباده, وإنما يرحمُ اللهُ من عباده الرحماءَ»","ا, فقام ومعه سعدُ بنُ عبادة, ومعاذُ بنُ جبل, وأُبيُّ بنُ كعب, وزيدُ بنُ ثابت, ورجالٌ, فرُفعَ إلى رسول الله ﷺ الصبيُّ ونفْسُه تَتَقعقَعُ, قال: حسبته أنه قال: كأنها شَنٌّ, ففاضت عيناه, فقال سعد: يا رسول الله, ما هذا؟ فقال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (1284) ومسلم (923)."],[256],0],[1042,"q","النووي","","« قوله : ففاضت عيناه, فقال له سعد: ما هذا يا رسول الله؟ قال: «هذه رحمة جعلها الله في قلوب عباده, وإنما يرحم الله من عباده الرحماء», معناه: أن سعدًا ظنَّ أن جميع أنواع البكاء حرام, وأن دمع العين حرام, وظن أن النبي ﷺ نسي, فذكَّره, فأعلمه النبي ﷺ أن مجرد البكاء ودمع بعين ليس بحرام ولا مكروه, بل هو رحمة وفضيلة, وإنما المحرم النوح والندب والبكاء المقرون بهما أو بأحدهما, كما سيأتي في الأحاديث: «إن الله لا يعذب بدمع العين ولا بحزن القلب, ولكن يعذب بهذا أو يرحم», وأشار إلى لسانه, وفي الحديث الآخر: «العين تدمع والقلب يحزن, ولا نقول ما يسخط الله», وفي الحديث الآخر: «ما لم يكن لقع أو لقلقة» »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (6/ 225) حديث رقم (923)."],[256],0],[1043,"h","النبي ﷺ","عائشة أم المؤمنين","« حضَرَ رسولُ اللهِ ﷺ وأبو بَكرٍ وعُمَرُ سَعدَ بنَ مُعاذٍ, وهو في القُبَّةِ التي ضرَبَها عليه رسولُ اللهِ ﷺ في المسجدِ, قالتْ: فوالذي نفس محمد بيده إني لأعرفُ بكاءَ عمرَ من بكاءِ أبي بكر, وأنا في حجرتي, وكانوا كما قال الله عز وجل: الآية: الفتح: 29 »","وعن عائشة رضي الله عنها قالت:","حسن","حسنه الألباني في الصحيحة (1/ 145)",["رواه أحمد (25097) وابن أبي شيبة في المصنف (12129) وحسنه الألباني في الصحيحة (1/ 145)."],[256],0],[1044,"h","النبي ﷺ","","« لمَّا قُتِلَ زيدُ بنُ حارثةَ أبطأَ أسامةُ عنِ النَّبيِّ صلَّى اللَّهُ عليهِ وعلى آلِهِ وسلَّمَ, فلم يأتِهِ, ثمَّ جاءهُ بعدَ ذلكَ, فقامَ بينَ يديِ النَّبيِّ صلَّى اللَّهُ عليهِ وعلى آلِه وسلَّمَ, فدمَعتْ عيناهُ, فبكى رسولُ اللَّهِ صلَّى اللَّهُ عليهِ وعلى آلِه وسلَّمَ, فلمَّا نُزِفت عبرتُهُ, قالَ النَّبيُّ صلَّى اللَّهُ عليهِ وعلى آلِهِ وسلَّمَ: «لِمَ أبطأتَ عنَّا ثمَّ جئتَ تُحزِنُنا؟». قالَ: فلمَّا كانَ الغدُ جاءهُ فلمَّا رآهُ النَّبيُّ صلَّى اللَّهُ عليهِ وعلى آلِه وسلَّمَ مقبِلًا قالَ: «إنِّي للاقٍ منكَ اليومَ ما لقيتُ منكَ أمسِ» فلمَّا دنا دمعت عينُهُ, فبكى رسولُ اللَّهِ صلَّى اللَّهُ عليهِ وعلى آلِه وسلَّمَ »","وعنِ ابنِ مسعودٍ رضي الله عنه, قالَ:","صحيح","صححه الوادعي في الصحيح المسند مما ليس في الصحيحين (832)",["رواه عبد الرزق في المصنف (3/ 563) رقم (6904) وصححه الوادعي في الصحيح المسند مما ليس في الصحيحين (832)."],[256],0],[1045,"h","النبي ﷺ","عائشة أم المؤمنين","« رأيتُ رسولَ الله ﷺ يُقَبِّلُ عثمانَ بنَ مَظْعُونٍ وهو مَيِّتٌ, حتى رأيتُ الدُّموعَ تَسيلُ »","وعن عائشة رضي الله عنها, قالت:","صحيح","صححه الألباني في صحيح أبي داود (3163)",["رواه أبو داود (3163) والترمذي (989) وصححه الألباني في صحيح أبي داود (3163)."],[256],0],[1046,"q","المباركفوري","","« عثمانُ بنُ مظعون؛ هو أخ رضاعي لرسول الله ﷺ. قال صاحب المشكاة: هاجر الهجرتين وشهد بدرًا وكان حرَّم الخمر في الجاهلية, وهو أوَّل من مات من المهاجرين بالمدينة في شعبان على رأس ثلاثين شهرًا من الهجرة, ولما دفن قال: نعم السلف هو لنا. ودُفن بالبقيع, وكان عابدًا مجتهدًا من فضلاء الصحابة. والحديث يدُلُّ على أن تقبيل المسلم بعد الموت والبكاء عليه جائز »","قال المباركفوري رحمه الله:","","",["تحفة الأحوذي بشرح جامع الترمذي (4/ 55) حديث رقم (989)."],[256],0],[1047,"h","النبي ﷺ","عبد الله بن عمر","« اشتكى سعدُ بن عُبادةَ شكوَى له, فأتاه النبي ﷺ يعودُهُ مع عبدِ الرحمنِ بنِ عوفٍ, وسعدِ بنِ أبي وقاصٍ, وعبدِ الله بنِ مسعودٍ, رحمه الله, فلما دخل عليه, فوجده في غاشيةِ أهله, فقال: «قد قضى؟» قالوا: لا يا رسول الله, فبكى النبي ﷺ, فلما رأى القومُ بُكاءَ النبيِّ ﷺ بَكَوا, فقال: «ألا تسمعون, إن الله لا يُعذِّبُ بدمع العين, ولا بِحُزْنِ القلب, ولكن يُعذِّبُ بهذا وأشار إلى لسانه أو يَرحمُ, وإنَّ الميت يُعذَّبُ ببكاء أهلِه عليه», وكان عمرُ رضي الله عنه يَضرِبُ فيه بالعصا, ويرمي بالحجارةِ, ويحثي بالتراب »","وعن عبد الله بن عمر رضي الله عنهما قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (1304) ومسلم (924)."],[256],0],[1048,"q","النووي","","« قوله: «وجده في غشية», فيه قولان: أحدهما: مَنْ يَغْشَاهُ مِنْ أهلهِ. والثاني: ما يَغشاهُ من كَرْبِ الموت »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (6/ 226) حديث رقم (924)."],[256],0],[1049,"h","النبي ﷺ","جابر بن عبد الله","«تَبْكِيهِ, أَوْ لا تَبْكِيهِ, ما زالت الملائكةُ تُظِلُّه بأجنحتِها, حتى رفعتموه»","وعن جابر بن عبد الله رضي الله عنه, قال: « أُصيبَ أَبي يومَ أُحُدٍ, فجعلتُ أكشفُ الثوبَ عن وجهه وأَبكي, وجعلوا ينهونني, ورسول الله ﷺ لا ينهاني, قال: وجعلت فاطمةُ بنتُ عمرٍو تَبْكِيهِ, فقال رسولُ الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (1244) ومسلم (2471) واللفظ له."],[256],0],[1050,"h","النبي ﷺ","أبو عنبة الخولاني","«إنّ لله تَعَالَى آنِيَةً مِنْ أهْلِ الأَرْضِ, وآنِيَةُ رَبِّكُمْ قُلُوبُ عِبَادِهِ الصَّالِحِينَ, وأحَبُّها إلَيْهِ ألينها وأرقها»","عن أبي عنبة الخولاني رضي الله عنه, عن النبي ﷺ قال:","صحيح","قال العراقي في المغني عن حمل الأسفار (2/ 1691): وإسناده جيد",["رواه الطبراني في مسند الشاميين (2/ 19) رقم (840) وقال العراقي في المغني عن حمل الأسفار (2/ 1691): وإسناده جيد. وحسنه الألباني في صحيح الجامع (2163)."],[311],0],[1051,"q","ابن قدامة","","« اعلم أنَّ أشرفَ ما في الإنسان قلبُه, فإنه العالم بالله, العامل له, الساعي إليه, وإنما الجوارح أتباع وخدّام له يستخدمها القلب استخدامَ الملوك للعبيد, ومَنْ عرف قلبه عرف ربَّه, وأكثر الناس جاهلون بقلوبهم ونفوسهم, والله يحول بين المرء وقلبه, وحيلولته أن يمنعه من معرفته ومراقبته, فمعرفة القلب وصفاته أصلُ الدين, وأساسُ طريق السالكين »","وفي مختصر منهاج القاصدين:","","",["مختصر منهاج القاصدين (ص/ 193)."],[311],0],[1052,"q","ابن القيم","","« وسببُ الخِذلان عدمُ صلاحيةِ المحلّ وأهليته وقبوله للنعمة »","وقال ابن القيم:","","",["الفوائد (ص/ ٢٩٨)."],[311],0],[1053,"h","النبي ﷺ","أبو هريرة","«لا تحاسدوا ولا تناجشوا, ولا تباغضوا, ولا تدابروا, ولا يَبِعْ بعضُكم على بيع بعض, وكونوا عبادَ الله إخوانًا, المسلم أخو المسلم لا يَظلِمُه, ولا يخذُلُه, ولا يحقِرُه, التقوى هاهنا, - ويشير إلى صدره ثلاث مرات -, بحسب امرئ من الشر أن يحقر أخاه المسلم, كل المسلم على المسلم حرام دمه, وماله, وعرضه»","عن أبي هريرة رضي الله عنه, قال: قال رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (2564)."],[312],0],[1054,"q","النووي","","« معناه: أن الأعمال الظاهرة لا يحصل بها التقوى, وإنما تحصل بما يقع في القلب من عظمة الله تعالى وخشيته ومراقبته »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (16/ 121) حديث رقم (2564)."],[312],0],[1055,"h","النبي ﷺ","أبو هريرة","«إن الله لا ينظر إلى صوركم وأموالكم, ولكن ينظر إلى قلوبكم, وأعمالكم»","عن أبي هريرة رضي الله عنه, قال: قال رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (2564) وابن ماجه (4143)."],[312],0],[1056,"q","السندي","","« قوله: «ولكن إنما ينظر» أي: فأصلحوا أعمالكم وقلوبكم, ولا تجعلوا همتكم متعلقة بالبدن والمال, ولعل المراد بالنظر وعدمه: أنه لا يَقْبَلُ المرء ولا يُقَرِّبُه بِحُسْنِ الصورة وكثرةِ المال, ولا يَرُدُّه بضدِّ ذلك, وإنما يُقبله بِحسنِ العمل وخلوصِ القلب, ويرده بضد ذلك, وإلا فما شيءٌ لا يغيب من نظره تعالى, والله أعلم »","قال السندي رحمه الله:","","",["حاشية السندي على ابن ماجه (2/ 536) حديث رقم (4143)."],[312],0],[1057,"q","ابن القيم","","« والأعضاء تابعة للقلب؛ تصلح بصلاحه, وتفسد بفساده, فإذا لم يكن قائمًا بعبوديته, فالأعضاء أولى أنْ لا يعتد بعبوديتها, وإذا فسدت عبوديته بالغفلة والوسواس فأنى تصح عبودية رعيته وجنده؟ ومادتهم منه, وعن أمره يصدرون, وبه يأتمرون؟ »","وقال ابن القيم رحمه الله:","","",["مدارج السالكين (2/ 472)."],[312],0],[1058,"a","","","« بعث أبو موسى الأشعري إلى قراء أهل البصرة, فدخل عليه ثلاثمائة رجل قد قرءوا القرآن فقال: أنتم خيارُ أهلِ البصرة, وقُراؤُهم فاتلوه, ولا يطولنَّ عليكم الأمدُ, فتقسُوَ قلوبُكم كما قست قلوبُ من كان قبلكم »","عن أبي حرب بن أبي الأسود, عن أبيه قال:","","",["رواه مسلم (1050)."],[313],0],[1059,"n","القرطبي","","قال القرطبي رحمه الله: « وقوله: ولا يطولن عليكم الأمد فتقسو قلوبكم؛ يعني به: لا تستطيبوا مدة البقاء في الدنيا, فإن ذلك مفسد للقلوب بما يجرُّه إليها من الحرص والقسوة, حتى لا تلين لذكر الله, ولا تنتفع بموعظة ولا زجر","","","",["المفهم لما أشكل من تلخيص كتاب مسلم (3/ 93)."],[313],0],[1060,"q","القرطبي","","« وقوله: ولا يطولن عليكم الأمد فتقسو قلوبكم؛ يعني به: لا تستطيبوا مدة البقاء في الدنيا, فإن ذلك مفسد للقلوب بما يجرُّه إليها من الحرص والقسوة, حتى لا تلين لذكر الله, ولا تنتفع بموعظة ولا زجر . وتفقد القلوب يكون بأمور كثيرة, منها: قراءة القرآن الكريم, وتدبره, وسماع تلاوته, فآية واحدة قد يجعل الله بسببها صلاحَ القلب وهدايةَ صاحبه, كما روي في سبب توبة الفضيل بن عياض. وكان سبب توبته أنه عشق جارية فواعدته ليلًا, فبينما هو يرتقي الجدران إليها إذ سمع قارئا يقرأ قوله تعالى: الآية: الحديد: 16 الآية, فرجع القَهْقرى وهو يقول: بلى والله, قد آنَ, فآواهُ الليلُ إلى خَرِبِةٍ وفيها جماعةٌ من السَّابِلة, وبعضهم يقول لبعض: إن فُضيلًا يقطعُ الطريق, فقال الفضيل: أوَّاهُ! أَراني بالليل أسعى في معاصي الله, قومٌ من المسلمين يخافونني! اللهم إني قد تبتُ إليك, وجعلت توبتي إليك جِوارَ بيتِك الحرامِ »","قال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (17/ 251) [الحديد: 16]."],[313],1],[1061,"q","ابن القيم","","« للقلب ستة مواطنَ يجولُ فيها لا سابعَ لها؛ ثلاثةٌ سافلة, وثلاثةٌ عاليةٌ: فالسافلةُ: دنيا تتزيَّنُ له, ونفسٌ تحدِّثُه, وعدوٌّ يوسوسُ له, فهذه مواطنُ الأرواح السافلة التي لا تزالُ تجولُ فيها. والثلاثة العاليةُ: علمٌ يتبيَّنُ له, وعقلٌ يرشدُه, وإلهٌ يعبدُه, والقلوب جوَّالةٌ في هذه المواطن »","قال ابن القيم رحمه الله:","","",["الفوائــــــــــــد لابن القيم (ص/ 144)."],[314],0],[1062,"a","مالك بن دينار","","« ما ضُربَ عبدٌ بعقوبةٍ أعظمَ من قَسوةِ قلبٍ, وما غَضبَ الله عز وجل على قومٍ إلا نزع منهم الرحمةَ »","قال مالك بن دينار رحمه الله:","","",["تفسير البغوي (4/ 85) [الزمر: 22]."],[315],0],[1063,"q","المفسر البيضاوي","","« القساوة: عبارة عن الغلظ مع الصلابة, كما في الحجر, وقساوة القلب مثل في نبوِّه عن الاعتبار, وثم لاستبعاد القسوة مِنْ بَعْدِ ذلِكَ يعني إحياء القتيل, أو جميع ما عدد من الآيات فإنها مما توجب لين القلب, فَهِيَ كَالْحِجارَةِ في قسوتها أَوْ أَشَدُّ قَسْوَةً منها, والمعنى: أنها في القساوة مثل الحجارة أو أزيد عليها, أو أنها مثلها, أو مثل ما هو أشد منها قسوة كالحديد, فحذف المضاف وأقيم المضاف إليه مقامه, ويعضده قراءة الحسن بالجر عطفاً على الحجارة, وإنما لم يقل أقسى لما في أشد من المبالغة, والدلالة على اشتداد القسوتين واشتمال المفضل على زيادة و… للتخيير, أو للترديد بمعنى: أن من عرف حالها شبهها بالحجارة أو بما هو أقسى منها. … تعليل للتفضيل, والمعنى: أن الحجارة تتأثر وتنفعل فإن منها ما يتشقق فينبع منه الماء, وتنفجر منه الأنهار, ومنها ما يتردى من أعلى الجبل انقياداً لما أراد الله تعالى به, وقلوب هؤلاء لا تتأثر ولا تنفعل عن أمره تعالى, والتفجّر: التفتّح بسعة وكثرة, والخشية: مجاز عن الانقياد »","قال المفسر البيضاوي, رحمه الله:","","",["تفسير البيضاوي - أنوار التنزيل وأسرار التأويل (1/ 88) [سورة البقرة: 74]."],[315],0],[1064,"h","النبي ﷺ","حارثة بن وهب الخزاعي","«ألا أخبركم بأهل الجنة؟ كلُّ ضعيف مُتَضعِّفٍ, لو أقسم على الله لأبرَّهُ, ألا أخبركم بأهل النار: كلُّ عُتُلٍّ, جَوَّاظٍ, مُسْتَكبِرٍ»","وكذلك ورد الترهيب والوعيد في حق الذين يتعاملون مع الخلق بغلظة وقساوة؛ فعن حارثة بن وهب الخزاعي رضي الله عنه, قال: سمعت النبي ﷺ يقول:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (4918) ومسلم (2853)."],[315],0],[1065,"q","ابن الملقن الشافعي","","« \"العتل\": الغليظ والعنيف, وقال الفرَّاء: الجافي عن الوعظ, وقيل: الشديد من كل شيء, وقيل: الكافر, وقال الداودي: هو السمين العظيم العنق والبطن, وقال الهروي: هو الجموع المنوع, قال: ويقال: القصير البطين. وقيل: الأكول الشروب الظلوم »","قال ابن الملقِّن الشافعي رحمه الله:","","",["التوضيح لشرح الجامع الصحيح (23/ 443)."],[315],0],[1066,"n","ابن القيم","","- إِذا قسا الْقلبُ قَحَطَتِ الْعينُ","","","",["كتاب الفوائد لابن القيم (ص/ 142)."],[315],0],[1067,"h","النبي ﷺ","عبد الله بن عمرو بن العاص","«إنَّ الإيمانَ لَيَخْلَقُ في جَوْفِ أحدِكُمْ كَما يَخلَقُ الثّوبُ الخَلِقُ, فاسْألُوا اللهَ تعالَى أنْ يُجَدِّدَ الإيمانَ في قُلوبِكمْ»","عن عبد الله بن عمرو بن العاص رضي الله عنهما قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح الجامع (1590)",["أخرجه الحاكم (5)، والطبراني في الكبير (14668) وصححه الألباني في صحيح الجامع (1590)."],[82],0],[1068,"h","النبي ﷺ","أنس بن مالك","«إن القلوب بين إصبعين من أصابع الرحمن عز وجل يقلبها»","وعن أنس بن مالك رضي الله عنه, قال: كان رسول الله ﷺ يكثر أن يقول: «اللهم ثبت قلبي على دينك», فقال رجل: يا رسول الله, تخاف علينا وقد آمنا بك, وصدقناك بما جئت به؟ فقال:","صحيح","صححه الألباني في صحيح ابن ماجه (3107)",["رواه ابن ماجه (3834) والترمذي (2140) وصححه الألباني في صحيح ابن ماجه (3107)."],[82],0],[1069,"q","المباركفوري","","« قوله «ثبت قلبي على دينك» أي: اجعله ثابتًا على دينك, غير مائل عن الدين القويم, والصراط المستقيم, «فقلت: يا نبي الله آمنا بك», أي: بنبوتك ورسالتك «وبما جئت به» من الكتاب والسنة «فهل تخاف علينا»؛ يعني: أن قولك هذا ليس لنفسك؛ لأنك في عصمة من الخطأ والزلة, خصوصًا من تقلب القلب عن الدين والملة, وإنما المراد تعليم الأمة, فهل تخاف علينا من زوال نعمة الإيمان أو الانتقال من الكمال إلى النقصان؟ قال: «نعم»؛ يعني أخاف عليكم »","قال المباركفوري رحمه الله:","","",["تحفة الأحوذي بشرح جامع الترمذي (6/ 291) حديث رقم (2140)."],[82],0],[1070,"q","البغوي","","« فإن قيل: أليس قد قال الله تعالى: … فكيف تكون الطمأنينة والوجل في حالة واحدة؟ قيل: الوجل عند ذكر الوعيد والعقاب, والطمأنينة عند ذكر الوعد والثواب, فالقلوب تَوجَلُ إذا ذكرت عدلَ الله وشِدَّةَ حسابه, وتطمئنُّ إذا ذكرتْ فضلَ الله وكرمَه »","قال البغوي رحمه الله:","","",["تفسير البغوي (3/ 20) [الرعد: ٢٨]."],[316],0],[1071,"q","أبو المظفر السمعاني","","« أي: تسكن قلوبهم بذكر الله, وقيل: تستأنس قلوبهم بذكر الله, والسكون باليقين, والاضطراب بالشك, وقوله: … معناه: ألا بذكر الله تسكن القلوب, وطمأنينة القلب: بزوال الشك منه, واستقرار اليقين فيه »","قال أبو المظفر السمعاني رحمه الله:","","",["تفسير السمعاني (3/ 92) [الرعد: ٢٨]."],[316],0],[1072,"q","الشوكاني","","« أي: تسكن وتستأنس بذكر الله سبحانه بألسنتهم, كتلاوة القرآن والتسبيح والتحميد والتكبير والتوحيد, أو بسماع ذلك من غيرهم, وقد سمى سبحانه القرآن ذكرًا فقالَ سبحانه: الآية: الأنبياء: 50, وَقَالَ: الآية: الحجر: 9 »","وقال الشوكاني رحمه الله, في تفسير قوله تعالى: …:","","",["فتح القدير للشوكاني (3/ 97) [الرعد: ٢٨]."],[316],0],[1073,"a","","","«رَجُلٌ ذَكَرَ اللَّهَ خَالِيًا فَفَاضَتْ عَيْنَاهُ»","وعن أبي هريرة عن النبي ﷺ قال: «سبعة يظلهم الله في ظله يوم لا ظل إلا ظله»: - ومنهم: -","","",["البخاري (660) ومسلم (1031)."],[316],0],[1074,"a","المعلى بن زياد","","« أن رجلًا قال للحسن البصري رحمه الله: يا أبا سعيد, أشكو إليك قسوة قلبي, قال: أَذِبْهُ بالذِّكر »","وعن المُعَلَّى بن زياد رحمه الله,","","",["أخرجه ابن أبي الدنيا في الرقة والبكاء [48]."],[316],0],[1075,"q","ابن القيم","","« إن في القلب قسوةً لا يُذِيبها إلا ذكر الله تعالى, فينبغي للعبد أن يداوي قسوة قلبه بذكر الله تعالى, وهذا لأن القلب كلما اشتدت به الغفلة اشتدت به القسوة, فإذا ذكر اللهَ تعالى ذابت تلك القسوة كما يذوب الرصاص في النار, فما أُذيبت قسوة القلوب بمثل ذكر الله عز وجل »","وقال ابن القيم رحمه الله:","","",["الوابل الصيب (ص/ 171). السادسة والأربعون من فوائد الذكر."],[316],0],[1076,"q","ابن القيم","","« من الذاكرين من يبتدئُ بذكر اللسان, وإن كان على غفلة, ثم لا يزَال فِيهِ حَتَّى يحضر قلبه, فيتواطئا على الذّكر. وَمِنْهُم من لَا يرى ذَلِك, وَلَا يبتدئُ على غَفلَة, بل يسكن حَتَّى يحضر قلبه, فيشرع فِي الذّكر بِقَلْبِه؛ فَإِذا قوي استتبع لِسَانه, فتواطئا جَمِيعًا. فالأول: ينْتَقل الذّكر من لِسَانه إِلَى قلبه. والثاني: ينْتَقل من قلبه إِلَى لِسَانه, من غير أَن يَخْلُو قلبه مِنْهُ, بل يسكن أَولًا حَتَّى يحس بِظُهُور النَّاطِق فِيهِ, فَإِذا أحس بذلك نطق قلبه, ثمَّ انْتقل النُّطْق القلبي إِلَى الذّكر اللساني, ثمَّ يسْتَغْرق فِي ذَلِك حَتَّى يجد كل شَيْء مِنْهُ ذَاكِرًا. وَأفضل الذّكر وأنفعه مَا واطأ فِيهِ الْقلب اللِّسَان, وَكَانَ من الْأَذْكَار النَّبَوِيَّة, وَشهد الذاكر مَعَانِيه ومقاصده »","قال ابن القيم رحمه الله:","","",["الفوائد (ص/ ٢٧٨)."],[317],0],[1077,"a","صفية","","« أكثري ذكر الموت؛ يرقّ قلبك, وتقدرين على حاجتكِ, قالت: ففَعَلَتْ, فآنستْ من قلبها رشداً, فجاءت تشكر لعائشة رضي الله عنها »","عن صفية: أنَّ امرأة أتت عائشة رضي الله عنها, تشكو إليها القسوة؟ فقالت:","","",["كتاب ذم القسوة للحافظ ابن رجب (ص/ 265)."],[318],0],[1078,"a","إبراهيم التيمي","","« شيئان قطعا عني لذَّةَ الدنيا: ذكرُ الموت, وذكرُ الموقف بين يدي الله تعالى »","وقال إبراهيم التيمي رحمه الله:","","",["التذكرة بأحوال الموتى وأمور الآخرة للقرطبي (ص/ 125)."],[318],0],[1079,"a","عمر بن عبد العزيز","","« لَو فَارق ذكر الْمَوْت قلبِي ساعة لفسد »","وقال عمر بن عبد العزيز رحمه الله:","","",["العاقبة في ذكر الموت (ص/ 39)."],[318],0],[1080,"a","مالك بن مغول","","« قيل للربيع بن أبي راشد: ألا تجلس فتحدث, قال: إنَّ ذكر الموت إذا فارق قلبي ساعة فسد عليَّ قلبي. قال مالك: ولم أر رجلًا أظهر حزنًا منه »","وقد ورد هذا الأثر عن غير واحد من السلف, فقد أخرجه ابن المبارك عن مالك بن مغول قال:","","",["الزهد والرقائق - ابن المبارك (ص/ 90) رقم (266)."],[318],0],[1081,"a","سعيد بن جبير","","« لو فارق ذكرُ الموت قلبي خشيتُ أن يفسُدَ عليَّ قلبي »","وعن سعيد بن جبير قال:","","",["الزهد لأحمد بن حنبل (ص/ 300) رقم (2168)."],[318],0],[1082,"h","النبي ﷺ","","«إِذَا سَأَلْتَ فَاسْأَلِ اللَّهَ, وَإِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللَّهِ»","والعاقل اللبيب لا يُهملُ الاستعانة بالله في كل أموره؛ ففي حديث ابن عباس رضي الله عنهما أن النبي ﷺ قال:","صحيح","صححه الوادعي في الصحيح المسند مما ليس في الصحيحين (685)",["رواه الترمذي (2516) وأحمد (2763) وصححه الوادعي في الصحيح المسند مما ليس في الصحيحين (685)."],[319],0],[1083,"q","المباركفوري","","« «إذا سألت»؛ أي: أردت السؤال «فاسأل الله»؛ أي: وحدَهُ؛ لأنَّ غيرَه غيرُ قادرٍ على الإعطاء, والمنع, ودفع الضرر, وجلب النفع, «وإذا استعنت»؛ أي: أردت الاستعانة في الطاعة وغيرها من أمور الدنيا والآخرة؛ «فاستعن بالله» فإنه المستعان وعليه التكلان »","قال المباركفوري رحمه الله:","","",["تحفة الأحوذي بشرح جامع الترمذي (7/ 185) حديث رقم (2516)."],[319],0],[1084,"n","أمير المؤمنين عمر بن الخطاب","","فَإِذا كَانَ كل خيرٍ فأصله التَّوْفِيق, وَهُوَ بيد الله لَا بيد العَبْد, فمفتاحه: الدُّعَاء والافتقارُ وَصدقُ اللَّجأ وَالرَّغْبَة والرهبة إِلَيْهِ, فَمَتَى أعْطى العَبْدَ هَذَا الْمِفْتَاحَ فقد أَرَادَ أَن يفتح لَهُ, وَمَتى أضلّه عَن الْمِفْتَاح بَقِي بَاب الْخَيْر مُرْتَجًا دونه. قال أمير المؤمنين عمر بن الْخطاب رضي الله عنه: إني لا أحمل هم الإجابة وإنما أحمل هم الدعاء فإذا ألهمت الدعاء فإن الإجابة معه","","","",["ذكره ابن تيمية في الاقتضاء (2/ 229)، والفتاوى (8/ 193)."],[319],0],[1085,"a","","","« أساسُ كل خيرٍ أنْ تعلم أنَّ ما شاء الله كان, وما لم يَشَأْ لم يكن؛ فتتيقَّن حِينَئِذٍ أَن الْحَسَنَاتِ من نِعَمِهِ, فتشكره عَلَيْهَا, وتتضرّع إِلَيْهِ أَن لَا يقطعهَا عَنْك, وَأَنَّ السَّيِّئَات من خِذلانه وعقوبته, فتبتهل إِلَيْهِ أَن يحولَ بَيْنك وَبَينهَا, وَلَا يَكِلَكَ فِي فعل الْحَسَنَاتِ وَترك السَّيِّئَاتِ إِلَى نَفسك. وَقد أجمع العارفون على أَنَّ كلَّ خيرٍ فأصله بِتَوْفِيق الله للْعَبد, وكل شَرٍّ فأصله خِذلانه لعَبْدِهِ, وَأَجْمعُوا أَن التَّوْفِيق أَن لَا يَكِلَـكَ الله إِلَى نَفسك, وأنَّ الخِذلان هو أَنْ يُخليَ بَيْنك وَبَين نَفسك. فَإِذا كَانَ كل خيرٍ فأصله التَّوْفِيق, وَهُوَ بيد الله لَا بيد العَبْد, فمفتاحه: الدُّعَاء والافتقارُ وَصدقُ اللَّجأ وَالرَّغْبَة والرهبة إِلَيْهِ, فَمَتَى أعْطى العَبْدَ هَذَا الْمِفْتَاحَ فقد أَرَادَ أَن يفتح لَهُ, وَمَتى أضلّه عَن الْمِفْتَاح بَقِي بَاب الْخَيْر مُرْتَجًا دونه. قال أمير المؤمنين عمر بن الْخطاب رضي الله عنه: إني لا أحمل هم الإجابة وإنما أحمل هم الدعاء فإذا ألهمت الدعاء فإن الإجابة معه. وعَلى قدر نيَّة العَبْد وهمَّتِهِ وَمرَاده ورغبته فِي ذَلِك يكون توفيقه سُبْحَانَهُ وإعانته؛ فالمعونة من الله تَنْزِلُ على الْعباد على قدر هممهم وثباتهم ورغبتهم ورهبتهم, والخِذلان يَنزِل عَلَيْهِم على حسب ذَلِك. فَالله سُبْحَانَهُ أحكم الْحَاكِمين وَأعلم الْعَالمين, يضع التَّوْفِيقَ فِي موَاضعه اللائقة بِهِ, والخِذلانَ فِي موَاضعه اللائقة بِهِ, وهُوَ الْعَلِيم الْحَكِيم, وَمَا أُتِيَ مَنْ أُتِيَ إِلَّا من قِبَل إِضَاعَة الشُّكْر وإهمال الافتقار وَالدُّعَاء, وَلَا ظَفِرَ من ظَفِرَ بِمَشِيئَة الله وعونه إِلَّا بقيامه بالشُّكر وَصدق الافتقار وَالدُّعَاء. ومِلاكُ ذَلِك الصَّبْرُ؛ فَإِنَّهُ من الْإِيمَان بِمَنْزِلَة الرَّأْس من الْجَسَد؛ فَإِذا قُطِعَ الرَّأْس فَلَا بَقَاءَ للجسد »","","","",["الفـوائــد (ص/ 141- 142)."],[319],0],[1086,"s","عبد الله بن عباس","","« كان المنافقون يجلسون عند رسول الله ﷺ ثم يخرجون فيقولون: ماذا قال آنفا, ليس معهم قلوب »","عن ابن عباس رضي الله عنهما, في قوله تعالى: …؛ قال:","","",["الأحاديث المختارة للضياء المقدسي (12/ 111) رقم (135)."],[126],0],[1087,"q","ابن القيم","","« إِذا غُذِيَ الْقلبُ بالتذكُّر, وَسُقِي بالتفكُّر, ونُقِّيَ من الدَّغل؛ رأى الْعَجَائِبَ وأُلهِمَ الْحِكْمَةَ »","وقال ابن القيم رحمه الله:","","",["كتاب الفوائـــــد لابن القيم (ص/ 143)."],[126],0],[1088,"h","النبي ﷺ","أنس بن مالك","«ألا إني كنت نهيتكم عن ثلاث: نهيتكم عن زيارة القبور, ثم بدا لي أنها تُرِقُّ القلوب, وتُدمعُ العين, فزوروها, ولا تقولوا هُجْرًا»","عن أنس بن مالك رضي الله عنه, قال: نهى رسول الله ﷺ عن زيارةِ القُبور, ثم قال رحمه الله بعد ذلك:","صحيح","صححه الألباني في صحيح الجامع (4584)",["رواه أحمد (13615) وصححه الألباني في صحيح الجامع (4584)."],[320],0],[1089,"q","المناوي","","« من أعظم أدوية قسوة القلوب؛ زيارة القبور, وتأمل حال المقبور, وما بعده من البعث والنشور؛ الباعث على ذكر هاذم اللذات, ومُفرِّق الجماعات, وكذا مشاهدة المحتضرين, وتغسيل الموتى والصلاة على الجنائز, فإن في ذلك موعظة بليغة »","قال المُناوي رحمه الله:","","",["فيض القدير (1/696)."],[320],0],[1090,"a","","","« أنَّ رجلاً سأل أبا عبد الله؛ يعني أحمد بن حنبل؛ فقال له: كيف يرقُّ قلبي؟ قال: أدخل المقبرة, وامسح رأس اليتيم »","ونقل أبو طالب رحمه الله:","","",["طبقات الحنابلة لابن أبي يعلى (1/ 39)."],[320],0],[1091,"h","النبي ﷺ","أبو هريرة","«إن أردت أن يلينَ قلبُك, فأطعِمِ المسكينَ, وامسَحْ رأسَ اليتيمِ»","عن أبي هريرة رضي الله عنه, أن رجلًا, شكا إلى رسول الله ﷺ قسوة قلبه, فقال له:","حسن","حسنه الألباني في صحيح الجامع (١٤١٠)",["رواه أحمد (7576) والبيهقي في الشعب (11034) وحسنه الألباني في صحيح الجامع (١٤١٠)."],[321],0],[1092,"h","النبي ﷺ","أبو موسى الأشعري","عن أبي موسى الأشعري رضي الله عنه, عن النبي ﷺ قال: «أطعِمُوا الجائعَ, وعودوا المريضَ, وفكُّوا العانيَ», قال سفيان: والعاني الأسير","عن أبي موسى الأشعري رضي الله عنه, عن النبي ﷺ قال: «أطعِمُوا الجائعَ, وعودوا المريضَ, وفكُّوا العانيَ», قال سفيان: والعاني الأسير","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (5373)."],[322],0],[1093,"a","أبو حفص عمر بن صالح الطرسوسي","","« سألت أبا عبد الله - يعني: أحمد بن حنبل رحمه الله: بم تلين القلوب؟ فأبصَرَ إليَّ, ثم أبصرَ إليَّ, ثم أطرقَ إليَّ ساعةً فقال: يا بُني! بأكل الحلال. قال: فذهبت إلى أبي نصر بشر بن الحارث فقلت: له يا أبا نصر! بأي شيء تلين القلوب؟ فقال: الآية: الرعد: 28, فقلت: له فإني قد سألت أبا عبد الله, فتهلل وجهه لذكري لأبي عبد الله, قال: سألته؟ قلت: نعم, قال: هيه, قلت: قال لي: بأكل الحلال, قال: جاءك بالأصل, كما قال, قال: فذهبت إلى عبد الوهاب بن أبي الحسن فقلت: يا أبا الحسن بم تلين القلوب؟ فقال: الآية: الرعد: 28, فقلت: قد سألت أبا عبد الله. فاحمرَّ وجهه من فرحِه بأحمدَ, فقال: سألت أبا عبد الله؟ قلت: نعم, قال: هيه, قلت: قال لي: بأكل الحلال, فقال: لأصحابه: أما تسمعون؟ أجابه بالجوهر, أجابه بالجوهر, الأصل كما قال, الأصل كما قال »","قال أبو حفص عمر بن صالح الطرسوسي:","","",["طبقات الحنابلة (1/219) لأبي الحسين ابن أبي يعلى ت 526هـ. وأخرجه أبو نعيم في حلية الأولياء (9/ 182)."],[323],0],[1094,"q","ابن تيمية","","« وأما قوله: … فهي عامة فيمن تناوله هذا الوصف؛ مثل الذين يصلون الفجر والعصر في جماعة, فإنهم يدعون ربهم بالغداة والعشي يريدون وجهه, سواء كانوا من أهل الصفة أو غيرهم, أمر الله نبيه بالصبر مع عباده الصالحين؛ الذين يريدون وجهه, وألا تعدو عيناه عنهم تريد زينة الحياة الدنيا, وهذه الآية في الكهف وهي سورة مكية. وكذلك الآية التي في سورة الأنعام: الآية: الأنعام: 52, وقد رُوي أن هاتين الآيتين نزلتا في المؤمنين المستضعفين لما طلب المتكبرون أن يبعدهم النبي ﷺ عنه, فنهاه الله عن طرد من يريد وجه الله وإن كان مستضعفًا, ثم أمره بالصبر معهم, وكان ذلك قبل الهجرة إلى المدينة وقبل وجود الصفة؛ لكن هي متناولة لكل من كان بهذا الوصف من أهل الصفة وغيرهم. والمقصود بذلك أن يكون مع المؤمنين المتقين الذين هم أولياء الله وإن كانوا فقراء ضعفاء, ولا يتقدم أحد عند الله بسلطانه وماله ولا بذله وفقره, وإنما يتقدم عنده بالإيمان والعمل الصالح, فنهى الله نبيه أن يطيع أهل الرياسة والمال الذين يريدون إبعاد من كان ضعيفًا أو فقيرًا, وأمره ألا يطرد من كان منهم يريد وجهه, وأن يصبر نفسه معهم في الجماعة التي أمر فيها بالاجتماع بهم, كصلاة الفجر والعصر, ولا يطيع أمر الغافلين عن ذكر الله المتبعين لأهوائهم »","قال ابن تيمية رحمه الله:","","",["مجموع الفتاوى (11/ 59)."],[324],1],[1095,"q","السعدي","","« يأمر تعالى نبيه محمدًا ﷺ, وغيره أسوته, في الأوامر والنواهي -أن يصبر نفسه مع المؤمنين العباد المنيبين …؛ أي: أول النهار وآخره يريدون بذلك وجه الله, فوصفهم بالعبادة والإخلاص فيها, ففيها الأمر بصحبة الأخيار, ومجاهدة النفس على صحبتهم ومخالطتهم وإن كانوا فقراء, فإن في صحبتهم من الفوائد ما لا يحصى. …؛ أي: لا تجاوزهم بصرك, وترفع عنهم نظرك. … فإن هذا ضار غير نافع, وقاطع عن المصالح الدينية, فإن ذلك يوجب تعلق القلب بالدنيا, فتصير الأفكار والهواجس فيها, وتزول من القلب الرغبة في الآخرة, فإن زينة الدنيا تروق للناظر, وتسحر العقل, فيغفل القلب عن ذكر الله, ويقبل على اللذات والشهوات, فيضيع وقته, وينفرط أمره, فيخسر الخسارة الأبدية, والندامة السرمدية, ولهذا قال: … غفل عن الله, فعاقبه بأن أغفله عن ذكره »","وقال السعدي رحمه الله:","","",["تفسير السعدي (1/ 639) [الكهف: 28]."],[324],0],[1096,"a","","","«إنما مثل الجليس الصالح والجليس السوء, كحامل المسك ونافخ الكير, فحامل المسك, إما أن يحذيك, وإما أن تبتاع منه, وإما أن تجد منه ريحا طيبة, ونافخ الكير, إما أن يحرق ثيابك, وإما أن تجد ريحا خبيثة»","وعن أبي موسى الأشعري رحمه الله, عن النَّبِيِّ ﷺ قال","","",["رواه البخاري (5534) ومسلم (2628) واللفظ له."],[324,325],0],[1097,"q","النووي","","« وفيه فضيلةُ مجالسةِ الصالحين وأهلِ الخير والمروءةِ ومكارمِ الأخلاق والورع والعلم والأدب, والنَّهيُ عن مجالسةِ أهلِ الشَّرِّ وأهلِ البِدعِ, ومن يغتابُ الناس, أو يكثُرُ فُجْرُهُ وبطالتُه, ونحوُ ذلك من الأنواع المذمومة »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (16/ 178) حديث رقم (2628)."],[324,325],0],[1098,"n","","","وفي كل الأحوال فإن مجالسة الأشرار مذمومة ضارَّة, ومجالسة الصالحين محمودة نافعة, ولذلك كان من وصايا ذلك العالِم للتائب من ذنب القتل؛ أن يذهب إلى أرضٍ فيها أناسٌ صالحون ليجالسهم, وأن يتركَ بلَدَه, ويفارقَ جلساءَ السوء, ففي الحديث لما سأل: هل له من توبة؟ فقال: نعم, ومَنْ يحولُ بينه وبين التوبة, انطلِقْ إلى أرضِ كذا وكذا فإن بها أُناسًا يعبدون الله فاعبدِ الله معهم, ولا ترجِعْ إلى أرضك فإنها أرضُ سُوءٍ","","","",["رواه البخاري (3470) ومسلم (2766) واللفظ له."],[324],0],[1099,"q","العلماء","","« في هذا استحبابُ مفارقةِ التائبِ المواضعَ التي أصاب بها الذُّنوب, والأخدانَ المساعدينَ له على ذلك, ومقاطعتِهِم ما داموا على حالهم, وأن يستبدلَ بهم صحبةَ أهلِ الخير والصلاح والعلماء والمتعبِّدين الوَرِعِينَ ومن يَقْتَدِي بهم, ويَنتَفِعُ بصحبتهم, وتتأكدُ بذلك توبتُهُ »","قال العلماء:","","",["المنهاج شرح صحيح مسلم بن الحجاج (17/ 83) حديث رقم (2766)."],[324,325],0],[1100,"q","الطبري","","« يقول تعالى ذكره: … هؤلاء المكذّبون بآيات الله والجاحدون قدرته في البلاد, فينظروا إلى مصارع ضُربائهم من مُكذّبي رسل الله الذين خلوْا من قبلهم, كعادٍ وثمودَ وقومِ لوطٍ وشعيبٍ, وأوطانهم ومساكنهم, فيتفكَّروا فيها, ويعتبروا بها, ويعلموا بتدبرهم أمرها وأمر أهلها, سنة الله فيمن كفر وعبد غيره وكذّب رسله, فيُنيبُوا من عتوِّهم وكفرهم, ويكون لهم إذا تدبّروا ذلك واعتبروا به وأنابوا إلى الحقّ … حُجج الله على خلقه وقدرته على ما بيَّنا …؛ يقول: أو آذان تُصغي لسماعِ الحقّ فتعي ذلك وتميز بينه وبين الباطل, وقوله: …, يقول: فإنها لا تعمى أبصارهم أن يُبصروا بها الأشخاص ويروها, بل يبصرون ذلك بأبصارهم, ولكن تعمى قلوبهم التي في صدورهم عن أنصار الحق ومعرفته »","قال الطبري رحمه الله:","","",["تفسير الطبري - جامع البيان (18/ 657) [سورة الحج: 46]."],[293],0],[1101,"q","ابن قدامة","","« ومَثَلُ الشيطان كمَثَل كلب جائع يقرب منك, فإن لم يكن بين يديك لحم وخبز, فإنه ينزجر بأن تقول له: اخسأ, وإن كان بين يديك شيءٌ من ذلك وهو جائع, لم يندفع عنك بمجرد الكلام, فكذلك القلب الخالي عن قوت الشيطان ينزجر عنه بمجرد الذكر. فأما القلبُ الذي غلب عليه الهوى, فإنه يرفع الذكرَ إلى حواشيه, فلا يتمكّن الذكر من سُوَيدائه, فيستقر الشيطان في السُّوَيداء »","في مختصر منهاج القاصدين:","","",["مختصر منهاج القاصدين (ص/ 195)."],[326],0],[1102,"h","النبي ﷺ","","«لَأَنْ يَمْتَلِئَ جَوْفُ أَحَدِكُمْ قَيْحًا حتَّى يَرِيهِ, خَيْرٌ لَهُ مِنْ أَنْ يَمْتَلِئَ شِعْرًا»","حديثِهِ, كَمَا إِذا مَال إِلَى غير محبَّة الله؛ لم يبْقَ فِيهِ ميلٌ إِلَى محبَّتِهِ, فَإِذا نطق الْقلبُ بِغَيْر ذِكرِهِ, لم يَبْقَ فِيهِ مَحلٌّ للنُّطقِ بِذكرِهِ كاللسان, وَلِهَذَا فِي الصَّحِيح عَنِ النَّبِيِّ ﷺ, قَالَ:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (6155) ومسلم (2257) من حديث أَبِي هُرَيْرَةَ رضي الله عنه."],[326],0],[1103,"q","ابن القيم","","« قَبولُ المَحلِّ لما يُوضع فيه مشروطٌ بتفريغه من ضدِّه, وهذا كما أنَّه فِي الذوات والأعيان؛ فَكَذَلِك هُوَ فِي الاعتقادات والإرادات؛ فَإِذا كَانَ الْقلبُ ممتلئًا بِالْبَاطِلِ اعتقادًا ومحبّةً؛ لم يبْقَ فِيهِ لاعتقاد الْحقِّ ومحبّتِهِ مَوضِعٌ, كَمَا أَن اللِّسَان إِذا اشْتغل بالتَّكلُّم بِمَا لَا ينفعُ, لم يتَمَكَّنْ صَاحبُهُ من النُّطْق بِمَا يَنْفَعُهُ؛ إِلَّا إِذا فرَّغَ لِسَانه من النُّطْق بِالْبَاطِلِ, وَكَذَلِكَ الْجَوَارِحُ إِذا اشتغلت بِغَيْر الطَّاعَة؛ لم يُمكن شغلها بِالطَّاعَةِ إِلَّا إِذا فرَّغها من ضدِّها. فَكَذَلِك الْقلبُ المشغولُ بمحبَّة غير الله وإرادته والشوق إِلَيْهِ والأُنْس بِهِ لا يُمكن شَغْلُهُ بمحبة الله وإرادتِهِ وحبِّه والشوق إِلَى لِقَائِه؛ إِلَّا بتفريغِهِ من تعلُّقه بِغَيْرِهِ, وَلَا حَرَكَة اللِّسَان بِذكرِهِ والجوارح بخدمتِهِ, إِلَّا إِذا فرَّغها من ذكر غَيره وخدمته؛ فَإِذا امْتَلَأَ الْقلبُ بِالشُّغلِ بالمخلوق والعلوم الَّتِي لَا تَنْفَعُ, لم يبْق فِيهَا مَوضِعٌ للشُّغل بِاللَّه وَمَعْرِفَة أَسْمَائِهِ وَصِفَاتِهِ وَأَحْكَامِه. وسرُّ ذَلِك: أَنَّ إصغاء الْقلب كإصغاءِ الْأُذُنِ, فَإِذا صغى إِلَى غير حَدِيث الله؛ لم يبْقَ فِيهِ إصغاءٌ وَلَا فهمٌ لحديثِهِ, كَمَا إِذا مَال إِلَى غير محبَّة الله؛ لم يبْقَ فِيهِ ميلٌ إِلَى محبَّتِهِ, فَإِذا نطق الْقلبُ بِغَيْر ذِكرِهِ, لم يَبْقَ فِيهِ مَحلٌّ للنُّطقِ بِذكرِهِ كاللسان, وَلِهَذَا فِي الصَّحِيح عَنِ النَّبِيِّ ﷺ, قَالَ: «لَأَنْ يَمْتَلِئَ جَوْفُ أَحَدِكُمْ قَيْحًا حتَّى يَرِيهِ, خَيْرٌ لَهُ مِنْ أَنْ يَمْتَلِئَ شِعْرًا», فبيَّنَ أَنَّ الْجوفَ يمتلئُ بالشِّعرِ, فَكَذَلِك يمتلئُ بالشُّبه, والشُّكوكِ, والخيالاتِ, والتقديرات الَّتِي لَا وجود لَهَا, والعلوم الَّتِي لَا تَنْفَعُ, والمُفاكَهاتِ, والمُضحِكاتِ, والحكاياتِ وَنَحْوهَا, وَإِذا امْتَلَأَ الْقلبُ بذلك؛ جَاءَتْهُ حقائقُ الْقُرْآنِ وَالْعلم الَّذِي بِهِ كَمَالُهُ وسعادتُهُ, فَلم تَجِدْ فِيهِ فراغًا لَهَا وَلَا قبولًا, فتَعَدَّتْهُ وجاوزَتْــهُ إِلَى مَحلٍّ سواهُ؛ كَمَا إِذا بُذِلَتِ النَّصِيحَةُ لقلبٍ ملآن من ضدِّها لَا منفذَ لَهَا فِيهِ؛ فَإِنَّهُ لَا يقبلُهَا وَلَا تلجُ فِيهِ, لَكِن تَمُرُّ مجتازةً لَا مستوطنةً. وَلذَلِك قيل: نَزِّهْ فُؤَادك مِنْ سوانا تَلْقنا … فجَنابُنا حِلٌّ لِكُلِّ مُنَزَّهِ … وَالصَّبْرُ طِلَّسْمٌ لِكَنْزِ وِصالِنا … مَنْ حَلَّ ذَا الطِّلَّسْمَ فَازَ بكَنْزِهِ وَبِاللَّهِ التَّوْفِيق »","قال ابن القيم رحمه الله:","","",["الفوائد (ص/ ٤١- 43)"],[326],0],[1104,"h","النبي ﷺ","","كان النبي ﷺ يستعيذ من القلب الذي لا يخشع","كان النبي ﷺ يستعيذ من القلب الذي لا يخشع","صحيح","في الصحيحين أو أحدهما",["صحيح مسلم (2722)."],[327],0],[1105,"n","","","كان النبي ﷺ يستعيذ من القلب الذي لا يخشع؛ لأن القلب إنما خلق لأن يتخشع لبارئه, وينشرح لذلك الصدر, ويقذف النور فيه, فإذا لم يكن كذلك كان قاسيًا؛ فيجب أن يستعاذ منه","","","",["شرح المشكاة للطيبي الكاشف عن حقائق السنن (6/ 1915)."],[327],0],[1106,"h","النبي ﷺ","عبد الله بن عمر","«لا تُكثِروا الكلام بغير ذكرِ الله فإنَّ كثرةَ الكلام بغير ذكر الله قسوةٌ للقلب, وإن أبعدَ الناسِ من الله القلبُ القاسي»","عن ابن عمر رضي الله عنهما, قال: قال رسول الله ﷺ:","حسن","قال المنذري في الترغيب والترهيب (4/ 28): إسناده صحيح أو حسن أو ما قاربهما",["رواه الترمذي (2411). البيهقي في شعب الإيمان (4951) وقال المنذري في الترغيب والترهيب (4/ 28): إسناده صحيح أو حسن أو ما قاربهما."],[328],0],[1107,"q","الطيبي","","« لأن الكلام إما خيرٌ أو شر أو مباح, ففي الخير أجر, وفي الشر إثم, وفي المباح عفو لا إثم فيه ولا أجر, والمراد بذكر الله هنا ما فيه رضي الله من الكلام, كالتلاوة, والصلاة علي النبي ﷺ, والتسبيح, والتهليل, والدعاء للمؤمنين وما أشبه ذلك.. «كل كلام ابن آدم» فلا يخرج المباح من جملة ما عليه, وأقله أنْ يُحاسَب عليه, قال تعالى: الآية: ق: 18, ويُورِثُ قساوةَ القلب... ولابد في الكلام من التقدير بأن يقال: إن أبعد القلوب من الله القلب القاسي, أو: إن أبعد الناس من الله القلب القاسي. أقول [أي: الطيبي]: ويمكن أن يعبر بالقلب عن الشخص؛ لأنه به, كما قيل: المرء بأصغريه؛ أي: بقلبه ولسانه, أو يقدر: ذو القلب »","قال الطيبي رحمه الله:","","",["شرح المشكاة للطيبي - الكاشف عن حقائق السنن (5/ 1737)."],[328],0],[1108,"q","الملا علي القاري","","« قوله: «لا تكثر الكلام بغير ذكر الله» فيه إشارة إلى أن بعض الكلام مباحٌ وهو ما يعنيه: «فإن كثرة الكلام بغير ذكر الله قسوة»؛ أي: سببُ قساوةٍ «للقلب», وهي النبوُّ عن سماع الحق, والميلُ إلى مخالطة الخلق, وقِلةُ الخشية وعدمُ الخشوع والبكاء, وكثرةُ الغفلةِ عن دارِ البَقاء «وإن أبعد الناس من الله» أي: من نَظَرِ رحمتِه وعينِ عِنايته «القلبُ القاسي»؛ أي: صاحبه »","وقال عليّ القاري رحمه الله:","","",["مرقاة المفاتيح شرح مشكاة المصابيح (4/ 1556)."],[328],0],[1109,"a","عيسى ابن مريم","","« لا تُكثروا الكلامَ بغيرِ ذكرِ الله عز وجل؛ فتقسُو قلوبُكم, وإنَّ القاسي قلبُهُ بعيد من الله عز وجل ولكن لا يعلم, ولا تنظروا إلى ذنوبِ الناسِ كأنكم أربابٌ ولكن انظروا في ذنوبكم كأنكم عبيدٌ, والناسُ رجلان: معافًى ومبتلًى, فارحموا أهلَ البلاء في بَليَّتِهم, واحمدوا الله على العافية »","وعن أبي عمران الجوني, عن أبي الجَلْدِ أن عيسى ابن مريم رحمه الله أوصى الحواريين:","","",["أخرجه أحمد في كتاب الزهد (ص/ 50) رقم (311) ومالك في الموطأ (2/ 986) رقم (8)."],[328],0],[1110,"a","إبراهيم الخواص","","« قال بعضُ أهل المعرفة: لا يطمعُ أحدٌ في السَّهو مع الشِّبَع, ولا يطمعُ في الحزن مع كثرة النوم, ولا يطمع في صحة أمره مع مخالطة الظلمة, ولا يطمع في لين القلب مع فضول الكلام, ولا يطمع في حب الله مع حب المال والشرف, ولا يطمع في الأنس بالله مع الأنس بالمخلوقين, ولا يطمع في الروح مع الرغبة في الدنيا »","وعن إبراهيم الخواص رحمه الله, قال:","","",["الزهد الكبير للبيهقي (ص/ 177) رقم (413)."],[328],0],[1111,"a","إبراهيم النخعي","","« يهلك الناس في خلتين: فضول المال, وفضول الكلام »","وعن إبراهيم النخعي رحمه الله قال:","","",["الصمت لابن أبي الدنيا (ص/ 90) رقم (103)."],[328],0],[1112,"q","الطبري","","« فتأويل الكلام على هذه القراءة: فلعنَّا الذين نقضوا عهدي, ولم يفُوا بميثاقي من بني إسرائيل, بنقضهم ميثاقهم الذي واثقوني …؛ أي: غليظة يابسةً عن الإيمان بي, والتوفيق لطاعتي, منزوعةً منها الرأفةُ والرحمة »","قال الله تعالى: الآية: المائدة: 13, قال ابن جرير الطبري رحمه الله:","","",["تفسير الطبري - جامع البيان (10/ 126) [المائدة: 13]."],[329],0],[1113,"q","القشيري","","« وقسوةُ القلب عقوبة لهم من قبل الله تعالى على ما نقضوه من العهود, ونقض العهد أعظم وزر يلم به العبد, والعقوبة عليه أشد عقوبة يعاقب بها العبد, وقسوة القلب عدم التوجع مما يمتحن به من الصدّ, وعن قريب يمتحن بمحنة الرد بعد الصدّ, وذلك غاية الفراق, ونهاية البعد. ويقال: قسوة القلب أولها فقد الصفوة, ثم استيلاء الشهوة, ثم جريان الهفوة, ثم استحكام القسوة, فإن لم يتفق إقلاع عن هذه الجملة فهو تمام الشقوة »","وقال القشيري رحمه الله:","","",["لطائف الإشارات - تفسير القشيري (1/ 411) [المائدة: 13]."],[329],0],[1114,"q","ابن تيمية","","« فقد أخبر تعالى أنه بترك ما أوجبه عليهم من الميثاق وإن كان واجبًا بالأمر حصلت لهم هذه العقوبات, التي منها فعل هذه المحرمات من قسوة القلوب؛ وتحريف الكلم عن مواضعه؛ وأنهم نسوا حظا مما ذكروا به »","وقال ابن تيمية رحمه الله:","","",["مجموع الفتاوى (20/ 110)."],[329],0],[1115,"q","الشوكاني","","« أي: فبسببِ نقضِهم ميثاقِهِم …؛ أي: طردناهم وأبعدناهم و…؛ أي: صلبةً لا تَعي خيرًا ولا تعقِلُهُ »","قال الشوكاني رحمه الله:","","",["فتح القدير للشوكاني (2/ 26) [المائدة: 13]."],[329],0],[1116,"a","ابن عقيل","","« يا من يجد من قلبه قسوة! احذر أنْ تكون نقضت عهداً! فإن الله عز وجل يقول: الآية: المائدة: 13 »","وقال ابن عقيل رحمه الله, يوماً في وعظِهِ:","","",["كتاب ذم قسوة القلوب للحافظ ابن رجب الحنبلي (ص/ 261)."],[329],0],[1117,"a","الفضيل بن عياض","","« خصلتان تقسِّيان القلب: كثرةُ الكلام, وكثرةُ الأكل »","عن الفضيل بن عياض رحمه الله قال:","","",["أخرجه البيهقي في الزهد الكبير (ص/ 176) رقم (410)."],[248],0],[1118,"q","ابن القيم","","« قسوة الْقلب من أَرْبَعَة أَشْيَاء إِذا جَاوَزتْ قدرَ الْحَاجة: الْأكل, وَالنَّوْم, وَالْكَلَام, والمخالطة »","وقال ابن القيم رحمه الله:","","",["كتاب الفوائد (ص/ 142)."],[248],0],[1119,"a","أبو سليمان الداراني","","« لكلِّ شيءٍ صدأٌ, وصدأُ نورِ القلب شبعُ البطن, وكلُّ ما شغلك عن الله من أهلٍ أو مال أو ولد فهو شؤمٌ »","وقال أبو سليمان الداراني رحمه الله:","","",["البداية والنهاية لابن كثير (10/ 256)."],[248],0],[1120,"a","الجنيد","","« نبني أمرنا هذا على أربع: لا نتكلم إلا عن وجد, ولا نأكل إلا عن فاقة, ولا ننام إلا عن غلبة, ولا نسكت إلا عن خشية »","وقال الجنيد رحمه الله:","","",["الزهد الكبير للبيهقي (ص/ 177) رقم (416)."],[248],0],[1121,"h","النبي ﷺ","أبو هريرة","«لا تُكثِروا الضَّحِكَ, فإنَّ كَثْرةَ الضِّحكِ تُميتُ القلبَ»","عن أبي هريرة رضي الله عنه, قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح ابن ماجه (3400)",["رواه ابن ماجه (4193) والترمذي (2305) وأحمد (8095) وصححه الألباني في صحيح ابن ماجه (3400). وحسنه الوادعي في الصحيح المسند مما ليس في الصحيحين (1387)."],[330],0],[1122,"n","أبو هريرة","","عن أبي هريرة رضي الله عنه, قال: قال رسول الله ﷺ: «لا تُكثِروا الضَّحِكَ, فإنَّ كَثْرةَ الضِّحكِ تُميتُ القلبَ»؛ أي: تجعله قاسيًا لا يتأثر بالمواعظ؛ كالميت؛ أي: تصيره مغمورًا في الظلمات بمنزلة الميت الذي لا ينفع نفسه بنافعة ولا يدفع عنها مكروهًا, وهذا من جوامع الكلم","","","",["شرح سنن ابن ماجه للهرري - مرشد ذوي الحجا والحاجة إلى سنن ابن ماجه (25/ 347)."],[330],0],[1123,"h","النبي ﷺ","أبى هريرة","«أقِلَّ الضحك, فإنَّ كثرةَ الضَّحكِ تميتُ القلبَ»","وعن أبى هريرة رحمه الله قال: قال النبي ﷺ:","حسن","حسنه الألباني في الصحيحة (903)",["أخرجه البخاري في الأدب المفرد (252) وحسنه الألباني في الصحيحة (903)."],[330],0],[1124,"h","النبي ﷺ","أبو هريرة","«اتَّقِ المحارم تكنْ أعبدَ الناس, وارضَ بما قسم الله لك تكنْ أغنى الناس, وأحسِنْ إلى جارك تكن مؤمنًا, وأحِبَّ للناس ما تحبُّ لنفسك تكن مسلمًا, ولا تُكثِر ِالضحك, فإن كثرة الضحك تميت القلب»","وعن أبي هريرة رضي الله عنه, قال: قال رسول الله ﷺ: «من يأخذُ عني هؤلاء الكلماتِ فيعملُ بهن أو يُعلِّمُ من يعملُ بهن؟», فقال أبو هريرة: فقلت: أنا يا رسول الله, فأخذ بيدي فعَدَّ خمسًا, وقال:","حسن","حسنه الألباني في صحيح الترمذي (2305)",["رواه الترمذي (2305) وأحمد (8095) والطبراني في الأوسط (7054) وحسنه الألباني في صحيح الترمذي (2305)."],[330],0],[1125,"q","محمد بن إسماعيل الأمير الصنعاني","","« قوله: «ولا تُكثِرِ الضحك, فإن كثرة الضحك تميت القلب»؛ أي: يخرجه عن حياته, وذلك لأن حياة القلب في استعماله لما خُلق له من معرفةِ الله, والإقبالِ عليه, والسكون إلى ذكره, والتلذُّذِ بمناجاته, فلا حياة له ولا إنارة إلا بهذا, وكثرة الضحك لا تنشأ إلا عن الإعجاب بالأمور الدنيوية, والسرور بها, ووفور محبتها, والرغبة فيها, والقلب لا يتسع إلا لمحبوب واحد, فموت القلب هو خلوه عن ذكر الله, وإنارته بحبه وتعظيمه وخوفه ورجائه, ولما كان البشر لا يخلو عن إعجاب يتولد عنه ضحكه عفى الله عن قليله لطفاً منه بعباده, فلم يجعله مميتًا للقلب »","قال محمد بن إسماعيل الأمير الصنعاني رحمه الله:","","",["التنوير شرح الجامع الصغير (1/ 320)."],[330],0],[1126,"q","الثعلبي","","« وكلّ من صدّ عن سبيل الله وأُطيع في معصيته فهو شيطان لِلْإِنْسانِ خَذُولًا عند نزول البلاء والعذاب به, وحكم هذه الآيات عامّ في كلّ متحابّين اجتمعا على معصية الله »","قال الثعلبي رحمه الله:","","",["تفسير الثعلبي - الكشف والبيان عن تفسير القرآن (7/ 131) [الفرقان: 29]."],[325],0],[1127,"q","القشيري","","« ودليل الخطاب يقتضي سرور المؤمنين بمصاحبة أخدانهم وأحبائهم في الله, وأمّا الكافر فيضلّ صاحبه فيقع معه في الثبور, ولكن المؤمن يهدى صاحبه إلى الرشد فيصل به إلى السرور »","وقال القشيري رحمه الله:","","",["لطائف الإشارات - تفسير القشيري (2/ 634) [الفرقان: 29]."],[325],0],[1128,"h","النبي ﷺ","","«نعم, ومَنْ يحولُ بينه وبين التوبة, انطلِقْ إلى أرضِ كذا وكذا فإن بها أُناسًا يعبدون الله فاعبدِ الله معهم, ولا ترجِعْ إلى أرضك فإنها أرضُ سُوءٍ»","فقال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (3470) ومسلم (2766) واللفظ له."],[325],0],[1129,"q","الغزالي","","« إياك ثم إياك أن تشتغل بجمع المال, فإن فرحك به ينسيك أمر الآخرة, وينزع حلاوة الإيمان من قلبك »","قال أبو حامد رحمه الله:","","",["طبقات الشافعية الكبرى للسبكي (6/ 266)."],[331],0],[1130,"a","سليمان الخواص","","« الذكر للقلب بمنزلة الغذاء للجسم, فكما لا يجد الجسد لذة الطعام مع السقم؛ فكذلك القلب لا يجد حلاوة الذكر مع حب الدنيا - أو كما قال - »","وقال سليمان الخواص رحمه الله:","","",["فتاوى ابن تيمية (9/ 312)."],[331],0],[1131,"q","ابن القيم","","« متى رأيت القلب قد ترحَّل عنه حبُّ الله والاستعداد للقائه, وحلَّ فيه حبُّ المخلوق, والرضا بالحياة الدنيا والطمأنينة بها, فاعلم أنه قد خسف به »","وقال ابن القيم رحمه الله:","","",["بدائع الفوائد (2 /234)."],[331],0],[1132,"a","سهيل بن عبد الله","","« سمعت مالك بن دينار, يقول: حزنك على الدنيا للدنيا يذهب بحلاوة الآخرة من قلبك, وفرحك بالدنيا للدنيا يذهب بحلاوة الآخرة من قلبك »","وعن سهيل بن عبد الله عز وجل, قال:","","",["كتاب الهم والحزن لابن أبي الدنيا (ص/ 32) رقم (٩)."],[331],0],[1133,"q","ابن القيم","","« شَغلوا قُلُوبهم بالدُّنيا, وَلَو شغلوها بِاللَّه وَالدَّار الْآخِرَة لجالَت فِي مَعَاني كَلَامه وآياته المشهودة, وَرجعتْ إِلَى أَصْحَابهَا بِغَرَائِب الحكم وطُرَفِ الْفَوَائِد. وقال أيضًا: إِذا زَهِدَت الْقُلُوبُ فِي مَوَائِد الدُّنْيَا قعدت على مَوَائِد الْآخِرَة بَين أهل تِلْكَ الدعْوَة, وَإِذا رَضِيَتْ بموائد الدُّنْيَا فاتتها تِلْكَ الموائد. وقال أيضًا: لَا تَدْخُلُ محبَّةُ الله فِي قلب فِيهِ حبُّ الدُّنْيَا إِلَّا كَمَا يدْخل الْجملُ فِي سَمِّ الإبرة »","وقال ابن القيم رحمه الله:","","",["كتاب الفوائــد لابن القيم (ص/ 142- 143)."],[331],0],[1134,"q","ابن القيم","","« كَمَا أَن الْبدن إِذا مرض لم ينفع فِيهِ الطَّعَامُ وَالشرَابُ؛ فَكَذَلِك الْقلب إِذا مرض بالشهوات لم تَنْجَعْ فِيهِ المواعظُ. وَقال أيضًا: من أَرَادَ صفاءَ قلبه فليُؤْثِر الله على شَهْوَته. وقال أيضًا: الْقُلُوبُ الْمُتَعَلّقَةُ بالشهوات محجوبةٌ عَن الله بِقدر تعلُّقهَا بهَا »","قال ابن القيم رحمه الله:","","",["المصدر السابق (ص/ 142)."],[332],0],[1135,"s","عبد الله بن عباس","","« إن للحسنة لنورًا في القلب, وضياءً في الوجه, وسِعةً في الرزق, وقوةً في البدن, ومحبةً في قلوب الخلق. وإن للسيئة لَسوادًا في الوجه, وظُلمةً في القلب, ووَهَنًا في البدن, ونقصًا في الرزق, وبُغضًا في قلوب الخلق »","يروى عن ابن عباس رضي الله عنهما أنه قال:","","",["منهاج السنة النبوية (3/ 27)."],[333],1],[1136,"q","ابن القيم","","« وهذا يعرفه صاحب البصيرة ويشهده من نفسه ومن غيره, فما حصل للعبد حالٌ مكروهةٌ قطُّ إلّا بذنبٍ, وما يعفو الله عنه أكثر »","وقال ابن القيم بعد هذا الأثر:","","",["مدارج السالكين (2/ 41)."],[333],0],[1137,"q","ابن القيم","","« ولا ريب أن القلب يصدأ كما يصدأ النحاس والفضة وغيرهما, وجلاؤه بالذكر, فإنه يجلوه حتى يدعه كالمرآة البيضاء, فإذا تُرِكَ صَدِئ, فإذا ذُكِرَ جلاه. وصدأُ القلب بأمرين: بالغفلة والذنب, وجلاؤه بشيئين: بالاستغفار والذكر, فمن كانت الغفلة أغلب أوقاته كان الصدأ متراكباً على قلبه, وصدأه بحسب غفلته, وإذا صدئ القلب لم تنطبع فيه صور المعلومات على ما هي عليه, فيرى الباطل في صورة الحق, والحق في صورة الباطل؛ لأنه لما تراكم عليه الصدأ أَظْلَم فلم تظهر فيه صور الحقائق كما هي عليه. فإذا تراكم عليه الصدأ واسْوَدَّ, ورَكِبَه الرَّانُ فَسَدَ تصوُّره وإدراكه, فلا يقبل حقاً ولا ينكر باطلاً, وهذا أعظم عقوبات القلب. وأصلُ ذلك من الغفلة واتباع الهوى؛ فإنهما يطمسان نور القلب ويعميان بصره. قال تعالى: الآية: الكهف: 28 »","وقال ابن القيم رحمه الله:","","",["الوابل الصيب (ص/ 92)."],[333],0],[1138,"p","","","رأيتُ الذُّنوبَ تميتُ القلوبَ … وقد يورث الذُّلَّ إدمانُها … وتركُ الذنوب حياةُ القلوب … وخَيْرٌ لنفسك عِصيانُها … وهل أفسدَ الدينَ إلا الملو … كُ وأحبارُ سوء ورُهبانُها … وباعوا النفوس ولم يَربَحوا … ولم يغْلُ في البيع أثمانُها … فقد رَتَع القوم في جِيفةٍ … يَبينُ لذي اللُّبِّ خسرانُها","","","",["مدارج السالكين (٤/ 168) والأبيات في ديوان ابن المبارك (ص/ 26) والمجالسة للدينوري (2/ 30)."],[333],0],[1139,"a","المفسرون","","« لما كثرت معاصيهم وذنوبهم أحاطت بقلوبهم. قال الحسن البصري رحمه الله: هو الذنب على الذنب حتى يَعْمَى القلب فيموت »","قال المفسرون:","","",["زاد المسير في علم التفسير لابن الجوزي (4/ 415) [المطفيين: 14]."],[334],0],[1140,"q","ابن الملك","","« هذه الآية مذكورة في حق الكفار لكنْ ذَكَرَها رحمه الله تخويفًا للمؤمنين؛ كي يحترزوا عن كثرة الذنب؛ كيْلا تسْوَدَّ قُلوبُهم كما اسودَّتْ قلوبْ الكفار, ولذا قيل: المعاصي بريد الكفر »","وقال ابن الملك رحمه الله:","","",["مرقاة المفاتيح شرح مشكاة المصابيح (4/ 1623)."],[334],0],[1141,"q","ابن القيم","","« وأصل هذا أنّ القلب يصدأ من المعصية, فإن زادت غلب الصدأ حتى يصير رانًا, ثم يغلب حتى يصير طبعًا وقفلًا وختمًا, فيصير القلب في غشاوة وغلاف. فإن حصل له ذلك بعد الهدى والبصيرة انتكس فصار أعلاه أسفله, فحينئذ يتولّاه عدوّه, ويسوقه حيث أراد »","وقال ابن القيم رحمه الله:","","",["الداء والدواء - الجواب الكافي - ط عطاءات العلم (1/ 148)."],[334],0],[1142,"h","النبي ﷺ","أبو هريرة","«إن المؤمن إذا أَذنبَ كانت نُكتةٌ سوداءُ في قلبه, فإن تاب ونَزَع واستغفرَ, صُقِلَ قلبُه, فإن زاد, زادت, فذلك الرَّانُ الذي ذكره الله في كتابه: الآية: المطففين: 14»","وعن أبي هريرة رضي الله عنه, أن رسول الله ﷺ, قال:","حسن","حسنه الوادعي في الصحيح المسند مما ليس في الصحيحين (1341)",["رواه ابن ماجه (4244) والترمذي (3334) وأحمد (7952). وحسنه الوادعي في الصحيح المسند مما ليس في الصحيحين (1341)."],[334],0],[1143,"q","الملا علي القاري","","« قوله: «في قلبه» أي: كقطرةِ مِدادٍ تَقطُرُ في القرطاس, ويَختلِفُ على حسب المعصية وقدْرِها, والحملُ على الحقيقة أولى من جعله من باب التمثيل والتشبيه حيث قيل: شبَّه القلبَ بثوبٍ في غايةِ النقاء والبياض, والمعصيةَ بشيء في غاية السوادِ أصابَ ذلك الأبيضَ, فبالضرورة أنه يذهبُ ذلك الجمالُ منه, وكذلك الإنسانُ إذا أصابَ المعصيةَ صارَ كأنه حصلَ ذلك السوادُ في ذلك البياضِ. «فإن تاب» أي: من الذنبِ «واستغفر» أي: أناب إلى الرَّبِّ, وليس المُرادُ أنَّ لفظَ الاستغفارِ شرطٌ لِصحةِ التوبة خلافًا لمن توهَّمَه, وإنما المرادُ أنه كمالٌ فيها. «صُقِل قلبُه» المعنى: نظُف وصَفيَ مرآةُ قلبه؛ لأن التوبة بمنزلة المِصْقَلةِ تمحُو وَسَخَ القلب وسوادَه حقيقيًا أو تمثيليًا. «وإن زاد» أي: في الذنب, أي بعينه أو بغيره من الذنوب, «زادت» أي: النكتة السوداء أو يظهر لكل ذنب نُكتة «حتى تعلو» أي النكت «قلبه» أي: تُطفئ نور قلبه؛ فتُعمي بصيرتَه, فلا يُبصر شيئًا من العلوم النافعة والحكم الرائعة, وتزول عنه الشفقة والرحمة على نفسه وعلى سائر الأمة, ويثبت في قلبه آثار الظلمة والفتنة والجراءة على الأذية والمعصية. «فذلكمُ الرَّانُ الذي ذكر الله تعالى» أي: في كتابه »","قال الملا علي القاري رحمه الله:","","",["مرقاة المفاتيح شرح مشكاة المصابيح (4/ 1622- 1623)."],[334],0],[1144,"a","","","« قولوا خيرًا وافعلوا خيرًا ودوموا على صالح ذلك واستكثروا من الخير, واستقلّوا من الشرّ, لا تقسو قلوبكم ولا يطول عليكم الأمَد, الآية: الأنفال: 21 »","وكان الربيع بن خثيم رحمه الله, يقول:","","",["الطبقات الكبير (8/ 307) ومصنف ابن أبي شيبة (34840) بنحوه."],[334],0],[1145,"q","ابن القيم","","« وهو يذكر أضرار الذنوب وعقوباتها: فمنها: الختم على القلوب والأسماع, والغشاوة على الأبصار, والإقفال على القلوب, وجعل الأكِنَّة عليها, والرين عليها والطبع, وتقليب الأفئدة والأبصار, والحيلولة بين المرء وقلبه, وإغفال القلب عن ذكر الربِّ وإنساء الإنسان نفسه, وترك إرادة الله تطهيرَ القلب, وجعل الصدر ضيّقًا حرجًا كأنما يصَّعَّد في السماء, وصرف القلوب عن الحق, وزيادتها مرضًا على مرضها, وإركاسِها ونكسها, بحيث تبقى منكوسة »","وقال ابنُ القيم رحمه الله:","","",["الداء والدواء (ص/ 273-274)."],[334],0],[1146,"a","فهد بن حيان","","« سمعتُ صالحًا المري رحمه الله, يبكي ويقول: يا إخوتاه! ابكو على الذنوب؛ فإنها تَرِين القلوبَ حتى تنطمس, فلا يصلُ إليها من خيرِ الموعظة شيء »","وعن فهد بن حيان رحمه الله, قال:","","",["الرقة والبكاء (ص/ 145) رقم (١٨7)."],[334],0],[1147,"q","المحاسبي","","« اعلم أنَّ الذنوب تورث الغفلة, والغفلة تورث القسوة, والقسوة تورث البعد من الله, والبعد من الله يورث النار, وإنَّما يتفكر في هذا الأحياء, وأما الأموات فقد أماتوا أنفسهم بحب الدنيا »","وقال المحاسبي رحمه الله:","","",["رسالة المسترشدين للمحاسبي (ص/ 155)."],[334],0],[1148,"a","مكحول","","« أرقُّ الناس قلوباً أقلهم ذنوباً »","وقال مكحول رحمه الله:","","",["الزهد لأحمد بن حنبل (ص/ 313) رقم (2283) وحلية الأولياء (5/ 180)."],[334],0],[1149,"n","صحبة الغافلين والأشرار","","فأجاب: أسباب قسوة القلب: الذنوب والمعاصي, وكثرة الغفلة وصحبة الغافلين والفساق, كل هذه الخلال من أسباب قسوة القلوب, ومن لين القلوب وصفائها وطمأنينتها: طاعة الله عز وجل وصحبة الأخيار, وحفظ الوقت بالذكر وقراءة القرآن والاستغفار. ومن حفظ وقته بذكر الله وقراءة القرآن وصحبة الأخيار والبعد عن صحبة الغافلين والأشرار؛ يطيب قلبه ويلين: الآية: الرعد: 28 »","","","",["الدرر الثرية من الفتاوى البازية (ص/ 45)."],[335],0],[1150,"h","النبي ﷺ","أبو سعيد الخدري","«القلوبُ أربعةٌ: قلبٌ أجْرَدُ فيه مثلُ السِّراجِ يَزْهَرُ, وقلبٌ أَغلفُ مربوطٌ على غلافِه, وقلبٌ منكوسٌ, وقلبٌ مُصْفَحٌ, فأما القلبُ الأجْرَدُ: فقلبُ المؤمن سِراجُه فيه نورُه, وأما القلبُ الأغْلَفُ: فقلبُ الكافرِ, وأما القلبُ المنكوسُ: فقلبُ المنافِقِ عرفَ, ثم أنكرَ, وأما القلبُ المُصْفَحُ: فقلبٌ فيه إيمانٌ ونفاقٌ, فمثَلٌ الإيمانِ فيه كمَثَلِ البَقْلةِ يَمُدُّها الماءُ الطيِّبُ, ومثَلُ النفاقِ فيه كمثل القُرْحة يَمُدُّها القَيْحُ والدَّمُ, فأيُّ المَدَّتين غلبتْ على الأخرى غلَبت عليه»","عن أبي سعيد الخدري رضي الله عنه عن النبي ﷺ قال:","صحيح","جود إسناده الشوكاني في فتح القدير (1/ 165) والسيوطي في الدر المنثور (1/ 463)",["أخرجه أحمد في المسند (11129) والطبراني في المعجم الصغير (1075)، وأبو نعيم في الحلية (4/385) باختلاف يسير، وجود إسناده الشوكاني في فتح القدير (1/ 165) والسيوطي في الدر المنثور (1/ 463)."],[336],0],[1151,"s","حذيفة بن اليمان","","« القلوب أربعة: فقلبٌ أجرَدُ فيه سراج يُزْهِر, فذلك قلب المؤمن. وقلبٌ أغلَفُ, فذلك قلب الكافر. وقلبٌ منكوس, فذلك قلب المنافق. وقلبٌ تُمِدُّه مادتان: مادة إيمان, ومادة نفاق, وهو لما غَلَبَ عليه منهما »","وقال حذيفة بن اليمان رضي الله عنه:","صحيح","صححه السفاريني الحنبلي في شرح ثلاثيات المسند (1/ 546)",["الداء والدواء (ص/ 274). وصححه السفاريني الحنبلي في شرح ثلاثيات المسند (1/ 546). والألباني في كتاب الإيمان لابن أبي شيبة (54)."],[336],0],[1152,"a","","","« واعلم أنَّ القلوبَ في الثبات على الخير والشر والتردد بينهما, ثلاثةٌ: القلب الأول: قلبٌ عُمِّرَ بالتقوى, وزُكِّيَ بالرياضة, وطُهِّرَ عن خبائث الأخلاق, فتتفرّج فيه خواطرُ الخير من خزائن الغيب, فيمدّه المَلَكُ بالهدى. القلبُ الثاني: قلبٌ مخذول, مشحونٌ بالهوى, مُنْدَسٌّ بالخبائث, مُلَوَّثٌ بالأخلاق الذميمة, فيقوى فيه سلطانُ الشيطان لاتّساع مكانه, ويضعُفُ سلطان الإيمان, ويمتلئُ القلبُ بدُخان الهوى, فَيُعْدَمُ النور, ويصيرُ كالعين المُمْتَلئة بالدخان, لا يُمكنها النظر, ولا يُؤثّر عنده زجرٌ ولا وعظٌ. والقلب الثالث: قلبٌ يبتدئ فيه خاطرُ الهوى, فيدعوه إلى الشر, فيلحقُه خاطر الإيمان فيدعوه إلى الخير. مثالُه: أن يحملَ الشيطانُ حملةً على العقل, ويُقَوِّي داعيَ الهوى, ويقول: أما ترى فلانًا وفلانًا كيف يطلقون أنفسهم في هواها!! حتى يعدّ جماعةً من العلماء, فتميل النفس إلى الشيطان, فيحمل المَلَكُ حملةً على الشيطان, ويقول: هل هلك إلا من نسي العاقبة, فلا تغتَر بغفلة الناس عن أنفسهم, أرأيتَ لو وقفوا في الصيف في الشمس ولك بيتٌ بارد, أكنتَ توافقهم أم تطلب المصلحة؟ أفتخالفهم في حر الشمس, ولا تخالفهم فيما يؤول إلى النار؟ فتميل النفس إلى قول المَلَك, ويقع التردد بين الجُنْدين, إلى أن يغلب على القلب ما هو أولى به, فمن خُلق للخير يُسّر له, ومن خُلق للشر يُسِّر له: الآية: الأنعام: 125 اللهم وفقنا لما تحبه وترضاه »","وفي مختصر منهاج القاصدين:","","",["محتصر منهاج القاصدين (ص/ 196- 197)."],[336],0],[1153,"q","ابن القيم","","« والقلوب ثلاثة: قلبٌ خالٍ من الإيمان وجميع الخير, فذلك قلب مُظْلِمٌ, قد استراح الشيطان من إلقاء الوساوس إليه؛ لأنه قد اتخذه بيتًا ووطنًا, وتحكَّم فيه بما يريد, وتمكَّن منه غاية التمكُّن. القلب الثاني: قلبٌ قد استنار بنور الإيمان, وأوقد فيه مصباحه, لكن عليه ظلمة الشهوات وعواصف الأهوية, فللشيطان هنالك إقبالٌ وإدبارٌ, ومجاولات ومطامع, فالحرب دُوَلٌ وسِجال. وتختلف أحوال هذا الصنف بالقلة والكثرة, فمنهم مَن أوقات غلبته لعدوه أكثر, ومنهم من أوقات غلبة عدوه له أكثر, ومنهم من هو تارة وتارة. القلب الثالث: قلبٌ مَحْشُوٌّ بالإيمان, قد استنار بنور الإيمان, وانقشعت عنه حجب الشهوات, وأقلعت عنه تلك الظلمات, فَلِنُوره في قلبه إشراق, ولذلك الإشراق إيقادٌ, لو دنا منه الوسواس احترق به. فهو كالسماء التي حُرِسَت بالنجوم, فلو دنا منها الشيطان ليتخطاها رُجِم فاحترق. وليست السماء بأعظم حُرْمَةً من المؤمن, وحراسةُ الله تعالى له أتمُّ من حراسة السماء! والسماء مُتَعَبَّدُ الملائكة, ومُسْتَقَرُّ الوحي, وفيها أنوار الطاعات, وقلبُ المؤمن مُسْتَقَرُّ التوحيد والمحبة والمعرفة والإيمان, وفيه أنوارها, فهو حقيقٌ أن يُحْرَسَ ويُحْفَظَ من كيد العدو, فلا ينال منه شيئًا إلا على غِرَّةٍ وغفلةٍ خَطْفَةً »","","","",["الوابل الصيب (ص/ 52- 56)."],[336],0],[1154,"q","","","«وما يصنع الشيطان بالقلب الخراب؟!»","فإن قلت: من البيت الخالي, كان محالًا؛ لأن البيت الخالي ليس فيه شيء يُسْرَق؛ ولهذا قيل لابن عباس رضي الله عنهما: إن اليهود تزعم أنها لا توسوس في صلاتها, فقال:","","",["أخرج أحمد في الزهد (255)، وأبو نعيم في الحلية (2/ 245)."],[337],0],[1155,"p","","","قال ابن القيم رحمه الله: « وقد مُثِّل ذلك بمثال حسن, وهو ثلاثة بيوت: بيتٌ للمَلِك؛ فيه كنوزه وذخائره وجواهره, وبيتٌ للعبد؛ فيه كنوز العبد وذخائره وجواهره, وليس فيه جواهر الملك وذخائره, وبيتٌ خالٍ صِفْرٌ لا شيء فيه. فجاء اللص ليسرق من أحد البيوت فمن أيها يسرق؟ فإن قلت: من البيت الخالي, كان محالًا؛ لأن البيت الخالي ليس فيه شيء يُسْرَق؛ ولهذا قيل لابن عباس رضي الله عنهما: إن اليهود تزعم أنها لا توسوس في صلاتها, فقال: «وما يصنع الشيطان بالقلب الخراب؟!». وإن قلتَ: يَسْرق من بيت الملك كان ذلك كالمستحيل الممتنع؛ فإنَّ عليه من الحرس واليَزَكِ ما لا يستطيع اللص الدُّنُوَّ منه, كيف وحارسه الملك بنفسه؟! وكيف يستطيع اللص الدُّنُوَّ منه وحوله من الحرس والجند ما حوله؟! فلم يبق لِلِّصِّ إلا البيت الثالث, فهو الذي يّشُنُّ عليه الغارة. فليتأمل اللبيب هذا المثال حقَّ التأمل, ولينزله على القلوب, فإنها على منواله. فقلبٌ خلا من الخير كله, وهو قلب الكافر والمنافق, فذلك بيت الشيطان, قد أحرزه لنفسه واستوطنه, واتخذه سكنًا ومستقرًا, فأي شيء يسرق منه, وفيه خزائنه وذخائره, وشكوكه وخيالاته ووساوسه؟! وقلبٌ قد امتلأ من جلال الله, وعظمته, ومحبته ومراقبته, والحياء منه, فأي شيطان يجترئ على هذا القلب؟! وإنْ أراد سرقة شيء منه فماذا يسرق؟! وغايته أن يظفر في الأحايين منه بخَطْفَةٍ ونَهْبَةٍ, تحصل له على غِرَّةٍ من العبد وغفلةٍ لا بد له؛ إذْ هو بشر, وأحكام البشرية جارية عليه من الغفلة والسهو, والذهول وغلبة الطبع.... وقلبٌ فيه توحيد الله تعالى ومعرفته ومحبته والإيمان به والتصديق بوعده ووعيده, وفيه شهوات النفس وأخلاقها, ودواعي الهوى والطبع. وقلبٌ بين هذين الداعيين: فمرة يميل بقلبه داعي الإيمان والمعرفة, والمحبة لله تعالى وإرادته وحده, ومرة يميل بقلبه داعي الهوى والشيطان والطِّباع, فهذا القلب للشيطان فيه مطمع, وله منه منازلات ووقائع, ويُعْطِي الله النصر لمن يشاء, قال الله تعالى: الآية: آل عمران: 126. وهذا لا يتمكن الشيطان منه إلا بما عنده من سلاحه, فيدخل الشيطان إليه فيجد سلاحه عنده فيأخذه ويقاتله به؛ فإنَّ أسلحته هي الشهوات والشبهات, والخيالات والأماني الكاذبة, وهي في القلب, فيدخل الشيطان فيجدها عنده فيأخذها ويصول بها على القلب؛ فإنْ كان عند العبد عُدَّةٌ عتيدة من الإيمان تقاوم تلك العُدَّةَ وتزيد عليها, انتصف من الشيطان, وإلا فالدُّوْلة لعدوه عليه, ولا حول ولا قوة إلا بالله العليّ العظيم! فإذا أَذِنَ العبدُ لعدوه, وفتح له باب بيته, وأدخله عليه, ومَكَّنه من السلاح يقاتله به, فهو المَلُوم. فنَفْسَك لُمْ ولا تَلُمِ المطايا … ومُتْ كمدًا فليس لك اعتذارُ »","","","",["الوابل الصيب (ص/ 52- 56)."],[337],0],[1156,"a","","","« ومنها: أن الشجرة لا تبقى حيَّةً إلا بمادّةٍ تسقيها وتنميها, فإذا قُطِعَ عنها السقيُ أوشك أن تَيْبَس, فهكذا شجرة الإسلام في القلب, إن لم يتعاهدها صاحبها بسقيها كل وقت: بالعلم النافع, والعمل الصالح, والعَوْدِ بالتذكُّر على التفكُّر, والتفكُّر على التذكُّر, وإلا أوشك أن تيبس! وبالجملة: فالغَرس إن لم يتعاهده صاحبه أوشك أن يهلك؛ ومن هنا تعلم شدة حاجة العباد إلى ما أمر الله به من العبادات على تعاقُب الأوقات, وعظيم رحمته وتمام نعمته وإحسانه إلى عباده بأن وظَّفها عليهم وجعَلَها مادةً لسقي غِراس التوحيد الذي غرسه في قلوبهم. ومنها: أن الغرس والزرع النافع قد أجرى الله سبحانه العادة أنه لا بدَّ أن يخالطه دَغَلٌ ونبتٌ غريب ليس من جنسه, فإن تعاهده ربُّه ونقَّاه وقلَعَه كملَ الغرس والزرع, واستوى, وتمَّ نباته, وكان أوفر لثمرته, وأطيب وأزكى, وإن تركه أوشك أن يغلب على الغِراس والزرع, ويكون الحُكْمُ له, أو يُضعِفَ الأصلَ ويجعل الثمرةَ ذميمة ناقصة بحسب كثرته وقلته, ومن لم يكن له فقهُ نفس في هذا ومعرفةٌ به, فاتَـــه ربحٌ كثير وهو لا يشعر! فالمؤمن دائمًا سعيُه في شيئيـن: سقيِ هذه الشجرة, وتنقيةِ ما حولها؛ فبسقيها تبقى وتدوم, وبتنقيةِ ما حولـها تكمل وتتمّ. والله المستعان, وعليه التّكلان »","","","",["اعلام الموقعين عن رب العالمين (1/ 350)."],[338],0],[1157,"q","ابن القيم","","« المرض نوعان: مرض القلوب, ومرض الأبدان, وهما مذكوران في القرآن. ومرض القلوب نوعان: مرض شبهةٍ وشكٍّ, ومرض شهوةٍ وغيٍّ, وكلاهما في القرآن. قال تعالى في مرض الشُّبهة: الآية: البقرة: 10, وقال تعالى: الآية: المدثر: 31. وقال تعالى في حقِّ من دُعي إلى تحكيم القرآن والسُّنَّة, فأبى وأعرض: الآية: النور: 48-50 فهذا مرض الشُّبهات والشُّكوك. وأمَّا مرض الشَّهوات, فقال تعالى: الآية: الأحزاب: 32, فهذا مرض شهوة الزِّنا, وَاللّهُ أَعْلَمُ »","قال ابن القيم رحمه الله:","","",["زاد المعاد (٤/ ٥)."],[339],0],[1158,"q","ابن قدامة","","« اعلم أنَّ كلَّ عُضوٍ خُلق لفعل خاص, فعلامةُ مرضه أن يتعذَّر منه ذلك الفعلُ, أو يصدر منه مع نوع من الاضطراب, فمرضُ اليد تعذّر البطش, ومرضُ العين تعذّر الإبصار, ومرض القلب أن يتعذّر عليه فعلُه الخاصُّ به الذي خُلِقَ لأجله؛ وهو العلمُ والحكمةُ والمعرفةُ, وحبُّ الله تعالى وعبادتُه, وإيثارُ ذلك على كلِّ شهوة. فلو أن الإنسانَ عرف كلَّ شيءٍ ولم يعرف الله سبحانه, كان كأنَّه لم يعرفْ شيئًا. وعلامةُ المعرفةِ: الحبُّ, فمن عرف الله أحبّه, وعلامةُ المحبة أنْ لا يُؤْثِرَ عليه شيئًا من المحبوبات, فمَن آثرَ عليه شيئًا من المحبوبات فقلبُه مريضٌ, كما أن المعدة التي تُؤْثِرُ أكلَ الطين على أكل الخبز -وقد سقطت عنها شهوةُ الخبز- مريضةٌ. ومرضُ القلب خفيٌّ قد لا يعرفه صاحبُه, فلذلك يغفُلُ عنه, وإنْ عرفه صعُبَ عليه الصبرُ على مرارة دوائه, لأنَّ دواءَه مخالفةُ الهوى, وإن وَجَد الصبرَ لم يجد طبيبًا حاذقًا يعالجه, فإنَّ الأطباءَ هم العُلماءُ والمرضُ قد استولى عليهم, والطبيبُ المريضُ قلَّما يلتفت إلى علاجه, فلهذا صار الداءُ عُضالًا, واندرس هذا العلمُ, وأُنكر طبُّ القلوب ومرضها بالكليّة وأقبل الناسُ على أعمالٍ ظاهرهُا عباداتٌ وباطنُها عاداتٌ فهذه علامة أصل المرض! وأما عافيتُه وعودُه إلى الصحة بعد المعَالجَة, فهو أن ينظر إلى العلّة, فإن كان يعالج داء البُخْل, فعلاجه بذل المال, ولكنه لا يُسرف, ويصير إلى حدّ التبذير فيحصل داءٌ آخرُ, فيكون كمن يعالج البرودَة بالحرارةِ الغالبةِ حتى تغلب الحرارةُ, فيكون داءً أيضًا, بل المطلوب الاعتدال »","وفي مختصر منهاج القاصدين:","","",["مختصر منهاج القاصدين (ص/ 201- 202)."],[339],0],[1159,"q","ابن القيم","","« خرابُ الْقلبِ من الْأَمْنِ والغفلة, وعِمارتُهُ من الخشية وَالذِّكْــرِ »","وقال ابن القيم رحمه الله:","","",["كتاب الفوائد لابن القيم (ص/ 143)."],[339],0],[1160,"q","ابن القيم","","« وكما أن الله سبحانه جعل حياة البدن بالطعام والشراب, فحياة القلب بدوام الذكر والإنابة إلى الله, وترك الذنوب, والغفلةُ الجاثمةُ على القلب والتعلق بالرذائل والشهوات المنقطعة عن قريب يضعف هذه الحياة, ولا يزال الضعف يتوالى عليه حتى يموت. وعلامة موته: أنه لا يعرف معروفًا ولا ينكر منكرًا, كما قال عبد الله بن مسعود رضي الله عنه: أتدرون من ميت القلب الذي قيل فيه: ليس من مات فاستراح بميت … إنما الميت ميت الأحياء؟ قالوا: ومن هو؟ قال: الذي لا يعرف معروفًا ولا ينكر منكرًا. والرجل: هو الذي يخاف موت قلبه, لا موت بدنه. إذْ أكثر هؤلاء الخلق يخافون موت أبدانهم, ولا يبالون بموت قلوبهم, ولا يعرفون من الحياة إلا الحياة الطبيعية, وذلك من موت القلب والروح؛ فإن هذه الحياة الطبيعية شبيهة بالظل الزائل, والنبات السريع الجفاف, والمنام الذي يخيل كأنه حقيقة؛ فإذا استيقظ عرف أنه كان خيالًا, كما قال عمر بن الخطاب رضي الله عنه: لو أن الحياة الدنيا من أولها إلى آخرها, أوتيها رجل واحد ثم جاءه الموت؛ لكان بمنزلة من رأى في منامه ما يسُرُّهُ, ثم استيقظ؛ فإذا ليس في يده شيء. وقد قيل: \"إن الموت موتان: موت
