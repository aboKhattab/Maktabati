له:","","",["سير أعلام النبلاء (10/ 141)."],[20],0],[820,"a","إبراهيم بن صبح البراد","","« دخلنا على المغيرة أبي محمد, وكان إذا تكلم بكى وأبكى, فقال: يا إخوتاه! ابكُو وبكُّوا هذه الأعين والقلوب, فإن الحزين غدًا مسرور, والباكي ضاحك, والخائف آمن, وطويل السَّغَب في الدنيا طويل الشِّبَع في الآخرة, وطويل الظمأ طويل الرِّي عند الله. ألا فتخيَّروا واختاروا, واتقوا أن تُغْبَنوا فتهلكوا. قال: ويبكي, ويبكي الناس »","1- عن إبراهيم بن صبح البرَّاد رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٧٦)."],[259],0],[821,"a","أبو میمون البراد","","« قال رجل للحسن البصري رحمه الله: أوصني. قال: رطِّب لسانك بذكر الله, وندِّ جفونك بالدموع من خشية الله, فقلَّ من طلبتَ لديه خيراً فلم تدركه »","2- عن أبي میمون البرَّاد رحمه الله قال:","","",["المصدر السابق (19)."],[259],0],[822,"a","عبيد الله بن موسى","","« كنا عند حسن بن صالح رحمه الله يومًا, فذكرَ شيئًا, فرقَّ, فبكى رجلٌ, فارتفع صوته, وعلا بكاؤه. فقال رجل من القوم: نعم والله يا أخي! فابكِ هكذا على نفسك, فما خيرُ مَنْ لا يرحم نفسه؟ قال عبيد الله: فكنتُ أسمع الحسن بعد ذلك كثيرًا يردِّدُ هذه الكلمة: ما خيرُ مَنْ لا يرحم نفسه؟. قال: فظننتُ أنه أُعجبَ بها حين سمعها يومئذ »","3- عن عبيد الله بن موسى رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٧٥)."],[259],0],[823,"a","سعيد بن عبد الرحمن النصيبي","","« كان أبو سليمان يبكي عامة دهره. قال: وسمعته يومًا يقول - وكان كثيرًا ما يردِّدُ هذا الكلام: بَكُّوا الذنوب قبل مَحْلِ بكائها, وفرِّغوا القلوب إلا من شُغل حسابها, فبِحَرىً إن كنتم كذلك أن تُدركوا فوات ما قد فات لشؤم التفريط, بالإنابة والمراجعة والإخلاص للربِّ الكريم. وكان يبكي ويقول: وجدناه أكرم مولىً لشرِّ عبيدٍ قال: ثم يبكي ويُبكي »","4- عن سعيد بن عبد الرحمن النصيبي - وكان جارًا لأبي سليمان دُوَيْد اللبَّان - قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٨٢)."],[259],0],[824,"a","ابن أبي الدنيا","","« حدثني محمد, قال: حدثني زيد الخُمُري, قال: حدثني بحر أبو يحيى, قال: سمعتُ عابدًا في بعض السواحل ذاتَ ليلةٍ يبكي, وإخوانُه عنده, فبكوا, فقال: ابكوا بأبي أنتم بكاءَ من علِمَ أنه غير ناجٍ إلا بطول الحزن والبكاء. قال: ثم بكى وقال: مَنْ فيَّض الدمعَ للدنيا فإنَّا … نَسْفَحُ الدمعَ لاقتراف الذنوب قال: فبكى القوم والله بكاءً شديدًا »","5- قال ابن أبي الدنيا:","","",["المصدر السابق (١٨٥)."],[259],0],[825,"h","النبي ﷺ","أبو هريرة","«سبعةٌ يظلهم الله في ظلِّه يوم لا ظلَّ إلا ظلُّه: الإمامُ العادلُ, وشابٌّ نشأ في عبادةِ ربه, ورجلٌ قلبُه معلَّقٌ في المساجد, ورجلان تحابَّا في الله اجتمعا عليه وتفرَّقا عليه, ورجل طلبته امرأة ذاتُ منصبٍ وجمالٍ, فقال إني أخافُ الله, ورجل تصدَّق, أخفى حتى لا تعلمَ شمالُه ما تنفقُ يمينُه, ورجلٌ ذكر الله خاليًا ففاضت عيناه»","عن أبي هريرة رضي الله عنه, عن النبي ﷺ قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (660) ومسلم (1031)."],[260],0],[826,"q","ابن حجر","","« «ذكر الله»؛ أي: بقلبه من التذكُّر, أو بلسانه من الذكر, و «خاليًا»؛ أي: من الخلو لأنه يكون حينئذ أبعد من الرياء, أو المراد خاليًا من الالتفات إلى غير الله ولو كان في ملأ, ويؤيده رواية البيهقي «ذكر الله بين يديه» ويؤيد الأول رواية ابن المبارك وحماد بن زيد «ذكر الله في خلاء»؛ أي: في موضع خال وهي أصح, قوله: «ففاضت عيناه» أي: فاضت الدموع من عينيه, وأسند الفيض إلى العين مبالغة كأنها هي التي فاضت, قال القرطبي رحمه الله: وفيض العين بحسب حال الذاكر وبحسب ما يكشف له, ففي حال أوصاف الجلال يكون البكاء من خشية الله, وفي حال أوصاف الجمال يكون البكاء من الشوق إليه »","قال ابن حجر رحمه الله: قوله:","","",["فتح الباري بشرح صحيح البخاري (2/ 147) حديث رقم (660). وذكر أن النساء يشتركن مع الرجال في الأصناف المذكورة في الحديث."],[260],0],[827,"q","النووي","","« قوله رحمه الله: «ورجل ذكر الله تعالى خاليًا ففاضت عيناه» فيه فضيلة البكاء من خشية الله تعالى, وفضل طاعة السر لكمال الإخلاص فيها »","وقال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (7/ 123) حديث رقم (1031)."],[260],0],[828,"h","النبي ﷺ","أبو أمامة الباهلي","«ليس شيءٌ أحبَّ إلى الله من قَطرتين, وأثرين: قَطرةٌ من دموعٍ في خشية الله, وقَطرةُ دمٍ تُهراقُ في سبيل الله, وأما الأثران: فأثر في سبيل الله, وأثر في فريضة من فرائض الله»","عن أبي أمامة رضي الله عنه, عن النبي ﷺ, قال:","حسن","حسنه الألباني في صحيح الترغيب (3327)",["رواه الترمذي (1669) وحسنه الألباني في صحيح الترغيب (3327)."],[261],0],[829,"q","الملا علي القاري","","« قوله: «قَطرةُ دموعٍ» بجرها على البدل ويجوز رفعها ونصبها؛ أي: قطرةِ بكاءٍ حاصلةٍ «من خشية الله»؛ أي: من شدة خوفه وعظمته المورثة لمحبته.... وقال: «وأما الأثران؛ فأثر في سبيل الله» كخُطوةٍ أو غبار أو جِراحةٍ في الجهاد, أو سوادِ حِبرٍ في طلب العلم. «وأثر في فريضة من فرائض الله» كإشقاقِ اليد والرِّجْلِ من أثر الوضوء في البرد, وبقاء بلل الوضوء في الحرِّ, واحتراقِ الجبهة من حرّ الرَّمضاء التي يسجد عليها, وخُلوفِ فمه في الصوم واغبرارِ قدمه في الحج »","قال الملا علي القاري رحمه الله:","","",["مرقاة المفاتيح شرح مشكاة المصابيح (6/ 2484) حديث رقم (3837)."],[261],0],[830,"q","المباركفوري","","« قوله: «لا يلج» من الولوج؛ أي: لا يدخل «رجل بكى من خشية الله» فإن الغالب من الخشية امتثال الطاعة واجتناب المعصية. «حتى يعود اللبن في الضرع» هذا من باب التعليق بالمحال كقوله تعالى: الآية: الأعراف: 40, «ولا يجتمع غبار في سبيل الله»؛ أي: في الجهاد. «ودخان جهنم» فكأنهما ضدان لا يجتمعان »","قال المباركفوري رحمه الله:","","",["تحفة الأحوذي بشرح جامع الترمذي (5/ 215) حديث رقم (2311)."],[19],0],[831,"h","النبي ﷺ","عبد الله بن عباس","«عينانِ لا تمسُّهما النارُ: عينٌ بكت من خشية الله, وعين باتت تحرسُ في سبيل الله»","وعن ابن عباس رضي الله عنهما, قال: سمعت رسول الله ﷺ يقول:","صحيح","صححه الألباني في صحيح الترمذي (1639)",["رواه الترمذي (1639) والبيهقي في الشعب (796) وصححه الألباني في صحيح الترمذي (1639)."],[19],0],[832,"q","المباركفوري","","« قوله: «عينان لا تمسهما النار»؛ أي: لا تمس صاحبهما, فعبر بالجزء عن الجملة, وعبر بالمس إشارة إلى امتناع ما فوقه بالأولى, وفي رواية «أبدًا» وفي رواية «لا تريان النار», وقوله: «عين بكت من خشية الله», وهي مرتبة المجاهدين مع النفس التائبين عن المعصية سواء كان عالمًا أو غير عالم »","قال المباركفوري رحمه الله:","","",["تحفة الأحوذي بشرح جامع الترمذي (5/ 221) حديث رقم (1639)."],[19],0],[833,"q","الطيبي","","« قوله: «عينٌ بكت من خشية الله» كناية عن العالم العابد المجاهد مع نفسه, كقوله تعالي: الآية: فاطر: 28, حيثُ حصر الخشية فيهم غير متجاوزة عنهم, فحصلت النسبة بين العينين: عين مجاهدة مع النفس والشيطان, وعين مجاهدة مع الكفار, والخوف والخشية مترادفان: قال الشيخ أبو حامد في الإحياء: الخوف سوط الله تعالي يسوق به عباده إلى المواظبة علي العلم والعمل؛ لينالوا بهما رتبة القرب من الله تعالى »","وقال الطيبي رحمه الله:","","",["شرح المشكاة للطيبي (8/ 2647) حديث رقم (3829)."],[19],0],[834,"h","النبي ﷺ","أنس بن مالك","«مَن ذكَر اللهَ ففاضَتْ عيناه مِن خشيةِ اللهِ حتَّى تُصيبَ الأرضَ دموعُه لَمْ يُعذِّبْه اللهُ يومَ القيامةِ»","عن أنس بن مالك رضي الله عنه, عن النبي ﷺ قال:","صحيح","صححه السيوطي في الجامع الصغير (8655) وحسنه المنذري في الترغيب والترهيب (4/190)",["رواه الطبراني في الأوسط رقم (1641) والحاكم (7668)، وصححه السيوطي في الجامع الصغير (8655) وحسنه المنذري في الترغيب والترهيب (4/190)."],[262],0],[835,"a","غاضرة بن قرهد","","« كان فرقد السبخي قد بکی حتى أضرَّ به ذلك البكاء, وتناثرت أشفاره, فقيل له في ذلك؟ فقال: بلغني أن كلَّ عين بكت من خشية الله لا يصيبها لفح النار القيامة, قال: فكان يبكي, ويُبكي أصحابه »","وعن غاضرة بن قرهد رحمه الله, قال:","","",["أخرجه ابن أبي الدنيا في الرقة والبكاء (42)."],[262],0],[836,"a","أبو معشر","","« رأيت عون بن عبد الله في مجلس أبي حازم يبكي ويمسح وجهه بالدموع ويقول: بلغني أن النار لا تمسُّ موضع الدموع »","وعن أبي معشر قال:","","",["أخرجه ابن أبي الدنيا في الرقة والكباء (30)، وأورده ابن الجوزي في صفة الصفوة (2/157)."],[262],0],[837,"h","النبي ﷺ","ثوبان","«طوبى لمن ملك لسانه, ووسعه بيته, وبكى على خطيئته»","عن ثوبان رضي الله عنه قال: قال رسول الله ﷺ:","حسن لغيره","حسنه لغيره الألباني في صحيح الترغيب والترهيب (3332)",["رواه الطبراني في \"الأوسط\" و\"الصغير\"، وحسنه لغيره الألباني في صحيح الترغيب والترهيب (3332)."],[263],0],[838,"h","النبي ﷺ","عقبة بن عامر","«امْلِكْ عَلَيْكَ لِسَانَكَ, وَلْيَسَعْكَ بَيْتُكَ, وَابْكِ عَلَى خَطِيئَتِكَ»","وعن عقبة بن عامر رضي الله عنه, قَالَ: قلت للنبي ﷺ: يا رسول الله, ما النَّجَاةُ؟ قَالَ:","صحيح","هذا حديث حسن",["رواه الترمذي (2406) وقال: هذا حديث حسن. وصححه لغيره الألباني في صحيح الترغيب رقم (3231)."],[263,264],0],[839,"q","الطيبي","","« أي: تعرَّض لما هو سببٌ للزوم البيت من الاشتغال بالله, والمؤانسة بطاعته والخلوة عن الأغيار, وضمن (بكى) معنى الندامة, وعداه بـ (على) أي: اندم على خطيئتك باكيًا »","قال الطيبي رحمه الله:","","",["شرح المشكاة للطيبي (10/ 3124)."],[263,264],0],[840,"a","القاسم بن عبد الرحمن","","« قال رجل لابن مسعود رحمه الله: يا أبا عبد الرحمن, أوصني, قال: ليسعك بيتك, وابك من ذكر خطيئتك, وكف لسانك »","وعن القاسم بن عبد الرحمن قال: قال رجل لابن مسعود رحمه الله:","","",["الرقة والبكاء لابن أبي الدنيا (١٧٠)."],[263,264],0],[841,"q","ابن القيم","","« وقد جاء في هذا الحديث العظيم, الشريفِ القدر, الذي ينبغي لكل مسلم أن يحفظه, فنذكره بطوله لعموم فائدته, وحاجة الخلق إليه, وهو حديث سعيد بن المسيب, عن عبد الرحمن بن سمُرة بن حبيب قال: خرج علينا رسول الله ﷺ, ونحن في صُفَّةٍ بالمدينة, فقام علينا وقال: «إني رأيْتُ البارِحةَ عَجَبًا: رأيتُ رجلًا من أمتي أتاه ملك الموت ليقبض روحَهُ فجاءه بِرُّهُ بوالِديه فردَّ ملك الموت عنه. ورأيتُ رجلًا قد بُسِطَ عليه عذابُ القبر فجاءه وضوؤُه فاستنقذه من ذلك. ورأيتُ رجلًا من أمتي قد احتوشَتْه الشياطين فجاءه ذكرُ الله عز وجل فطرد الشيطان عنه. ورأيتُ رجلًا من أمتي قد احتوشَتْه ملائكة العذاب فجاءته صلاته فاستنقذته من أيديهم. ورأيتُ رجلًا من أمتي يلتهب. وفي رواية: يلهث عَطشًا, كلَّما دنا من حوضٍ مُنِعَ وطُرد, فجاءه صيامه شهر رمضانَ فأسقاهُ وأرْواهُ. ورأيتُ رجلًا من أمتي, ورأيت النبيّين جُلوسًا حِلَقًا حِلَقًا, كلما دنا إلى حَلْقَةٍ طُرِدَ, فجاءه غُسْلُه من الجنابة فأخذ بيده وأقعده إلى جنبي. ورأيت رجلًا من أمتي بين يديه ظُلمة, ومن خلفه ظُلْمَة, وعن يمينه ظًلمة, وعن يساره ظلمة, ومن فوقه ظلمة, ومن تحته ظلمة, وهو متحيِّر فيها, فجاءه حجُّه وعُمرتُه فاستخرجاه من الظلمة, وأدخلاه في النور. ورأيت رجلًا من أمتي يتَّقي بيده وَهَجَ النار وشَرَرها فجاءته صدقته فصارت سُتْرةً بينه وبين النار, وظَلَّلَتْ على رأسه. ورأيتُ رجلًا من أمتي يُكَلِّمُ المؤمنين ولا يُكَلِّمونه, فجاءته صِلَتُه لِرَحِمِه فقالت: يا معشر المسلمين! إنه كان وصولًا لرحمه فكلِّموه, فكلَّمَه المؤمنون وصافحوه وصافحَهُم. ورأيت رجلًا من أمتي قد احتوشته الزبانيَةُ, فجاءه أمره بالمعروف ونهْيُه عن المنكر فاستَنْقَذَهُ من أيديْهِمْ, وأدخله في ملائكة الرحمة. ورأيت رجلًا من أمتي جاثيًا على ركبتيه وبينه وبين الله حجاب, فجاءه حُسْنُ خُلُقِهِ, فأخذ بيده فأدخله على الله عز وجل. ورأيتُ رجلًا من أمتي قد ذهبت صحيفتُه من قِبَل شماله, فجاءه خوفه من الله عز وجل فأخذ صحيفته فوضعها في يمينه. ورأيتُ رجلًا من أمتي خفَّ ميزانُه, فجاءه أفراطُه فثَقَّلُوا ميزانه. ورأيتُ رجلًا من أمتي قائمًا على شفير جهنم, فجاءه رجاؤه من الله فاستنقذه من ذلك ومضى. ورأيتُ رجلًا من أمتي قد هوى في النار, فجاءته دمعته التي بكى من خشية الله عز وجل فاستنقذته من ذلك. ورأيتُ رجلًا من أمتي قائمًا على الصراط يرعد كما ترعد السَّعَفَةُ في ريحٍ عاصف, فجاءه حُسْنُ ظنِّه بالله عز وجل فسكَّن رِعْدَتَه ومضى. ورأيتُ رجلًا من أمتي يَزْحَفُ على الصراط ويحبو أحيانًا, ويتعلق أحيانًا, فجاءته صلاته عليَّ فأقامته على قدميه وأنقذته. ورأيتُ رجلًا من أمتي انتهى إلى أبواب الجنة فغُلِّقت الأبواب دونه, فجاءته شهادة أن لا إله إلا الله, ففتحت له الأبواب وأدخلته الجنة» »","","صحيح","هذا حديث حسن جدا، رواه عن سعيد بن المسيب: عمر بن ذر، وعلي بن زيد بن جدعان، وهلال أبو جبلة",["رواه الحافظ أبو موسى المديني في كتاب «الترغيب في الخصال المنجية والترهيب من الخلال المردية» وبنى كتابه عليه، وجعله شرحًا له، وقال: « هذا حديث حسن جدًا، رواه عن سعيد بن المسيب: عمر بن ذر، وعلي بن زيد بن جدعان، وهلال أبو جبلة. وكان شيخ الإسلام ابن تيمية يعظِّم شأن هذا الحديث، وبلغني عنه أنه كان يقول: شواهد الصحة عليه ». الوابل الصيب (ص/ 199). وقال شيخنا الإمام في كتابه: «أحوال المؤمنين الرضية في الحياة البرزخية، ص/95»: « هذا الحديث قد اختُلف في صحته وعدمها، فقد صححه وعظَّم شأنه عدد من أهل العلم، قال الحافظ أبو موسى: هذا حديث حسن جدًا. وقال أبو عبد الله القرطبي في التذكرة (1/595): هذا حديث عظيم...وضعفه بعضهم كالألباني في ضعيف الجامع الصغير (2086) ثم قال شيخنا حفظه الله: والذي يظهر لي أنه حسَنٌ بالشواهد »."],[263],0],[842,"h","النبي ﷺ","عبد الله بن الشخير","« رأَيْتُ رسولَ اللهِ ﷺ يُصلِّي وفي صدرِه أزيزٌ كأزيزِ المِرجَلِ مِن البكاءِ »","وعن عبد الله بن الشخير رضي الله عنه, قال:","صحيح","صححه ابن رجب في فتح الباري (4/ 245)",["رواه أحمد (16312) وأبو داود (904) والنسائي (1214) وابن حبان (753) وصححه ابن رجب في فتح الباري (4/ 245)."],[156],0],[843,"q","السندي","","« قوله «أزيز» بزاءين معجمتين ككريم, أي: حنين من الخشية. وهو صوت البكاء. قيل: وهو أن يجيش جوفه ويغلي بالبكاء. و«المِرجَل» بكسر الميم؛ إناء يغلى فيه الماء »","قال السندي رحمه الله:","","",["حاشية السندي على النسائي (3/ 13) [حديث: 1214]."],[156],0],[844,"q","أبو حاتم","","« في هذا الخبر بيان واضح أن التحزُّنَ الذي أذن الله عز وجل فيه بالقرآن واستمع إليه هو التَّحزُّن بالصوت مع بدايته ونهايته, لأن بداءته هو العزم الصحيح على الانقلاع عن المزجورات, ونهايته وفور التشمير في أنواع العبادات, فإذا اشتمل التحزُّن على البداية التي وصفتها, والنهاية التي ذكرتها, صار المُتَحزِّن بالقرآن كأنه قذف بنفسه في مِقْلاع القُربة إلى مولاه, ولم يتعلق بشيء دونه »","وقال أبو حاتم رحمه الله:","","",["صحيح ابن حبان (3/ 31) عند حديث رقم (753)."],[156],0],[845,"h","النبي ﷺ","البراء بن عازب","« كنا مع رسول الله ﷺ في جنازة, فجلس على شَفير القبر, فبكى, حتى بلَّ الثَّرى, ثم قال: يا إخواني لمثل هذا فأعدوا »","وعن البراء بن عازب رضي الله عنه, قال:","حسن","حسنه الألباني في صحيح الترغيب (3338)",["رواه ابن ماجه (4195). وحسنه الألباني في صحيح الترغيب (3338)."],[156],0],[846,"h","النبي ﷺ","أنس بن مالك","« شهدنا بنتًا لرسول الله ﷺ, قال: ورسولُ الله ﷺ جالسٌ على القبر, قال: فرأيتُ عينيه تدمعان, قال: فقال: «هل منكم رجلٌ لم يُقارِف الليلةَ؟» فقال أبو طلحة: أنا, قال: «فانزل». قال: فنزل في قبرها »","وعن أنس بن مالك رضي الله عنه قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (1285)."],[156],0],[847,"h","النبي ﷺ","أنس بن مالك","«أخذ الراية زيد فأصيب, ثم أخذها جعفر فأصيب, ثم أخذها عبد الله بن رواحة فأصيب - وإنَّ عيني رسول الله ﷺ لتذْرِفان - ثم أخذها خالد بن الوليد من غير إمرة ففتح له»","وعن أنس بن مالك رضي الله عنه قال: قال النبي ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (1246)."],[156],0],[848,"q","ابن القيم","","« وأما بكاؤه رحمه الله فكان من جنس ضحكه, لم يكن بشهيق ورفع صوت, كما لم يكن ضحكه بقهقهة, ولكن كان تدمع عيناه حتى تهمُلا, ويُسمَع لصدره أزيز. وكان بكاؤه تارةً رحمةً للميت, وتارةً خوفًا على أمته وشفقةً, وتارةً من خشية الله, وتارةً عند سماع القرآن وهو بكاءُ اشتياقٍ ومحبَّةٍ وإجلالٍ مصاحبٍ للخوف والخشية. ولما مات ابنه إبراهيم دمعت عيناه, وبكى رحمةً له, وقال: «تدمَع العينُ ويحزَن القلبُ, ولا نقول إلا ما يُرضي ربَّنا؛ وإنَّا بك يا إبراهيم لمحزونون». وبكى لمَّا شاهد إحدى بناته, ونفسُها تفيض. وبكى لما قرأ عليه ابنُ مسعود سورة النساء, وانتهى فيها إلى قوله تعالى: الآية: النساء: 41 وبكى لما مات عثمان بن مظعون. وبكى لما كسَفت الشمسُ, فصلَّى صلاة الكسوف؛ وجعل يبكي في صلاته وينفخ ويقول: «ربِّ ألم تعِدْني أنْ لا تعذِّبَهم وأنا فيهم وهم يستغفرون؟ ونحن نستغفرك», وبكى لما جلس على قبر إحدى بناته. وكان يبكي أحيانًا في صلاة الليل »","قال ابن القيم رحمه الله:","","",["زاد المعاد (1/ 125)."],[265],0],[849,"h","النبي ﷺ","عائشة أم المؤمنين","« أن أبا بكر رضي الله عنه أقبل على فرس من مسكنه بالسُّنح, حتى نزل فدخل المسجد, فلم يكلمِ الناس حتى دخل على عائشة, فتيمَّمَ رسول الله ﷺ وهو مُغَشَّىً بثوبِ حِبَرَةٍ, فكشف عن وجهه ثم أكبَّ عليه فقبَّلَه وبكى, ثم قال: بأبي أنت وأمي, والله لا يجمع الله عليك موتتين, أما الموتة التي كتبت عليك فقد مُتَّهَا »","وعن عائشةَ أمِّ المؤمنين رحمه الله:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (4453)."],[239],0],[850,"q","الشوكاني","","« قوله: (فقبله) فيه جواز تقبيل الميت تعظيمًا وتبُّركًا؛ لأنه لم يُنقل أنه أنكرَ أحدٌ من الصحابة على أبي بكر فكان إجماعًا. قوله: (حتى رأيت الدموع. . . إلخ) فيه جواز البكاء على الميت »","قال الشوكاني رحمه الله:","","",["نيل الأوطار (4/ 32)."],[239],0],[851,"h","النبي ﷺ","أوسط بن إسماعيل البجلي","«عليكم بالصدق, فإنه مع البر وهما في الجنة, وإياكم والكذبَ, فإنه مع الفجور وهما في النار, وسلوا الله المعافاة, فإنه لم يؤتَ أحدٌ بعد اليقين خيرًا من المعافاة, ولا تحاسدوا, ولا تباغضوا, ولا تقاطعوا, ولا تدابروا, وكونوا عباد الله إخوانًا »","وعن أوسط بن إسماعيل البجلي رحمه الله, أنه سمع أبا بكر رضي الله عنه, حين قُبض النبي ﷺ يقول: قام رسول الله ﷺ في مقامي هذا عامَ الأوَّلِ, ثم بكى أبو بكر, ثم قال:","صحيح","صححه الألباني في صحيح ابن ماجه (٣١١٨) وحسنه الوادعي في الصحيح المسند مما ليس في الصحيحين (٧٠٦)",["رواه ابن ماجه (3849) وأحمد في المسند (5) وصححه الألباني في صحيح ابن ماجه (٣١١٨) وحسنه الوادعي في الصحيح المسند مما ليس في الصحيحين (٧٠٦)."],[239],0],[852,"h","النبي ﷺ","أنس بن مالك","« قال أبو بكر رضي الله عنه, بعد وفاة رسول الله ﷺ, لعمر رحمه الله: انطلق بنا إلى أم أيمن نزورها, كما كان رسول الله ﷺ يزورها, فلما انتهينا إليها بكَتْ. فقالا لها: ما يبكيك؟ ما عند الله خيرٌ لرسوله ﷺ, فقالت: ما أبكي أنْ لا أكون أعلم أن ما عند الله خير لرسوله ﷺ, ولكن أبكي أن الوحي قد انقطع من السماء. فهيجتهما على البكاء. فجعلا يبكيان معها »","وعن أنس رضي الله عنه, قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (2454)."],[239],0],[853,"n","عمر بن الخطاب","","عن عليٍّ رضي الله عنه قال: بعثني رسول الله ﷺ والزُّبيرَ بن العوام وأبا مَرْثَدٍ الغَنَويَّ, وكلُّنا فارسٌ, فقال: «انطلقوا حتى تأتوا روضة خاخ؛ فإن بها امرأةً من المشركين معها صحيفةٌ من حاطبِ بنِ أبي بَلْتَعةَ إلى المشركين», قال: فأدركناها تسيرُ على جمَلٍ لها حيثُ قال لنا رسول الله ﷺ, قال: قلنا: أين الكتابُ الذي معك؟ قالت: ما معي كتاب. فأنَخْنَا بها فابتَغينا في رحلِها, فما وجدنا شيئًا, قال صاحباي: ما نرى كتابًا, قال: قلت: لقد علمتُ ما كذب رسولُ الله ﷺ, والذي يُحلفُ به لتُخرِجِنَّ الكتابَ أو لأجردنَّكِ, قال: فلما رأتِ الجِدَّ مني أهوَتْ بيدِها إلى حُجْزَتِها وهي محتجِزَةٌ بكِساءٍ, فأخرجتِ الكتاب, قال فانطلقنا به إلى رسول الله ﷺ, فقال: «ما حملك يا حاطب على ما صنعت؟» قال: ما بي إلا أن أكون مؤمنًا بالله ورسوله, وما غيرتُ ولا بدَّلتُ, أردتُ أن تكون لي عند القوم يدٌ يَدفعُ الله بها عن أهلي ومالي, وليس من أصحابك هناك إلا وله من يدفعُ الله به عن أهله وماله, قال: «صدق, فلا تقولوا له إلا خيرًا», قال: فقال عمر بن الخطاب رضي الله عنه: إنه قد خان الله ورسوله والمؤمنين, فدعني فأضرب عنقه, قال: فقال: «يا عمر, وما يدريك؟ لعل الله قد اطلع على أهل بدر فقال: اعملوا ما شئتم فقد وجبت لكم الجنة». قال: فدمعت عينا عمر وقال: الله ورسوله أعلم","","","",["رواه البخاري (6259)."],[266],0],[854,"h","النبي ﷺ","عمر بن الخطاب","«أما ترضى أن تكون لهم الدنيا ولنا الآخرة»"," رأسه وسادة من أَدَم حشْوُها لِيفٌ, وإن عند رجليه قَرَظًا مصبُوبًا, وعند رأسه أَهَبٌ مُعلَّقة, فرأيت أثَّر الحصير في جنبه فبَكَيْتُ, فقال: «ما يبكيك», فقلت: يا رسول الله, إن كسرى وقيصر فيما هما فيه, وأنت رسول الله, فقال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (4913)."],[266],0],[855,"h","النبي ﷺ","أنس بن مالك","« دخلت على رسول الله ﷺ, وهو مضطجع على سرير مُرْمَلٌ بشريطٍ, وتحت رأسه وسادة من أَدَمٍ, حشوها لِيفٌ, فدخل عليه نفرٌ من أصحابه, ودخل عمر رضي الله عنه, فانحرف رسول الله ﷺ, انْحِرَافةً فلم يَرَ عمرُ بين جنبِه وبين الشَّريطِ ثوبًا, وقد أثَّر الشريطُ بجنب النبي ﷺ, فبكى عمر رضي الله عنه, فقال له النبي ﷺ: «ما يبكيك يا عمر؟» قال: والله ما أبكي إلا أن أكون أعلم أنك أكرم على الله من كسرى, وقيصر, وهما يعيثان في الدنيا فيما يعيثان فيه, وأنت يا رسول الله, بالمكان الذي أرى. فقال النبي ﷺ: «أما ترضى أن تكون لهم الدنيا ولنا الآخرة؟» قال عمر: بلى, قال: «فإنه كذاك» »","وعن أنس بن مالك رضي الله عنه, قال:","صحيح لغيره","صححه لغيره شعيب الأرناؤوط في تخريج المسند (12417)",["أخرجه أحمد (12417) والبخاري في الأدب (1163) وابن أبي عاصم في الزهد (223) وابن حبان (6362) وصححه لغيره شعيب الأرناؤوط في تخريج المسند (12417)."],[266],0],[856,"s","عبد الله بن عباس","","« كان عمر رضي الله عنه إذا صلَى صلاةً جلَس, فمن كانت له حاجةٌ كلَّمه, ومن لم تكن له دخلَ, فصلى ذات يوم فلم يجلس, قال: فجئت فقلت: يا يرفأُ, بأميرِ المؤمنين شكوى؟ قال: لا والحمد لله, قال: فجاء عثمان رضي الله عنه فجلس, فلم يلبثْ أن جاء يرفأُ فقال: قم يا ابنَ عفَّانَ, قم يا ابنَ عباسٍ, فدخلنا على عمر رضي الله عنه, وعنده صَبْرةٌ من المال, على كل صَبرةٍ منها كَثْفٌ, فقال: إني نظرت في أهل المدينة فوجدتكما أكثرَ أهلِ المدينة عشيرةً, فخذا هذا المال فاقتسماه, فإن بقي شيء فردَّاه. فأما عثمان رضي الله عنه فحَثا, وأما أنا فقلت: وإن نقَصَ شيء أتممتَه لنا؟ قال: شِنْشِنَةٌ من أَخْزَمَ, أما ترى هذا كان عند الله, ومحمدٌ وأصحابُه يأكلون القَدَّ؟ قال: قلت: بلى والله لقد كان هذا عند الله ومحمد ﷺ وأصحابه يأكلون القد, ولو فُتِحَ هذا على محمد ﷺ صَنعَ غير الذي تصنعُ, قال: فكأنه فزع منه, فقال: وما كان يصنع؟ قلت: لأكل وأطعمنا, قال: فنشج حتى اختلفت أضلاعه, وقال: لوددت أني خرجت منها كَفافًا, لا عليَّ ولا ليَ »","وعن ابن عباس رضي الله عنهما:","","",["أخرجه البيهقي في السنن الكبرى (6/ 583) حديث رقم (13038)."],[266],0],[857,"s","عبد الله بن عباس","","« طلبني عمر, فأتيته, فإذا بين يديه نِطْعٌ - بساط من جلد - عليه الذهب منقور, فقال: اذهب فاقسم هذا بين قومك؛ واللهُ أعلم حين حبس هذا عن نبيِّه, وعن أبي بكرٍ, ألخيرٍ أعطاني أم لشرٍّ. قال: ثم سمعتُ البكاء, فإذا صوتُ عمر يبكي, ويقول في بكائه: كلا والذي نفسي بيده, ما حبس اللهُ هذا عن نبيِّه وعن أبي بكر لشرٍّ لهما, وأعطاه عمرَ إرادةَ الخيرِ به »","وعن ابن عباس رضي الله عنهما, قال:","حسن","حسنه ابن حجر في المطالب العالية (3/ 366)",["الرقة والبكاء لابن أبي الدنيا (٤١٩-٤٢٠). وحسنه ابن حجر في المطالب العالية (3/ 366)."],[266],0],[858,"n","","","وعن عون بن أبي جُحيفة, عن أبيه قال: « جاء قوم إلى عمر يشكون الجَهْد, فأرسل عينيه بأربعٍ","","","",["أي: بدمع غزير، جرى من نواحي عينيه الأربعة، لسان العرب (8/ 99)."],[266],0],[859,"a","","","« جاء قوم إلى عمر يشكون الجَهْد, فأرسل عينيه بأربعٍ, ورفع يديه ثم قال: اللهم لا تجعل هلَكَتَهم على يدي. ثم أمر لهم بطعام »","وعن عون بن أبي جُحيفة, عن أبيه قال:","","",["أخرجه الدار قطني في كتاب الأفراد (ص/ 167) حديث رقم (24)."],[266],0],[860,"a","","","« ما أقدمك؟ قال: قدمت لأتعلم التشهد, فبكى عمر حتى ابتلت لحيته, ثم قال: والله إني لأرجو من الله أن لا يعذبك أبدًا »","ورُوي أن رجلًا قدم من الشام إلى عمر رضي الله عنه فقال:","","",["بدائع الصنائع في ترتيب الشرائع - لأبي بكر الكاساني الحنفي (1/ 2)."],[266],1],[861,"h","النبي ﷺ","هانئ مولى عثمان","« كان عثمانُ بن عفان رضي الله عنه إذا وقف على قبرٍ يبكي حتى يَبُلَّ لحيتَه, فقيل له: تذكرُ الجنةَ والنارَ ولا تبكي, وتبكي من هذا؟ قال: إن رسول الله ﷺ, قال: «إن القبرَ أولُ منازل الآخرة, فإن نجا منه, فما بعده أيسرُ منه, وإن لم ينجُ منه, فما بعده أشدُّ منه» قال: وقال رسول الله ﷺ: «ما رأيتُ منظرًا قطُّ إلا والقبرُ أفظعُ منه» »","عن هانئ مولى عثمان, قال:","حسن","حسنه الألباني في تخريج مشكاة المصابيح (128) وصححه شعيب الأرناؤوط في تخريج المسند (454)",["رواه ابن ماجه (4267) والترمذي (2308) وأحمد (454) وحسنه الألباني في تخريج مشكاة المصابيح (128) وصححه شعيب الأرناؤوط في تخريج المسند (454)."],[267],0],[862,"s","عائشة أم المؤمنين","","« مكث آل محمد ﷺ أربعة أيام ما طعموا شيئًا, حتى تضاغَوا صبيانَهم, فدخل عليَّ النبي ﷺ, فقال: «يا عائشة, هل أصبتم بعدي شيئًا؟» فقلت: من أين إن لم يأتِنا اللهُ به على يدِكَ؟ فتوضأ وخرج مُستَحِثًّا, يصلي هاهنا مرة وهاهنا مرة يدعو! قالت: فأتانا عثمانُ من آخرِ النَّهار, فاستأذن, فهممتُ أنْ أَحجُبَه, ثم قلت: هو رجل من مَكاثيرِ المسلمين, لعلّ الله إنما ساقه إلينا؛ ليُجريَ لنا على يديه خيرًا, فأذنتُ له, فقال: يا أمتاه, أين رسولُ الله ﷺ؟ فقلتُ: يا بُنيّ, ما أُطعم آلُ محمدٍ من أربعةِ أيامٍ شيئًا, فدخل رسول الله ﷺ مُتَغيرًا ضامرَ البَطنِ, فأخبَرَتْهٌ بما قال لها, وبما ردَّتْ عليه, فبكى عثمان رضي الله عنه, ثم قال: مَقتًا للدنيا. ثم قال: يا أمَّ المؤمنين, ما كنت بحقيقةٍ أن ينزِل بكِ مثلُ هذا, ثم لا تذكُريه لي, ولِعبد الرحمنِ بنِ عوفٍ, ولِثابت بن قيسٍ, ونظائرِنا من مكاثيرِ المسلمين. ثم خرج, فبعث إلينا بأحمالٍ من الدقيق, وأحمالٍ من الحِنطة, وأحمالٍ من التَّمر, وبِمَسْلُوخٍ, وبثلاثِمائةِ دِرهمٍ في صُرَّةٍ, ثم قال: هذا يُبطئُ عليكم. فأتى بخُبز وشِواءٍ كثيرٍ, فقال: كلوا أنتم هذا, واصنعوا لرسول الله ﷺ حتى يجيء, ثم أقسم عليَّ أنْ لا يكونَ مثل هذا إلا أعلمتُه إياه. قالت: ودخل رسول الله ﷺ, فقال: «يا عائشة, هل أصبتم شيئًا بعدي؟» قالت: نعم, يا رسول الله, قد علمتُ أنك إنما خرجت تدعو الله, وقد علمتُ أن الله لم يَرُدَّكَ عن سؤالك. قال: «فما أصبتم؟» قلت: كذا وكذا حِمْلَ بعيرٍ دقيقًا, وكذا وكذا حِملَ بعير حِنْطةً, وكذا وكذا حمل بعير تمرًا, وثلاثُمائة درهم في صُرةٍ, وخُبزٌ, وشِواءٌ كثيرٌ. فقال: «ممن؟» فقلت: من عثمان بن عفان, دخل علي, فأخبرتُه؛ فبكى, وذكر الدنيا بمَقْتٍ, وأقسم عليَّ أنْ لا يكون فينا مثلُ هذا إلا أَعلمتُهُ, قالت: فما جلسَ النبي ﷺ حتى خرج إلى المسجد, ورفع يديه, وقال: «اللهم إني قد رضيت عن عثمان؛ فارض عنه» »","وعن عائشة رضي الله عنها, قالت:","","",["أخرجه ابن شاهين شرح مذاهب أهل السنة (ص/ 136) رقم (98) وأبو نعيم في فضائل الخلفاء الأربعة (32) وابن عساكر (39/ 52- 53) وذكره المتقي الهندي في كنز العمال (36217)."],[267],0],[863,"h","النبي ﷺ","عبد الله بن عباس","«أما ترضى أن تكون منّي بمنزلة هرون من موسى؟, إلا أنك لست بنبي, إنه لا ينبغي أن أذهب إلا وأنت خليفتي»","عن ابن عباس رضي الله عنهما, في حديث طويل وفيه: وخرج النبي ﷺ بالناس في غزوة تبوك, قال: فقال له علي: أَخْرُجُ معك؟, قال: فقال له نبي الله ﷺ: «لا», فبكى عليٌّ رضي الله عنه, فقال له النبي ﷺ:","صحيح","صححه العلامة أحمد محمد شاكر في تحقيق المسند (3062) وأصله في الصحيحين",["أخرجه أحمد في المسند (3062) والطبراني في الكبير (12593) والحاكم في المستدرك (4652) وصححه العلامة أحمد محمد شاكر في تحقيق المسند (3062) وأصله في الصحيحين."],[268],0],[864,"a","نافع","","« كان عبد الله بن عمر رضي الله عنهما, إذا قرأ هذه الآية: الآية: الحديد: 16 بكى حتى يغلبه البكاء »","عن نافع رحمه الله, قال:","","",["أخرجه ابن أبي شيبة في المصنف (7/ 118) حديث رقم (34647)."],[269],0],[865,"a","القاسم بن أبي بزة","","« حدثني من سمع ابن عمر رضي الله عنهما, قرأ قوله تعالى: الآية: المطففين: 1 فلما بلغ: الآية: المطففين: 6 بكى, حتى خر وامتنع من قراءة ما بعده »","وعن القاسم بن أبي بَزَّةَ, قال:","","",["أخرجه وكيع في كتاب الزهد (ص/ 252) حديث رقم (27)."],[269],0],[866,"s","أبو سلمة بن عبد الرحمن بن عوف","","« التقى عبد الله بن عمر وعبد الله بن عمرو بن العاصي رحمه الله, على المروة, فتحدَّثا, ثم مضى عبد الله بن عمرو, وبقي عبد الله بن عمر يبكي, فقال له رجل: ما يبكيك يا أبا عبد الرحمن؟ قال: - هذا يعني عبد الله بن عمرو - زعم أنه سمع رسول الله ﷺ يقول: «من كان في قلبه مثقال حبة من خردل من كبر, أكبه الله على وجهه في النار» »","وعن أبي سلمة بن عبد الرحمن بن عوف, قال:","صحيح","صححه شعيب الأرناؤوط في تخرج المسند (7015) والوادعي في الصحيح المسند مما ليس في الصحيحين (800)",["رواه أحمد (7015) والبيهقي في شعب الإيمان (7805) وصححه شعيب الأرناؤوط في تخرج المسند (7015) والوادعي في الصحيح المسند مما ليس في الصحيحين (800)."],[269],0],[867,"a","العوام بن حوشب","","« رُئيَ ابنُ عمر رضي الله عنه, في حلقة عبيد بن عمير - وكان من أبلغ الناس - يبكي, حتى بلَّ الحصى بدموعه »","وعن العوام بن حوشب رحمه الله, قال:","","",["أخرجه ابن أبي الدنيا في الرقة والبكاء (113)."],[269],0],[868,"a","زيد بن وهب","","« جاء رجلان إلى عبد اللَّه بن مسعود رضي الله عنه, قد اختلفا في آية, فقرأها أحدهما, فقال عبد الله: أحسنتَ, من أقرأك؟ قال: أقرأني أبو حكيم المُزَني, واستقرأ الآخرَ, فقال: أحسنت, من أقرأك؟ فقال: أقرأني عمر بن الخطاب, قال: فبكى عبد الله حتى خَضَبَ دُموعُه الحصى, ثم قال: اقرأ كما أقرأك عمر, ثم دوَّر دارةً بيده, ثم قال: إن عمر كان حصنًا حصينًا للإسلام, يدخل الناس فيه ولا يخرُجُون منه, فلما مات عمر انثلم الحصن, فالناس يخرجون منه ولا يدخلون فيه »","عن زيد بن وهب رحمه الله, قال:","","",["أخرجه ابن أبي شيبة في المصنف (18/ 33) رقم (34176) وعبد الرزاق في المصنف (14129) واللفظ له."],[270],0],[869,"s","عبد الله بن مسعود","","« لما نفى عثمان أبا ذر إلى الربذة, وأصابه بها قدره, لم يكن معه أحد إلا امرأته وغلامه, فأوصاهما أن اغسلاني وكفِّناني, ثم ضعاني على قارعة الطريق, فأول ركب يمرُّ بكم فقولوا: هذا أبو ذر صاحب رسول الله ﷺ, فأعينونا على دفنه. فلما مات فعلا ذلك به, ثم وضعاه على قارعة الطريق, وأقبل عبد الله بن مسعود رضي الله عنه, في رهطٍ من أهل العراق عمّار, فلم يرعهم إلا بالجنازة على ظهر الطريق, قد كادت الإبل تطؤها, وقام إليهم الغلام. فقال: هذا أبو ذر صاحب رسول الله ﷺ, فأعينونا على دفنه, قال: فاستهل عبد الله بن مسعود رضي الله عنه يبكي ويقول: صدق رسول الله ﷺ: «تمشي وحدك, وتموت وحدك, وتبعث وحدك», ثم نزل هو وأصحابه فواروه, ثم حدَّثهم عبد الله بن مسعود حديثه, وما قال له رسول الله ﷺ في مسيره إلى تبوك »","وعن محمد بن كعب القرظي رحمه الله, عن عبد الله بن مسعود رضي الله عنه, قال:","حسن","قال ابن كثير: إسناده حسن",["سيرة ابن هشام (2/ 524) وتاريخ الطبري (3/ 107) ودلائل النبوة للبيهقي (5/ 222)، وقال ابن كثير: إسناده حسن. السيرة النبوية لابن كثير (4/ 15)."],[270],0],[870,"h","النبي ﷺ","أنس بن مالك","عن أنس بن مالك رضي الله عنه: أنَّ نبي الله ﷺ قال لأبي بن كعب رحمه الله: «إن الله أمرني أن أُقرئك القرآن», قال: آللهُ سمَّاني لك؟ قال: «نعم», قال: وقد ذكرتُ عند رب العالمين؟ قال: «نعم», فذرفَتْ عيناه","عن أنس بن مالك رضي الله عنه: أنَّ نبي الله ﷺ قال لأبي بن كعب رحمه الله: «إن الله أمرني أن أُقرئك القرآن», قال: آللهُ سمَّاني لك؟ قال: «نعم», قال: وقد ذكرتُ عند رب العالمين؟ قال: «نعم», فذرفَتْ عيناه","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (4961) ومسلم (799)"],[271],0],[871,"q","النووي","","« أما بكاؤه رحمه الله فبكاء سرور واستصغار لنفسه عن تأهيله لهذه النعمة, وإعطائه هذه المنزلة, والنعمة فيها من وجهين: أحدهما: كونه منصوصًا عليه بعينه, ولهذا قال: (وسماني؟) معناه: نص عليَّ بعيني, أو قال: اقرأ على واحد من أصحابك, قال: (بل سماك), فتزايدت النعمة. والثاني: قراءة النبي ﷺ؛ فإنها منقبة عظيمة له لم يشاركه فيها أحد من الناس, وقيل: إنما بكى خوفًا من تقصيره في شكر هذه النعمة »","قال النووي رحمه الله:","","",["شرح مسلم (16/ 21) حديث (799)."],[271],0],[872,"a","عطاء بن أبي رباح","","« حدثتني فاطمة امرأة عمر بن عبد العزيز رحمه الله, أنها دخلت عليه, فإذا هو في مصلَّاه يدُهُ على خدِّهِ, سائلة دموعه, فقلت: يا أمير المؤمنين! ألِشيءٍ حَدَث؟ قال: يا فاطمةُ! إني تقلَّدتُ أمر أُمَّةِ محمد, فتفكرت في الفقير الجائع, والمريض الضائع, والعاري المجهود, والمظلوم المقهور والغريب المأسور, والكبير, وذي العيال, في أقطار الأرض. فعلمتُ أن ربي سيسألني عنهم, وأن خصْمَهُم دونَهم محمد ﷺ فخشيت ألا تثبت لي حُجَّةٌ عند خصومته, فرَحِمْتُ نفسي فبكيتُ »","عن عطاء بن أبي رباح رحمه الله, قال:","","",["تاريخ دمشق لابن عساكر (45/ 197) وسير أعلام النبلاء (5/ 132)."],[272],0],[873,"a","عبد السلام","","« بكى عمر بن عبد العزيز رحمه الله يومًا فبكت فاطمة, فبكى أهل الدار, لا يدري هؤلاء ما أبكى هؤلاء, فلما تجلى عنهم العَبَرُ, قالت فاطمة: بأبي أنت يا أمير المؤمنين مم بكيتَ؟ قال: ذكرت يا فاطمة مُنْصَرَفَ القوم من بين يدي الله فريق في الجنة وفريق في السعير, قال: ثم صَرَخَ وغُشيَ عليه »","وعن عبد السلام, مولى مسلمة بن عبد الملك قال:","","",["حلية الأولياء وطبقات الأصفياء (5/ 269)."],[272],0],[874,"a","سفيان","","« كان عمر بن عبد العزيز رحمه الله يومًا ساكتًا وأصحابه يتحدثون, فقالوا له: مالك لا تتكلم يا أمير المؤمنين؟ قال: كنت مفكرًا في أهل الجنة كيف يتزاورون فيها, وفي أهل النار كيف يصطرخون فيها, ثم بكى »","وعن سفيان قال:","","",["التخويف من النار والتعريف بحال دار البوار- ابن رجب (4/ 132)."],[272],0],[875,"a","مالك","","« لما عُزِلَ عمرُ بن عبد العزيز رحمه الله, عن المدينة يعني في سنةِ ثلاثٍ وتسعين وخرَج منها التَفتَ إليها وبَكَى, وقال لمولاه: يا مُزاحمُ, نخشى أن نكونَ ممن نفَتِ المدينةُ. يعني أن المدينةَ تنفي خَبَثَها كما ينفي الكيرُ خبَثَ الحديد, وتَنصَعُ طِيبَها, قال ابن كثير رحمه الله: قلت: خرج من المدينة فنزل بمكانٍ قريبٍ منها يقال له: السويداء حينًا, ثم قدَم دمشق على بني عمه »","وقال الإمام مالك رحمه الله:","","",["البداية والنهاية (12/ 683)."],[272],0],[876,"a","القاسم بن محمد","","« كنا نسافر مع ابن المبارك رحمه الله, فكثيرًا ما كان يخطر ببالي, فأقول في نفسي: بأيِّ شيءٍ فُضِّلَ هذا الرجل علينا حتى اشتهر في الناس هذه الشهرة؟ إنْ كان يصلي إنَّا لنصلي, ولئن كان يصوم إنَّا لنصوم, وإنْ كان يغزو فإنَّا لنغزو, وإنْ كان يحج إنَّا لنحجّ. قال: فكنّا في بعض مسيرنا في طريق الشام ليلةً نتعشَّى في بيتٍ إذ طفِئَ السراجُ, فقام بعضنا, فأخذ السراج وخرج يستصبح فمكث هنيهة, ثم جاءَ بالسّراج, فنظرتُ إلى وجه ابن المبارك ولحيته قد ابتلّت من الدموع, فقلت في نفسي: بهذه الخشية فُضِّل هذا الرجل علينا, ولعله حين فَقَدَ السراج فصار إلى الظلمة ذكر النار. قال المروزي رحمه الله: وسمعت أبا عبد الله بن حنبل رحمه الله قال: ما رفع الله ابن المبارك إلا بخبيئة كانت له »","عن القاسم بن محمد ﷺ, قال:","","",["صفة الصفوة (2/ 330)."],[273],0],[877,"a","لثابت","","« ما أشبه عينيك بعيني رسول الله ﷺ! قال: فبكى ثابت حتى عَمَشَتْ عيناه »","عن حماد بن سلمة رحمه الله؛ أن أنس بن مالك رضي الله عنه قال لثابت رحمه الله:","","",["المجالسة وجواهر العلم للدينوري (2/ 270)."],[274],0],[878,"a","حماد بن زيد","","« رأيت ثابتًا البُناني رحمه الله يبكي حتى تختلف أضلاعه »","وعن حماد بن زيد رحمه الله, قال:","","",["ميزان الاعتدال للذهبي (1/ 362)."],[274],0],[879,"a","هشام","","« ما رأيت قط أصبر على طول المقام والسهر من ثابت البناني رحمه الله, صحبناه مرة إلى مكة فكنا إن نزلنا ليلاً فهو قائم يصلي, وإلا فمتى شئت أن تراه أو تحس به مستيقظاً ونحن نسير إما باكياً وإما تالياً »","وعن هشام رحمه الله, قال:","","",["صفة الصفوة (2/ 155)."],[274],0],[880,"a","حميد","","« بينما الحسن البصري رحمه الله, في يوم من رجبٍ في المسجد وهو يمُصُّ ماءً ويَمُجُّه تنفَّس تنفُّسًا شديدًا, ثم بكى حتى رُعِدَتْ منكباه, ثم قال: لو أن بالقلوب حياةً, لو أن بالقلوب صلاحًا, لأبكيتكم من ليلةٍ صبيحتُها يوم القيامة, إن ليلةً تمخَّضُ عن صبيحة يوم القيامة, ما سمع الخلائق بيوم قطُّ أكثرَ فيه عورةٌ باديةٌ, ولا عينٌ باكية من يوم القيامة »","عن حميد رحمه الله, قال:","","",["الزهد لأحمد بن حنبل (ص/ 209) رقم (1445)."],[275],0],[881,"a","منصور بن زاذان","","« كان الحسن ربما بكى حتى نَرِقَّ له »","وعن منصور بن زاذان رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٣٣)."],[275],0],[882,"a","عبيد الله بن العيزار","","« ما رأيت الحسن إلا صارًّا بين عينيه, عليه كآبة, كأنه رجلٌ أُصيب بمصيبة, فإن ذَكَر الآخرة, أو ذُكِرت بين يديه جاءت عيناه بأربع »","وعن عبيد الله بن العيزار رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٣٤)."],[275],0],[883,"a","يحيى بن دينار","","« كان الحسن إذا تكلم شفى النفوس من إسبال الدموع. قال: وما قعدتُ إليه يوماً قطُّ إلا بكيتُ حتى اشتفيت »","وعن يحيى بن دينار رحمه الله, قال:","","",["المصدر السابق (٢٣٩)."],[275],0],[884,"a","عبد الواحد بن زيد","","« لو رأيتَ الحسن إذا أقبل لبكيتَ لرؤيته من قبل أن يتكلم! ومن ذا الذي كان يرى الحسن فلا يبكي؟ ومن كان يقدر يملك نفسه عن البكاء عند رؤيته؟ ثم بكى عبد الواحد بكاءً شديدًا »","وعن عبد الواحد بن زيد رحمه الله, قال:","","",["المصدر السابق (٢٤٠)."],[275],0],[885,"a","الهيثم بن عبيد الصيد الصيرفي","","« سمعت أبي يقول: أتيتُ الحسن سنةً, فما أخطأني يومٌ آتيه إلا وأنا أرى دموعه تجري على لحيته! »","وعن الهيثم بن عبيد الصيد الصيرفي رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٤٣)."],[275],0],[886,"a","سهيل بن عبد الله القطعي","","« صلى بنا مالك بن دينار العصر, فلما سلَّم عضَّ على إصبعه, فلم تزل عيناه تدمعان حتى غابت الشمس! »","عن سهيل بن عبد الله القطعي رحمه الله, قال:","","",["تاريخ دمشق لابن عساكر (56/ 411)."],[276],0],[887,"a","مالك بن دينار","","« لو ملكتُ البكاء لبكيتُ أيام الدنيا, ولولا أن يقول الناس مجنون لوضعت التراب على رأسي, ثم نُحتُ على نفسي في الطرق والأحياء حتى تأتيني منيتي, ثم بكى »","وعن مالك بن دينار رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٦٥)."],[276],0],[888,"a","سرار أبي عبيدة","","« عاتِبْ عطاءً في كثرة البكاء. فعاتبته, فقال لي: يا سرَّار كيف تعاتبني في شيء ليس هو إليَّ؟ إني إذا ذكرتُ أهل النار وما ينزل بهم من عذاب الله وعقابه, تمثَّلت لي نفسي بهم, فكيف بنفس تُغَلُّ يدها إلى عنقها, وتُسحب إلى النار ألَّا تصيح وتبكي؟ وكيف لنفس تُعَذَّب ألا تبكي؟ ويحك يا سرَّار! ما أقل غَناءَ البكاء عن أهله إن لم يرحمهم الله! قال: فسكتُّ عنه »","عن سرَّار أبي عبيدة, قال: قالت لي امرأةُ عطاء السَّليمي:","","",["محاسبة النفس لابن أبي الدنيا (ص/ 131)."],[277],0],[889,"a","صالح المري","","« قلت لعطاء السَّليمي رحمه الله: ما تشتهي؟ فبكى ثم قال: أشتهي والله يا أبا بشر, أن أكون رمادًا لا تجتمع منه سُفَّةٌ أبدًا في الدنيا ولا في الآخرة. قال صالح: فأبكاني والله, وعلمت أنه إنما أراد النجاة من عَسَرِ يوم الحساب »","وعن صالح المُرِّي رحمه الله, قال:","","",["صفة الصفوة (2/ 195)."],[277],0],[890,"a","","","« ما تشتهي؟ قال: أشتهي أن أبكي حتى لا أقدر على أن أبكي! قال: فكان يبكي الليل والنهار, وكانت دموعه الدهرَ سائلةً على وجهه »","وقيل لعطاء السليمي رحمه الله:","","",["الزهر الفائح في ذكر من تنزه عن الذنوب والقبائح لابن الجزري (ص/ 21)."],[277],0],[891,"a","جعفر بن سليمان","","« دخل رجلان على عطاء السليمي, فوجداه يبكي. فقال أحدهما لصاحبه: أمَّا هذا فسيبكي ثلاثة أيام ولياليهن, قال: فخرجا وتركاه »","وعن جعفر بن سليمان رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٢٣)."],[277],0],[892,"a","حفص بن غياث","","« كنا ذات يومٍ عند ابن ذر وهو يتكلم, فذكر رواجف القيامة وزلازلها وأهوالها, وشدة الأمر يومئذ هناك, قال: واستبكى ابنُ ذر, وبكى الناسُ يومئذ بكاءً شديدًا, قال: فوثب رجل من بني عجل يقال: له: \"ورَّاد\" - ورَّاد العجلي- فجعل يبكي, ويصرخ, ويضطرب, حتى هدأ, قال: ثم حُمل من بين القوم صريعًا, قال: فجعل ابن ذر يومئذ يبكي, ويقول: ليس كلُّنا قد أتاه الأمان من الله يا ورَّاد غيرك! ليس كلنا قد أيقن بالنجاة من النار غيرك, وتالله أيها الناس ما أخو بني عجل بأولى بالخوف من الله منا ومنكم, وما منا أحدٌ إلا على مثل حاله بين خوفٍ ورجاء, وإنا فيما نَدَبنا الله إليه من طاعته لمشتركون جميعًا, فما الذي قَصر بنا وأسرع به؟ وكَلَم قلبه حتى أبكاه, فأخرجه إلى ما رأيتم من مخافة الله؟ وكلنا قد سمع الموعظة وفهم التذكرة, فلم يكن من أحدٍ منا سواه لذلك حرَّكه, ولم تَنبِض من أحد منا في ذلك خارجة. والله إنْ هذا يا أخا بني عجل إلا من صفاء قلبك, وتراكم الذنوب على قلوبنا, وما أُرانا نؤتى إلا من أنفسنا, قال: ثم بكى ابنُ ذر, وقرأ الآية: الآية: إبراهيم: 11. قال عمر بن ذر: قال أبي: كنت أرى ورَّادًا العجلي يأتي المسجد مقنَّع الرأس, فيعتزل ناحيةً, فلا يزال مصليًا, وداعيًا, وباكيًا كم شاء الله من النهار, ثم يخرج, ثم يعود فيصلي الظهر, فهو كذلك بين صلاة, ودعاء, وبكاء حتى يصلي العشاء, ثم يخرج لا يكلم أحدًا, ولا يجلس إلى أحد, فسألت عنه رجلًا من حيِّه, ووصفتُه له؛ قلت: شابٌّ من صفته, من هيئته. قال: بخٍ يا أبا عمر! تدري عمَّن تسأل؟ ذاك ورَّاد العجلي, الذي عاهد الله أنْ لا يضحك حتى ينظر إلى وجه رب العالمين! قال أبي: فكنتُ إذا رأيتُه بعدُ هبتُه »","عن حفص بن غياث رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٦٨-٢٦٨)."],[278],0],[893,"a","عمر بن حفص بن غياث","","« وحدثني سُكَيْن بنُ مسكين - رجل من بنى عجل - قال كانت بيننا وبين ورَّاد قرابة؛ فسألت أختًا كانت له أصغر منه, فقلت: كيف كان ليله؟ قالت: يبكي عامَّة الليل ويصرخ, قلت: فما كان طُعمه؟ قالت: قرصٌ في أول الليل, وقرصٌ في آخره عند السَّحر! قلت: فتحفظين من دعائه شيئًا؟ قالت: نعم, كان إذا كان السحر, أو قريبٌ من طلوع الفجر؛ سجد, ثم بكى, ثم قال: مولاي! عبدك يحبُّ الاتصال بطاعتك فأعنه عليها بتوفيقك, يا أيها المنَّان, مولاي! عبدك يحبُّ اجتناب سخطك فأعنه على ذلك بمنِّك أيها المنان, مولاي! عبدك عظيمُ الرجاء لخيرك, فلا تقطع رجاءه يوم يفرح بخيرك الفائزون, قالت: فلا يزال على هذا ونحوه حتى يُصبح! قالت: وكان قد كَلَّ من الاجتهاد جدًّا وتغير لونه. قال سُكين: فلما مات ورَّاد فحُمل إلى حفرته, نزلوا إليه ليدفنوه في حفرته, فإذا اللحد مفروش بالريحان, فأخذ بعض القوم الذين نزلوا إلى القبر من ذلك الريحان شيئًا فمكث سبعين يومًا طريًّا لا يتغيَّر, يغدو الناس ويروحون ينظرون إليه, قال: فكثر الناس في ذلك حتى خاف الأمير أن يفتتن الناس, فأرسل إلى الرجل, فأخذ ذلك الريحان, وفرَّق الناس, قال: وفقده الأمير من منزله, لا يدري كيف ذهب »","وقال عمر بن حفص بن غياث رحمه الله:","","",["صفة الصفوة (2/ 93) والرقة والبكاء لابن أبي الدنيا (٢٧٠-٢٧١)."],[278],0],[894,"a","الفضل بن دكين","","« كان حسن بن صالح إذا نظر إلى جنازة أرسل عينيه بأربع قال: ودخلنا معه مرةً نعود مريضًا, فنظرتُ إليه يبكي حتى جرت دموعه على لحيته »","عن الفضل بن دكين رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٩٣)."],[279],0],[895,"a","عيسى بن هارون بن أبي شيبة","","« سمعت حسن بن صالح يقول بعد طلوع الفجر في بيته: وا أهوالاه! فلو كان هولًا واحدًا لكفى, ولكنها أهوال شتى, ثم زَفرَ »","وعن عيسى بن هارون بن أبي شيبة رحمه الله, عن عم له كان يكثر مجالسة حسن بن صالح قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٩٤)."],[279],0],[896,"a","خلف بن تميم","","« أن حسن بن صالح كان يصلى إلى السَّحَر, ثم يجلس فيبكى في مصلاه, ويجلس عليٌّ أخوه, فيبكى معه في حُجرته, قال: وكانت أمهما تبكي الليل والنهار, قال: فماتت, ثم مات عليٌّ, ثم مات حسن, قال: فرأيت حسَنًا في منامي, فقلت: ما فعلت الوالدة؟ قال: بُدِّلت بطول ذلك البكاء سرور الأبد, قلت: وعليٌّ؟ قال: وعليٌّ على خير, قلت: فأنت؟ فمضى, وهو يقول: وهل نتَّكل إلا على عفوه »","وعن خلف بن تميم:","","",["صفة الصفوة (٣/١٥٥)."],[279],0],[897,"a","عبد النور بن يزيد بن أبان الرقاشي","","« كان أبي يبكي, ويقول لأصحابه: ابكوا اليوم قبل الداهية الكبرى! ابكوا اليوم قبل أن تبكوا غدًا! ابكوا اليوم قبل يوم لا يُغني فيه البكاء! ابكوا على التفريط أيام الدنيا, قال: ثم يبكي حتى يُرفَعَ صريعًا من مجلسه »","عن عبد النور بن يزيد بن أبان الرقاشي رحمه الله, قال:","","",["تاريخ دمشق لابن عساكر (65/ 87)."],[280],0],[898,"a","هشام بن حسان","","« بكى يزيد الرقَّاشي أربعين عامًا حتى تساقطت أشفاره, وأظلمت عيناه, وتغيَّرت مجاري دموعه »","وعن هشام بن حسان رحمه الله, قال:","","",["تاريخ الإسلام للذهبي (8/ 303)."],[280],0],[899,"a","عبد الله بن رجاء","","« بكى يزيد الرقاشي أربعين عامًا لا يكاد تَرْقَأ له دمعة! فكان إذا قيل له ذلك قال: إنما الأسف على أنْ لا أكون تقدمتُ في البكاء! »","وعن عبد الله بن رجاء رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٦٢)."],[280],0],[900,"a","فضالة الشحام","","« سمعت يزيد الرقاشي, يقول في كلامه: أَمِنَ أهلُ الجنة من الموت فطاب لهم العيش, وأمِنوا من الأسقام فهنيئًا لهم في جوار الله طول المُقام, قال: ثم يبكي حتى يبل لحيته بالدموع »","وعن فضالة الشحام رحمه الله, قال:","","",["تهذيب الكمال في أسماء الرجال للحافظ المزي (32/ 73)."],[280],0],[901,"a","نسير بن ذعلوق","","« كان الربيع بن خثيم يبكي حتى تبتلّ لحيته من دموعه, ويقول: أدركنا قومًا كنّا في جنوبهم لصوصًا »","عن نُسَيْر بن ذُعلوق رحمه الله, قال:","","",["كتاب الطبقات الكبير لابن سعد (8/ 309)."],[281],0],[902,"a","سفيان","","« بلَغنا أنَّ أمَّ الربيع بن خثيم, كانت تنادي ابنها الربيع فتقول: يا بني يا ربيع, ألا تنام فيقول: يا أمه! من جن عليه الليل وهو يخاف البيات حق له أنْ لا ينام, قال: فلما بلغ ورأت ما يلقى من البكاء والسهر نادته فقالت: يا بني لعلك قتلت قتيلًا؟ فقال: نعم يا والده قد قتلت قتيلًا, قالت: ومن هذا القتيل يا بني حتى يتحمل على أهله فيعفون؟ والله لو يعلمون ما تلقى من البكاء والسهر بعد لقد رحموك, فيقول: يا والده, هي نفسي »","وعن سفيان رحمه الله, قال:","","",["حلية الأولياء وطبقات الأصفياء (2/ 114)."],[281],0],[903,"a","سعيد بن الفضيل القرشي","","« كان محمد بن واسع نازلًا في العُلو, وكان قومٌ يسكنون في داره في السُّفل, قال: فحدثني بعضهم قال: كان يبكي عامة الليل, لا يكاد يَفْتُر, قال: ثم يُصبح, فإنما يَكْشِر في وجوه أصحابه »","عن سعيد بن الفضيل القرشي - مولى بني زُهرة -, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٢٦)."],[282],0],[904,"a","نسيب لهشام القردوسي","","« قال رجل: دخلنا على محمد بن واسع, فقالت عِلْجة في داره؛ فذكرت كلمات بالأعجمية معناها: هذا رجل إذا جاء الليل لو كان قتل أهلَ الدنيا ما زاد »","وعن نَسيبٍ لهشام القُرْدوسي قال:","","",["صفة الصفوة (2/ 158)."],[282],0],[905,"a","مطر الوراق","","« ما اشتهيت أن أبكي قط حتى أشتفي إلا نظرتُ إلى وجه محمد بن واسع رحمه الله, وكنت إذا نظرت إلى وجهه كأنه قد ثَكِلَ عشرةً من الحزن »","وقال مطر الوراق رحمه الله, قال:","","",["المنتظم في تاريخ الملوك والأمم لابن الجوزي (7/ 204)."],[282],0],[906,"a","القاسم الأعرج","","« كان سعيد بن جبير رحمه الله يبكي بالليل حتى عمش »","1- سعيد بن جبير رحمه الله: عن القاسم الأعرج رحمه الله, قال:","","",["الثقات لابن حبان (4/ 276) وحلية الأولياء (٤/٢٧٢) والزهد لأحمد بن حنبل (ص/300)."],[283],0],[907,"a","","","« قال ابن أبي الدنيا: حدثني محمد, قال: حدثنا سعيد بن عامر, قال: حُدِّثتُ أن بديلًا العقيلي بكى حتى ذهب بصره »","2- بُديل بن ميسرة العُقيلي رحمه الله:","","",["الرقة والبكاء (١٩٨)."],[283],0],[908,"a","بشر بن منصور","","« بكى بُديل العُقيلي حتى قَرِحت مآقيه, فكان يُعاتَبُ في ذلك, فيقول: إنما أبكي خوفًا من طول العطش يوم القيامة »","وعن بشر بن منصور رحمه الله, قال:","","",["صفة الصفوة (2/ 157)."],[283],0],[909,"a","زائدة بن قدامة","","« كان منصور بن المعتمر رحمه الله, إذا رأيتَه قلتَ: رجل قد أصيب بمصيبة منكس الطرف, منخفض الصوت, رطب العينين, إن حركته جاءت عيناه بأربع, ولقد قالت له أمه يوماً: ما هذا الذي تصنع بنفسك؟ تبكي الليل عامته لا تكاد تسكت, لعلك يا بني أصبت نفساً لعلك قتلت قتيلاً, قال: فيقول: يا أماه أنا أعلم ما صنعت بنفسي »","3- منصور بن المعتمر السلمي رحمه الله: عن زائدة بن قدامة رحمه الله, قال:","","",["المصدر السابق (2/ 66)."],[283],0],[910,"a","سلام أبي الأحوص","","« كانت عين منصور - بن المعتمر - قد تقبَّضت من كثرة البكاء »","وعن سلام أبي الأحوص, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٠٠)."],[283],0],[911,"a","عطاء بن جبلة","","« سألوا أم منصور بن المعتمر عن عمله؟ فقالت: كان ثلث الليل يقرأ, وثلثه يبكي, وثلثه يدعو »","وعن عطاء بن جبلة رحمه الله, قال:","","",["صفة الصفوة (2/ 66)."],[283],0],[912,"a","شاذ بن","","« بكى هشام الدَّسْتُوائي حتى فسدت عينُه, فكانت مفتوحة, وهو لا يكاد يُبصر بها »","4- هشام الدَّسْتُوائي رحمه الله: عن شاذ بن فيَّاض اليشكري, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٩٥)."],[283],0],[913,"a","سعيد بن عامر","","« كان هشام بن أبي عبد الله -الدستوائي- قد أظلم عليه بصره من طول البكاء, فكنت تراه ينظر إليك فلا يعرفك إلا أن تكلمه! »","وعن سعيد بن عامر, قال:","","",["المصدر السابق (١٩٩)."],[283],0],[914,"a","قبيصة بن عقبة السوائي","","« كانت عينا مالك بن مغول رطبةً جدًّا, وكان يقال في ذلك الزمان: إنه طويل البكاء, قال: وربما رأيتُه يُحدِّث والدموعُ على لحيته جارية »","5- مالك بن مغول رحمه الله: عن قبيصة بن عقبة السُّوائي رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٩٢)."],[283],0],[915,"a","قتادة","","« كان زياد بن مطر العدوي قد بكى حتى عَمِيَ, وبكى ابنُه العلاء بن زياد بعده حتى عَشِيَ بصرُه, قال: وكان إذا أراد أن يتكلم أو يقرأ, جهش بالبكاء »","6- زياد بن مطر العدوي رحمه الله: عن قتادة, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٨٧)."],[283],0],[916,"a","عمر بن ذر","","« قلتُ لأُسيد الضبِّي: قد أفسد البكاء عينيك. قال: فَمَهْ؟ قلت: لو قصَّرتَ قليلًا, قال: إنْ أتاني أمانٌ من الله من دخول النار؟ قال: ثم غُشي عليه »","7- أُسيد الضبِّي رحمه الله: عن عمر بن ذر, قال:","","",["الكنى والأسماء للدولابي (3/ 1050)."],[283],0],[917,"q","أبو نعيم","","« كان العلاء بن عبد الكريم قد بكى حتى فسدت عينُه من كثرة ما يبكي »","8- العلاء بن عبد الكريم رحمه الله: عن أبي نعيم, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٨٩)."],[283],0],[918,"a","شهاب بن عباد","","« رأيتُ بهيمًا أبا بكرٍ العِجليِّ, وكان قد بكى حتى سقطت أشفاره, وكان رطب العينين جدًا. فقلت لابن أخٍ له: ما شأنه يَمَسُّ عينيه كثيرًا؟ قال: قد فسدت من كثرة ما يبكي, فهي تحكُّه وتَضربُ عليه »","9- بَهيم أبو بكر العِجلي رحمه الله: عن شهاب بن عبَّاد, قال:","","",["صفة الصفوة (٣/١٧٩)."],[283],0],[919,"a","سلامة العابدة","","« بكت عبيدة بنت أبي كلاب أربعين سنة, حتَّى ذهب بصرُها! فقيل لها: ما تشتهين؟ قالت: الموت, قيل: ولم ذاك؟ قالت إنّي أخشى كل يوم أصبح أن أجني على نفسي جناية يكون فيها عطبي أيام الآخرة »","10- عبيدة بنت أبي كلاب رحمه الله: عن سُلامة العابدة, قالت:","","",["أخرجه البيهقي في شعب الإيمان (1/ 518)."],[283],0],[920,"a","مسمع بن عاصم","","« انطلقت أنا وعبد العزيز بن سلمان إلى ناشرة بن سعيد الحنفي - وكان قد بكى حتى أظلمت عيناه -, فاستأذنا عليه, فأذن لنا فدخلنا؛ فسلم عليه عبد العزيز, فقال له ناشرة: أبو محمد؟ قال: نعم. قال: ما جاء بك؟ قال: نبكى معك على ما تقدَّم من سالف الذنوب, قال: فشهق شهقة خر مغشيًّا عليه, وجلس عبد العزيز يبكي عند رأسه, قال: وتنادى أهلُه, فجعلوا يبكون حوله وهو صريع بينهم, فلما رأيتُ البكاءَ قد كثُر انسللتُ فخرجتُ »","11- ناشرة بن سعيد الحنفي رحمه الله: عن مسمع بن عاصم قال:","","",["صفة الصفوة لابن الجوزي (٣/٣٨٢) وأوله في الرقة والبكاء لابن أبي الدنيا (٢٠٤)."],[283],0],[921,"a","غاضرة بن قرهد","","« كان فرقد السبخي قد بكى حتى أضرَّ ذلك البكاء بعينيه, وتناثرت أشفاره »","12- فرقد السبخي رحمه الله: عن غاضرة بن قرهد, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٠٥) والشفر: هو أصل منبت الجفن، ويطلق على شعر الجفن أيضًا."],[283],0],[922,"a","كلاب بن جري","","« رأيتُ شابًا ببيت المقدس قد عَمِش من طولٍ البكاء, فقلت له: يا فتى! كم تكون العينُ سليمةً على هذا البكاء؟ قال: فبكى, ثم قال: كما شاء ربي فلتكن, وإذا شاء سيدي فلتذهبْ, فليست بأكرمَ عليَّ من بدني! إنما أبكي رجاء السُّرور والفرح في الآخرة؛ وإن تكنِ الأخرى فهو والله شقاءُ الدهر وحُزْنُ الأبدِ, والأمرُ الذي كنتُ أخافُه وأحذَرُه على نفسي, وإني احتسبتُ على الله عزوجل غفلتي في نفسي وتقصيري في حظي, ثم غُشي عليه »","13- الشاب المقدسي رحمه الله: عن كِلاب بن جُرَي قال:","","",["محاسبة النفس لابن أبي الدنيا (ص/ 127)."],[283],0],[923,"a","بشر بن المنذر","","« رأيت الأوزاعي كأنه أعمى من الخشوع! »","14- الأوزاعي رحمه الله: قال بشر بن المنذر رحمه الله:","","",["سير أعلام النبلاء (7/ 119)."],[283],0],[924,"a","عفير بن عفان","","« حدَّثتني أمي قالت: دخلتُ على امرأةِ الأوزاعيِّ؛ فرأيتُ الحصير الذي يصلي عليه مبلولًا, فقلت: يا أختي أخاف أن يكون الصبي بال على الحصير! فبكت, وقالت: ذلك دموع الشيخ »","وعن عفير بن عفان رحمه الله, قال:","","",["تاريخ دمشق لابن عساكر (35/ 196)."],[283],0],[925,"s","عبد الله بن عيسى","","« كان في وجه عمر بن الخطاب رضي الله عنه خطَّان أسودانِ من البكاء »","1- الفاروق رضي الله عنه: عن عبد الله بن عيسى, قال:","","",["حلية الأولياء (١/٥١)."],[284],0],[926,"a","أبو رجاء العطاردي","","« كان هذا الموضع من ابن عباس- أي مجرى الدموع, كأنه الشراك البالي من الدمع »","2- ابن عباس رضي الله عنهما: عن أبي رجاء العطاردي رحمه الله, قال:","","",["حلية الأولياء (٢/٣٠٧)، والزهد للإمام أحمد (271)."],[284],0],[927,"a","","","« كان عمر بن عبد العزيز قد بكى حتى أثَّرت الدموع بوجهه »","3- عمر بن عبد العزيز رحمه الله: عن عبد الرحمن بن أسلم, عن أبيه, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢١٤)."],[284],0],[928,"a","جعفر -بن سليمان الضبعي","","« سمعتُ مالك بن دينار, يقول: يا إخوتاه! والله لو ملكتُ البكاء لبكيتُ أيام الدنيا, قال: وكان قد بكى حتى اسودَّ طريق الدموع في خدِّه »","4- مالك بن دينار رحمه الله: عن جعفر -بن سليمان الضَّبَعي-, قال:","","",["المصدر السابق (٢١٧)."],[284],0],[929,"a","زهير السلولي","","« كان يزيد الرقّاشي قد بكى حتى أحرقتِ الدموعُ مجاريها من وجهه »","5- يزيد الرقاشي رحمه الله: عن زهير السلولي رحمه الله, قال:","","",["صفة الصفوة (٣/٢٩٠)."],[284],0],[930,"a","موسى بن صالح القريعي","","« رأيت مجاري الدموع في خدِّ عُتبة الغلام منسلخة, ورأيت عليه إزارًا وكمَّا »","6- عُتبة الغلام رحمه الله: عن موسى بن صالح القريعي - من أهل البصرة - قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢١٥)."],[284],0],[931,"q","ابن تيمية","","« كان عتبة الغلام سأل ربه ثلاث خصال: صوتاً حسناً, ودمعاً غزيراً, وطعاماً من غير تكلف, فكان إذا قرأ بكى, وأبكى ودموعه جارية دهره, وكان يأوي إلى منزله, فيصيب فيه قوته, ولا يدري من أين يأتيه »","وقال شيخ الإسلام ابن تيمية رحمه الله:","","",["مجموع الفتاوى (11/ 282)."],[284],0],[932,"a","عقيبة بن فضالة","","« كانت الدموع قد أثَّرت بخدِّي الفضل بن عيسى الرقَّاشي أثراً بيِّنًا, فكان كالشيء المخدوش, نديًّا دهرَه! »","7- الفضل بن عيسى الرقَّاشي رحمه الله: عن عُقيبة بن فضالة, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢١٦)."],[284],0],[933,"a","جعفر بن سليمان","","« اشتكى ثابت البُناني عينه, فقال له الطبيب: اضمن لي خَصلةً تبرأُ عينك, قال: وما هي؟ قال: لا تبك, قال: وما خيرٌ في عين لا تبكي؟! »","1- جواب ثابت البناني: عن جعفر بن سليمان, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢١٠) وصفة الصفوة (٣/٢٦٢)."],[285],0],[934,"s","عبد الرحمن بن يزيد بن جابر","","« قلت ليزيد بن مرثد: ما لي أرى عينيك لا تجف؟ قال: وما مسألتُك عنه؟ قلت: عسى الله أن ينفعني به, قال: يا أخي, إنَّ الله قد توعدني إنْ أنا عصيته أن يسجنني في النار, والله لو لم يتوعدني أن يسجنني إلا في الحمام لكنت حريًّا أنْ لا تجف لي عين, قال: فقلت له: فهكذا أنت في خلواتك؟ قال: وما مسألتك عنه؟ قلت: عسى الله أن ينفعني به, فقال: والله إن ذلك ليعرض لي حين أسكن إلى أهلي, فيحول بيني وبين ما أريد, وإنه ليوضع الطعام بين يدي, فيعرض لي فيحول بيني وبين أكله, حتى تبكي امرأتي ويبكي صبياننا, ما يدرون ما أبكانا, ولربما أضجر ذلك امرأتي فتقول: يا ويحها! ما خُصِصْتُ به من طول الحُزْنِ معكَ في الحياة الدنيا, ما تَقرُّ لي معك عينٌ »","2- جواب يزيد بن مَرْثَد: عن عبد الرحمن بن يزيد بن جابر, قال:","","",["الحلية لأبي نعيم (٥/١٦٤)، وصفة الصفوة (4/424)، وشعب الإيمان (1/ 518)."],[285],0],[935,"a","سلمة بن سعيد","","« قالوا ليزيد بن أبان الرقاشي: ما تسأم من كثرة البكاء؟ فبكى, ثم قال: وهل يَشبَعُ المُرْضَعُ من الغذاء؟ والله لوددتُ أني أبكي بعد الدموع الدماء, وبعد الدماء الصديدَ أيام الدنيا, فإنه بلغنا أن أهل النار يبكون الدماء إذا نَفِدَتِ الدموع, حتى لو أرسلت فيها السُّفُنُ لجرت! فما حقُّ امرئٍ لا يبكي على نفسه في الدنيا وينوح عليها؟ قال: وكان يقول: ابكِ يا يزيدُ على نفسك قبل حِينَ البكاءِ, إنما سُمِّي نوحًا رحمه الله؛ لأنه كان ينوح على نفسه, يا يزيدُ, من يُصلي لك بعدك؟ ومن يصومُ يا يزيدُ؟ ومن يضرعُ لك إلى ربِّك بعدَك؟ ومن يدعو؟ فكان يعدِّد على هذا ونحوه, ويبكي ويقول: يا إخوتاه! ابكوا أو بكُّوا أنفسكم, فإن لم تجدوا بكاءً فارحموا كلَّ بكَّاء »","3- جواب يزيد بن أبان الرقاشي: عن سلمة بن سعيد, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٤٧)."],[285],0],[936,"a","نعيم بن مورع التميمي","","« حُدِّثتُ عن ميسرةَ القيسي, أنه كان يبكي حتى يُغمى عليه, فيقال له: لو رفقتَ بنفسك؟ فيقول: إنما أُتيتُ من الرفق بها, والله لا أرفق بها أبدًا والقيامة أمامها, حتى أعلم ما لها عند ربها من خير وشر, قال: وكان قد عَمِشَ من طول البكاء! »","4- جواب ميسرةَ القيسي: عن نُعيم بن مورِّع التميمي, قال:","","",["المصدر السابق (٢٦٠)."],[285],0],[937,"a","عبد الرحمن بن مالك بن مغول","","« بكى أسيد الضبِّي حتى عمي, وكان إذا عوتب على البكاء, بكى, وقال: الآن حين لا أهدأ؟ وكيف أهدأ وأنا أموت غدًا؟ والله لأبكينَّ, ثم لأبكينَّ, ثم لأبكينَّ, فإن أدركتُ بالبكاء خيرًا فبمنِّ الله عليَّ وفضله, وإن تكن الأخرى, فما بكائي في جنب ما ألقى؟ قال: وكان ربما بكى حتى يتأذى به جيرانه من كثرة بكائه »","5- جواب أسيد الضبّي: عن عبد الرحمن بن مالك بن مغول, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٠٢)."],[285],0],[938,"a","ابن أبي الدنيا","","« حدثني محمد, قال: حدثني صدقة بن بكر, قال: سمعت معاذ بن زياد التميمي, يذكر أن فتىً, من الأزد بكى حتى أطلعَ بصره! فعوتب في ذلك فقال: ألم يرث البكاءَ أُناسُ صدقٍ … فقادهمُ البكا خير المعاد؟ … ألم يقلِ الإلهُ: إليَّ عبدي … فكلُّ الخيرِ عندي في المعاد؟ والله لأبكين دائم الدنيا, فإذا جاءت الآخرة؛ فعند الله أحتسبُ مصيبتي في تقصيري »","6- جواب الفتى الأزدي: قال ابن أبي الدنيا:","","",["المصدر السابق (١٩٤)."],[285],0],[939,"a","بهيم العجلي","","« ركب معنا البحر فتىً من بني مُرَّة من أهل البدو, فجعل يبكي الليل والنهار, فعاتبه أهلُ المركب على ذلك وقالوا: ارفق بنفسك قليلًا, فقال: إن أقلَّ ما ينبغي أن يكون لنفسي عندي أن أُبكيها, فأبكي عليها أيام الدنيا, لعلمي بما يمرُّ عليها في ذلك اليوم غدًا, قال: فما بقي في المركب أحدٌ إلا بكى. قال عثمان: وكان بهيم رجلًا حزينًا, فكان إذا ذكر هذا البدوي بكى, وقال: هذا يبكي على نفسه ويرحمها مما يمرُّ عليها في الموقف, فكيف بما بعد الموقف. قال: ويبكي بكاء شديدًا إذا ذكره »","7- جواب فتى بني مُرَّة: عن بهيم العجلي قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٨٣)."],[285],0],[940,"a","زهير السلولي","","« كان رجل من بلعنبر - من قبائل بني تميم - قد لهج بالبكاء, فكان لا تراه إلا باكيًا, قال: فعاتبه رجل من إخوانه يومًا فقال: لم تبكي رحمك الله هذا البكاء الطويل؟ فبكى ثم قال: بكيتُ على الذنوب لِعُظْمِ جُرْمي … وحُقَّ لكل من يَعصي البكاءُ … فلو كان البكاء يردُّ همِّي … لأَسعَدَتِ الدموعَ معًا دماءُ ثم بكى حتى غُشي عليه, فقام الرجل عنه وتركه »","8- جواب الرجل التميمي: عن زُهير السَّلولي, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٧٧)."],[285],0],[941,"a","","","« يبكي حتى خُشي على عينه, فأتي طبيب يداوي عينه, قال الطبيب: أداوي بشرط أنْ لا تبكي ثلاثة أيام! قال: فاستكثر ذلك, وقال: لا حاجة لنا فيك »","9- جواب عطاء السليمي: كان عطاء السليمي رحمه الله:","","",["شعب الإيمان (1/496)."],[285],0],[942,"a","عصام الرملي","","« أن الحسن, حدَّث يومًا, أو وعظ, فنحب رجلٌ في مجلسه, فقال الحسن: إن كان لله فقد شهرتَ نفسكَ, وإن كان لغير الله هلكتَ! »","عن عصام الرملي:","","",["الرقة والبكاء لابن أبي الدنيا (١٥٧) والإخلاص والنية لابن أبي الدنيا (ص/ 64) رقم (44)."],[286],0],[943,"a","الربيع يعني ابن صبيح","","« وعظ الحسن يومًا, فنحب رجل, فقال الحسن: ليسألنك الله يوم القيامة ما أردت بهذا »","وعن الربيع يعني ابن صبيح قال:","","",["الرقة والبكاء لابن أبي الدنيا (156)."],[286],0],[944,"a","معمر","","« بكى رجل إلى جنب الحسن, فقال: قد كان أحدهم يبكي إلى جنب صاحبه فما يَعْلَمُ به »","وعن مَعْمَر - بن راشد الأزدي -, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٦٦)."],[286],0],[945,"a","محمد بن واسع","","« إنْ كان الرجل ليبكي عشرين سنة, ومعه امرأتُه, ما تعلم به! »","وعن محمد بن واسع, قال:","","",["حلية الأولياء (٢/٣٤٧)."],[286],0],[946,"a","محمد بن واسع","","« لقد أدركتُ رجالًا, كان أحدهم يقوم في الصفِّ فتسيل دموعه على خدَّيه, لا يَشْعُر به الذي إلى جنبه! »","وعن محمد بن واسع, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٦٥)."],[286],0],[947,"a","أيوب السختياني","","« ما صدق عبد إلَّا سرَّه أنْ لا يُشَعَر بمكانه »","وقال أيوب السختياني رحمه الله:","","",["تذهيب تهذيب الكمال في أسماء الرجال (1/ 435)."],[286],0],[948,"a","حماد بن زيد","","« جاء ثابت - بن أسلم البناني - إلى محمد بن واسع يعوده, فسلم يحيى البكَّاء على ثابت فقال: من أنت؟ فقال رجل: هذا أبو مسلم, هذا يحيى, قال: من أبو مسلم؟ قالوا: يحيى البكاء. قال: إنَّ شرَّ أيامِكم يوم عُرفتم بالبُكاء, ونُسبتم إليه »","وعن حماد بن زيد, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢/٣٤٧)."],[286],0],[949,"a","الأعمش","","« بكى حذيفة رضي الله عنه, في صلاته, فلما فرغ, التفت, فإذا رجلٌ خلفه - فقال: لا تُعْلِمَنَّ بهذا أحدًا »","1- حذيفة بن اليمان رضي الله عنه: عن الأعمش, قال:","","",["صفة الصفوة (١/٦١٤)."],[287],0],[950,"a","عبد الله بن حبيب بن أبي ثابت","","« رأيت محمد بن كعب القُرظي يقصُّ, فبكى رجل, فقطع قصصه, وقال: من الباكي؟ قالوا: مولى بني فلان, قال: فكأنه كَرِهَ ذلك »","2- محمد بن كعب القُرظي: عن عبد الله بن حبيب بن أبي ثابت, قال:","","",["أخرجه ابن أبي الدنيا في الرقة والبكاء (١٥١)."],[287],0],[951,"a","أبو معشر","","« كان محمد بن كعب القرظي يقصُّ ودموعه تجري على خدَّيه, فإن سمع باكيًا زجره, وقال: ما هذا؟ »","وعن أبي معشر, قال:","","",["المصدر السابق (١٥٢)."],[287],0],[952,"a","حماد بن زيد","","« إنَّ الشيخ إذا كَبِرَ مَجَّ, وغَلَبَهُ فوه, فوضع يده على فيه, وقال: الزكمة ربما عرضت »","3- أيوب بن أبي تميمة السختياني: عن حماد بن زيد رحمه الله, غلب أيوب السختياني رحمه الله, البكاء يوْمًا, فقال:","","",["تذهيب تهذيب الكمال في أسماء الرجال (1/ 435)."],[287],0],[953,"a","حماد بن زيد","","« ذكر أيوب السختياني يومًا شيئًا, فرقَّ, فالتفت كأنه يتمخط, ثم أقبل علينا, فقال: إن الزكام شديد على الشيخ »","وعن حماد بن زيد, قال:","","",["صفة الصفوة (٣/٢٩٥)."],[287],0],[954,"a","عبد الرحمن بن مسلم","","« بكى أيوب - السختياني - مرة, فلم يملك عبرته, فقام »","وعن عبد الرحمن بن مسلم, مولى لآل أبي بكرة قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٦٠)."],[287],0],[955,"a","بسطام بن حريث","","« كان أيوب يَرِقُّ, فيستدمع, فيحبُّ أن يُخفي ذلك على أصحابه, فيمسك على أنفه كأنه رجل مزكوم, فإذا خشي أن تَظِبه عَبْرته, قام »","وعن بسطام بن حُرَيْث, قال:","","",["المصدر السابق (١٦١)."],[287],0],[956,"a","هريم بن سفيان","","« كان منصور - بن المعتمر السلمي- يحدثنا, فيمسحُ الدموعَ مرارًا قبل أن يقومَ »","4- منصور بن المعتمر السلمي: عن هُرَيم بن سفيان, قال:","","",["المصدر السابق (١٥٩)."],[287],0],[957,"a","الحسن بن الربيع","","« كان ابن المبارك إذا رَقَّ, فخاف أن يَظهَر ذلك منه, قام, وربما أَخذ في حديث آخر! »","5- عبد الله بن المبارك: عن الحسن بن الربيع, قال:","","",["المصدر السابق (١٦٤)."],[287],0],[958,"s","عبد الله بن عيسى","","« أخبرني أبي قال: كان حسان بن أبي سنان يحضر مسجد مالك بن دينار, فإذا تكلم مالك بكى حسان حتى يَبُلَّ ما بين يديه, لا يُسْمَعُ له صوت »","6- حسان بن أبي سنان: عن عبد الله بن عيسى, قال:","","",["الإخلاص والنية لابن أبي الدنيا (ص/ 66) رقم (48)."],[287],0],[959,"s","أبو بكر الصديق","","« ابكوا, فإن لم تبكوا فتباكوا »","قال أبو بكر رضي الله عنه:","","",["أخرجه الإمام أحمد في كتاب الزهد (ص/ 90) رقم (559) وأبو داود في كتاب الزهد (ص/ 58) رقم (36)."],[288],0],[960,"a","قسامة بن زهير","","« أيّها الناس ابْكُوا, فإنْ لم تَبْكوا فتَبَاكَوْا, فإنّ أهل النّار يبكون الدّموع حتى تنقطع, ثمّ يبكون الدماء حتى لو أُجْرِىَ فيها السفنُ لَسارتْ »","وعن قَسامة بن زُهير رحمه الله, أنّ أبا موسى الأشعري رضي الله عنه, خطب الناس بالبصرة فقال:","ضعيف","لا يصح",["الطبقات الكبير (4/ 103) والزهد للإمام أحمد (ص/ 163) رقم (1103). وقد رُوي مرفوعًا ولا يصح."],[288],0],[961,"s","عمر بن الخطاب","","وقد قال عمر بن الخطاب رضي الله عنه للنبي ﷺ وقد رآه يبكي هو وأبو بكر في شأن أسارى بدر: أخبرني ما يُبكيك يا رسول الله؟ فإن وجدتُ بكاءً بكيتُ, وإلَّا تباكيتُ, ولم ينكر عليه النبي ﷺ","وقد قال عمر بن الخطاب رضي الله عنه للنبي ﷺ وقد رآه يبكي هو وأبو بكر في شأن أسارى بدر: أخبرني ما يُبكيك يا رسول الله؟ فإن وجدتُ بكاءً بكيتُ, وإلَّا تباكيتُ, ولم ينكر عليه النبي ﷺ","","",["جزء من حديث طويل في شأن أسارى بدر. أخرجه مسلم (1763)."],[288],0],[962,"q","ابن القيم","","« وما كان منه مستدعًى متكلَّفًا فهو التباكي, وهو نوعان: محمود ومذموم. فالمحمود: أن يُستجلَب لرقَّة القلب ولخشية الله, لا للرياء والسمعة. والمذموم: أن يُجتلَب لأجل الخلق. وقد قال عمر بن الخطاب رضي الله عنه للنبي ﷺ وقد رآه يبكي هو وأبو بكر في شأن أسارى بدر: أخبرني ما يُبكيك يا رسول الله؟ فإن وجدتُ بكاءً بكيتُ, وإلَّا تباكيتُ, ولم ينكر عليه النبي ﷺ. وقال بعض السلف: ابكُوا من خشية الله, فإن لم تبكُوا فتباكَوا »","وقال ابن القيم رحمه الله - وهو يتحدَث عن أنواع البكاء -:","","",["زاد المعاد (1/127)."],[288],0],[963,"q","القرطبي","","« وفيض العين بحسب حال الذاكر, وبحسب ما يُكشفُ له, ففي حال أوصاف الجلال يكون البكاء من خشية الله, وفي حال أوصاف الجمال يكون البكاء من الشوق إليه »","قال القرطبي رحمه الله:","","",["فتح الباري بشرح صحيح البخاري (2/ 147) حديث رقم (660)."],[289],0],[964,"q","ابن القيم","","« حرمان العلم, ووحشة يجدها العاصي في قلبه بينه وبين الله, ووحشة بينه وبين الناس, وتعسير أموره عليه, وظلمة يجدها في قلبه حقيقة, ومنها: أن المعاصي توهن القلب والبدن, ومنها: حرمان الطاعة, وأن المعاصي تقصِّر العمر, وتمحق بركته, وأنَّ المعاصي تزرع أمثالها, ويولِّد بعضها بعضًا, وأنَّ المعاصي سبب لهوان العبد على ربه وسقوطه من عين الله عز وجل, ومنها: أن المعاصي تورث الذلَّ, وتفسد العقل, وإذا كثرت المعاصي طُبعَ على قلب صاحبها, وتُـدخل العبد تحت لعنة رسول الله ﷺ, فقد ورد عنه رحمه الله اللعنُ على معاصٍ, وغيرُها أكبرُ منها, فهي أولى بدخول فاعلها تحت اللعنة, ومن أضرار المعاصي: الحرمان من دعاء الملائكة واستغفارهم, وتُسبب الفساد في الأرض؛ في المياه, والزروع, والثمار, والمساكن, وتُطفئ من القلب نار الغيرة, وبسبب المعاصي يذهب الحياء, ويَضعف في القلب تعظيم الرب سبحانه, ومنها: أن المعاصي تستدعي نسيان الله لعبده, وتُخرج العبد من دائرة الإحسان, ومن آثار الذنوب أنها تُزيل النِّعم وتُحِلُّ النِّقم, وتُعمي بصيرة القلب وتُطفئ نوره, وتجعل العاصي أسير شيطانه, وتَمحق بركة العمر, والرزق, والعلم, والعمل, والطاعة, ومن أضرار المعاصي: أنها سبب لسوء الخاتمة, وتُنسي العبد نفسه؛ فإذا نسي نفسه أهملها وأفسدها وأهلكها, ومن عواقبها: أنها تستجلب موادّ هلاك العبد في الدنيا والآخرة... إلى آخر ما ذكره رحمه الله من أضرار وآثار وعقوبات الذنوب والمعاصي موضِّحًا كل ضرر بالأدلة والأمثلة والتوضيح الذي يستفيد منه المسلم, فأنصح بقراءة هذا الكتاب وكثرة النظر فيه »","وقد ذكر ابن القيم رحمه الله, جملة من أضرار الذنوب والمعاصي, ومن تلك الأضرار:","","",["نقلت هذه الأضرار باختصار من كتاب الداء والدواء لابن القيم رحمه الله من (ص / 132) وما بعدها. عند فصل/ أضرار المعاصي للعبد في دينه ودنياه وآخرته."],[264],0],[965,"a","زيد الخمري","","« كنا عند أبي عبد الرحمن المغازلي, فتكلم, فبكى بعضُ من عنده, فقال أبو عبد الرحمن: دعوه, فإنما معوَّل المذنبين البكاء والتوبة »","وعن زيد الخُمري, قال:","","",["المصدر السابق (٢٨٠)."],[264],0],[966,"a","سلمة بن سعيد","","« أستغفر الله, وبكى بكاءً شديدًا, فقال له جلساؤه بعد ذلك المجلس: ما رأينا - أصلح الله الأمير - بكاء في إثر ضَحِك أسرع من بكائك بالأمس! قال إني والله ذكرتُ ذنباً أذنبتُه, كنتُ به حينئذ مسرورًا, فذكرتُه, فبكيتُ خوفًا من عاقبته, ثم بكى أيضًا »","وعن سلمة بن سعيد, عن بعض رجاله, أن زيادًا ضحك ذات يوم حتى علا صوتُه, ثم قال:","","",["المصدر السابق (١٧٢)."],[264],0],[967,"p","","","وما لي لا أبكي على الذنب إنني … أرى الذنبَ داءً في الجوانح والقلب","","","",["الرقة والبكاء لابن أبي الدنيا (١٢٣)."],[264],0],[968,"a","محمد بن الحارث بن عبد ربه القيسي","","« كنتُ أدخل عليه المسجد وهو يبكي, وأدخل عليه بيته وهو يبكي, وآتية في الجبَّان وهو يبكي, فقلت له يومًا: أنت دهرَكَ في مأتم؟ قال: فبكى, ثم قال: يحقُّ لأهل المصائب والذنوب أن يكونوا هكذا »","وعن محمد بن الحارث بن عبد ربه القيسي - وكان ذا قرابة لرياح القيسي - قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٧٣) وصفة الصفوة (2/ 218)."],[264],0],[969,"a","موسى بن عيسى","","« نظر حذيفة المرعشي إلى رجل وهو يبكي فقال: ما يبكيك يا فتى؟ قال: ذكرتُ ذنوبًا سلفتْ فبكيتُ, قال: فبكى حذيفة, ثم قال: نعم يا أخي فلمثل الذنوب فليُبْك, ثم أخذ بيده, فتنحيَّا, فجعلا يبكيان! »","وعن موسى بن عيسى, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٧٤)."],[264],0],[970,"a","طلحة -يعني ابن مصرف-","","« كان رجلٌ له ذنوب, فكان له عند كل ذنب منها بَكِيَّةٌ, قال: فقال له غلامه: إن كان هذا دأبك فإني سأقودك أعمى! »","وعن طلحة -يعني ابن مُصَرِّف- قال:","","",["الرقة والبكاء لابن أبي الدنيا (١٨٠)."],[264],0],[971,"n","","","ويبكي بكاءً شديدًا, ويردِّدُ ذلك","","","",["المصدر السابق (١٨٤)."],[264],0],[972,"a","محمد بن قيس المدني","","« سلَّم عمرُ بن عبد العزيز يوماً في الظهر, ثم قال: يا أبا إبراهيم؛ ذكِّرنا بالجنة والنار, قال: فذكَّرت, فما رأيت أحداً من خلق الله أكثر بكاءً منه »","عن محمد بن قيس المدني - قاص عمر بن عبد العزيز -, قال:","","",["سيرة عمر بن عبد العزيز لابن الجوزي (ص/ ١٥٨). والرقة والبكاء لابن أبي الدنيا (ص/ 108) رقم (115)."],[290],0],[973,"a","الفيض بن الفضل البجلي","","« بكى مسعر, فبكت أمُّه, فقال لها مسعر: ما أبكاك يا أُمَّه؟ قالت: يا بني رأيتك تبكي فبكيت. قال: يا أمَّه لمثل ما نهجُم عليه غدًا فليظلَّ البكاء. قالت: وما ذاك يا بني؟ قال: القيامة وما فيها! قال: ثم غلبه البكاء, فقام. قال: وكان مسعر يقول: لولا أمي ما فارقت المسجد إلا لما لا بد منه, قال: وكان إن دخل بكى, وإن خرج بكى, وإن صلى بكى, وإن جلس بكى »","وعن الفيض بن الفضل البجلي, قال: حدثني جار لمسعر قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٥١) وصفة الصفوة (2/ 75)."],[290],0],[974,"a","أبو عبد الرحمن المغازلي","","« قال رجل ببعض بلاد الشام في بعض السواحل: لو بكى العابدون على الشفقة حتى لم يبق في أجسادهم جارحة إلا أدَّت ما فيها من الدَّم والوَدَك - هو الدَّسم - دموعًا جاريةً, وبقيت الأبدان يُبّسًا خالية, تردَّدُ فيها الأرواح؛ إشفاقًا ووجلًا من يومٍ تذهل فيه كل مرضعةٍ عمَّا أرضعت, لكانوا محقوقين بذلك, ثم غُشي عليه »","وعن أبي عبد الرحمن المغازلي, قال:","","",["صفة الصفوة (٤/٣٧٢) والرقة والبكاء لابن أبي الدنيا (ص62) رقم (49)."],[290],0],[975,"a","محمد بن فروخ","","« زارني رياح القيسي, فبكى صبيٌّ لنا من الليل, فبكى رياح لبكائه حتى أصبح, فذاكرتُه يومًا ذلك, فقال: ذكرتُ ببكائه بكاء أهل النار في النار, ليس لهم نصير. ثم بكى »","وعن محمد بن فروخ, من ولد أبي نضرة قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٥٣)."],[290],0],[976,"s","محمد بن أبي عثمان","","« كان علي يعني ابن الفضيل عند سفيان بن عيينة, فحدث سفيان بحديث فيه ذكر النار, وفي يد علي قرطاس في شيء مربوط, فشهق شهقة ووقع ورمى بالقرطاس أو وقع من يده, فالتفت إليه سفيان, وقال: لو علمت أنك ههنا ما حدثت به, فما أفاق إلا بعد ما شاء الله! »","وعن محمد بن أبي عثمان, قال:","","",["سير أعلام النبلاء (8/298)."],[290],0],[977,"q","","","« أخاف أن يطرحني غدًا في النّار ولا يبالي »","وبكى الحسن رحمه الله: فقيل: ما يبكيك؟ قال:","","",["صفة الصفوة (2/ 138) والتخويف من النار لابن رجب (23)."],[290],0],[978,"a","أبو موسى التميمي","","« لما ماتت النوار امْرَأَة الفرزدق شهد جنازتها الحسن بن أبي الحسن رحمه الله, والناس معه, فلما أدخلت قبرها قال الْحَسَن للفرزدق: يا أَبَا فراس: ما أعددت لهذا المضجع؟ قال: شهادة أَن لا إله إلا اللَّه مُذ ثمانون سنة, وأنشأ يقول: أخاف وراء القبر إن لم تُعافِني … أشد من القبر التهابًا وأضيقا … إذا جاء فِي يوم القيامة قائد … عنيف وسوّاق يسوق الفرزدقا … لقد خاب من أولاد آدم من مشى … إلى النار مغلول المقلد أزرقا فبكى الْحَسَن وبكى الفرزدق والناس »","وعن أَبِي مُوسَى التميمي رحمه الله قال:","","",["أنساب الأشراف للبلاذري (12/ 77)."],[290],0],[979,"h","النبي ﷺ","ابن شماسة المهري","« حضرنا عمرو بن العاص رضي الله عنه, وهو في سياقة الموت. فبكى طويلًا وحوله وجهه إلى الجدار. فجعل ابنه يقول: يا أبتاه أما بشرك رسول الله ﷺ بكذا؟ أما بشرك رسول الله ﷺ بكذا؟ قال فأقبل بوجهه فقال: إن أفضل ما نُعِدُّ شهادة أن لا إله إلا الله وأن محمدًا رسول الله. إني قد كنت على أطباقٍ ثلاث. لقد رأيتُني وما أحدٌ أشدَّ بغضًا لرسول الله ﷺ مني. ولا أحبَّ إليَّ أن أكون قد استمكنت منه فقتلته. فلو مُتُّ على تلك الحال لكنت من أهل النار, فلما جعل الله الإسلام في قلبي أتيت النبي ﷺ فقلت: ابسط يمينك فلُأبايِعْك. فبسط يمينه, قال: فقبضتُ يدي, قال: «مالك يا عمرو؟» قال قلت: أردت أن أشترط. قال: «تشترط بماذا؟» قلت: أن يغفر لي, قال: «أما علمت أن الإسلام يهدم ما كان قبله؟ وأن الهجرة تهدم ما كان قبلها؟ وأن الحج يهدم ما كان قبله؟», وما كان أحدٌ أحبَّ إليَّ من رسول الله ﷺ ولا أجلَّ في عيني منه, وما كنت أطيق أن أملأَ عيني منه إجلالًا له. ولو سُئلتُ أن أصفَه ما أطقتُ؛ لأني لم أكن أملأُ عيني منه, ولو مُتُّ على تلك الحال لرجوت أن أكون من أهل الجنة. ثم وَلِينا أشياء ما أدري ما حالي فيها, فإذا أنا مت, فلا تصبحني نائحةٌ ولا نار, فإذا دفنتموني فشُنُّوا عليَّ التراب شَنًّا, ثم أقيموا حول قبري قدر ما تُنحرُ جَزورٌ, ويُقسَمُ لحمها, حتى أستأنسَ بكم, وأنظرَ ماذا أُراجعُ به رسلَ ربي »","عن ابن شماسة المهري رحمه الله, قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (121)."],[291],0],[980,"a","أبو علي الدقاق","","« دخلت على الإِمَام أَبِي بَكْر بْن فورك عائدًا فلما رآني دمعت عيناه! فقلتُ له: إِن شاء اللَّه تَعَالَى يعافيك ويشفيك فقال: لَنْ تراني أخاف من الْمَوْت إِنَّمَا أخاف مِمَّا وراء الْمَوْت »","وقال أبو عليٍّ الدَّقَّاقُ رحمه الله:","","",["الرسالة القشيرية (1/ 254)."],[291],0],[981,"p","","","أيا من لا يخيبُ إليه راجي … ولم يراه الحاج المناجي … ويا ثقتي على سرَفي وجُرمي … وإيثار التمادي في اللجاج … أقلني عثرتي واغفر ذنوبي … وهب لي منك عفوًا واقضِ حاجي … فما لي غير إقراري بجرمي … وعفوك حجة يوم احتجاجي","","","",["شعب الإيمان (5/ 466) رقم (7307)."],[291],0],[982,"h","النبي ﷺ","البراء","«يا إخْواني! لِمثْلِ هذا فأَعِدُّوا»","عن البراء رضي الله عنه قال: كنَّا معَ رسولِ الله ﷺ, في جَنازَةٍ, فجلسَ على شفيرِ القَبْرِ, فبَكى حتَّى بَلَّ الثَّرى, ثُمَّ قال:","حسن","حسنه الألباني في صحيح الترغيب والترهيب (3338)",["رواه ابن ماجه (4195). وحسنه الألباني في صحيح الترغيب والترهيب (3338)."],[292],0],[983,"q","السندي","","« قوله: «على شفير القبر» أي: طرفه «الثرى»؛ أي: التراب «فأعدوا»؛ أي: صالح الأعمال الذي يدخل القبر مع المؤمن »","قال السندي رحمه الله:","","",["حاشية السند على ابن ماجه (2/ 548) حديث رقم (4195)."],[292],0],[984,"n","","","وكان يقال: مشاهدة القبور مواعظ الأمم السالفة","","","",["أخرجه البيهقي في شعب الإيمان (7/ 20) رقم (9310)."],[292],0],[985,"a","أبو الوليد أنه","","« كان ابن عمر رضي الله عنهما, إذا أراد أنْ يتعاهد قلبه؛ يأتي الخَرِبة فيقفُ على بابها, فيُنادي بصوت حزين فيقول: أين أهلُك؟ ثم يرجع إلى نفسه فيقول: الآية: القصص: 88 »","وعن عمر بن سُليم الباهلي, عن أبي الوليد أنه قال:","","",["ذم قسوة القلب لابن رجب (ص/ 269)."],[292,293],0],[986,"a","مفضل بن يونس","","« كان الربيع بن أبي راشد يخرج إلى الجبان, فيقيم سائر نهاره, ثم يرجع مكتئبًا, فيقول له أخوه وأهله: أين كنت؟ فيقول: كنت في المقابر, نظرت إلى قوم قد مُنعوا ما نحن فيه, ثم يبكي »","وعن مفضل بن يونس رحمه الله, قال:","","",["أخرجه البيهقي في شعب الإيمان (7/ 19) رقم (9307)."],[292],0],[987,"a","أبو سهل محمد بن عمرو الأنصاري","","« كنا مع محمد بن واسع في جنازة, فجعلتُ أنظر إلى دموعه على لحيته, وهو جالس لا يتكلم بشيء, فذكرت ذلك ليحيى بن مسلم البكاء, فبكى, وقال: إن في دون ما كنتم فيه لما يُبكي؛ القبور »","وعن أبي سهل محمد بن عمرو الأنصاري قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٢٥)."],[292],0],[988,"a","محمد بن صالح التمار","","« كان صفوان بن سليم يأتي البقيع في الأيام فيمر بي, فاتبعته ذات يوم, وقلت: والله لأنظرنَّ ما يصنع! قال: فقنَّع رأسه وجلس إلى قبر منها, فلم يزل يبكي حتى رحمته, قال: ظننتُ أنه قبر بعض أهله! قال: فمرَّ بي مرة أخرى, فاتبعته فقعد إلى جنب قبرٍ غيره, ففعل مثل ذلك, فذكرتُ ذلك لمحمد بن المنكدر وقلت: إنّما ظننتُ أنه قبر بعض أهله, فقال محمد: كلهم أهله وإخوانه! إنَّما هو رجل يُحَّرك قلبه بذكر الأموات كلَّما عرضت له قسوة, قال: ثم جعل محمد بن المنكدر بعد يمّر بي فيأتي البقيع, فسلَّمتُ عليه ذات يوم, فقال: ما نفعتك موعظة صفوان؟ قال: فظننت أنه انتفع بما ألقيتُ إليه منها »","وعن محمد بن صالح التمار قال:","","",["تاريخ دمشق لابن عساكر (24/ 132) وسير أعلام النبلاء (5/ 367)."],[292],0],[989,"a","أبو بكر الهذلي","","« كانت عجوز في عبد القيس متَعبِّدة, فكان إذا جاء الليل تحرَّمت ثم قامت إلى المحراب, وكانت تقول: المحب لا يسأمُ من خدمة حبيبه, فإذا جاء النهار خرجت إلى القبور, فبلغني أنها عُوتبت في كثرة إتيانها المقابر, فقالت: إن القلب القاسي إذا جفا لم يُليِّنه إلا رسومُ البِلى, وإني لآتي القبور فكأني أنظر وقد خرجوا من بين أطباقها, وكأني أنظر إلى تلك الوجوه المتعفِّرة, وإلى تلك الأجسام المتغيرة, وإلى تلك الأكفان الدسمة, فيا له من منظر كريه لو أشربه العباد قلوبهم! ما أثكلَ مرارته للأنفس! وأشدَّ إتلافه للأبدان »","وعن أبي بكر الهذلي رحمه الله, قال:","","",["صفة الصفوة (2/ 503) وكتاب «ذم قسوة القلب» للحافظ بن رجب (ص/ 267) بنحوه."],[292],0],[990,"a","محمد بن قدامة","","« كان الرَّبيع بن خُثَيم إذا وَجَد مِن قلبه قسوةً يأتي منزل صديق له قد مات؛ في الليل فيُنادي: يا فلان بن فلان, يا فلان بن فلان. ثم يقول: ليت شِعري!! ما فعلتَ وما فُعل بك؟ ثم يبكي حتى تسيل دموعه, فُيعرف ذلك فيه إلى مثلها »","وعن محمد بن قدامة قال:","","",["أخرجه البيهقي في شعب الإيمان (7/ 20) رقم (9308).","شعب الإيمان للبيهقي (7/ 20) رقم (9308)."],[292,293],0],[991,"n","","","بوب النووي في كتاب الأذكار: بابُ البكاء والخوف عند المُرور بقبور الظالمين وبمصارعهم, وإظهار الافتقار إلى الله تعالى, والتحذير من الغفلة عن ذلك","","","",["كتاب الأذكار للنووي (ص/ 288)."],[294],0],[992,"h","النبي ﷺ","","«لا تَدْخُلُوا علَى هَؤُلَاءِ المُعَذَّبِينَ إلَّا أنْ تَكُونُوا بَاكِينَ, فإنْ لَمْ تَكُونُوا بَاكِينَ فلا تَدْخُلُوا عليهم, لا يُصِيبُكُمْ ما أصَابَهُمْ»","ذكار: بابُ البكاء والخوف عند المُرور بقبور الظالمين وبمصارعهم, وإظهار الافتقار إلى الله تعالى, والتحذير من الغفلة عن ذلك, وأورد حديث عبد الله بن عمر رضي الله عنهما أن النبي ﷺ قال لأصحابه؛ يعني لما وصلوا الحجر ديارَ ثمود:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (433) ومسلم (2980)."],[294],0],[993,"h","النبي ﷺ","","« ما أبلغ العظات؟ قال: النظر إلى محلة الأموات »","وقيل لبعض حكماء العرب:","","",["أخرجه البيهقي في شعب الإيمان (7/ 19) رقم (9306)."],[294],0],[994,"a","الحسن البصري","","« كانوا يعملون ما يعملون من أعمال البر وهم مشفقون ألا ينجيهم ذلك من عذاب الله عز وجل »","عن الحسن البصري رحمه الله, قال في قوله: الآية: المؤمنون: 60:","","",["الزهد لأحمد بن حنبل (ص/ 230) رقم (1638)."],[28],0],[995,"h","النبي ﷺ","الحسن البصري","« هكذا المؤمنُ جمع إحسانًا وشفقة, والمنافقُ جمع إساءةً وغِرَّةً, والله ما وجدتُ فيما مضى ولا فيما بقي عبدًا ازداد إحسانًا إلا ازداد مخافة وشفقة منه, ولا وجدت فيما مضى, ولا فيما بقي عبدًا ازداد إساءةً إلا ازداد غِرَّةً »","وقال الحسن البصري رحمه الله, وذُكر له فعلُ عمرَ عند موته وخشيتُه من ربه, فقال:","","",["أخرجه الطبراني في المعجم الأوسط (1/ 183) رقم (579)."],[28],0],[996,"h","النبي ﷺ","عائشة أم المؤمنين","« سألتُ رسول الله ﷺ عن هذه الآية: الآية: المؤمنون: 60, قالت عائشة: أهم الذين يشربون الخمر ويسرقون؟ قال: «لا يا بنتَ الصديق, ولكنهم الذين يَصومون ويُصلون ويتصدقون, وهم يخافون أنْ لا تُقبلَ منهم الآية: المؤمنون: 61» »","وعن عائشة رضي الله عنها, زوج النبي ﷺ قالت:","صحيح","صححه الألباني في صحيح الترمذي (3175)",["رواه الترمذي (3175) وابن ماجه (4198) وصححه الألباني في صحيح الترمذي (3175)."],[28],0],[997,"a","الحسن البصري","","« لقد أدركت أقوامًا كانوا من حسناتهم أن تُردَّ عليهم أشفقَ منكم على سيئاتِكم أن تُعذَّبوا عليها »","ويروى عن الحسن قال:","","",["أحكام القرآن للجصاص (3/ 331)، ط1 دار الكتب العلمية 1415هــ."],[28],1],[998,"q","القرطبي","","« وأما المخلِّطُ فينبغي له أن يكون تحت خوفٍ من أن يَنفُذَ عليه الوعيدُ بتخليطِه. وقال أصحابُ الخواطر: وَجَلُ العارفُ من طاعتِهِ أكثرُ وجَلًا من وَجَلهِ من مخالفتِه, لأن المخالفة تمحوها التوبة, والطاعة تطلب بتصحيح الغرض … أي: لأنهم, أو من أجل الآية: المؤمنون: 60 »","وقال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (12/ 133) [المؤمنون: 60]."],[28],0],[999,"q","ابن القيم","","« وهذا من أعظم الفقه؛ أن يخاف الرجل أن تخذله ذنوبه عند الموت, فتحول بينه وبين الخاتمة بالحسنى »","ولقد بكى سفيان الثوري ليلةً إلى الصباح, فلما أصبح قيل له: كلُّ هذا خوفاً من الذنوب؟ فأخذ تِبنَةً من الأرض, وقال: الذنوب أهون من هذا, وإنما أبكي من خوف الخاتمة. قال ابن القيم بعد أن أورد هذا الأثر:","","",["الداء والـدواء (ص/ 390)."],[295],0],[1000,"a","","","« ما سمعت ابن عمرَ رضي الله عنهما, يذكر النبيَّ ﷺ قطُّ إلا بكى »","عن عمر بن محمد, عن أبيه قال:","","",["سنن الدارمي (1/ 222) رقم (87)."],[296],0],[1001,"a","الأحنف بن قيس","","« دخلتُ بيتَ المقدِس, فوجدت فيه رجلًا يكثرُ السُّجودَ, فوجدتُ في نفسي من ذلك, فلما انصرف قلتُ: أتدري على شَفْعٍ انصرفتَ أم على وِتْرٍ؟ قال: إنْ أكُ لا أدري, فإن الله عز وجل يدري, ثم قال: أخبرني حِبِّي أبو القاسم ﷺ. ثم بكى, ثم قال: أخبرني حبي أبو القاسم ﷺ. ثم بكى, ثم قال: أخبرني حبي أبو القاسم ﷺ, أنه: «ما من عبد يَسْجُدُ لله سجدةً, إلا رفعه الله بها درجةً, وحَطَّ عنه بها خطيئةً, وكتبَ له بها حسنةً». قال: قلت: أخبِرني من أنت يرحمك الله؟ قال: أنا أبو ذر, صاحب رسول الله ﷺ. قال: فتقاصرت إليَّ نفسي »","وعن الأحنف بن قيس, قال:","صحيح","صححه الوادعي في الصحيح المسند مما ليس في الصحيحين (٢٧١)",["رواه أحمد (21452) وصححه الوادعي في الصحيح المسند مما ليس في الصحيحين (٢٧١)."],[296],0],[1002,"h","النبي ﷺ","عبد الله بن عباس","« يومُ الخميس وما يومُ الخميس, ثم بكى حتى خضبَ دمعُه الحَصباءَ, فقال: اشتدَّ برسول الله ﷺ وجَعُهُ يومَ الخميس, فقال: «ائتوني بكتاب أكتب لكم كتابًا لن تضلوا بعده أبدًا» »","وعن ابن عباس رضي الله عنهما: أنه قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (3053) ومسلم (1637)."],[296],0],[1003,"h","النبي ﷺ","أنس بن مالك","« يا أبتاهُ مِنْ رَبِّهِ ما أدناهُ, يا أبتاهُ إلى جبريلَ ننعاهُ, يا أبتاهُ جنةُ الفِردوس مأواه »","وعن أنس رضي الله عنه, أنَّ فاطمةَ بكَتْ على رسول الله ﷺ حين مات, فقالت:","","",["رواه النسائي (1844) والبخاري بنحوه (4462)."],[296],0],[1004,"h","النبي ﷺ","عاصم بن حميد السكوني","«لا تَبْكِ يا معاذُ, لَلْبُكاءُ, أو إنَّ البكاءَ, من الشيطانِ»","ﷺ يُوصِيهِ, ومعاذٌ راكبٌ, ورسولُ الله ﷺ يمشي تحت راحلِتِه, فلمَّا فرَغَ قال: «يا معاذُ! إنك عسى أنْ لا تلقاني بعد عامي هذا, ولعلَّك أن تمرَّ بمسجدي وقبري». فبكى معاذُ بنُ جَبلٍ جَشَعًا لِفراقِ رسولِ الله ﷺ, فقال النبي ﷺ:","صحيح","صححه الوادعي في الصحيح المسند مما ليس في الصحيحين (١١٠٨)",["رواه أحمد (22054) وصححه الوادعي في الصحيح المسند مما ليس في الصحيحين (١١٠٨)."],[296],0],[1005,"a","","","« أتي عبد الرحمن بن عوف رضي الله عنه يومًا بطعامه فقال: قُتل مصعب بن عمير, وكان خيرًا مني, فلم يوجد له ما يُكفَّنُ فيه إلا بُرْدةٌ, وقُتل حمزةُ أو رجلٌ آخر خيرٌ مني, فلم يُوجدْ له ما يُكفَّنُ فيه إلا بُرْدَةٌ, لقد خَشِيتُ أن يكونَ قد عُجِّلتْ لنا طيباتُنا في حياتِنا الدنيا, ثم جعل يبكي »","وعن سَعْد بن إبراهيم بن عبد الرحمن بن عوف, عَنْ أَبِيهِ إبراهيم, قال:","","",["رواه البخاري (1274)."],[111],0],[1006,"h","النبي ﷺ","أنس بن مالك","« اشتكى سلمانُ فعاده سعدٌ, فرآه يبكي, فقال له سعدٌ: ما يُبكيك يا أخي؟ أليس قد صحبتَ رسول الله ﷺ, أليس؟ أليس؟ قال سلمانُ: ما أبكي واحدةً من اثنتين, ما أبكي حُبًّا للدنيا, ولا كراهيةً للآخِرة, ولكن رسول الله ﷺ عَهِد إليَّ عهدًا, فما أُراني إلا قد تعدَّيتُ, قال: وما عهِدَ إليك؟ قال: عهد إلي: «أنه يكفي أحدَكُم مثلُ زاد الرَّاكب», ولا أُراني إلا قد تعديتُ, وأمَّا أنت يا سعدُ فاتَّق الله عند حُكمِك إذا حكمتَ, وعند قَسْمِكَ إذا قَسَمْتَ, وعند همك إذا هَمَمت, قال ثابت: فبلغني أنه ما ترك إلا بضعةً وعشرين درهمًا, من نُفيقةٍ كانت عنده »","وعن أَنَسٍ بن مالك رحمه الله, قال:","صحيح","صححه الشيخ الألباني في صحيح ابن ماجه (3312) وصحيح الترغيب (3225)",["رواه ابن ماجه (4104)، وصححه الشيخ الألباني في صحيح ابن ماجه (3312) وصحيح الترغيب (3225)."],[111],0],[1007,"a","عبد الرحمن بن حفص القرشي","","« بعث بعضُ الأمراء إلى عمرَ بنِ المنكدر بمالٍ, فجاء به الرسولُ, فوضعه بين يديه, فجعل عمر ينظر إليه ويبكي, ثم جاء أبو بكر, فلما رأى عمرَ يبكي, جلس يبكي لبكائه, ثم جاء محمد, فجلس يبكي لبكائهما, فاشتد بكاؤهم جميعًا, فبكى الرسول ﷺ أيضًا لبكائهم, ثم أرسل إلى صاحبِه, فأخبره بذلك, فأرسل ربيعةَ بنَ أبي عبد الرحمن يستعلمُ عِلمَ ذلك البكاءِ, فجاء ربيعةُ, فذكر ذلك لمحمد, فقال محمد: سَلْهُ, فهو أعلمُ ببكائه مني, فاستأذن عليه ربيعةُ, فقال: يا أخي ما الذي أبكاك من صِلة الأميرِ لك؟ قال: إني والله خشيت أن تَغلِبَ الدنيا على قلبي, فلا يكونَ للآخرة فيه نصيبٌ, فذاك الذي أبكاني, قال: فأمر بالمال, فتُصُدِّقَ به على فقراءِ أهلِ المدينة, فجاء ربيعةُ, فأخبر الأميرَ بذلك, فبكى وقال: هكذا والله يكون الخير »","وعن عبد الرحمن بن حفص القُرَشي, قال:","","",["الرقة والبكاء لابن أبي الدنيا (ص/70) رقم (63) وصفة الصفوة لابن الجوزي (1/ 380)."],[111],0],[1008,"h","النبي ﷺ","أنس بن مالك","«غَطَّوا رؤوسهم ولهم خَنينٌ»","الله عنه, قال: بلَغَ رسولَ الله ﷺ عن أصحابه شيءٌ, فخطب فقال: «عرضت عليَّ الجنة والنار, فلم أر كاليوم في الخير والشر, ولو تعلمون ما أعلم لضحكتم قليلًا ولبكيتم كثيرًا»؛ قال: فما أتى على أصحاب رسول الله ﷺ يومٌ أشد منه, قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (2359)."],[297],0],[1009,"q","النووي","","« ومعنى الحديث: لم أر خيرًا أكثر مما رأيته اليوم في الجنة, ولا شرًّا أكثر مما رأيته اليوم في النار, ولو رأيتم ما رأيت, وعلمتم ما علمت مما رأيته اليوم, وقبل اليوم لأشفقتم إشفاقًا بليغًا, ولَقلَّ ضحككم, وكثر بكاؤكم, وفيه دليل على أنه لا كراهة في استعمال لفظة \"لو\" في مثل هذا, والله أعلم. قوله: «غطوا رءوسهم ولهم خنين» قال الخليل: هو صوت فيه غنة, وقال الأصمعي: إذا تردد بكاؤه, فصار في كونه غنة فهو خنين, وقال أبو زيد: الخنين مثل الحنين, وهو شديد البكاء »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (15/ 112) حديث رقم (2359)."],[297],0],[1010,"q","السندي","","« قوله «الجنة والنار» فالجنة تكثر البكاء شوقًا وخوفًا من الحرمان, والنار خوفًا »","وقال السندي رحمه الله:","","",["حاشية السندي على النسائي (3/ 83) حديث رقم (1363)."],[297],0],[1011,"h","النبي ﷺ","العرباض بن سارية","«عليكم بتقوى الله, والسمعِ والطاعةِ, وإنْ عبدًا حبشيًا, وسترون من بعدي اختلافًا شديدًا, فعليكم بسُنَّتي, وسنةِ الخلفاء الراشِدين المهديِّين, عَضُّوا عليها بالنَّواجِذِ, وإياكم والأُمورَ المُحدَثاتِ, فإنَّ كلَّ بدعةٍ ضلالةٌ»","وعن الْعِرْبَاض بْنِ سَارِيَةَ رضي الله عنه, قال: قام فينا رسولُ الله ﷺ ذاتَ يومٍ, فوعظَنا موعظةً بليغةً, وجِلَتْ منها القلوبُ, وذرَفت منها العُيونُ, فقيل يا رسول الله: وعظتنا موعظةَ مُودِّعٍ, فاعهَدْ إلينا بعهدٍ, فقال:","صحيح","صححه الألباني في صحيح ابن ماجه (40)",["رواه ابن ماجه (42) وأبو داود (4607) والترمذي (2676)، وصححه الألباني في صحيح ابن ماجه (40)."],[297],0],[1012,"q","السندي","","« «وجِلَتْ» كسمِعَتْ, أي: خافت, قوله: «وذَرَفت»؛ أي: سالت؛ وفي إسناده إلى العيون مع أن السائل دموعها مبالغة, والمقصود إنها أثَّرتْ فيهم ظاهرًا وباطنًا »","قال السندي رحمه الله:","","",["حاشية السندي على ابن ماجه (1/ 19) حديث رقم (42)."],[297],0],[1013,"a","قتادة","","« دخل على عمر بن عبد العزيز رجلٌ يقال له ابن الأهتم, فلم يزل يَعِظُه وعمرُ يبكي, حتى سقَطَ مغشياً عليه »","وعن قتادة, قال:","","",["الرقة والبكاء لابن أبي الدنيا (ص/ 109) رقم (116) وسيرة عمر بن عبد العزيز لابن الجوزي (ص ١٥٤)."],[297],0],[1014,"a","أبو عبد الرحمن الطائي","","« حدثنا خالد بن صفوان, قال: قال له عمر بن عبد العزيز: ابنَ الأهتم! بيانك حجةٌ عليك, فأقصر من خطبتك, وأعدَّ الجواب عند الله بحجتك, قال: فبكى ابن الأهتم, وبكى عمر, وارتجت الدار بالبكاء, فما رُئي باكٍ في زمن عمر أكثر من ذلك اليوم »","وعن أبي عبد الرحمن الطائي, قال:","","",["الرقة والبكاء لابن أبي الدنيا (١١٧)."],[297],0],[1015,"a","أبو جعفر الضرير","","« قال لي صالح بن عبد الكريم: بكى الباكون للرحمن ليلاً … وباتوا دمعُهم ما يسأمونا … بقاعُ الأرض من شوقٍ إليهم …
