<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>مكتبتي</title>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one reading column; sticky search bar; cards as index slips with a grade stripe on the start edge */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#1B2033; --muted:#5E6478; --line:#DCDFE8;
  --accent:#2E3F8F; --accent-soft:#E6E9F5;
  --sahih:#1E7A4C; --sahih-bg:#E3F2EA; --hasan:#9A6A0C; --hasan-bg:#F8EFD9; --daif:#B23A2E; --daif-bg:#F8E3E0;
  --hl:#FFE89A; --hl-ink:#1B2033;
  --f-text:"Amiri","Traditional Arabic","Noto Naskh Arabic",serif;
  --f-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141C; --surface:#1B1E2A; --ink:#E8EAF2; --muted:#9AA0B4; --line:#2C3042;
  --accent:#9DAEFF; --accent-soft:#252B47;
  --sahih:#6FD3A0; --sahih-bg:#16302A; --hasan:#E8BE62; --hasan-bg:#33291A; --daif:#F08C80; --daif-bg:#3A201E;
  --hl:#5B4A12; --hl-ink:#FFF4CC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141C; --surface:#1B1E2A; --ink:#E8EAF2; --muted:#9AA0B4; --line:#2C3042;
  --accent:#9DAEFF; --accent-soft:#252B47;
  --sahih:#6FD3A0; --sahih-bg:#16302A; --hasan:#E8BE62; --hasan-bg:#33291A; --daif:#F08C80; --daif-bg:#3A201E;
  --hl:#5B4A12; --hl-ink:#FFF4CC; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
header.top{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
header.top h1{font-family:var(--f-text);font-size:1.9rem;font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:.9rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1.1rem;padding:14px 16px 14px 44px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search button{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:6px 8px;border-radius:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.88rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip .n{opacity:.65;font-size:.8em;margin-inline-start:4px;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{font:inherit;font-size:.88rem;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;flex:1 1 150px;max-width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;padding-top:10px;gap:8px;flex-wrap:wrap}
.meta button{font:inherit;font-size:.85rem;border:0;background:none;color:var(--accent);cursor:pointer;padding:4px}
.list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.g-sahih{border-inline-start-color:var(--sahih)}.card.g-hasan{border-inline-start-color:var(--hasan)}.card.g-daif{border-inline-start-color:var(--daif)}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.84rem}
.kind{font-weight:600;color:var(--accent)}
.who{color:var(--muted)}
.badge{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px}
.b-sahih{background:var(--sahih-bg);color:var(--sahih)}.b-hasan{background:var(--hasan-bg);color:var(--hasan)}.b-daif{background:var(--daif-bg);color:var(--daif)}
.b-note{background:var(--accent-soft);color:var(--accent)}
.text{font-family:var(--f-text);font-size:1.28rem;line-height:1.95;margin:0;overflow-wrap:anywhere}
.text.clip{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 1px}
.more{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:.9rem}
.more h4{margin:0;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.more p{margin:0}
.more .intro{color:var(--muted);font-family:var(--f-text);font-size:1.05rem}
.loc{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.loc li{color:var(--ink)}
.loc li span{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.86rem;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn.flagged{background:var(--daif-bg);color:var(--daif);border-color:var(--daif)}
.btn:focus-visible,.chip:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.loadmore{margin:16px auto 0;display:block}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.9rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <h1>مكتبتي</h1>
    <p>مرجعي الخاص للأحاديث والآثار وأقوال العلماء الواردة في كتبي وأبحاثي، بتخريجها وأحكامها ومواضعها.</p>
  </header>

  <div class="bar">
    <div class="search">
      <input id="q" type="search" placeholder="اكتب طرفًا من حديث أو أثر أو اسم قائل…" autocomplete="off" aria-label="بحث">
      <button id="clear" aria-label="مسح البحث" hidden>✕</button>
    </div>
    <div class="chips" id="kinds" role="group" aria-label="نوع النص"></div>
    <div class="filters">
      <select id="grade" aria-label="الحكم">
        <option value="">كل الأحكام</option>
        <option value="sahih">صحيح</option>
        <option value="hasan">حسن</option>
        <option value="daif">ضعيف</option>
      </select>
      <select id="speaker" aria-label="القائل"><option value="">كل القائلين</option></select>
      <select id="chapter" aria-label="الفصل"><option value="">كل الفصول</option></select>
    </div>
  </div>

  <div class="meta"><span id="count"></span><span><button id="flags" hidden></button><button id="reset">إعادة الضبط</button></span></div>
  <div class="list" id="list"></div>
  <button class="btn loadmore" id="loadmore" hidden>عرض المزيد</button>
</div>

تعالى: الآية: طه: 108 أي: سكنت وذلت وخضعت »","وقال ابن القيم رحمه الله:","","",["مدارج السالكين (2/ 193) ط2 عطاءات العلم، 1441هـ."],[0],0],[3,"q","الشوكاني","","« وهو في اللغة: السكون والتواضع والخوف والتذلل »","وقال الشوكاني رحمه الله:","","",["فتح القدير (3/ 560) [المؤمنون: 2]."],[0],0],[4,"q","","","« الخشوع: الخُضوع، وبابهما واحد، يقال: خَشَع واختَشَع، وخشَعَ ببصره، أي: غضَّهُ »","وفي مختار الصحاح:","","",["مختار الصحاح (ص/ 91). مادة «خشع». ط2 المكتبة العصرية 1417هـ."],[0],0],[5,"n","المعجم الوسيط","","وفي المعجم الوسيط: خشع خشوعًا: خضع وذلَّ وخاف","","","",["المعجم الوسيط (ص/ 235) مادة «خشع». ط2 دار الدعوة، 1410هـ»."],[0],0],[6,"n","الشوكاني","","« والخاشعون، المتواضعون المخبتون، والخشوع: هيئة في النفس يظهر منها على الجوارح سكون وتواضع »","","","",["فتح القدير للشوكاني (1/ 158) [البقرة: ٤٥]. ط1 الدار العالمية، 1436هـ.","المحرر الوجيز (1/ 389) [البقرة (45 - 46)] ط الأوقاف القطرية، «الأولى المحققة 1436هـ»."],[0,0],0],[7,"s","علي بن أبي طالب","","« الخشوع في القلب، وأن تُلِين للمرء المسلم كَنَفَك، ولا تلتفت »","فعن علي بن أبي طالب رضي الله عنه، قال:","","",["تفسير الطبري (9/ 197) [سورة المؤمنون: 2]. ط3 دار الكتب العلمية، 1418هـ."],[0],0],[8,"q","البغوي","","« والخشوع قريبٌ من الخضوع، إلا أنَّ الخضوعَ في البدن، والخشوعَ في القلب والبصر والصوت، قال الله عز وجل: الآية: طه: 108 »","وقال البغوي رحمه الله:","","",["تفسير البغوي – معالم التنزيل (3/ 356) [البقرة: ٤٥]. ط1 إحياء التراث العربي، 1420هـ."],[0],0],[9,"q","محمد بن علي الترمذي","","« الخاشع: من خمدت نيران شهوته، وسكن دخان صدره، وأشرق نور التعظيم في قلبه؛ فماتت شهوته، وحيي قلبُه، فخشعت جوارحه »","وقال محمد بن علي الترمذي رحمه الله:","","",["الرسالة القشيرية (1/ 276)."],[0],0],[10,"q","ابن قرقول","","« وأثر الخشوع؛ هو أثر الخوف؛ من السكون في الجوارح وخفض الصوت، وغض البصر، وإقصاره على جهة الأرض »","وقال ابن قرقول رحمه الله:","","",["مطالع الأنوار على صحاح الآثار (2/ 479) ط1. الأوقاف القطرية، 1433هـ."],[0],0],[11,"q","ابن كثير","","« الخشوع: السكون والطمأنينة، والتؤدة والوقار والتواضع، والحامل عليه الخوف من الله ومراقبته »","وقال ابن كثير رحمه الله:","","",["تفسير ابن كثير (3/ 1856) [سورة الأحزاب: 35]. ط2، الأوقاف القطرية 1427هـ."],[0],0],[12,"q","السعدي","","« والخشوع هو: خضوع القلب وطمأنينته، وسكونه لله تعالى، وانكساره بين يديه؛ ذلًّا وافتقارًا، وإيمانًا به وبلقائه »","وقال السعدي رحمه الله:","","",["تفسير السعدي (1/ 45) [البقرة: ٤٥]. ط3 جمعية إحياء التراث الإسلامي، 1419هـ."],[0],0],[13,"q","الطبري","","« وكانوا لنا متواضعين متذللين، ولا يستكبرون عن عبادتنا ودعائنا »","وقال الطبري في - تفسير قوله تعالى -: الآية: الأنبياء: 90 يقول:","","",["تفسير الطبري (9/ 80) [الأنبياء: 90]."],[0],0],[14,"q","البغوي","","« … أي: الْمُتَوَاضِعِينَ … وقيل: أراد به الخشوع في الصلاة، ومن الخشوع أن لا يلتفت »","وقال البغوي رحمه الله في تفسير قوله: الآية: الأحزاب: 35 قال:","","",["تفسير البغوي (3/ 640) [الأحزاب: 35]."],[0],0],[15,"q","ابن القيم","","« والخشوع: قيام القلب بين يدي الرب بالخضوع والذل والجمعية عليه, وقيل: الخشوع: الانقياد للحق. وهذا من موجبات الخشوع, فمن علاماته: أن العبد إذا خولف ورُدَّ عليه بالحق؛ استقبل ذلك بالقبول والانقياد, وقيل: الخشوع خمود نيران الشهوة، وسكون دخان الصدور، وإشراق نور التعظيم في القلب. وقال الجنيد: الخشوع تذلل القلوب لعلام الغيوب. وأجمع العارفون على أن الخشوع محله القلب وثمرته على الجوارح، وهي تظهره »","وقال ابن القيم رحمه الله:","","",["مدارج السالكين (2/467). ط1 لمكتبة نزار مصطفى الباز 1421هـ."],[0],0],[16,"q","الطبري","","« معناه: ألم يَحِنْ للذين صدقوا الله ورسوله أن تلين قلوبهم لذكر الله؛ فتخضعَ قلوبُهم له، ولِمَا نزَلَ من الحق، وهو هذا القرآن الذي نزَّله على رسوله ﷺ »","قال ابن جرير الطبري رحمه الله:","","",["تفسير الطبري (11/ 681) [سورة الحديد: 16]."],[2],0],[17,"s","عبد الله بن مسعود","","« ما كان بين إسلامنا وبين أن عاتبنا الله بهذه الآية: … إلا أربعُ سِنين »","قال ابن مسعود رضي الله عنه:","","",["رواه مسلم (3027)."],[2,3],0],[18,"s","عبد الله بن عباس","","« إن الله استبطأ قلوب المؤمنين، فعاتبهم على رأس ثلاث عشرة سنة من نزول القرآن، فقال: … »","وقال ابن عباس رضي الله عنهما:","","",["تفسير البغوي (5/ 30). [سورة الحديد: 16]."],[2],0],[19,"a","سهل بن عبد الله التستري","","« من خشَعَ قلبُه لم يقربْ منه الشيطان »","وقال سهل بن عبد الله التُّسْتَري:","","",["الرسالة القشيرية (1/ 276)."],[2,4],0],[20,"q","القرطبي","","« قولُه تعالى: … حث على تأمُّل مواعظ القرآن، وبين أنه لا عذر في ترك التدبر، فإنه لو خوطب بهذا القرآن الجبال مع تركيب العقل فيها لانقادت لمواعظه، ولرأيتها على صلابتها ورزانتها خاشعة متصدعة؛ أي: متشققة من خشية الله، والخاشع: الذليل. والمتصدع: المتشقق، وقيل: خاشعًا لله بما كلفه من طاعته، … أن يعصيه فيعاقبَه. وقيل: هو على وجه المثل للكفار. قوله تعالى: … أي أنه لو أنزل هذا القرآن على جبل لخشع لوعده وتصدع لوعيده وأنتم أيها المقهورون بإعجازه لا ترغبون في وعده، ولا ترهبون من وَعِيدِهِ »","قال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (18/ 44) [سورة الحشر: 21].","تفسير القرطبي (18/ 44) [الحشر: 21]."],[2,5],0],[21,"q","الطبري","","« والخاشعة قلوبهم لله وجلًا منه ومِن عقابه، والخاشعات »","قال الطبري رحمه الله:","","",["تفسير الطبري (10/ 299) [الأحزاب: 35]."],[6],0],[22,"s","عبد الله بن حكيم","","« خطبنا أبو بكر رضي الله عنه، ثم قال: أما بعد، فإني أوصيكم بتقوى الله، وتثنوا عليه بما هو له أهل، وتخلطوا الرغبة بالرهبة، وتجمعوا الإلحاف بالمسألة، فإن الله أثنى على زكريا وأهل بيته، فقال: الآية: الأنبياء: 90 »","عن عبد الله بن حكيم رضي الله عنه، قال:","","",["تفسير ابن أبي حاتم (8/ 2466) رقم (13719) [الأنبياء: 90]."],[6],0],[23,"q","ابن رجب","","« إن الله عز وجل مدح في كتابه المخبتين له، والمنكسرين لعظمته والخاضعين، فقال تعالى: الآية: الأنبياء: 90. ووصف ربُّنا - سبحانه - المؤمنين بالخشوع له في أشرفِ عباداتهم التي هم عليها يحافظون، فقال تعالى: الآية: المؤمنون: 1-2 ووصف الذين أوتوا العلم بالخشوع، حيث يكون كلامه لهم مسموعًا، فقال تعالى: الآية: الإسراء: 107-109 »","وقال ابن رجب رحمه الله:","","",["تفسير ابن رجب (2/ 7) [سورة المؤمنون: 2]."],[6],0],[24,"q","الطبري","","« يقول تعالى ذكره: والذين إذا ذكَّرهم مذكِّر بحجج الله، لم يكونوا صمًّا لا يسمعون، وعميًا لا يبصرونها، ولكنهم يِقَاظُ القلوب، فهماء العقول، يفهمون عن الله ما يذِّكرهم به، ويفهمون عنه ما ينبههم عليه، فيوعون مواعظه آذانًا سمعته، وقلوبًا وعته »","قال الطبري رحمه الله:","","",["تفسير الطبري (9/ 423) [الفرقان 73]."],[6],0],[25,"q","القرطبي","","« المُخبِتُ: المتواضعُ الخاشع من المؤمنين. والخبت ما انخفض من الأرض، أي: بشِّرهم بالثواب الجزيل »","قال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (12/ 58) [الحج: ٣٤]."],[7,8],0],[26,"a","الحسن البصري","","« إن المؤمنين لمَّا جاءتهم هذه الدعوةُ من الله صدقوا بها وأفضى يقينها إلى قلوبهم خشعت لذلك قلوبُهم وأبدانهم وأبصارهم؛ كنت والله إذا رأيتهم رأيت قومًا كأنهم رأي عين؛ فوالله ما كانوا بأهل جدل ولا باطل، ولا اطمأنّوا إلَّا إلى كتاب الله، ولا أظهروا ما ليس في قلوبهم، ولكن جاءهم عن الله أمر فصدقوا به؛ فنعتهم الله تعالى في القرآن أحسن نعت، فقال: الآية: الفرقان: 63-65. قال الحسن: الهون في كلام العرب: اللين والسكينة والوقار. قال: … قال: حلماء لا يجهلون، وإذا جُهل عليهم حلموا، يصاحبون عباد الله نهارهم بما تسمعون، ثم ذكر ليلهم خير ليل فقال: …، ينتصبون لله على أقدامهم، ويفترشون وجوههم لربهم سُجَّدًا، تجري دموعهم على خدودهم؛ فَرَقًا من ربهم لأمرٍ ما، أسهروا له ليلهم، ولأمر ما، خشعوا له نهارهم. ثم قال: الآية: الفرقان: 65 قال: وكل شيء يصيب ابن آدم ثم يزول عنه فليس بغرامٍ، إنما الغرام: اللازم له ما دامت السماوات والأرض، قال: صدق القوم، والله الذي لا إله إلا هو، فعملوا ولم يتمنّوا، فإياكم - رحمكم الله - وهذه الأماني، فإن الله لم يعطِ عبدًا بالأمنية خيرًا قط في الدنيا والآخرة، وكان يقول: يا لَها موعظة لو وافقت من القلوب حياة »","قال الحسن البصري رحمه الله:","","",["تفسير ابن رجب (2/ 17) [المؤمنون: 2]."],[7],0],[27,"q","ابن رجب","","« فقوله رحمه الله في وصف هؤلاء الذين أوتوا العلم: …، مدحٌ لمن أوجب له سماعُ كتاب الله الخشوعَ في قلبه »","قال ابن رجب رحمه الله:","","",["تفسير ابن رجب (2/ 15) [المؤمنون: 2]."],[9],0],[28,"q","الطبري","","« يقول تعالى ذكره: ويخرُّ هؤلاء الذين أوتوا العلم من مؤمني أهل الكتابين من قَبْلِ نزول الفرقان، إذا يتلى عليهم القرآن لأذقانهم يبكون، ويزيدهم ما في القرآن من المواعظ والعبر خشوعًا، يعني: خضوعًا لأمر الله وطاعته، واستكانة له »","وقال الطبري رحمه الله:","","",["تفسير الطبري المسمى بـ «جامع البيان في تأويل القرآن» (8/ 165) [الإسراء: 109].","تفسير الطبري - جامع البيان (17/ 579) [الإسراء: 109]."],[9,10],0],[29,"s","عبد الله بن مسعود","","« إن أقوامًا يقرؤون القرآن لا يجاوز تراقيهم، ولكن إذا وقع في القلب فرسَخَ فيه نفَعَ »","وقال ابن مسعود رضي الله عنه:","","",["صحيح مسلم (822)."],[9],0],[30,"a","عبد الأعلى التيمي","","« من أوتيَ من العلم ما لا يُبكيه, لخليقٌ أنْ لا يكون أوتي علمًا ينفعه, لأن الله تعالى نعت العلماء؛ ثم قرأ قوله تعالى: الآية: الإسراء: 107-109 »","وقال عبد الأعلى التيمي رحمه الله:","","",["تفسير الطبري المسمى «جامع البيان في تأويل القرآن» (8/ 165) [الإسراء: 109].","مسند الدارمي (1/ 146) رقم (295)."],[9,10],0],[31,"q","ابن عطية","","« هذه مبالغة في صفتهم، ومدح لهم، وحضٌّ لكلّ من ترسم بالعلم وحصل منه شيئًا أن يجري إلى هذه الرتبة »","وقال ابن عطية رحمه الله:","","",["المحرر الوجيز (6/ 302) [الإسراء: 109]. ط1 الأوقاف القطرية 1436هـ  2015م."],[9],0],[32,"a","سفيان بن عيينة","","« أجهلُ الناس من ترك ما يعلم، وأعلمُ الناس من عمل بما يعلم، وأفضلُ الناس أخشعَهُم لله عز وجل »","وعن سفيان بن عيينة رحمه الله، قال:","","",["سنن الدارمي (342)."],[9],0],[33,"a","الحسن البصري","","« العلم علمان: علم باللسان وعلم بالقلب، فعلم القلب: هو العلم النافع، وعلم اللسان: هو حجة الله على ابن آدم »","وقال الحسن رحمه الله:","","",["تفسير ابن رجب (2/ 14) [سورة المؤمنون: 2]."],[9],0],[34,"q","القرطبي","","« قوله: … أي: تخشع وتسكن »","قال القرطبي رحمه الله:","","",["تفسير القرطبي (12/ 81) [الحج: ٥٤]."],[11],0],[35,"q","الشوكاني","","« أي: تخشع وتسكن وتنقاد، فإن الإيمان به وإخبات القلوب له لا يمكن أن يكونا تمكينًا من الشيطان بل للقرآن »","وقال به الشوكاني رحمه الله، وزاد:","","",["فتح القدير (3/ 1955) [الحج: ٥٤]. ط1 الدار العلمية 1436هـ 2015م.","فتح القدير (3/ 547) [الحج: ٥٤]."],[11,12],0],[36,"s","عبد الله بن مسعود","","« ينبغي لحامل القرآن أن يُعرف بليلِهِ إذا الناس نائمون، وبِنَهارِهِ إذا الناس مُفطرون، وبحزنه إذا الناس فرحون، وببكائه إذا الناس يضحكون، وبصمته إذا الناس يخلُطون، وبخشوعه إذا الناس يختالون. وينبغي لحامل القرآن: أن يكون باكيًا، محزونًا، حليمًا، حكيمًا، سِكِّيتًا. ولا ينبغي لحامل القرآن: أن يكون جافيًا، ولا غافلًا، ولا سخَّابًا، ولا صيّاحًا، ولا حديدًا »","وقال عبد الله بن مسعود رضي الله عنه:","","",["صفة الصفوة (1/188)."],[11,13],0],[37,"q","القرطبي","","« عن ابن عباسٍ رحمه الله، في تفسير قوله تعالى: الآية: فاطر: 28 قال: الذين علموا أن الله على كل شي قدير. وقال الربيع بن أنس: من لم يخش الله تعالى فليس بعالم. وقال مجاهد: إنما العالم من خشي الله عز وجل. وعن ابن مسعود رضي الله عنه: كفى بخشية الله تعالى علمًا، وبالاغترار جهلًا. وقيل لسعد ابن إبراهيم: من أفقه أهل المدينة؟ قال أتقاهم لربه عز وجل. وعن مجاهد قال: إنما الفقيه من يخاف الله عز وجل »","في تفسير القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (14/ 343) [فاطر: ٢٨]."],[14],0],[38,"n","ابن رجب","","وقال تعالى: الآية: الزمر: 22 ولينُ القلوبِ هو زوالُ قسوتِهَا، بحدوثِ الخُشوع فيها والرقةِ »","","","",["تفسير ابن رجب (2/ 15) [سورة المؤمنون: 2]."],[14,15],0],[39,"a","سفيان الثوري","","« كان يقالُ: العلماءُ ثلاثةٌ: عالمٌ بالله يخشى الله ليس بعالمٍ بأمرِ الله، وعالمٌ بالله عالمٌ بأمرِ الله يخشى الله، فذاك العالمُ الكاملُ، وعالمٌ بأمر الله ليس بعالمٍ بالله لا يخشى الله، فذلك العالم الفاجر »","وعن سفيان الثوري رحمه الله، قال:","","",["سنن الدارمي (375)."],[14],0],[40,"q","ابن رجب","","« فالعلم النافع هو ما باشر القلوب؛ فأوجب لها السكينةَ والخشية والإخبات لله، والتواضع والانكسار له، وإذا لم يباشر القلب ذلك من العلم، وإنما كان على اللسان؛ فهو حجة الله على ابن آدم يقوم على صاحبه وغيره! قال: فأخبر النبي ﷺ أن العلم عند أهل الكتابين من قبلنا موجود بأيديهم، ولا ينتفعون بشيء منه لما فقدوا المقصود منه؛ وهو وصوله إلى قلوبهم، حتى يجدوا حلاوة الإيمان به ومنفعته بحصول الخشية والإنابة لقلوبهم، وإنما هو على ألسنتهم تقوم به الحجة عليهم؛ ولهذا المعنى وصف الله تعالى في كتابه العلماء بالخشية كما قال الله تعالى: الآية: فاطر: 28 »","وقال ابن رجب رحمه الله:","","",["تفسير ابن رجب (2/ 14) [سورة المؤمنون: 2]."],[14],0],[41,"h","النبي ﷺ","","«الخشوع، حتى لا تكادُ ترى خاشعًا»","بل إن عوف بن مالك رضي الله عنه سمَّى الخشوع عِلمًا كما في الحديث: «وهل تدري أيُّ العلم أوَّلُ أن يُرفع؟» قال: قلت: لا أدري. قال:","صحيح","صححه الوادعي في الصحيح المسند مما ليس في الصحيحين رقم (473)",["رواه أحمد (23990) والنسائي في الكبرى (5878)، والطحاوي في مشكل الآثار (1/123). وصححه الوادعي في الصحيح المسند مما ليس في الصحيحين رقم (473)."],[14,16],0],[42,"h","النبي ﷺ","أبو الدرداء","«أوّلُ شيءٍ يُرفعُ من هذه الأمةِ الخُشوعُ، حتى لا ترى فيها خاشعًا»","وعن أبي الدرداء رضي الله عنه، عن النبي ﷺ قال:","صحيح","صححه الألباني في صحيح الجامع (2569)",["أخرجه الطبراني في الشاميين (1579)، وصححه الألباني في صحيح الجامع (2569)."],[16],0],[43,"q","النسفي","","« والفلاح: الظفر بالمطلوب والنجاة من المرهوب، أي: فازوا بما طلبوا أو نجوا مما هربوا... وأضيفت الصلاة إلى المصلين لا إلى الْمُصَلَّى له؛ لانتفاع المصلي بها وحدَه، وهي عدته وذخيرته، وأما المُصلى له فغنيٌّ عنها »","قال النسفي رحمه الله:","","",["تفسير النسفي - مدارك التنزيل وحقائق التأويل (2/ 458) [المؤمنون: 1]."],[17],0],[44,"h","النبي ﷺ","أبو هريرة","«لا يلجُ النارَ رجلٌ بكى من خشية الله حتى يعودَ اللبنُ في الضَّرع، ولا يجتمعُ غبارٌ في سبيل الله ودخانُ جهنمَ في مِنْخَرَيْ مُسلمٍ أبَدًا»","عن أبي هريرة رضي الله عنه، قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح الجامع (7778)",["رواه الترمذي (2311) والنسائي (3107) وأحمد (10560) وصححه الألباني في صحيح الجامع (7778)."],[18,19],0],[45,"q","السندي","","« ولعلَّ الله تعالى لا يوفق للبكاء من الخشية إلا من أرادَ له النجاة من النار ابْتِدَاءً »","قال السندي رحمه الله:","","",["حاشية السندي على سنن النسائي (6/ 12) حديث رقم (3107)."],[18,19],0],[46,"a","جعفر بن سليمان","","« وعظ مالك بن دينار يومًا فتكلم فبكى حوشب؛ فضرب مالك بيده على منكبه، وقال: ابكِ يا أبا بشر؛ فإنه بلغني أن العبد لا يزال يبكي حتى يرحمه سيده، فيعتقه من النار »","وعن جعفر بن سليمان قال:","","",["موسوعة ابن أبي الدنيا (3/173).","الرقة والبكاء لابن أبي الدنيا (17)."],[18,20],0],[47,"a","مالك بن دينار","","« البكاء على الخطيئة يحط الذنوبَ كما تحطُّ الريحُ الورقَ اليابسَ »","قال مالك بن دينار رحمه الله:","","",["المصدر السابق.","التوبة لابن أبي الدنيا (ص/ 140) رقم (191)."],[21,20],0],[48,"q","الطبري","","« اختلف أهل التأويل فيمن عنى بهذه الآية؛ فقال بعضهم: عنى بها أصحمة النجاشي، وفيه أنزلت. وقال آخرون: بل عنى بذلك عبد الله بن سَلامٍ ومن معه. وقال آخرون: بل عنى بذلك مُسْلِمة أهل الكتاب. … يعني: خاضعين لله بالطاعة، مستكينين له بها متذلِّلين »","قال ابن جرير رحمه الله:","","",["تفسير الطبري (3/ 559 - 560) [آل عمران: ١٩٩]."],[22],0],[49,"h","النبي ﷺ","","«رجلٌ ذكر الله خاليًا ففاضت عيناه»","وفي حديث السبعة الذين يظلهم الله في ظله يوم لا ظله، ذُكر منهم:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (629) ومسلم (91). من حديث أبي هريرة رضي الله عنه."],[22],0],[50,"a","وهب بن منبه","","« البكاء من خشية الله تعالى مثاقيل بِرٍّ، ليس ثوابه وزنًا، إنما يُعطى الباكي من خشية الله والصابر على طاعة الله أجرهم بغير حساب »","قال وهب بن منبه:","","",["تهذيب الحلية (2/246)."],[22],0],[51,"a","عمر بن ذر","","« ما رأيتُ باكيًا قطُّ إلا خُيِّل إليَّ أن الرحمة قد تنزَّلت عليه »","قال عمر بن ذر رحمه الله:","","",["موسوعة ابن أبي الدنيا (3/173)","الرقة والبكاء لابن أبي الدنيا (29)."],[23,20],0],[52,"a","أبو حازم","","« بلغنا أن البكاء من خشية الله مفتاح لرحمته »","وقال أبو حازم رحمه الله:","","",["موسوعة ابن أبي الدنيا (3/173)"],[23],0],[53,"n","ابن كثير","","قال الله عز وجل: الآية: البقرة: 45-46 أَيْ: مَشَقَّةٌ ثَقِيلَةٌ إِلَّا عَلَى الْخَاشِعِينَ","","","",["تفسير ابن كثير (1/ 109) [البقرة: ٤٥]."],[24],0],[54,"a","إبراهيم بن سفيان","","« إذا سكن الخوفُ القلوبَ أحرقَ مواضعَ الشهواتِ منها، وطرَدَ الدنيا عنها »","وقال إبراهيم بن سفيان رحمه الله:","","",["مدارج السالكين (٢/ ٤٦١)."],[15],0],[55,"q","ابن القيم","","« فالخاشعُ لله عبد قد خمدَتْ نيرانُ شهوته، وسكَنَ دخانُها عن صدره، فانجلى الصدر، وأشرق فيه نورُ العظمة. فماتتْ شهواتُ النفس، للخوف والوقار الذي حُشي به، وخمدت الجوارحُ، وتوقَّر القلب، واطمأنَّ إلى الله وذكره، بالسكينة التي تنزَّلتْ عليه من ربِّه، فصار مخبتًا له »","وقال ابن القيم رحمه الله:","","",["كتاب الروح - ابن القيم (2/ 656)."],[15],0],[56,"a","الحسن البصري","","« إنَّ المؤمنَ جمع إحسانًا وشفقةً، وإنَّ المنافقَ جمع إساءةً وأمنًا، وتلا هذه الآية: الآية: المؤمنون: 57-61 وقال المنافق: … »","عن الحسن رحمه الله، قال:","","",["تفسير الطبري (9/ 224) [المؤمنون: 60]."],[25],0],[57,"s","عبد الله بن مسعود","","« ومن تخشع لله تواضعاً رفعه الله يوم القيامة »","قال ابن مسعود رضي الله عنه:","","",["غريب القرآن لابن قتيبة (ص: 101)."],[26],0],[58,"a","قيس بن سليم العنبري","","« كان الضحاك بن مزاحم رحمه الله، إذا أمسى بكى، فقيل له: ما يبكيك؟ قال: لا أدري ما صعد اليوم من عملي! »","عن قيس بن سُلَيم العنبري رحمه الله، قال:","","",["","المجالسة وجواهر العلم للدينوري (7/ 98) رقم (2986)."],[27,28],0],[59,"a","","","« فمن علَت همَّتُه، وخشَعت نفسُه اتصف بكلِّ خلق جميل، ومن دنت همتُه، وطغَت نفسُه اتَّصف بكلِّ خُلُقٍ رذيل »","والله سبحانه أخبر عن الأرض بأنها تكون خاشعة، ثم ينزل عليها الماء، فتهتز، وتربو، وتأخذ زينتها، وبهجتها، فكذلك المخلوق منها إذا أصاب حظه من التوفيق » - إلى أن قال -:","","",["مدارج السالكين (1/ 516-517)."],[29],0],[60,"a","سفيان بن عيينة","","« البكاء من مفاتيح التوبة؛ ألا ترى أنه يَرِقُّ فيندم؟ »","عن سفيان بن عيينة رحمه الله، قال:","","",["الرقة والبكاء لابن أبي الدنيا (37)."],[30,20],0],[61,"a","المفضل بن مهلهل","","« بلغني أن العبد إذا بكى من خشية الله مُلئت جوارِحُه نورًا، واستبشرت ببكائه، وتداعت بعضها بعضًا: ما هذا النور؟ فيقال لها: هذا غشیَکم من نور البكاء »","عن المفضَّل بن مهلهل رحمه الله، قال:","","",["أخرجه ابن أبي الدنيا في الرقة والبكاء (35).","المصدر السابق (35)."],[31,20],0],[62,"n","عمر بن عبد العزيز","","كتب عمر بن عبد العزيز رحمه الله، إلى بعض أهله: أما بعد: فإنك إن استشعرت ذكر الموت في ليلك أو نهارك بُغِّضَ إليك كلُّ فان، وحُبِّبَ إليك كلُّ باق","","","",["سير أعلام النبلاء (5/ 138)."],[32],0],[63,"a","الأوزاعي","","« من أكثر ذكرَ الموتِ كفاه اليسيرُ، ومن عَلمَ أنَّ منطقَه من عمله قلَّ كلامُه »","وقال الأوزاعي رحمه الله:","","",["سير أعلام النبلاء (7/ 117)."],[32],0],[64,"q","ابن كثير","","« أي: أُمورُهم راجعةٌ إلى مشيئته يحكمُ فيها ما يشاءُ بعدلِه؛ فلهذا لمَّا أيقنوا بالمعاد والجزاءِ سَهُل عليهم فعلُ الطاعاتِ وتركُ المنكرات »","قال ابنُ كثيرٍ رحمه الله:","","",["تفسير ابن كثير (1/ 109) [البقرة: ٤٦]."],[33],0],[65,"q","","","« النَّاس عَلَى الطريق مَا لَمْ يزل عَنْهُم الخوف، فَإِذَا زال عَنْهُم الخوف ضلوا عَنِ الطريق »","قَالَ ذو النون رحمه الله:","","",["الرسالة القشيرية (1/ 254)."],[34],0],[66,"q","","","« لكل شَيْء زينة، وزينة العبادة الخوف، وعلامة الخوف قصر الأمل »","وقَالَ حاتم الأصم رحمه الله:","","",["الرسالة القشيرية (1/ 254)."],[34],0],[67,"q","ابن رجب","","« وأصل الخشوع: هو لين القلب ورقته، وسكونه، وخضوعه، وانكساره، وحرقته، فإذا خشع القلب تبعه خشوع جميع الجوارح، والأعضاء؛ لأنها تابعة له، كما قال النبي ﷺ: «ألا وإنّ في الجسد مضغةً، إذا صلحت صلح الجسد كلّه، وإذا فسدت فسد الجسد كلّه، ألا وهي القلب» »","قال ابن رجب الحنبلي رحمه الله:","","",["الخشوع، لابن رجب (ص/ 17). والحديث أخرجه البخاري (52)، ومسلم (1599)."],[35],0],[68,"q","ابن القيم","","« والخوف ليس مقصودًا لذاته، بل هو مقصود لغيره قصدَ الوسائل، ولهذا يزول بزوال المخوف، فإن أهل الجنة لا خوف عليهم ولا هم يحزنون ... والخوف المحمود الصادق: ما حال بين صاحبه وبين محارم الله عز وجل، فإذا تجاوز ذلك خيف منه اليأس والقنوط. قال أبو عثمان: صِدْقُ الخوف هو الورع عن الآثام ظاهرًا وباطنًا. وسمعت شيخ الإسلام ابن تيمية - قدس الله روحه - يقول: الخوف المحمود: ما حجزك عن محارم الله »","قال ابن القيم رحمه الله:","","",["مدارج السالكين (٢/ ٤٦٢)."],[36],0],[69,"n","عبد الدائم الكحيل","","ولكن القرآن لم يقتصر على التأمل المجرد، بل قرنه بالتفكر والتدبر وأخذِ العبرة والتركيز على الهدف، وسماه \"الخشوع\" وكان الخشوع من أهم العبادات وأصعبها لأنه يحتاج لتركيز كبير، وهكذا فإن كلمة \"الخشوع\" تدل على أقصى درجات التأمل مع التفكير العميق، وهذا الخشوع ليس مجرد عبادة، بل له فوائد مادية في علاج الأمراض واكتساب قدرات هائلة ومتجددة","","","",["الرابط: http://www.kaheel7.com/ar."],[37],0],[70,"n","","","يقول رحمه الله: الآية: الرعد: 28 وهكذا إخوتي وأخواتي! إذا أردتم أن تبعدوا عنكم اضطرابات القلب فعليكم بالخشوع ولو للحظات كل يوم","","","",["الرابط: http://www.kaheel7.com/ar."],[38],0],[71,"n","عبد الدائم الكحيل","","إن ممارسة الخشوع يعتبر بمثابة تهيئة وتنظيم وتقوية لعمل الدماغ","","","",["الرابط: http://www.kaheel7.com/ar."],[39],0],[72,"n","عبد الدائم الكحيل","","قام باحثون من كلية هارفارد الطبية حديثاً بدراسة التأثير المحتمل للتأمل على الدماغ، فوجدوا أن حجم دماغ الإنسان الذي يُكثر من التأمل أكبر من حجم دماغ الإنسان العادي الذي لم يعتد التأمل أو الخشوع، ولذلك هناك اعتقاد بأن التأمل يزيد من حجم الدماغ، أي يزيد من قدرات الإنسان على الإبداع والحياة السليمة والسعادة ... كما أظهرت هذه الدراسة (William J. Cromie, Harvard University) أنه كلما كانت مدة التأمل أكبر كان التأثير أوضح على الدماغ من حيث الحجم واستقرار عمل الدماغ، أي: أن هناك علاقة بين التأمل وحجم وسلامة الدماغ. طبعاً هذا التأثير على الدماغ يحدث بفعل التأمل فقط، ولكن الخشوع يعطي نتائج أكبر","","","",["الرابط: http://www.kaheel7.com/ar."],[40],0],[73,"n","عبد الدائم الكحيل","","وهو أفضل وسيلة لتعلم الصبر، وعلاج فعال للانفعالات، فإذا كان لديكم مشكلة نفسية مهما كان نوعها، فما عليكم إلا أن تتأملوا كل يوم في معجزة من معجزات القرآن مثلاً، أو تستمعوا لآيات من القرآن بشيء من التدبر، أي تعيشوا في جو الآيات، عندما تسمعون آية عذاب تتخيلون نار جهنم وحرّها، وعندما تستمعون لآية نعيم تتخيلون الجنة وما فيها من نعيم، وهكذا كانت قراءة النبي ﷺ للقرآن","","","",["الرابط: http://www.kaheel7.com/ar."],[41],0],[74,"n","عبد الدائم الكحيل","","لاحظ بعض العلماء عندما أجروا مسحاً للدماغ بالرنين المغنطيسي الوظيفي fMRI أن الإنسان الذي يتعود على التأمل، يكون أكثر قدرة على التحكم بعواطفه، وأكثر قدرة على التحكم بانفعالاته، وبالنتيجة أكثر قدرة على السعادة من غيره! كذلك فإن التأمل يؤدي إلى تنظيم عاطفة الإنسان وعدم الإسراف أو التهور في قراراته، لأن التأمل ينشط المناطق الحساسة في الدماغ تنشيطاً إيجابياً بحيث يزيل التراكمات السلبية والخلل الذي أصاب هذه الأجزاء نتيجة الأحداث التي مر بها الإنسان","","","",["الرابط: http://www.kaheel7.com/ar."],[42],0],[75,"n","عبد الدائم الكحيل","","العلاج، لأن القرآن جعل الخشوع والتأمل والتفكر في خلق الله عبادة عظيمة ... ولذلك يا إخوتي إذا كان لدى أحدكم مرضاً مستعصياً أو مزمناً، فما عليه إلا أن يجلس كل يوم لمدة ساعة مع معجزة من معجزات القرآن في الفلك أو الطب أو الجبال والبحار وغير ذلك، ويحاول أن يتعمق في خلق الله وفي عظمة هذا القرآن، وهذه الطريقة أعالج بها نفسي من بعض الأمراض، وكذلك من أي مشكلة نفسية، ولذلك أنصح كل مؤمن أن يلجأ إلى هذه الطريقة في العلاج","","","",["الرابط: http://www.kaheel7.com/ar."],[43],0],[76,"n","عبد الدائم الكحيل","","كذلك فإن أحد أساليب العلاج بالقرآن أن تضع يدك على منطقة الناصية ثم تقرأ آيات من القرآن بخشوع فيكون لها تأثير أكبر. وبالتالي يمكن القول إن المؤمن عندما يمارس الخشوع في عباداته وفي عمله وفي تفكره وتدبره لكتاب ربه، وحتى في علاقاته الاجتماعية، فإن هذه المنطقة؛ أي: الناصية تتنشط وتصبح أكثر قدرة على الإبداع وعلى توجيه الجسد وعلى اتخاذ القرارات الصحيحة","","","",["الرابط: http://www.kaheel7.com/ar."],[44],0],[77,"n","عبد الدائم الكحيل","","إذ أن انفصام الشخصية يمكن أن يسبب خسارة في خلايا الدماغ تصل إلى 10% من حجمه، ويمكن تعويض هذه الخسارة بقليل من الخشوع كل يوم!","","","",["الرابط: http://www.kaheel7.com/ar."],[45],0],[78,"a","أبو العالية","","« يعني الْخَائِفِينَ »","قال أبو العالية رحمه الله، في قوله: … قال:","","",["تفسير الطبري (1/ 300) [البقرة: ٤٦]."],[46],0],[79,"q","الطبري","","« ويعني بقوله: …: إلا على الخاضعين لطاعته، الخائفين سطواته، المصدقين بوعده ووعيده »","وقال الطبري رحمه الله:","","",["المصدر السابق (1/ 299) [البقرة: ٤٦]."],[46],0],[80,"q","الزبيدي","","« الخوف، وبه فسر قوله تعالى: الآية: المؤمنون: 2 أي: خائفون »","وقال الزبيدي رحمه الله: والخشوع:","","",["تاج العروس (20/ 510)."],[46],0],[81,"n","المعجم الوسيط","","وخَشَعَ: خاف","","","",["المعجم الوسيط؛ مادة: خشع. (ص/ 235)."],[46],0],[82,"a","ابن زيد","","« الخشوع: الخوف والخشية لله، وقرأ قول الله: الآية: الشورى: 45 قال: قد أذلهم الخوف الذي نزل بهم، وخشعوا له »","قال ابن زيد رحمه الله:","","",["تفسير الطبري (1/ 300) [البقرة: ٤٦]."],[47],0],[83,"q","السعدي","","« الخوف، والخشية، والخضوع، والإخبات، والوجل معانيها متقاربة، فالخوف يمنع العبد من محارم الله، وتشاركه الخشية في ذلك، وتزيد أنَّ خوفه مقرون بمعرفة الله، وأما الخضوع، والإخبات، والوجل، فإنها تنشأ عن الخوف والخشية، فيخضع العبد لله، ويخبت إلى ربه منيبًا إليه بقلبه، ويحدث له الوجل »","وقال العلامة السعدي رحمه الله:","","",["تيسير اللطيف المنان في خلاصة تفسير القرآن، (ص 361 – 362)، دار عالم الكتب."],[47],0],[84,"q","","","« الخَشيةُ: خوفٌ يشوبُه تعظيمٌ، وأكثرُ ما يكونُ ذلك عن علمٍ بما يُخشى منه، ولذلك خُصَّ العلماءُ بها في قوله: الآية: فاطر: 28، وقال: الآية: النساء: 9 أي: ليستشعروا خوفًا عن مَعرِفَتِه، وقال تعالى: الآية: الإسراء: 31 أي: لا تقتلوهم معتقدين مخافة أن يلحقهم إملاق، الآية: النساء: 25 أي: لمن خاف خوفًا اقتضاه معرفته بذلك من نفسه »","","","",["مفردات ألفاظ القرآن للعلامة الراغب الأصفهاني. (خشي)، [ص/ 235]."],[47],0],[85,"a","الضحاك","","« إنها لثقيلة. ويعني بقوله: …: إلا على الخاضعين لطاعته، الخائفين سطواته، المصدقين بوعده ووعيده »","قال الله عز وجل: الآية: البقرة: 45 عن الضحاك، في قوله: … قال:","","",["تفسير الطبري - جامع البيان ط دار التربية والتراث (1/ 15) [البقرة: ٤٦]."],[48],0],[86,"q","السعدي","","« الآية: الأنبياء: 90 أي: خاضعين متذللين متضرعين، وهذا لكمال معرفتهم بربهم »","وقال السعدي رحمه الله:","","",["تفسير السعدي (2/ 718) [الأنبياء: 90]."],[48],0],[87,"q","الراغب الأصفهاني","","« الخُضوعُ: الخُشوعُ، وقد تقدم، ورَجلٌ خُضَعَةٌ: كثيرُ الخُضوعِ، ويُقال: خَضَعْتُ اللحم، أي: قطَعتُه، وظليمٌ أَخضعٌ: في عُنقِهِ تَطامُنٌ »","وقال العلامة الراغب الأصفهاني رحمه الله:","","",["مفردات ألفاظ القرآن للعلامة الراغب الأصفهاني. (خضع) [ص/237]."],[48],0],[88,"n","يساره تحت رجله اليسرى","","وقد ورد في السنة استعمال لفظ الخشوع بمعنى الخضوع؛ فمن ذلك: حديث جَابِر بْنِ عَبْدِ اللَّهِ رضي الله عنه، قال: أتانا رسول الله ﷺ في مسجدنا هذا، وفي يده عرجون ابن طاب، فرأى في قبلة المسجد نخامة فحكها بالعرجون، ثم أقبل علينا فقال: «أيكم يحب أن يعرض الله عنه؟» قال: فخشعنا. ثم قال: «أيكم يحب أن يعرض الله عنه؟» قال: فخشعنا، ثم قال: «أيكم يحب أن يعرض الله عنه؟» قلنا: لا أينا، يا رسول الله! قال: «فإن أحدكم إذا قام يصلي، فإن الله عز وجل قبل وجهه، فلا يبصقن قبل وجهه ولا عن يمينه، وليبصق عن يساره تحت رجله اليسرى، فإن عجلت به بادرة فليقل بثوبه هكذا» ثم طوى ثوبه بعضه على بعض","","","",["رواه مسلم (3008)."],[48],0],[89,"q","النووي","","« «فخشعنا» هو من الخشوع، وهو الخضوع والتذلل والسكون، وأيضا غض البصر، وأيضا الخوف »","قال النووي: قوله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (18/ 137) حديث رقم (3008)."],[48],0],[90,"q","الماوردي","","« والفرق بين التواضع والخشوع أن التواضع في الأخلاق والخشوع في الأبدان »","قال الله تعالى: الآية: الحج: 34-35 قال الحسن رحمه الله: أي: الخاشعين. وقال الماوردي رحمه الله:","","",["تفسير الماوردي - النكت والعيون (4/ 25) [الحج: 34]."],[12],0],[91,"q","ابن عطية","","« والْمُخْبِتِينَ: المتواضعين الخاشعين من المؤمنين، والخبت ما انخفض من الأرض والمخبت المتواضع الذي مشيه متطامن كأنه في حدود من الأرض »","وقال ابن عطية رحمه الله:","","",["تفسير ابن عطية - المحرر الوجيز في تفسير الكتاب العزيز (4/ 122) [الحج: 34]."],[12],0],[92,"q","الراغب الأصفهاني","","« الخبت: المطمئن من الأرض، وأخبت الرجل: قصد الخبت، أو نزله، نحو: أسهل وأنجد، ثم استعمل الإخبات استعمال اللين والتواضع، ... وقوله تعالى: الآية: الحج: 54 أي: تلين وتخشع، والإخبات هاهنا قريب من الهبوط في قوله تعالى: الآية: البقرة: 74 »","وقال العلامة الراغب الأصفهاني رحمه الله:","","",["مفردات ألفاظ القرآن للعلامة الراغب الأصفهاني. مادة (خبت) [ص/ 226]."],[12],0],[93,"q","القرطبي","","« قوله: الآية: الحج: 54 … أي: تخشع وتسكن »","وقال القرطبي:","","",["تفسير القرطبي الجامع لأحكام القرآن (12/ 87) [الحج: ٥٤]."],[12],0],[94,"q","ابن القيم","","« والمخبِتُ: المطمئنُّ، فإنَّ الخَبْت من الأرض: ما تطامَن فاستنقع فيه الماء. فكذلك القلبُ المخبِتُ قد خشع وتطامَنَ، كالبقعة المطمئنة من الأرض التي يجري إليها الماءُ، فيستقرُّ فيها، وعلامته أن يسجدَ بين يدي ربه إجلالًا له وذلًّا وانكسارًا بين يديه سجدةً لا يرفع رأسَه منها حتى يلقاه. وأمَّا القلبُ المتكبِّرُ، فإنه قد اهتزَّ بتكبُّره ورَبا، فهو كبقعةٍ رابية من الأرض لا يستقرُّ عليها الماء »","وقال ابن القيم رحمه الله:","","",["كتاب الروح - ابن القيم (2/ 656).","كتاب الروح لابن القيم (2/ 656)."],[12,49],0],[95,"s","عبد الله بن عباس","","« يعني المُصَدِّقين بما أَنزلَ الله. وقال مُجَاهِدٌ رحمه الله: الْمُؤْمِنِينَ حَقًّا »","قال ابْنُ عَبَّاسٍ رحمه الله:","","",["تفسير ابن كثير (1/ 109) [البقرة: ٤٦]."],[50],0],[96,"q","البغوي","","« يعني: المؤمنين، وقال الحسن رحمه الله: الخائفين، وقيل: المطيعين »","وقال البغوي في تفسير قوله تعالى: الآية: البقرة: 45:","","",["تفسير البغوي تفسير البغوي (1/ 112) [البقرة: ٤٥]."],[50],0],[97,"a","مقاتل بن حيان","","« يعني به المتواضعين، وأصل الخشوع: السكون، قال الله تعالى: الآية: طه: 108 فالخاشع ساكن إلى طاعة الله تعالى »","قال مقاتل بن حيَّانَ رحمه الله:","","",["تفسير البغوي تفسير البغوي (1/ 112) [البقرة: ٤٥]."],[51],0],[98,"a","سعيد بن جبير","","« يعني: متواضعين، لا يعرف من عن يمينه، ولا من عن شماله، ولا يلتفت من الخشوع لله عز وجل »","وعن سعيد بن جبير، قال:","","",["تفسير ابن رجب (2/ 6) [المؤمنون: 2]."],[51],0],[99,"q","الماوردي","","« والخشوع في الله: التواضع، ونظيره الخضوع، وقيل: إن الخضوع في البدن، والخشوعَ في الصوت »","وقال الماوردي في تفسير قوله تعالى: الآية: البقرة: 45","","",["تفسير الماوردي النكت والعيون (1/ 116) [البقرة: ٤٥]."],[51],0],[100,"a","مجاهد","","« فمن القنوت طول الركوع، وغض البصر، وخفض الجناح، والخشوع من رهبة الله. كان العلماء إذا قام أحدهم يصلي يهاب الرحمن أن يلتفت، أو أن يقلب الحصى، أو يعبث بشيء، أو يحدث نفسه بشيء من أمر الدنيا إلا ناسيًا »","عن مجاهد بن جبر رحمه الله، في قوله: … قال:","","",["تفسير الطبري - جامع البيان (5/ 234) [البقرة: ٢٣٨]. والحلية لأبي نعيم (3/ 282)."],[52],0],[101,"q","أبو بكر الجصاص الحنفي","","« قوله …: فأُمر فيها بالدوام على الخشوع والسكون والقيام »","وقال أبو بكر الجصاص الحنفي رحمه الله:","","",["الزاهر في غريب ألفاظ الشافعي (ص/ 70)."],[52],0],[102,"q","أبو منصور الأزهري الهروي","","« والقنوت أيضًا: الخشوع، ومنه يقول الله - عز وجل - … أي: خاشعين »","وقال أبو منصور الأزهري الهروي رحمه الله:","","",["أحكام القرآن للجصاص ت قمحاوي (2/ 163)."],[52],0],[103,"q","ابن كثير","","« أي: في حال سجوده، وفي حال قيامه؛ ولهذا استدل بهذه الآية من ذهب إلى أن القنوت هو الخشوع في الصلاة، ليس هو القيام وحده كما، ذهب إليه آخرون »","قال ابن كثير رحمه الله:","","",["تفسير ابن كثير (4/ 2007) [الزمر: ٩]."],[52,53],0],[104,"q","الألوسي","","« أي: ومن تخشع وتخضع لله ورسوله وتعمل عملًا صالحا كصلاة وصوم وحج وإيتاء زكاة »","قال الألوسي رحمه الله:","","",["تفسير الألوسي - روح المعاني (11/ 183) [الأحزاب: 31]."],[52],0],[105,"s","عبد الله بن عباس","","« لو أني أنزلت هذا القرآن على جبل حملته إياه تصدّع وخشع من ثِقله، ومن خشية الله، فأمر الله عز وجل الناس إذا أنزل عليهم القرآن، أن يأخذوه بالخشية الشديدة والتخشع، قال: … »","عن ابن عباس رضي الله عنهما في تفسيرها يقول:","","",["تفسير الطبري - جامع البيان (23/ 301) [الزمر: ٩]."],[54],0],[106,"a","قتادة","","« يعذر الله الجبل الأصمّ، ولم يعذر شقيّ ابن آدم، هل رأيتم أحدًا قط تصدّعت جوانحه من خشية الله؟ … يقول تعالى ذكره: وهذه الأشياء نشبهها للناس، وذلك تعريفه جلّ ثناؤه إياهم أن الجبال أشدّ تعظيمًا لحقه منهم مع قساوتها وصلابتها. وقوله: … يقول: يضرب الله لهم هذه الأمثال ليتفكروا فيها، فينيبوا، وينقادوا للحق »","وعن قتادة رحمه الله، قال:","","",["تفسير الطبري - جامع البيان (23/ 301) [الزمر: ٩]."],[54],0],[107,"q","الراغب الأصفهاني","","« وقوله تعالى: الآية: الحج: 54 أي: تلين وتخشع، والإخبات هاهنا قريب من الهبوط في قوله تعالى: … »","قال الراغب الأصفهاني:","","",["مفردات ألفاظ القرآن للعلامة الراغب الأصفهاني. مادة (خبت). [ص/226]."],[55],0],[108,"q","الشوكاني","","« فإنَّ الغرَضَ من سياقِ هذا الكلامِ هو التصريحُ بأنَّ قلوبَ هؤلاء بلغتْ في القَسْوَةِ وفرْطِ اليُبْسِ المُوجِبَينِ لعدمِ قَبُولِ الحقِّ والتأثُّر للمواعظِ إلى مكانٍ لم تبلغْ إليه الحجارة، التي هي أشدُّ الأجسامِ صلابةً وأعظمُها صَلادةً، فإنها ترجعُ إلى نوع من اللين، وهي تفجُّرُها بالماء وتشقُّقُها عنه وقبولهُا لما توجِبُه الخشيةُ لله من الخشوعِ والانقياد بخلاف تلك القلوبِ، وفي قوله: الآية: البقرة: 74 من التهديد وتشديدِ الوعيد ما لا يخفى، فإن الله عز وجل إذا كان عالمًا بما يعملونه مطلعًا عليه غير غافلٍ عنه كان لمُجازاتِهم بالمِرصاد »","وقال الشوكاني رحمه الله:","","",["فتح القدير للشوكاني (1/ 187) [البقرة: ٧٤]."],[55],0],[109,"q","القشيري","","« الأرض تكون جدبة يابسة في الشتاء، فإذا نزل عليها المطر اهتزت بالنبات واخضرّت، وكذلك القلوب إذا خشعت لاستشعارها بما ألّمت به من الذنوب أقبل عليها الحق سبحانه، فظهرت فيها بركات الندم، وعفا عن أربابها ما قصروا في صدق القدم، وكذلك إذا وقعت للعبد فترة في معاملاته، أو غيبة عن بساط طاعاته، ثم تغمّده الحقّ- سبحانه- بما يدخل عليه من التذكر تظهر في القلب أنوار الوفاق، فيعود إلى مألوف مقامه، ويرجع عود سداده غضًّا طريًا، ويصير شجر وفاقه- بعد ما أصابته الجدوبة- بماء العناية مستقيًا. وكذلك إذا بدت لأهل العرفان وقفة، أو حدثت لهم من جرّاء سوء أدبٍ بدر منهم حجْبَة، ثم نظر الحقّ- سبحانه- إليهم بالرعاية .. اهتزّت رياض أنسهم، واخضرّت مشاهد قربهم، وانهزمت وفود وقفتهم. …: إن الذي أحيا الأرض بعد موتها قادر على إحياء النفوس بالحشر والنشر، وكذلك هو قادر على إحياء القلوب بنور العناية بعد الفترة والحجبة »","قال القشيري رحمه الله:","","",["لطائف الإشارات - تفسير القشيري (3/ 334) [فصلت: 39]."],[56],0],[110,"q","الطبري","","« ومن حجج الله أيضا وأدلته على قدرته على نشر الموتى من بعد بلاها، وإعادتها لهيئتها كما كانت من بعد فنائها أنك -يا محمد- ترى الأرض دارسة غبراء، لا نبات بها ولا زرع، … يقول تعالى ذكره: فإذا أنزلنا من السماء غيثًا على هذه الأرض الخاشعة اهتزت بالنبات. يقول: تحرّكت به. عن مجاهد، قوله: … قال: بالنبات، … يقول: انتفخت »","وقال الطبري رحمه الله:","","",["تفسير الطبري - جامع البيان (21/ 475) [فصلت: ٣٩]."],[56],0],[111,"q","ابن القيم","","« ومنه وصف الأرض بالخشوع وهو: يُبْسها وانخفاضها، وعدم ارتفاعها بالري والنبات »","وقال ابن القيم رحمه الله:","","",["مدارج السالكين (2/ 193) ط2 عطاءات العلم، 1441هـ."],[56],0],[112,"q","المعجم الوسيط","","« خَشَعَ الأَرضُ: يبست لعدم المطر. وذكر الآية »","وفي المعجم الوسيط:","","",["المعجم الوسيط، (ص/ 235) مادة: (خشع)."],[56],0],[113,"q","القرطبي","","« الخشوع في البصر: الخضوع والذلة، وأضاف الخشوع إلى الأبصار لأن أثر العز والذل يتبين في ناظر الإنسان. ويقال: خشع واختشع؛ إذا ذل. وخشع ببصره؛ أي: غضه »","قال الله عز وجل: الآية: القمر: 7 قال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (17/ 129) [القمر: ٧]."],[57],0],[114,"q","البغوي","","« وذلك أن المؤمنين يرفعون رؤوسهم من السجود ووجوههم أشد بياضًا من الثلج، وتسود وجوه الكافرين والمنافقين؛ … أي: يغشاهم ذلة الندامة والحسرة … قال إبراهيم التيمي: يعني إلى الصلاة المكتوبة بالأذان والإقامة. وقال سعيد بن جبير: كانوا يسمعون حي على الصلاة حي على الفلاح فلا يجيبون … أصِحَّاء فلا يأتونه، قال كعبُ الأحبار: والله ما نزلت هذه الآية إلا عن الذين يتخلفون عن الجماعات »","وقال تعالى: الآية: القلم: 43 قال البغوي رحمه الله:","","",["تفسير البغوي (5/ 142) [القلم: ٤٣]."],[57],0],[115,"q","القرطبي","","« والمعنى: أبصارُ أصحابِها، فحُذِف المُضاف »","وقال تعالى: الآية: النازعات: 8-9 قال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (19/ 196) [النازعات: ٩]."],[57],0],[116,"q","المعجم الوسيط","","« خَشَعَ بصرُه: اِنكسَرَ. وخَشَعَ الشيءُ: سكن. وخَشَعَ أيضًا: رمى ببصره نحو الأَرض وغضَّه. وخَشَعَ ببصره: غَضَّه »","وفي المعجم الوسيط:","","",["المعجم الوسيط، (ص/ 235)، مادة (خشع)."],[57],0],[117,"q","ابن عطية","","« والوجوه الخاشعة: هي وجوهُ الكفار، وخشوعُها: ذُلُّها وتغيُّرُها بالعذاب »","قال ابن عطية رحمه الله:","","",["تفسير ابن عطية - المحرر الوجيز (10/ 232) [الغاشية: ٢]."],[58],0],[118,"q","الطبري","","« يقول تعالى ذكره: وسَكنت أصوات الخلائق للرحمن، فوصف الأصوات بالخشوع، والمعنى لأهلها؛ إنهم خضع جميعهم لربهم، فلا تسمع لناطق منهم منطقًا إلا من أذن له الرحمن »","قال الطبري رحمه الله:","","",["تفسير الطبري (8/ 459) [طه: ١٠٨]."],[59],0],[119,"q","المعجم الوسيط","","« خَشَعَ صوتُه: اِنخفَضَ وسكن، وفي التنزيل العزيز قال تعالى: الآية: طه: 108 خَشَعَ: خَفَضَ صوتَه »","وفي المعجم الوسيط:","","",["المعجم الوسيط، (ص/235) مادة (خشع)."],[59],0],[120,"q","ابن الأثير","","« والخشوع في الصوت والبصر كالخُضوع في البدن »","وقال ابن الأثير رحمه الله:","","",["النهاية في غريب الحديث والأثر (ص/ 265)، مادة «خشع»."],[59],0],[121,"q","الماوردي","","« وفِي قوله تعالى: … ثلاثة تأويلات: أحدها: أن تلين قلوبهم لذكر الله. الثاني: أن تذل قلوبهم من خشية الله. الثالث: أن تجزع قلوبهم من خوف الله »","قال الماوردي رحمه الله:","","",["تفسير الماوردي - النكت والعيون (5/ 477) [الحديد: ١٦]."],[60],0],[122,"q","النسفي","","« أي: على النار إذ العذاب يدل عليها … متضائلين متقاصرين مما يلحقهم … إلى النار … ضعيفٍ بمسُارقةٍ كما ترى المصبور ينظر الى السيف »","قال النسفي رحمه الله، في تفسير قوله تعالى: …:","","",["تفسير النسفي - مدارك التنزيل وحقائق التأويل (3/ 260) [الشورى: ٤٥]."],[61],0],[123,"q","الزبيدي","","« وحشيشةٌ خاشعة: يابسة ساقطة على الأرض، وكذا خشع الورق، إذا ذبل »","قال الزبيدي رحمه الله:","","",["تاج العروس (20/ 510)."],[62],0],[124,"q","المعجم الوسيط","","« وخَشَعَ الورقُ ونحوه: ذَبل »","وفي المعجم الوسيط:","","",["المعجم الوسيط، (ص/ 235) مادة (خشع)."],[62],0],[125,"q","الزبيدي","","« ويقال: خشعت الشمس، وخسفت، وكسفت: بمعنى واحد، وهو مجاز »","قال الزبيدي رحمه الله:","","",["تاج العروس (20/ 510)."],[63],0],[126,"q","المعجم الوسيط","","« وخَشَعَ الشمسُ: كَسَفت، وخَشَعَ الكوكبُ: دَنا من المغيب »","وفي المعجم الوسيط:","","",["المعجم الوسيط، (ص/ 235) مادة (خشع)."],[63],0],[127,"a","","","« وخَشَعَ السَّــنامُ: ذهب شحــــمُه إِلا أَقلَّه »","في المعجم الوسيط:","","",["المصدر السابق."],[64],0],[128,"q","الزبيدي","","« وجدار خاشع: إذا تداعى واستوى مع الأرض »","قال الزبيدي رحمه الله:","","",["تاج العروس (20/ 510)."],[65],0],[129,"n","","","الخشوع: لبّ الصلاة وروحها، فلا يعرف عظمة الصلاة من لم يذق الخشوع فيها، وعلى قدر الخشوع يكون الأجر، ولمّا كان الخشوع بهذه المنزلة؛ فإنّ الشّارع الحكيم قد أحاط الصّلاة بسياج منيع من الأحكام التي غايتها وفائدتها الحفاظ على المصلّي من كلّ ما يشغله عن الصلاة، حتى لا يضيع عليه الخشوع","","","",["شرح بلوغ المرام للشيخ عطية محمد سالم رحمه الله تعالى [الشريط/ 1]."],[66],0],[130,"q","ابن القيم","","« للعبد بين يدي الله موقفان: موقفٌ بين يديه في الصلاة، وموقفٌ بين يَدَيْهِ يَوْم لِقَائِه. فَمن قَامَ بِحَق الْموقف الأول هُوِّن عَلَيْهِ الْموقف الآخر، وَمن استهان بِهَذَا الْموقف وَلم يوفِّه حقّه شُدّد عَلَيْهِ ذَلِك الْموقف؛ قَالَ تَعَالَى: الآية: الإنسان: 26-27 »","قال ابن القيم رحمه الله:","","",["الفوائد (ص/ ٢٩١)."],[66],0],[131,"q","ابن عثيمين","","« الخشوعُ هو طمأنينةُ القلب، وثباتُه مع سكون الأطراف؛ أي: الجوارح اليدين والرجلين والبصر والرأس. والخشوع هو لبُّ الصلاة وروحُها »","وقال ابن عثيمين رحمه الله:","","",["سلسلة فتاوى نور على الدرب« الشريط رقم [253]."],[66],0],[132,"q","السبكي","","« الخشوع قسمان: ظاهري، وباطني. فالظاهري: سكون الجوارح عن العبث وجَعْلُ بصرِه موضعَ سجودِه، والباطني: خوفُ القلبِ وخضوعُه، وَرِقَّـــــتُه وسكونُه، وحفظُه عن الاشتغالِ بغير ما هو فيه من التأمُّل في معاني القرآن؛ فينشأ عنه سكون الجوارح »","قال السّبكي رحمه الله:","","",["الدين الخالص أو إرشاد الخلق إلى دين الحق (2/ 263)."],[67],0],[133,"q","الشوكاني","","« والخُشُــوعُ: منهم مـن جعله مـن أفعالِ القلوب، كالخوف والرهبة، ومنهم من جعله من أفعال الجوارح، كالسكون وترك الالتفات والعبـث، وهـو في اللغة: السكون والتواضـع والخـوف والتذلل »","وقـال الشوكـاني رحمه الله:","","",["فتح القدير (3/ 560) [المؤمنون: 2]."],[67],0],[134,"s","أبو الدرداء","","« هو إعظام المقام، وإخلاص المقال، واليقين التام وجمع الاهتمام، ويتبع ذلك ترك الالتفات وهو من الشيطان »","قال أبو الدرداء رضي الله عنه:","","",["تفسير الألوسي - روح المعاني (9/ 206) [سورة المؤمنون: 2]."],[68],0],[135,"a","عطاء بن أبي رباح","","« هو أنْ لا تعبث بشيء من جسدك في الصلاة »","وقال عطاء رحمه الله:","","",["تفسير البغوي (3/ 358) [المؤمنون: 2]."],[68],0],[136,"a","الزهري","","« قال: هو سكون العبد في صلاته »","وعن الزهري رحمه الله:","","",["تفسير ابن رجب الحنبلي (2/ 6) [المؤمنون: 2]."],[68],0],[137,"q","السبكي","","« وقد اتفق العلماء على أنه يطلب من المصلي أن يكون خاشعًا خاضعًا مستحضرًا عظمةَ الله وهيبتَهُ، وأنه يناجي من لا تخفى عليه خافية لقوله تعالى: الآية: المؤمنون: 1-2 أي: خائفون من الله متذللون له، جاعلون أبصارهم إلى مواضع سجودهم ... وقد عدّ الغزاليُّ الخشوعَ رُكنًا من أركانِ الصلاة »","وقال السبكي رحمه الله:","","",["الدين الخالص أو إرشاد الخلق إلى دين الحق (2/ 263)."],[68,69],0],[138,"q","النسفي","","« قوله: الآية: المؤمنون: 1-2 أي: خائفون بالقلب ساكنون بالجوارح »","وقال النسفي رحمه الله:","","",["تفسير النسفي - مدارك التنزيل وحقائق التأويل (2/ 458) [المؤمنون: 2]."],[68],0],[139,"q","السعدي","","« قوله: الآية: المؤمنون: 1 أي: قد فازوا وسعِدوا ونجَحُوا، وأدركوا كلَّ ما يروم المؤمنون الذين آمنوا بالله وصدقوا المرسلين الذين من صفاتهم الكاملة أنهم … والخشوع في الصلاة: هو حضور القلب بين يدي الله تعالى، مستحضرًا لقربه، فيسكن لذلك قلبه، وتطمئن نفسه، وتسكن حركاته، ويقل التفاته، متأدبًا بين يدي ربه، مستحضرًا جميعَ ما يقوله ويفعله في صلاته، من أول صلاته إلى آخرها، فتنتفي بذلك الوساوس والأفكار الردية، وهذا روح الصلاة، والمقصود منها، وهو الذي يُكتب للعبد، فالصلاة التي لا خشوع فيها ولا حضور قلب، وإن كانت مجزئة مثابًا عليها، فإن الثواب على حسب ما يعقل القلب منها »","وقال السعدي رحمه الله:","","",["تفسير السعدي (2/ 744) [المؤمنون: 2]."],[68],0],[140,"q","ابن عطية","","« والخشوع: التطامن وسكون الأعضاء والوقار، وهذا إنما يظهر ممن في قلبه خوفٌ واستكانة »","قال ابن عطية رحمه الله:","","",["تفسير ابن عطية - المحرر الوجيز في تفسير الكتاب العزيز (4/ 136) [المؤمنون: 2]."],[70],0],[141,"q","الرازي","","« واختلفوا في الخشوع؛ فمنهم من جعله من أفعال القلوب كالخوف والرهبة، ومنهم من جعله من أفعال الجوارح كالسكون وترك الالتفات، ومنهم من جمع بين الأمرين، وهو الأولى »","وقال فخر الدين الرازي رحمه الله:","","",["تفسير الرازي - مفاتيح الغيب أو التفسير الكبير (23/ 259)."],[70],0],[142,"q","ابن رجب","","« وقد شرع الله لعباده من أنواع العبادات ما يظهر فيه خشوع الأبدان الناشئ عن خشوع القلب وذله وانكساره، ومن أعظم ما يظهر فيه خشوع الأبدان لله تعالى من العبادات: الصلاة... »","وقال ابن رجب رحمه الله:","","",["تفسير ابن رجب الحنبلي (2/ 18) سورة المؤمنون آية (2)."],[70],0],[143,"q","النسفي","","« وقيل: الخشوع في الصلاة: جمع الهمة لها والإعراض عما سواها، وأنْ لا يجاوز بصره مصلاه، وأنْ لا يلتفت، ولا يعبث، ولا يسدل، ولا يفرقع أصابعه، ولا يقلب الحصى، ونحو ذلك »","وقال النسفي رحمه الله:","","",["تفسير النسفي - مدارك التنزيل وحقائق التأويل (2/ 458) [المؤمنون: 2]."],[70],0],[144,"a","مجاهد","","« من القنوت الخشوع، وخفض الجناح من رهبة الله، وكان الفقهاء من أصحاب محمد ﷺ إذا قام أحدهم إلى الصلاة، لم يلتفت، ولم يقلب الحصى، ولم يحدث نفسه بشيء من أمر الدنيا إلا ناسيًا حتى ينصرف »","قال الله تعالى: الآية: البقرة: 238 عن مجاهد بن جبر رحمه الله، في قول الله: …، قال:","","",["تفسير الطبري - جامع البيان (5/ 235) [البقرة: 238]."],[53],0],[145,"q","ابن عطية","","« القنوت: طول الركوع والخشوع، وغض البصر، وخفض الجناح، وإحضار الخشية والفكر في الوقوف بين يدي الله تعالى »","وقال ابن عطية رحمه الله:","","",["تفسير ابن عطية - المحرر الوجيز في تفسير الكتاب العزيز (1/ 324) [البقرة: ٢٣٨]."],[53],0],[146,"q","السعدي","","« قوله تعالى: الآية: البقرة: 238 أي: ذليلين مخلصين خاشعين، فإن القنوت دوام الطاعة مع الخشوع »","وقال السعدي رحمه الله:","","",["تفسير السعدي (1/ 122) [البقرة: 238]."],[53],0],[147,"q","ابن القيم","","« وقد علَّق الله فلاح المُصَلِّين بالخشوع في صلاتهم، فدلَّ على أنَّ من لم يخشع فليس من أهل الفلاح، ولو اعْتُدَّ له بها ثوابًا لكان من المُفلحين »","قال ابن القيم رحمه الله:","","",["مدارج السالكين (2/ 471)."],[53],0],[148,"a","مجاهد","","« هو الخشوع في الصلاةِ »","عن مجاهدٍ رحمه الله، في قولهِ تعالى: … قال:","","",["تفسير ابن رجب الحنبلي (2/ 19) [المؤمنون: 2]، والزهد والرقائق لابن المبارك (ص/ 56) رقم (173)."],[53],0],[149,"h","النبي ﷺ","","«هل ترون قبلتي ههنا؟ فوالله ما يخفى عليَّ خشوعكم ولا ركوعكم، إني لأراكم من وراء ظهري»","وكان النبي ﷺ يحثُّ أصحابه على الخشوع في الصلاة، فمن ذلك: حديث أبي هريرة رضي الله عنه، أن رسول الله ﷺ، قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (418) ومسلم (424)."],[53],0],[150,"q","الباجي","","« يعني رحمه الله أنَّ ذلك ظاهر إليه، وإنما أراد بذلك حضهم على الخشوع وإتمام الركوع »","قال أبو الوليد الباجي رحمه الله:","","",["المنتقى شرح موطأ مالك (1/ 297) حديث رقم (460)."],[53],0],[151,"h","النبي ﷺ","أبو هريرة","«يا فلان، ألا تحسن صلاتك؟ ألا ينظر المصلي إذا صلى كيف يصلي؟ فإنما يصلي لنفسه. إني والله لأبصر من ورائي كما أبصر من بين يدي»","وعن أبي هريرة رضي الله عنه، قال: صلى بنا رسول الله ﷺ يومًا، ثم انصرف فقال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (423)."],[53],0],[152,"q","النووي","","« وفيه الأمر بإحسان الصلاة، والخشوع، وإتمام الركوع والسجود »","قال النووي رحمه الله:","","",["شرح النووي على مسلم (4/ 150)."],[53],0],[153,"a","الحسن البصري","","« كل صلاة لا يحضرها قلبك فهي إلى العقوبة أسرع منها إلى الثواب »","قال الحسن البصري رحمه الله:","","",["قوت القلوب لأبي طالب المكي (2/170)."],[53],0],[154,"q","ابن القيم","","« وإنَّ الرَّجُلين ليكون مقامهما في الصف واحدًا، وبين صلاتيهما كما بين السماء والأرض »","وقال ابن القيم رحمه الله:","","",["مدارج السالكين (2/474). ونمَاهُ في كتابه الوابل الصيب (ص/ 44) إلى حسان بن عطية."],[53],0],[155,"p","","","أَلا فِي الصَّلاةِ الْخَيْرُ وَالْفَضْلُ أَجْمَعُ … لأنَّ بِهَا الآرَابُ لِلَّهِ تَخْضَعُ … وَأَوَّلُ فَرْضٍ مِنْ شَرِيعَةِ دِينِنَا … وَآخِرُ مَا يَبْقَى إِذَا الدِّينُ يُرْفَعُ … فَمَنْ قَامَ لِلتَّكْبِيرِ لاقَتْهُ رَحْمَةٌ … وَكَانَ كَعَبْدٍ بَابَ مَوْلاهُ يَقْرَعُ … وَصَارَ لِرَبِّ الْعَرْشِ حِينَ صَلاَتِهِ … نجِيًّا فَيَا طُوبَاهُ لَوْ كَانَ يَخْشَعُ","","","",["تفسير القرطبي - الجامع لأحكام القرآن (12/ 104) [المؤمنون: ٢]."],[53],0],[156,"h","النبي ﷺ","عمرو بن عبسة السلمي","«ما منكم رجل يقرب وضوءه، فيتمضمض، ويستنشق، فينتثر إلا خرت خطايا وجهه وفيه وخياشيمه، ثم إذا غسل وجهه كما أمره الله إلا خرت خطايا وجهه من أطراف لحيته مع الماء، ثم يغسل يديه إلى المرفقين إلا خرت خطايا يديه من أنامله مع الماء، ثم يمسح رأسه إلا خرت خطايا رأسه من أطراف شعره مع الماء، ثم يغسل قدميه إلى الكعبين إلا خرت خطايا رجليه من أنامله مع الماء، فإن هو قام فصلى، فحمد الله، وأثنى عليه، ومجده بالذي هو له أهل، وفرغ قلبه لله، إلا انصرف من خطيئته كهيئته يوم ولدته أمه»","عن عمرو بن عبسة السلمي رضي الله عنه قال: قلت: يا نبيَّ الله، فالوضوء حدِّثْني عنه. قال: قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (832)."],[71],0],[157,"h","النبي ﷺ","عقبة بن عامر","«ما منكم من أحد يتوضأ فيبلغ (أو فيسبغ) الوضوء ثم يقول: أشهد أن لا إله إلا الله وأن محمدا عبد الله ورسوله، إلا فتحت له أبواب الجنة الثمانية، يدخل من أيها شاء»","ن قوله: «ما من مسلم يتوضأ فيحسن وضوءه، ثم يقوم؛ فيصلي ركعتين، مقبل عليهما بقلبه ووجهه، إلا وجبت له الجنة» قال: فقلت: ما أجود هذه! فإذا قائل بين يدي يقول: التي قبلها أجود, فنظرت فإذا عمر، قال: إني قد رأيتك جئت آنفًا. قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (234)."],[71],0],[158,"q","النووي","","« وقد جمع رحمه الله بهاتين اللفظتين أنواع الخضوع والخشوع؛ لأن الخضوع في الأعضاء، والخشوع بالقلب، على ما قاله جماعة من العلماء، قوله: (ما أجود هذه) يعني هذه الكلمة، أو الفائدة، أو البشارة، أو العبادة، وجودتها من جهات: منها أنها سهلة متيسرة يقدر عليها كل أحد بلا مشقة، ومنها أن أجرها عظيم، والله أعلم »","قال النووي رحمه الله:","","",["شرح النووي على مسلم (3/ 121)."],[71],0],[159,"h","النبي ﷺ","عثمان","وحديث عثمان رضي الله عنه قال: سمعت رسول الله ﷺ يقول: «ما من امرئ مسلمٍ تحضرُه صلاةٌ مكتوبةٌ، فيُحسِنُ وضوءَها وخُشوعَها وركوعَها إلا كانت كفارةً لِما قبلها من الذنوبِ ما لم يُؤتِ كبيرةً». وذلك الدهرَ كلَّه","وعن عثمان رضي الله عنه قال: سمعت رسول الله ﷺ يقول:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (228)."],[71,72],0],[160,"q","القاضي عياض","","« هذا المذكور في الحديث من غفران الذنوب «ما لم تؤت كبيرة» هو مذهب أهل السنة، وأن الكبائر إنما تكفرها التوبة أو رحمة الله تعالى وفضله، والله أعلم »","قال القاضي عياض رحمه الله:","","",["شرح النووي على مسلم (3/ 112) حديث (228)."],[71],0],[161,"q","ابن القيم","","« فإن الصلاة إنما تُكَفِّرُ سيئات من أدَّى حقها، وأكمل خشوعها، ووقف بين يدي الله تعالى بقلبه وقالبه؛ فهذا إذا انصرف منها وجد خِفَّةً من نفسه، وأحس بأثقالٍ قد وُضِعَتْ عنه، فوجد نشاطًا وراحًة وروحًا، حتى يتمنى أنه لم يكن خرج منها؛ لأنها قرةُ عينه، ونعيمُ روحه، وجنة قلبه، ومُسْتَراحُه في الدنيا، فلا يزال كأنه في سجن وضيق حتى يدخل فيها، فيستريح بها، لا منها، فالمُحِبُّون يقولون: نصلي فنستريح بصلاتنا، كما قال إمامهم وقدوتهم ونبيهم رحمه الله: «يا بلالُ أرِحنا بالصلاة» ولم يقل رحمه الله: أرحنا منها »","وقال ابن القيم رحمه الله:","","",["الوابل الصيب ورافع الكلم الطيب (ص/ 46)."],[71],0],[162,"h","النبي ﷺ","عمار بن ياسر","«إنَّ الرجلَ لينصرفُ وما كتب له إلا عُشْرُ صلاتِه تسْعُها ثمْنُها سبْعُها سدْسُها خمسُها ربعُها ثلثُها نصفُها»","عن عمار بن ياسر رضي الله عنه، قال: سمعت رسول الله ﷺ يقول:","حسن","حسنه الألباني في صحيح أبي داود (796)",["رواه أبو داود (796) وحسنه الألباني في صحيح أبي داود (796)."],[73],0],[163,"q","العظيم آبادي","","« قوله: «إِنَّ الرَّجُلَ لَيَنْصَرِفُ» أي: من صلاته «وَمَا كُتِبَ لَهُ إِلَّا عُشْرُ صَلَاتِهِ» أي: عشر ثوابها؛ لِمَا أخلَّ في الأركان والشرائط والخشوع والخضوع وغير ذلك، والجملة حالية «تُسْعُهَا ثُمْنُهَا سُبْعُهَا إِلَخْ» بحذف حرف العطف، والمعنى: أن الرجل قد ينصرف من صلاته ولم يكتب له إلا عشر ثوابها أو تسعها أو ثمنها إلخ، بل قد لا يكتب له شيء من الصلاة، ولا تقبل أصلًا كما ورد في طائفة من المصلين »","قال العظيم آبادي رحمه الله:","","",["عون المعبود شرح سنن أبي دواد، (3/ 3) حديث رقم (796)."],[73],0],[164,"s","عبد الله بن عباس","","« لَيْسَ لَك مِنْ صَلَاتِك إلَّا مَا عَقَلْت مِنْهَا »","وقال ابن عباس رضي الله عنهما:","","",["مجموع الفتاوى (15/ 236)، ومدارج السالكين (2/ 471)."],[73],0],[165,"a","عبد الواحد بن زيد","","« أَجْمَعَتِ الْعُلَمَاءُ على أنه لَيْسَ لِلْعَبْدِ مِنْ صَلَاتِهِ إِلَّا مَا عَقَلَ منها »","وقال عبد الواحد بن زيد رحمه الله:","","",["إحياء علوم الدين (1/161)."],[73],0],[166,"s","عمر بن الخطاب","","« إنّ الرّجل لَيَشِيبُ عارِضَاه في الإسلام وما أكمل لله تعالى صلاة، قيل: وكيف ذلك؟ قال: لا يتمّ خشوعَها وتواضُعَهَا وإقبالَه على الله عز وجل »","قال عمر بن الخطاب رضي الله عنه - يومًا على المنبر -:","","",["قوت القلوب لأبي طالب المكي (2/ 170) ط دار الكتب."],[74],0],[167,"q","ابن القيم","","« قالوا: وقد قال الله الآية: الماعون: 4-5، وليس السهو عنها تركها، وإلا لم يكونوا مصلين، وإنما هو السهو عن واجبها؛ إما عن الوقت كما قال ابن مسعود وغيره، وإما عن الحضور والخشوع، والصواب أنه يعم النوعين، فإنه سبحانه أثبت لهم صلاة، ووصفهم بالسهو عنها فهو السهو عن وقتها الواجب، أو عن إخلاصها وحضورها الواجب؛ ولذلك وصفهم بالرياء، ولو كان السهو سهو ترك لما كان هناك رياء, قالوا: ولو قدرنا أنه السهو عن واجب فقط، فهو تنبيه على التوعد بالويل على سهو الإخلاص والحضور بطريق الأولى؛ لوجوه: أحدها: أن الوقت يسقط في حال العذر، وينتقل إلى بدله، والإخلاص والحضور لا يسقط بحال، ولا بدل له. الثاني: أن واجب الوقت يسقط لتكميل مصلحة الحضور؛ فيجوز الجمع بين الصلاتين للشغل المانع من فعل إحداهما في وقتها بلا قلب ولا حضور، كالمسافر، والمريض، وذي الشغل الذي يحتاج معه إلى الجمع، كما نص عليه أحمد وغيره. فبالجملة: مصلحة الإخلاص والحضور، وجمعية القلب على الله في الصلاة أرجح في نظر الشارع من مصلحة سائر واجباتها، فكيف يظن به أنه يبطلها بترك تكبيرة واحدة، أو اعتدال في ركن، أو ترك حرف، أو شدة من القرآن، أو ترك تسبيحة، أو قول سمع الله لمن حمده، أو قول ربنا ولك الحمد، أو ذكر رسول الله ﷺ بالصلاة عليه، ثم يصححها مع فوت لبها، ومقصودها الأعظم، وروحها وسرها »","وقال ابن القيم رحمه الله:","","",["مدراج السالكين (2/ 472)."],[74],0],[168,"q","السعدي","","« أَيْ: قاصدين بجميع عباداتِهم الظاهرة والباطنة وجه الله، وطلب الزلفى لديه »","إن الخشوع عبادة من أجلِّ العبادات فلا بد أن يكون خالصًا لله عز وجل، وموافقًا لهدي رسول الله ﷺ، وأدلة الإخلاص والمتابعة في جميع العبادات تصلح دليلًا هاهنا، قال الله تعالى: الآية: البينة: 5 قال السعدي رحمه الله:","","",["تفسير السعدي (2/ 1299) [البينة: ٥]."],[75],0],[169,"q","الطبري","","« وقولُه: … يقول تعالى ذكره: فاخشعْ لله يا محمدُ بالطاعة، وأخلصْ له الألوهية، وأفرده بالعبادة، ولا تجعل له في عبادتك إياه شريكًا، كما فَعَلَتْ عَبَدةُ الأوثان »","وقال تعالى: الآية: الزمر: 2-3 قال الطبري رحمه الله:","","",["تفسير الطبري - جامع البيان (21/ 250) [الزمر: ٢]."],[75],0],[170,"h","النبي ﷺ","أبو هريرة","«قال الله عز وجل: أنا أغنى الشركاءِ عن الشرك، من عمل عملًا أشركَ فيه معي غيري تركتُه وشِركهُ»","عن أبي هريرة رضي الله عنه، قال: قال رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (2985)."],[75],0],[171,"q","النووي","","« ومعناه: أنا غني عن المشاركة وغيرها، فمن عمل شيئًا لي ولغيري لم أقبله، بل أتركه لذلك الغير، والمراد: أنَّ عمَلَ المرائي باطل لا ثواب فيه، ويأثم به »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (18/ 156) حديث رقم (2985)."],[75],0],[172,"h","النبي ﷺ","أبو سعد بن أبي فضالة ال","«إذا جمع الله الأولين والآخرين يوم القيامة، ليوم لا ريب فيه، نادى مناد: من كان أشرك في عمل عمله لله، فليطلب ثوابه من عند غير الله، فإن الله أغنى الشركاء عن الشرك»","وعن أبي سعد بن أبي فضالة الأنصاري - وكان من الصحابة - رضي الله عنهم، قال: قال رسول الله ﷺ:","حسن","حسنه الألباني في صحيح ابن ماجه (3407)",["رواه ابن ماجه (4203) والترمذي (3154) وحسنه الألباني في صحيح ابن ماجه (3407)."],[75],0],[173,"h","النبي ﷺ","أبو سعيد الخدري","«الشِّرْكُ الْخَفِيُّ، أَنْ يَقُومَ الرَّجُلُ يُصَلِّي، فَيُزَيِّنُ صَلَاتَهُ؛ لِمَا يَرَى مِنْ نَظَرِ رَجُلٍ»","وعن أبي سعيدٍ الخدري رضي الله عنه، قال: خرج علينا رسول الله ﷺ - ونحن نتذاكر المسيح الدجال - فقال: «ألا أخبركم بما هو أخوف عليكم عندي من المسيح الدجال؟» قال: قلنا: بلى، فقال:","حسن","حسنه الألباني في صحيح ابن ماجه (3408)",["رواه ابن ماجه (4204) وأحمد (11252) وحسنه الألباني في صحيح ابن ماجه (3408)."],[75,76],0],[174,"h","النبي ﷺ","عائشة أم المؤمنين","«من أحدث في أمرنا هذا ما ليس منه فهو ردٌّ»","وعن عائشة رضي الله عنها، قالت: قال رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (2697) ومسلم (1718)."],[75],0],[175,"a","","","« \"الرد\" هنا بمعنى المردود، ومعناه: فهو باطل غير معتد به. وهذا الحديث قاعدة عظيمة من قواعد الإسلام، وهو من جوامع كلِمِهِ رحمه الله؛ فإنه صريح في رد كل البدع والمخترعات »","قال أهل العربية:","","",["المنهاج شرح صحيح مسلم بن الحجاج (12/ 16) حديث رقم (1718)."],[75],0],[176,"s","أبو الدرداء","","« تعوَّذوا باللَّه من خشوع النفاق. قيل: يا أبا الدرداء وما خشوع النفاق؟ قال: أن ترى الجسد خاشعًا، والقلب ليس بخاشع »","عن أبي الدرداء رضي الله عنه، قال:","","",["مصنف ابن أبي شيبة (20/ 110)."],[75],0],[177,"a","","","« يا صاحب الرقبة! ارفعْ رقبتك، ليس الخشوع في الرقاب، إنما الخشوع في القلوب »","ورُويَ أنَّ عمر رضي الله عنه، نظر إلى رجل وهو يُطأطئُ رقبتَه، فقال:","","",["الكبائر للذهبي (ص/ 144)."],[75],1],[178,"a","","","« من هؤلاء؟ فقالوا: نُسَّاك. فقالت: كان عمرُ بن الخطاب رضي الله عنه، إذا مشى أسرع، وإذا قال أسمع، وإذا ضرب أوجع، وإذا أطعم أشبع، وكان هو الناسك حقًّا »","ورأتْ عائشة رضي الله عنها، شبابًا يمشون ويتماوتون في مشيتهم، فقالت لأصحابها:","","",["مدارج السالكين (2/467)."],[75],0],[179,"q","الماوردي","","« فلم ير ذلك منه حسنًا؛ لأنه اتهمه بالرياء، ولعلّه كان بريئًا منه، فكيف بمن صار الرياءُ أغلبَ صفاتِه، وأشهرَ سِماتِه »","قال الماوردي - بعد أن أورد هذا الأثر -:","","",["أدب الدنيا والدين للماوردي (ص/ 105)."],[75],0],[180,"a","أبو علي الدقاق","","« واتفقوا على أن الخشوع محله القلب، ورأى بعضهم رجلا منقبض الظاهر منكسر الشاهد قد زوى منكبيه، فقال: يا فلان الخشوع ههنا، وأشار إلى صدره ، لا ههنا، وأشار إلى منكبيه »","وقال أبو علِيٍّ الدَّقَّاق رحمه الله:","","",["الرسالة القشيرية (1/ 276)."],[75],0],[181,"a","الفضيل بن عياض","","« كان يُكرَهُ أن يُرِيَ الرجلُ من الخشوع أكثرَ مما في قلبه »","وقال الفضيل رحمه الله:","","",["مدارج السالكين (2/467)."],[75],0],[182,"p","","","حَسْبُ المُرائين غَبْناً أنهمْ غَرَسُوا … وما جَنَوْا، ولَقُوا كَدَّاً وإزعاجاً … وأنهمْ حُرِموا أجراً ومَحْمِدَةً … وأَلْحَموا عِرضَهُمْ مَنْ عابَ أَوْ هاجا … أُخيَّ فابغِ بما تُبديهِ مِنْ قُرَبٍ … وجهَ المُهيمِنِ؛ ولاَّجَاً وخَرَّاجا … فليس تخفى على الرحمنِ خافيةٌ … إنْ أخلصَ العبدُ في الطاعاتِ أوْ دَاجَا … وبادِرِ الموتَ بالحُسنى تُقَدِّمُها … فما يُنَهْنَهُ داعي الموتِ إنْ فاجَا","","","",["مقامات الحريري (ص/ 234) المقامة الحادية والثلاثون- «الرَّمْليّة»."],[75],0],[183,"h","النبي ﷺ","التفاته إلى غيره ممن هو بين يديه","ثم قال ابن رجب: « أصل الخشوع؛ هو خشوع القلب، وهو انكساره لله، وخضوعه وسكونه عن التفاته إلى غيره ممن هو بين يديه، فإذا خشع القلب خشعت الجوارح كلها تبعًا لخشوعه، ولهذا كان النبي ﷺ يقول في ركوعه","ثم قال ابن رجب: « أصل الخشوع؛ هو خشوع القلب، وهو انكساره لله، وخضوعه وسكونه عن التفاته إلى غيره ممن هو بين يديه، فإذا خشع القلب خشعت الجوارح كلها تبعًا لخشوعه، ولهذا كان النبي ﷺ يقول في ركوعه","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (771) وأبو دود (760) والترمذي (3421)."],[77],0],[184,"q","ابن رجب","","« أصل الخشوع؛ هو خشوع القلب، وهو انكساره لله، وخضوعه وسكونه عن التفاته إلى غيره ممن هو بين يديه، فإذا خشع القلب خشعت الجوارح كلها تبعًا لخشوعه، ولهذا كان النبي ﷺ يقول في ركوعه: «خشع لك سمعي، وبصري، ومخي، وعظامي، وما استقل به قدمي» »","ثم قال ابن رجب:","","",["تفسير ابن رجب الحنبلي (2/ 10) [سورة المؤمنون:2]."],[77],0],[185,"q","ابن القيم","","« والفرق بين خشوع الإيمان وخشوع النِّفاق: أنَّ خشوع الإيمان؛ هو خشوعُ القلب لله بالتعظيم والإجلال والوقار والمهابة والحياء، فينكسر القلبُ لله كَسْرةً ملتئمةً من الوجل والخجل والحبِّ والحياء، وشهود نِعَم الله، وجناياته هو، فيخشع القلب لا محالة، فيتبعه خشوعُ الجوارح. وأما خشوعُ النِّفاق، فيبدو على الجوارح تصنُّعًا وتكلُّفًا، والقلب غير خاشع، فالخاشعُ لله عبد قد خمدَتْ نيرانُ شهوته، وسكَنَ دخانُها عن صدره، فانجلى الصدر، وأشرق فيه نورُ العظمة. فماتتْ شهواتُ النفس، للخوف والوقار الذي حُشي به، وخمدت الجوارحُ، وتوقَّر القلب، واطمأنَّ إلى الله وذكره، بالسكينة التي تنزَّلتْ عليه من ربِّه، فصار مخبتًا له... فهذا خشوع الإيمان. وأما التماوت وخشوع النِّفاق، فهو حال عبد تكلَّف إسكانَ الجوارح تصنُّعًا ومراياةً، ونفسُه في الباطن شابّةٌ طريَّةٌ ذاتُ شهوات وإرادات. فهو يتخشّع في الظاهر، وحَيَّةُ الوادي وأسدُ الغابة رابضٌ بين جنبيه ينتظر الفريسة »","وقال ابن القيم رحمه الله:","","",["كتاب الروح لابن القيم (2/ 655 – 656)."],[77],0],[186,"q","ابن القيم","","« الثامن: بكاء النفاق، وهو: أن تدمعَ العينُ، والقلب قاسٍ؛ فيُظهر صاحبُه الخشوع، وهو من أَقْسَى النّاسِ قَلْبًا »","وكذلك سمَّى ابنُ القيم رحمه الله، البكاءَ بدون خشوعِ القلبِ ببكاء النفاق؛ فقال:","","",["زاد المعاد (1/ 126)."],[77],0],[187,"a","","","«ألا أدُلُّك على شيءٍ إذا فعلتَه ذهب عنك قليلهُ وكثيرهُ؟ قل: اللهم إني أعوذُ بك أن أشرِكَ بك وأنا أعلمُ، وأستغفِرُك لما لا أَعلمُ»","ثم قال - رحمه الله-:","صحيح","صححه الألباني في صحيح الأدب المفرد (551)",["أخرجه أبو يعلى (60)، وابن السني في عمل اليوم والليلة (286)، وصححه الألباني في صحيح الأدب المفرد (551)."],[76],0],[188,"h","النبي ﷺ","أنس بن مالك","«اللَّهمَّ إنِّي أعوذُ بِك منَ العَجزِ، والكسَلِ، والبخلِ، والهرَمِ، والقسوةِ، والغفلةِ، والذِّلَّةِ، والمسكَنةِ، وأعوذُ بِك منَ الفقرِ، والكفرِ، والشِّركِ، والنِّفاقِ، والسُّمعةِ، والرِّياءِ، وأعوذُ بِك منَ الصَّممِ، والبَكَمِ، والجنونِ، والبَرَصِ، والجذامِ، وسيِّئِ الأسقامِ»","وعن أنس بن مالك رضي الله عنه قال: كان النبي ﷺ يدعو، يقول:","صحيح","صححه الوادعي في الصحيح المسند مما ليس في الصحيحين (39)",["أخرجه الحاكم (1/ 530)، وابن حبان (1023) وصححه الوادعي في الصحيح المسند مما ليس في الصحيحين (39)."],[76,78],0],[189,"q","ابن رجب","","« فمن تحقق أن كل مخلوق فوق التراب فهو تراب، فكيف يقدم طاعةَ شيء من التراب عَلَى طاعة رب الأرباب؟ أم كيف يُرضي التراب بسخط الملك الوهاب إن هذا لشيء عجاب! »","قال ابن رجب رحمه الله:","","",["نور الاقتباس في مشكاة وصية النبي - صلى الله عليه وسلم - لابن عباس. لابن رجب (3/ 142)."],[76],0],[190,"a","أبو عبد الله البراثي","","« من زَهِدَ على حقيقة كانت مؤونته في الدنيا خفيفة، ومن لم يعرف ثواب الأعمال ثقُلتْ عليه في جميع الأحوال »","4- العلم بثواب الإخلاص، وشؤم الرياء على العامل في الدنيا والآخرة، وقد قال أبو عبد الله البراثي، - رحمه الله -:","","",["الزهد لابن أبي الدنيا (ص73) رقم (139)."],[76],0],[191,"q","ابن حجر","","« والمقرر أنَّ إخفاءَ العملِ الصالحِ غيرِ الفرضِ أفضلُ من إظهاره »","5- إخفاء الخشوع، وبقية الأعمال الصالحة قدر المستطاع؛ قال الحافظ ابن حجر رحمه الله:","","",["فتح الباري لابن حجر (3/ 550)."],[76],0],[192,"q","ابن الجوزي","","« ومن نظرَ في سيرِ السلف من العلماء العاملين استقر في نفسه؛ فلم يتكبر، ومن عرفَ اللهَ لم يُراء، ومن لاحظ جريان أقداره على مقتضى إرادته لم يحسد »","قال ابن الجوزي رحمه الله:","","",["تلبيس إبليس (ص/ 116)."],[76,79],0],[193,"a","حمدون القصار","","« من نظر في سير السّلف عرف تقصيره وتخلفه عن درجات الرجال »","وقال حمدون القصّار رحمه الله:","","",["الاعتصام للشاطبي (ص/ 86)."],[76,79],0],[194,"a","عمر بن عبد العزيز","","« أما بعد: فإنك إن استشعرت ذكر الموت في ليلك أو نهارك بُغِّضَ إليك كلُّ فان، وحُبِّبَ إليك كلُّ باق »","7- تذكُّر الموت وما بعده؛ من الحساب والجزاء والنكال الذي يعاقب به الذين يراؤون بأعمالهم، كتب عمر بن عبد العزيز رحمه الله، إلى بعض أهله:","","",["سير أعلام النبلاء (5/ 138)."],[76],0],[195,"h","النبي ﷺ","أمتي ما حدثت به","«إن الله تجاوز عن أمتي ما حدَّثت به أنفسها ما لم تعمل أو تتكلم»","الأمر الأول: أن يُدافع الرياء، ولا يسكن إليه، بل يعرض عنه، ويكرهه: فإنه لا يؤثر شيئاً، لقوله رحمه الله","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (5269)."],[80],0],[196,"h","النبي ﷺ","","«مَنْ سَرَّتْهُ حَسَنَتُهُ وَسَاءَتْهُ سَيِّئَتُهُ فَذَلِكَ الْمُؤْمِنُ»","وليس مِن الرياء أن يفرح الإنسان بعلم الناس بعبادته؛ لأن هذا إنما طرأ بعد الفراغ من العبادة. وليس مِن الرياء أن يُسَرَّ الإنسان بفعل الطاعة؛ لأن ذلك دليل إيمانه، قال النبي ﷺ:","صحيح","صححه الألباني في صحيح الجامع الصغير (2546) عن عمر [unknown symbol]",["رواه الترمذي (2165) وصححه الألباني في صحيح الجامع الصغير (2546) عن عمر رضي الله عنه."],[80],0],[197,"q","ابن عثيمين","","« اتصال الرياء بالعبادة على ثلاثة أوجه: الوجه الأول: أن يكون الباعث على العبادة مراءاة الناس مِن الأصل، كمن قام يصلِّي مراءاة الناس، مِن أجل أن يمدحه الناس على صلاته، فهذا مبطل للعبادة. الوجه الثاني: أن يكون مشاركاً للعبادة في أثنائها؛ بمعنى: أن يكون الحامل له في أول أمره الإخلاص لله، ثم طرأ الرياء في أثناء العبادة، فهذه العبادة لا تخلو من حالين: الحال الأولى: أنْ لا يرتبط أول العبادة بآخرها، فأولُّها صحيح بكل حال، وآخرها باطل. مثال ذلك: رجل عنده مائة ريال يريد أن يتصدق بها، فتصدق بخمسين منها صدقةً خالصةً، ثم طرأ عليه الرياء في الخمسين الباقية، فالأُولى صدقة صحيحة مقبولة، والخمسون الباقية صدقة باطلة لاختلاط الرياء فيها بالإخلاص. الحال الثانية: أن يرتبط أول العبادة بآخرها: فلا يخلو الإنسان حينئذٍ مِن أمرين: الأمر الأول: أن يُدافع الرياء، ولا يسكن إليه، بل يعرض عنه، ويكرهه: فإنه لا يؤثر شيئاً، لقوله رحمه الله «إن الله تجاوز عن أمتي ما حدَّثت به أنفسها ما لم تعمل أو تتكلم». الأمر الثاني: أن يطمئنَّ إلى هذا الرياء، ولا يدافعه، فحينئذٍ تبطل جميع العبادة؛ لأن أولها مرتبط بآخرها. مثال ذلك: أن يبتدئ الصلاة مخلصاً بها لله تعالى، ثم يطرأ عليها الرياء في الركعة الثانية، فتبطل الصلاة كلها؛ لارتباط أولها بآخرها. الوجه الثالث: أن يطرأ الرياء بعد انتهاء العبادة: فإنه لا يؤثر عليها، ولا يبطلها؛ لأنها تمَّت صحيحة فلا تفسد بحدوث الرياء بعد ذلك. وليس مِن الرياء أن يفرح الإنسان بعلم الناس بعبادته؛ لأن هذا إنما طرأ بعد الفراغ من العبادة. وليس مِن الرياء أن يُسَرَّ الإنسان بفعل الطاعة؛ لأن ذلك دليل إيمانه، قال النبي ﷺ: «مَنْ سَرَّتْهُ حَسَنَتُهُ وَسَاءَتْهُ سَيِّئَتُهُ فَذَلِكَ الْمُؤْمِنُ». وقد سئل النبي ﷺ عن ذلك فقال: «تِلْكَ عَاجل بشرى الْمُؤمن» »","قال الشيخ ابن عثيمين رحمه الله:","","",["مجموع فتاوى الشيخ ابن عثيمين (2/ 29، 30). والحديث رواه مسلم (2642) عن أبي ذر رضي الله عنه."],[80],0],[198,"n","","","وأوصى بذلك معاذٌ الصنابحيَّ، وأوصى به الصنابحيُّ أبا عبد الرحمن","","صحيح","صححه الألباني في صحيح الجامع (7969)",["رواه أبو داود (1522) والنسائي (1303) وصححه الألباني في صحيح الجامع (7969). والوادعي في الصحيح المسند مما ليس في الصحيحين (1107)."],[81],0],[199,"h","النبي ﷺ","عبد الله بن عباس","«رب أعني ولا تعن علي، وانصرني ولا تنصر علي، وامكر لي ولا تمكر علي، واهدني ويسر الهدى لي، وانصرني على من بغى علي، رب اجعلني لك شكّارًا، لك ذكارًا، لك رهّابًا، لك مطواعًا، لك مخبتًا، إليك أواهًا منيبًا، رب تقبل توبتي، واغسل حوبتي، وأجب دعوتي، وثبت حجتي، وسدد لساني، واهد قلبي، واسلل سخيمة صدري»","وعن ابن عباس رضي الله عنهما، قال: كان النبي ﷺ يدعو يقول:","صحيح","صححه الألباني في صحيح الأدب المفرد (516)",["رواه الترمذي (3551) والحاكم في المستدرك (1910) وصححه الألباني في صحيح الأدب المفرد (516)."],[81],0],[200,"q","الملا علي القاري","","« قوله: «لك مخبتًا» أي: خاضعًا خاشعًا متواضعًا، من الخبت وهو المطمئن من الأرض »","قال الملا علي القاري رحمه الله:","","",["مرقاة المفاتيح شرح مشكاة المصابيح (5/ 1723)."],[81],0],[201,"n","اللجنة الدائمة","","عليك أن تستعين بالله في إحضار قلبك في الصلاة في الخشوع فيها، وسؤاله سبحانه أن يعيذك من الشيطان، ومن وساوسه، وهو سبحانه سميع قريب، يجيب دعوة الداعي إذا دعاه صادقًا مخلصًا - وفقك الله وأعانك على ذكره وشكره -، وبالله التوفيق وصلى الله على نبينا محمد وآله وصحبه وسلم","","","",["اللجنة الدائمة للبحوث العلمية والإفتاء. الرئيس/ عبد العزيز بن عبد الله بن باز. (٧/ ٢٧)."],[81],0],[202,"h","النبي ﷺ","زيد بن أرقم","«اللهم إني أعوذُ بك من العجز، والكسل، والجبن، والبخل، والهرم، وعذاب القبر، اللهم آت نفسي تقواها، وزَكِّها أنت خيرُ من زكَّاها، أنت وليُّها ومولاها، اللهم إني أعوذ بك من علم لا ينفع، ومن قلب لا يخشع، ومن نفس لا تشبع، ومن دعوة لا يستجاب لها»","وعن زيد بن أرقم رضي الله عنه، قال: لا أقولُ لكم إلا كما كان رسول الله ﷺ يقول: كان يقول:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (2722).","رواه مسلم (2722) وأحمد (19308)."],[78,82],0],[203,"q","الطيبي","","« اعلم أنَّ في كلٍّ من القرائن ما يشعر بأن وجوده مبني على غايته, وأن الغرض منه تلك الغاية, وذلك أن تحصيل العلم إنما هو للانتفاع بها, فإذا لم ينتفع لا يخلص منه كفافاً, بل يكون وبالاً, ولذلك استعاذ منه, وأنَّ القلب إنما خُلق لأن يتخشَّع لبارئه وينشرح لذلك الصدر, ويقذف النور فيه, فإذا لم يكن كذلك كان قاسيًا فيجب أن يُستعاذ منه, قال تعالى: الآية: الزمر: 22, وأنَّ النَّفْسَ إنما يُعتَدُّ بها إذا تجافت عن دار الغرور وأنابت إلى دار الخلود, والنفس إذا كانت منهومة لا تشبع حريصة على الدنيا كانت أعدى عدو المرء, فأولى الشيء الذي يستعاذ منه هي, وعدم استجابة الدعاء دليل على أن الداعي لم ينتفع بعلمه, ولم يخشع قلبه ولم تشبع نفسه »","قال الطيبي رحمه الله:","","",["شرح المشكاة للطيبي الكاشف عن حقائق السنن (6/ 1915)."],[78,82],0],[204,"h","النبي ﷺ","أنس بن مالك","«اذكر الموتَ في صلاتِك، فإنّ الرجل إذا ذكر الموت في صلاته لَحَرِيٌّ أَنْ يُحْسِنَ صلَاتَهُ، وصلِّ صلاةَ رجلٍ لا يظنُّ أنْ يصلي صلاةً غيرَها، وإِيَّاك وَكُلَّ أمْرٍ يُعْتَذَرُ مِنْهُ»","عن أنس بن مالك رضي الله عنه، عن النبي ﷺ قال:","حسن","حسنه الألباني في صحيح الجامع الصغير (849)",["أخرجه الديلمي في مسند الفردوس (1/ 51)، وحسنه الألباني في صحيح الجامع الصغير (849)."],[83],0],[205,"h","النبي ﷺ","أبو أيوب","«إِذَا قُمْتَ فِي صَلَاتِكَ فَصَلِّ صَلَاةَ مُوَدِّعٍ، وَلَا تَكَلَّمْ بِكلَامٍ تَعْتَذِرُ مِنْهُ، وَأَجْمِعِ الْيَأْسَ عَمَّا فِي أَيْدِي النَّاسِ»","وعن أبي أيوب رضي الله عنه، قال: جاء رجل إلى النبي ﷺ، فقال: يَا رَسُولَ اللَّهِ عَلِّمْنِي، وَأَوْجِزْ، قَالَ:","حسن","حسنه الألباني في الصحيحة (400)",["رواه ابن ماجه (4171) وأحمد (23498)، وحسَّنه الألباني في الصحيحة (400)."],[83],0],[206,"a","عبد الله بن أبى سليمان","","« كان عليّ بن الحسين إذا مشى لا تُجاوز يده فخذَه، ولا يَخْطِر بيده، قال: وكان إذا قام إلى الصلاة أخذته رِعْدة، فقيل له: ما لك؟ فقال: ما تدرون بين يدَي مَن أقوم ومن أناجى؟! »","عن عبد الله بن أبى سليمان عليه السلام، قال:","","",["الطبقات الكبرى لابن سعد (7/ 214)."],[83],0],[207,"a","أبو نوح الأنصاري","","« وقع حريقٌ في بيت فيه عليُّ بن الحُسين وهو ساجد، فجعلوا يقولون: يا ابن رسول الله، النار! يا ابن رسول الله، النار! فما رفع رأسه حتى أُطفئت، فقيل له: ما الذي ألهاك عنها؟ فقال: ألهتني عنها النار الأخرى »","وعن أبي نوح الأنصاري قال:","","",["صفة الصفوة (1/ 354)."],[83],0],[208,"a","أبو الحسين المجاشعي","","« قيل لِعَامِرِ بنِ عَبْدِ قَيْسٍ: أَتُحَدِّثُ نفسك في الصلاة؟ قال: أُحَدِّثُهَا بِالوُقُوْفِ بَيْنَ يَدَيِ اللهِ، وَمُنْصَرَفِي »","وعن أبي الحسين المُجاشعي قال:","","",["سير أعلام النبلاء (4/ 17)."],[83],0],[209,"a","أبو عبد الرحمن الأسدي","","« قلت لسعيد بن عبد العزيز: ما هذا البكاءُ الذي يعرض لك في الصلاة؟! فقال: يا ابن أخي، وما سؤالك عن ذلك؟ قلت: لعل الله أن ينفعني به. فقال: ما قمتُ إلى صلاة إلَّا مُثِّلِتْ لي جهنمُ »","وعن أبي عبد الرحمن الأسدي، قال:","","",["تاريخ دمشق لابن عساكر (21/ 203)."],[83],0],[210,"a","","","« فلو رأيت أيها الْبَطَّالُ أحدَهم، وقد قام إلى صلاته وقراءته، فلما وقف في محرابه، واستفتح كلام سيده؛ خَطَرَ على قلبه أنَّ ذلك المقام هو: المقام الذي يقوم فيه الناس لرب العالمين، فَانْخَلَعَ قلبُه وَذَهَلَ عقلُه، فقلوبهم في ملكوت السماوات مُعَلَّقَةٌ، وأبدانهم بين أيدي الخلائق عارية، وهمومهم بالفكر دائمة، فما ظنك بأقوام أخيار أبرار، وقد خرجوا من رِقِّ الغفلة، واستراحوا من وثائق الفترة، وأَنِسُوا بيقين المعرفة، وسكنوا إلى روح الجهاد والمراقبة، بلغنا الله وإياكم هذه الدرجة »","وكان ذو النون المصري رحمه الله يقول في وصف العُبَّاد:","","",["حلية الأولياء وطبقات الأصفياء (9/ 339)."],[83],0],[211,"a","رباح بن الهروي","","« مرَّ عصام بن يوسف بحاتم الأصم، وهو يتكلم في مجلسه؛ فقال: يا حاتم! تحسن تصلي؟ قال: نعم! قال: كيف تصلي؟ قال حاتم: أقوم بالأمر، وأمشي بالخشية، وأدخل بالنية، وأكبر بالعظمة، وأقرأ بالترتيل والتفكر، وأركع بالخشوع، وأسجد بالتواضع، وأجلس للتشهد بالتمام وأسلم بِالسَّبَلِ وَالسُّنَّةِ، وَأُسْلِمُهَا بالإخلاص إلى الله عز وجل، وأرجع على نفسي بالخوف، أخاف أنْ لا يَقْبَلَ مِنِّي وَأَحْفَظُهُ بِالْجُهْدِ إلى الموت. قال: تكلَّمَ فأنت تُحْسِنُ تُصَلَّى »","وعن رَبَاح بنِ الهَرَوي قال:","","",["حلية الأولياء لأبي نعيم (8/ 74)"],[83],0],[212,"n","البغوي","","قال الله تعالى: الآية: المؤمنون: 1-2 قيل عند تفسير هذه الآية: الخشوع في الصلاة هو جمعُ الهمة، والإعراضُ عما سواها، والتدبر فيما يجري على لسانه من القراءة والذكر","","","",["تفسير البغوي (3/ 359) [المؤمنون: 2]."],[84],0],[213,"s","عمرو بن عبسة السلمي","","«ما منكم رجل يقرب وضوءه فيتمضمض، ويستنشق، فينتثر إلا خرت خطايا وجهه وفيه وخياشيمه، ثم إذا غسل وجهه كما أمره الله إلا خرت خطايا وجهه من أطراف لحيته مع الماء، ثم يغسل يديه إلى المرفقين إلا خرت خطايا يديه من أنامله مع الماء، ثم يمسح رأسه إلا خرت خطايا رأسه من أطراف شعره مع الماء، ثم يغسل قدميه إلى الكعبين إلا خرت خطايا رجليه من أنامله مع الماء. فإن هو قام فصلى، فحمد الله وأثنى عليه، ومجده بالذي هو له أهل، وفرغ قلبه لله، إلا انصرف من خطيئته كهيئته يوم ولدته أمه»","عن عمرو بن عبسة السلمي رضي الله عنه قال: قلت: يا نبيَّ الله، فالوضوء، حدِّثْني عنه، قال:","","",["رواه مسلم (832)."],[84],0],[214,"q","ابن العربي","","« ونكتة المسألة أن قولك: \"الله أكبر\" يحرِّم عليك الأفعال بالجوارح، والكلام باللسان؛ ونية الصلاة تحرِّم عليك الخواطر بالقلب، والاسترسال عن الأفكار، إلا أن الشرع لما علم أن ضبط الشر من السر يفوت طوق البشر سمح فيه، كما تقدم بيانا له »","قال القاضي أبو بكر بن العربي عز وجل:","","",["أحكام القرآن لابن العربي (3/ 314)."],[84,85],0],[215,"h","النبي ﷺ","أنس بن مالك","« والخشوع في الصلاة إنما يحصل بمن فرغ قلبه لها، واشتغل بها عما عداها، وآثرها على غيرها، وحينئذ تكون راحة له، وقرة عين، كما قال النبي ﷺ في الحديث الذي رواه الإمام أحمد والنسائي، عن أنس، عن رسول الله ﷺ أنه قال: «حبب إلي الطيب والنساء، وجعلت قرة عيني في الصلاة» »","وقال ابن كثير رحمه الله:","صحيح","صححه الألباني في صحيح الجامع (3124)",["تفسير ابن كثير (5/ 461) [سورة المؤمنون: 2]. والحديث رواه النسائي (3939) وصححه الألباني في صحيح الجامع (3124)."],[84],0],[216,"q","ابن القيم","","« وإنما يَقْوى العبد على حضوره في الصلاة واشتغاله فيها بربه عز وجل إذا قهر شهوته وهواه، وإلَّا فقلبٌ قد قهرته الشهوة، وأسره الهوى، ووجد الشيطان فيه مقعدًا تمكَّنَ فيه، كيف يخلص من الوساوس والأفكار؟ »","وقال ابن القيم رحمه الله:","","",["الوابل الصيب (ص: 24)."],[84],0],[217,"q","ابن عثيمين","","« الأسباب المعينة على الخشوع هو أن الإنسان يفرغ قلبه للصلاة، ويتناسى ما سواها، ولا يفكر في شيء، ويشعر بأنه الآن قائمٌ بين يدي الله عز وجل الذي يعلم ما في قلبه، يرى أفعاله ويسمع أقواله »","وقال ابن عثيمين رحمه الله:","","",["سلسلة فتاوى نور على الدرب، الشريط رقم [360]."],[84],0],[218,"h","النبي ﷺ","عن عبد الله بن عمر","«أمَا إنَّ أحدكم إذا قام في الصلاة، فإنه يناجي ربه، فليعلمْ أحدُكُم ما يُناجي ربَّه، ولا يجهرْ بعضُكُم على بعضٍ بالقراءة في الصلاة»","ا يدعو المصلي إلى أن يتعلم أحكام الصلاة من أولها إلى آخرها ويتفقه فيها؛ ولذلك حثَّ النبي ﷺ كلَّ مسلم إلى أن يعقلَ ما يقول في صلاته؛ لأنه يناجي ربه؛ فعن عن عبد الله بن عمر رضي الله عنهما، أن النبي ﷺ اعتكف وخطب الناس فقال:","صحيح","صححه ابن عبد البر في التمهيد (23/315) والألباني في السلسلة الصحيحة (١٥٩٧)",["واه أحمد (4928) وصححه ابن عبد البر في التمهيد (23/315) والألباني في السلسلة الصحيحة (١٥٩٧)."],[86,87],0],[
