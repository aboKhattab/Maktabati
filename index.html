],[622,"q","العظيم آبادي","","« قوله: «يتعجلونه» أي: ثوابه في الدنيا «ولا يتأجلونه» بطلب الأجر في العقبى، بل يؤثرون العاجلة على الآجلة، ويتأكلون ولا يتوكلون, وقوله: «وسيجيء أقوام يقيمونه» أي: يصلحون ألفاظه وكلماته، ويتكلفون في مراعاة مخارجه وصفاته «كما يقام القدح» أي: يبالغون في عمل القراءة كمال المبالغة لأجل الرياء والسمعة والمباهاة والشهرة »","وقال العظيم آبادي رحمه الله:","","",["عون المعبود (3/ 42) [حديث 830]."],[211],0],[623,"q","ابن قدامة","","« وليعلم أن ما يقرؤه ليس كلام بشر، وأن يستحضر عظمة المتكلم سبحانه، ويتدبر كلامه؛ فإن التدبر هو المقصود من القراءة »","قال ابن قُدامة رحمه الله:","","",["مختصر منهاج القاصدين [ص/68]."],[212],0],[624,"q","الحارث المحاسبي","","« إذا كان كلام العالم أولى بالاستماع من كلام الجاهل، وكلام الوالدة الرَّؤُوم أحق بالاستماع من كلام غيرها، فالله أعلم العلماء وأرحم الرحماء، فكلامه أولى كلام بالاستماع، والتدبر، والفهم »","وقال الحارث المحاسبي رحمه الله:","","",["فهم القرآن ومعانيه للحارث المحاسبي [ص/247]."],[212],0],[625,"a","الخواص","","« قلت لنفسي: يا نفس اقرئي القرآن كأنك سمعتيه من الله حين تكلم به، فجاءت الحلاوة »","وقال الخَوَّاص رحمه الله:","","",["سير أعلام النبلاء (8/180)."],[212,125],0],[626,"q","ابن القيم","","« ولكن السماع لكلامه كالسماع منه - سبحانه -؛ فإنه كلامه الذي تكلم به حقًّا، فمن سمعه فليُقَدِّر نفسه كأنه يسمعه من الله »","وقال ابن القيم رحمه الله:","","",["مدارج السالكين (٢/ ٤٥٣)."],[212],0],[627,"q","القرطبي","","« أي: لا تعجل بقراءة القرآن، بل اقرأه في مَهَلٍ وبيان مع تدبر المعاني. وقال الضحاك رحمه الله: اقرأه حرفًا حرفًا. وقال مجاهد رحمه الله: أحب الناس في القراءة إلى الله أعقلهم عنه »","قال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (19/ 37) [سورة المزمل: 4]."],[213],0],[628,"a","","","« لقد رتَّل القرآن، فداه أبي وأمي »","وسمع علقمةُ رجلًا يقرأ قراءةً حسنة؛ فقال:","","",["المصدر السابق (19/ 38) [سورة المزمل: 4]."],[213],0],[629,"a","الشافعي","","« وأقلُّ الترتيل تركُ العَجَلة في القرآن عن الإبانة، وكلما زاد على أقلِّ الإبانة في القراءة كان أحبَّ إليَّ ما لم يبلُغْ أن تكونَ الزيادةُ فيها تمطيطًا »","وقال الشافعي رحمه الله:","","",["الأم للشافعي (1/ 132)."],[213],0],[630,"a","أبو بكر بن طاهر","","« تدبَّرْ في لطائف خطابه، وطالبْ نفسك بالقيام بأحكامه، وقلبَك بفَهْمِ معانيه، وسِرَّك بالإقبال عليه »","وقال أبو بكر بن طاهر رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (19/ 38) [سورة المزمل: 4]."],[213],0],[631,"h","النبي ﷺ","عقبة بن عامر","«تعلموا كتاب الله وتعاهدوه، وتغنوا به، فوالذي نفسي بيده، لهو أشد تفلُّتًا من المَخاض في الْعُقُلِ»","عن عقبة بن عامر رضي الله عنه، قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح الجامع (2964)",["رواه أحمد (17317) وصححه الألباني في صحيح الجامع (2964)."],[214],0],[632,"h","النبي ﷺ","البراء بن عازب","«زيِّنوا القُرآنَ بأصواتِكمْ»","وعن البراء بن عازبٍ رضي الله عنه، قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح الترغيب (1449)، والوادعي في الصحيح المسند مما ليس في الصحيحين (130)",["رواه أبو داود (1468) وابن ماجه (1342) والنسائي (1015) وصححه الألباني في صحيح الترغيب (1449)، والوادعي في الصحيح المسند مما ليس في الصحيحين (130)."],[214],0],[633,"q","الخطابي","","« معناه زينوا أصواتكم بالقرآن، هكذا فسره غير واحد من أئمة الحديث، وزعموا أنه من باب المقلوب، كما قالوا: عرضت الناقة على الحوض، أي: عرضت الحوض على الناقة، وكقولهم: إذا طلعت الشعرى واستوى العود على الحرباء، أي: استوى الحرباء على العود، وعن شعبة قال: نهاني أيوب أن أُحدِّث: «زينوا القرآن بأصواتكم» قلت: ورواه معمر عن منصور عن طلحة, فقدَّم الأصوات على القرآن, وهو الصحيح، ... عن البراء بن عازب أن رسول الله صلى الله عليه وآله وسلم قال: «زينوا أصواتكم بالقرآن» والمعنى: اشغلوا أصواتكم بالقرآن، والهجوا بقراءته واتخذوه شعارًا وزينة »","قال الخطابي رحمه الله:","","",["معالم السنن (1/ 290)."],[214],0],[634,"h","النبي ﷺ","البراء بن عازب","«حسِّنوا القرآنَ بأصواتِكم، فإنَّ الصوتَ الحسنَ يزيدُ القرآنَ حُسْنًا»","وعن البراء بن عازبٍ رضي الله عنه قال: سمعت رسول الله ﷺ يقول:","صحيح","صححه الألباني في صحيح الجامع (3145)",["رواه الدارمي (3544) والحاكم في المستدرك (٢١٢٥) وصححه الألباني في صحيح الجامع (3145)."],[214],0],[635,"h","النبي ﷺ","","«حُسن الصوت؛ زينة القرآن»","وفي رواية:","حسن","حسنه الألباني في صحيح الجامع (3144)",["رواه الطبراني في الكبير (9881) وحسنه الألباني في صحيح الجامع (3144)."],[214],0],[636,"h","النبي ﷺ","أبو هريرة","«ما أذِنَ اللهُ لشيء كأَذَنِهِ لنبيٍ يتغنَّى بالقرآن يجهرُ به»","عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (5023) ومسلم (792)."],[215],0],[637,"q","ابن حجر","","« وقوله: «أذن» أي: استَمَع. والحاصل: أن لفظ «أَذِن» بفتحة ثم كسرة في الماضي، وكذا في المضارع مشترك بين الإطلاق والاستماع؛ تقول: أَذِنْتُ آذَنُ. بالمد فإن أردت الإطلاق فالمصدَرُ بكسرة ثم سكون، وإن أردت الاستماع فالمصدر بفتحتين »","قال ابن حجر رحمه الله:","","",["فتح الباري (9/ 69)."],[215],0],[638,"h","النبي ﷺ","البراء","« سمعت النبي ﷺ يقرأ في العشاء: الآية: التين: 1 فما سمعت أحدًا أحسنَ صوتًا أو قراءةً منه »","وعن البراء رضي الله عنه، قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (7546) ومسلم (464)."],[215],0],[639,"h","النبي ﷺ","أبو موسى الأشعري","«لو رأيتَني وأنا أستمع لقراءتك البارحة! لقد أوتيتَ مزمارًا من مزامير آل داود»","وعن أبي موسى رضي الله عنه قال: قال رسول الله ﷺ لأبي موسى:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (5048) ومسلم (793)."],[215],0],[640,"q","ابن حجر","","« والمراد بالمزمار: الصوت الحسن، وأصله الآلة، أطلق اسمه على الصوت للمشابهة »","وعن أبي موسى رضي الله عنه قال: قال رسول الله ﷺ لأبي موسى: «لو رأيتَني وأنا أستمع لقراءتك البارحة! لقد أوتيتَ مزمارًا من مزامير آل داود». قال ابن حجر رحمه الله:","","",["فتح الباري (9/ 93) حديث رقم (5048)."],[215],0],[641,"h","النبي ﷺ","عائشة أم المؤمنين","« أبطأت على عهد رسول الله ﷺ ليلة بعد العشاء، ثم جئتُ فقال: أين كنت؟ قلت: كنت أستمع قراءة رجل من أصحابك لم أسمع مثل قراءته وصوته من أحد، قالت: فقام وقمتُ معه حتى استمع له، ثم التفت إلي فقال: «هذا سالم مولى أبي حذيفة، الحمد لله الذي جعل في أمتي مثل هذا» »","وعن عائشة رضي الله عنها، قالت:","صحيح","صححه الألباني في صحيح ابن ماجه (1108)",["رواه ابن ماجه (1338) وأحمد (25320) وصححه الألباني في صحيح ابن ماجه (1108)."],[215],0],[642,"q","القاضي عياض","","« أجمع العلماء على استحباب تحسين الصوت بالقراءة وترتيلها »","قال القاضي عياض رحمه الله:","","",["شرح صحيح مسلم للنووي (6/ 80) حديث رقم (793)."],[215],0],[643,"h","النبي ﷺ","سعد بن أبي وقاص","«ليسَ منَّا مَنْ لم يَتغنَّ بالقُرآن »","عن سعد بن أبي وقاص رضي الله عنه، قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح أبي داود (1469)، والوادعي في الصحيح المسند مما ليس في الصحيحين (384)",["رواه أبو داود (1469) وابن ماجه (1337) والدارمي (1531) وأحمد (1476) وصححه الألباني في صحيح أبي داود (1469)، والوادعي في الصحيح المسند مما ليس في الصحيحين (384)."],[216],0],[644,"q","الخطابي","","« هذا يتأول على وجهين: أحدهما: تحسين الصوت. والوجه الثاني: الاستغناء بالقرآن من غيره، وإليه ذهب سفيان بن عيينة، ويقال: تغنى الرجل بمعنى استغنى. وفيه وجه ثالث: قاله ابن الأعرابي؛ أخبرني إبراهيم بن فراس قال: سألت ابن الأعرابي عن هذا؟ فقال: إن العرب كانت تتغنى بالركباني إذا ركبت الإبل وإذا جلست في الأفنية وعلى أكثر أحوالها، فلما نزل القرآن أحب النبي صلى الله عليه وآله وسلم أن يكون القرآن هجيراهم مكان التغني بالركباني »","قال الخطابي رحمه الله:","","",["عون المعبود (4/ 240) حديث رقم (1469)."],[216],0],[645,"h","النبي ﷺ","عبيد الله بن أبي يزيد","« مر بنا أبو لبابة رضي الله عنه فاتبعناه حتى دخل بيته، فدخلنا عليه، فإذا رجل رثُّ البيتِ رثُّ الهيئة، فسمعته يقول: سمعت رسول الله ﷺ يقول: «ليسَ منَّا مَنْ لم يَتَغنَّ بالقُرآنِ». قال: فقلت لابن أبي مليكة: يا أبا محمد أرأيت إذا لم يكن حسن الصوت؟ قال: يُحسِّنُه ما استطاع »","وعن عبيد الله بن أبي يزيد قال:","صحيح","صححه شعيب الأرناؤوط في تخريج زاد المعاد (1/ 466)",["رواه أبو داود (1471) وصححه شعيب الأرناؤوط في تخريج زاد المعاد (1/ 466)."],[216,217],0],[646,"q","ابن القيم","","« والصحيح: أنه من التغني بمعنى تحسين الصوت، وبذلك فسره الإمام أحمد رحمه الله فقال: يحسنه بصوته ما استطاع »","قال ابن القيم رحمه الله:","","",["مدارج السالكين (٢/ ٤٤١)."],[216],0],[647,"q","الشوكاني","","« قوله: …؛ أي: على ترسُّلٍ وتمهُّلٍ في التلاوة؛ فإن ذلك أقرب إلى الفهم وأسهل للحفظ »","وقال الشوكاني رحمه الله:","","",["فتح القدير (3/ 313) [الأسراء: 106]."],[152],0],[648,"h","النبي ﷺ","عبد الله بن عمرو","«من قرأ القرآن في أقلَّ من ثلاث لم يَفْقَهْهُ»","وعن عبد الله بن عمرو رضي الله عنهما، قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في الصحيحة (5/601)",["رواه أحمد (6810) والترمذي(2949) وأبو داود (1394) وصححه الألباني في الصحيحة (5/601).","رواه أحمد (6810) والترمذي (2949) وأبو داود (1394) وصححه الألباني في صفة الصلاة (119)."],[152,218],0],[649,"q","المباركفوري","","« قوله: «لم يفقه من قرأ القرآن في أقل من ثلاث»؛ أي: لم يفهم ظاهر معانيه، وأما فهم دقائقه فلا يفي به الأعمار، والمراد نفي الفهم لا نفي الثواب، كذا في المجمع »","قال المباركفوري رحمه الله:","","",["تحفة الأحوذي (8/ 221) [حديث/ 2949].","شرح سنن ابن ماجه للسيوطي وغيره (ص/ 96)."],[152,218],0],[650,"s","عبد الله بن مسعود","","« من قرأ القرآن في أقل من ثلاث فهو راجز »","وعن ابن مسعود رضي الله عنه، أنه قال:","","",["مصنف عبد الرزاق (3/ 353) رقم (5946)."],[152],0],[651,"s","عبد الله بن عباس","","« لأن أقرأ البقرة في ليلة وأتفكَّر فيها أحبُّ إليَّ من أن أقرأ القرآن هذْرمةً »","وقال ابن عباس رضي الله عنهما:","","",["صفة الصفوة (1/372)."],[152],0],[652,"h","النبي ﷺ","عبد الله بن عمرو","«فاقرأه في سبع، ولا تزد على ذلك»","عن عبد الله بن عمرو رضي الله عنهما قال: قال لي رسول الله ﷺ: «اقرأ القرآن في كل شهر» قال: قلت: إني أجد قوَّةً قال: «فاقرأه في عشرين ليلة» قال: قلت: إني أجد قوة، قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (5054) ومسلم (1159)."],[219],0],[653,"a","أبو وائل","","« جاء رجل يقال له نَهيكُ بنُ سِنان إلى عبد الله بن مسعود رضي الله عنه فقال: يا أبا عبد الرحمن! كيف تقرأ هذا الحرف, ألفا تجده أم ياء: من ماء غير آسن، أو من ماء غير يا سن؟ قال فقال عبد الله: وكل القرآن قد أحصيت غير هذا؟ قال: إني لأقرأ المفصل في ركعة, فقال عبد الله: هذًّا كهذِّ الشعر؟ إن أقوامًا يقرؤون القرآن لا يجاوز تراقيهم, ولكن إذا وقع في القلب فرسخ فيه؛ نفع, إن أفضل الصلاة الركوع والسجود, إني لأعلم النظائر التي كان رسول الله ﷺ يقرن بينهن, سورتين في كل ركعة »","عن أبي وائل قال:","","",["رواه البخاري (775) ومسلم (822)."],[219],0],[654,"q","النووي","","« معناه: أن الرجل أخبر بكثرة حفظه وإتقانه، فقال ابن مسعود: تهذُّه هذًّا، وهو بتشديد الذال، وهو شدة الإسراع والإفراط في العجلة، ففيه النهي عن الهذِّ، والحث على الترتيل والتدبر، وبه قال جمهور العلماء »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (6/ 105) [حديث/ 822]."],[219],0],[655,"q","الخطابي","","« الهَذُّ: سرعة القراءة، وإنما عاب ذلك عليه لأنه إذا أسرع القراءة ولم يرتلها فاته فهم القرآن وإدراك معانيه »","وقال الخطابي رحمه الله:","","",["معالم السنن (1/ 283)."],[219],0],[656,"a","","","« أراد أتهذ القرآن هذًّا فتسرع فيه كما تسرع في قراءة الشعر. والهذُّ: سرعة القطع ونصبه على المصدر »","وفي النهاية:","","",["النهاية في غريب الحديث والأثر (5/ 255)."],[219],0],[657,"q","العظيم آبادي","","« قوله: «ونثرًا كنثر الدقل» أي: كما يتساقط الرطب اليابس من العذق إذا هز. «والدقل»: رديء التمر ويابسه وما ليس له اسم خاص فتراه ليبسه ورداءته لا يجتمع ويكون منثورًا. قاله في النهاية: «كان يقرأ النظائر» هي السور المتقاربة في الطول»","وقال العظيم آبادي رحمه الله:","","",["عون المعبود (4/ 191) حديث رقم (1396)."],[219],0],[658,"h","النبي ﷺ","","«إِذَا قُمْتَ إِلَى الصَّلَاةِ فَأَسْبِغِ الْوُضُوءَ، ثُمَّ اسْتَقْبِلِ الْقِبْلَةَ فَكَبِّرْ، ثُمَّ اقْرَأْ بِمَا تَيَسَّرَ مَعَكَ مِنَ الْقُرْآنِ، ثُمَّ ارْكَعْ حَتَّى تَطْمَئِنَّ رَاكِعًا، ثُمَّ ارْفَعْ حَتَّى تَسْتَوِيَ قَائِمًا، ثُمَّ اسْجُدْ حَتَّى تَطْمَئِنَّ سَاجِدًا...»","و الواجب على الأئمة أن يجتهدوا في الطمأنينة والخشوع في الصلاة حتى يستفيدوا ويستفيد من خلفهم، وحتى يؤدوها كما شرع الله، وقد قال الله سبحانه: الآية: المؤمنون: 1-2، وقد أمر النبي ﷺ المسيء في صلاته أن يطمئن، فقال له النبي ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (6251) ومسلم (397)."],[220],0],[659,"q","ابن باز","","« الواجب على الأئمة أن يتقوا الله، وأن يطمئنوا في صلاتهم، وفي ركوعهم وسجودهم، وأن يرتلوا القراءة ويحسنوا أصواتهم بها حتى يؤدوا كلام الرب بتلاوة حسنة وقراءة واضحة تخشع لها القلوب. هذا هو الواجب على الأئمة أن يجتهدوا في الطمأنينة والخشوع في الصلاة حتى يستفيدوا ويستفيد من خلفهم، وحتى يؤدوها كما شرع الله، وقد قال الله سبحانه: الآية: المؤمنون: 1-2، وقد أمر النبي ﷺ المسيء في صلاته أن يطمئن، فقال له النبي ﷺ: «إِذَا قُمْتَ إِلَى الصَّلَاةِ فَأَسْبِغِ الْوُضُوءَ، ثُمَّ اسْتَقْبِلِ الْقِبْلَةَ فَكَبِّرْ، ثُمَّ اقْرَأْ بِمَا تَيَسَّرَ مَعَكَ مِنَ الْقُرْآنِ، ثُمَّ ارْكَعْ حَتَّى تَطْمَئِنَّ رَاكِعًا، ثُمَّ ارْفَعْ حَتَّى تَسْتَوِيَ قَائِمًا، ثُمَّ اسْجُدْ حَتَّى تَطْمَئِنَّ سَاجِدًا...» . الحديث. فالواجب على الأئمة أن يُعنوا بهذا الأمر، وأن يطمئنوا في ركوعهم وسجودهم وبعد الركوع وبين السجدتين، وأن يعنوا بالقراءة فيقرأوا قراءة واضحة بينة ليس فيها خفاء ولا إسقاط شيء من الحروف، وأن يمكنوا من وراءهم من القراءة بعد الفاتحة وإن كانت غير واجبة، ولكن الأفضل في الصلاة السرية أن يقرأ المأموم الفاتحة وما يتيسر معها مع إمامه، والإمام كذلك يقرأ سورة بعد الفاتحة أو آيات في السرية والجهرية في الأولى والثانية، لكن في السرية يقرأ المأموم زيادة على الفاتحة، وفي الجهرية تكفيه الفاتحة وينصت للإمام، فإذا لم يتمكن المأموم من أن يقرأ مع الفاتحة شيئًا لأن الإمام استعجل فلا يضره ذلك، لأن الواجب الفاتحة وما زاد عليها ليس بواجب فلا يضر تركه ولا يبطل الصلاة، ولكن يجب أن يعتني بالركوع والسجود من جهة الطمأنينة وبين السجدتين وبعد الركوع كذلك، هذه أمور عظيمة وفريضة لا بد منها في حق الجميع: الإمام والمأموم والمنفرد، والله ولي التوفيق »","قال ابن باز رحمه الله:","","",["الدرر الثرية من الفتاوى البازية (ص/ 203-204)."],[220],0],[660,"h","النبي ﷺ","عبد الله بن عباس","« بِتُّ في بيت ميمونةَ ليلةً، والنبيُّ ﷺ عندها، لأنظرَ كيف صلاةُ رسول الله ﷺ بالليل، فتحدَّث رسول الله ﷺ مع أهله ساعةً ثم رقدَ، فلما كان ثُلُثُ الليل الآخر، أو بعضُه، قعد فنظر إلى السماء، فقرأ: الآية: آل عمران: 190، ثم قام فتوضأ واستنَّ، ثم صلى إحدى عشْرَة ركعةً، ثم أذَّن بلالٌ بالصلاة، فصلى ركعتين، ثم خرج فصلى للناس الصبحَ »","عن ابن عباس رضي الله عنهما، قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (7452) ومسلم (256)."],[221],0],[661,"q","النووي","","« وقوله: فخرج فنظر إلى السماء ثم تلا هذه الآية في آل عمران: … الآيات، فيه أنه يستحب قراءتها عند الاستيقاظ في الليل مع النظر إلى السماء لما في ذلك من عظيم التدبر، وإذا تكرر نومه واستيقاظه وخروجه؛ استحب تكريره قراءة هذه الآيات كما ذكر في الحديث، والله عز وجل أعلم »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (3/ 146) حديث رقم (256)."],[221],0],[662,"h","النبي ﷺ","عبد الله بن عباس","«تفكروا في خلق الله، ولا تفكروا في الله عز وجل»","وعن ابن عباس رضي الله عنهما، قال: قال رسول الله ﷺ:","حسن","حسنه الألباني في صحيح الجامع (2976)",["أخرجه الطبراني في الأوسط (6456) والبيهقي في الشعب (120) وحسنه الألباني في صحيح الجامع (2976)."],[221],0],[663,"s","الليث بن سعد","","« يُقال: ما الرحمةُ إلى أحَدٍ بأسرعَ منها إلى مُستَمِعِ القرآن؛ لقول الله عز وجل: الآية: الأعراف: 204، ولعلَّ من الله واجبةٌ »","قال الليث بن سعد رضي الله عنه:","","",["الرعاية لتجويد القراءة وتحقيق التلاوة (ص/ 61)."],[222],0],[664,"q","المفسر السعدي","","« هذا الأمر عامٌّ في كل من سمِع كتابَ الله يتلى، فإنه مأمورٌ بالاستماع له والإنصات، والفرقُ بين الاستماع والإنصات؛ أن الإنصات في الظاهر بترك التحدُّث أو الاشتغال بما يشغل عن استماعه. وأما الاستماع له: فهو أن يُلقيَ سمعه، ويُحضرَ قلبه ويَتدبَّرَ ما يستمعُ، فإنَّ من لازَمَ على هذين الأمرين حين يُتلى كتابُ الله، فإنه ينال خيرًا كثيرًا وعلمًا غزيرًا، وإيمانًا مستمرًّا متجدِّدًا، وهدى متزايدًا، وبصيرة في دينه، ولهذا رتَّب اللهُ حصولَ الرحمة عليهما، فدلَّ ذلك على أن من تُلِيَ عليه الكتاب، فلم يستمع له ويُنْصت، أنه محروم الحظ من الرحمة، قد فاته خير كثير. ومن أوكد ما يؤمر به مستمع القرآن، أن يستمع له وينصت في الصلاة الجهرية إذا قرأ إمامُه، فإنه مأمور بالإنصات، حتى إن أكثر العلماء يقولون: إن اشتغاله بالإنصات، أولى من قراءته الفاتحة، وغيرها »","وقال المفسر السعدي رحمه الله:","","",["تفسير السعدي (406) [الأعراف: 204]."],[222],0],[665,"q","القرطبي","","« حُسْن الاستماع كما يجب قد مدح الله عليه، فقال: الآية: الزمر: 18، وذمَّ على خلاف هذا الوصف فقال: الآية: الإسراء: 47؛ فمدح المُنْصِت لاستماع كلامه مع حضور العقل وأَمَر عباده بذلك أدبًا لهم، فقال: الآية: الأعراف: 204 »","وقال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (11/ 176) [الأعراف: 204]."],[222],0],[666,"q","الواحدي","","« أي: استمَع ما يقالُ له، يقال: ألق سمعك إلىّ، أي: استمِعْ مني، …؛ أي: شاهد القلب والفهم، وليس بغافل، ولا ساهٍ »","قال الواحدي رحمه الله:","","",["التفسير الوسيط للواحدي (4/ 170) [سورة ق: 37]."],[222],0],[667,"q","الشوكاني","","« قوله تعالى: … المعنى: أنه ألقى السمع إلى ما يتلى عليه من الوحي الحاكي لما جرى على تلك الأمم، … أي: حاضرُ الفَهْمِ، أو حاضرُ القلبِ لأنَّ من لا يفهمُ في حكم الغائب، وإنْ حضرَ بجسمه فهو لم يحضرْ بِفَهْمِه؛ قال الزجاج رحمه الله: أي: وقلبه حاضرٌ فيما يسمعُ. قال سفيان رحمه الله: أي لا يكونُ حاضرًا وقلبه غائبٌ »","وقال الشوكاني رحمه الله:","","",["فتح القدير للشوكاني (5/ 95) [ق: 37]."],[222],0],[668,"h","النبي ﷺ","عبد الله بن عباس","« أي: هو أجدر أن يفقه القرآن »","قال ابن عباس رضي الله عنهما، في قوله: …:","حسن","حسنه الألباني في صحيح أبي داود (1304)",["رواه أبو داود (1304) وحسنه الألباني في صحيح أبي داود (1304)."],[223],0],[669,"a","","","« المقصود من التلاوة: الحضور والفهم؛ لأن الليل مَظِنَّة ذلك؛ لما في النهار من الشواغل والعوارض الدنيوية والدينية »","ويقـول الحافـظ ابـن حجـر رحمه الله، عن مُدَارَسَة جبريل لرسول الله ﷺ، في كل ليلة من رمضان:","","",["فتح الباري (8/ 674)."],[223],0],[670,"q","النووي","","« ينبغي للمرء أن يكون اعتناؤه بقراءة القرآن في الليل أكثر، وفي صلاة الليل أكثر، والأحاديث والآثار في هذا كثيرة، وإنما رجحت صلاة الليل وقراءته؛ لكونها أجمع للقلب، وأبعد عن الشاغلات والمُلْهِيَات والتصرف في الحاجات، وأصون عن الرياء وغيره من المُحْبِطَات، مع ما جاء به الشرع من إيجاد الخيرات في الليل، فإن الإسراء بالرسول كان ليلًا »","وقال النووي رحمه الله:","","",["التبيان في آداب حملة القرآن (ص/ 52)."],[223],0],[671,"n","أبو هريرة","","عن أبي هريرة رضي الله عنه، قال: سمعت رسول الله ﷺ يقول: «تفضل صلاةُ الجميع صلاةَ أحدكم وحده، بخمس وعشرين جزءًا، وتجتمع ملائكة الليل وملائكة النهار في صلاة الفجر», ثم يقول أبو هريرة رضي الله عنه: فاقرءوا إن شئتم: …","","","",["رواه البخاري (648) ومسلم (649)."],[224],0],[672,"q","البغوي","","« قوله تعالى: …؛ يعني صلاة الفجر، سمَّى صلاة الفجر قرآنًا لأنها لا تجوز إلا بقرآن، وانتصاب قرآن من وجهين؛ أحدهما: أنه عطف على الصلاة؛ أي: وأقم قرآن الفجر، قاله الفراء، وقال أهل البصرة: على الإغراء، أي: وعليك قرآن الفجر، … أي: تشهده ملائكة الليل وملائكة النهار »","قال البغوي رحمه الله:","","",["تفسير البغوي (3/ 148) [الإسراء: 78]."],[224],0],[673,"q","ابن تيمية","","« فإن القراءة في الصلاة أفضل من القراءة في غير الصلاة ... ولكن من حصل له نشاط وفهم للقراءة دون الصلاة؛ فالأفضل في حقه ما كان أنفع له »","ويقول شيخ الإسلام رحمه الله:","","",["مجموع الفتاوى (23/ 62)."],[224],0],[674,"q","ابن قتيبة","","« قوله: …؛ أي: فهم وعقل، …؛ أي: استمعَ كتاب الله، وهو شاهدُ القلب والفهم، ليس بغافلٍ ولا ساهٍ »","قال ابن قتيبة رحمه الله:","","",["غريب القرآن لابن قتيبة (ص/ 362)."],[225],0],[675,"q","ابن القيم","","« وهو إشارةٌ إلى المانع من حصولِ التأثير، وهو سهوُ القلب، وغيبتُهُ عن تعقُّلِ ما يُقال له والنظرِ فيه وتأمُّلِه، فإذا حصل المؤثِّرُ - وهو القرآنُ - والمحلُّ القابلُ، وهو القلبُ الحيُّ، ووُجِد الشرطُ، وهو الإصغاءُ، وانتفى المانعُ وهو اشتغال القلبِ وذهولُه عن معنى الخطاب وانصرافُه عنه إلى شيءٍ آخر؛ حَصَل الأثرُ وهو الانتفاعُ والتذكُّرُ »","وقال ابن القيم رحمه الله:","","",["الفوائــد (ص/ 3)."],[225],0],[676,"q","السعدي","","« قوله: …؛ أي: قلبٌ عظيمٌ حيٌّ، ذكيٌّ، زكيٌّ، فهذا إذا ورد عليه شيء من آيات الله، تذكر بها، وانتفع، فارتفع، وكذلك من ألقى سمعه إلى آيات الله، واستمعها، استماعًا يسترشد به، وقلبه …؛ أي: حاضر، فهذا له أيضًا ذكرى وموعظة، وشفاء وهدى. وأما المُعرض، الذي لم يُلقِ سمعَه إلى الآيات، فهذا لا تفيده شيئًا، لأنه لا قبول عنده، ولا تقتضي حكمة الله هداية من هذا وصفُه ونعتُه »","وقال السعدي رحمه الله:","","",["تفسير الســعدي (2/ 1123) [سورة ق: 37]."],[225],0],[677,"q","ابن القيم","","« إذا أردتَ الانتفاع بالقرآن؛ فاجمع قلبك عند تلاوته وسماعه، وألْقِ سمعَك، واحضُرْ حُضورَ من يخاطبه به من تكلم به سبحانه منه إليه؛ فإنه خطاب منه لك على لسان رسوله ﷺ, قال الله تعالى: الآية: ق: 37 وذلك أنَّ تمام التأثير لمَّا كان موقوفاً على مُؤثِّرٍ مُقْتَضٍ، ومحلٍّ قابلٍ، وشرطٍ لحصول الأثرِ، وانتفاء المانع الذي يمنعُ منه؛ تضمِّنَتِ الآيةُ بيانَ ذلك كلِّه بأوجزِ لفظٍ وأبينِهِ وأدلِّهِ على المُراد. فقوله: …: إشارةٌ إلى ما تقدَّمَ من أول السورةِ إلى هاهنا، وهذا هو المؤثِّرُ. وقوله: … فهذا هو المحلُّ القابلُ، والمرادُ به القلبُ الحيُّ الذي يعقل عن الله؛ كما قال تعالى: الآية: يس: 69-70 أي: حيَّ القلبِ. وقوله: … أي: وجَّه سمعَه وأصغَى حاسَّةَ سمعِهِ إلى ما يُقال له، وهذا شرطُ التأثُّر بالكلام. وقوله: … أي: شاهدُ القلبِ حاضرٌ غيرُ غائبٍ »","وقال ابن القيم رحمه الله:","","",["الفوائـــد (ص/ 3و4)."],[225],0],[678,"s","إياس بن معاوية","","« مَثَلُ الذين يقرؤون القرآن ولا يعرفون التَّفسير: كمَثَل قومٍ جاءهم كتاب من مَلِكِهم ليلاً، وليس عندهم مصباح، فتداخلتهم روعةٌ لا يدرون ما في الكتاب، ومَثَلُ الذي يعرف التَّفسير: كمَثَل رجلٍ جاءهم بمصباح، فقرؤوا ما في الكتاب »","قال إياس بن معاوية رضي الله عنه:","","",["تفسير ابن عطية (1/ 40)."],[226],0],[679,"q","ابن تيمية","","« يدخل في معنى قوله رحمه الله: «خَيْرُكْمْ مَنْ تَعَلَّمَ القُرآنَ وَعَلَّمَهُ»؛ تعليمُ حروفِه ومعانيه جميعاً، بل تعلُّم معانيه هو المقصود الأوَّل بتعليم حروفه، وذلك هو الذي يزيد الإيمان؛ كما قال جُندب بن عبد الله، وعبد الله ابن عمر وغيرهما: تعلَّمنا الإيمان، ثمَّ تعلَّمنا القرآن، فازددنا به إيماناً »","وقال ابن تيمية رحمه الله:","","",["مجموع الفتاوى (13 /403)."],[226],0],[680,"q","القرطبي","","« وينبغي له أن يَتَعَلّم أحكام القرآن، فيَفْهَم عن الله مراده، وما فرض عليه، فيَنْتَفِع بما يقرأ، ويعمل بما يتلو، فكيف يعمل بما لا يفهم معناه؟! وما أقبح أن يُسأل عن فقه ما يتلوه ولا يدريه، فما مثل من هذا حاله إلا كمثل الحمار يحمل أسفارًا »","وقال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (1/ 21).","تفسير القرطبي - الجامع لأحكام القرآن (1/21)."],[226,227],0],[681,"q","الشنقيطي","","« فإذا علمت - أيها المسلم - أن هذا القرآن العظيم هو النور الذي أنزله الله؛ ليُستضاء به، ويُهْتَدى بهُداه في أرضه، فكيف ترضى لبصيرتك أن تعمى عن النور؟!... يجب عليك الجد والاجتهاد في تعلم كتاب الله، وسنة رسوله - ﷺ - بالوسائل النافعة المنتجة، والعمل بكل ما علمك الله منهما علمًا صحيحًا »","وقال الشنقيطي رحمه الله:","","",["أضواء البيان (7/ 465 – 466)."],[226],0],[682,"p","","","إنَّ العلومَ وإنْ جَلَّتْ مَحَاسِنُها … فَتَاجُها مَا بِهِ الإيمانُ قَدْ وَجَباَ … هُوَ الكِتَابُ العَزِيزُ، اللهُ يَحْفَظُهُ … وبعدَ ذَلِكَ عِلْمٌ فَرَّجَ الكُرَبَا … واتْلُ بِفَهْمٍ كتابَ اللهِ، فِيْهِ أَتَتْ … كُلُّ العُلومِ، تَدَبَّرْهُ تَرَ العَجَبَا","","","",["تفسير القرطبي (1 /41)."],[226],0],[683,"h","النبي ﷺ","","« صليت مع النبي ﷺ ذات ليلة، فافتتح البقرة. فقلت: يركع عند المائة. ثم مضى, فقلت: يصلي بها في ركعة! فمضى, فقلت: يركع بها! ثم افتتح النساء فقرأها، ثم افتتح آل عمران فقرأها. يقرأ مترسلًا إذا مر بآية فيها تسبيح سبَّح، وإذا مر بسؤال سأل، وإذا مر بتعوذ تعوذ, ثم ركع فجعل يقول: «سبحان ربي العظيم», فكان ركوعه نحوًا من قيامه, ثم قال: «سمع الله لمن حمده», ثم قام طويلًا قريبًا مما ركع، ثم سجد فقال: «سبحان ربي الأعلى»، فكان سجوده قريبًا من قيامه »","والمقصود بذلك: أن يقف القارئ عند المعنى، متأمِّلاً له، ومتفكِّراً فيه؛ قبل أن يجاوزه إلى غيره، ومن أبلغ الشَّواهد على ذلك وأوضحها حديث حذيفة رضي الله عنه حيث قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (722)."],[228],0],[684,"q","السيوطي","","« أنْ يشغل قلبَه بالتَّفكير في معنى ما يلفظ به، فيعرف معنى كلِّ آية، ويتأمَّل الأوامر والنَّواهي، ويعتقد قبول ذلك؛ فإنْ كان ممَّا قصر عنه فيما مضى اعتذر واستغفر، وإذا مرَّ بآية رحمةٍ استبشر وسأل، أو عذاب أشفق وتعوَّذ، أو تنزيه نزَّه وعظَّم، أو دعاء تضرَّع وطلب »","وقال السيوطي رحمه الله، واصفًا الوقوف المفيد عند المعاني:","","",["الإتقان في علوم القرآن، للسيوطي (1/283)."],[228],0],[685,"n","عامر بن عبد القيس","","رُويَ عن عامر بن عبد القيس رحمه الله، أنه قرأ في ليلة سورة غافر، فلما انتهى إلى قوله: الآية: غافر: 18 فلم يزل يرددها حتى أصبح","","","",["رواه أبو عبيد في فضائل القرآن (187)."],[228],1],[686,"a","محمد بن كعب القرظي","","« لأن أقـرأ: الآية: الزلزلة: 1 والآية: القارعة: 1 أرددهما وأتفكر فيهما، أحبُّ من أن أبيت أَهُذ القرآن »","وقال محمد بن كعب القرظي رحمه الله:","","",["الزهد لابن المبارك (ص/ 287)."],[228],0],[687,"q","الغزالي","","« البكاء مستحب مع القراءة وعندها، وطريقُهُ في تحصيله أن يحضر قلبه الحزن، بأن يتأمل ما فيه من التهديد، والوعيد الشديد، والمواثيق والعهود، ثم يتأمل تقصيره في ذلك، فإن لم يحضره حزن وبكاء - كما يحضر الخواص - فليبك على فقد ذلك، فإنه من أعظم المصائب »","وقال أبو حامد الغزالي رحمه الله:","","",["التبيان في آداب حملة القرآن (ص/ 79)."],[228],0],[688,"s","عبد الله بن عباس","","« من قرأ القرآن واتَّبع ما فيه؛ هداه الله من الضلالة، ووقاه يومَ القيامة سوءَ الحساب، وذلك بأن الله يقول: الآية: طه: 123 »","قال ابن عباس رضي الله عنهما:","","",["رواه الحاكم (2/ 413) رقم (3438)."],[229],0],[689,"a","","","« أجار اللهُ تابع القرآن من أن يضل في الدنيا ويشقى في الآخرة، ثم قرأ الآية: الآية: طه: 123 »","وقـال الشعبـي رحمه الله:","","",["التفسير الوسيط للواحدي (3/ 225) [طه: 123]."],[229],0],[690,"q","السعدي","","« فأنزله الله بهذا اللسان لنعقله ونتفهمه، وأمرنا بتدبره، والتفكر فيه، والاستنباط لعلومه، وما ذاك إلا لأن تدبره مفتاح كل خير، محصل للعلوم والأسرار. فلله الحمد والشكر والثناء، الذي جعل كتابه هدى وشفاء ورحمة ونورًا، وتبصرة وتذكرة، وبركة، وهدى وبشرى للمسلمين, فإذا علم هذا، علم افتقار كل مكلف لمعرفة معانيه والاهتداء بها. وكان حقيقًا بالعبد أن يبذل جهده، ويستفرغ وسعه في تعلمه وتفهمه بأقرب الطرق الموصلة إلى ذلك. ... ويعرف أنه سِيق لهداية الخلق كلهم، عالِمِهم وجاهلهم، حضريهم وبدويهم. فالنظر لسياق الآيات مع العلم بأحوال الرسول وسيرته مع أصحابه وأعدائه وقت نزوله، من أعظم ما يعين على معرفته وفهم المراد منه، خصوصا إذا انضم إلى ذلك معرفة علوم العربية على اختلاف أنواعها. فمن وُفِّق لذلك لم يبق عليه إلا الإقبال على تدبُّرِه وتَفَهُّمه، وكثرة التفكر في ألفاظه ومعانيه، ولوازمه وما تتضمنه، وما يدل عليه منطوقًا ومفهومًا، فإذا بَذَلَ وُسْعَه في ذلك فالرب أكرم من عبده، فلا بد أن يفتح عليه من علومه أمورًا لا تدخل تحت كسبه »","قال السعدي رحمه الله:","","",["مقدمة تفسير السعدي (1/ 11)."],[230],0],[691,"h","النبي ﷺ","","« اعهَدْ إليَّ، فقال: إذا سمعت الله يقول: … فأَرْعِها سمعَكَ، فإنه خيرٌ يأمرُ به، أو شرٌ ينهى عنه »","جاء رجلٌ إلى ابن مسعود رضي الله عنه، فقال:","صحيح","صححه أحمد شاكر في عمدة التفسير (1/ 619)",["أخرجه ابن المبارك في الزهد والرقائق (ص12) رقم (36). وصححه أحمد شاكر في عمدة التفسير (1/ 619)."],[125],0],[692,"a","محمد بن كعب القرظي","","« من بلغه القرآن، فكأنما كلَّمه الله »","وقال محمد بن كعب القُرظي رحمه الله:","","",["رواه ابن أبي حاتم في تفسيره (4/1271)."],[125],0],[693,"a","","","« وإذا قَدَّر ذلك لم يتخذ قراءة القرآن عَمَلَه، بل يقرؤه كما يقرأ العبد كتاب مولاه، الذي كتبه إليه؛ ليتأمله ويعمل بمقتضاه، ولذلك قال بعض العلماء: هذا القرآن رسائل أتتنا من قِبَلِ ربنا عز وجل بعهوده نتدبّرها في الصلوات، ونقف عليها في الخلوات، وننفذها في الطاعات والسنن المتبعات »","وعَقَّبه في الإحياء بقوله:","","",["الإحياء (1/285)."],[125],0],[694,"q","الغزالي","","« فيُقَدِّر أنه المقصود بكل خطاب في القرآن، فإن سمع أمرًا أو نهيًا قَدَّر أنه المنهيُّ والمأمور، وإن سمع وعدًا أو وعيدًا فكذلك، وإن سمع قصص الأولين والأنبياء، علم أن السَّمَر غير مقصود، وإنما المقصود أن يعتبر بها، ويأخذ من تضاعيفها ما يحتاج إليه، فما من قصة في القرآن إلا وسياقها لفائدة في حق النبي ﷺ وأمته، ولذلك قال الله تعالى: الآية: هود: 120، فليقدِّر العبد أن الله ثبت فؤاده بما يقصه عليه من أحوال الأنبياء وصبرهم على الإيذاء وثباتهم في الدين لانتظار نصر الله تعالى »","وقال صاحب الإحياء:","","",["إحياء علوم الدين (1/ 285)."],[125],0],[695,"s","عبد الله بن مسعود","","« والذي نفسي بيده، إنَّ حقَّ تلاوته: أن يحلَّ حلاله، ويحرمَ حرامه، ويقرأَه كما أنزله الله، ولا يحرفَ الكلم عن مواضعه، ولا يتأولَ منه شيئًا على غير تأويله »","قال ابن مسعود رضي الله عنه:","","",["تفسير الطبري - جامع البيان (2/ 567) [سورة البقرة: 121]."],[231],0],[696,"a","","","« يتبعونه حق اتباعه، ثم قرأ: الآية: الشمس: 2، يقول: اتَّبَعها »","وعَنِ ابْنِ عَبَّاسٍ رحمه الله، في قوله: … قال:","","",["تفسير ابن أبي حاتم (1/ 218) [سورة البقرة: 121]."],[231],0],[697,"a","الحسن البصري","","« الآية: البقرة: 121؛ قال: يعملون بمحكمه، ويؤمنون بمتشابهه، ويَكِلُون ما أشكلَ عليهم إلى عالمه »","وعن الحسن البصريُّ رحمه الله في قوله:","","",["تعظيم قدر الصلاة - محمد بن نصر المروزي (1/ 398) رقم (389)."],[231],0],[698,"q","الغزالي","","« وتلاوة القرآن حق تلاوته هو أن يشترك اللسان والعقل والقلب؛ فحظ اللسان: تصحيح الحروف بالترتيل، وحظ العقل: تفسير المعاني، وحظ القلب: الاتّعاظ والتأثُّر بالانزجار والائتمار؛ فاللسان يُرتِّل، والعقل يُترجم، والقلب يتعظ »","وقال صاحب الإحياء:","","",["إحياء علوم الدين (1/287)."],[231],0],[699,"h","النبي ﷺ","أنس بن مالك","«هُم أَهْلُ القرآنِ، أَهْلُ اللَّهِ وخاصَّتُهُ»","عن أنس بن مالك رضي الله عنه، قال: قال رسول الله ﷺ: «إنَّ للَّهِ أَهْلينَ منَ النَّاس» قالوا: يا رسولَ اللَّهِ، مَن هُم؟ قالَ:","صحيح","صححه الألباني في صحيح الجامع (2165) والوادعي في الصحيح المسند مما ليس في الصحيحين (77)",["رواه ابن ماجه (215) والدارمي (3369) وصححه الألباني في صحيح الجامع (2165) والوادعي في الصحيح المسند مما ليس في الصحيحين (77)."],[232],0],[700,"q","السندي","","« قوله: «هم أهل القرآن» أي: حفظة القرآن؛ يقرأ آناء الليل وأطراف النهار، العاملون به. قوله: «أهلُ الله» بتقدير أنهم أهلُ الله، أي: أولياؤه المختصون به اختصاص أهلِ الإنسان به »","قال السندي رحمه الله:","","",["حاشية السندي على ابن ماجه (1/ 94) حديث رقم (215)."],[232],0],[701,"h","النبي ﷺ","عائشة أم المؤمنين","«الماهر بالقرآن مع السفرة الكرام البررة. والذي يقرأُ القرآن وَيَتَتَعْتَعُ فيه، وهو عليه شاقٌّ، له أجران»","وعن عائشة رضي الله عنها، قالت: قال رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (4937) ومسلم (798) واللفظ له."],[232],0],[702,"h","النبي ﷺ","أبو موسى الأشعري","«مثل الذي يقرأ القرآن كالأترجة: طعمها طيب، وريحها طيب، والذي لا يقرأ القرآن كالتمرة: طعمها طيب، ولا ريح لها، ومثل الفاجر الذي يقرأ القرآن كمثل الريحانة: ريحها طيب، وطعمها مر، ومثل الفاجر الذي لا يقرأ القرآن كمثل الحنظلة: طعمها مر، ولا ريح لها»","وعن أبي موسى الأشعري رضي الله عنه، قال: قال رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (5020) ومسلم (797)."],[232],0],[703,"h","النبي ﷺ","أبو هريرة","«فثلاث آيات يقرأ بهن أحدكم في صلاته، خير له من ثلاث خلفات عظام سمان»","وعن أبي هريرة رضي الله عنه، قال: قال رسول الله ﷺ: «أيحبُّ أحدُكم إذا رجعَ إلى أهله أن يجدَ فيه ثلاث خَلِفَاتٍ عِظامٍ سِمانٍ؟» قلنا: نعم، قال:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (802)."],[232],0],[704,"s","معاوية","","« بلغني أن البطلة: السحرة »","قال معاوية:","","",["رواه مسلم (804)."],[232],0],[705,"h","النبي ﷺ","عبد الله بن عمرو بن العاص","«يقالُ لصَاحِبِ القرآنِ اقرَأْ وارتَقِ ورتِّلْ كما كنتَ ترتِّلُ في الدُّنيا فإنَّ منزلَك عندَ آخِرِ آيةٍ تقرؤُها»","وعن عبد الله بن عمرو بن العاص رضي الله عنهما، عن النبي ﷺ قال:","حسن","حسنه الألباني في تخريج مشكاة المصابيح (2076)",["رواه أبو داود (1464) والترمذي (2914)، وحسنه الألباني في تخريج مشكاة المصابيح (2076)."],[232],0],[706,"h","النبي ﷺ","أبو هريرة","«يجيءُ القرآنُ يومَ القيامَةِ، فيقولُ: يا ربِّ حلِّهِ، فيُلْبَسُ تاجَ الكرامَةِ، ثُمَّ يقولُ: يا ربِّ زدْهُ، فيُلْبَسُ حُلَّةَ الكرامَةِ، ثُمَّ يقولُ: يا ربِّ ارضَ عنْهُ، فيَرْضَى عنه، فيقولُ: اقرأْ، وارْقَ، ويزادُ بكُلِّ آيةٍ حسنَةً»","وعن أبي هريرة رضي الله عنه، قال: قال النبي ﷺ:","حسن","حسنه الألباني في صحيح الجامع (8030)",["رواه الترمذي (2915) والدارمي (3354) وحسنه الألباني في صحيح الجامع (8030)."],[232],0],[707,"h","النبي ﷺ","","«يا أَهلَ القرآنِ أوتِروا فإنَّ اللَّهَ وِترٌ يحبُّ الوِترَ»","لَه ذلك على القيامِ بحقِّ القرآن؛ من خشوعٍ وعباداتٍ وأخلاقٍ وغير ذلك من الفضائل، وكذلك يعينه على البعد عما لا يليق بأهل القرآن، وعلى سبيل المثال؛ أن يحرص على النوافل، كما في حديث عليِّ رضي الله عنه، قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح الجامع (7860)",["رواه أبو داود (1416) والترمذي (453). وصححه الألباني في صحيح الجامع (7860)."],[13],0],[708,"a","","","« ومما يعتنى به، ويتأكد الأمر به: احترام القرآن من أمور قد يتساهل فيها بعض الغافلين القارئين مجتمعين، فمن ذلك: اجتناب الضحك، واللغط، والحديث في خلال القراءة، إلا كلامًا يضطر إليه ... ومن ذلك العبث باليد وغيرها؛ فإنه يناجي ربه عز وجل، فلا يعبث بين يديه. ومن ذلك النظر إلى ما يلهي ويبدد الذهن. وأقبح من هذا كله النظر إلى ما لا يجوز النظر إليه. وعلى الحاضرين مجلس القراءة، إذا رأوا شيئًا من هذه المنكرات المذكورة أو غيرها، أن ينهوا عنه حسب الإمكان؛ باليد لمن قدر، وباللسان لمن عجز عن اليد وقدر على اللسان، وإلا فلينكر بقلبه، والله أعلم »","5- ترك الحركة والاهتزاز والعبث بالأيدي ونحو ذلك، ومما يوضح هذه الفقرة والتي قبلها ما قاله النووي رحمه الله في آداب قراءة القرآن:","","",["التبيان في آداب حملة القرآن (ص/ 82- 84)."],[233],0],[709,"n","","","7- الإمساك عن القراءة عند التثاؤب حتى ينقضي التثاؤب، ثم يقرأ. قاله مجاهد","","","",["المصدر السابق (ص/ 101)."],[234],0],[710,"n","","","8- ذكر النووي أن القارئ إذا قرأ مثل قوله تعالى: الآية: التوبة: 30 والآية: المائدة: 64 والآية: مريم: 88 والآية: الأنبياء: 26 فينبغي أن يخفض بها صوته كما كان إبراهيم النخعي يفعل","","","",["المصدر السابق."],[234],0],[711,"n","","","9- إذا كان يقرأ من حفظه فخرج منه ريح فيُمسك عن القراءة حتى يتكامل خروج الريح. كما رواه الآجري عن عطاء","","","",["أخلاق حملة القرآن للآجري (202). وذكره النووي في التبيان (ص/ 101)."],[234],0],[712,"n","","","10- أن يصلي على النبي ﷺ عند آية الأمر بالصلاة عليه","","","",["التبيان في آداب حملة القرآن للنوي (ص/ 101)."],[234],0],[713,"n","أصحابه","","11- أن يُسبِّح عند الأمر بالتسبيح، ويَحمد عند الحمد ويستغفر عند الأمر بالاستغفار، ونحو ذلك، كما روي عن النبي ﷺ وعن أصحابه رضي الله عنهم","","","",["المصدر السابق (ص/ 102)."],[234],1],[714,"n","","","12- أن يتوقف ويحمد الله إذا عطس في أثناء القراءة، أو يشمت عاطسًا حمِدَ الله، ثم يواصل قراءته","","","",["المصدر السابق (ص/ 105)."],[234],0],[715,"q","النووي","","« وهذا متفق عليه عند أصحابنا »","13- أن يقطع قراءته ويتابع الأذان إذا سمع المؤذن ثم يعود إلى قراءته، قال النووي:","","",["المصدر السابق (ص/ 105)."],[234],0],[716,"h","النبي ﷺ","","«إذا قام أحدُكم من الليل، فاستَعجَم القرآنُ على لسانه، فلم يَدْرِ ما يقولُ، فليَضْطَجِعْ»","14- ترك القراءة عند غلبة النعاس، لحديث أبي هريرة رضي الله عنه، قال: قال رسول الله ﷺ:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (787)."],[234],0],[717,"q","النووي","","« قوله: «فاستعجم عليه القرآن» أي: استغلق ولم ينطلق به لسانُه لغلبة النعاس »","قال النووي رحمه الله:","","",["شرح النووي على مسلم (6/ 75) حديث رقم (787)."],[234],0],[718,"n","","","فأجاب: إذا كانت السماعات كما ذكر تحت الأقدام، أو عند حذاء الأقدام، فإنه لا يفتحه على القرآن الكريم؛ لأن كون القرآن الكريم يُسمع من تحت قدم الإنسان لا شك أن فيه إهانة للقرآن، وإذا كان الإنسان لا بد أن يستمع إلى القرآن، فليرفع السماعة عن محاذاة الأقدام","","","",["المصدر/ سلسلة لقاءات الباب المفتوح [لقاء الباب المفتوح: 57]."],[235],0],[719,"h","النبي ﷺ","نفسه بقوله","«أما والله إني لأخشاكم لله وأتقاكم له»","إن النبيَّ ﷺ أعظمُ الخلقِ خشوعًا، وأتمُّهم لله خشيةً وخُضوعًا، كما أخبر رحمه الله عن نفسه بقوله:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (5063)."],[236],0],[720,"n","عبد الله بن مسعود","","عن عبد الله بن مسعود رضي الله عنه, قال: قال لي رسول الله ﷺ: «اقرأ عليَّ القرآنَ». قال: فقلت: يا رسول الله! أَقرأُ عليك وعليك أُنزلَ؟ قال: «إني أشتهي أن أسمعَه من غيري». قال: فقرأتُ النساءَ حتى إذا بلغتُ: الآية: النساء: 41 رفعتُ رأسي, أو غمَزَني رجلٌ إلى جنبي, فرفعتُ رأسي؛ فرأيتُ دموعَهُ تسيلُ","","","",["رواه البخاري (5055) ومسلم (800).","رواه مسلم (800) والبخاري (4582)."],[237,156],0],[721,"q","النووي","","« وفي حديث ابن مسعود هذا فوائد منها: استحباب استماع القراءة، والإصغاء لها، والبكاء عندها، وتدبرها، واستحباب طلب القراءة من غيره ليستمع له، وهو أبلغ في التفهم والتدبر من قراءته بنفسه، وفيه تواضع أهل العلم والفضل ولو مع أتباعهم »","قال النووي رحمه الله:","","",["المنهاج شرح صحيح مسلم بن الحجاج (6/ 88) [حديث: 800]."],[237,156],0],[722,"h","النبي ﷺ","عبد الله بن عمرو بن العاص","«يا جبريل! اذهب إلى محمدٍ فقل: إنا سنُرضِيكَ في أُمَّتِك ولا نَسُوءُكَ»","ية: المائدة: 118، فرفع يديه وقال «اللهُمَّ! أُمَّتي أُمَّتي» وبكى. فقال الله عز وجل: يا جبريلُ! اذهب إلى محمد، وربك أعلم، فسَلْه ما يُبكيك؟ فأتاه جبريل عليه السلام فسأله. فأخبره رسول الله ﷺ بما قال. وهو أعلمُ. فقال الله:","صحيح","في الصحيحين أو أحدهما",["رواه مسلم (202)."],[237],0],[723,"h","النبي ﷺ","عائشة أم المؤمنين","« لم أعقل أبوي إلا وهما يدينان الدين، ولم يمر علينا يوم إلا يأتينا فيه رسول الله ﷺ طرفي النهار، بكرة وعشية، ثم بدا لأبي بكر، فابتنى مسجدًا بفِناء داره، فكان يصلي فيه ويقرأ القرآن، فيقف عليه نساء المشركين وأبناؤهم، يعجبون منه وينظرون إليه، وكان أبو بكر رجلًا بكَّاءً، لا يملك عينيه إذا قرأ القرآن، فأفزع ذلك أشرافَ قريشٍ من المشركين »","عن عائشة رضي الله عنها، زوج النبي ﷺ قالت:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (476)."],[238,239],0],[724,"h","النبي ﷺ","عائشة أم المؤمنين","« لمَّا مرض رسول الله ﷺ مرضه الذي مات فيه، فحضرت الصلاة، فَأُذِّنَ، فقال: «مروا أبا بكر فليصل بالناس». فقيل له: إن أبا بكر رجل أسيف، إذا قام في مقامك لم يستطع أن يصلي بالناس، وأعاد فأعادوا له، فأعاد الثالثة فقال: «إنكن صواحب يوسف، مروا أبا بكر فليصل بالناس» »","وعن عائشة رضي الله عنها قالت:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (664) ومسلم (418). (أسيف) أي: سريع البكاء والحزن. وقيل: هو الرقيق."],[238],0],[725,"a","أبو عمران الجوني","","« مر عمر بن الخطاب رضي الله عنه، بدير راهب فناداه: يا راهبُ يا راهبُ. قال: فأشرف عليه فجعل عمر ينظر إليه ويبكي، قال: فقيل له: يا أمير المؤمنين ما يبكيك من هذا؟ قال: ذكرتُ قول الله عز وجل في كتابه: الآية: الغاشية: 3-5، فذلك الذي أبكاني »","عن أبي عِمْرانَ الْجَوْنِيّ رحمه الله، قال:","","",["المستدرك على الصحيحين للحاكم - ط العلمية (2/ 567)."],[159],0],[726,"a","","","« يا ليتني كنت هذه التبنة يا ليتني لم أكُ شيئاً مذكورًا، يا ليتني كنت نسياً منسيًّا، يا ليتني لم تلدني أمي »","ورُويَ أنَّ عمر رضي الله عنه كان يسقط من الخوف إذا سمع آية من القرآن مغشيًّا عليه فكان يُعاد أيامًا، وأخذ يومًا تبنةً من الأرض، فقال:","","",["إحياء علوم الدين (4/ 183)."],[159],1],[727,"a","","","« من خاف الله لم يشف غيظه، ومن اتقى الله لم يصنع ما يريد، ولولا يوم القيامة لكان غير ما ترون »","أيامًا، وأخذ يومًا تبنةً من الأرض، فقال: « يا ليتني كنت هذه التبنة يا ليتني لم أكُ شيئاً مذكورًا، يا ليتني كنت نسياً منسيًّا، يا ليتني لم تلدني أمي », وكان في وجه عمر رضي الله عنه خطّان أسودان من الدّموع, وقال رحمه الله:","","",["إحياء علوم الدين (4/ 184)."],[159],1],[728,"n","","","ولما قرأ عمر رضي الله عنه الآية: التكوير: 1، وانتهى إلى قوله تعالى الآية: التكوير: 10، خرَّ مغشيًّا عليه. ومرَّ يومًا بدار إنسان وهو يصلي ويقرأ سورة الآية: الطور: 1، فوقف يستمع فلما بلغ قوله تعالى الآية: الطور: 7-8 نزل عن حماره واستند إلى حائط، ومكث زمانًا ورجع إلى منزله فمرض شهرًا يعوده الناس ولا يدرون ما مرضه","","","",["إحياء علوم الدين (4/ 183- 184)."],[159],0],[729,"a","عمارة بن عمير","","« حدّثني من سمع عائشة رضي الله عنها, إذا قرأت هذه الآية: الآية: الأحزاب: 33, بكت حتى تَبُلّ خِمارها »","وعن عُمارَة بن عُمَير رحمه الله, قال:","","",["أخرجه ابن سعد في الطبقات (10/ 79)."],[140],0],[730,"q","ابن عطية","","« وبكاء عائشة رضي الله عنها إنما كان بسبب سفرها أيام الجمل, وحينئذ قال لها عمار رضي الله عنه: إن الله أمرك أن تقري في بيتك »","قال ابن عطية رحمه الله:","","",["تفسير ابن عطية - المحرر الوجيز في تفسير الكتاب العزيز (4/ 383) [الأحزاب: 33]."],[140],0],[731,"a","مجاهد","","« دخلت على ابن عباس رضي الله عنهما, فقلت: يا أبا عباس! كنت عند ابن عمر رضي الله عنهما, فقرأ هذه الآية فبكى. قال: أية آية؟ قلت: الآية: البقرة: 284. قال ابن عباس رضي الله عنهما: إن هذه الآية حين أنزلت, غمَّتْ أصحابَ رسول الله ﷺ غمًّا شديدًا, وغاظتهم غيظًا شديدًا, يعني, وقالوا: يا رسول الله, هلكنا, إن كنا نؤاخذ بما تكلمنا, وبما نعمل, فأمّا قلوبنا فليست بأيدينا, فقال لهم رسول الله ﷺ: قولوا: «سمعنا وأطعنا», قالوا: سمعنا وأطعنا, قال: فنسختها هذه الآية: … إلى الآية: البقرة: 285-286, فتُجُوِّز لهم عن حديث النفس, وأُخِذوا بالأعمال »","عن مُجَاهِدٍ رحمه الله, قال:","صحيح","صححه شعيب الأرناؤوط في تخريج المسند (3070)",["رواه أحمد (3070) والطبري في التفسير (6461) وصححه شعيب الأرناؤوط في تخريج المسند (3070)."],[240],0],[732,"a","عبد الله بن عبيد بن عمير","","« أن أباه كان يقصُّ لابن الزبير رضي الله عنهما, وابنُ عمر رضي الله عنه قاعدٌ ناحيةً, فقرأ: الآية: النساء: 42, فبكى ابن عمر رضي الله عنهما حتى لثِقَ جيبه من دموعه, وابتلت لحيته »","وعن عبد الله بن عبيد بن عُمير رحمه الله:","","",["الرقة والبكاء لابن أبي الدنيا (١١٢)."],[240],0],[733,"a","","","« شرب عبد الله بن عمر رضي الله عنهما ماء باردًا, فبكى فاشتد بكاؤه, فقيل له: ما يبكيك؟ قال: ذكرت آية في كتاب الله عز وجل الآية: سبأ: 54 قال: فعرفت أن أهل النار لا يشتهون شيئًا إلا الماء البارد, وقد قال الله عز وجل: الآية: الأعراف: 50 »","وعن عبد الله بن عقيل بن شمير الرياحي, عن أبيه قال:","","",["كتاب الزهد للإمام أحمد بن حنبل (ص156) رقم (1055)."],[240],0],[734,"s","عبد الله بن عمر","","« كان إذا أتى على هذه الآية: الآية: الحديد: 16 بكى حتى يبلَّ لحيتَه البكاءُ, ويقول: بلى يا رب »","وعن نافع, عن ابن عمر رضي الله عنهما, أنه:","صحيح","جود إسناده ابن حجر العسقلاني في الإصابة (2/ 349)",["أخرجه أبو نعيم في حلية الأولياء رقم (1064)، وجود إسناده ابن حجر العسقلاني في الإصابة (2/ 349)."],[240],0],[735,"s","أبو سلمة","","« كان عمر رضي الله عنه إذا رأى أبا موسى قال: ذكرنا ربنا يا أبا موسى. فيقرأُ عنده »","عن أبي سلمة رضي الله عنه, قال:","","",["أخرجه الدارمي (3536) وعبد الرزاق في المصنف (4310)."],[241],0],[736,"q","ابن القيم","","« يا أبا موسى ذكِّرنا ربَّنا, فيقرأ وهم يستمعـون »","وكان الصحابة رضي الله عنهم, إذا اجتمعوا وفيهم أبو موسى يقولون:","","",["الداء والدواء (ص/ 551)."],[241],0],[737,"a","إسماعيل السدي","","« سمعت أبا أراكة قال: صليت مع علي بن أبي طالب رضي الله عنه صلاة الفجر, فلما انفتل عن يمينه مكث كأن عليه كآبة, حتى إذا كانت الشمس على حائط المسجد قيد رمح, قال: وحائط المسجد أقصر مما هو الآن, ثم قلب يده, فقال: والله لقد رأيتُ أصحاب محمد ﷺ فما أرى اليوم شيئًا يشبههم؛ لقد كانوا يصبحون شُعثًا غُبرًا بين أعينهم أمثالُ رُكَبِ المَعْزَى, قد باتوا لله سُجَّدًا وقيامًا يتلون كتاب الله, ويُراوحون بين جباههم وأقدامهم, فإذا أصبحوا فذكروا الله مادُوا كما تميدُ الشجرُ في يومِ الريح, وهملت أعينهم حتى تبلَّ ثيابهم, والله لكأن القوم باتوا غافلين. ثم نهض فما رئي بعد ذلك مفترًا يضحك حتى ضربه ابن ملجم عدو الله الفاسق »","وعن إسماعيل السُّدي رحمه الله قال:","","",["مقتل عليّ رضي الله عنه، لابن أبي الدنيا (ص/ 25). ط1 دار البشائر- دمشق- 1422هـ."],[241],0],[738,"a","حصين بن عبد الرحمن","","« قلتُ لأسماء بنت أبي بكر رضي الله عنها: كيـف كـان أصحـاب رسـول الله ﷺ عنـد قـراءة القـرآن؟ قالت: كانوا كما ذكرهم الله, أو كما وصفهم الله عز وجل. تدمع عيونهم, وتقشعر جلودهم »","وعن حصين بن عبد الرحمن قال:","","",["تلبيس إبليس (288)."],[241],0],[739,"a","","","« إن هاهنا قومًا إذا استمعوا القرآن بكوا حتى تعلو أصواتهم! فقال الحسن: لم يزل الناس على ذلك؛ يبكون عند الذكر وقراءة القرآن »","وقيل للحسن رحمه الله:","","",["موسوعة ابن أبي الدنيا (3/190)."],[241],0],[740,"q","ابن تيمية","","« هذا سماع سلف الأمة, وأكابر مشايخها وأئمتها كالصحابة والتابعين, ومن بعدهم من المشايخ؛ كإبراهيم بن أدهم, والفضيل بن عياض, وأبي سليمان الداراني ومعروف الكرخي, ويوسف بن أسباط, وحذيفة المرعشي, وأمثال هؤلاء, وكان عمر بن الخطاب رضي الله عنه, يقول لأبي موسى رحمه الله ذَكِّرْنا ربنا, فيقرأ وهم يسمعون ويبكون, وكان أصحاب محمد ﷺ إذا اجتمعوا أمَرُوا واحدًا منهم أن يقرأ القرآن, والباقي يستمعون »","وقال ابن تيمية رحمه الله:","","",["مجموع الفتاوى (10/ 80)."],[241],0],[741,"a","ميمون بن مهران","","« قرأ عمر بن عبد العزيز رحمه الله: الآية: التكاثر: 1, فبكى, ثم قال: الآية: التكاثر: 2, ما أرى المقابر إلا زيارة, ولا بدّ لمن يزورها أن يرجع إلى الجنة أو إلى النار »","عن ميمون بن مهران رحمه الله قال:","","",["الرقة والبكاء لابن أبي الدنيا (٤٢٥)."],[242],0],[742,"a","عبد الأعلى بن أبي عبد الله الغبري","","« رأيت عمر بن عبد العزيز رحمه الله خرج يوم الجمعة في ثياب دَسِمَةٍ, ووراءه حَبَشيٌّ يمشي, فلما انتهى إلى الناس رجع الحبشي, فكان عمر إذا انتهى إلى الرجلين قال: هكذا رحمكما الله, حتى صعد المنبر, فخطب, فقرأ: الآية: التكوير: 1 فقال: وما شأن الشمس؟ الآية: التكوير: 2 حتى انتهى إلى الآية: التكوير: 12-13 فبكى, وبكى أهلُ المسجد, وارتجَّ المسجد بالبكاء, حتى رأيتُ أنَّ حيطانَ المسجدِ تبكي معه »","وعن عبد الأعلى بن أبي عبد الله الغَبْري رحمه الله, قال:","","",["تاريخ دمشق لابن عساكر (33/ 416)."],[242],0],[743,"n","","","وقرأ ذات يوم الآية: يونس: 61 الآية, فبكى بكاًء شديدًا حتى سمعه أهل الدار, فجاءت فاطمة فجلست تبكي لبكائه, وبكى أهل الدار لبكائهما, فجاء ابنه عبد الملك فدخل عليهم وهم على تلك الحال, فقال له: يا أبة ما يبكيك؟ فقال: يا بنى خير, ودَّ أبوك أنه لم يعرِف الدنيا ولم تعرفه, والله يا بنى لقد خشيت أن أهلك, وأن أكون من أهل النار","","","",["البداية والنهاية (9/ 217)."],[242],0],[744,"a","هشام بن حسان","","« انطلقت أنا ومالك بن دينار إلى الحسن وعنده رجل يقرأ الآية: الطور: 1 حتى بلغ: الآية: الطور: 7-8 فبكى الحسن وبكى أصحابه, فجعل مالك يضطرب حتى غشي عليه »","1- قال هشام بن حسان رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (17/ 62) [سورة الطور: ٧]."],[141],0],[745,"a","عنبسة الخواص","","« بلغني أن محمد بن واسع, كان يجعل الآية: الغاشية: 1 وردًا يردِّدها ويبكي »","2- عن عنبسة الخواص قال:","","",["الرقة والبكاء لابن أبي الدنيا (٤٢٨)."],[141],0],[746,"a","خالد بن الصقر السدوسي","","« كان أبي خاصًّا لسفيان الثوري رحمه الله. قال أبي: فاستأذنتُ على سفيان في نحر الظُّهر, فأذنت لي امرأة, فدخلت عليه وهو يقرأ: الآية: الزخرف: 80 ثم يقول: بلى يا رب! بلى يا رب! وينتحب. وينظر إلى سقف البيت ودموعه تسيل, فمكثتُ جالسًا كم شاء الله, ثم أقبل إليَّ, فجلس معي, فقال: مذ كم أنت ههنا؟ ما شعرتُ بمكانك »","3- عن خالد بن الصقر السدوسي رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٩٥)."],[141],0],[747,"a","إبراهيم بن الأشعث","","« ما رأيت أحدًا كان الله في صدره أعظم من الفضيل بن عياض رحمه الله, كان إذا ذكر الله, أو ذُكر عندَه, أو سمع القرآن, ظهر به من الخوف والحزن, وفاضت عيناه, وبكى حتى يرحمه من يحضره »","4- قال إبراهيم بن الأشعث رحمه الله:","","",["الوافي بالوفيات (8/421)."],[141],0],[748,"a","أبو سليمان الداراني","","« كان علي بن الفضيل رحمه الله لا يستطيع أن يقرأ: الآية: القارعة: 1 ولا تُقرأُ عليه »","5- قال أبو سليمان الداراني رحمه الله:","","",["حلية الأولياء (8/ 299)."],[141],0],[749,"n","الشافعي","","6- روى الحافظ ابن عساكر أن الشَّافِعِي رحمه الله قرأ يوماً هذه الآية: الآية: المرسلات: 38-40 الآيات. فلم يزل يبكي حتى غُشِيَ عليه, رحمه الله","","","",["تفسير الإمام الشافعي (3/ 1421)."],[141],0],[750,"a","صفوان بن محرز","","« قد انْدَقَّ قضيب زُورِه؛ الآية: الشعراء: 227 »","7- عن عبد الله بن رباح رحمه الله, عن صفوان بن محرز رحمه الله أنه كان إذا قرأ هذه الآية بكى حتى أقول:","","",["أخرجه ابن أبي شيبة في المصنف (19/ 523) وابن أبي حاتم في تفسيره (9/ 2836) [الشعراء:٢٧٧]."],[141],0],[751,"a","إسماعيل بن ذكوان","","« كان يزيد الرقاشي رحمه الله إنْ دخلَ بيتَه بكى, وإن شهد جنازةً بكى, وإن جلس إليه إخوانُه بكى وأبكاهم. فقال له ابنه يومًا: يا أَبه كم تبكي؟! والله لو كانت النار خُلقت لك ما زدتَ على هذا البكاء! فقال: ثكلتك أمك يا بني! وهل خُلقت النار إلا لي, ولأصحابي, ولإخواننا من الجن؟ أما تقرأ يا بني: الآية: الرحمن: 31؟ أما تقرأ يا بني: الآية: الرحمن: 35؟ فجعل يقرأ عليه حتى انتهى إلى: الآية: الرحمن: 44 قال: فجعل يجول في الدار ويصرخ ويبكي, حتى غُشي عليه, فقالت للفتى أمُّه: يا بني ما أردتَ إلى هذا من أبيك؟ فقال: والله إنما أردتُ أن أهوِّن عليه, لم أرد أن أزيده حتى يقتل نفسه »","8- عن إسماعيل بن ذكوان رحمه الله, قال:","","",["الرقة والبكاء لابن أبي الدنيا (٢٤٨)."],[141],0],[752,"a","صالح المري","","« سمعت يزيد الرقاشي رحمه الله يقرأ هذه الآية على أصحابه ويبكي: الآية: القيامة: 26-28 قال: تقول الملائكة بعضهم لبعض: من أي باب يُرتقى بعمله فيُرتقى فيه بروحه, ويقول أهله: هذا والله حين فراقه, فيبكي إليهم ويبكون إليه ولا يستطيع أن يحير إليهم جوابًا. قال: ثم بكى يزيد بكاء شديدًا »","وعن صالح المري رحمه الله, قال:","","",["تاريخ دمشق لابن عساكر (65/ 87)."],[141],0],[753,"a","أبو سليمان الداراني","","« ما رأيت أحدًا الخوفُ أظهرُ على وجهه والخشوعُ في بدنه من الحسنِ بنِ صالح بن حيٍّ, قام ليلةً إلى الصبح بـ الآية: النبأ: 1 فلما بلغ إلى قوله: الآية: النبأ: 30 فغُشيَ عليه حتى طلعَ الفجر »","9- عن أبي سليمان الداراني رحمه الله قال:","","",["المجالسة وجواهر العلم للدينوري (5/ 403) رقم (2269)."],[141],0],[754,"a","سالم أبي بسطام","","« كان عمر بن المنكدر لا ينام الليل يُكثر البكاء على نفسه, فشق ذلك على أمه, فقالت لأخيه محمد بن المنكدر: إن الذي يصنع عمر يشقّ عليّ فلو كلّمته في ذلك. فاستعان عليه بأبي حازم فقالا له: إن الذي تصنع يشق على أمك. قال: فكيف أصنع؟ إن الليل إذا دخل عليَّ هالني فأستفتح القرآن وما تنقصني نهمتي فيه. قالا: فالبكاء؟ قال: آية من كتاب الله أبكتني. قالا: وما هي؟ قال: قوله رحمه الله: الآية: الزمر: 47 »","10- وعن سالم أبي بسطام رحمه الله, قال:","","",["صفة الصفوة (1/ 380)."],[141],0],[755,"a","أبو صالح السمان التابعي","","« لما قدم أهل اليمن في زمن أبي بكر رضي الله عنه فسمعوا القرآن فجعلوا يبكون, فقال أبو بكر الصديق رضي الله عنه: هكذا كنَّا, ثم قست القلوب »","عن أبي صالح السمان التابعي قال:","","",["فضائل القرآن للقاسم بن سلام (ص135)."],[243],0],[756,"p","","","عرفتُ الشرَّ لا للشّرِّ لكن لتوقَّيه … فمن لا يعرف الشرَّ من الخير يقع فيهِ","","","",["من بحر الهَزَج لأبي نواس، كما في يتيمة الدهر (1/ 84)."],[244],0],[757,"a","قتادة","","« أي: سأمنعهم فهْم كتابي. وقاله سفيان بن عيينة رحمه الله. وقيل: سأصرفهم عن الإيمان بها. وقيل: سأصرفهم عن نفعها, وذلك مجازاة على تكبرهم, نظيره: الآية: الصف: 5 »","قال تعالى: الآية: الأعراف: 146, قال قتادة رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (7/ 283) [سورة الأعراف:146]."],[245],0],[758,"q","الزركشي","","« اعلم أنه لا يحصل للناظر فهم معاني الوحي, ولا يظهر له أسراره, وفي قلبه بدعة أو كِبْر أو هوى أو حب دنيا, أو هو مُصِرّ على ذنب, أو غير متحقق بالإيمان, أو ضعيف التحقيق, أو يعتمد على مفسر ليس عنده علم, أو راجع إلى معقوله؛ وهذه كلها حُجب وموانع بعضها آكدُ من بعض »","قال الزركشي رحمه الله:","","",["البرهان (2/ 181)."],[245],0],[759,"q","ابن القيم","","« أذنبت ذنبًا؛ فحُرِمت فهم القرآن, وفي هذا قيل: إذا كنتَ في نعمةٍ فارْعَها … فإن المعاصي تُزيل النِّعَمْ وبالجملة فإنّ المعاصي نارُ النعم تأكلها, كما تأكل النارُ الحطبَ, عياذًا باللَّه من زوال نعمته وتحويل عافيته »","وقال بعض السلف:","","",["طريق الهجرتين (2/589)."],[245],0],[760,"q","ابن القيم","","« فاعلم أن للغناء خواص لها تأثير في صبغ القلب بالنفاق, ونباته فيه كنبات الزرع بالماء. فمن خواصِّه: أنه يُلهي القلب ويصدُّه عن فهم القرآن وتدبُّره, والعمل بما فيه؛ فإن القرآن والغناء لا يجتمعان في القلب أبدًا؛ لما بينهما من التضادّ؛ فإن القرآن ينهى عن اتباع الهوى, ويأمر بالعِفَّة, ومُجانبة شهوات النفوس وأسباب الغيّ, وينهى عن اتباع خُطُوات الشيطان. والغناء يأمر بضد ذلك كلِّه, ويُحسِّنه, ويُهيِّج النفوس إلى شهوات الغيِّ, فيُثِير كامِنَها, ويُزعجُ قاطنها, ويُحرِّكها إلى كل قبيح, ويسوقها إلى وصل كل مليحة ومليح, فهو والخمرُ رضيعا لبانٍ, وفي تهييجهما على القبائح فرسا رهان, فإنه صِنوُ الخمر ورضيعه, ونائبه وحليفه, وخَدينُه وصديقه, عَقَدَ الشيطانُ بينهما عقد الإخاء الذي لا يُفْسَخ, وأحكم بينهما شريعة الوفاء التي لا تُنسخ, وهو جاسوس القلوب, وسارق المروءة, وسُوس العقل, يتغلغل في مكامن القلوب, ويطّلع على سرائر الأفئدة, ويَدِبُّ إلى محل التخييل, فيُثير ما فيه من الهوى والشهوة والسخافة والرّقاعة والرعونة والحماقة. فبينا ترى الرجل وعليه سمة الوقار, وبهاء العقل, وبَهجة الإيمان, ووقار الإسلام, وحلاوة القرآن, فإذا استمع الغناء ومال إليه نقص عقلُه, وقَلّ حياؤه, وذهبت مروءته, وفارقه بَهاؤه, وتخلّى عنه وقاره, وفرح به شيطانه, وشكا إلى الله تعالى إيمانُه, وثَقُل عليه قرآنه, وقال: يا رب! لا تجمع بيني وبين قرآن عدوِّك في صدرٍ واحدٍ. فاستحسنَ ما كان قبل السَّماع يستقبحه, وأبدى من سِرِّه ما كان يكتمه, وانتقل من الوقار والسكينة إلى كثرة الكلام والكذب, والزهزهة والفرقعة بالأصابع, فيميل برأسه, ويهزُّ منكبيه, ويضرب الأرض برجليه, ويدقّ على أُمِّ رأسه بيديه, ويَثِبُ وثباتِ الدِّبابِ, ويدور دوران الحمار حول الدولاب, ويصفِّق بيديه تصفيق النسوان, ويخور من الوَجْد كخُوار الثيران, وتارةً يتأوّه تأوّه الحزين, وتارةً يزعق زعقات المجانين »","قال ابن القيم رحمه الله:","","",["إغاثة اللهفان في مصايد الشيطان (1/ 439- 440)."],[246],0],[761,"p","","","واللهِ إنَّ سماعَهُم في القلب والْ … إيمانِ مثلُ السُّمِّ في الأبدانِ … فالقلبُ بَيتُ الرَّبِّ رحمه الله … حُبًّا وإخلاصًا مع الإحسانِ … فإذا تَعَلَّق بالسَّماع أحالَهُ … عبدًا لكلِّ فُلانةٍ وفُلانِ … حُبُّ الكتاب وحُبُّ ألْحان الغِنا … في قلب عَبدٍ ليس يجتَمِعانِ","","","",["النونية رقم: (5161- 5165)."],[246],0],[762,"h","النبي ﷺ","المقدام بن معدي كرب","«ما ملأَ آدميٌّ وعاءً شرًّا من بطنٍ, حسْبُ الآدميِّ لقيماتٌ يُقِمنَ صلبَهُ, فإن غلبتِ الآدميَّ نفسُهُ فثُلُثٌ للطَّعامِ وثلثٌ للشَّرابِ وثلثٌ للنَّفَسِ»","عن المقدام بن معدي كرب رضي الله عنه, قال: سمعت رسول الله ﷺ يقول:","صحيح","صححه الألباني في صحيح ابن ماجه (2720)",["رواه ابن ماجه (3349) واللفظ له، والترمذي (2380) وأحمد (17186). وصححه الألباني في صحيح ابن ماجه (2720)."],[247],0],[763,"q","الغزالي","","« ذُكر هذا الحديث لبعض الفلاسفة من الأطباء, فعجب منه وقال: ما سمعت كلامًا في قلة الأكل أعظم من هذا, والله إنه لكلام حكيم »","قال الغزالي رحمه الله:","","",["إحياء علوم الدين (3/ 87)."],[247],0],[764,"q","الطيبي","","« أي: الحقُّ الواجبُ أنْ لا يتجاوزَ عما يُقامُ به صُلبُه ليتقوى به على طاعة الله, فإن أراد البتَّةَ لِتجاوُزٍ فلا يتجاوزْ عن القسم المذكور, جعَلَ البطن أولًا وِعاءً كالأوعية التي تُتخذُ ظروفًا لحوائج البيت توهينًا لشأنه, ثم جعله شرَّ الأوعية لأنها استُعمِلتْ فيما هي له, والبطنُ خَلْقٌ لأنه يُتقَوَّمُ به الصُّلبُ بالطعام, وامتلاؤه يُفضي إلى الفساد في الدين والدنيا, فيكونَ شرًّا منها »","قال الطيبي رحمه الله:","","",["مرقاة المفاتيح شرح مشكاة المصابيح (8/ 3251)."],[247],0],[765,"a","سلم الخواص","","« الناس ثلاثة أصناف: صنف شبه الملائكة, وصنف شبه البهائم, وصنف شبه الشياطين. فأما الذين شبه الملائكة فالمؤمنون في ليلهم ونهارهم طائعين يحبون أهل الطاعة, وأما الذين شبه البهائم فالذين ليست لهم هم إلا الأكل والشرب والنكاح والنوم, فهم كالبهائم, وأما الذين شبه الشياطين فالذين في معاصي الله تعالى مساءًا وصباحًا ويعطون كل الأجر »","وقال سلم الخواص رحمه الله:","","",["حلية الأولياء (8/ 278)."],[247],0],[766,"q","أبو الليث السمرقندي","","« في كثرة الأكل خمس خصال مذمومة: الأولى: أن يذهب خوف الله من قلبه. الثانية: إذا سمع كلام الحكمة لا يجد له رقة. الثالثة: أن يكسل عن الطاعة. الرابعة: إذا تكلم بالحكمة والموعظة لا يقع كلامه في قلوب الناس. الخامسة: يهيج منه الأمراض »","وقال أبو الليث السمرقندي رحمه الله:","","",["فتح القريب المجيب على الترغيب والترهيب (9/ 394)."],[247],0],[767,"a","أحمد بن أبي الحواري","","« فحَدَّثْتُ بهذا أبا سليمان فقال: إنما جاء الحديث: «ثلث طعام وثلث شراب», وأرى هؤلاء قد حاسبوا أنفسهم فربحوا سُدُسًا »","وقال أحمد بن أبي الحواري رحمه الله:","","",["حلية الأولياء (8/318)."],[247],0],[768,"a","المروزي","","« قلت لأبي عبد الله, يعني؛ الإمام أحمد رحمه الله: يجد الرجل من قلبه رِقَّة وهو يشْبَع؟ قال: ما أرى! »","وقال المروزي رحمه الله:","","",["الورع للمروزي (323).","الورع للإمام أحمد ابن حنبل رواية المروزي (ص/ 105) رقم (323)."],[247,248],0],[769,"a","محمد بن واسع","","« من قَلَّ طُعْمُه, فَهِم وأفهم وصَفَا ورَقّ, وإنَّ كثرة الطعام لَيُثْقِل صاحبه عن كثير مما يريد »","وعن محمد بن واسع رحمه الله قال:","","",["رواه ابن أبي الدنيا في الجوع (49)."],[247],0],[770,"a","إبراهيم بن أدهم","","« من ضَبَطَ بطنه ضَبَط دينه, ومن مَلَك جُوعَه مَلَك الأخلاق الصالحة »","وعن إبراهيم بن أدهم رحمه الله قال:","","",["ذكره ابن رجب في جامع العلوم والحكم (2/473)."],[247],0],[771,"a","قثم العابد","","« كان يقال: ما قَلَّ طعام امرئ قط إلا رَقّ قلبه ونَدِيَتْ عيناه »","وعن قُثَم العابد رحمه الله قال:","","",["رواه ابن أبي الدنيا في الجوع (124)."],[247],0],[772,"a","أبو عمران الجوني","","« كان يقال: من أحب أن يُنَوَّرَ قَلْبُهُ, فَلْيُقِلَّ طُعْمَه »","وعن أبي عمران الجَوْني قال:","","",["المصدر السابق."],[247],0],[773,"q","ابن قدامة","","« ومن أبواب دخول الشيطان على قلب ابن آدم: الشِّبَع, فإنه يُقَوي الشهوة, ويشغل الطاعة »","وفي مختصر منهاج القاصدين:","","",["مختصر منهاج القاصدين (ص/ 194)."],[247],0],[774,"q","الطبري","","« إنِّي لأعجب ممَّنْ يقرأ القرآن ولم يعلم تأويله, كيف يلتذُّ بقراءته؟! »","إن الجهل بمعاني القرآن يصرف القارئ عن تدبُّره, ويَحْرِمه التلذُّذ بقراءته, وفي ذلك يقول الطَّبري رحمه الله:","","",["تفسير الطبري (1/ 10)."],[227],0],[775,"q","ابن تيمية","","« وتدبُّر الكلام بدون فهم معانيه لا يمكن؛ ولذلك قال تعالى: الآية: يوسف: 2 وعَقْل الكلام متضمن لفهمه, ومن المعلوم أن كل كلام فالمقصود منه فهم معانيه دون مجرد ألفاظه, فالقرآن أولى بذلك »","وقال ابن تيمية رحمه الله:","","",["مجموع الفتاوى (13/332)."],[227],0],[776,"h","النبي ﷺ","سهل بن سعد الساعدي","«الحمدُ للهِ, كتابُ اللهِ واحدٌ, وفيكم الأحمرُ, وفيكم الأبيضُ, وفيكم الأسْودُ, اقرَؤوه قبلَ أنْ يَقرَأَه أقوامٌ يُقيمونَه كما يُقوَّمُ السهمُ, يَتعجَّلُ أجرَه ولا يَتأجَّلُه»","عن سهل بن سعد الساعدي رحمه الله, قَالَ: خرَج علينا رسولُ اللهِ ﷺ يومًا ونحن نَقترِئُ, فقال:","حسن","حسنه الألباني في صحيح أبي داود (831)",["رواه أبو دود (831) وابن حبان في صحيحه (760) وحسنه الألباني في صحيح أبي داود (831)."],[249],0],[777,"q","الطيبي","","« وفي الحديث رفعُ الحرج وبناءُ الأمر على المُساهلة في الظاهر, وتحري الحسبة والإخلاص في العمل, والتفكر في معاني القرآن, والغوص في عجائب أمره. «يتعجلونه» أي: ثوابه في الدنيا «ولا يتأجلونه» بطلب الأجر في العقبى, بل يؤثرون العاجلة على الآجلة, ويتأكلون ولا يتوكلون »","قال الطيبي رحمه الله:","","",["عون المعبود شرح سنن أبي داود (3/ 42) [حديث 830]."],[249],0],[778,"h","النبي ﷺ","سعد بن أبي وقاص","«ليسَ منَّا مَنْ لم يَتغنَّ بالقُرآن»","عن سعد بن أبي وقاص رضي الله عنه, قال: قال رسول الله ﷺ:","صحيح","صححه الألباني في صحيح أبي داود (1469) والوادعي في الصحيح المسند مما ليس في الصحيحين (384)",["رواه أبو داود (1469) وابن ماجه (1337) والدارمي (1531) وأحمد (1476) وصححه الألباني في صحيح أبي داود (1469) والوادعي في الصحيح المسند مما ليس في الصحيحين (384)."],[217],0],[779,"q","ابن قتيبة","","« استمعَ كتاب الله, وهو شاهدُ القلب والفهم, ليس بغافلٍ ولا ساهٍ. وهو إشارةٌ إلى المانع من حصولِ التأثير, وهو سهوُ القلب وغيبتُهُ عن تعقُّلِ ما يُقال له والنظرِ فيه وتأمُّلِه »","قال ابن قتيبة رحمه الله:","","",["الفوائد (ص/ 4)."],[250],0],[780,"q","ابن كثير","","« يقول تعالى آمرًا رسوله ﷺ أن يخبر قومه: أن الجنَّ استمعوا القرآن فآمنوا به وصدقوه وانقادوا له, فقال تعالى: الآية: الجن: 1-2؛ أي: إلى السداد والنجاح, الآية: الجن: 2, وهذا المقام شبيه بقوله تعالى: الآية: الأحقاف: 29 »","قال ابن كثير رحمه الله:","","",["تفسير ابن كثير (8/ 237) [سورة الجن: 1]."],[251],0],[781,"h","النبي ﷺ","عبد الله بن عباس","« انطلق رسول الله ﷺ في طائفةٍ من أصحابه, عامدين إلى سوقِ عُكاظٍ, وقد حيل بين الشياطين وبين خبر السماء, وأُرسلتْ عليهم الشُّهُبُ, فرجعتِ الشياطين, فقالوا: ما لكم؟ فقالوا: حيل بيننا وبين خبر السماء, وأرسلت علينا الشهب, قال: ما حال بينكم وبين خبر السماء إلا ما حدث, فاضربوا مشارقَ الأرض ومغارِبَها, فانظروا ما هذا الأمر الذي حدث, فانطلَقوا, فضرَبُوا مشارق الأرض ومغارِبَها, ينظرون ما هذا الأمر الذي حال بينهم وبين خبر السماء, قال: فانطلق الذين توجَّهُوا نحو تهامة إلى رسول الله ﷺ بنخلَةَ, وهو عامدٌ إلى سوقِ عكاظٍ, وهو يصلي بأصحابه صلاةَ الفجر, فلمَّا سمعوا القرآن تسمَّعُوا له, فقالوا: هذا الذي حال بينكم وبين خبر السماء, فهنالك رجَعُوا إلى قومِهِم, فقالوا: يا قومنا … وأنزل الله عز وجل على نبيه ﷺ: … وإنما أوحي إليه قول الجنّ »","وعن ابن عباس رضي الله عنهما, قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (4921) ومسلم (449)."],[251],0],[782,"h","النبي ﷺ","محمد بن جبير بن مطعم","« سمعت النبي ﷺ يقرأ في المغرب بالطور, فلما بلغ هذه الآية: الآية: الطور: 35-37, كاد قلبي أن يطيرَ »","عن محمد بن جبير بن مطعم, عن أبيه رحمه الله قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (4854)."],[252],0],[783,"h","النبي ﷺ","محمد بن جبير","« سمعت النبي ﷺ يقرأ في المغرب بالطور, وذلك أوَّلَ ما وقَرَ الإيمانُ في قلبي »","وفي رواية عن محمد بن جبير, عن أبيه قال:","صحيح","في الصحيحين أو أحدهما",["صحيح البخاري (4023)."],[252],0],[784,"a","","","« قوله: \"كاد قلبي يطير\" قال الخطابي رحمه الله: كأنه انزعج عند سماع هذه الآية لفهمه معناها ومعرفته بما تضمنته, ففهم الحجة, فاستدركها بلطيف طبعه, وذلك من قوله تعالى: الآية: الطور: 35. قيل: معناه ليسوا أشد خلقًا من خلق السماوات والأرض؛ لأنهما خلقتا من غير شيء, أي هل خلقوا باطلًا لا يؤمرون ولا ينهون؟ وقيل: المعنى أم خلقوا من غير خالق؟ وذلك لا يجوز فلا بد لهم من خالق, وإذا أنكروا الخالق فهم الخالقون لأنفسهم, وذلك في الفساد والبطلان أشد؛ لأن ما لا وجود له كيف يخلق, وإذا بطل الوجهان قامت الحجة عليهم بأن لهم خالقًا. ثم قال: الآية: الطور: 36؛ أي: إنْ جاز لهم أن يدَّعُوا خلق أنفسهم فليدّعوا خلق السماوات والأرض, وذلك لا يمكنهم, فقامت الحجة. ثم قال: … فذكر العلة التي عاقتهم عن الإيمان, وهو عدم اليقين الذي هو موهبة من الله, ولا يحصل إلا بتوفيقه, فلهذا انزعج جبير حتى كاد قلبه يطير, ومال إلى الإسلام »","وفي فتح الباري:","","",["فتح الباري (8/ 603) رقم (4854)."],[252],0],[785,"q","السندي","","« قوله: (كاد قلبي أن يطير)؛ لظهور الحق ووضوح بطلان الباطل »","وقال السندي رحمه الله:","","",["حاشية السندي على ابن ماجه (1/ 275) رقم (832)"],[252],0],[786,"h","النبي ﷺ","","« لما نزلنا أرضَ الحبَشةِ, جاورنا بها خيرَ جارٍ, النجاشيَّ, أمِنَّا على ديننا, وعَبَدْنا الله لا نُؤذى, ولا نسمعُ شيئًا نكرَهُه, فلما بلغ ذلك قريشًا, ائتمروا أن يبعثوا إلى النجاشي فينا رجلين جَلْدين, وأن يُهدوا للنجاشي هدايا مما يُستطرفُ من متاع مكة, وكان من أعجبِ ما يأتيه منها إليه الأَدَمُ, فجمعوا له أَدَمًا كثيرًا, ولم يتركوا من بطارقته بطريقًا إلا أهدوا له هدية, ثم بعثوا بذلك مع عبد الله بن أبي ربيعة بن المغيرة المخزومي, وعمرو بن العاص بن وائل السهمي, وأمروهما أمرهم, وقالوا لهما: ادفعوا إلى كل بِطريق هديَّتَه, قبل أن تُكلموا النجاشي فيهم, ثم قدِّموا للنجاشي هداياه, ثم سلوه أن يُسْلمَهم إليكم قبل أن يُكلِّمَهم, قالت: فخرجا فقدما على النجاشي, ونحن عنده بخير دار, وعند خير جار, فلم يبق من بطارقته بطريق إلا دفعا إليه هديته قبل أن يُكلما النجاشي, ثم قالا لكل بطريق منهم: إنه قد صبَا إلى بلَدِ الملك منا غلمانٌ سفهاءُ, فارقوا دينَ قومهم, ولم يدخلوا في دينكم, وجاءوا بدين مبتدَعٍ لا نعرفه نحن ولا أنتم, وقد بعَثَنا إلى الملِك فيهم أشرافُ قومهم لنردَّهم إليهم, فإذا كلَّمْنا الملك فيهم, فتُشيروا عليه بأن يُسْلِمَهُم إلينا, ولا يُكلمَهم, فإن قومهم أعلى بهم عَينًا, وأعلمُ بما عابوا عليهم, فقالوا لهما: نعم, ثم إنهما قربا هداياهم إلى النجاشي فقبلها منهما, ثم كلماه, فقالا له: أيها الملك, إنه قد صبا إلى بلدك منا غلمانٌ سفهاء, فارقوا دين قومهم, ولم يدخلوا في دينك, وجاءوا بدين مبتدع لا نعرفه نحن ولا أنت, وقد بعَثنَا إليك فيهم أشرافُ قومهم من آبائهم, وأعمامهم وعشائرهم, لتردَّهم إليهم, فهمْ أعلى بهم عينًا, وأعلمُ بما عابوا عليهم وعاتبوهم فيه. قالت: ولم يكن شيء أبغض إلى عبد الله بن أبي ربيعة, وعمرو بن العاص من أن يسمع النجاشي كلامهم, فقالت بطارقته حوله: صدقوا أيها الملك, قومُهم أعلى بهم عَينًا, وأعلمُ بما عابوا عليهم, فأسلِمْهم إليهما, فليردَّاهم إلى بلادهم وقومهم, قالت: فغضب النجاشي, ثم قال: فغضب النجاشي, ثم قال: لا هَيْمُ الله, إذًا لا أُسلِمُهُم إليهما, ولا أُكادُ قومًا جاوروني, ونزلوا بلادي, واختاروني على من سواي حتى أدعوَهم فأسألَهُم ماذا يقولُ هذانِ في أمرهم, فإن كانوا كما يقولان أسلمتُهم اليهما وردَدتُهم الى قومهم, وإن كانوا على غير ذلك منعتهم منهما, وأحسنتُ جوارهم ما جاوروني. قالت: ثم أرسل إلى أصحاب رسول الله ﷺ, فدعاهم فلما جاءهم رسولُه اجتمعوا, ثم قال بعضهم لبعض: ما تقولون للرجل إذا جئتموه؟ قالوا: نقول والله ما علمنا, وما أمرنا به نبينا ﷺ, كائنٌ في ذلك ما هو كائنٌ. فلما جاءوه, وقد دعا النجاشي أساقفته, فنشروا مصاحفهم حوله, سألهم فقال: ما هذا الدين الذي فارقتُم فيه قومَكم, ولم تدخلوا في ديني ولا في دين أحد من هذه الأمم؟ قالت: فكان الذي كلَّمَه جعفرُ بنُ أبي طالب, فقال له: أيُّها الملك, كنا قوما أهل جاهلية نعبد الأصنام, ونأكل المَيْتةَ ونأتي الفواحشَ, ونَقطعُ الأرحامَ, ونُسيءُ الجوارَ؛ يأكل القوي منا الضعيف, فكنا على ذلك حتى بعث الله إلينا رسولًا منا نعرف نسبه, وصدقه, وأمانته, وعفافه, فدعانا إلى الله لنوحِّدَه, ونعبُدَه, ونخلعَ ما كنا نعبدُ نحن وآباؤنا من دونه من الحجارة والأوثان, وأمَرَنا بصدق الحديث, وأداءِ الأمانة, وصلةِ الرحم, وحُسْنِ الجِوار, والكفِّ عن المحارمِ, والدماءِ, ونهانا عن الفواحشِ, وقولِ الزُّور, وأكلِ مال اليتيم, وقذفِ المحصَنة, وأمَرَنا أنْ نعبدَ الله وحده لا نشركُ به شيئًا, وأمَرَنا بالصلاة, والزكاة, والصيام, قال: فعدد عليه أمور الإسلام, فصدَّقناه وآمنا به واتَّبعناه على ما جاء به, فعبَدْنا الله وحده, فلم نشركْ به شيئًا, وحرَّمنا ما حرَّم علينا, وأحللنا ما أحلَّ لنا, فعدا علينا قومُنا, فعذبونا وفتنونا عن ديننا ليردُّونا إلى عبادة الأوثان من عبادة الله, وأن نستحلَّ ما كنا نستحلُّ من الخبائث, فلما قهرونا وظلمونا, وشقُّوا علينا, وحالوا بيننا وبين ديننا, خرجنا إلى بلدك, واخترناك على من سواك, ورغبنا في جوارك, ورجونا أن لا نُظلمَ عندك أيُّها الملكُ, قالت: فقال له النجاشي: هل معك مما جاء به عن الله من شيء؟ قالت: فقال له جعفر: نعم, فقال له النجاشي: فاقرأه علي, فقرأ عليه صدْرًا من الآية: مريم: 1 قالت: فبكى والله النجاشي حتى أَخْضَلَ لحيته, وبكت أساقفته حتى أخضلوا مصاحفهم حين سمعوا ما تلا عليهم, ثم قال النجاشي: إن هذا والذي جاء به موسى ليخرج من مشكاة واحدة, انطلقا فوالله لا أُسلمُهُم إليكم أبدًا, ولا أُكادُ, قالت أم سلمة: فلما خرجا من عنده, قال عمرو بن العاص: والله لأُنبِّئنَّهم غدًا عيبَهُم عندهم, ثم أَستأصلُ به خضراءَهم, قالت: فقال له عبد الله بن أبي ربيعة - وكان أتقى الرجلين فينا -: لا تفعل فإن لهم أرحامًا, وإن كانوا قد خالفونا. قال: والله لأخبرنه أنهم يزعمون أن عيسى ابن مريم عَبدٌ, قالت: ثم غدا عليه الغد, فقال له: أيها الملك, إنهم يقولون في عيسى ابن مريم قولًا عظيمًا, فأرْسِلْ اليهم فاسألهم عما يقولون فيه, قالت: فأرسل إليهم يسألهم عنه, قالت: ولم ينزِلْ بنا مثلُه, فاجتمع القوم, فقال بعضهم لبعض: ماذا تقولون في عيسى إذا سألكم عنه؟ قالوا: نقول والله فيه ما قال الله, وما جاء به نبيُّنا كائنًا في ذلك ما هو كائنٌ, فلما دخلوا عليه, قال لهم: ما تقولون في عيسى ابن مريم؟ فقال له جعفر بن أبي طالب: نقول فيه الذي جاء به نبينا: هو عبد الله ورسوله, وروحه وكلمته ألقاها إلى مريم العذراء البتول, قالت: فضرب النجاشي يده إلى الأرض, فأخذ منها عودًا, ثم قال: ما عدا عيسى ابن مريم ما قلت هذا العود, فتناخرت بطارقته حوله حين قال ما قال, فقال: وإن نخرتم والله, اذهبوا فأنتم سُيُومٌ بأرضي - والسيوم: الآمنون - من سبَّكم غُرِّمَ, ثم مَن سبكم غُرِّمَ, فما أحب أن لي دَبْرًا ذهبًا, وأني آذيت رجلًا منكم - والدبر بلسان الحبشة: الجبل - ردوا عليهما هداياهما, فلا حاجة لنا بها, فوالله ما أخذ الله مني الرِّشوة حين ردَّ عليَّ مُلكي, فآخذَ الرِّشوةَ فيه وما أطاعَ الناسَ فيَّ, فأُطيعَهُم فيه. قالت: فخرجا من عنده مقبوحَينِ مردودًا عليهما ما جاءا به, وأقمنا عنده بخير دار مع خير جار. قالت: فوالله إنا على ذلك إذ نزل به - يعني من ينازعه في ملكه - قال: فوالله ما علمنا حُزنًا قطُّ كان أشدَّ من حُزنٍ حَزِنَّاهُ عند ذلك, تَخوُّفًا أن يظهر ذلك على النجاشي, فيأتيَ رجلٌ لا يعرفُ مِن حقِّنا ما كان النجاشيُّ يعرفُ منه. قالت: وسار النجاشي وبينهما عُرْضُ النيل, قالت: فقال أصحابُ رسول الله ﷺ: مَنْ رَجُلٌ يخرج حتى يَحضُرَ وقعةَ القوم ثم يأتينا بالخبر؟ قالت: فقال الزبير بن العوام رضي الله عنه: أنا, قالت: وكان من أحدث القوم سِنًّا, قالت: فنفَخُوا له قِرْبَةً, فجعلها في صدره ثم سَبَحَ عليها حتى خرج إلى ناحية النيل التي بها مُلتقى القوم, ثم انطلق حتى حضَرَهم. قالت: ودعونا الله للنَّجاشي بالظُّهُور على عدُوِّهِ, والتمكينِ له في بلادِهِ, واستَوْسَقَ عليه أمرُ الحبشة, فكنا عنده في خيرِ مَنْزِلٍ, حتى قدِمنا على رسول الله ﷺ, وهو بمكة »","عن أمِّ سلمةَ ابنةِ أبي أُميةَ بنِ المغيرةِ, زوجِ النبي ﷺ, قالت:","حسن","حسنه الوادعي في الصحيح المسند مما ليس في الصحيحين (1651)",["رواه أحمد في المسند (1740)، وحسنه الوادعي في الصحيح المسند مما ليس في الصحيحين (1651)."],[253],0],[787,"q","ابن إسحاق","","« أنَّ أسعد بنَ زُرارة خرج بمصعب بنِ عمير يريد به دار بني عبد الأشهل, ودار بني ظَفَرٍ, وكان سعدُ بن معاذ بن النعمان بن امرئ القيس بن زيد بن عبد الأشهل بن خالة أسعد بن زرارة, فدخل به حائطًا من حوائط بني ظَفَرٍ, على بئر يقال لها: بئرُ مَرَقٍ, فجلسا في الحائط, واجتمع إليهما رجالٌ ممن أسلمَ, وسعدُ بنُ معاذ وأسيدُ بنُ حُضيرٍ يومئذ سيدا قومِهما من بني عبد الأشهل, وكلاهما مشركٌ على دين قومه, فلما سمعا به قال سعد بن معاذ لأسيد بن حضير: لا أَبَا لكَ, انطلقْ إلى هذين الرجلين اللَّذَينِ قد أتيا دارينا ليُسفِّهَا ضعفاءَنا, فازجرهما وانههما عن أن يأتيا دارَيْنا, فإنه لولا أن أسعد بن زرارة مني حيثُ قد علمت كفيتك ذلك, هو ابن خالتي, ولا أجد عليه مقدمًا, قال: فأخذ أسيد بن حضير حربته, ثم أقبل إليهما, فلما رآه أسعد ابن زرارة, قال لمصعب بن عمير: هذا سيد قومه قد جاءك, فاصدق الله فيه, قال مصعب: إن يجلس أكلمه, قال: فوقف عليهما مُتَشتِّمًا, فقال: ما جاء بكما إلينا تسفهان ضعفاءنا؟ اعتزلانا إن كانت لكما بأنفسكما حاجة, فقال له مصعب: أوَتجلسُ فتسمعَ, فإن رضيت أمرًا قبلتَه, وإن كرهته كف عنك ما تكره؟ قال: أنصفت, ثم ركز حربته وجلس إليهما, فكلمه مصعب بالإسلام, وقرأ عليه القرآن, فقالا: فيما يذكر عنهما: والله لعرفنا في وجهه الإسلام قبل أن يتكلم في إشراقه وتسهُّلهِ, ثم قال: ما أحسن هذا الكلامَ وأجملَه! كيف تصنعون إذا أردتم أن تدخلوا في هذا الدين؟ قالا له: تغتسلُ فتَطَّهَّرُ وتُطَهِّرُ ثوبيك, ثم تشْهَدُ شهادة الحق, ثم تصلي, فقام فاغتسل وطهر ثوبيه, وتشهد شهادة الحق, ثم قام فركع ركعتين, ثم قال لهما: إن ورائي رجلًا إن اتبعكما لم يتخلف عنه أحد من قومه, وسأرسله إليكما الآن, سعد بن معاذ, ثم أخذ حربته وانصرف إلى سعد وقومه وهم جلوس في ناديهم, فلما نظر إليه سعد بن معاذ مقبلًا, قال: أحلفُ بالله لقد جاءكم أُسيدٌ بغير الوجه الذي ذهب به من عندكم, فلما وقف على النادي قال له سعد: ما فعلت؟ قال: كلمت الرجلين, فو الله ما رأيت بهما بأسًا, وقد نهيتهما, فقالا: نفعل ما أحببت, وقد حُدِّثتُ أن بني حارثة قد خرجوا إلى أسعد بن زرارة ليقتلوه, وذلك أنهم قد عرفوا أنه ابن خالتك, ليُخفِروكَ. قال: فقام سعد مُغضبًا مُبادرًا, تخوُّفًا للذي ذُكرَ له من بني حارثة, فأخذ الحربة من يده, ثم قال: والله ما أراك أغنيتَ شيئًا, ثم خرج إليهما, فلما رآهما سعد مطمئنين, عرَفَ سعدٌ أن أُسيدًا إنما أراد منه أن يسمع منهما, فوقف عليهما مُتَشتِّمًا, ثم قال لأسعد بن زرارة: يا أبا أمامة! أما والله, لولا ما بيني وبينك من القرابة ما رمت هذا مني, أتغشانا في دارينا بما نكره- وقد قال أسعد ابن زرارة لمصعب بن عمير: أي مصعب! جاءك والله سيّدُ مَنْ وراءَه من قومه, إن يتبعك لا يتخلف عنك منهم اثنان- قال: فقال له مصعب: أوَتقعُدُ فتسمع, فإن رضيت أمرًا ورغبت فيه قبلته, وإن كرهتَه عزَلْنَا عنك ما تكره؟ قال سعدٌ: أنصفت, ثم ركز الحربة وجلس, فعرض عليه الإسلام, وقرأ عليه القرآن, قالا: فعرفنا والله في وجهه الإسلام قبل أن يتكلم, لإشراقه وتسَهُّله, ثم قال لهما: كيف تصنعون إذا أنتم أسلمتم ودخلتم في هذا الدين؟ قالا: تغتسل, فتطَّهَّرُ وتُطَهِّرُ ثوبيك, ثم تشْهَدُ شهادةَ الحق, ثم تصلي ركعتين, قال: فقام فاغتسل, وطهر ثوبيه, وتشهد شهادة الحق, ثم ركع ركعتين, ثم أخذ حربته, فأقبل عامدًا إلى نادي قومه ومعه أسيدُ بنُ حُضَيرٍ. قال: فلما رآه قومه مقبلًا, قالوا: نحلف بالله لقد رجع إليكم سعد بغير الوجه الذي ذهب به من عندكم, فلما وقف عليهم قال: يا بني عبد الأشهل, كيف تعلمون أمري فيكم؟ قالوا: سيدنا وأوصلنا وأفضلنا رأيا, وأيمننا نقيبة, قال: فإن كلام رجالكم ونسائكم عليَّ حرام حتى تؤمنوا بالله وبرسوله. قالا: فو الله ما أمسى في دار بني عبد الأشهل رجل ولا امرأة إلا مسلمًا ومسلمة, ورجع أسعد ومصعب إلى منزل أسعد بن زرارة, فأقام عنده يدعو الناس إلى الإسلام, حتى لم تبق دار من دور الأنصار إلا وفيها رجال ونساء مسلمون »","روى ابْنُ إسْحَاقَ:","","",["السيرة النبوية لابن هشام (ص/ 436- 438). باب: بدء إسلام الأنصار- أول جمعة أقيمت بالمدينة."],[254],0],[788,"q","ابن إسحاق","","« فلما قُبِض رسول الله ﷺ وارتدَّت العرب خرج الطفيل مع المسلمين حتى فرغوا مِن طُلَيحة, ثم سار مع المسلمين إلى اليمامة ومعه ابنه عمرو بن الطفيل, فقال لأصحابه: إني قد رأيت رؤيا فاعبُرُوها لي؛ رأيت أن رأسي قد حُلق, وأنه قد خرج من فمي طائر, وأن امرأةً لقيتني فأدخلتني في فرجها, ورأيت أن ابني يطلبني طلبًا حثيثًا ثم رأيته حُبِس عني. قالوا: خيرًا رأيت. قال: أما والله إني قد أوَّلتُها. قالوا: وما أولتَها؟ قال: أما حلق رأسي فوضعه, وأما الطائر الذي خرج من فمي فروحي, وأما المرأة التي أدخلَتْني في فرجها فالأرض تُحفَر فأغيَّب فيها, وأما طلب ابني إياي وحبسه عني فإني أراه سيجهد لأن يصيبه من الشهادة ما أصابني؛ فقُتِل الطفيل شهيدًا باليمامة, وجرح ابنه عمرو جراحًا شديدًا, ثم قتل عام اليرموك شهيدًا في زمن عمر رضي الله عنه »","قال ابن إسحاق:","","",["النص منقول من زاد المعاد (3/ 501- 503). وقد أخرج القصة البيهقي عن ابن إسحاق في الدلائل (5/ 359- 363). ويشهد للقصة حديث: «اللهم اهد دوسًا وأتِ بهم» في البخاري (2937)  ومسلم (2524)."],[255],0],[789,"a","أبو بكر بن عياش","","« صليت خلف فضيل بن عياض رحمه الله المغربَ وابنُه عليٌّ إلى جانبي فقرأ: الآية: التكاثر: 1, فَلَمَّا قال: الآية: التكاثر: 6, سقط عليٌّ على وجهه مغشيَّا عليه, فما أفاق إلى ثُلُث الليل »","قال أبو بكر بن عيَّاش رحمه الله:","","",["تذهيب تهذيب الكمال في أسماء الرجال (7/ 35)."],[173],0],[790,"a","محمد بن ناجية","","« صلَّيتُ خلف الفضيل بن عياض رحمه الله, فقرأ: الآية: الحاقة: 1, في الصبح, فلما بلغَ إلى قوله: الآية: الحاقة: 30, غلبه البكاء فسقط ابنُه عليٌّ مغشيًّا عليه »","وعن محمد بن ناجية رحمه الله قال:","","",["سير أعلام النبلاء (8/ 444)."],[173],0],[791,"a","علي بن المديني","","« كنا عند يحيى بن سعيد القطان, فقرأ رجل سورة الدخان, فصعق يحيى, وغشي عليه, فقال أحمد بن حنبل رحمه الله: لو قَدرَ أحدٌ أن يدفع هذا عن نفسه, لدفعه يحيى – يعني: ابن سعيد القطان - يعني: الصَّعق »","وقال علي بن المديني رحمه الله:","","",["تاريخ الإسلام للذهبي (13/ 466)."],[173],0],[792,"a","أحمد بن سعيد الهمذاني","","« دخل عبد الله بن وهب الحمام, فسمع قارئًا يقرأ: الآية: غافر: 47 فغشي عليه »","وقال أحمد بن سعيد الهمذاني رحمه الله:","","",["سير أعلام النبلاء (9/223)."],[173],0],[793,"a","بهز","","« وكنت فيمن حمله »","وعن بهز بن حكيم أن زرارة بن أوفى التابعي الجليل رحمه الله أمهم في صلاة الفجر فقرأ حتى بلغ: الآية: المدثر: 8-9, خرَّ ميتًا, قال بهز:","","",["التبيان في آداب حملة القرآن (ص/ 76)."],[173],0],[794,"a","أبو جناب القصاب واسمه عون بن ذكوان","","« صلى بنا زرارة بن أوفى صلاة الصبح فقرأ يا أيها المدثر حتى بلغ الآية: المدثر: 8-9, خَرَّ ميتًا وكنت فيمن حمله إلى داره »","وقال أبو جناب القصاب واسمه عون بن ذكوان:","","",["حلية الأولياء (2/ 258)."],[173],0],[795,"n","أبو القاسم الجنيد","","وكان أحمد بن أبي الحواري رحمه الله وهو ريحانة الشام كما قال أبو القاسم الجنيد رحمه الله إذا قرئ عنده القرآن يصيح ويصعق","","","",["التبيان في آداب حملة القرآن (ص/ 76)."],[173],0],[796,"q","القرطبي","","« وهذه أحوال العلماء يبكون ولا يُصعَقُون, ويَسألون ولا يَصيحون, ويتحازنون ولا يَتموَّتُون؛ كما قال تعالى: الآية: الزمر: 23 »","قال القرطبي رحمه الله:","","",["تفسير القرطبي - الجامع لأحكام القرآن (6/ 258) [المائدة: 83]."],[202,10],0],[797,"q","ابن تيمية","","« وما يحصل عند السماع والذكر المشروع من وجل القلب, ودمع العين, واقشعرار الجسوم, فهذا أفضل الأحوال التي نطق بها الكتاب والسنة. أما الاضطراب الشديد والغشي والموت والصيحات, فهذا إن كان صاحبه مغلوباً عليه لم يُلم عليه, كما قد يكون في التابعين ومن بعدهم, فإن منشأه قوة الوارد على القلب مع ضعف القلب والقوة »","وقال شيخ الإسلام رحمه الله:","","",["مجموع الفتاوى (22/ 522)."],[202],0],[798,"q","النووي","","« والصواب عدم الإنكار إلا على من اعترف أنه يفعله تصنعًا, والله أعلم »","وقال النووي رحمه الله:","","",["التبيان في آداب حملة القرآن (ص/ 77)."],[202],0],[799,"q","الطبري","","« وقوله … يقول تعالى ذكره: وأنَّ ربك هو أضحك أهل الجنة في الجنة بدخولهم إياها, وأبكى أهل النار في النار بِدُخُولِهِمُوهَا, وأضحك من شاء من أهل الدنيا, وأبكى من أراد أن يبكيه منهم »","قال الطبري رحمه الله:","","",["تفسير الطبري - جامع البيان (22/ 547) [النجم: 43]."],[256],0],[800,"q","الماوردي","","« فيه ثلاثة أوجه: أحدها: قضى أسباب الضحك والبكاء. الثاني: أنه أراد بالضحك السرور, وبالبكاء الحزن. الثالث: أنه خلق قوتي الضحك والبكاء, فإن الله ميز الإنسان بالضحك والبكاء من بين سائر الحيوان, فليس في سائر الحيوان ما ضحك ويبكي غير الإنسان, وقيل: إن القرد وحده يضحك ولا يبكي, وإن الإبل وحدها تبكي ولا تضحك. ويحتمل وجهاً. رابعاً: أن يريد بالضحك والبكاء النعم والنقم »","وقال الماوردي رحمه الله:","","",["تفسير الماوردي - النكت والعيون (5/ 404) [النجم: 43]."],[256],0],[801,"a","أحمد بن أبي الحواري","","« أفضلُ البكاء بكاءُ العبد على ما فاته من أوقاته على غير الموافقة, أو بكاءٌ على ما سبق له من المخالفة »","قال أحمد بن أبي الحواري رحمه الله:","","",["شعب الإيمان للبيهقي (1/ 509) رقم (870)."],[257],0],[802,"q","البدر الفيومي","","« سؤال: إن قيل كم ينقسم البكاء؟ قيل: البكاء على ثلاثة أوجه: من اللّه, وعلى اللّه, وإلى اللّه, فالبكاء من اللّه: هو من توبيخه وتهديده. والبكاء إليه: من شوقه ومحبته. والبكاء عليه: من خوف الفراق. ويقال: البكاء على عشرة وجوه: بكاء الحياء لآدم, ثم بكاء الذنوب لداود, وبكاء الحزن ليحيى, وبكاء الوحشة ليعقوب, وبكاء الشوق لشعيب؛ بكى حتى ذهب بصره مرتين. وبكاء الحزن للصحابة - رحمه الله - لقوله تعالى: الآية: التوبة: 92, ولقوله تعالى: الآية: المائدة: 83, وبكاء الخشة: الآية: الإسراء: 109, وبكاء الإجلال قوله: الآية: مريم: 58, والبكاء على الأموات. قاله ابن العماد في كتابه كشف الأسرار »","وقال البدر الفيومي رحمه الله:","","",["فتح القريب المجيب على الترغيب والترهيب للبدر الفيومي (10/ 564)."],[257],0],[803,"q","ابن القيم","","« والبكاء أنواع: أحدها: بكاء الرحمة والرِّقَّة. والثاني: بكاء الخوف والخشية. والثالث: بكاء المحبَّة والشَّوق. والرابع: بكاء الفرح والسُّرور. والخامس: بكاء الجزع من ورود المؤلم وعدم احتماله. والسادس: بكاء الحزن. والفرق بينه وبين بكاء الخوف: أن بكاء الحزن يكون على ما مضى من حصول مكروه أو فوات محبوب, وبكاء الخوف يكون لما يتوقَّع في المستقبل من ذلك, والفرق بين بكاء السرور والفرح وبكاء الحزن: أن دمعة السرور باردة والقلب فرحان, ودمعة الحزن حارَّة, والقلب حزين؛ ولهذا يقال لما يُفرَح به: هو قُرَّة عين, وأقرَّ الله عينه به؛ ولما يُحزِن: هو سُخْنةُ عين, وأسخن الله عينه به. والسابع: بكاء الخوَر والضعف. والثامن: بكاء النفاق, وهو أن تدمع العين والقلب قاس, فيظهر صاحبه الخشوع وهو من أقسى الناس قلبًا. والتاسع: البكاء المستعار والمستأجَر عليه, كبكاء النائحة بالأجرة, فإنها كما قال عمر بن الخطاب رضي الله عنه: تبيع عبرتَها, وتبكي بشجو غيرها. والعاشر: بكاء الموافقة, وهو أن يرى الرجلُ الناسَ يبكون لأمرٍ ورد عليهم فيبكي معهم, ولا يدري لأيِّ شيء يبكون, ولكن رآهم يبكون, فبكى. وما كان من ذلك دمعًا بلا صوت فهو بُكًى - مقصور - وما كان معه صوت فهو بكاء - ممدود - على بناء الأصوات. قال الشاعر: بَكَتْ عَيْنِي وَحُقّ لَهَا بُكَاهَا … وَمَا يُغْنِي الْبُكَاءُ وَلاَ الْعَوِيلُ وما كان منه مُستدعًى مُتكلَّفًا فهو التباكي »","وقال ابن القيم رحمه الله:","","",["زاد المعاد (١/١٢٦)."],[257],0],[804,"q","الطبري","","« يقول تعالى ذكره لمشركي قريش: أفمن هذا القرآن أيها الناس تعجبون, أنْ نزلَ على محمد ﷺ, وتضحكون منه استهزاءً به, ولا تبكون مما فيه من الوعيد لأهل معاصي الله, وأنتم من أهل معاصيه … يقول: وأنتم لاهون عما فيه من العِبر والذكر, معرضون عن آياته »","قال الله تعالى: الآية: النجم: 59-61, قال الطبري رحمه الله:","","",["تفسير الطبري - جامع البيان (22/ 558) [النجم: 60]."],[258],0],[805,"h","النبي ﷺ","عائشة أم المؤمنين","«يا أمة محمد والله لو تعلمون ما أعلم لبكيتم كثيرًا ولضحكتم قليلًا»","عن عائشة رضي الله عنها, عن النبي ﷺ أنه قال:","صحيح","في الصحيحين أو أحدهما",["رواه البخاري (6631)."],[258],0],[806,"s","أبو الدرداء","","« لو تعلمون ما أعلم لخرجتم إلى الصعدات تبكون على أنفسكم, ولتركتم أموالكم لا حارس لها, ولا راجع إليها, إلا ما لا بد لكم منه, ولكن يغيب عن قلوبكم ذكر الآخرة, وحضَرَها الأمل فصارت الدنيا أملك بأعمالكم, وصرتم كالذين لا يعلمون »","وقال أبو الدرداء رضي الله عنه من قِبَلِ نفسه:","","",["الزهد لابن أبي الدنيا (ص/ 216)."],[258],0],[807,"a","ابن أبي مليكة","","« جلسنا إلى عبد الله بن عمرو رضي الله عنهما, في الحجر, فقال: ابكوا فإن لم تجدوا بكاء فتباكوا, لو تعلمون العلم لصلَّى أحدُكم حتى ينكسرَ ظهره ولبكى حتى ينقطعَ صوته »","وعن ابن أبي مليكة رحمه الله قال:","صحيح","صححه موقوفا الألباني في صحيح الترغيب والترهيب (3328)",["أخرجه الحاكم في المستدرك (4/ 622) رقم (8763)، وقال: هذا إسنادٌ صحيح على شرط الشيخين ولم يُخرجاه. وصححه موقوفًا الألباني في صحيح الترغيب والترهيب (3328)."],[258],0],[808,"a","إسحاق بن خلف","","« كان عمرو بن قيس رحمه الله: إذا نظر إلى أهل السوق بكى وقال: ما أغفل هؤلاء عما أعد لهم »","وعن إسحاق بن خلف رحمه الله قال:","","",["حلية الأولياء وطبقات الأصفياء (5/102)"],[258],0],[809,"a","أبو سليمان الداراني","","« لكل شيء علَم, وعلَم الخِذلان: تركُ البكاء من خشية الله »","وقال أبو سليمان الداراني رحمه الله:","","",["البداية والنهاية (10/ 279)."],[258],0],[810,"q","ابن القيم","","« ومتى أقحطت العين من البكاء من خشية الله تعالى فاعلَمْ أن قحطها من قسوة القلب, وأبعد القلوب من الله: القلب القاسي »","وقال ابن القيم رحمه الله:","","",["بدائع الفوائد (3/ 743)."],[258],0],[811,"q","الزجاج","","« قد بَيَّنَ اللَّهُ سُبْحَانَه أن الأنْبِيَاءَ كانوا إذَا سَمِعُوا بآيات اللَّه رحمه الله؛ سَجَدُوا وبَكَوْا مِنْ خَشْيَةِ اللَّهِ, و… جمع باكٍ, مثل شاهد وشُهود وقَاعِد وقُعُود, و… حال مُقَدَّرَة »","قال الزجاج رحمه الله:","","",["معاني القرآن وإعرابه للزجاج (3/ 335) [مريم: 58]."],[10],0],[812,"q","البغوي","","« قوله: …: جمع ساجد … جمع باكٍ, أخبر الله أن الأنبياء كانوا إذا سمعوا آيات الله سجدوا وبكَوا »","قال البغوي رحمه الله:","","",["تفسير البغوي (3/ 239) [مريم: 58]."],[10],0],[813,"q","الطبري","","« يقول تعالى ذكره: وإذا سمع هؤلاء الذين قالوا إنا نصارى الذين وصفتُ لك يا محمدُ صفَتَهم أنك تجدهم أقرب الناس مودة للذين آمنوا, ما أنزل إليك من الكتاب يتلى …, وفيض العين من الدمع: امتلاؤها منه ثم سيلانه منها كفيض النهر من الماء, وفيض الإناء, وذلك سيلانه عن شدة امتلائه, وقوله: … يقول: فيض دموعهم لمعرفتهم بأن الذي يتلى عليهم من كتاب الله الذي أنزله إلى رسول الله حق »","قال الطبري رحمه الله:","","",["تفسير الطبري - جامع البيان (8/ 601) [المائدة: 83]."],[10],0],[814,"a","عبد الله بن أبي سعيد السراج","","« كنا عند الحسن يومًا وهو يعظ, فانتحب رجل من ناحية المجلس, فقال الحسن: أيها الباكي اشدد, أو قال: احدد, فإنه بلغنا أن الباكي من خشية الله مرحوم يوم القيامة »","عن عبد الله بن أبي سعيد السراج رحمه الله, قال:","","",["رواه ابن أبي الدنيا في الرقة والبكاء رقم (١٦)."],[20],0],[815,"a","كعب الأحبار","","« لأن أبكي من خشية الله فتسيل دموعي على وجنتي أحب إليَّ من أن أتصدق بوزني ذهبًا »","وقال كعب الأحبار رحمه الله:","","",["حلية الأولياء وطبقات الأصفياء (5/ 366)."],[20],0],[816,"a","عبد الواحد بن زيد","","« يا إخوتاه! ألا تبكون شوقاً إلى الله؟ ألا إنه من بكى شوقاً إلى سيِّده لم يُحْرِمْهُ النَّظَرَ إليه. يا إخوتاه! ألا تبكون خوفًا من النار؟ ألا إنه من بكی خوفًا من النار أعاذه الله منها. يا إخوتاه! ألا تبكون خوفًا من العطش يوم القيامة؟ ألا إنه من بکی خوفًا من ذلك سُقي على رؤوس الخلائق يوم القيامة. يا إخوتاه! ألا تبكون؟ بلى فابكوا على الماء البارد أيام الدنيا؛ لعله أن يسقيكموه في حظائر القدس مع خير الندماء والأصحاب من النبيين والصديقين والشهداء والصالحين وحَسُن أولئك رفيقًا. ثم جعل يبكي حتى غُشي عليه »","وعن بكر بن مصاد رحمه الله, قال سمعت عبد الواحد بن زيد رحمه الله, يقول:","","",["حلية الأولياء (6/ 161)، وصفة الصفوة لابن الجوزي (3/322)، والرقة والبكاء رقم (26)."],[20],0],[817,"a","فرقد السبخي","","« قرأت في بعض الكتب أن العبد إذا بكى من خشية الله تحاتت عنه ذنوبه كيوم ولَدتُه أُمُّه, ولو أن عبدًا جاء بجبال الأرض ذنوبًا وآثامًا لَوسِعته الرحمة إذا بکی, وإن الباكي على الجنة لتشفع له الجنة إلى ربِّها فتقول: يا رب أدخله الجنة كما بکی عليَّ, وإن النار لتستجير له من ربِّها فتقول: يا رب أجره من النار كما استجارك مني وبكى خوفاً من دخولي »","وعن فرقد السبخي رحمه الله قال:","","",["وأخرجه ابن أبي الدنيا في الرقة والبكاء (41) وبمعناه في نوادر الأصول في أحاديث الرسول (2/ 200)."],[20],0],[818,"a","فرقد السبخي","","« قل للبكَّائين من خشية الله: أبشروا فإنكم أول من تنزل عليه الرحمة إذا نزلت »","وقال فرقد السبخي رحمه الله, قرأتُ في بعض الكتب:","","",["الرق والبكاء لابن أبي الدنيا (18)."],[20],0],[819,"q","الذهبي","","« فأعلى المقامات من كان بكَّاءً بالليل, بسَّامًا بالنهار »","وقال الذهبي رحمه ال
