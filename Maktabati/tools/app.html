<title>مكتبتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one reading column; sticky search bar; cards as index slips with a grade stripe on the start edge */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#1B2033; --muted:#5E6478; --line:#DCDFE8;
  --accent:#2E3F8F; --accent-soft:#E6E9F5;
  --sahih:#1E7A4C; --sahih-bg:#E3F2EA; --hasan:#9A6A0C; --hasan-bg:#F8EFD9; --daif:#B23A2E; --daif-bg:#F8E3E0;
  --hl:#FFE89A; --hl-ink:#1B2033;
  --f-text:"Amiri","Traditional Arabic","Noto Naskh Arabic",serif;
  --f-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141C; --surface:#1B1E2A; --ink:#E8EAF2; --muted:#9AA0B4; --line:#2C3042;
  --accent:#9DAEFF; --accent-soft:#252B47;
  --sahih:#6FD3A0; --sahih-bg:#16302A; --hasan:#E8BE62; --hasan-bg:#33291A; --daif:#F08C80; --daif-bg:#3A201E;
  --hl:#5B4A12; --hl-ink:#FFF4CC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141C; --surface:#1B1E2A; --ink:#E8EAF2; --muted:#9AA0B4; --line:#2C3042;
  --accent:#9DAEFF; --accent-soft:#252B47;
  --sahih:#6FD3A0; --sahih-bg:#16302A; --hasan:#E8BE62; --hasan-bg:#33291A; --daif:#F08C80; --daif-bg:#3A201E;
  --hl:#5B4A12; --hl-ink:#FFF4CC; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
header.top{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
header.top h1{font-family:var(--f-text);font-size:1.9rem;font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:.9rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1.1rem;padding:14px 16px 14px 44px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search button{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:6px 8px;border-radius:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.88rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip .n{opacity:.65;font-size:.8em;margin-inline-start:4px;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{font:inherit;font-size:.88rem;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;flex:1 1 150px;max-width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;padding-top:10px;gap:8px;flex-wrap:wrap}
.meta button{font:inherit;font-size:.85rem;border:0;background:none;color:var(--accent);cursor:pointer;padding:4px}
.list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.g-sahih{border-inline-start-color:var(--sahih)}.card.g-hasan{border-inline-start-color:var(--hasan)}.card.g-daif{border-inline-start-color:var(--daif)}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.84rem}
.kind{font-weight:600;color:var(--accent)}
.who{color:var(--muted)}
.badge{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px}
.b-sahih{background:var(--sahih-bg);color:var(--sahih)}.b-hasan{background:var(--hasan-bg);color:var(--hasan)}.b-daif{background:var(--daif-bg);color:var(--daif)}
.b-note{background:var(--accent-soft);color:var(--accent)}
.text{font-family:var(--f-text);font-size:1.28rem;line-height:1.95;margin:0;overflow-wrap:anywhere}
.text.clip{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 1px}
.more{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:.9rem}
.more h4{margin:0;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.more p{margin:0}
.more .intro{color:var(--muted);font-family:var(--f-text);font-size:1.05rem}
.loc{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.loc li{color:var(--ink)}
.loc li span{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.86rem;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn.flagged{background:var(--daif-bg);color:var(--daif);border-color:var(--daif)}
.btn:focus-visible,.chip:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.loadmore{margin:16px auto 0;display:block}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.9rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <h1>مكتبتي</h1>
    <p>مرجعي الخاص للأحاديث والآثار وأقوال العلماء الواردة في كتبي وأبحاثي، بتخريجها وأحكامها ومواضعها.</p>
  </header>

  <div class="bar">
    <div class="search">
      <input id="q" type="search" placeholder="اكتب طرفًا من حديث أو أثر أو اسم قائل…" autocomplete="off" aria-label="بحث">
      <button id="clear" aria-label="مسح البحث" hidden>✕</button>
    </div>
    <div class="chips" id="kinds" role="group" aria-label="نوع النص"></div>
    <div class="filters">
      <select id="book" aria-label="الكتاب"><option value="">كل الكتب</option></select>
      <select id="grade" aria-label="الحكم">
        <option value="">كل الأحكام</option>
        <option value="sahih">صحيح</option>
        <option value="hasan">حسن</option>
        <option value="daif">ضعيف</option>
      </select>
      <select id="speaker" aria-label="القائل"><option value="">كل القائلين</option></select>
      <select id="chapter" aria-label="الفصل أو الخطبة"><option value="">كل الفصول والخطب</option></select>
    </div>
  </div>

  <div class="meta"><span id="count"></span><span><button id="flags" hidden></button><button id="reset">إعادة الضبط</button></span></div>
  <div class="list" id="list"></div>
  <button class="btn loadmore" id="loadmore" hidden>عرض المزيد</button>
</div>

<script>
const DATA = /*DATA*/;
const KINDS = {h:"حديث مرفوع",s:"أثر صحابي",a:"أثر عن السلف",q:"قول عالم",n:"نقل",p:"شعر"};
const PATHS = DATA.paths;   // [رقم الكتاب، العنوان الأعلى، …]
const BOOKS = DATA.books;
const cards = DATA.cards.map(r => ({id:r[0],k:r[1],s:r[2],n:r[3],t:r[4],i:r[5],g:r[6],h:r[7],src:r[8],loc:r[9],rw:r[10]}));

// تطبيع عربي: يتجاهل التشكيل والتطويل ويوحّد الهمزات والتاء والألف
const DIAC = /[ً-ٰٟـۖ-ۭ]/g;
function norm(s){
  return (s||"").replace(DIAC,"").replace(/[إأآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
    .replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[^ء-ي0-9\s]/g," ").replace(/\s+/g," ").trim();
}
function gradeKey(g){ if(!g) return ""; if(g.startsWith("ضعيف")) return "daif"; if(g.startsWith("حسن")) return "hasan"; return "sahih"; }
cards.forEach(c => {
  c.gk = gradeKey(c.g);
  c.idx = norm([c.t, c.s, c.n, c.i, c.src.join(" ")].join(" "));
  c.bk = new Set(c.loc.map(i => PATHS[i][0]));
  c.chs = new Set(c.loc.map(i => PATHS[i][0] + "|" + (PATHS[i][1] || "")));
});

// رابط إبراز يسمح بالتشكيل بين الحروف
const VAR = {"ا":"[اإأآٱ]","ه":"[هة]","ي":"[يىئ]","و":"[وؤ]"};
function hlRegex(tokens){
  const parts = tokens.filter(t => t.length > 1).map(t =>
    [...t].map(ch => (VAR[ch] || ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")) + "[\\u064B-\\u065F\\u0670\\u0640]*").join(""));
  return parts.length ? new RegExp("(" + parts.join("|") + ")", "g") : null;
}
function esc(s){ return (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function hl(s, re){ const e = esc(s); return re ? e.replace(re, "<mark>$1</mark>") : e; }

// حالة
const $ = id => document.getElementById(id);
const state = {q:"", kind:"", book:"", grade:"", speaker:"", chapter:"", shown:30, open:new Set()};
let flagged = new Set();
try { flagged = new Set(JSON.parse(localStorage.getItem("flags") || "[]")); } catch(e) {}
function saveFlags(){ try { localStorage.setItem("flags", JSON.stringify([...flagged])); } catch(e) {} updateFlags(); }

// بناء الفلاتر
const kc = {}; cards.forEach(c => kc[c.k] = (kc[c.k]||0) + 1);
$("kinds").innerHTML = `<button class="chip" data-k="" aria-pressed="true">الكل<span class="n">${cards.length}</span></button>` +
  Object.keys(KINDS).filter(k => kc[k]).map(k => `<button class="chip" data-k="${k}" aria-pressed="false">${KINDS[k]}<span class="n">${kc[k]}</span></button>`).join("");
const sc = {}; cards.forEach(c => { if(c.s && c.k !== "h") sc[c.s] = (sc[c.s]||0) + 1; });
$("speaker").innerHTML += Object.entries(sc).filter(([,n]) => n >= 2).sort((a,b) => b[1]-a[1])
  .map(([s,n]) => `<option value="${esc(s)}">${esc(s)} (${n})</option>`).join("");
const bc = {}; cards.forEach(c => c.bk.forEach(b => bc[b] = (bc[b]||0) + 1));
$("book").innerHTML += BOOKS.map((b,i) => `<option value="${i}">${esc(b.t)} (${bc[i]||0})</option>`).join("");
function fillChapters(){
  const sel = state.book === "" ? null : +state.book;
  const seen = new Map();
  PATHS.forEach(p => { if(p[1] && (sel === null || p[0] === sel)) { const k = p[0] + "|" + p[1]; if(!seen.has(k)) seen.set(k, p); } });
  const groups = {};
  seen.forEach((p,k) => (groups[p[0]] = groups[p[0]] || []).push([k, p[1]]));
  $("chapter").innerHTML = `<option value="">كل الفصول والخطب</option>` + Object.entries(groups).map(([b, list]) =>
    `<optgroup label="${esc(BOOKS[b].t)}">` + list.map(([k,t]) => `<option value="${esc(k)}">${esc(t.length > 60 ? t.slice(0,58) + "…" : t)}</option>`).join("") + `</optgroup>`).join("");
  $("chapter").value = state.chapter;
}

function filtered(){
  const toks = norm(state.q).split(" ").filter(Boolean);
  return cards.filter(c =>
    (!state.kind || c.k === state.kind) &&
    (!state.grade || c.gk === state.grade) &&
    (!state.speaker || c.s === state.speaker) &&
    (state.book === "" || c.bk.has(+state.book)) &&
    (!state.chapter || c.chs.has(state.chapter)) &&
    toks.every(t => c.idx.includes(t)));
}

function cardHTML(c, re){
  const open = state.open.has(c.id);
  const who = c.k === "h" ? (c.n ? `عن ${esc(c.n)}` : "") : esc(c.s);
  const badge = c.g ? `<span class="badge b-${c.gk}">${esc(c.g)}</span>` : "";
  const rw = c.rw ? `<span class="badge b-note">بصيغة «رُوي»</span>` : "";
  const locs = c.loc.map(i => { const p = PATHS[i]; return `<li><b>${esc(BOOKS[p[0]].t)}</b><br>${esc(p.slice(1).join(" ← "))}</li>`; }).join("");
  return `<article class="card ${c.gk ? "g-"+c.gk : ""}" data-id="${c.id}">
    <div class="head"><span class="kind">${KINDS[c.k]}</span>${who ? `<span class="who">· ${hl(who.replace(/&amp;/g,"&"), re)}</span>` : ""}${badge}${rw}</div>
    <p class="text ${open ? "" : "clip"}">${hl(c.t, re)}</p>
    ${open ? `<div class="more">
      ${c.i ? `<div><h4>السياق في الكتاب</h4><p class="intro">${hl(c.i, re)}</p></div>` : ""}
      <div><h4>التخريج والمصدر</h4>${c.src.map(s => `<p>${hl(s, re)}</p>`).join("")}</div>
      <div><h4>${c.loc.length > 1 ? `ورد في ${c.loc.length} مواضع${c.bk.size > 1 ? ` من ${c.bk.size} كتب` : ""}` : "الموضع"}</h4><ul class="loc">${locs}</ul></div>
    </div>` : ""}
    <div class="actions">
      <button class="btn" data-act="toggle">${open ? "إخفاء التفاصيل" : "التخريج والموضع"}</button>
      <button class="btn primary" data-act="copy">نسخ مع التخريج</button>
      <button class="btn ${flagged.has(c.id) ? "flagged" : ""}" data-act="flag" aria-pressed="${flagged.has(c.id)}">${flagged.has(c.id) ? "مُعلَّمة للمراجعة" : "فيها خطأ"}</button>
    </div>
  </article>`;
}

let current = [];
function render(){
  current = filtered();
  const re = hlRegex(norm(state.q).split(" ").filter(Boolean));
  $("count").textContent = current.length === cards.length ? `${cards.length} نصًّا` : `${current.length} نتيجة من ${cards.length}`;
  $("list").innerHTML = current.length ? current.slice(0, state.shown).map(c => cardHTML(c, re)).join("")
    : `<div class="empty">لا نتائج. جرّب كلمة أقصر أو أزل أحد الفلاتر.</div>`;
  $("loadmore").hidden = current.length <= state.shown;
  $("clear").hidden = !state.q;
}
function updateFlags(){ const b = $("flags"); b.hidden = !flagged.size; b.textContent = `نسخ أرقام المُعلَّمة (${flagged.size})`; }

let tmr;
$("q").addEventListener("input", e => { clearTimeout(tmr); tmr = setTimeout(() => { state.q = e.target.value; state.shown = 30; render(); }, 120); });
$("clear").onclick = () => { $("q").value = ""; state.q = ""; render(); $("q").focus(); };
$("kinds").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  state.kind = b.dataset.k; state.shown = 30;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
["grade","speaker","chapter"].forEach(id => $(id).addEventListener("change", e => { state[id] = e.target.value; state.shown = 30; render(); }));
$("book").addEventListener("change", e => { state.book = e.target.value; state.chapter = ""; state.shown = 30; fillChapters(); render(); });
$("reset").onclick = () => { Object.assign(state, {q:"",kind:"",book:"",grade:"",speaker:"",chapter:"",shown:30}); $("q").value=""; ["book","grade","speaker"].forEach(id => $(id).value = ""); fillChapters(); document.querySelectorAll(".chip").forEach((x,i) => x.setAttribute("aria-pressed", i===0)); render(); };
$("loadmore").onclick = () => { state.shown += 30; render(); };

function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
async function copy(txt){
  try { await navigator.clipboard.writeText(txt); toast("نُسخ"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("نُسخ"); }catch(_){ toast("تعذّر النسخ، حدّد النص يدويًّا"); } ta.remove(); }
}
function citation(c){
  const lead = c.k === "h" ? (c.n ? `عن ${c.n}، عن النبي ﷺ:` : "قال النبي ﷺ:") : (c.s ? `قال ${c.s}:` : "");
  return `${lead} ${c.t}\n\n(${c.src.join(" ")})`.trim();
}
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const id = +b.closest(".card").dataset.id; const c = cards.find(x => x.id === id);
  if(b.dataset.act === "toggle"){ state.open.has(id) ? state.open.delete(id) : state.open.add(id); render(); }
  if(b.dataset.act === "copy") copy(citation(c));
  if(b.dataset.act === "flag"){ flagged.has(id) ? flagged.delete(id) : flagged.add(id); saveFlags(); render(); }
});
$("flags").onclick = () => copy("بطاقات فيها خطأ: " + [...flagged].sort((a,b)=>a-b).join("، "));
fillChapters();
updateFlags();
render();
</script>
